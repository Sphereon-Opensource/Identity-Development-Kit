# Gradle JVM args: leave heap/metaspace at Gradle defaults.
# Users who need more can set org.gradle.jvmargs in ~/.gradle/gradle.properties.
org.gradle.jvmargs=-Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.parallel=true
org.gradle.daemon=true
org.gradle.daemon.idletimeout=7200000
org.gradle.parallel=true
org.gradle.vfs.watch=true
kotlin.incremental=true
kotlin.stdlib.default.dependency=true
kotlin.ignore.tcsm.overflow=true
kotlin.version=2.4.20-RC
# Metro contribution providers keep contributed implementations internal while exposing bound interfaces.
metro.generateContributionProviders=true
kotlinLanguageVersion=2.4

#Kotlin
kotlin.code.style=official
kotlin.compiler.execution.strategy=daemon

# KMP target selection — all targets by default for standalone IDK builds.
#
# This value also wins inside the VDX-Infra composite: an included build's systemProp is applied
# to the daemon after the root's, so VDX-Infra's `systemProp.kmp.targets=jvm` does NOT take
# precedence (verified with `outgoingVariants` on a backend module under --no-daemon). Backend
# modules then get a linuxX64 target whose JVM-only dependencies cannot satisfy it, and the
# composite fails to configure. Until that is resolved, build VDX-Infra with an explicit
# `-Dkmp.targets=jvm`, which is a real command-line system property and does outrank this.
#
# Override: ./gradlew build -Dkmp.targets=jvm (or jvm,js,ios,wasmJs,native,all)
systemProp.kmp.targets=all

#MPP
kotlin.mpp.enableCInteropCommonization=true
#Android
android.useAndroidX=true
android.nonTransitiveRClass=true
ksp.useKSP2=true
kotlin.native.enableKlibsCrossCompilation=false
kotlin.js.yarn=false
version=0.25.0-SNAPSHOT
gbsVersion=0.9.0-SNAPSHOT

#Dokka
org.jetbrains.dokka.experimental.gradle.pluginMode=V2Enabled
kotlinx.atomicfu.enableJvmIrTransformation=true
kotlin.incremental.js=false
kotlin.incremental.js.klib=false
kotlin.native.ignoreDisabledTargets=true
