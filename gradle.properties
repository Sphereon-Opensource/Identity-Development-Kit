# Gradle heap — standalone IDK (~135 modules). 8GB minimum.
# Workers, kotlin daemon, and ForkJoinPool are auto-detected in settings.gradle.kts.
org.gradle.jvmargs=-Xmx10192M -XX:+UseZGC -XX:+ZGenerational -XX:MaxMetaspaceSize=1324m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.parallel=true
org.gradle.daemon=true
org.gradle.daemon.idletimeout=7200000
org.gradle.parallel=true
org.gradle.vfs.watch=true
kotlin.incremental=true
kotlin.stdlib.default.dependency=true
kotlin.version=2.3.21-RC
kotlinLanguageVersion=2.2

#Kotlin
kotlin.code.style=official
kotlin.compiler.execution.strategy=daemon

# KMP target selection — all targets by default for standalone IDK builds.
# When included as composite from VDX-Infra, the root's systemProp.kmp.targets=jvm takes precedence.
# Override: ./gradlew build -Dkmp.targets=jvm (or jvm,js,ios,wasmJs,native,all)
systemProp.kmp.targets=all

#MPP
kotlin.mpp.enableCInteropCommonization=true
kotlin.mpp.androidSourceSetLayoutVersion=2
#Android
android.useAndroidX=true
android.nonTransitiveRClass=true
force.legacy.variant.api=true
ksp.useKSP2=true
kotlin.native.enableKlibsCrossCompilation=false
kotlin.js.yarn=false
version=0.25.0-SNAPSHOT
gbsVersion=0.8.0-SNAPSHOT

#Dokka
org.jetbrains.dokka.experimental.gradle.pluginMode=V2Enabled
kotlinx.atomicfu.enableJvmIrTransformation=true
kotlin.incremental.js=false
kotlin.incremental.js.klib=false
kotlin.native.ignoreDisabledTargets=true
# Run Konan linker out-of-process so parallel linkDebug*Test tasks don't all compete
# for the Gradle daemon heap (was OOM'ing on parallel linkDebugTestLinuxX64 runs).
# Konan heap (kotlin.native.jvmArgs) is auto-tuned in settings.gradle.kts based on RAM.
kotlin.native.toolExecutionInProcess=false

