name: Public CI

# Runs on the public IDK repo only — single-job multiplatform build that, on
# pushes to develop/main, also publishes to npm/Nexus in the same Gradle
# invocation.
#
# Why one job: Gradle's `publish` task pulls in compile/assemble for every
# target, so multiplatform-build and publish are the same work. Splitting them
# into separate jobs forces a fresh runner, cold Gradle daemon, KSP/Metro
# re-init, and dependency re-resolution per job (≈5–10 min lost per boundary).
# JVM tests already passed on the private repo before mirror, so we skip them
# here entirely.
#
# This file is mirrored to the private repo too; the top-level repository gate
# makes it a no-op there.

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: "-Dkotlin.native.ignoreDisabledTargets=true -Dfile.encoding=UTF-8"

# Pipeline:
#   PR / push develop / push main → jvm → multiplatform
#   push develop / push main      → ... → publish

jobs:
  build:
    name: Multiplatform Build${{ github.event_name == 'push' && ' & Publish' || '' }}
    if: github.repository == 'Sphereon-Opensource/Identity-Development-Kit'
    runs-on: linux-x64
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - run: chmod +x ./gradlew

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
          gradle-home-cache-includes: |
            caches
            notifications
            build-cache-1

      # Generate TOML version catalogs from gradle-build-support source so the
      # main settings.gradle.kts can resolve sphereonlib.* / sphereonplug.*
      # accessors against current entries (e.g. com.doist.x:normalize) instead
      # of falling back to the stale published library-bom artifact.
      - name: Generate Sphereon TOML catalogs
        working-directory: gradle-build-support
        run: ./gradlew generateTomlCatalog --build-cache

      # ── Android SDK ──
      - name: Cache Android SDK
        id: android-sdk-cache
        uses: actions/cache@v4
        with:
          path: ~/android-sdk
          key: android-sdk-${{ runner.os }}-cmdline-9477386-platforms-35-buildtools-35.0.0

      - name: Install Android SDK
        if: steps.android-sdk-cache.outputs.cache-hit != 'true'
        run: |
          set -eux
          SDK_ROOT="$HOME/android-sdk"
          mkdir -p "$SDK_ROOT/cmdline-tools"
          cd /tmp
          curl -fSL "https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip" -o cmdline-tools.zip
          unzip -q cmdline-tools.zip -d "$SDK_ROOT/cmdline-tools"
          mkdir -p "$SDK_ROOT/cmdline-tools/latest"
          mv "$SDK_ROOT/cmdline-tools/cmdline-tools/"* "$SDK_ROOT/cmdline-tools/latest/" || true
          export ANDROID_SDK_ROOT="$SDK_ROOT"
          (yes || true) | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_SDK_ROOT" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
        shell: bash

      - name: Set Android SDK location
        run: echo "sdk.dir=$HOME/android-sdk" > local.properties

      # ── JS / wasmJs caches ──
      - name: Cache Kotlin/JS store
        uses: actions/cache@v4
        with:
          path: |
            kotlin-js-store
            ~/.npm
          key: kotlin-js-${{ runner.os }}-${{ hashFiles('kotlin-js-store/package-lock.json', 'kotlin-js-store/wasm/package-lock.json') }}
          restore-keys: kotlin-js-${{ runner.os }}-

      - name: Upgrade JS/wasmJs lock files
        run: ./gradlew kotlinUpgradePackageLock kotlinWasmUpgradePackageLock --stacktrace

      # ── Single Gradle invocation: build + non-JVM tests + (on push) publish ──
      # `check` runs every target's tests; we exclude JVM-side tests because
      # they already passed on the private repo, but JS / wasmJs / Android / native
      # tests run here — they exercise target-specific codegen and runtime
      # behavior that the JVM tests can't cover.
      # `publish` reaches every multiplatform `publishXxxPublicationToYyy` task
      # and depends on assemble; combining `check` and `publish` in one command
      # reuses the same Gradle daemon for compile, test, and publish.
      - name: ${{ github.event_name == 'push' && 'Build, test & publish' || 'Build & test' }} (all targets, excl. jvmTest)
        run: >-
          ./gradlew check
          ${{ github.event_name == 'push' && 'publish' || '' }}
          --build-cache
          -Dkmp.targets=all
          -x jvmTest
          -x koverVerify
          -x :lib-crypto-kms-provider-aws:kotest
          -x :lib-crypto-kms-provider-azure:kotest
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}

      - name: Print failure context
        if: failure()
        run: |
          find . -name "index.html" -path "*/build/reports/tests/*" \
            -exec echo "=== {} ===" \; -exec sed -n '1,100p' {} \;

