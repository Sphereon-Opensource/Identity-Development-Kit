name: Public CI

# Runs on the public IDK repo only. One job builds pack production artifacts,
# runs multiplatform checks and publishes after main/develop pushes or authorized dispatch
# or an explicit approved owning-repository dispatch.
# Pack builds share job-private Maven prerequisites and Gradle compilation caches.
# JVM tests already passed on the private repo before mirror, so we skip them
# here entirely.
#
# This file is mirrored to the private repo too; the top-level repository gate
# makes it a no-op there.

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish verified pack artifacts from an authorized branch
        type: boolean
        required: true
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: "-Dkotlin.native.ignoreDisabledTargets=true -Dfile.encoding=UTF-8"

# Pipeline: pack Maven prerequisites → multiplatform checks → authorized publication.

jobs:
  build:
    name: Multiplatform Build${{ github.event_name == 'push' && ' & Publish' || '' }}
    if: github.repository == 'Sphereon-Opensource/Identity-Development-Kit'
    runs-on: linux-x64
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - run: chmod +x ./gradlew

      # Kotlin/Native LinuxX64 linking (ld.lld) resolves -lunistring against the
      # system, but the runner image doesn't ship it. Without this the native
      # link step fails with `ld.lld: error: unable to find library -lunistring`.
      - name: Install native link dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libunistring-dev
        shell: bash

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
          gradle-home-cache-includes: |
            caches
            notifications
            build-cache-1

      # GBS plugins and catalogs resolve from published Maven artifacts.
      # This workflow runs from the standalone product checkout.

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Verify pack CI plan
        run: python3 -B -m unittest discover -s .github/scripts -p test_pack_ci.py -v

      # ── Android SDK ──
      - name: Cache Android SDK
        id: android-sdk-cache
        uses: actions/cache@v4
        with:
          path: ~/android-sdk
          key: android-sdk-${{ runner.os }}-cmdline-9477386-platforms-35-buildtools-35.0.0

      - name: Install Android SDK
        if: steps.android-sdk-cache.outputs.cache-hit != 'true'
        run: |
          set -eux
          SDK_ROOT="$HOME/android-sdk"
          mkdir -p "$SDK_ROOT/cmdline-tools"
          cd /tmp
          curl -fSL "https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip" -o cmdline-tools.zip
          unzip -q cmdline-tools.zip -d "$SDK_ROOT/cmdline-tools"
          mkdir -p "$SDK_ROOT/cmdline-tools/latest"
          mv "$SDK_ROOT/cmdline-tools/cmdline-tools/"* "$SDK_ROOT/cmdline-tools/latest/" || true
          export ANDROID_SDK_ROOT="$SDK_ROOT"
          (yes || true) | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_SDK_ROOT" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
        shell: bash

      - name: Set Android SDK location
        # Each pack has its own Gradle root; share the installed SDK through the
        # environment as well as the root example build's local.properties.
        run: |
          echo "sdk.dir=$HOME/android-sdk" > local.properties
          echo "ANDROID_HOME=$HOME/android-sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> "$GITHUB_ENV"

      # ── JS / wasmJs caches ──
      - name: Cache Kotlin/JS store
        uses: actions/cache@v4
        with:
          path: |
            kotlin-js-store
            core/kotlin-js-store
            infra/kotlin-js-store
            identity-security/kotlin-js-store
            protocols/kotlin-js-store
            platform/kotlin-js-store
            wallet-lib/kotlin-js-store
            ~/.npm
          key: kotlin-js-${{ runner.os }}-${{ hashFiles('**/kotlin-js-store/package-lock.json', '**/kotlin-js-store/wasm/package-lock.json') }}
          restore-keys: kotlin-js-${{ runner.os }}-

      # Pack production builds populate a job-private Maven repository first.
      # Checks run after every pack is available, including reverse test edges.
      # Main/develop pushes or the explicit default-false dispatch enable publication.
      - name: ${{ (github.event_name == 'push' || inputs.publish) && 'Build, test & publish' || 'Build & test' }} (all targets, excl. jvmTest)
        run: >-
          python3 -B .github/scripts/pack_ci.py --mode public
          ${{ (github.event_name == 'push' || inputs.publish) && '--publish' || '' }}
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}

      # Gradle prints only the exception type of a failing JS or native test; the result files carry the stack traces.
      - name: Archive failed test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/build/test-results/**/*.xml'
          if-no-files-found: ignore
          retention-days: 7
