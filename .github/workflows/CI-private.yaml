name: Private CI

# Runs on the private IDK repo only — fast JVM-only verification on PRs.
# The mirror workflow forwards merged commits to the public repo, where
# CI-public.yaml runs the full multiplatform build + publish.
#
# This file is mirrored to the public repo too (it ships in the tree); the
# top-level repository gate makes it a no-op there.

on:
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish verified Maven prerequisites without npm or source mirroring
        type: boolean
        required: true
        default: false
      remote_only:
        description: Verify actual remote dependencies without Maven local or job-private artifacts
        type: boolean
        required: true
        default: false

      snapshot_prerequisites_only:
        description: Publish checked SNAPSHOT packs; full remote consumer acceptance follows after owning wallet prerequisites
        type: boolean
        required: true
        default: false
      publish_modules:
        description: Optional comma-separated owning Maven modules; requires checked SNAPSHOT publication mode
        type: string
        required: false
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: "-Dkotlin.native.ignoreDisabledTargets=true -Dfile.encoding=UTF-8"

jobs:
  jvm:
    name: JVM Build & Test
    if: github.repository == 'Sphereon-Opensource/Identity-Development-Kit-private'
#    runs-on: ubuntu-latest
    runs-on: linux-x64
    # Initial checked SNAPSHOT uploads exceed the ordinary verification budget.
    timeout-minutes: ${{ inputs.snapshot_prerequisites_only && 60 || 30 }}
    steps:
      - uses: actions/checkout@v4
      - run: chmod +x ./gradlew

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
          gradle-home-cache-includes: |
            caches
            notifications
            build-cache-1

      # GBS plugins and catalogs resolve from published Maven artifacts.
      # This workflow runs from the standalone product checkout.

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Verify pack CI plan
        run: python3 -B -m unittest discover -s .github/scripts -p test_pack_ci.py -v

      - name: Build & test (JVM only)
        run: >-
          python3 -B .github/scripts/pack_ci.py --mode private
          ${{ inputs.publish && '--publish' || '' }}
          ${{ inputs.remote_only && '--remote-only' || '' }}
          ${{ inputs.snapshot_prerequisites_only && '--snapshot-prerequisites-only' || '' }}
          --publish-modules "$IDK_PUBLISH_MODULES"
        env:
          IDK_PUBLISH_MODULES: ${{ inputs.publish_modules }}
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}

      - name: Print test failures
        if: failure()
        run: |
          find . -path "*/build/reports/tests/jvmTest/*.html" -name "index.html" \
            -exec echo "=== {} ===" \; -exec sed -n '1,100p' {} \;

      - name: Archive JUnit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: idk-junit-results
          path: '**/build/test-results/**/*.xml'
          if-no-files-found: warn
