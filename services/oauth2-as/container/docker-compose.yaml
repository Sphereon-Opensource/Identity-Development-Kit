services:
  oauth2-as:
    image: sphereon/idk-oauth2-as:latest
    build:
      context: ../../..
      dockerfile: services/oauth2-as/container/Dockerfile
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1536M
        reservations:
          cpus: '0.5'
          memory: 768M
    ports:
      - "8080:8080"
    env_file:
      - .env
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - idk_network

networks:
  idk_network:
    driver: bridge
