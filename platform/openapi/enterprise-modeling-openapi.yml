        labels: { type: array, minItems: 1, items: { $ref: '#/components/schemas/LocalizedText' } }
        specializesEntityName: { type: string }
        attributes: { type: array, default: [], items: { $ref: '#/components/schemas/GuidedAttribute' } }
        identifiers: { type: array, default: [], items: { $ref: '#/components/schemas/GuidedAttribute' } }
        roles: { type: array, default: [], items: { $ref: '#/components/schemas/GovernedTypeId' } }
        examples: { type: array, default: [], items: { $ref: '#/components/schemas/JsonObject' } }
    GuidedRelationship:
      type: object
      required: [name, relationshipType, sourceEntityName, targetEntityName, labels]
      properties:
        name: { type: string }
        relationshipType: { $ref: '#/components/schemas/GovernedTypeId' }
        sourceEntityName: { type: string }
        targetEntityName: { type: string }
        sourceRole: { $ref: '#/components/schemas/GovernedTypeId' }
        targetRole: { $ref: '#/components/schemas/GovernedTypeId' }
        labels: { type: array, minItems: 1, items: { $ref: '#/components/schemas/LocalizedText' } }
        constraints: { type: array, default: [], items: { $ref: '#/components/schemas/GuidedConstraint' } }
    GuidedSemanticModelInput:
      type: object
      required: [modelName, entities]
      properties:
        modelName: { type: string }
        namespaceHint: { type: string }
        entities: { type: array, minItems: 1, items: { $ref: '#/components/schemas/GuidedEntity' } }
        relationships: { type: array, default: [], items: { $ref: '#/components/schemas/GuidedRelationship' } }
    SemanticInterchangeDocument:
      type: object
