openapi: 3.0.4
info:
  title: Enterprise Modeling API
  version: 0.2.0
  description: Guided and expert semantic authoring over one governed RDF and OCA model.
servers:
  - url: https://api.example.com/api/modeling/v1
  - url: http://localhost:8080/api/modeling/v1
security:
  - bearer: []
tags:
  - name: EnterpriseModeling
paths:
  /changes:preview:
    post:
      tags: [EnterpriseModeling]
      operationId: previewSemanticChange
      x-command-id: modeling.change.preview
      summary: Normalize and validate a guided or expert semantic change
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PreviewSemanticChangeRequest' }
      responses:
        '200': { $ref: '#/components/responses/SemanticChangePreviewResponse' }
        '400': { $ref: './common-components.yml#/components/responses/ValidationError' }
        '401': { $ref: './common-components.yml#/components/responses/Unauthorized' }
        '403': { $ref: './common-components.yml#/components/responses/Forbidden' }
        '409': { $ref: './common-components.yml#/components/responses/Conflict' }
  /changes:apply:
    post:
      tags: [EnterpriseModeling]
      operationId: applySemanticChange
      x-command-id: modeling.change.apply
      summary: Apply an approved preview to a new draft revision
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApplySemanticChangeRequest' }
      responses:
        '200': { $ref: '#/components/responses/SemanticDraftResponse' }
        '400': { $ref: './common-components.yml#/components/responses/ValidationError' }
        '401': { $ref: './common-components.yml#/components/responses/Unauthorized' }
        '403': { $ref: './common-components.yml#/components/responses/Forbidden' }
        '409': { $ref: './common-components.yml#/components/responses/Conflict' }
  /models/{modelId}/revisions/{revision}/guided:
    get:
      tags: [EnterpriseModeling]
      operationId: getGuidedSemanticProjection
      x-command-id: modeling.projection.guided
      summary: Read a business-language projection without RDF or OCA syntax
      parameters:
        - $ref: '#/components/parameters/ModelId'
        - $ref: '#/components/parameters/SemanticRevision'
      responses:
        '200':
          description: Guided projection.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GuidedSemanticProjection' }
        '401': { $ref: './common-components.yml#/components/responses/Unauthorized' }
        '403': { $ref: './common-components.yml#/components/responses/Forbidden' }
        '404': { $ref: './common-components.yml#/components/responses/NotFound' }
  /models/{modelId}/revisions/{revision}/expert:
    get:
      tags: [EnterpriseModeling]
      operationId: getExpertSemanticProjection
      x-command-id: modeling.projection.expert
      summary: Read RDF, Turtle, OCA, mappings, namespaces, and installed constraints
      parameters:
        - $ref: '#/components/parameters/ModelId'
        - $ref: '#/components/parameters/SemanticRevision'
      responses:
        '200':
          description: Expert projection.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExpertSemanticProjection' }
        '401': { $ref: './common-components.yml#/components/responses/Unauthorized' }
        '403': { $ref: './common-components.yml#/components/responses/Forbidden' }
        '404': { $ref: './common-components.yml#/components/responses/NotFound' }
  /capabilities:
    get:
      tags: [EnterpriseModeling]
      operationId: getSemanticCapabilities
      x-command-id: modeling.capability.get
      summary: Report only installed semantic interchange processors
      responses:
        '200':
          description: Installed capabilities and resource limits.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SemanticCapabilityCatalog' }
        '401': { $ref: './common-components.yml#/components/responses/Unauthorized' }
        '403': { $ref: './common-components.yml#/components/responses/Forbidden' }
  /interchange:validate:
    post:
      tags: [EnterpriseModeling]
      operationId: validateSemanticInterchange
      x-command-id: modeling.interchange.validate
      summary: Validate bounded semantic interchange input
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ValidateSemanticInterchangeRequest' }
      responses:
        '200':
          description: Plain-language and technical diagnostics.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SemanticValidationResult' }
        '400': { $ref: './common-components.yml#/components/responses/ValidationError' }
        '401': { $ref: './common-components.yml#/components/responses/Unauthorized' }
        '403': { $ref: './common-components.yml#/components/responses/Forbidden' }
        '413': { description: Interchange input exceeds an installed resource limit. }
  /imports:preview:
    post:
      tags: [EnterpriseModeling]
      operationId: previewSemanticImport
      x-command-id: modeling.import.preview
      summary: Normalize an import into the shared typed change-set model
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PreviewSemanticImportRequest' }
      responses:
        '200':
          description: Import preview, conflicts, losses, and parser provenance.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SemanticImportPreview' }
        '400': { $ref: './common-components.yml#/components/responses/ValidationError' }
        '401': { $ref: './common-components.yml#/components/responses/Unauthorized' }
        '403': { $ref: './common-components.yml#/components/responses/Forbidden' }
        '409': { $ref: './common-components.yml#/components/responses/Conflict' }
  /imports:apply:
    post:
      tags: [EnterpriseModeling]
      operationId: applySemanticImport
      x-command-id: modeling.import.apply
      summary: Apply an approved import preview to a new draft revision
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApplySemanticImportRequest' }
      responses:
        '200': { $ref: '#/components/responses/SemanticDraftResponse' }
        '400': { $ref: './common-components.yml#/components/responses/ValidationError' }
        '401': { $ref: './common-components.yml#/components/responses/Unauthorized' }
        '403': { $ref: './common-components.yml#/components/responses/Forbidden' }
        '409': { $ref: './common-components.yml#/components/responses/Conflict' }
  /releases:export:
    post:
      tags: [EnterpriseModeling]
      operationId: exportSemanticRelease
      x-command-id: modeling.release.export
      summary: Export a pinned RDF and OCA semantic release
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExportSemanticReleaseRequest' }
      responses:
        '200':
          description: Release manifest with RDF hashes, OCA SAIDs, mappings, and projector revisions.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SemanticExportReceipt' }
        '400': { $ref: './common-components.yml#/components/responses/ValidationError' }
        '401': { $ref: './common-components.yml#/components/responses/Unauthorized' }
        '403': { $ref: './common-components.yml#/components/responses/Forbidden' }
        '404': { $ref: './common-components.yml#/components/responses/NotFound' }
  /models/{modelId}/policy-bindings:preview:
    post:
      tags: [EnterpriseModeling]
      summary: Preview policy binding
      operationId: previewPolicyBinding
      x-command-id: modeling.policy-binding.preview
      parameters:
        - { $ref: '#/components/parameters/ModelId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/IfMatch' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PolicyBinding' }
      responses:
        '200': { $ref: '#/components/responses/SemanticChangePreviewResponse' }
        '400': { $ref: './common-components.yml#/components/responses/ValidationError' }
        '401': { $ref: './common-components.yml#/components/responses/Unauthorized' }
        '403': { $ref: './common-components.yml#/components/responses/Forbidden' }
        '409': { $ref: './common-components.yml#/components/responses/Conflict' }
  /sources:import:
    post:
      tags: [EnterpriseModeling]
      operationId: importLegalSource
      x-command-id: modeling.source-snapshot.import
      summary: Import Legal Source
      parameters:
        - { $ref: '#/components/parameters/ModelIdQuery' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/IfMatch' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ImportLegalSourceRequest' }
      responses:
        '200':
          description: Successful importLegalSource result.
          content:
            application/json:
              schema: { $ref: './enterprise-contract-components.yml#/components/schemas/LegalSourceSnapshot' }
        '400': { $ref: './common-components.yml#/components/responses/ValidationError' }
        '401': { $ref: './common-components.yml#/components/responses/Unauthorized' }
        '403': { $ref: './common-components.yml#/components/responses/Forbidden' }
        '404': { $ref: './common-components.yml#/components/responses/NotFound' }
        '409': { $ref: './common-components.yml#/components/responses/Conflict' }
  /sources/{sourceId}/snapshots/{snapshotId}:
    get:
      tags: [EnterpriseModeling]
      operationId: readLegalSource
      x-command-id: modeling.source-snapshot.read
      summary: Read Legal Source
      parameters:
        - { $ref: '#/components/parameters/SourceId' }
        - { $ref: '#/components/parameters/SnapshotId' }
        - { $ref: '#/components/parameters/ModelIdQuery' }
      responses:
        '200':
          description: Successful readLegalSource result.
          content:
            application/json:
              schema: { $ref: './enterprise-contract-components.yml#/components/schemas/LegalSourceSnapshot' }
        '400': { $ref: './common-components.yml#/components/responses/ValidationError' }
        '401': { $ref: './common-components.yml#/components/responses/Unauthorized' }
        '403': { $ref: './common-components.yml#/components/responses/Forbidden' }
        '404': { $ref: './common-components.yml#/components/responses/NotFound' }
        '409': { $ref: './common-components.yml#/components/responses/Conflict' }
  /sources/{sourceId}/snapshots/{snapshotId}/clauses:
    get:
      tags: [EnterpriseModeling]
      operationId: listLegalClauses
      x-command-id: modeling.source-clause.list
      summary: List Legal Clauses
      parameters:
        - { $ref: '#/components/parameters/SourceId' }
        - { $ref: '#/components/parameters/SnapshotId' }
        - { $ref: '#/components/parameters/ModelIdQuery' }
        - { $ref: './common-components.yml#/components/parameters/Limit' }
        - { $ref: './common-components.yml#/components/parameters/Offset' }
        - { $ref: './common-components.yml#/components/parameters/Sort' }
        - { $ref: './common-components.yml#/components/parameters/SortDirection' }
      responses:
        '200':
          description: Successful listLegalClauses result.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LegalClausePage' }
        '400': { $ref: './common-components.yml#/components/responses/ValidationError' }
        '401': { $ref: './common-components.yml#/components/responses/Unauthorized' }
        '403': { $ref: './common-components.yml#/components/responses/Forbidden' }
        '404': { $ref: './common-components.yml#/components/responses/NotFound' }
        '409': { $ref: './common-components.yml#/components/responses/Conflict' }
  /interpretations:
    post:
      tags: [EnterpriseModeling]
      operationId: createInterpretation
      x-command-id: modeling.interpretation.create
      summary: Create Interpretation
      parameters:
        - { $ref: '#/components/parameters/ModelIdQuery' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/IfMatch' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InterpretationRequest' }
      responses:
        '200':
          description: Successful createInterpretation result.
          content:
            application/json:
              schema: { $ref: './enterprise-contract-components.yml#/components/schemas/InterpretationRecord' }
        '400': { $ref: './common-components.yml#/components/responses/ValidationError' }
        '401': { $ref: './common-components.yml#/components/responses/Unauthorized' }
        '403': { $ref: './common-components.yml#/components/responses/Forbidden' }
        '404': { $ref: './common-components.yml#/components/responses/NotFound' }
        '409': { $ref: './common-components.yml#/components/responses/Conflict' }
    get:
      tags: [EnterpriseModeling]
      operationId: listInterpretations
      x-command-id: modeling.interpretation.list
      summary: List Interpretations
      parameters:
        - { $ref: '#/components/parameters/ModelIdQuery' }
        - { $ref: './common-components.yml#/components/parameters/Limit' }
        - { $ref: './common-components.yml#/components/parameters/Offset' }
        - { $ref: './common-components.yml#/components/parameters/Sort' }
        - { $ref: './common-components.yml#/components/parameters/SortDirection' }
      responses:
        '200':
          description: Successful listInterpretations result.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InterpretationPage' }
        '400': { $ref: './common-components.yml#/components/responses/ValidationError' }
        '401': { $ref: './common-components.yml#/components/responses/Unauthorized' }
        '403': { $ref: './common-components.yml#/components/responses/Forbidden' }
        '404': { $ref: './common-components.yml#/components/responses/NotFound' }
        '409': { $ref: './common-components.yml#/components/responses/Conflict' }
  /interpretations/{interpretationId}:revise:
    post:
      tags: [EnterpriseModeling]
      operationId: reviseInterpretation
      x-command-id: modeling.interpretation.revise
      summary: Revise Interpretation
      parameters:
        - { $ref: '#/components/parameters/InterpretationId' }
