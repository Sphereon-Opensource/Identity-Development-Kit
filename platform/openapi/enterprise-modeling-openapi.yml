        ocaBundle: { $ref: '#/components/schemas/OcaBundleArtifact' }
        mappings: { type: array, items: { $ref: '#/components/schemas/MappingManifestEntry' } }
        constraints: { type: array, items: { $ref: '#/components/schemas/ConstraintArtifact' } }
    OcaBundleArtifact:
      type: object
      required: [bundle, bundleSaid, captureBaseSaid]
      properties:
        bundle: { $ref: '#/components/schemas/JsonObject' }
        bundleSaid: { type: string, minLength: 1 }
        captureBaseSaid: { type: string, minLength: 1 }
    ConstraintArtifact:
      type: object
      required: [kind, processorStatus, statusExplanation]
      properties:
        kind: { $ref: '#/components/schemas/GovernedTypeId' }
        artifactRef: { $ref: '#/components/schemas/ArtifactRef' }
        contentHash: { $ref: './enterprise-contract-components.yml#/components/schemas/ContentHash' }
        profile: { type: string, minLength: 1 }
        validatorRevision: { $ref: '#/components/schemas/ProjectorRef' }
        validationReceipt: { $ref: '#/components/schemas/SemanticConstraintValidationReceipt' }
        processorStatus: { type: string, enum: [AVAILABLE, UNAVAILABLE] }
        statusExplanation: { type: string }
    SemanticConstraintValidationReceipt:
      type: object
      required: [receiptId, shapesGraphHash, dataGraphHash, profile, validatorRevision, valid, diagnosticsHash, validatedAt]
      properties:
        receiptId: { type: string, minLength: 1 }
        shapesGraphHash: { $ref: './enterprise-contract-components.yml#/components/schemas/ContentHash' }
        dataGraphHash: { $ref: './enterprise-contract-components.yml#/components/schemas/ContentHash' }
        profile: { type: string, minLength: 1 }
        validatorRevision: { $ref: '#/components/schemas/ProjectorRef' }
        valid: { type: boolean }
        diagnosticsHash: { $ref: './enterprise-contract-components.yml#/components/schemas/ContentHash' }
        validatedAt: { type: string, format: date-time }
    RdfDatasetArtifact:
      type: object
      required: [managedGraphIri, turtle, graphHash, tripleCount]
      properties:
        managedGraphIri: { $ref: '#/components/schemas/RdfIri' }
        turtle: { type: string }
        graphHash: { $ref: './enterprise-contract-components.yml#/components/schemas/ContentHash' }
        tripleCount: { type: integer, format: int64, minimum: 0 }
        extensionGraphs: { type: array, items: { $ref: '#/components/schemas/ExtensionNamedGraph' } }
    SemanticInterchangeLimits:
      type: object
      required: [maxBytes, maxDepth, maxTriples, maxNamedGraphs, maxProcessingMillis, remoteResolutionAllowed, allowedUriSchemes]
      properties:
        maxBytes: { type: integer, format: int64, minimum: 1 }
        maxDepth: { type: integer, minimum: 1 }
        maxTriples: { type: integer, format: int64, minimum: 1 }
        maxNamedGraphs: { type: integer, minimum: 0 }
        maxProcessingMillis: { type: integer, format: int64, minimum: 1 }
        remoteResolutionAllowed: { type: boolean, default: false }
        allowedUriSchemes: { type: array, uniqueItems: true, items: { type: string } }
    SemanticInterchangeCapability:
      type: object
      required: [format, dialects, mediaTypes, fileExtensions, artifactKinds, canParse, canValidate, canImport, canExport, canProject, canCanonicalize, adapter, limits, knownLosses]
      properties:
        format: { $ref: '#/components/schemas/GovernedTypeId' }
        dialects: { type: array, items: { $ref: '#/components/schemas/ExternalDialectRef' } }
        mediaTypes: { type: array, uniqueItems: true, items: { type: string } }
        fileExtensions: { type: array, uniqueItems: true, items: { type: string } }
        artifactKinds: { type: array, uniqueItems: true, items: { $ref: '#/components/schemas/GovernedTypeId' } }
        canParse: { type: boolean }
        canValidate: { type: boolean }
        canImport: { type: boolean }
        canExport: { type: boolean }
        canProject: { type: boolean }
        canCanonicalize: { type: boolean }
        roundTripLevel: { type: string }
        adapter: { $ref: '#/components/schemas/ProjectorRef' }
        limits: { $ref: '#/components/schemas/SemanticInterchangeLimits' }
        knownLosses: { type: array, items: { type: string } }
    SemanticCapabilityCatalog:
      type: object
      required: [contractVersion, capabilities]
      properties:
        contractVersion: { $ref: '#/components/schemas/PackageVersion' }
        capabilities: { type: array, items: { $ref: '#/components/schemas/SemanticInterchangeCapability' } }
    UnresolvedRdfTerm:
      type: object
      description: RDF term that could not be normalized into a typed managed semantic-model change.
      required: [term, role, reason, explanation, relatedTerms]
      properties:
        term: { $ref: '#/components/schemas/RdfIri' }
        role: { $ref: '#/components/schemas/GovernedTypeId' }
        reason: { $ref: '#/components/schemas/GovernedTypeId' }
        explanation: { type: string, minLength: 1 }
        relatedTerms: { type: array, items: { $ref: '#/components/schemas/RdfIri' } }
    UnresolvedOcaCaptureMapping:
      type: object
      description: Review state for an RDF property without a lossless native OCA capture mapping.
      required: [rdfPropertyIri, reason, explanation]
      properties:
        rdfPropertyIri: { $ref: '#/components/schemas/RdfIri' }
        rdfDatatypeIri: { $ref: '#/components/schemas/RdfIri' }
        reason: { $ref: '#/components/schemas/GovernedTypeId' }
        explanation: { type: string, minLength: 1 }
        proposedCapturePath: { type: string, minLength: 1 }
    SemanticImportPreview:
      type: object
      required:
        [previewId, sourceHash, changeSet, validation, conflicts, unresolvedRdfTerms,
         unresolvedOcaCaptureMappings, warnings, knownLosses, parser]
      properties:
        previewId: { type: string, minLength: 1 }
        sourceHash: { $ref: './enterprise-contract-components.yml#/components/schemas/ContentHash' }
        changeSet: { $ref: '#/components/schemas/SemanticModelChangeSet' }
        validation: { $ref: '#/components/schemas/SemanticValidationResult' }
        conflicts: { type: array, items: { $ref: '#/components/schemas/SemanticValidationDiagnostic' } }
        unresolvedRdfTerms: { type: array, items: { $ref: '#/components/schemas/UnresolvedRdfTerm' } }
        unresolvedOcaCaptureMappings: { type: array, items: { $ref: '#/components/schemas/UnresolvedOcaCaptureMapping' } }
        warnings: { type: array, items: { type: string } }
        knownLosses: { type: array, items: { type: string } }
        parser: { $ref: '#/components/schemas/ProjectorRef' }
    SemanticExportReceipt:
      type: object
      required: [release, requestedDialect]
      properties:
        release:
          type: object
          required: [releaseId, packageVersion, modelRef, rdfArtifact, ocaArtifact, mappingManifest, constraints, projectors, releasedAt]
          properties:
            releaseId: { type: string }
            packageVersion: { $ref: '#/components/schemas/PackageVersion' }
            modelRef: { $ref: '#/components/schemas/SemanticResourceRef' }
            rdfArtifact: { $ref: '#/components/schemas/RdfDatasetArtifact' }
            ocaArtifact: { $ref: '#/components/schemas/OcaBundleArtifact' }
            mappingManifest: { type: array, items: { $ref: '#/components/schemas/MappingManifestEntry' } }
            constraints: { type: array, items: { $ref: '#/components/schemas/ConstraintArtifact' } }
            projectors: { type: array, items: { $ref: '#/components/schemas/ProjectorRef' } }
            releasedAt: { type: string, format: date-time }
        requestedDialect: { $ref: '#/components/schemas/ExternalDialectRef' }
        warnings: { type: array, items: { type: string } }
        unresolvedMappings: { type: array, items: { type: string } }
        knownLosses: { type: array, items: { type: string } }
