components:
  securitySchemes:
    bearer: { $ref: './common-components.yml#/components/securitySchemes/bearer' }
  parameters:
    ModelIdQuery:
      name: modelId
      in: query
      required: true
      description: Governed semantic model identifier that owns the journey resource.
      schema: { type: string, minLength: 1 }
    SourceId:
      name: sourceId
      in: path
      required: true
      schema: { type: string, minLength: 1 }
    SnapshotId:
      name: snapshotId
      in: path
      required: true
      schema: { type: string, minLength: 1 }
    InterpretationId:
      name: interpretationId
      in: path
      required: true
      schema: { type: string, minLength: 1 }
    RequirementId:
      name: requirementId
      in: path
      required: true
      schema: { type: string, minLength: 1 }
    BindingId:
      name: bindingId
      in: path
      required: true
      schema: { type: string, minLength: 1 }
    ResourceId:
      name: resourceId
      in: path
      required: true
      schema: { type: string, minLength: 1 }
    InstallationId:
      name: installationId
      in: path
      required: true
      schema: { type: string, minLength: 1 }
    VersionQuery:
      name: version
      in: query
      required: false
      schema: { type: string, pattern: '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?$' }
    RequiredVersionQuery:
      name: version
      in: query
      required: true
      schema: { type: string, pattern: '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?$' }
    ModelId:
      name: modelId
      in: path
      required: true
      schema: { type: string, minLength: 1 }
    SemanticRevision:
      name: revision
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 1, maxLength: 255 }
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Expected ordinal semantic revision encoded as a strong entity tag.
      schema: { type: string, pattern: '^"[0-9]+"$' }
  responses:
    SemanticChangePreviewResponse:
      description: Reviewable normalized change preview.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/SemanticChangePreview' }
    SemanticDraftResponse:
      description: New draft semantic revision.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/SemanticModelDraftRevision' }
  schemas:
    ImportLegalSourceRequest:
      type: object
      required: [snapshot]
      properties:
        snapshot: { $ref: './enterprise-contract-components.yml#/components/schemas/LegalSourceSnapshot' }
        clauses:
          type: array
          items: { $ref: './enterprise-contract-components.yml#/components/schemas/LegalClause' }
    InterpretationRequest:
      type: object
      required: [record]
      properties:
        record: { $ref: './enterprise-contract-components.yml#/components/schemas/InterpretationRecord' }
    InterpretationReviewRequest:
      type: object
      required: [version, authorityRef]
      properties:
        version: { $ref: '#/components/schemas/PackageVersion' }
        authorityRef: { $ref: './enterprise-contract-components.yml#/components/schemas/BusinessObjectRef' }
        reason: { type: string }
    SupersedeResourceRequest:
      type: object
      required: [replacement]
      properties:
        replacement: { $ref: '#/components/schemas/ArtifactRef' }
        sourceVersion: { $ref: '#/components/schemas/PackageVersion', description: 'Exact predecessor revision. Omission is accepted only when the predecessor is unambiguous.' }
    RequirementRequest:
      type: object
      required: [definition]
      properties:
        definition: { $ref: './enterprise-contract-components.yml#/components/schemas/RequirementDefinition' }
    RequirementReviewRequest:
      type: object
      required: [version, authorityRef]
      properties:
        version: { $ref: '#/components/schemas/PackageVersion' }
        authorityRef: { $ref: './enterprise-contract-components.yml#/components/schemas/BusinessObjectRef' }
    PublishResourceRequest:
      type: object
      required: [version]
      properties:
        version: { $ref: '#/components/schemas/PackageVersion' }
    EvidenceRequirementRequest:
      type: object
      required: [requirement]
      properties:
        requirement: { $ref: './enterprise-contract-components.yml#/components/schemas/EvidenceRequirement' }
    PolicyBindingRequest:
      type: object
      required: [binding]
      properties:
        binding: { $ref: './enterprise-contract-components.yml#/components/schemas/PolicyBinding' }
    LegalClausePage:
      type: object
      required: [items, pagination]
      properties:
        items: { type: array, items: { $ref: './enterprise-contract-components.yml#/components/schemas/LegalClause' } }
        pagination: { $ref: './common-components.yml#/components/schemas/PageMeta' }
    InterpretationPage:
      type: object
      required: [items, pagination]
      properties:
        items: { type: array, items: { $ref: './enterprise-contract-components.yml#/components/schemas/InterpretationRecord' } }
        pagination: { $ref: './common-components.yml#/components/schemas/PageMeta' }
    RequirementPage:
      type: object
      required: [items, pagination]
      properties:
        items: { type: array, items: { $ref: './enterprise-contract-components.yml#/components/schemas/RequirementDefinition' } }
        pagination: { $ref: './common-components.yml#/components/schemas/PageMeta' }
    EvidenceRequirementPage:
      type: object
      required: [items, pagination]
      properties:
        items: { type: array, items: { $ref: './enterprise-contract-components.yml#/components/schemas/EvidenceRequirement' } }
        pagination: { $ref: './common-components.yml#/components/schemas/PageMeta' }
    ResourceLineage:
      type: object
      required: [resourceRef, contentHash]
      properties:
        resourceRef: { $ref: '#/components/schemas/ArtifactRef' }
        sourceRefs: { type: array, items: { $ref: '#/components/schemas/ArtifactRef' } }
        interpretationRefs: { type: array, items: { $ref: '#/components/schemas/ArtifactRef' } }
        approvalRefs: { type: array, items: { $ref: '#/components/schemas/ArtifactRef' } }
        semanticRefs: { type: array, items: { $ref: '#/components/schemas/SemanticResourceRef' } }
        policyRefs: { type: array, items: { $ref: '#/components/schemas/ArtifactRef' } }
        contentHash: { $ref: './enterprise-contract-components.yml#/components/schemas/ContentHash' }
    InstallCaseTemplateRequest:
      type: object
      required: [template, semanticRef]
      properties:
        template: { $ref: '#/components/schemas/GovernedCaseTemplate' }
        semanticRef: { $ref: '#/components/schemas/SemanticResourceRef' }
        workflowRef: { $ref: '#/components/schemas/WorkflowDefinitionRef' }
        sourceRouteRefs: { type: array, items: { $ref: '#/components/schemas/ArtifactRef' } }
        policyRefs: { type: array, items: { $ref: '#/components/schemas/ArtifactRef' } }
        replayManifestRef: { $ref: '#/components/schemas/ArtifactRef' }
    TemplateInstallation:
      allOf:
        - { $ref: '#/components/schemas/InstallCaseTemplateRequest' }
        - type: object
          required: [installationId, tenantId, modelId, contentHash, installedAt]
          properties:
            installationId: { type: string, minLength: 1 }
            tenantId: { type: string, minLength: 1 }
            modelId: { type: string, minLength: 1 }
            contentHash: { $ref: './enterprise-contract-components.yml#/components/schemas/ContentHash' }
            installedAt: { type: string, format: date-time }
    GovernedCaseTemplate:
      type: object
      required: [templateId, version, title, stages, transitions, actions]
      properties:
        templateId: { $ref: './enterprise-contract-components.yml#/components/schemas/GovernedTypeId' }
        version: { $ref: '#/components/schemas/PackageVersion' }
        title: { type: string, minLength: 1 }
        stages: { type: array, minItems: 1, items: { $ref: '#/components/schemas/GovernedStageDefinition' } }
        transitions: { type: array, items: { $ref: '#/components/schemas/GovernedTransitionDefinition' } }
        actions: { type: array, items: { $ref: '#/components/schemas/GovernedActionDefinition' } }
        gates: { type: array, items: { $ref: '#/components/schemas/GovernedGateDefinition' } }
        reasons: { type: array, items: { type: object, additionalProperties: true } }
        semanticReleaseRef: { $ref: '#/components/schemas/SemanticResourceRef' }
        lifecycleDefinitionRef: { $ref: '#/components/schemas/WorkflowDefinitionRef' }
        evidenceDispositions: { type: array, items: { type: object, additionalProperties: true } }
        lifecyclePlans: { type: array, items: { $ref: '#/components/schemas/GovernedLifecyclePlanDefinition' } }
        initialStageRef: { $ref: './enterprise-contract-components.yml#/components/schemas/GovernedTypeId' }
    GovernedStageDefinition:
      type: object
      required: [stageId, version, title]
      properties:
        stageId: { $ref: './enterprise-contract-components.yml#/components/schemas/GovernedTypeId' }
        version: { $ref: '#/components/schemas/PackageVersion' }
        title: { type: string }
        entryPolicyRefs: { type: array, items: { $ref: '#/components/schemas/ArtifactRef' } }
        exitPolicyRefs: { type: array, items: { $ref: '#/components/schemas/ArtifactRef' } }
        metadata: { type: object, additionalProperties: true }
        caseStatus: { $ref: './enterprise-contract-components.yml#/components/schemas/CaseStatus' }
    GovernedActionDefinition:
      type: object
      required: [actionId, version, title]
      properties:
        actionId: { $ref: './enterprise-contract-components.yml#/components/schemas/GovernedTypeId' }
        version: { $ref: '#/components/schemas/PackageVersion' }
        title: { type: string }
        requiredCapabilityRefs: { type: array, items: { $ref: '#/components/schemas/ArtifactRef' } }
        policyRefs: { type: array, items: { $ref: '#/components/schemas/ArtifactRef' } }
        inputSchemaRef: { $ref: '#/components/schemas/ArtifactRef' }
    GovernedLifecyclePlanDefinition:
      type: object
      required: [planId, version]
      properties:
        planId: { $ref: './enterprise-contract-components.yml#/components/schemas/GovernedTypeId' }
        version: { $ref: '#/components/schemas/PackageVersion' }
        agreementRequired: { type: boolean, default: false }
        requiredTimerRefs: { type: array, items: { $ref: '#/components/schemas/ArtifactRef' } }
        requiredConfirmationRefs: { type: array, items: { $ref: '#/components/schemas/ArtifactRef' } }
        activationPolicyRefs: { type: array, items: { $ref: '#/components/schemas/ArtifactRef' } }
        activationStageRefs: { type: array, items: { $ref: './enterprise-contract-components.yml#/components/schemas/GovernedTypeId' } }
        preconditionRefs: { type: array, items: { $ref: '#/components/schemas/ArtifactRef' } }
    WorkflowDefinitionRef:
      $ref: './enterprise-contract-components.yml#/components/schemas/WorkflowDefinitionRef'
    JsonElement:
      description: An arbitrary JSON value preserved without string coercion.
    JsonObject:
      type: object
      description: An arbitrary JSON object preserved without string coercion.
      additionalProperties:
        $ref: '#/components/schemas/JsonElement'
    PackageVersion:
      type: object
      required: [value]
      properties:
        value: { type: string, pattern: '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?$' }
    ExternalDialectVersion:
      type: object
      required: [value]
      properties:
        value: { type: string, minLength: 1 }
    ExternalDialectRef:
      type: object
      required: [id, version]
      properties:
        id: { type: string, minLength: 1 }
        version: { $ref: '#/components/schemas/ExternalDialectVersion' }
    ArtifactRef:
      type: object
      required: [id, version]
      properties:
        id: { type: string, minLength: 1 }
        version: { $ref: '#/components/schemas/PackageVersion' }
    GovernedTransitionDefinition:
      type: object
      required: [transitionId, version, fromStage, toStage, actionRef]
      description: |
        One authored stage change of a governed case template. `preconditionRefs` name the gates
        that must pass before the transition is applied; `startsGateRef` names the elapsed gate whose
        clock the apply starts, if any. Both resolve to entries of the template's own `gates` by id
        and version; a started gate must have predicate `ELAPSED_FROM_CASE_METADATA` and may not also
        be one of this transition's preconditions.
      properties:
        transitionId: { $ref: './enterprise-contract-components.yml#/components/schemas/GovernedTypeId' }
        version: { $ref: '#/components/schemas/PackageVersion' }
        fromStage: { $ref: './enterprise-contract-components.yml#/components/schemas/GovernedTypeId' }
        toStage: { $ref: './enterprise-contract-components.yml#/components/schemas/GovernedTypeId' }
        actionRef: { $ref: '#/components/schemas/ArtifactRef' }
        preconditionRefs: { type: array, items: { $ref: '#/components/schemas/ArtifactRef' } }
        approvalPolicyRefs: { type: array, items: { $ref: '#/components/schemas/ArtifactRef' } }
        reasonRefs: { type: array, items: { $ref: '#/components/schemas/ArtifactRef' } }
        startsGateRef: { $ref: '#/components/schemas/ArtifactRef' }
    GovernedGatePredicate:
      type: string
      description: |
        The runtime-neutral test a gate performs. `CASE_CONFIRMATION_RECORDED` takes no parameters,
        `ELAPSED_FROM_CASE_METADATA` reads `metadataKey` from the case metadata and adds `duration`,
        and `CURRENT_STAGE` compares the case stage with `expectedStage`.
      enum: [CASE_CONFIRMATION_RECORDED, ELAPSED_FROM_CASE_METADATA, CURRENT_STAGE, REQUIRED_EVIDENCE_TERMINAL, REQUIRED_EVIDENCE_ACCEPTED]
    GovernedGateDefinition:
      type: object
      required: [gateId, version, predicate, failureReasonRef]
      description: |
        One deterministic precondition of a governed case template. Predicate parameters stay
        explicit so a template is inspectable and replayable without embedded executable code, which
        is why they are declared here rather than left free-form: `ELAPSED_FROM_CASE_METADATA`
        requires `metadataKey` and a positive finite `duration`, `CURRENT_STAGE` requires
        `expectedStage`, and `CASE_CONFIRMATION_RECORDED` requires neither. Every elapsed gate owns
        its `metadataKey` alone, so two gates cannot read one clock. These are the fields a
        transition's `preconditionRefs` and `startsGateRef` resolve against.
      properties:
        gateId: { $ref: './enterprise-contract-components.yml#/components/schemas/GovernedTypeId' }
        version: { $ref: '#/components/schemas/PackageVersion' }
        predicate: { $ref: '#/components/schemas/GovernedGatePredicate' }
        failureReasonRef: { $ref: '#/components/schemas/ArtifactRef' }
        metadataKey:
          type: string
          minLength: 1
          description: |
            The case-metadata key an `ELAPSED_FROM_CASE_METADATA` gate reads its start instant from,
            and the key the transition that starts this gate stamps. Absent for other predicates.
        duration:
          type: string
          minLength: 1
          description: |
            How long an `ELAPSED_FROM_CASE_METADATA` gate waits, counted from the instant stored
            under `metadataKey`. Kotlin components such as `480h` or `20d 12h`, or ISO-8601 such as
            `P20D`. Must be positive and finite. Absent for other predicates.
        expectedStage: { $ref: './enterprise-contract-components.yml#/components/schemas/GovernedTypeId' }
        confirmationRef: { $ref: '#/components/schemas/ArtifactRef' }
        evidenceRequirementRefs: { type: array, items: { $ref: '#/components/schemas/ArtifactRef' } }
    ProjectorRevision:
      type: object
      required: [value]
      properties:
        value: { type: integer, format: int64, minimum: 1 }
    ProjectorRef:
      type: object
      required: [id, revision]
      properties:
        id: { type: string, minLength: 1 }
        revision: { $ref: '#/components/schemas/ProjectorRevision' }
    RdfIri:
      type: object
      required: [value]
      properties:
        value: { type: string, format: uri }
    GovernedTypeId:
      $ref: './enterprise-contract-components.yml#/components/schemas/GovernedTypeId'
    LocalizedText:
      type: object
