  /interpretations/{interpretationId}:submit:
    post:
      tags: [EnterpriseModeling]
      operationId: submitInterpretation
      x-command-id: modeling.interpretation.submit
      summary: Submit Interpretation
      parameters:
        - { $ref: '#/components/parameters/InterpretationId' }
        - { $ref: '#/components/parameters/ModelIdQuery' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/IfMatch' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InterpretationReviewRequest' }
      responses:
        '200':
          description: Successful submitInterpretation result.
          content:
            application/json:
              schema: { $ref: './enterprise-contract-components.yml#/components/schemas/InterpretationRecord' }
        '400': { $ref: './common-components.yml#/components/responses/ValidationError' }
        '401': { $ref: './common-components.yml#/components/responses/Unauthorized' }
        '403': { $ref: './common-components.yml#/components/responses/Forbidden' }
        '404': { $ref: './common-components.yml#/components/responses/NotFound' }
        '409': { $ref: './common-components.yml#/components/responses/Conflict' }
  /interpretations/{interpretationId}:approve:
    post:
      tags: [EnterpriseModeling]
      operationId: approveInterpretation
      x-command-id: modeling.interpretation.approve
      summary: Approve Interpretation
      parameters:
