        examples: { type: array, items: { $ref: '#/components/schemas/JsonElement' } }
        constraints: { type: array, items: { $ref: '#/components/schemas/GuidedConstraint' } }
        sensitive: { type: boolean, default: false }
    GuidedConstraint:
      type: object
      required: [kind, explanation]
      properties:
        kind: { $ref: '#/components/schemas/GovernedTypeId' }
        arguments: { $ref: '#/components/schemas/JsonObject' }
