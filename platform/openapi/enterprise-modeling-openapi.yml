        '400': { $ref: './common-components.yml#/components/responses/ValidationError' }
        '401': { $ref: './common-components.yml#/components/responses/Unauthorized' }
        '403': { $ref: './common-components.yml#/components/responses/Forbidden' }
        '404': { $ref: './common-components.yml#/components/responses/NotFound' }
        '409': { $ref: './common-components.yml#/components/responses/Conflict' }
  /requirements/{requirementId}:revise:
    post:
      tags: [EnterpriseModeling]
      operationId: reviseRequirement
      x-command-id: modeling.requirement.revise
      summary: Revise Requirement
      parameters:
        - { $ref: '#/components/parameters/RequirementId' }
        - { $ref: '#/components/parameters/ModelIdQuery' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/IfMatch' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RequirementRequest' }
      responses:
        '200':
          description: Successful reviseRequirement result.
          content:
            application/json:
              schema: { $ref: './enterprise-contract-components.yml#/components/schemas/RequirementDefinition' }
        '400': { $ref: './common-components.yml#/components/responses/ValidationError' }
        '401': { $ref: './common-components.yml#/components/responses/Unauthorized' }
        '403': { $ref: './common-components.yml#/components/responses/Forbidden' }
        '404': { $ref: './common-components.yml#/components/responses/NotFound' }
        '409': { $ref: './common-components.yml#/components/responses/Conflict' }
  /requirements/{requirementId}:approve:
    post:
      tags: [EnterpriseModeling]
      operationId: approveRequirement
      x-command-id: modeling.requirement.approve
      summary: Approve Requirement
