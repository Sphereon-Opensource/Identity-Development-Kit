openapi: 3.0.4
info:
  title: Business Conduit Components
  version: 0.1.0
  description: UI-safe request and response schemas for assigned business-wallet operations.
paths: {}
components:
  parameters:
    AssignmentRef:
      name: assignmentRef
      in: path
      required: true
      schema: { type: string, minLength: 1 }
    InteractionRef:
      name: interactionRef
      in: path
      required: true
      schema: { type: string, minLength: 1 }
  schemas:
    BusinessConduitAssignmentState:
      type: string
      enum: [OFFERED, ACCEPTED, ACTIVE, SUSPENDED, REVOKED, EXPIRED]
    BusinessConduitApprovalStatus:
      type: string
      enum: [PENDING, APPROVED, REJECTED, STALE]
    BusinessConduitApprovalDecisionKind:
      type: string
      enum: [APPROVE, REJECT]
    BusinessConduitInitiationSource:
      type: string
      enum: [BUSINESS_WEB_UI, AUTHENTICATED_API, MOBILE_QR, MOBILE_DEEPLINK, PUSH_ASSIGNMENT]
    ProtocolExecutionOwner:
      type: string
      description: A conduit interaction always runs its holder interaction on the platform.
      enum: [WALLET_BACKEND]
    BusinessConduitInteractionState:
      type: string
      enum: [CAPTURED, IN_PROGRESS, APPROVAL_PENDING, APPROVED, EXECUTING, COMPLETED, FAILED, REVOKED]
    CreateBusinessConduitAssignmentHttpBody:
      type: object
      additionalProperties: false
      required: [assignmentAuthorityRef, idempotencyKey]
      properties:
        assignmentAuthorityRef:
          type: string
          minLength: 1
          writeOnly: true
          description: Opaque server-authorized assignment-offer reference.
        idempotencyKey: { type: string, minLength: 1, writeOnly: true }
    ActivateBusinessConduitAssignmentHttpBody:
      type: object
      additionalProperties: false
      required: [expectedVersion, acceptanceEvidenceRef, idvEvidenceRef, idempotencyKey]
      properties:
        expectedVersion: { type: integer, format: int64, minimum: 1 }
        acceptanceEvidenceRef: { type: string, minLength: 1, writeOnly: true }
        idvEvidenceRef: { type: string, minLength: 1, writeOnly: true }
        idempotencyKey: { type: string, minLength: 1, writeOnly: true }
    RevalidateBusinessConduitAssignmentHttpBody:
      type: object
      additionalProperties: false
      required: [expectedVersion, idempotencyKey]
      properties:
        expectedVersion: { type: integer, format: int64, minimum: 1 }
        idempotencyKey: { type: string, minLength: 1, writeOnly: true }
    RevokeBusinessConduitAssignmentHttpBody:
      type: object
      additionalProperties: false
      required: [expectedVersion, reasonCode, idempotencyKey]
      properties:
        expectedVersion: { type: integer, format: int64, minimum: 1 }
        reasonCode: { type: string, minLength: 1, pattern: '^[a-z0-9][a-z0-9._-]{0,127}$' }
        idempotencyKey: { type: string, minLength: 1, writeOnly: true }
    BusinessConduitCaptureSourceClaim:
      type: object
      description: >-
        The ingress an initiation claims. A mobile capture (`MOBILE_QR`, `MOBILE_DEEPLINK`,
        `PUSH_ASSIGNMENT`) names no binding: it runs under the operator's own registered conduit app,
        which the service resolves. `BUSINESS_WEB_UI` and `AUTHENTICATED_API` name their configured
        source binding. Only `PUSH_ASSIGNMENT` names the assignment it was pushed for.
      additionalProperties: false
      required: [source]
      properties:
        source:
          $ref: '#/components/schemas/BusinessConduitInitiationSource'
        sourceBindingRef:
          type: string
          minLength: 1
          writeOnly: true
          description: Authenticated host binding of web UI and API ingress. Absent for mobile captures.
        pushAssignmentRef: { type: string, minLength: 1, writeOnly: true }
    InitiateBusinessConduitInteractionHttpBody:
      type: object
      additionalProperties: false
      required: [source, opaqueCaptureBase64Url, payloadDigest, idempotencyKey]
      properties:
        source:
          $ref: '#/components/schemas/BusinessConduitCaptureSourceClaim'
        opaqueCaptureBase64Url:
          type: string
          minLength: 1
          maxLength: 1398104
          pattern: '^[A-Za-z0-9_-]+$'
          writeOnly: true
          description: Single-use opaque protocol capture, limited to 1 MiB after decoding.
        payloadDigest:
          type: string
          pattern: '^sha256:[0-9a-f]{64}$'
          writeOnly: true
        idempotencyKey: { type: string, minLength: 1, writeOnly: true }
    SubmitBusinessConduitHolderActionHttpBody:
      type: object
      additionalProperties: false
      required: [controllerLeaseRef, expectedVersion, expectedHolderRevision, action, idempotencyKey]
      properties:
        controllerLeaseRef: { type: string, minLength: 1, writeOnly: true }
        expectedVersion: { type: integer, format: int64, minimum: 1 }
        expectedHolderRevision:
          type: integer
          format: int64
          minimum: 0
          description: Revision of the holder interaction the action was decided on.
        action:
          $ref: './wallet-interaction-components.yml#/components/schemas/WalletInteractionAction'
        idempotencyKey: { type: string, minLength: 1, writeOnly: true }
    RegisterBusinessConduitSensitiveInputHttpBody:
      type: object
      additionalProperties: false
      required: [controllerLeaseRef, expectedHolderRevision, purpose, value]
      properties:
        controllerLeaseRef: { type: string, minLength: 1 }
        expectedHolderRevision: { type: integer, format: int64, minimum: 0 }
        purpose:
          description: Only OID4VCI_TRANSACTION_CODE, OID4VCI_AUTHORIZATION_CALLBACK and INTERACTION_SECURITY_GRANT are accepted.
          allOf:
            - $ref: './wallet-interaction-components.yml#/components/schemas/WalletInteractionSensitiveInputPurpose'
        value:
          type: string
          minLength: 1
          description: The sensitive value. Never returned and never logged.
    ConsumeBusinessConduitHandoffHttpBody:
      type: object
      additionalProperties: false
      required: [controllerLeaseRef, ref]
      properties:
        controllerLeaseRef: { type: string, minLength: 1 }
        ref:
          $ref: './wallet-interaction-components.yml#/components/schemas/WalletInteractionSensitiveInputRef'
    SubmitBusinessConduitApprovalHttpBody:
      type: object
      additionalProperties: false
      required: [controllerLeaseRef, expectedVersion, decision, approvalBindingDigest, activationDecisionRef, idempotencyKey]
      properties:
        controllerLeaseRef: { type: string, minLength: 1, writeOnly: true }
        expectedVersion: { type: integer, format: int64, minimum: 1 }
        decision:
          $ref: '#/components/schemas/BusinessConduitApprovalDecisionKind'
        approvalBindingDigest: { type: string, pattern: '^sha256:[0-9a-f]{64}$', writeOnly: true }
        activationDecisionRef: { type: string, minLength: 1, writeOnly: true }
        idempotencyKey: { type: string, minLength: 1, writeOnly: true }
    ExecuteBusinessConduitInteractionHttpBody:
      type: object
      additionalProperties: false
      required: [controllerLeaseRef, expectedVersion, idempotencyKey]
      properties:
        controllerLeaseRef: { type: string, minLength: 1, writeOnly: true }
        expectedVersion: { type: integer, format: int64, minimum: 1 }
        idempotencyKey: { type: string, minLength: 1, writeOnly: true }
    BusinessConduitAssignmentHttpView:
      type: object
      description: >-
        An assignment gives one operator one business wallet. `businessWalletUnitId` is the business
        wallet's unit, which all its operators share. `businessWalletName` is the business wallet's
        own name: discovery resolves it for the operator and leaves out wallets that refuse the
        operator; other assignment views omit it.
      additionalProperties: false
      required: [assignmentRef, businessWalletUnitId, actionScopes, state, version, requiresAcceptance, expiresAtEpochSeconds]
      properties:
        assignmentRef: { type: string, minLength: 1 }
        businessWalletUnitId: { type: string, minLength: 1 }
        businessWalletName: { type: string, minLength: 1 }
        actionScopes:
          type: array
          uniqueItems: true
          items: { type: string, minLength: 1 }
        state:
          $ref: '#/components/schemas/BusinessConduitAssignmentState'
        version: { type: integer, format: int64, minimum: 1 }
        requiresAcceptance: { type: boolean }
        expiresAtEpochSeconds: { type: integer, format: int64, minimum: 1 }
    BusinessConduitAssignmentList:
      type: object
      additionalProperties: false
      required: [assignments]
      properties:
        assignments:
          type: array
          items:
            $ref: '#/components/schemas/BusinessConduitAssignmentHttpView'
    BusinessConduitControllerLeaseHttpView:
      type: object
      additionalProperties: false
      required: [leaseRef, expiresAtEpochSeconds, revision]
      properties:
        leaseRef: { type: string, minLength: 1 }
        expiresAtEpochSeconds: { type: integer, format: int64, minimum: 1 }
        revision: { type: integer, format: int64, minimum: 1 }
    BusinessConduitApprovalHttpView:
      type: object
      additionalProperties: false
      required: [status, bindingDigest, expiresAtEpochSeconds, challenge]
      properties:
        status:
          $ref: '#/components/schemas/BusinessConduitApprovalStatus'
        bindingDigest: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
        expiresAtEpochSeconds: { type: integer, format: int64, minimum: 1 }
        challenge:
          $ref: '#/components/schemas/BusinessConduitApprovalChallenge'
    BusinessConduitApprovalChallenge:
      type: object
      additionalProperties: false
      description: |
        What the approver's passkey activation decision must answer. The approver requests the
        decision on the conduit device's wallet unit for exactly these values and sends its
        reference as activationDecisionRef; the conduit spends it once through that wallet unit.
      required: [walletUnitId, operationType, operationBinding, operationHash, nonce, audience]
      properties:
        walletUnitId: { type: string, minLength: 1 }
        operationType: { type: string, minLength: 1 }
        operationBinding: { type: string, minLength: 1 }
        operationHash: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
        nonce: { type: string, minLength: 1 }
        audience: { type: string, minLength: 1 }
    BusinessConduitInteractionHttpView:
      type: object
      additionalProperties: false
      required:
        - interactionRef
        - assignmentRef
        - businessWalletUnitId
        - initiationSource
        - executionOwner
        - controllerLease
        - state
        - version
        - createdAtEpochSeconds
        - updatedAtEpochSeconds
        - expiresAtEpochSeconds
      properties:
        interactionRef: { type: string, minLength: 1 }
        assignmentRef: { type: string, minLength: 1 }
        businessWalletUnitId:
          type: string
          minLength: 1
          description: The business wallet unit the holder interaction runs on.
        initiationSource:
          $ref: '#/components/schemas/BusinessConduitInitiationSource'
        executionOwner:
          $ref: '#/components/schemas/ProtocolExecutionOwner'
        approval:
          type: object
          nullable: true
          allOf: [{ $ref: '#/components/schemas/BusinessConduitApprovalHttpView' }]
        pendingHolderAction:
          type: object
          nullable: true
          description: The holder action the approval is asked for.
          allOf: [{ $ref: './wallet-interaction-components.yml#/components/schemas/WalletInteractionAction' }]
        controllerLease:
          $ref: '#/components/schemas/BusinessConduitControllerLeaseHttpView'
        state:
          $ref: '#/components/schemas/BusinessConduitInteractionState'
        version: { type: integer, format: int64, minimum: 1 }
        createdAtEpochSeconds: { type: integer, format: int64, minimum: 1 }
        updatedAtEpochSeconds: { type: integer, format: int64, minimum: 1 }
        expiresAtEpochSeconds: { type: integer, format: int64, minimum: 1 }
        holder:
          type: object
          nullable: true
          description: The business wallet's holder interaction, absent until it has started.
          allOf: [{ $ref: './wallet-interaction-components.yml#/components/schemas/WalletInteractionState' }]
        failureReasonCode: { type: string, nullable: true }
