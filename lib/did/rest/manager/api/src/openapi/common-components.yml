openapi: 3.0.3
info:
  title: Common Components
  version: 0.1.0
  # Local copy mirroring VDX common-components.yml conventions, kept within
  # the IDK repository so it remains self-contained (IDK is an independent
  # git submodule).
  description: Shared reusable components for IDK REST APIs.
paths: {}
components:
  parameters:
    TenantId:
      name: X-Tenant-ID
      in: header
      required: false
      description: |
        Optional tenant context header for trusted infrastructure or internal
        override flows. Public clients should normally rely on bearer-token
        context instead of sending this header directly.
      schema:
        type: string
        format: uuid
    UserId:
      name: X-User-ID
      in: header
      required: false
      description: |
        Optional authenticated user context header for trusted infrastructure
        or internal override flows. Public clients should normally rely on
        bearer-token context instead of sending this header directly.
      schema:
        type: string
        format: uuid
    CorrelationId:
      name: X-Correlation-ID
      in: header
      required: false
      description: |
        Client-supplied correlation identifier. If sent, the server echoes it back
        in the response. If absent, the server generates one. Always present in
        responses and in ApiError.correlationId. UUIDs are recommended but not
        required; any opaque string is accepted.
      schema:
        type: string

  headers:
    CorrelationId:
      description: |
        Correlation identifier for this response. Echoes the inbound
        X-Correlation-ID header when present, otherwise a server-generated
        value. UUIDs are recommended but not required.
      schema:
        type: string

  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      # Enforcement happens at the gateway/middleware layer; declared here
      # for documentation and codegen.
      description: Bearer JWT token.

  schemas:
    ApiError:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          example: VALIDATION_ERROR
        message:
          type: string
        correlationId:
          type: string
          format: uuid
        details:
          type: object
          additionalProperties: true
          description: Additional error context or field-level details.

    PagingMeta:
      type: object
      description: Standard pagination metadata.
      properties:
        page:
          type: integer
          minimum: 0
        size:
          type: integer
          minimum: 1
        totalElements:
          type: integer
          minimum: 0
        totalPages:
          type: integer
          minimum: 0

  responses:
    ValidationError:
      description: The request failed validation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Unauthorized:
      description: Authentication required.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Forbidden:
      description: Insufficient permissions.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    NotFound:
      description: The requested entity was not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Conflict:
      description: Resource conflict (e.g., duplicate entry).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Error:
      description: An unexpected error occurred.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
