          $ref: './common-components.yml#/components/responses/NotFound'
        '409':
          $ref: './common-components.yml#/components/responses/Conflict'
        '500':
          $ref: './common-components.yml#/components/responses/Error'

  /dids/{did}/equivalent-ids/{equivalentId}:
    parameters:
      - $ref: './did-manager-components.yml#/components/parameters/Did'
      - $ref: './did-manager-components.yml#/components/parameters/EquivalentId'

    delete:
      tags: [EquivalentIds]
      summary: Remove an equivalent-id entry
      operationId: removeEquivalentId
      parameters:
        - $ref: './common-components.yml#/components/parameters/TenantId'
        - $ref: './common-components.yml#/components/parameters/UserId'
        - $ref: './common-components.yml#/components/parameters/CorrelationId'
      responses:
        '204':
          description: Equivalent-id entry removed successfully.
          headers:
            X-Correlation-ID:
              $ref: './common-components.yml#/components/headers/CorrelationId'
        '401':
          $ref: './common-components.yml#/components/responses/Unauthorized'
        '403':
          $ref: './common-components.yml#/components/responses/Forbidden'
        '404':
          $ref: './common-components.yml#/components/responses/NotFound'
        '500':
          $ref: './common-components.yml#/components/responses/Error'

  # ════════════════════════════════════════════════════════════════════
  # Method capabilities
  # ════════════════════════════════════════════════════════════════════
  /methods:
    get:
      tags: [Capabilities]
      summary: List supported DID methods
      description: |
        Returns the capability snapshot for every DID method registered
        with the deployment.
      operationId: listSupportedMethods
      parameters:
        - $ref: './common-components.yml#/components/parameters/TenantId'
        - $ref: './common-components.yml#/components/parameters/UserId'
        - $ref: './common-components.yml#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Supported methods retrieved successfully.
          headers:
            X-Correlation-ID:
              $ref: './common-components.yml#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MethodCapabilityListResponse'
        '401':
          $ref: './common-components.yml#/components/responses/Unauthorized'
        '403':
          $ref: './common-components.yml#/components/responses/Forbidden'
        '500':
          $ref: './common-components.yml#/components/responses/Error'

  /methods/{method}/capabilities:
    parameters:
      - name: method
        in: path
        required: true
        description: DID method name (e.g., key, web, ion, jwk).
        schema:
          type: string

    get:
      tags: [Capabilities]
      summary: Get capabilities for a DID method
      operationId: getMethodCapabilities
      parameters:
        - $ref: './common-components.yml#/components/parameters/TenantId'
        - $ref: './common-components.yml#/components/parameters/UserId'
        - $ref: './common-components.yml#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Method capabilities retrieved successfully.
          headers:
            X-Correlation-ID:
              $ref: './common-components.yml#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DidMethodCapabilities'
        '401':
          $ref: './common-components.yml#/components/responses/Unauthorized'
        '403':
          $ref: './common-components.yml#/components/responses/Forbidden'
        '404':
          $ref: './common-components.yml#/components/responses/NotFound'
        '500':
          $ref: './common-components.yml#/components/responses/Error'

  /methods/{method}/capabilities/summary:
    parameters:
      - name: method
        in: path
        required: true
        description: DID method name (e.g., key, web, ion, jwk).
        schema:
          type: string

    get:
      tags: [Capabilities]
      summary: Get the capability summary for a DID method
      operationId: getMethodCapabilitySummary
      parameters:
        - $ref: './common-components.yml#/components/parameters/TenantId'
        - $ref: './common-components.yml#/components/parameters/UserId'
        - $ref: './common-components.yml#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Method capability summary retrieved successfully.
          headers:
            X-Correlation-ID:
              $ref: './common-components.yml#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MethodCapabilitySummary'
        '401':
          $ref: './common-components.yml#/components/responses/Unauthorized'
        '403':
          $ref: './common-components.yml#/components/responses/Forbidden'
        '404':
          $ref: './common-components.yml#/components/responses/NotFound'
        '500':
          $ref: './common-components.yml#/components/responses/Error'

# ══════════════════════════════════════════════════════════════════════
# Local components (request schemas, list wrappers, parameters)
# ══════════════════════════════════════════════════════════════════════
components:
  securitySchemes:
    bearer:
      $ref: './common-components.yml#/components/securitySchemes/bearer'

  schemas:
    # ── Re-exported entity schemas from did-manager-components.yml ──
    Did:
      $ref: './did-manager-components.yml#/components/schemas/Did'
    VerificationMethod:
      $ref: './did-manager-components.yml#/components/schemas/VerificationMethod'
    VerificationRelationshipView:
      $ref: './did-manager-components.yml#/components/schemas/VerificationRelationshipView'
    DidDocumentService:
      $ref: './did-manager-components.yml#/components/schemas/DidDocumentService'
    KeyMapping:
      $ref: './did-manager-components.yml#/components/schemas/KeyMapping'
    Controller:
      $ref: './did-manager-components.yml#/components/schemas/Controller'
    AlsoKnownAsEntry:
      $ref: './did-manager-components.yml#/components/schemas/AlsoKnownAsEntry'
    EquivalentIdEntry:
      $ref: './did-manager-components.yml#/components/schemas/EquivalentIdEntry'
    DidDetail:
      $ref: './did-manager-components.yml#/components/schemas/DidDetail'
    DidRole:
      $ref: './did-manager-components.yml#/components/schemas/DidRole'
    VerificationPurpose:
      $ref: './did-manager-components.yml#/components/schemas/VerificationPurpose'
    Curve:
      $ref: './did-manager-components.yml#/components/schemas/Curve'
    JwkUse:
      $ref: './did-manager-components.yml#/components/schemas/JwkUse'
    JwkKeyType:
      $ref: './did-manager-components.yml#/components/schemas/JwkKeyType'
    KeyOperations:
      $ref: './did-manager-components.yml#/components/schemas/KeyOperations'
    Jwk:
      $ref: './did-manager-components.yml#/components/schemas/Jwk'
    KeyInfo:
      $ref: './did-manager-components.yml#/components/schemas/KeyInfo'
    DidDocument:
      $ref: './did-manager-components.yml#/components/schemas/DidDocument'

    # ── Request schemas ────────────────────────────────────────────
    DidCreateRequest:
      type: object
      description: |
        Request body for creating a new DID. References an existing
        KMS-managed key for the initial verification method via `keyInfo`.
        `keyInfo.providerId` and at least one of `keyInfo.alias` or
        `keyInfo.kid` must be provided.
      required:
        - method
        - keyInfo
      properties:
        method:
          type: string
          description: DID method to use (e.g., key, web, ion, jwk).
          example: "key"
        keyInfo:
          $ref: '#/components/schemas/KeyInfo'
        didAlias:
          type: string
          description: Optional human-readable alias for the DID.
        controllers:
          type: array
          items:
            type: string
          description: Initial controller DID strings.
        alsoKnownAs:
          type: array
          items:
            type: string
          description: Initial also-known-as URIs.
        options:
          type: object
          additionalProperties: true
          description: Method-specific creation options.

    TrackExternalDidRequest:
      type: object
      description: |
        Request body for tracking an externally-managed DID. Only the DID
        string and an optional alias are accepted; the server resolves the
        document and caches it via the IDK CacheService. KMS bindings,
        inline document payloads, and key mappings are deliberately omitted —
        external DIDs are tracked as the string only and never carry locally
        managed key material.
      required:
        - did
      properties:
        did:
          type: string
          description: The external DID string to track.
          example: "did:key:z6MkhaXgBZDvotDkL5257faiztiGiC2QtKLGpbnnEGta2doK"
        alias:
          type: string
          description: Optional human-readable alias.

    DidUpdateRequest:
      type: object
      description: Request body for partially updating a DID.
      properties:
        alias:
          type: string
          nullable: true
          description: Updated alias (null to clear).
        canonicalId:
          type: string
          nullable: true
          description: Updated canonical ID (null to clear).

    DidReplaceRequest:
      type: object
      description: Request body for fully replacing a DID's mutable fields.
      properties:
        alias:
          type: string
          nullable: true
        canonicalId:
          type: string
          nullable: true
        controllers:
          type: array
          items:
            type: string
          description: Full replacement set of controller DID strings.
        alsoKnownAs:
          type: array
          items:
            type: string
          description: Full replacement set of also-known-as URIs.
        equivalentIds:
          type: array
          items:
            type: string
          description: Full replacement set of equivalent DID strings.

    DeactivateDidRequest:
      type: object
      description: Optional request body for deactivation with method-specific options.
      properties:
        options:
          type: object
          additionalProperties: true
          description: Method-specific deactivation options.

    VerificationMethodCreateRequest:
      type: object
      description: |
        Request body for creating a verification method. References an
        existing KMS-managed key via `keyInfo`. `keyInfo.providerId` and at
        least one of `keyInfo.alias` or `keyInfo.kid` must be provided.
      required:
        - type
        - controller
        - keyInfo
      properties:
        id:
          type: string
          description: |
            Verification method identifier as it should appear in the DID
            document. May be a fragment or an absolute DID URL. Auto-generated
            if omitted.
        type:
          type: string
          description: Verification method type (e.g., JsonWebKey2020, Ed25519VerificationKey2020, Multikey).
        controller:
          type: string
          description: DID of the controller.
        keyInfo:
          $ref: '#/components/schemas/KeyInfo'
        purposes:
          type: array
          items:
            $ref: './did-manager-components.yml#/components/schemas/VerificationPurpose'
          description: Verification purposes to associate with this method.
        valueVerificationRelation:
          allOf:
            - $ref: './did-manager-components.yml#/components/schemas/VerificationPurpose'
          nullable: true
          description: |
            If set, embed the new VM by value inside this single
            verification relationship in the DID document. At most one
            per W3C semantics. When null, the VM is rendered only in the
            top-level `verificationMethod` array.
        referenceVerificationRelations:
          type: array
          items:
            $ref: './did-manager-components.yml#/components/schemas/VerificationPurpose'
          description: |
            Verification relationships that should reference the new VM
            by DID URL (in addition to wherever the VM is rendered).
        extensionProperties:
          type: object
          additionalProperties: true
          description: |
            Optional bag of extension properties to attach to the VM for
            lossless DID 1.1 round-tripping.

    VerificationMethodUpdateRequest:
      type: object
      description: |
        Request body for updating a verification method. Follows JSON Merge
        Patch semantics: omitted top-level fields preserve, present fields
        replace. Within the optional nested `keyInfo` object the same
        per-field merge semantics apply — omit `keyInfo` to preserve all
        KMS-key fields, or supply `keyInfo` with only the sub-fields you
        want to change.
      properties:
        controller:
          type: string
          description: Updated controller DID.
        keyInfo:
          allOf:
            - $ref: '#/components/schemas/KeyInfo'
          description: |
            Optional KMS-key rebinding. When omitted, the existing
            `providerId`/`alias`/`kid` are preserved. When supplied, each
            sub-field independently follows merge-patch semantics.
        expiresAt:
          type: string
          format: date-time
          nullable: true
          description: Updated expiration timestamp (null to clear).
        revokedAt:
          type: string
          format: date-time
          nullable: true
          description: |
            Set or clear the verification method revocation timestamp
            (DID 1.1 / CID). Setting this revokes the VM within the DID
            document; it does not revoke the underlying KMS key.
        valueVerificationRelation:
          allOf:
            - $ref: './did-manager-components.yml#/components/schemas/VerificationPurpose'
          nullable: true
          description: |
            Update the relationship into which this VM is embedded by
            value (null ⇒ render in the top-level `verificationMethod`
            array). At most one relationship per W3C semantics.
        referenceVerificationRelations:
          type: array
          items:
            $ref: './did-manager-components.yml#/components/schemas/VerificationPurpose'
          nullable: true
          description: |
            Replace the set of relationships that reference this VM by
            DID URL (null or empty ⇒ no reference-style relationships).
        extensionProperties:
          type: object
          additionalProperties: true
          nullable: true
          description: |
            Replace the verification method extension-property bag (null to
            clear). Used to preserve unknown DID 1.1 properties for lossless
            round-tripping.

    DidServiceCreateRequest:
      type: object
      description: Request body for creating a DID service.
      required:
        - id
        - type
        - serviceEndpoint
      properties:
        id:
          type: string
          description: Service identifier as it should appear in the DID document.
        type:
          description: Service type (string or array of strings).
          oneOf:
            - type: string
            - type: array
              items:
                type: string
        serviceEndpoint:
          description: Service endpoint (URI string, object, or array).
          oneOf:
            - type: string
            - type: object
              additionalProperties: true
            - type: array
              items:
                oneOf:
                  - type: string
                  - type: object
                    additionalProperties: true

    DidServiceUpdateRequest:
      type: object
      description: Request body for updating a DID service.
      properties:
        type:
          description: Updated service type.
          oneOf:
            - type: string
            - type: array
              items:
                type: string
        serviceEndpoint:
          description: Updated service endpoint.
          oneOf:
            - type: string
            - type: object
              additionalProperties: true
            - type: array
              items:
                oneOf:
                  - type: string
                  - type: object
                    additionalProperties: true

    KeyMappingCreateRequest:
      type: object
      description: |
        Request body for creating a key mapping binding a verification
        method to a KMS-managed key reference. `keyInfo.providerId` and at
        least one of `keyInfo.alias` or `keyInfo.kid` must be provided.
      required:
        - verificationMethod
        - keyInfo
        - purposes
      properties:
        verificationMethod:
          type: string
          description: Associated verification method identifier.
        keyInfo:
          $ref: '#/components/schemas/KeyInfo'
        purposes:
          type: array
          items:
            $ref: './did-manager-components.yml#/components/schemas/VerificationPurpose'
          description: Verification purposes this key mapping serves.

    ControllerCreateRequest:
      type: object
      description: Request body for adding a controller.
      required:
        - controllerDid
      properties:
        controllerDid:
          type: string
          description: The controller DID string.

    AlsoKnownAsCreateRequest:
      type: object
      description: Request body for adding an also-known-as resource.
      required:
        - akaUri
      properties:
        akaUri:
          type: string
          description: The also-known-as URI.

    EquivalentIdCreateRequest:
      type: object
      description: Request body for adding an equivalent-id resource.
      required:
        - equivalentDid
      properties:
        equivalentDid:
          type: string
          description: The equivalent DID string.

    # ── List response wrappers ─────────────────────────────────────
    DidListResponse:
      type: object
      description: Paginated list of DIDs.
      required:
        - items
        - page
      properties:
        items:
          type: array
          items:
            $ref: './did-manager-components.yml#/components/schemas/Did'
        page:
          $ref: './common-components.yml#/components/schemas/PagingMeta'

    VerificationMethodListResponse:
      type: object
      description: List of verification methods.
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: './did-manager-components.yml#/components/schemas/VerificationMethod'

    VerificationRelationshipListResponse:
      type: object
      description: |
        Derived per-purpose view of the DID's verification relationships.
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: './did-manager-components.yml#/components/schemas/VerificationRelationshipView'

    DidServiceListResponse:
      type: object
      description: List of DID services.
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: './did-manager-components.yml#/components/schemas/DidDocumentService'

    KeyMappingListResponse:
      type: object
      description: List of key mappings.
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: './did-manager-components.yml#/components/schemas/KeyMapping'

    ControllerListResponse:
      type: object
      description: List of controllers.
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: './did-manager-components.yml#/components/schemas/Controller'

    AlsoKnownAsListResponse:
      type: object
      description: List of also-known-as entries.
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: './did-manager-components.yml#/components/schemas/AlsoKnownAsEntry'

    EquivalentIdListResponse:
      type: object
      description: List of equivalent-id entries.
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: './did-manager-components.yml#/components/schemas/EquivalentIdEntry'

    DidMethodCapabilities:
      $ref: './did-manager-components.yml#/components/schemas/DidMethodCapabilities'

    MethodCapabilityListResponse:
      type: object
      description: List of DID method capability snapshots.
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: './did-manager-components.yml#/components/schemas/DidMethodCapabilities'

    MethodCapabilitySummary:
      type: object
      description: |
        Coarse-grained boolean snapshot of what a DID method can do, suitable
        for client-side feature gating.
      required:
        - method
        - canCreate
        - canUpdate
        - canDeactivate
        - canDelete
        - isImmutable
        - isMutable
        - supportsKeyManagement
        - supportsServiceManagement
        - allowsCaching
      properties:
        method:
          type: string
        canCreate:
          type: boolean
        canUpdate:
          type: boolean
        canDeactivate:
          type: boolean
        canDelete:
          type: boolean
        isImmutable:
          type: boolean
        isMutable:
          type: boolean
        supportsKeyManagement:
          type: boolean
        supportsServiceManagement:
          type: boolean
        allowsCaching:
          type: boolean

    # ── DIF-compatible resolution schemas (from did-manager-components.yml) ──
    ResolutionResult:
      $ref: './did-manager-components.yml#/components/schemas/ResolutionResult'
    DidResolutionMetadata:
      $ref: './did-manager-components.yml#/components/schemas/DidResolutionMetadata'
    DidDocumentMetadata:
      $ref: './did-manager-components.yml#/components/schemas/DidDocumentMetadata'
    DereferencingResult:
      $ref: './did-manager-components.yml#/components/schemas/DereferencingResult'
    DereferencingMetadata:
      $ref: './did-manager-components.yml#/components/schemas/DereferencingMetadata'
    ResolutionError:
      $ref: './did-manager-components.yml#/components/schemas/ResolutionError'
