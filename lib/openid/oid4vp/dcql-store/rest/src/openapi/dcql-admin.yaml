openapi: 3.1.0
info:
  title: OID4VP DCQL Query Configuration Admin API
  version: 1.0.0
  description: >
    Administration API for stored DCQL (Digital Credentials Query Language) query
    configurations used by the OID4VP 1.0 verifier. Each configuration is referenced
    by a stable `queryId` and holds a DCQL query plus presentation metadata.

    This is the IDK-level, single-verifier surface: configurations are CRUD-managed
    per tenant, with no version history and no verifier binding. Version history and
    multi-verifier binding are layered on by EDK and VDX respectively.

    The tenant is resolved from the OIDC bearer token; `X-Tenant-Id` / `X-User-Id`
    headers, if present, are informational only and never used for authorization or
    tenant resolution.
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0

servers:
  - url: /api/v1/oid4vp
    description: OID4VP verifier API, version 1

security:
  - bearerAuth: []

tags:
  - name: oid4vp-dcql
    description: DCQL query configuration administration

paths:
  /dcql:
    get:
      tags: [oid4vp-dcql]
      operationId: listDcqlQueries
      summary: List DCQL query configurations
      description: Returns every DCQL query configuration for the authenticated tenant, ordered by `queryId`.
      responses:
        "200":
          description: The tenant's DCQL query configurations.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DcqlQueryConfiguration"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [oid4vp-dcql]
      operationId: createDcqlQuery
      summary: Create a DCQL query configuration
      description: >
        Creates a new DCQL query configuration. Fails with `409` if a configuration
        with the same `queryId` already exists for the tenant.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDcqlQueryRequest"
      responses:
        "201":
          description: The created DCQL query configuration.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DcqlQueryConfiguration"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"

  /dcql/{queryId}:
    parameters:
      - $ref: "#/components/parameters/QueryId"
    get:
      tags: [oid4vp-dcql]
      operationId: getDcqlQuery
      summary: Get a DCQL query configuration
      responses:
        "200":
          description: The requested DCQL query configuration.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DcqlQueryConfiguration"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [oid4vp-dcql]
      operationId: replaceDcqlQuery
      summary: Replace a DCQL query configuration
      description: >
        Replaces a DCQL query configuration in full. A `PUT` caller is expected to
        supply every mutable field; any field omitted (null) leaves the stored value
        unchanged. Fails with `404` if the configuration does not exist.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateDcqlQueryRequest"
      responses:
        "200":
          description: The updated DCQL query configuration.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DcqlQueryConfiguration"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [oid4vp-dcql]
      operationId: patchDcqlQuery
      summary: Partially update a DCQL query configuration
      description: >
        Partially updates a DCQL query configuration. Only the supplied (non-null)
        fields are changed. Fails with `404` if the configuration does not exist.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateDcqlQueryRequest"
      responses:
        "200":
          description: The updated DCQL query configuration.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DcqlQueryConfiguration"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [oid4vp-dcql]
      operationId: deleteDcqlQuery
      summary: Delete a DCQL query configuration
      responses:
        "204":
          description: The configuration was deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: OIDC bearer access token. The tenant is resolved from this token.

  parameters:
    QueryId:
      name: queryId
      in: path
      required: true
      description: Stable identifier of the DCQL query configuration.
      schema:
        type: string
        minLength: 1

  responses:
    BadRequest:
      description: The request body was missing or malformed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: The request lacked a valid bearer token.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: No DCQL query configuration exists for the given `queryId`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: A DCQL query configuration with the same `queryId` already exists.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    DcqlQueryConfiguration:
      type: object
      description: A stored DCQL query configuration, referenced by `queryId`.
      required: [queryId, name, dcqlQuery, enabled, createdAt, updatedAt]
      properties:
        queryId:
          type: string
          description: Stable identifier for the configuration.
          example: einvoice
        name:
          type: string
          description: Human-readable name.
          example: eInvoice verification
        description:
          type: string
          nullable: true
          description: Optional free-text description of the configuration's purpose.
        dcqlQuery:
          $ref: "#/components/schemas/DcqlQuery"
        enabled:
          type: boolean
          description: Whether the configuration is available for use.
        createdAt:
          type: integer
          format: int64
          description: Creation timestamp, epoch milliseconds.
        updatedAt:
          type: integer
          format: int64
          description: Last-update timestamp, epoch milliseconds.

    CreateDcqlQueryRequest:
      type: object
      description: Request body for creating a DCQL query configuration.
      required: [queryId, name, dcqlQuery]
      properties:
        queryId:
          type: string
          minLength: 1
          description: Stable identifier for the new configuration. Must be unique within the tenant.
        name:
          type: string
          description: Human-readable name.
        description:
          type: string
          nullable: true
          description: Optional free-text description.
        dcqlQuery:
          $ref: "#/components/schemas/DcqlQuery"
        enabled:
          type: boolean
          default: true
          description: Whether the configuration is available for use. Defaults to true.

    UpdateDcqlQueryRequest:
      type: object
      description: >
        Request body for replacing or partially updating a DCQL query configuration.
        The `queryId` is taken from the path, never the body. A null/omitted field
        leaves the corresponding stored value unchanged.
      properties:
        name:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        dcqlQuery:
          oneOf:
            - $ref: "#/components/schemas/DcqlQuery"
            - type: "null"
        enabled:
          type: boolean
          nullable: true

    DcqlQuery:
      type: object
      description: >
        An OpenID4VP 1.0 DCQL query. At least one of `credentials` or
        `credential_sets` must be present. See the OpenID4VP 1.0 specification,
        section 6 (Digital Credentials Query Language), for the full grammar.
      properties:
        credentials:
          type: array
          description: The credentials requested by the verifier.
          items:
            $ref: "#/components/schemas/DcqlCredentialQuery"
        credential_sets:
          type: array
          description: Combinations of credentials that satisfy the verifier's request.
          items:
            type: object
            additionalProperties: true
      anyOf:
        - required: [credentials]
        - required: [credential_sets]

    DcqlCredentialQuery:
      type: object
      description: A single credential requested within a DCQL query.
      required: [id]
      properties:
        id:
          type: string
          description: Identifier for this credential query, unique within the DCQL query.
        format:
          type: string
          nullable: true
          description: Requested credential format, e.g. `dc+sd-jwt`, `mso_mdoc`.
        meta:
          type: object
          nullable: true
          additionalProperties: true
          description: Format-specific metadata constraints.
        claims:
          type: array
          nullable: true
          items:
            $ref: "#/components/schemas/DcqlClaimQuery"
        claim_sets:
          type: array
          nullable: true
          description: Combinations of claims that satisfy this credential query.
          items:
            type: object
            additionalProperties: true
        require_cryptographic_holder_binding:
          type: boolean
          default: true
          description: Whether the credential must be cryptographically bound to the holder.
        multiple:
          type: boolean
          default: false
          description: Whether multiple credentials may be returned for this query.
        trusted_authorities:
          type: array
          nullable: true
          description: Trusted authority constraints for the requested credential.
          items:
            type: object
            additionalProperties: true

    DcqlClaimQuery:
      type: object
      description: A claim requested within a credential query.
      required: [path]
      properties:
        path:
          type: array
          description: JSON path components addressing the requested claim.
          items:
            type: string
        values:
          type: array
          nullable: true
          description: If present, the claim value must match one of these values.
          items: {}
        intent_to_retain:
          type: boolean
          nullable: true
          description: Whether the verifier intends to retain the claim value.

    ErrorResponse:
      type: object
      description: >
        Error payload rendered from the internal `IdkError` by the transport layer.
        The exact shape is owned by the transport error renderer; `code` and
        `message` are always present.
      required: [code, message]
      properties:
        code:
          type: string
          description: Stable error code.
          example: NOT_FOUND_ERROR
        message:
          type: string
          description: Human-readable error description.
