  /sourcebindings:
    post:
      tags: [SourceBindings]
      summary: Bind a registered connector to data-domain business terms
      operationId: createSemanticSourceBinding
      x-license-protection:
        entitlementKey: vdx.semantic.binding.create-source-binding
        deploymentShapePredicates: [packaging=container, environment=production]
        protectionMode: licensed
      description: |
        Binds a registered connector/software party carrying a `CONNECTOR`
        capability to business terms in a version-pinned data domain. The connector's native fields map onto
        business-term paths and inherit those terms' governance overlays; whether the resolved
        values are stored or only referenced is controlled by `materialization`. The id, tenant and
        timestamps are assigned by the command (tenant from the session).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSemanticSourceBindingInput'
      responses:
        '201':
          description: Source binding created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SemanticSourceBinding'
        '400':
          $ref: './common-components.yml#/components/responses/ValidationError'
        '401':
          $ref: './common-components.yml#/components/responses/Unauthorized'
        '500':
          $ref: './common-components.yml#/components/responses/Error'
