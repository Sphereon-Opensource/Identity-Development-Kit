openapi: 3.0.4
info:
  title: Semantic Binding API
  version: 0.1.0
  # Enterprise license coverage is declared per operation with `x-license-protection`, so the
  # OpenAPI contract can drift-check against static ServiceCommandContract license descriptors.
  description: |
    Connect existing records to concepts defined by data domains and object models. The records
    are the parties in the directory (people, organizations, and systems),
    the relationships between them, the services that act on them, and the external data sources
    they read from. A binding annotates a record in place; it does not copy or restructure the
    record, so data-domain governance and interoperability rules apply wherever the data is held.

    Five kinds of binding are managed through this API:

      - **Party-type bindings** declare that a kind of record (a party type, optionally a subtype)
        stands for a particular data-domain or object-model concept, so every record of that type inherits
        that meaning.
      - **Party attribute values** attach a semantically-keyed value to one specific record,
        addressed by its data-domain or object-model business-term path. The value keeps its meaning and may be a
        scalar, an array, or a nested object.
      - **Relationship bindings** map a relationship between two records (a subject and an object, of
        a governed relation type) to an object-model relationship, which gives it its use-case meaning.
      - **Service capabilities** record which concepts, object models, data products, and channels a service can
        work with.
      - **Source bindings** connect a registered data source (a system or service that holds
        business-term data) to the terms of a version-pinned data domain, so the source's fields inherit
        those terms' governance rules. The values are either copied in or only referenced in
        place (see `MaterializationPolicy`).

    All changes require the `semantic-modeling.v1` enterprise entitlement.
servers:
  - url: http://localhost:8080/api/semantic/binding/v1
    description: Local development.
security:
  - bearer: []
tags:
  - name: PartyTypeBindings
    description: Map a kind of record (a party type, optionally a subtype) to a data-domain or object-model concept.
  - name: PartyAttributeValues
    description: Attach semantically-keyed attribute values to specific party records.
  - name: RelationshipBindings
    description: Map a relationship between two records to an object-model relationship.
  - name: ServiceCapabilities
    description: Declare which concepts, object models, data products, and channels a service can work with.
  - name: SourceBindings
    description: Bind a registered data source to business terms in a version-pinned data domain.
paths:
  /partytypebindings:
    post:
      tags: [PartyTypeBindings]
      summary: Create a semantic party-type binding
      operationId: createSemanticPartyTypeBinding
      x-license-protection:
        entitlementKey: vdx.semantic.binding.create-party-type-binding
        deploymentShapePredicates: [packaging=container, environment=production]
        protectionMode: licensed
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSemanticPartyTypeBindingInput'
      responses:
        '201':
          description: Party-type binding created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SemanticPartyTypeBinding'
        '400':
          $ref: './common-components.yml#/components/responses/ValidationError'
        '401':
          $ref: './common-components.yml#/components/responses/Unauthorized'
        '500':
          $ref: './common-components.yml#/components/responses/Error'
    get:
      tags: [PartyTypeBindings]
      summary: List semantic party-type bindings
      operationId: listSemanticPartyTypeBindings
      x-license-protection:
        entitlementKey: vdx.semantic.binding.list-party-type-bindings
        deploymentShapePredicates: [packaging=container, environment=production]
        protectionMode: licensed
      description: |
        Returns a page of party-type bindings in the calling tenant, narrowed by the optional
        filter. Pagination accepts both `limit`/`offset` and OpenAPI-style `page`/`size`; the
        parser normalises and clamps `limit` to `[1, 100]` (default `20`). Default sort is
        `createdAt DESC`.
      parameters:
        - name: partyType
          in: query
          description: Restrict to bindings whose party type equals this exact value.
          schema:
            type: string
        - name: partySubtype
          in: query
          description: Restrict to bindings whose CTI subtype equals this exact value.
          schema:
            type: string
        - $ref: './common-components.yml#/components/parameters/Limit'
        - $ref: './common-components.yml#/components/parameters/Offset'
        - $ref: './common-components.yml#/components/parameters/Page'
        - $ref: './common-components.yml#/components/parameters/Size'
        - $ref: './common-components.yml#/components/parameters/Sort'
        - $ref: './common-components.yml#/components/parameters/SortDirection'
      responses:
        '200':
          description: Page of party-type bindings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SemanticPartyTypeBindingPageResponse'
        '400':
          $ref: './common-components.yml#/components/responses/ValidationError'
        '401':
          $ref: './common-components.yml#/components/responses/Unauthorized'
        '500':
          $ref: './common-components.yml#/components/responses/Error'

  /partytypebindings/{id}:
    parameters:
      - $ref: '#/components/parameters/BindingId'
    get:
      tags: [PartyTypeBindings]
      summary: Get one semantic party-type binding
      operationId: getSemanticPartyTypeBinding
      x-license-protection:
        entitlementKey: vdx.semantic.binding.get-party-type-binding
        deploymentShapePredicates: [packaging=container, environment=production]
        protectionMode: licensed
      responses:
        '200':
          description: Party-type binding.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SemanticPartyTypeBinding'
        '401':
          $ref: './common-components.yml#/components/responses/Unauthorized'
        '404':
          $ref: './common-components.yml#/components/responses/NotFound'
        '500':
          $ref: './common-components.yml#/components/responses/Error'
    put:
