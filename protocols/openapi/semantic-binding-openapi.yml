      operationId: updateSemanticPartyTypeBinding
      x-license-protection:
        entitlementKey: vdx.semantic.binding.update-party-type-binding
        deploymentShapePredicates: [packaging=container, environment=production]
        protectionMode: licensed
      requestBody:
        required: true
        content:
          application/json:
            schema:
