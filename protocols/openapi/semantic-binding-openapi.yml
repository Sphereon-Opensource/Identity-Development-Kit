      summary: List semantic source bindings
      operationId: listSemanticSourceBindings
      x-license-protection:
        entitlementKey: vdx.semantic.binding.list-source-bindings
        deploymentShapePredicates: [packaging=container, environment=production]
        protectionMode: licensed
      description: |
        Returns a page of source bindings in the calling tenant, optionally scoped to a source party
        and/or the bound data domain. Pagination accepts both `limit`/`offset` and OpenAPI-style
        `page`/`size`; `limit` is clamped to `[1, 100]` (default `20`). Default sort is `createdAt DESC`.
      parameters:
        - name: sourcePartyId
          in: query
          description: Restrict to bindings whose connector is this exact software/server party.
          schema:
            type: string
            format: uuid
        - name: catalogId
          in: query
          description: Restrict to bindings whose bound data domain has this exact id.
          schema:
            type: string
            format: uuid
        - $ref: './common-components.yml#/components/parameters/Limit'
        - $ref: './common-components.yml#/components/parameters/Offset'
        - $ref: './common-components.yml#/components/parameters/Page'
        - $ref: './common-components.yml#/components/parameters/Size'
        - $ref: './common-components.yml#/components/parameters/Sort'
        - $ref: './common-components.yml#/components/parameters/SortDirection'
      responses:
