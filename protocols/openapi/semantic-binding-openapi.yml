        '401':
          $ref: './common-components.yml#/components/responses/Unauthorized'
        '500':
          $ref: './common-components.yml#/components/responses/Error'

  /servicecapabilities/{id}:
    parameters:
      - $ref: '#/components/parameters/BindingId'
    get:
      tags: [ServiceCapabilities]
      summary: Get one semantic service capability
      operationId: getSemanticServiceCapability
      x-license-protection:
        entitlementKey: vdx.semantic.binding.get-service-capability
        deploymentShapePredicates: [packaging=container, environment=production]
        protectionMode: licensed
      responses:
        '200':
          description: Service capability.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SemanticServiceCapability'
        '401':
          $ref: './common-components.yml#/components/responses/Unauthorized'
        '404':
          $ref: './common-components.yml#/components/responses/NotFound'
        '500':
          $ref: './common-components.yml#/components/responses/Error'
    put:
      tags: [ServiceCapabilities]
      summary: Update a semantic service capability
      operationId: updateSemanticServiceCapability
      x-license-protection:
