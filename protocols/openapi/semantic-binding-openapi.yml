          description: Page of source bindings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SemanticSourceBindingPageResponse'
        '400':
          $ref: './common-components.yml#/components/responses/ValidationError'
        '401':
          $ref: './common-components.yml#/components/responses/Unauthorized'
        '500':
          $ref: './common-components.yml#/components/responses/Error'

  /sourcebindings/{id}:
    parameters:
      - $ref: '#/components/parameters/BindingId'
    get:
      tags: [SourceBindings]
      summary: Get one semantic source binding
      operationId: getSemanticSourceBinding
      x-license-protection:
        entitlementKey: vdx.semantic.binding.get-source-binding
        deploymentShapePredicates: [packaging=container, environment=production]
        protectionMode: licensed
      responses:
        '200':
          description: Source binding.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SemanticSourceBinding'
        '401':
          $ref: './common-components.yml#/components/responses/Unauthorized'
        '404':
          $ref: './common-components.yml#/components/responses/NotFound'
        '500':
          $ref: './common-components.yml#/components/responses/Error'
    put:
      tags: [SourceBindings]
      summary: Update a semantic source binding
      operationId: updateSemanticSourceBinding
      x-license-protection:
        entitlementKey: vdx.semantic.binding.update-source-binding
        deploymentShapePredicates: [packaging=container, environment=production]
        protectionMode: licensed
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSemanticSourceBindingInput'
      responses:
        '200':
          description: Updated source binding.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SemanticSourceBinding'
        '400':
          $ref: './common-components.yml#/components/responses/ValidationError'
        '401':
          $ref: './common-components.yml#/components/responses/Unauthorized'
        '404':
          $ref: './common-components.yml#/components/responses/NotFound'
        '500':
          $ref: './common-components.yml#/components/responses/Error'
    delete:
      tags: [SourceBindings]
      summary: Soft-delete a semantic source binding
      operationId: deleteSemanticSourceBinding
      x-license-protection:
        entitlementKey: vdx.semantic.binding.delete-source-binding
        deploymentShapePredicates: [packaging=container, environment=production]
        protectionMode: licensed
      responses:
        '204':
          description: Source binding soft-deleted.
        '401':
          $ref: './common-components.yml#/components/responses/Unauthorized'
        '404':
          $ref: './common-components.yml#/components/responses/NotFound'
        '500':
          $ref: './common-components.yml#/components/responses/Error'

components:
  # Shared parameters (TenantId), pagination params (Limit/Offset/Page/Size/Sort/SortDirection),
  # error responses (NotFound/ValidationError/Unauthorized/Forbidden/Error), and the
  # ApiError/ErrorResponse/PageMeta schemas are defined in the canonical shared
  # ./common-components.yml (owned by IDK lib-core-api-public, copied in at build time).
  # Only semantic-binding-specific components are defined locally below.
  parameters:
    BindingId:
      $ref: './semantic-binding-components.yml#/components/parameters/BindingId'

  schemas:
    # ---- Shared reference value objects ----------------------------------
    SemanticConceptRefKind:
      $ref: './semantic-binding-components.yml#/components/schemas/SemanticConceptRefKind'

    SemanticConceptRef:
      $ref: './semantic-binding-components.yml#/components/schemas/SemanticConceptRef'

    ProfileRelationRef:
      $ref: './semantic-binding-components.yml#/components/schemas/ProfileRelationRef'

    # ---- Party-type binding ----------------------------------------------
    SemanticPartyTypeBinding:
      $ref: './semantic-binding-components.yml#/components/schemas/SemanticPartyTypeBinding'

    CreateSemanticPartyTypeBindingInput:
      type: object
      description: |
        Input for creating a party-type binding. The id, tenant and timestamps are assigned by the
        command (tenant from the session); only the authored fields are accepted.
      required: [partyType, semanticConceptRef]
      example:
        partyType: "natural_person"
        partySubtype: "employee"
        semanticConceptRef:
          kind: CATALOG_ATTRIBUTE
          catalogId: "9f2c1b3e-7a44-4c1e-8b0a-2d6f5e9c1a77"
      properties:
        partyType:
          type: string
        partySubtype:
          type: string
          nullable: true
        semanticConceptRef:
          $ref: '#/components/schemas/SemanticConceptRef'

    UpdateSemanticPartyTypeBindingInput:
      type: object
      description: |
        Input for updating the mutable fields of a party-type binding. The path `{id}` identifies
        the record and overrides any `id` in the body.
      required: [partyType, semanticConceptRef]
      properties:
        partyType:
          type: string
        partySubtype:
          type: string
          nullable: true
        semanticConceptRef:
          $ref: '#/components/schemas/SemanticConceptRef'

    SemanticPartyTypeBindingPageResponse:
      type: object
      description: Paged list of party-type bindings.
      required: [data, pagination]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/SemanticPartyTypeBinding'
        pagination:
          $ref: './common-components.yml#/components/schemas/PageMeta'

    # ---- Party attribute value -------------------------------------------
    SemanticPartyAttributeValue:
      $ref: './semantic-binding-components.yml#/components/schemas/SemanticPartyAttributeValue'

    CreateSemanticPartyAttributeValueInput:
      type: object
      description: |
        Input for creating a party attribute value. The `value` may be a scalar, array, or nested
        object. The id, tenant and timestamps are assigned by the command (tenant from the session).
      required: [partyId, conceptRef, attributePath, value]
      example:
        partyId: "3a2b1c0d-9e8f-4a7b-8c6d-5e4f3a2b1c0d"
        conceptRef:
          kind: CATALOG_ATTRIBUTE
          catalogId: "9f2c1b3e-7a44-4c1e-8b0a-2d6f5e9c1a77"
          attributePath: "address.postalCode"
        attributePath: "address.postalCode"
        value: "1011AB"
      properties:
        partyId:
          type: string
          format: uuid
        conceptRef:
          $ref: '#/components/schemas/SemanticConceptRef'
        attributePath:
          type: string
          description: Dot-separated attribute path (e.g. `address.postal_code`).
        value:
          description: The attribute value as arbitrary JSON (scalar, array, or nested object).

    UpdateSemanticPartyAttributeValueInput:
      type: object
      description: |
        Input for updating the mutable fields of a party attribute value. The path `{id}` identifies
        the record and overrides any `id` in the body.
      required: [partyId, conceptRef, attributePath, value]
      properties:
        partyId:
          type: string
          format: uuid
        conceptRef:
          $ref: '#/components/schemas/SemanticConceptRef'
        attributePath:
          type: string
          description: Dot-separated attribute path (e.g. `address.postal_code`).
        value:
          description: The attribute value as arbitrary JSON (scalar, array, or nested object).

    SemanticPartyAttributeValuePageResponse:
      type: object
      description: Paged list of party attribute values.
      required: [data, pagination]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/SemanticPartyAttributeValue'
        pagination:
          $ref: './common-components.yml#/components/schemas/PageMeta'

    # ---- Relationship binding --------------------------------------------
    SemanticRelationshipBinding:
      $ref: './semantic-binding-components.yml#/components/schemas/SemanticRelationshipBinding'

    CreateSemanticRelationshipBindingInput:
      type: object
      description: |
        Input for creating a relationship binding. The create command validates `relationType`
        against the relationship-type registry and, when the optional endpoint party types are
        supplied, checks endpoint compatibility. The id, tenant and timestamps are assigned by the
        command (tenant from the session).
      required: [subjectPartyId, objectPartyId, relationType]
      example:
        subjectPartyId: "3a2b1c0d-9e8f-4a7b-8c6d-5e4f3a2b1c0d"
        objectPartyId: "7c1d2e3f-4a5b-4c6d-8e9f-0a1b2c3d4e5f"
        relationType: "employed-by"
        subjectPartyType: "natural_person"
        objectPartyType: "organization"
      properties:
        subjectPartyId:
          type: string
          format: uuid
        objectPartyId:
          type: string
          format: uuid
        relationType:
          type: string
        relationshipInstanceId:
          type: string
          format: uuid
          nullable: true
        profileRelationRef:
          allOf:
            - $ref: '#/components/schemas/ProfileRelationRef'
          type: object
          nullable: true
        subjectPartyType:
          type: string
          nullable: true
          description: Optional semantic party type of the subject endpoint, for the endpoint-compatibility check; null skips it.
        objectPartyType:
          type: string
          nullable: true
          description: Optional semantic party type of the object endpoint; null skips it.

    UpdateSemanticRelationshipBindingInput:
      type: object
      description: |
        Input for updating the mutable fields of a relationship binding; re-validates governance.
        The path `{id}` identifies the record and overrides any `id` in the body.
      required: [subjectPartyId, objectPartyId, relationType]
      properties:
        subjectPartyId:
          type: string
          format: uuid
        objectPartyId:
          type: string
          format: uuid
        relationType:
          type: string
        relationshipInstanceId:
          type: string
          format: uuid
          nullable: true
        profileRelationRef:
          allOf:
            - $ref: '#/components/schemas/ProfileRelationRef'
          type: object
          nullable: true
        subjectPartyType:
          type: string
          nullable: true
        objectPartyType:
          type: string
          nullable: true

    SemanticRelationshipBindingPageResponse:
      type: object
      description: Paged list of relationship bindings.
      required: [data, pagination]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/SemanticRelationshipBinding'
        pagination:
          $ref: './common-components.yml#/components/schemas/PageMeta'

    # ---- Service capability ----------------------------------------------
    SemanticServiceCapability:
      $ref: './semantic-binding-components.yml#/components/schemas/SemanticServiceCapability'

    CreateSemanticServiceCapabilityInput:
      type: object
      description: |
        Input for creating a service capability. The id, tenant and timestamps are assigned by the
        command (tenant from the session).
      required: [serviceId]
      example:
        serviceId: "issuer-employee-badge"
        supportedProfileIds: ["c4d5e6f7-8a9b-4c0d-8e1f-2a3b4c5d6e7f"]
        supportedConcepts:
          - kind: PROFILE
            profileId: "c4d5e6f7-8a9b-4c0d-8e1f-2a3b4c5d6e7f"
      properties:
        serviceId:
          type: string
        supportedProfileIds:
          type: array
          items:
            type: string
            format: uuid
          default: []
        supportedSetIds:
          type: array
          items:
            type: string
            format: uuid
          default: []
        supportedChannelIds:
          type: array
          items:
            type: string
            format: uuid
          default: []
        supportedConcepts:
          type: array
          items:
            $ref: '#/components/schemas/SemanticConceptRef'
          default: []

    UpdateSemanticServiceCapabilityInput:
      type: object
      description: |
        Input for updating the mutable fields of a service capability. The path `{id}` identifies
        the record and overrides any `id` in the body.
      required: [serviceId]
      properties:
        serviceId:
          type: string
        supportedProfileIds:
          type: array
          items:
            type: string
            format: uuid
          default: []
        supportedSetIds:
          type: array
          items:
            type: string
            format: uuid
          default: []
        supportedChannelIds:
          type: array
          items:
            type: string
            format: uuid
          default: []
        supportedConcepts:
          type: array
          items:
            $ref: '#/components/schemas/SemanticConceptRef'
          default: []

    SemanticServiceCapabilityPageResponse:
      type: object
      description: Paged list of service capabilities.
      required: [data, pagination]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/SemanticServiceCapability'
        pagination:
          $ref: './common-components.yml#/components/schemas/PageMeta'

    # ---- Source binding --------------------------------------------------
    MaterializationPolicy:
      $ref: './semantic-binding-components.yml#/components/schemas/MaterializationPolicy'
    DataDomainRef:
      $ref: './semantic-binding-components.yml#/components/schemas/DataDomainRef'
    AttributeTransformKind:
      $ref: './semantic-binding-components.yml#/components/schemas/AttributeTransformKind'
    AttributeTransform:
      $ref: './semantic-binding-components.yml#/components/schemas/AttributeTransform'
    SourceFieldMapping:
      $ref: './semantic-binding-components.yml#/components/schemas/SourceFieldMapping'
    SourceEntityBinding:
      $ref: './semantic-binding-components.yml#/components/schemas/SourceEntityBinding'
    SemanticSourceBinding:
      $ref: './semantic-binding-components.yml#/components/schemas/SemanticSourceBinding'

    CreateSemanticSourceBindingInput:
      type: object
      description: |
        Input for creating a source binding. The id, tenant and timestamps are assigned by the command
        (tenant from the session). The nested entity/field-mapping structure is persisted as JSON.
      required: [name, sourcePartyId, capabilityId, catalogRef]
      example:
        name: "HR system - employee attributes"
        sourcePartyId: "6d9c2a1b-3e44-4f12-9a0b-1c2d3e4f5a6b"
        capabilityId: "b1e2c3d4-5f60-4a71-8b92-0c1d2e3f4a5b"
        catalogRef:
          dataDomainId: "9f2c1b3e-7a44-4c1e-8b0a-2d6f5e9c1a77"
          dataDomainVersion: 3
        materialization: REFERENCE_ONLY
        entityBindings:
          - entity: "Employee"
            fieldMappings:
              - sourceField: "emp_given_name"
                attributePath: "givenName"
              - sourceField: "emp_dept"
                attributePath: "department"
                transform:
                  kind: RENAME_ONLY
      properties:
        name:
          type: string
          description: Human-readable binding name; must be non-blank.
        sourcePartyId:
          type: string
          format: uuid
          description: The software/server party that carries the `CONNECTOR` capability.
        capabilityId:
          type: string
          format: uuid
          description: The `CONNECTOR` capability id on that party.
        catalogRef:
          $ref: '#/components/schemas/DataDomainRef'
        entityBindings:
          type: array
          description: Per-object-type field mappings from source-native fields onto business terms.
          default: []
          items:
            $ref: '#/components/schemas/SourceEntityBinding'
        materialization:
          allOf:
            - $ref: '#/components/schemas/MaterializationPolicy'
          default: REFERENCE_ONLY
          description: Whether resolved values are stored or only referenced for governance overlay.

    UpdateSemanticSourceBindingInput:
      type: object
      description: |
        Input for updating the mutable fields of a source binding. The path `{id}` identifies the
        record and overrides any `id` in the body.
      required: [name, sourcePartyId, capabilityId, catalogRef]
      properties:
        name:
          type: string
        sourcePartyId:
          type: string
          format: uuid
        capabilityId:
          type: string
          format: uuid
        catalogRef:
          $ref: '#/components/schemas/DataDomainRef'
        entityBindings:
          type: array
          default: []
          items:
            $ref: '#/components/schemas/SourceEntityBinding'
        materialization:
          allOf:
            - $ref: '#/components/schemas/MaterializationPolicy'
          default: REFERENCE_ONLY

    SemanticSourceBindingPageResponse:
      type: object
      description: Paged list of source bindings.
      required: [data, pagination]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/SemanticSourceBinding'
        pagination:
          $ref: './common-components.yml#/components/schemas/PageMeta'

  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Bearer JWT token. Tenant context is resolved from this token.
