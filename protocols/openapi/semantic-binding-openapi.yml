      operationId: updateSemanticPartyAttributeValue
      x-license-protection:
        entitlementKey: vdx.semantic.binding.update-party-attribute-value
        deploymentShapePredicates: [packaging=container, environment=production]
        protectionMode: licensed
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSemanticPartyAttributeValueInput'
      responses:
        '200':
          description: Updated party attribute value.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SemanticPartyAttributeValue'
        '400':
          $ref: './common-components.yml#/components/responses/ValidationError'
        '401':
          $ref: './common-components.yml#/components/responses/Unauthorized'
        '404':
