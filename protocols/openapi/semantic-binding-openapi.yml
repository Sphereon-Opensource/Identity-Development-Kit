  /relationshipbindings:
    post:
      tags: [RelationshipBindings]
      summary: Create a semantic relationship binding
      operationId: createSemanticRelationshipBinding
      x-license-protection:
        entitlementKey: vdx.semantic.binding.create-relationship-binding
        deploymentShapePredicates: [packaging=container, environment=production]
        protectionMode: licensed
      description: |
        Creates a relationship binding. The create command validates `relationType` against the
        the relationship-type registry and, when the optional endpoint party types are supplied,
        checks endpoint compatibility.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSemanticRelationshipBindingInput'
      responses:
        '201':
          description: Relationship binding created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SemanticRelationshipBinding'
        '400':
          $ref: './common-components.yml#/components/responses/ValidationError'
        '401':
          $ref: './common-components.yml#/components/responses/Unauthorized'
        '500':
          $ref: './common-components.yml#/components/responses/Error'
    get:
      tags: [RelationshipBindings]
      summary: List semantic relationship bindings
      operationId: listSemanticRelationshipBindings
      x-license-protection:
        entitlementKey: vdx.semantic.binding.list-relationship-bindings
        deploymentShapePredicates: [packaging=container, environment=production]
        protectionMode: licensed
      description: |
        Returns a page of relationship bindings in the calling tenant, optionally scoped to a
        subject party, object party, and/or governed relation type (e.g. to read all roles a
        given subject party holds). Pagination accepts both `limit`/`offset` and OpenAPI-style
        `page`/`size`; `limit` is clamped to `[1, 100]` (default `20`). Default sort is
        `createdAt DESC`.
      parameters:
        - name: subjectPartyId
          in: query
          description: Restrict to bindings whose subject endpoint is this exact party.
          schema:
            type: string
            format: uuid
        - name: objectPartyId
          in: query
          description: Restrict to bindings whose object endpoint is this exact party.
          schema:
            type: string
            format: uuid
        - name: relationType
          in: query
          description: Restrict to bindings with this exact governed directed relation id.
          schema:
            type: string
        - $ref: './common-components.yml#/components/parameters/Limit'
        - $ref: './common-components.yml#/components/parameters/Offset'
        - $ref: './common-components.yml#/components/parameters/Page'
        - $ref: './common-components.yml#/components/parameters/Size'
        - $ref: './common-components.yml#/components/parameters/Sort'
        - $ref: './common-components.yml#/components/parameters/SortDirection'
      responses:
        '200':
          description: Page of relationship bindings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SemanticRelationshipBindingPageResponse'
        '400':
          $ref: './common-components.yml#/components/responses/ValidationError'
        '401':
          $ref: './common-components.yml#/components/responses/Unauthorized'
        '500':
          $ref: './common-components.yml#/components/responses/Error'

  /relationshipbindings/{id}:
    parameters:
      - $ref: '#/components/parameters/BindingId'
    get:
      tags: [RelationshipBindings]
      summary: Get one semantic relationship binding
      operationId: getSemanticRelationshipBinding
      x-license-protection:
        entitlementKey: vdx.semantic.binding.get-relationship-binding
        deploymentShapePredicates: [packaging=container, environment=production]
        protectionMode: licensed
      responses:
        '200':
          description: Relationship binding.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SemanticRelationshipBinding'
        '401':
          $ref: './common-components.yml#/components/responses/Unauthorized'
        '404':
          $ref: './common-components.yml#/components/responses/NotFound'
        '500':
          $ref: './common-components.yml#/components/responses/Error'
    put:
      tags: [RelationshipBindings]
      summary: Update a semantic relationship binding
      operationId: updateSemanticRelationshipBinding
      x-license-protection:
        entitlementKey: vdx.semantic.binding.update-relationship-binding
        deploymentShapePredicates: [packaging=container, environment=production]
        protectionMode: licensed
      description: Re-validates the governed relation type and endpoint compatibility before persisting.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSemanticRelationshipBindingInput'
      responses:
        '200':
          description: Updated relationship binding.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SemanticRelationshipBinding'
        '400':
          $ref: './common-components.yml#/components/responses/ValidationError'
        '401':
          $ref: './common-components.yml#/components/responses/Unauthorized'
        '404':
          $ref: './common-components.yml#/components/responses/NotFound'
        '500':
          $ref: './common-components.yml#/components/responses/Error'
    delete:
      tags: [RelationshipBindings]
      summary: Soft-delete a semantic relationship binding
      operationId: deleteSemanticRelationshipBinding
      x-license-protection:
        entitlementKey: vdx.semantic.binding.delete-relationship-binding
        deploymentShapePredicates: [packaging=container, environment=production]
        protectionMode: licensed
