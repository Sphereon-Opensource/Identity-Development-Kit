        party. Pagination accepts both `limit`/`offset` and OpenAPI-style `page`/`size`; `limit`
        is clamped to `[1, 100]` (default `20`). Default sort is `createdAt DESC`.
      parameters:
        - name: partyId
          in: query
          description: Restrict to values attached to this exact party record.
          schema:
            type: string
            format: uuid
        - $ref: './common-components.yml#/components/parameters/Limit'
        - $ref: './common-components.yml#/components/parameters/Offset'
        - $ref: './common-components.yml#/components/parameters/Page'
        - $ref: './common-components.yml#/components/parameters/Size'
        - $ref: './common-components.yml#/components/parameters/Sort'
        - $ref: './common-components.yml#/components/parameters/SortDirection'
      responses:
        '200':
          description: Page of party attribute values.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SemanticPartyAttributeValuePageResponse'
        '400':
