openapi: 3.0.4
info:
  title: Wallet Credential API Components
  version: 0.1.0
  description: Entity schemas, enums, and parameters for the Wallet Credential REST API.
paths: {}
components:
  parameters:
    WalletUnitId:
      name: walletUnitId
      in: path
      required: true
      description: Stable wallet unit identifier owning the credential store.
      schema:
        type: string
    CredentialRecordId:
      name: credentialRecordId
      in: path
      required: true
      description: Stable credential record identifier inside the wallet unit.
      schema:
        type: string

  schemas:
    StringMap:
      type: object
      description: String-valued metadata map. Keys are stable names; values are already serialized for transport.
      additionalProperties:
        type: string
      example:
        given_name: Given name

    CredentialFormat:
      type: string
      description: Credential format wire value as persisted with the credential record.
      enum: ['dc+sd-jwt', 'vc+sd-jwt', 'mso_mdoc', 'jwt_vc_json', 'jwt_vc_json-ld', 'ldp_vc']

    CredentialTypeRefKind:
      type: string
      description: Kind of the credential type reference value.
      enum: [SD_JWT_VCT, MDOC_DOCTYPE, W3C_VC_TYPE]

    CredentialTypeRefSource:
      type: string
      description: Source that produced the credential type reference.
      enum: [ISSUER_METADATA, CREDENTIAL_PAYLOAD, IMPORT_METADATA]

    CredentialTypeRef:
      type: object
      description: Typed reference to a credential type, such as an SD-JWT VC vct, an mdoc doctype, or a W3C VC type.
      required: [format, kind, value, source]
      example:
        format: dc+sd-jwt
        kind: SD_JWT_VCT
        value: urn:eudi:pid:1
        source: ISSUER_METADATA
        primary: true
        issuerScoped: false
      properties:
        format:
          $ref: '#/components/schemas/CredentialFormat'
        kind:
          $ref: '#/components/schemas/CredentialTypeRefKind'
        value:
          type: string
        source:
          $ref: '#/components/schemas/CredentialTypeRefSource'
        primary:
          type: boolean
          default: false
        issuerScoped:
          type: boolean
          default: false

    CredentialLifecycleState:
      type: string
      description: Persisted lifecycle state of a credential record or instance.
      enum: [PENDING, ACTIVE, SUSPENDED, EXPIRED, REVOKED, SUPERSEDED, DELETED]

    CredentialValidityState:
      type: string
      description: Validity state derived from the credential validity window at evaluation time.
      enum: [NOT_YET_VALID, VALID, EXPIRED, UNKNOWN]

    CredentialLifecycleSummary:
      type: object
      description: Compact lifecycle summary carried by the credential metadata sidecar.
      required: [lifecycleState, validityState]
      example:
        lifecycleState: ACTIVE
        validityState: VALID
        tombstone: false
      properties:
        lifecycleState:
          $ref: '#/components/schemas/CredentialLifecycleState'
        validityState:
          $ref: '#/components/schemas/CredentialValidityState'
        tombstone:
          type: boolean
          default: false

    IdentifierRef:
      type: object
      description: Typed reference to an identifier such as an issuer, subject, or relying party. The type is an extensible string token; core values include did, x509, jwk, and domain, and downstream deployments may register additional types.
      required: [type, value]
      example:
        type: did
        value: did:web:issuer.acme.example
      properties:
        type:
          type: string
          description: Extensible identifier type token, for example did, x509, jwk, domain, oid4vci_issuer.
        value:
          type: string
        identityIdentifierId:
          type: string
          nullable: true
          description: Opaque token linking this reference to a stored identity identifier. It is optional and never used for authorization decisions.

    CredentialLogoProperties:
      type: object
      description: Issuer-supplied logo display properties.
      properties:
        uri:
          type: string
          nullable: true
        alt_text:
          type: string
          nullable: true

    CredentialImageProperties:
      type: object
      description: Issuer-supplied image display properties.
      properties:
        uri:
          type: string
          nullable: true

    CredentialDisplayProperties:
      type: object
      description: One localized display entry for an issuer or a credential.
      required: [name]
      example:
        name: Person Identification Data
        locale: en-US
        background_color: '#101828'
        text_color: '#FFFFFF'
      properties:
        name:
          type: string
        locale:
          type: string
          nullable: true
        logo:
          $ref: '#/components/schemas/CredentialLogoProperties'
          nullable: true
        description:
          type: string
          nullable: true
        background_color:
          type: string
          nullable: true
        background_image:
          $ref: '#/components/schemas/CredentialImageProperties'
          nullable: true
        text_color:
          type: string
          nullable: true

    CredentialClaimDisplay:
      type: object
      description: Localized display name for one claim path.
      required: [name]
      properties:
        name:
          type: string
        locale:
          type: string
          nullable: true

    CredentialClaimMetadata:
      type: object
      description: Display metadata for one claim path inside the credential.
      required: [path]
      example:
        path: [given_name]
        mandatory: true
        value_type: string
        display:
          - name: Given name
            locale: en-US
      properties:
        path:
          type: array
          items:
            type: string
        mandatory:
          type: boolean
          nullable: true
        value_type:
          type: string
          nullable: true
        display:
          type: array
          items:
            $ref: '#/components/schemas/CredentialClaimDisplay'

    CredentialDisplayMetadata:
      type: object
      description: Display sidecar persisted with the credential record. It contains issuer display, credential display, and claim display metadata only, never claim values.
      properties:
        issuerDisplay:
          type: array
          items:
            $ref: '#/components/schemas/CredentialDisplayProperties'
        credentialDisplay:
          type: array
          items:
            $ref: '#/components/schemas/CredentialDisplayProperties'
        claims:
          type: array
          items:
            $ref: '#/components/schemas/CredentialClaimMetadata'

    CredentialStatusSnapshot:
      type: object
      description: Snapshot of the most recent credential status check, for example from a status list resolution.
      required: [status, checkedAt]
      example:
        status: VALID
        checkedAt: '2026-08-16T09:30:00Z'
        source: https://status.acme.example/lists/7
      properties:
        status:
          type: string
        checkedAt:
          type: string
          format: date-time
        source:
          type: string
          nullable: true

    CredentialMetadata:
      type: object
      description: Queryable wallet credential sidecar. It is stored separately from the credential body and intentionally contains only selection, display, and indexing data. Raw credential bodies never appear in this projection.
      required: [credentialRecordId, walletUnitId, issuerRef, format, credentialTypeRefs, lifecycleSummary, instanceCount, activeInstanceCount, boundInstanceCount, updatedAt]
      example:
        credentialRecordId: cred-9c41
        walletUnitId: wu-7f9d
        issuerRef:
          type: did
          value: did:web:issuer.acme.example
        subjectRefs: []
        format: dc+sd-jwt
        credentialTypeRefs:
          - format: dc+sd-jwt
            kind: SD_JWT_VCT
            value: urn:eudi:pid:1
            source: ISSUER_METADATA
            primary: true
        credentialConfigurationId: eu.europa.ec.eudi.pid.1
        display:
          issuerDisplay: []
          credentialDisplay:
            - name: Person Identification Data
              locale: en-US
          claims: []
        lifecycleSummary:
          lifecycleState: ACTIVE
          validityState: VALID
          tombstone: false
        instanceCount: 2
        activeInstanceCount: 1
        boundInstanceCount: 1
        issuedAt: '2026-08-01T10:00:00Z'
        expiresAt: '2027-08-01T10:00:00Z'
        updatedAt: '2026-08-16T09:30:00Z'
      properties:
        credentialRecordId:
          type: string
        walletUnitId:
          type: string
        issuerRef:
          $ref: '#/components/schemas/IdentifierRef'
        subjectRefs:
          type: array
          items:
            $ref: '#/components/schemas/IdentifierRef'
        format:
          $ref: '#/components/schemas/CredentialFormat'
        credentialTypeRefs:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/CredentialTypeRef'
        credentialConfigurationId:
          type: string
          nullable: true
        display:
          $ref: '#/components/schemas/CredentialDisplayMetadata'
        lifecycleSummary:
          $ref: '#/components/schemas/CredentialLifecycleSummary'
        instanceCount:
          type: integer
        activeInstanceCount:
          type: integer
        boundInstanceCount:
          type: integer
        issuedAt:
          type: string
          format: date-time
          nullable: true
        expiresAt:
          type: string
          format: date-time
          nullable: true
        updatedAt:
          type: string
          format: date-time

    ListWalletCredentialsResult:
      type: object
      description: Full filtered credential metadata set for one wallet unit.
      required: [entries]
      properties:
        entries:
          type: array
          items:
            $ref: '#/components/schemas/CredentialMetadata'

    WalletCredentialIssuerParty:
      type: object
      description: Safe, renderer-neutral issuer identity derived inside the authoritative profile boundary.
      required: [partyId, displayName]
      example:
        partyId: party-issuer-acme
        displayName: ACME Issuing Authority
        trustLabel: ETSI trusted list
        logoUri: https://issuer.acme.example/logo.png
      properties:
        partyId:
          type: string
        displayName:
          type: string
        trustLabel:
          type: string
          nullable: true
        logoUri:
          type: string
          nullable: true
          description: Issuer branding from the credential's persisted issuer metadata.

    WalletRichTextRunPresentation:
      type: object
      description: One styled text run inside a sanitized rich-text block.
      required: [text, bold, italic, underline]
      properties:
        text:
          type: string
        bold:
          type: boolean
        italic:
          type: boolean
        underline:
          type: boolean
        externalLink:
          type: string
          nullable: true

    WalletRichTextParagraphPresentation:
      type: object
      description: Paragraph block in the sanitized rich-text AST.
      required: [type, runs]
      properties:
        type:
          type: string
          enum: [paragraph]
        runs:
          type: array
          items:
            $ref: '#/components/schemas/WalletRichTextRunPresentation'

    WalletRichTextHeadingPresentation:
      type: object
      description: Heading block in the sanitized rich-text AST.
      required: [type, level, runs]
      properties:
        type:
          type: string
          enum: [heading]
        level:
          type: integer
          minimum: 1
          maximum: 6
        runs:
          type: array
          items:
            $ref: '#/components/schemas/WalletRichTextRunPresentation'

    WalletRichTextBlockPresentation:
      description: Sanitized renderer-neutral rich-text block, never arbitrary Markdown or HTML.
      oneOf:
        - $ref: '#/components/schemas/WalletRichTextParagraphPresentation'
        - $ref: '#/components/schemas/WalletRichTextHeadingPresentation'
      discriminator:
        propertyName: type
        mapping:
          paragraph: '#/components/schemas/WalletRichTextParagraphPresentation'
          heading: '#/components/schemas/WalletRichTextHeadingPresentation'

    WalletInfoValueTextPresentation:
      type: object
      description: Plain text claim value.
      required: [type, text]
      properties:
        type:
          type: string
          enum: [text]
        text:
          type: string

    WalletInfoValueRichTextPresentation:
      type: object
      description: Sanitized renderer-neutral rich-text claim value.
      required: [type, blocks]
      properties:
        type:
          type: string
          enum: [rich-text]
        blocks:
          type: array
          items:
            $ref: '#/components/schemas/WalletRichTextBlockPresentation'

    WalletInfoValueInlineImagePresentation:
      type: object
      description: Inline image claim value carried as a data URI.
      required: [type, dataUri]
      properties:
        type:
          type: string
          enum: [inline-image]
        dataUri:
          type: string
        alternativeText:
          type: string
          nullable: true

    WalletInfoValueExternalResourcePresentation:
      type: object
      description: External resource claim value. Renderers treat these as link rows and must never fetch them as images.
      required: [type, uri]
      properties:
        type:
          type: string
          enum: [external-resource]
        uri:
          type: string
        label:
          type: string
          nullable: true

    WalletInfoValuePresentation:
      description: Sanitized claim value. Values are absent while hidden by the privacy projection; renderers never receive a value merely to paint a mask over it.
      oneOf:
        - $ref: '#/components/schemas/WalletInfoValueTextPresentation'
        - $ref: '#/components/schemas/WalletInfoValueRichTextPresentation'
        - $ref: '#/components/schemas/WalletInfoValueInlineImagePresentation'
        - $ref: '#/components/schemas/WalletInfoValueExternalResourcePresentation'
      discriminator:
        propertyName: type
        mapping:
          text: '#/components/schemas/WalletInfoValueTextPresentation'
          rich-text: '#/components/schemas/WalletInfoValueRichTextPresentation'
          inline-image: '#/components/schemas/WalletInfoValueInlineImagePresentation'
          external-resource: '#/components/schemas/WalletInfoValueExternalResourcePresentation'

    WalletInfoNodeLeafPresentation:
      type: object
      description: Leaf node of the sanitized claim tree.
      required: [type, nodeId, labelArguments]
      properties:
        type:
          type: string
          enum: [leaf]
        nodeId:
          type: string
        labelKey:
          type: string
          nullable: true
        labelArguments:
          $ref: '#/components/schemas/StringMap'
        value:
          $ref: '#/components/schemas/WalletInfoValuePresentation'
          nullable: true

    WalletInfoNodeObjectPresentation:
      type: object
      description: Object node of the sanitized claim tree grouping child nodes.
      required: [type, nodeId, labelArguments, children]
      properties:
        type:
          type: string
          enum: [object]
        nodeId:
          type: string
        labelKey:
          type: string
          nullable: true
        labelArguments:
          $ref: '#/components/schemas/StringMap'
        children:
          type: array
          items:
            $ref: '#/components/schemas/WalletInfoNodePresentation'

    WalletInfoNodeListPresentation:
      type: object
      description: List node of the sanitized claim tree containing ordered items.
      required: [type, nodeId, labelArguments, items]
      properties:
        type:
          type: string
          enum: [list]
        nodeId:
          type: string
        labelKey:
          type: string
          nullable: true
        labelArguments:
          $ref: '#/components/schemas/StringMap'
        items:
          type: array
          items:
            $ref: '#/components/schemas/WalletInfoNodePresentation'

    WalletInfoNodePresentation:
      description: One node of the canonical sanitized claim tree for a credential. The tree is a display projection; it never contains the raw credential body.
      oneOf:
        - $ref: '#/components/schemas/WalletInfoNodeLeafPresentation'
        - $ref: '#/components/schemas/WalletInfoNodeObjectPresentation'
        - $ref: '#/components/schemas/WalletInfoNodeListPresentation'
      discriminator:
        propertyName: type
        mapping:
          leaf: '#/components/schemas/WalletInfoNodeLeafPresentation'
          object: '#/components/schemas/WalletInfoNodeObjectPresentation'
          list: '#/components/schemas/WalletInfoNodeListPresentation'

    WalletCredentialExternalResourceKind:
      type: string
      description: Kind of an external resource referenced from the sanitized claim tree.
      enum: [LINK, EXTERNAL_IMAGE]

    WalletCredentialExternalResource:
      type: object
      description: External resource referenced by a claim tree node. Only https URIs are accepted; clients decide whether and how to open them.
      required: [nodeId, uri, kind]
      example:
        nodeId: node-portrait
        uri: https://issuer.acme.example/resources/portrait
        kind: EXTERNAL_IMAGE
        label: Portrait
      properties:
        nodeId:
          type: string
        uri:
          type: string
        kind:
          $ref: '#/components/schemas/WalletCredentialExternalResourceKind'
        label:
          type: string
          nullable: true

    WalletCredentialDetailContent:
      type: object
      description: Headless detail projection for one stored credential. It contains the metadata sidecar, the derived issuer party, tags, the canonical sanitized claim tree, and external resources. It never contains the raw credential body, transport metadata, or renderer types.
      required: [metadata, issuer, tags, tagEditingAvailable, info, infoLabels, externalResources]
      example:
        metadata:
          credentialRecordId: cred-9c41
          walletUnitId: wu-7f9d
          issuerRef:
            type: did
            value: did:web:issuer.acme.example
          format: dc+sd-jwt
          credentialTypeRefs:
            - format: dc+sd-jwt
              kind: SD_JWT_VCT
              value: urn:eudi:pid:1
              source: ISSUER_METADATA
              primary: true
          lifecycleSummary:
            lifecycleState: ACTIVE
            validityState: VALID
            tombstone: false
          instanceCount: 2
          activeInstanceCount: 1
          boundInstanceCount: 1
          updatedAt: '2026-08-16T09:30:00Z'
        issuer:
          partyId: party-issuer-acme
          displayName: ACME Issuing Authority
        tags: [identity]
        tagEditingAvailable: true
        info:
          - type: leaf
            nodeId: node-given-name
            labelKey: wallet_credential_claim_given_name
            labelArguments: {}
            value:
              type: text
              text: Alice
        infoLabels:
          node-given-name: Given name
        externalResources: []
      properties:
        metadata:
          $ref: '#/components/schemas/CredentialMetadata'
        issuer:
          $ref: '#/components/schemas/WalletCredentialIssuerParty'
        tags:
          type: array
          items:
            type: string
        tagEditingAvailable:
          type: boolean
        info:
          type: array
          items:
            $ref: '#/components/schemas/WalletInfoNodePresentation'
        infoLabels:
          $ref: '#/components/schemas/StringMap'
        externalResources:
          type: array
          items:
            $ref: '#/components/schemas/WalletCredentialExternalResource'

    WalletCredentialDeleteActivationGrant:
      type: object
      description: Activation grant authorizing one credential deletion. The referenced activation decision is single-use and operation-bound to operationType wallet.credentials.delete with the exact operation hash, nonce, and audience in this grant. The server consumes the decision before performing the deletion; a missing, expired, already consumed, or wrong-hash decision is rejected with 403 and nothing is deleted.
      required: [activationDecisionId, operationHash, nonce, audience]
      example:
        activationDecisionId: act-20260816-0001
        operationHash: sha256:2f20b6f6e7f1d36f8f6d35d27a5f093b6f2e4b2e
        nonce: '6fc33771f7e14d63'
        audience: https://wallet.acme.example
      properties:
        activationDecisionId:
          type: string
        operationHash:
          type: string
        nonce:
          type: string
        audience:
          type: string

    DeleteWalletCredentialResult:
      type: object
      description: Result of a credential deletion.
      example:
        completed: true
      properties:
        completed:
          type: boolean
          default: true

    RefreshWalletCredentialStatusResult:
      type: object
      description: Result of an unattended status refresh. It carries the updated metadata sidecar plus the latest status snapshot when a status mechanism is configured for the credential.
      required: [metadata]
      example:
        metadata:
          credentialRecordId: cred-9c41
          walletUnitId: wu-7f9d
          issuerRef:
            type: did
            value: did:web:issuer.acme.example
          format: dc+sd-jwt
          credentialTypeRefs:
            - format: dc+sd-jwt
              kind: SD_JWT_VCT
              value: urn:eudi:pid:1
              source: ISSUER_METADATA
              primary: true
          lifecycleSummary:
            lifecycleState: ACTIVE
            validityState: VALID
            tombstone: false
          instanceCount: 2
          activeInstanceCount: 1
          boundInstanceCount: 1
          updatedAt: '2026-08-16T09:30:00Z'
        status:
          status: VALID
          checkedAt: '2026-08-16T09:30:00Z'
          source: https://status.acme.example/lists/7
      properties:
        metadata:
          $ref: '#/components/schemas/CredentialMetadata'
        status:
          $ref: '#/components/schemas/CredentialStatusSnapshot'
          nullable: true
