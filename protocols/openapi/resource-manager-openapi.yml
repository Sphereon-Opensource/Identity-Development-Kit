        '404':
          $ref: './common-components.yml#/components/responses/NotFound'
        '409':
          description: Schedule set is still in use.
          content:
            application/json:
              schema:
                $ref: './common-components.yml#/components/schemas/ApiError'

  # Schedule Set Assignments
  /schedules/sets/{scheduleSetId}/assignments:
    parameters:
      - name: scheduleSetId
        in: path
        required: true
        description: Unique identifier of the schedule set.
