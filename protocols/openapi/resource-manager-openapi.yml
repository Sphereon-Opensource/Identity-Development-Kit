    put:
      tags: [ResourceGroups]
      summary: Update resource group
      operationId: updateResourceGroup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResourceGroupUpdateRequest'
      responses:
        '200':
          description: Updated resource group.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceGroup'
        '400':
