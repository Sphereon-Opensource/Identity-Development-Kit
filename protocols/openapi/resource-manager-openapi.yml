          type: string
          format: uuid
    get:
      tags: [UsagePolicies]
      summary: Get usage policy
      operationId: getUsagePolicy
      responses:
        '200':
          description: Usage policy details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsagePolicy'
        '404':
          $ref: './common-components.yml#/components/responses/NotFound'
    patch:
      tags: [UsagePolicies]
      summary: Update usage policy
      operationId: updateUsagePolicy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UsagePolicyUpdateRequest'
      responses:
        '200':
          description: Updated usage policy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsagePolicy'
        '400':
          $ref: './common-components.yml#/components/responses/ValidationError'
        '404':
          $ref: './common-components.yml#/components/responses/NotFound'
    delete:
      tags: [UsagePolicies]
      summary: Delete usage policy
      operationId: deleteUsagePolicy
      responses:
        '204':
          description: Deleted.
        '404':
          $ref: './common-components.yml#/components/responses/NotFound'
        '409':
          description: Policy is still in use by resources.
          content:
            application/json:
              schema:
                $ref: './common-components.yml#/components/schemas/ApiError'

  # Policy Assignments
  /policies/assignments:
    get:
      tags: [PolicyAssignments]
      summary: List policy assignments
      operationId: listPolicyAssignments
      parameters:
        - name: policyId
          in: query
          schema:
            type: string
            format: uuid
          description: Filter by policy ID.
        - name: categoryId
          in: query
          schema:
            type: string
            format: uuid
          description: Filter by category ID.
        - name: groupId
          in: query
          schema:
            type: string
            format: uuid
          description: Filter by group ID.
        - name: resourceId
          in: query
          schema:
            type: string
            format: uuid
          description: Filter by resource ID.
        - name: page
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
