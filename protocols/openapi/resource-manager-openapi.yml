            format: uuid
          description: Filter by group ID.
        - name: resourceId
          in: query
          schema:
            type: string
            format: uuid
          description: Filter by resource ID.
        - name: page
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
