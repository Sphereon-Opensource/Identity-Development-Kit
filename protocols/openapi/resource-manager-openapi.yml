        '404':
          $ref: './common-components.yml#/components/responses/NotFound'
    delete:
      tags: [ResourceGroups]
      summary: Soft-delete resource group
      operationId: deleteResourceGroup
      responses:
        '204':
          description: Deleted.
        '404':
          $ref: './common-components.yml#/components/responses/NotFound'

  # Schedule Sets
  /schedules/sets:
    get:
      tags: [ScheduleSets]
      summary: List schedule sets
      operationId: listScheduleSets
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Paged list of schedule sets.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleSetListResponse'
    post:
      tags: [ScheduleSets]
      summary: Create schedule set
      operationId: createScheduleSet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScheduleSetCreateRequest'
      responses:
        '201':
          description: Schedule set created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleSet'
        '400':
          $ref: './common-components.yml#/components/responses/ValidationError'
  /schedules/sets/{scheduleSetId}:
    parameters:
      - name: scheduleSetId
        in: path
        required: true
        description: Unique identifier of the schedule set.
        schema:
          type: string
          format: uuid
    get:
      tags: [ScheduleSets]
      summary: Get schedule set
      operationId: getScheduleSet
      responses:
        '200':
          description: Schedule set details with rules and included sets.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleSetDetail'
        '404':
          $ref: './common-components.yml#/components/responses/NotFound'
    put:
      tags: [ScheduleSets]
      summary: Update schedule set
      operationId: updateScheduleSet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScheduleSetUpdateRequest'
      responses:
        '200':
          description: Updated schedule set.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleSet'
        '400':
          $ref: './common-components.yml#/components/responses/ValidationError'
        '404':
          $ref: './common-components.yml#/components/responses/NotFound'
    delete:
      tags: [ScheduleSets]
      summary: Delete schedule set
      operationId: deleteScheduleSet
      responses:
        '204':
