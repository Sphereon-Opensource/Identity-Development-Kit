openapi: 3.0.4
info:
  title: Resource & Booking API
  version: 0.4.0
  description: |
    Manage resources, availability, bookings, and policy checks for resource scheduling.
    Resources are first-class ecosystem participants in the Party model, with tenant-defined
    categories, reusable usage policies, verification requirements, and visual branding support.

    The API covers resource cataloging, availability lookup, reservation and booking lifecycle,
    ownership and policy metadata, and audit-oriented status transitions such as maintenance,
    retirement, verification, and cancellation.
servers:
  - url: http://localhost:5011/api/booking/v1

security:
  - bearer: []

tags:
  - name: Resources
    description: Resource lifecycle and availability.
  - name: ResourceGroups
    description: Resource grouping for shared configuration.
  - name: Bookings
    description: Booking creation, updates, and credential verification status.
  - name: Verifications
    description: Pre-booking credential verifications.
  - name: ResourceCategories
    description: Tenant-defined resource category configuration.
  - name: RequirementCategories
    description: Tenant-defined requirement category configuration.
  - name: UsagePolicies
    description: Reusable booking constraint policies.
  - name: PolicyAssignments
    description: Policy assignment to categories, groups, or resources.
  - name: ScheduleSets
    description: Composite schedule sets with rules and composition.
  - name: ScheduleSetAssignments
    description: Schedule set assignment to categories, groups, or resources.
paths:
  /categories/resources:
    get:
      tags: [ResourceCategories]
      summary: List resource categories
      operationId: listResourceCategories
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Paged list of resource categories.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceCategoryListResponse'
    post:
      tags: [ResourceCategories]
      summary: Create resource category
      operationId: createResourceCategory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResourceCategoryCreateRequest'
      responses:
        '201':
          description: Resource category created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceCategory'
        '400':
          $ref: './common-components.yml#/components/responses/ValidationError'
  /categories/resources/{resourceCategoryId}:
    parameters:
      - name: resourceCategoryId
        in: path
        required: true
        description: Unique identifier of the resource category.
        schema:
          type: string
          format: uuid
    get:
      tags: [ResourceCategories]
      summary: Get resource category
      operationId: getResourceCategory
      responses:
        '200':
          description: Category details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceCategory'
        '404':
          $ref: './common-components.yml#/components/responses/NotFound'
    put:
      tags: [ResourceCategories]
      summary: Update resource category
      operationId: updateResourceCategory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResourceCategoryUpdateRequest'
      responses:
        '200':
          description: Updated category.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceCategory'
        '400':
          $ref: './common-components.yml#/components/responses/ValidationError'
        '404':
          $ref: './common-components.yml#/components/responses/NotFound'
    delete:
      tags: [ResourceCategories]
      summary: Soft-delete resource category
      operationId: deleteResourceCategory
      responses:
        '204':
          description: Deleted.
        '404':
          $ref: './common-components.yml#/components/responses/NotFound'

  /categories/requirements:
