          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleSetAssignmentListResponse'
    post:
      tags: [ScheduleSetAssignments]
      summary: Create schedule set assignment
      operationId: createScheduleSetAssignment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScheduleSetAssignmentCreateRequest'
      responses:
        '201':
          description: Schedule set assignment created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleSetAssignment'
        '400':
          $ref: './common-components.yml#/components/responses/ValidationError'
  /schedules/sets/{scheduleSetId}/assignments/{assignmentId}:
    parameters:
      - name: scheduleSetId
        in: path
        required: true
        description: Unique identifier of the schedule set.
        schema:
          type: string
          format: uuid
      - name: assignmentId
        in: path
        required: true
        description: Unique identifier of the schedule set assignment.
        schema:
          type: string
          format: uuid
    get:
      tags: [ScheduleSetAssignments]
      summary: Get schedule set assignment
      operationId: getScheduleSetAssignment
      responses:
        '200':
          description: Schedule set assignment details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleSetAssignment'
        '404':
          $ref: './common-components.yml#/components/responses/NotFound'
    put:
      tags: [ScheduleSetAssignments]
      summary: Update schedule set assignment
      operationId: updateScheduleSetAssignment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScheduleSetAssignmentUpdateRequest'
      responses:
        '200':
          description: Updated schedule set assignment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleSetAssignment'
        '400':
          $ref: './common-components.yml#/components/responses/ValidationError'
        '404':
          $ref: './common-components.yml#/components/responses/NotFound'
    delete:
      tags: [ScheduleSetAssignments]
      summary: Delete schedule set assignment
      operationId: deleteScheduleSetAssignment
      responses:
        '204':
          description: Deleted.
        '404':
          $ref: './common-components.yml#/components/responses/NotFound'
  /resources:
    get:
      tags: [Resources]
      summary: List resources
      description: Filterable resource listing scoped by tenant with optional category filtering.
      operationId: listResources
      parameters:
        - name: resourceCategoryId
          in: query
          schema:
            type: string
            format: uuid
          description: Filter by resource category.
        - name: categorySlug
          in: query
          schema:
            type: string
          description: Filter by resource category slug.
        - name: search
          in: query
          schema:
            type: string
          description: Free text search on name or location label.
        - name: page
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 20
      responses:
        '200':
          description: Paged list of resources.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceListResponse'
    post:
      tags: [Resources]
      summary: Create resource
      description: Creates a party-backed resource with optional policy, schedule, and credential requirements.
      operationId: createResource
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResourceCreateRequest'
      responses:
        '201':
          description: Resource created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceDetail'
        '400':
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: './common-components.yml#/components/schemas/ApiError'
  /resources/{resourceId}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [Resources]
      summary: Get resource details
      operationId: getResource
      responses:
        '200':
          description: Resource with related policy and requirements.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceDetail'
        '404':
          $ref: './common-components.yml#/components/responses/NotFound'
    put:
      tags: [Resources]
      summary: Update resource
      operationId: updateResource
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResourceUpdateRequest'
      responses:
        '200':
          description: Updated resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceDetail'
        '400':
          $ref: './common-components.yml#/components/responses/ValidationError'
        '404':
          $ref: './common-components.yml#/components/responses/NotFound'
    delete:
      tags: [Resources]
      summary: Soft-delete resource
      operationId: deleteResource
      responses:
        '204':
          description: Resource deleted.
        '404':
          $ref: './common-components.yml#/components/responses/NotFound'
  /resources/{resourceId}/availability:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [Resources]
      summary: Get availability grid
      operationId: getResourceAvailability
      parameters:
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date-time
          description: Start of the availability window.
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date-time
          description: End of the availability window.
        - name: timezone
          in: query
          schema:
            type: string
          description: IANA timezone identifier for slot generation.
      responses:
        '200':
          description: Availability slots for the resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvailabilityResponse'
        '404':
          $ref: './common-components.yml#/components/responses/NotFound'
  /resources/{resourceId}/effective/policy:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [Resources]
      summary: Get effective policy for a resource
      operationId: getEffectiveResourcePolicy
      responses:
        '200':
          description: Effective policy with source metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EffectivePolicyResponse'
        '404':
          $ref: './common-components.yml#/components/responses/NotFound'
  /resources/{resourceId}/effective/schedules/set:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [Resources]
      summary: Get effective schedule set for a resource
      operationId: getEffectiveResourceScheduleSet
      responses:
        '200':
          description: Effective schedule set with source metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EffectiveScheduleSetResponse'
        '404':
          $ref: './common-components.yml#/components/responses/NotFound'
  /resources/{resourceId}/effective/schedules/rules:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [Resources]
      summary: Get flattened effective schedule rules for a resource
      operationId: getEffectiveResourceScheduleRules
      responses:
        '200':
          description: Flattened effective schedule rules with source metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EffectiveScheduleRulesResponse'
        '404':
          $ref: './common-components.yml#/components/responses/NotFound'
  /bookings:
    get:
      tags: [Bookings]
      summary: List bookings
      operationId: listBookings
      parameters:
        - name: resourceId
          in: query
          schema:
            type: string
            format: uuid
        - name: userId
          in: query
          schema:
            type: string
            format: uuid
        - name: bookingType
          in: query
          schema:
            $ref: '#/components/schemas/BookingType'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/BookingStatus'
        - name: from
          in: query
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          schema:
            type: string
            format: date-time
        - name: page
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 20
      responses:
        '200':
          description: Paged list of bookings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingListResponse'
    post:
      tags: [Bookings]
      summary: Create booking
      description: Creates a booking and enforces conflict and verification requirements.
      operationId: createBooking
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingCreateRequest'
      responses:
        '201':
          description: Booking created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        '400':
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: './common-components.yml#/components/schemas/ApiError'
        '409':
          $ref: './common-components.yml#/components/responses/Conflict'
  /bookings/{bookingId}:
    parameters:
      - name: bookingId
        in: path
        required: true
        description: Unique identifier of the booking.
        schema:
          type: string
          format: uuid
    get:
      tags: [Bookings]
      summary: Get booking
      operationId: getBooking
      responses:
        '200':
          description: Booking details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        '404':
          $ref: './common-components.yml#/components/responses/NotFound'
    put:
      tags: [Bookings]
      summary: Update booking
      operationId: updateBooking
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingUpdateRequest'
      responses:
        '200':
          description: Updated booking.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        '400':
          $ref: './common-components.yml#/components/responses/ValidationError'
        '404':
          $ref: './common-components.yml#/components/responses/NotFound'
        '409':
          $ref: './common-components.yml#/components/responses/Conflict'
    delete:
      tags: [Bookings]
      summary: Cancel booking
      operationId: cancelBooking
      responses:
        '204':
          description: Booking cancelled.
        '404':
          $ref: './common-components.yml#/components/responses/NotFound'
  /verifications:
    post:
      tags: [Verifications]
      summary: Start a verification
      operationId: createVerification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerificationCreateRequest'
      responses:
        '201':
          description: Verification created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Verification'
        '400':
          $ref: './common-components.yml#/components/responses/ValidationError'
  /verifications/{verificationId}:
    parameters:
      - name: verificationId
        in: path
        required: true
        description: Unique identifier of the verification.
        schema:
          type: string
          format: uuid
    get:
      tags: [Verifications]
      summary: Get verification status
      operationId: getVerification
      responses:
        '200':
          description: Verification details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Verification'
        '404':
          $ref: './common-components.yml#/components/responses/NotFound'
