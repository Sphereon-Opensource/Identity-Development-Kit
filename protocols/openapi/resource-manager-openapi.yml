        '400':
          $ref: './common-components.yml#/components/responses/ValidationError'
        '404':
          $ref: './common-components.yml#/components/responses/NotFound'
    delete:
      tags: [RequirementCategories]
      summary: Soft-delete requirement category
      operationId: deleteRequirementCategory
      responses:
        '204':
          description: Deleted.
        '404':
          $ref: './common-components.yml#/components/responses/NotFound'

