          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequirementCategory'
        '404':
          $ref: './common-components.yml#/components/responses/NotFound'
    patch:
      tags: [RequirementCategories]
      summary: Update requirement category
      operationId: updateRequirementCategory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequirementCategoryUpdateRequest'
      responses:
        '200':
          description: Updated requirement category.
          content:
            application/json:
              schema:
