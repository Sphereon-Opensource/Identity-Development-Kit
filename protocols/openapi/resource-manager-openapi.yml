    ResourceCreateRequest:
      type: object
      required:
        - party
        - resource
      properties:
        tenantId:
          type: string
          format: uuid
        party:
          type: object
          description: |
            Party configuration for the resource. Provide EITHER:
            - `resourceId` to attach resource definition to an existing resource, OR
            - `displayName` (and other fields) to create a new party with the resource.
            Note: New party creation is handled via ResourceManagerService orchestration.
          properties:
            resourceId:
              type: string
              format: uuid
              description: |
                ID of an existing party to attach this resource definition to.
                When provided, other party creation fields are ignored.
                Mutually exclusive with displayName-based party creation.
            displayName:
              type: string
              description: |
                Display name for creating a new party.
                Required when resourceId is not provided.
            partyType:
              allOf:
                - $ref: './party-manager-components.yml#/components/schemas/PartyType'
              default: RESOURCE
            origin:
              $ref: './party-manager-components.yml#/components/schemas/PartyOrigin'
              default: MANAGED
            uri:
              type: string
              format: uri
            ownerResourceId:
              type: string
              format: uuid
              description: |
                ID of the party that owns this party (parent-child relationship).
                Only applicable when creating a new party (not when using resourceId).
            description:
              type: string
              description: Optional free-form description for the resource.
            imageAssetId:
              type: string
              description: Optional image URL/asset reference for the resource.
            brandingProfileId:
              type: string
              format: uuid
              description: Optional branding profile for visual identity of this resource.
        resource:
          type: object
          required:
            - resourceCategoryId
          properties:
            resourceCategoryId:
              type: string
              format: uuid
            groupId:
              type: string
              format: uuid
              nullable: true
              description: Optional resource group membership.
            timezone:
              type: string
              description: IANA timezone identifier (e.g., 'Europe/Amsterdam'). TODO - Consider deriving from party's primary physical address timezone instead.
            status:
              $ref: '#/components/schemas/ResourceStatus'
            capacity:
              type: integer
        usagePolicy:
          $ref: '#/components/schemas/ResourceUsagePolicyInput'
        schedules:
          type: array
          items:
            $ref: '#/components/schemas/ResourceSchedule'
        requirements:
          type: array
          items:
            $ref: '#/components/schemas/ResourceRequirementInput'
        addresses:
          type: array
          description: Optional physical addresses for the resource.
          items:
            $ref: './party-manager-openapi.yml#/components/schemas/PhysicalAddressCreateRequest'
