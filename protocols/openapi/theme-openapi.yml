  /{tenant}/tokens:
    parameters:
      - $ref: './theme-components.yml#/components/parameters/TenantPath'
    get:
      tags: [ThemeTokens]
      summary: Get the editable token set
      operationId: getTokens
      x-command-id: theme.rest-token.get
      description: >-
        Returns the editable token set with effective values for the addressed
        `(scope, variant, applicationId)` combination: tenant scope by default,
        application scope when `applicationId` is given.
      parameters:
        - $ref: './theme-components.yml#/components/parameters/VariantQuery'
        - $ref: './theme-components.yml#/components/parameters/ApplicationIdQuery'
      responses:
        '200':
          description: The editable token set.
