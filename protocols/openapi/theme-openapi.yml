    patch:
      tags: [ThemeTokens]
      summary: Patch tokens
      operationId: patchTokens
      x-command-id: theme.rest-token.patch
      description: >-
        Upserts and removes tokens in the canonical definition for the addressed
        `(scope, variant, applicationId)` combination. Composes with the brand endpoints,
        which write the same canonical definitions.
      parameters:
        - $ref: './theme-components.yml#/components/parameters/VariantQuery'
        - $ref: './theme-components.yml#/components/parameters/ApplicationIdQuery'
      requestBody:
