openapi: 3.0.4
info:
  title: Party Manager API
  version: 0.1.0
  x-products: [edk, vdx]
  description: |
    Manage the parties in a tenant and the relationships between them. A party is any participant in
    the ecosystem, following the "Everything is a Party" model. Each party is one coherent, typed JSON
    object that is itself a party, discriminated by `partyType`: a person, an organization, an
    organization unit, a service, or a group. There is no separate detail record to reassemble; a
    person object carries its name and birth date directly, an organization object carries its legal
    name and contact details directly, and so on.

    A party bears zero or more specializations (roles), each optionally bound to a semantic profile,
    which is how the same organization can act as both customer and supplier. Parties sit in a single
    home organization unit, and organization units nest, so a tenant's structure is itself expressed
    in parties.

    ## Working with parties

    Each party type has its own resource (`/persons`, `/organizations`, `/services`,
    `/ou`, `/groups`) that creates, reads, updates, lists, and soft-deletes that one
    type and returns the typed object. The `/parties` resource is the polymorphic view across all
    types: listing and reading there yields the discriminated [PartyEntity], so a caller that does not
    know a party's type in advance can still read it and inspect its relationships.

    ## Pagination

    List endpoints accept both `limit`/`offset` and OpenAPI-style `page`/`size`; the server normalises
    and clamps `limit` to `[1, 100]` (default `20`) and returns a `pagination` block alongside the
    `data` array. Identifiers are UUIDs, timestamps are RFC 3339 / ISO 8601 in UTC, and errors share
    a stable machine-readable [ApiError] body.
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0

servers:
  - url: https://api.example.com/api/party/v1
    description: Production server.
  - url: http://localhost:8080/api/party/v1
    description: Local development server.

security:
  - bearer: []

tags:
  - name: Persons
    description: Create, read, update, soft-delete, and list `natural_person` parties.
  - name: Organizations
    description: Create, read, update, soft-delete, and list `organization` parties.
  - name: OrganizationUnits
    description: Create, read, update, soft-delete, and list `organization_unit` parties, and walk their children and members.
  - name: Services
    description: Create, read, update, soft-delete, and list `service` parties, and configure their login surface.
  - name: Groups
    description: Create, read, update, soft-delete, and list `group` parties, and manage their membership.
  - name: Parties
    description: The polymorphic view across all party types.
  - name: Relationships
    description: Typed, directional relationships between parties.
  - name: Addresses
    description: Electronic and physical addresses attached to a party.
  - name: OrganizationRegistrations
    description: Business registrations (VAT, LEI, DUNS, Chamber of Commerce, and similar) held by an organization.
  - name: ApplicationBindings
    description: Bind identities to an application's login surface.

paths:

  # --- Persons --------------------------------------------------

  /persons:
    get:
      operationId: listPersons
      tags: [Persons]
      summary: List persons
      description: Returns a page of `natural_person` parties in the caller's tenant.
      parameters:
        - $ref: '#/components/parameters/OrganizationUnitFilter'
        - $ref: '#/components/parameters/PartySubtypeFilter'
        - $ref: '#/components/parameters/OriginFilter'
        - $ref: '#/components/parameters/SearchFilter'
        - $ref: '#/components/parameters/IncludeParam'
        - $ref: './common-components.yml#/components/parameters/Limit'
        - $ref: './common-components.yml#/components/parameters/Offset'
        - $ref: './common-components.yml#/components/parameters/Page'
        - $ref: './common-components.yml#/components/parameters/Size'
        - $ref: './common-components.yml#/components/parameters/Sort'
        - $ref: './common-components.yml#/components/parameters/SortDirection'
      responses:
        '200':
          description: Page of persons.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonPage'
        '400':
          $ref: './common-components.yml#/components/responses/ValidationError'
        '401':
          $ref: './common-components.yml#/components/responses/Unauthorized'
        '500':
          $ref: './common-components.yml#/components/responses/Error'
    post:
      operationId: createPerson
      tags: [Persons]
      summary: Create a person
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PersonCreateRequest'
      responses:
        '201':
          description: Person created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Person'
        '400':
          $ref: './common-components.yml#/components/responses/ValidationError'
        '401':
          $ref: './common-components.yml#/components/responses/Unauthorized'
        '500':
          $ref: './common-components.yml#/components/responses/Error'

  /persons/{id}:
    parameters:
      - $ref: '#/components/parameters/PartyId'
    get:
      operationId: getPerson
      tags: [Persons]
      summary: Get a person
      parameters:
        - $ref: '#/components/parameters/IncludeParam'
      responses:
        '200':
          description: The person.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Person'
        '401':
          $ref: './common-components.yml#/components/responses/Unauthorized'
        '404':
          $ref: './common-components.yml#/components/responses/NotFound'
    put:
