    put:
      operationId: replaceGroupMembers
      tags: [Groups]
      summary: Replace a group's membership
      description: Replaces the full membership of the group with the supplied set of party ids.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GroupMembersUpdateRequest'
      responses:
        '200':
          description: The membership after the update.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartyEntityPage'
        '400':
          $ref: './common-components.yml#/components/responses/ValidationError'
        '401':
          $ref: './common-components.yml#/components/responses/Unauthorized'
        '404':
          $ref: './common-components.yml#/components/responses/NotFound'

  /groups/{id}/members/{memberId}:
    parameters:
      - $ref: '#/components/parameters/PartyId'
      - $ref: '#/components/parameters/MemberId'
    put:
      operationId: addGroupMember
      tags: [Groups]
      summary: Add a party to a group
      description: Adds the party to the group's membership. Idempotent.
      responses:
        '204':
          description: The party is a member of the group.
        '401':
          $ref: './common-components.yml#/components/responses/Unauthorized'
        '404':
          $ref: './common-components.yml#/components/responses/NotFound'
    delete:
      operationId: removeGroupMember
      tags: [Groups]
      summary: Remove a party from a group
      description: Removes the party from the group's membership. Idempotent.
      responses:
        '204':
          description: The party is no longer a member of the group.
        '401':
          $ref: './common-components.yml#/components/responses/Unauthorized'
        '404':
          $ref: './common-components.yml#/components/responses/NotFound'

  # --- Polymorphic parties --------------------------------------

  /parties:
    get:
      operationId: listParties
      tags: [Parties]
      summary: List parties of any type
      description: >-
        Returns a page of parties in the caller's tenant across all types. Each item is a polymorphic
        [PartyEntity] discriminated by `partyType`.
      parameters:
        - $ref: '#/components/parameters/PartyTypeFilter'
        - $ref: '#/components/parameters/PartySubtypeFilter'
        - $ref: '#/components/parameters/OrganizationUnitFilter'
        - $ref: '#/components/parameters/OriginFilter'
        - $ref: '#/components/parameters/SearchFilter'
        - $ref: '#/components/parameters/IncludeParam'
        - $ref: './common-components.yml#/components/parameters/Limit'
        - $ref: './common-components.yml#/components/parameters/Offset'
        - $ref: './common-components.yml#/components/parameters/Page'
        - $ref: './common-components.yml#/components/parameters/Size'
        - $ref: './common-components.yml#/components/parameters/Sort'
        - $ref: './common-components.yml#/components/parameters/SortDirection'
      responses:
        '200':
          description: Page of parties.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartyEntityPage'
        '400':
          $ref: './common-components.yml#/components/responses/ValidationError'
        '401':
          $ref: './common-components.yml#/components/responses/Unauthorized'
        '500':
          $ref: './common-components.yml#/components/responses/Error'

  /parties/{id}:
    parameters:
      - $ref: '#/components/parameters/PartyId'
    get:
      operationId: getParty
      tags: [Parties]
      summary: Get a party of any type
      description: Returns the party as a polymorphic [PartyEntity], whatever its type.
      parameters:
        - $ref: '#/components/parameters/IncludeParam'
      responses:
        '200':
          description: The party.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartyEntity'
        '401':
          $ref: './common-components.yml#/components/responses/Unauthorized'
        '404':
          $ref: './common-components.yml#/components/responses/NotFound'

  /parties/{id}/relationships:
    parameters:
      - $ref: '#/components/parameters/PartyId'
    get:
      operationId: listPartyRelationships
      tags: [Parties]
      summary: List a party's relationships
      description: Returns the relationships the party participates in, on either side.
      responses:
        '200':
          description: The party's relationships.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartyRelationshipList'
        '401':
          $ref: './common-components.yml#/components/responses/Unauthorized'
        '404':
          $ref: './common-components.yml#/components/responses/NotFound'

  # --- Addresses ------------------------------------------------

  /parties/{id}/addresses/electronic:
    parameters:
      - $ref: '#/components/parameters/PartyId'
    get:
      operationId: listElectronicAddresses
      tags: [Addresses]
      summary: List a party's electronic addresses
      description: Returns the party's electronic addresses, primary addresses first.
      responses:
        '200':
          description: The party's electronic addresses.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ElectronicAddressList'
        '401':
          $ref: './common-components.yml#/components/responses/Unauthorized'
        '404':
          $ref: './common-components.yml#/components/responses/NotFound'
    post:
      operationId: addElectronicAddress
      tags: [Addresses]
      summary: Add an electronic address to a party
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ElectronicAddressCreateRequest'
      responses:
        '201':
          description: Electronic address created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ElectronicAddress'
        '400':
          $ref: './common-components.yml#/components/responses/ValidationError'
        '401':
          $ref: './common-components.yml#/components/responses/Unauthorized'
        '404':
          $ref: './common-components.yml#/components/responses/NotFound'

  /parties/{id}/addresses/physical:
    parameters:
      - $ref: '#/components/parameters/PartyId'
    get:
      operationId: listPhysicalAddresses
      tags: [Addresses]
      summary: List a party's physical addresses
      description: Returns the physical and postal addresses attached to the party.
      responses:
        '200':
          description: The party's physical addresses.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhysicalAddressList'
        '401':
          $ref: './common-components.yml#/components/responses/Unauthorized'
        '404':
          $ref: './common-components.yml#/components/responses/NotFound'
    post:
      operationId: addPhysicalAddress
      tags: [Addresses]
      summary: Add a physical address to a party
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PhysicalAddressCreateRequest'
      responses:
        '201':
          description: Physical address created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhysicalAddress'
        '400':
          $ref: './common-components.yml#/components/responses/ValidationError'
        '401':
          $ref: './common-components.yml#/components/responses/Unauthorized'
        '404':
          $ref: './common-components.yml#/components/responses/NotFound'

  /parties/{id}/addresses/electronic/{addressId}:
    parameters:
      - $ref: '#/components/parameters/PartyId'
      - name: addressId
        in: path
        required: true
        description: The electronic address id.
        schema:
          type: string
          format: uuid
    get:
      operationId: getElectronicAddress
      tags: [Addresses]
      summary: Get one electronic address
      responses:
        '200':
          description: The electronic address.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ElectronicAddress'
        '401':
          $ref: './common-components.yml#/components/responses/Unauthorized'
        '404':
          $ref: './common-components.yml#/components/responses/NotFound'
    put:
      operationId: updateElectronicAddress
      tags: [Addresses]
      summary: Update an electronic address
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ElectronicAddressUpdateRequest'
      responses:
        '200':
          description: The updated electronic address.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ElectronicAddress'
        '400':
          $ref: './common-components.yml#/components/responses/ValidationError'
        '401':
          $ref: './common-components.yml#/components/responses/Unauthorized'
        '404':
          $ref: './common-components.yml#/components/responses/NotFound'
    delete:
      operationId: deleteElectronicAddress
      tags: [Addresses]
      summary: Delete an electronic address
      responses:
        '204':
          description: Electronic address deleted.
        '401':
          $ref: './common-components.yml#/components/responses/Unauthorized'
        '404':
          $ref: './common-components.yml#/components/responses/NotFound'

  /parties/{id}/addresses/physical/{addressId}:
    parameters:
      - $ref: '#/components/parameters/PartyId'
      - name: addressId
        in: path
        required: true
        description: The physical address id.
        schema:
          type: string
          format: uuid
    get:
      operationId: getPhysicalAddress
      tags: [Addresses]
      summary: Get one physical address
      responses:
        '200':
          description: The physical address.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhysicalAddress'
        '401':
          $ref: './common-components.yml#/components/responses/Unauthorized'
        '404':
          $ref: './common-components.yml#/components/responses/NotFound'
    put:
      operationId: updatePhysicalAddress
      tags: [Addresses]
      summary: Update a physical address
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PhysicalAddressUpdateRequest'
      responses:
        '200':
          description: The updated physical address.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhysicalAddress'
        '400':
          $ref: './common-components.yml#/components/responses/ValidationError'
        '401':
          $ref: './common-components.yml#/components/responses/Unauthorized'
        '404':
          $ref: './common-components.yml#/components/responses/NotFound'
    delete:
      operationId: deletePhysicalAddress
      tags: [Addresses]
      summary: Delete a physical address
      responses:
        '204':
          description: Physical address deleted.
        '401':
          $ref: './common-components.yml#/components/responses/Unauthorized'
        '404':
          $ref: './common-components.yml#/components/responses/NotFound'

  # --- Organization registrations -------------------------------

  /organizations/{id}/registrations:
    parameters:
      - $ref: '#/components/parameters/PartyId'
    get:
      operationId: listOrganizationRegistrations
      tags: [OrganizationRegistrations]
      summary: List an organization's registrations
      description: Returns the business registrations held by the organization.
      responses:
        '200':
          description: The organization's registrations.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationRegistrationList'
        '401':
          $ref: './common-components.yml#/components/responses/Unauthorized'
        '404':
          $ref: './common-components.yml#/components/responses/NotFound'
    post:
      operationId: addOrganizationRegistration
      tags: [OrganizationRegistrations]
      summary: Add a registration to an organization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizationRegistrationCreateRequest'
      responses:
        '201':
          description: Registration created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationRegistration'
        '400':
          $ref: './common-components.yml#/components/responses/ValidationError'
        '401':
          $ref: './common-components.yml#/components/responses/Unauthorized'
        '404':
          $ref: './common-components.yml#/components/responses/NotFound'

  # --- Relationships --------------------------------------------

  /relationships:
    get:
      operationId: listRelationships
      tags: [Relationships]
      summary: List relationships
      description: >-
        Returns a page of relationships in the caller's tenant. Filters combine with AND. Use
        `partyId` to match either side, or `leftId`/`rightId` to match a specific side. Both
        counter-parties are resolvable to their full [PartyEntity] through the party endpoints.
      parameters:
        - name: partyId
          in: query
          description: Match relationships where this party is on either side.
          schema:
            type: string
            format: uuid
        - name: leftId
          in: query
          description: Match relationships with this left (source) party.
          schema:
            type: string
            format: uuid
        - name: rightId
          in: query
          description: Match relationships with this right (target) party.
          schema:
            type: string
            format: uuid
        - name: relationshipType
          in: query
          description: Match a single relationship type (exact match).
          schema:
            type: string
        - name: status
          in: query
          description: Match a single relationship status.
          schema:
            $ref: './party-manager-components.yml#/components/schemas/RelationshipStatus'
        - name: validAt
          in: query
          description: Match relationships whose validity window contains this instant.
          schema:
            type: string
            format: date-time
        - $ref: './common-components.yml#/components/parameters/Limit'
        - $ref: './common-components.yml#/components/parameters/Offset'
        - $ref: './common-components.yml#/components/parameters/Page'
        - $ref: './common-components.yml#/components/parameters/Size'
        - $ref: './common-components.yml#/components/parameters/Sort'
        - $ref: './common-components.yml#/components/parameters/SortDirection'
      responses:
        '200':
          description: Page of relationships.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartyRelationshipPage'
        '400':
          $ref: './common-components.yml#/components/responses/ValidationError'
        '401':
          $ref: './common-components.yml#/components/responses/Unauthorized'
        '500':
          $ref: './common-components.yml#/components/responses/Error'
    post:
      operationId: createRelationship
      tags: [Relationships]
      summary: Create a relationship
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PartyRelationshipCreateRequest'
      responses:
        '201':
          description: Relationship created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartyRelationship'
        '400':
          $ref: './common-components.yml#/components/responses/ValidationError'
        '401':
          $ref: './common-components.yml#/components/responses/Unauthorized'
        '500':
          $ref: './common-components.yml#/components/responses/Error'

  /relationships/{id}:
    parameters:
      - $ref: '#/components/parameters/RelationshipId'
    get:
      operationId: getRelationship
      tags: [Relationships]
      summary: Get a relationship
      description: Returns a single relationship by id. Both counter-parties are resolvable to their full [PartyEntity] through the party endpoints.
      responses:
        '200':
          description: The relationship.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartyRelationship'
        '401':
          $ref: './common-components.yml#/components/responses/Unauthorized'
        '404':
          $ref: './common-components.yml#/components/responses/NotFound'
    patch:
      operationId: updateRelationship
      tags: [Relationships]
      summary: Update a relationship
      description: Updates status, validity end, and verification. Omitted fields are left unchanged.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PartyRelationshipUpdateRequest'
      responses:
        '200':
          description: The updated relationship.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartyRelationship'
        '400':
          $ref: './common-components.yml#/components/responses/ValidationError'
        '401':
          $ref: './common-components.yml#/components/responses/Unauthorized'
        '404':
          $ref: './common-components.yml#/components/responses/NotFound'
    delete:
      operationId: deleteRelationship
      tags: [Relationships]
      summary: Delete a relationship
      responses:
        '204':
          description: Relationship deleted.
        '401':
          $ref: './common-components.yml#/components/responses/Unauthorized'
        '404':
          $ref: './common-components.yml#/components/responses/NotFound'

  # --- Application bindings -------------------------------------

  /identities/{identityId}/applications/{applicationId}:
    parameters:
      - $ref: '#/components/parameters/IdentityId'
      - $ref: '#/components/parameters/ApplicationId'
    get:
      operationId: getIdentityApplicationBinding
      tags: [ApplicationBindings]
      summary: Get an identity's application binding
      description: >-
        Returns the binding between an identity and an application's login surface, including the
        permitted authentication methods and the binding status.
      responses:
        '200':
          description: The stored binding.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityApplicationBinding'
        '401':
          $ref: './common-components.yml#/components/responses/Unauthorized'
        '404':
          $ref: './common-components.yml#/components/responses/NotFound'
    put:
      operationId: setIdentityApplicationBinding
      tags: [ApplicationBindings]
      summary: Bind an identity to an application
      description: >-
        Creates or replaces the binding between an identity and an application's login surface, making
        the identity authenticable against that application with the permitted methods.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdentityApplicationBindingRequest'
      responses:
        '200':
          description: The stored binding.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityApplicationBinding'
        '400':
          $ref: './common-components.yml#/components/responses/ValidationError'
        '401':
          $ref: './common-components.yml#/components/responses/Unauthorized'
        '404':
          $ref: './common-components.yml#/components/responses/NotFound'
    delete:
      operationId: deleteIdentityApplicationBinding
      tags: [ApplicationBindings]
      summary: Remove an identity's application binding
      responses:
        '204':
          description: Binding removed.
        '401':
          $ref: './common-components.yml#/components/responses/Unauthorized'
        '404':
          $ref: './common-components.yml#/components/responses/NotFound'

components:
  # Shared error/header/pagination components and the bearer scheme live in
  # ./common-components.yml. Entity, request, enum, and page schemas live in
  # ./party-manager-components.yml and are re-exported below so operations can
  # reference them with spec-internal `#/components/schemas/...` refs.

  securitySchemes:
    bearer:
      $ref: './common-components.yml#/components/securitySchemes/bearer'

  parameters:
    PartyId:
      $ref: './party-manager-components.yml#/components/parameters/PartyId'
    RelationshipId:
      $ref: './party-manager-components.yml#/components/parameters/RelationshipId'
    MemberId:
      $ref: './party-manager-components.yml#/components/parameters/MemberId'
    IdentityId:
      $ref: './party-manager-components.yml#/components/parameters/IdentityId'
    ApplicationId:
      $ref: './party-manager-components.yml#/components/parameters/ApplicationId'

    PartyTypeFilter:
      name: partyType
      in: query
      description: Filter results to a single party type, for example `natural_person` or `organization`.
      schema:
        $ref: './party-manager-components.yml#/components/schemas/PartyType'

    PartySubtypeFilter:
      name: partySubtype
      in: query
      description: Filter to parties that bear a specialization with this subtype (role) label, for example `supplier` for organizations or `employee` for persons.
      schema:
        type: string
        example: supplier

    OrganizationUnitFilter:
      name: organizationUnitId
      in: query
      description: Filter to parties whose home organization unit is this unit.
      schema:
        type: string
        format: uuid
        example: "5c1a9d80-7e3b-4f21-9c44-0b2e6f8a1d3c"

    OriginFilter:
      name: origin
      in: query
      description: Filter by party origin. Use `managed` for parties maintained natively in this tenant, or `external` for parties synced in from an outside source.
      schema:
        $ref: './party-manager-components.yml#/components/schemas/PartyOrigin'

    SearchFilter:
      name: q
      in: query
      description: Free-text filter. Case-insensitive substring match against the party's display name or URI.
      schema:
        type: string
        example: "Lindqvist"

    IncludeParam:
      name: include
      in: query
      required: false
      style: form
      explode: false
      description: |
        Comma-separated association keys to hydrate into the response (default none). Each requested
        association is populated inline on the returned party; unrequested associations are left
        absent. Valid keys depend on the resource:
          - `specializations`: the party's specializations (person, organization, service, organization unit).
          - `members`: the member parties (group, organization unit).
          - `children`: the child organization units (organization unit).
          - `electronicAddresses`: the electronic addresses anchored at the party (any type).
          - `physicalAddresses`: the physical addresses anchored at the party (any type).
        Serialized as a comma-separated list (`style: form`, `explode: false`), for example
        `include=electronicAddresses,physicalAddresses,specializations`. Keys that do not apply to the
        requested resource are ignored.
      schema:
        type: array
        items:
          type: string
          enum:
            - specializations
            - members
            - children
            - electronicAddresses
            - physicalAddresses
      example:
        - electronicAddresses
        - physicalAddresses
        - specializations

  schemas:
    PartyType:
      $ref: './party-manager-components.yml#/components/schemas/PartyType'
    PartyOrigin:
      $ref: './party-manager-components.yml#/components/schemas/PartyOrigin'
    PartySpecialization:
      $ref: './party-manager-components.yml#/components/schemas/PartySpecialization'
    PartyEntity:
      $ref: './party-manager-components.yml#/components/schemas/PartyEntity'
    Person:
      $ref: './party-manager-components.yml#/components/schemas/Person'
    Organization:
      $ref: './party-manager-components.yml#/components/schemas/Organization'
    OrganizationUnit:
      $ref: './party-manager-components.yml#/components/schemas/OrganizationUnit'
    Service:
      $ref: './party-manager-components.yml#/components/schemas/Service'
    Group:
      $ref: './party-manager-components.yml#/components/schemas/Group'
    PersonCreateRequest:
      $ref: './party-manager-components.yml#/components/schemas/PersonCreateRequest'
    PersonUpdateRequest:
      $ref: './party-manager-components.yml#/components/schemas/PersonUpdateRequest'
    OrganizationCreateRequest:
      $ref: './party-manager-components.yml#/components/schemas/OrganizationCreateRequest'
    OrganizationUpdateRequest:
      $ref: './party-manager-components.yml#/components/schemas/OrganizationUpdateRequest'
    OrganizationUnitCreateRequest:
      $ref: './party-manager-components.yml#/components/schemas/OrganizationUnitCreateRequest'
    OrganizationUnitUpdateRequest:
      $ref: './party-manager-components.yml#/components/schemas/OrganizationUnitUpdateRequest'
    ServiceCreateRequest:
      $ref: './party-manager-components.yml#/components/schemas/ServiceCreateRequest'
    ServiceUpdateRequest:
      $ref: './party-manager-components.yml#/components/schemas/ServiceUpdateRequest'
    GroupCreateRequest:
      $ref: './party-manager-components.yml#/components/schemas/GroupCreateRequest'
    GroupUpdateRequest:
      $ref: './party-manager-components.yml#/components/schemas/GroupUpdateRequest'
    GroupMembersUpdateRequest:
      $ref: './party-manager-components.yml#/components/schemas/GroupMembersUpdateRequest'
    PartyRelationship:
      $ref: './party-manager-components.yml#/components/schemas/PartyRelationship'
    PartyRelationshipCreateRequest:
      $ref: './party-manager-components.yml#/components/schemas/PartyRelationshipCreateRequest'
    PartyRelationshipUpdateRequest:
      $ref: './party-manager-components.yml#/components/schemas/PartyRelationshipUpdateRequest'
    IdentityApplicationBinding:
      $ref: './party-manager-components.yml#/components/schemas/IdentityApplicationBinding'
    IdentityApplicationBindingRequest:
      $ref: './party-manager-components.yml#/components/schemas/IdentityApplicationBindingRequest'
    ApplicationLoginConfig:
      $ref: './party-manager-components.yml#/components/schemas/ApplicationLoginConfig'
    ApplicationLoginConfigRequest:
      $ref: './party-manager-components.yml#/components/schemas/ApplicationLoginConfigRequest'
    PartyEntityPage:
      $ref: './party-manager-components.yml#/components/schemas/PartyEntityPage'
    PersonPage:
      $ref: './party-manager-components.yml#/components/schemas/PersonPage'
    OrganizationPage:
      $ref: './party-manager-components.yml#/components/schemas/OrganizationPage'
    OrganizationUnitPage:
      $ref: './party-manager-components.yml#/components/schemas/OrganizationUnitPage'
    ServicePage:
      $ref: './party-manager-components.yml#/components/schemas/ServicePage'
    GroupPage:
      $ref: './party-manager-components.yml#/components/schemas/GroupPage'
    PartyRelationshipPage:
      $ref: './party-manager-components.yml#/components/schemas/PartyRelationshipPage'
    PartyRelationshipList:
      $ref: './party-manager-components.yml#/components/schemas/PartyRelationshipList'
    OrganizationRegistration:
      $ref: './party-manager-components.yml#/components/schemas/OrganizationRegistration'
    OrganizationRegistrationCreateRequest:
      $ref: './party-manager-components.yml#/components/schemas/OrganizationRegistrationCreateRequest'
    OrganizationRegistrationList:
      $ref: './party-manager-components.yml#/components/schemas/OrganizationRegistrationList'
    ElectronicAddress:
      $ref: './party-manager-components.yml#/components/schemas/ElectronicAddress'
    ElectronicAddressCreateRequest:
      $ref: './party-manager-components.yml#/components/schemas/ElectronicAddressCreateRequest'
    ElectronicAddressUpdateRequest:
      $ref: './party-manager-components.yml#/components/schemas/ElectronicAddressUpdateRequest'
    ElectronicAddressList:
      $ref: './party-manager-components.yml#/components/schemas/ElectronicAddressList'
