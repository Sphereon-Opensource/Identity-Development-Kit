openapi: 3.0.4
info:
  title: Secret Management API Components
  version: 1.0.0
paths: {}
components:
  parameters:
    TenantId:
      name: tenantId
      in: path
      required: true
      schema: { type: string, minLength: 1 }
    DefinitionId:
      name: definitionId
      in: path
      required: true
      schema: { type: string, pattern: '^spd_[A-Za-z0-9_-]+$' }
    Revision:
      name: revision
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
    OfferingId:
      name: offeringId
      in: path
      required: true
      schema: { type: string, pattern: '^spo_[A-Za-z0-9_-]+$' }
    MigrationId:
      name: migrationId
      in: path
      required: true
      schema: { type: string, pattern: '^smg_[A-Za-z0-9_-]+$' }
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Strong resource version ETag returned by the previous read.
      schema: { type: string, pattern: '^"[0-9]+"$' }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Opaque caller-generated key. The server persists only a one-way hash.
      schema: { type: string, minLength: 16, maxLength: 200 }
  headers:
    ETag:
      description: Strong ETag containing the current compare-and-swap version.
      required: true
      schema: { type: string, pattern: '^"[0-9]+"$' }
  responses:
    PreconditionRequired:
      description: A required If-Match header was not supplied.
      content:
        application/json:
          schema: { $ref: './common-components.yml#/components/schemas/ApiError' }
    PreconditionFailed:
      description: The supplied If-Match version is stale.
      content:
        application/json:
          schema: { $ref: './common-components.yml#/components/schemas/ApiError' }
    Conflict:
      description: The transition conflicts with policy, dependencies, or another active operation.
      content:
        application/json:
          schema: { $ref: './common-components.yml#/components/schemas/ApiError' }
  schemas:
    ProviderType:
      type: string
      enum: [kms, vault, azure-key-vault, aws-secrets-manager, kubernetes-mount, environment]
    TenantEligibleProviderType:
      type: string
      enum: [kms, vault, azure-key-vault, aws-secrets-manager]
    SanitizedStatusCode:
      type: string
      minLength: 1
      maxLength: 64
      pattern: '^[A-Z][A-Z0-9_]*$'
      description: Stable sanitized code; never contains raw provider or infrastructure error text.
    ProviderCapability:
      type: string
      enum: [read, write, delete, versioning, credential-rotation, backend-tenant-isolation]
    IsolationMode:
      type: string
      enum: [tenant-key, tenant-policy, tenant-role, tenant-namespace, tenant-vault, read-only-deployment]
    LifecycleState:
      type: string
      enum: [candidate, ready, active, suspended, retained, retired, purged, failed]
    ConfiguredState:
      type: string
      enum: [missing, configured, rotation-required]
    ProviderRole:
      type: string
      enum: [platform-storage, platform-offering, tenant-managed, deployment-source]
    ProviderHealth:
      type: object
      description: >-
        Health of a provider revision, derived from the latest persisted probe and the server clock.
        Reading health never triggers a probe and never opens a provider connection. The object is
        always present: `unknown` means no probe has completed, `healthy` means the latest probe
        passed inside the server-configured freshness window, `degraded` means the latest probe
        passed but is older than that window, and `unavailable` means the latest probe failed.
      required: [status]
      properties:
        status: { type: string, enum: [unknown, healthy, degraded, unavailable] }
        checkedAt:
          type: string
          format: date-time
          description: >-
            When the latest probe completed. Absent only while the status is `unknown`.
        code:
          allOf:
            - $ref: '#/components/schemas/SanitizedStatusCode'
          description: >-
            Bounded sanitized failure code, present only while the status is `unavailable`. The
            value is drawn from a closed server vocabulary and never carries provider response text,
            an endpoint, an account, a vault name, a path, a credential or any other locator.
    ProviderRevisionSummary:
      type: object
      required: [revision, providerType, capabilities, isolationMode, state, version, createdAt, health, credentialState]
      properties:
        revision: { type: integer, format: int64 }
        providerType: { $ref: '#/components/schemas/ProviderType' }
        capabilities:
          type: array
          items: { $ref: '#/components/schemas/ProviderCapability' }
          uniqueItems: true
        isolationMode: { $ref: '#/components/schemas/IsolationMode' }
        state: { $ref: '#/components/schemas/LifecycleState' }
        version: { type: integer, format: int64 }
        createdAt: { type: string, format: date-time }
        readyAt: { type: string, format: date-time }
        health:
          allOf:
            - $ref: '#/components/schemas/ProviderHealth'
          description: Always present; never null.
        credentialState:
          $ref: '#/components/schemas/ProviderCredentialsState'
          description: Current redacted state of the credentials bound to this immutable revision.
    ProviderDefinition:
      type: object
      required: [definitionId, role, displayName, state, version, revisions, createdAt, updatedAt]
      properties:
        definitionId: { type: string, readOnly: true }
        role: { $ref: '#/components/schemas/ProviderRole' }
        displayName: { type: string }
        state: { $ref: '#/components/schemas/LifecycleState' }
        version: { type: integer, format: int64 }
        revisions:
          type: array
          items: { $ref: '#/components/schemas/ProviderRevisionSummary' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    KmsProviderConfiguration:
      type: object
      additionalProperties: false
      required: [providerType, keyPurpose, algorithm]
      properties:
        providerType: { type: string, enum: [kms] }
        keyPurpose: { type: string, enum: [tenant-secrets, platform-secrets, bootstrap-envelope] }
        algorithm: { type: string, enum: [aes-256-gcm] }
    VaultProviderConfiguration:
      type: object
      additionalProperties: false
      required: [providerType, endpointUrl]
      properties:
        providerType: { type: string, enum: [vault] }
        endpointUrl: { type: string, format: uri, pattern: '^https://', maxLength: 2048 }
    AzureProviderConfiguration:
      type: object
      additionalProperties: false
      required: [providerType, vaultUrl]
      properties:
        providerType: { type: string, enum: [azure-key-vault] }
        vaultUrl: { type: string, format: uri, pattern: '^https://', maxLength: 2048 }
    AwsProviderConfiguration:
      type: object
      additionalProperties: false
      required: [providerType, region]
      properties:
        providerType: { type: string, enum: [aws-secrets-manager] }
        region: { type: string, pattern: '^[a-z]{2}-[a-z]+-[0-9]+$', maxLength: 32 }
    KubernetesMountProviderConfiguration:
      type: object
      additionalProperties: false
      required: [providerType]
      properties:
        providerType: { type: string, enum: [kubernetes-mount] }
    EnvironmentProviderConfiguration:
      type: object
      additionalProperties: false
      required: [providerType, managedSecretManifestDigest]
      properties:
        providerType: { type: string, enum: [environment] }
        managedSecretManifestDigest: { type: string, pattern: '^sha256:[a-f0-9]{64}$' }
    ProviderConfiguration:
      oneOf:
        - { $ref: '#/components/schemas/KmsProviderConfiguration' }
        - { $ref: '#/components/schemas/VaultProviderConfiguration' }
        - { $ref: '#/components/schemas/AzureProviderConfiguration' }
        - { $ref: '#/components/schemas/AwsProviderConfiguration' }
        - { $ref: '#/components/schemas/KubernetesMountProviderConfiguration' }
        - { $ref: '#/components/schemas/EnvironmentProviderConfiguration' }
      discriminator:
        propertyName: providerType
        mapping:
          kms: '#/components/schemas/KmsProviderConfiguration'
          vault: '#/components/schemas/VaultProviderConfiguration'
          azure-key-vault: '#/components/schemas/AzureProviderConfiguration'
          aws-secrets-manager: '#/components/schemas/AwsProviderConfiguration'
          kubernetes-mount: '#/components/schemas/KubernetesMountProviderConfiguration'
          environment: '#/components/schemas/EnvironmentProviderConfiguration'
    PlatformStorageProviderConfiguration:
      description: Writable platform storage only. Read-only deployment sources are bootstrap-managed and cannot be created through this API.
      oneOf:
        - { $ref: '#/components/schemas/KmsProviderConfiguration' }
        - { $ref: '#/components/schemas/VaultProviderConfiguration' }
        - { $ref: '#/components/schemas/AzureProviderConfiguration' }
        - { $ref: '#/components/schemas/AwsProviderConfiguration' }
      discriminator:
        propertyName: providerType
        mapping:
          kms: '#/components/schemas/KmsProviderConfiguration'
          vault: '#/components/schemas/VaultProviderConfiguration'
          azure-key-vault: '#/components/schemas/AzureProviderConfiguration'
          aws-secrets-manager: '#/components/schemas/AwsProviderConfiguration'
    TenantManagedProviderConfiguration:
      oneOf:
        - { $ref: '#/components/schemas/VaultProviderConfiguration' }
        - { $ref: '#/components/schemas/AzureProviderConfiguration' }
        - { $ref: '#/components/schemas/AwsProviderConfiguration' }
      discriminator:
        propertyName: providerType
        mapping:
          vault: '#/components/schemas/VaultProviderConfiguration'
          azure-key-vault: '#/components/schemas/AzureProviderConfiguration'
          aws-secrets-manager: '#/components/schemas/AwsProviderConfiguration'
    PlatformOfferingProviderConfiguration:
      oneOf:
        - { $ref: '#/components/schemas/KmsProviderConfiguration' }
        - { $ref: '#/components/schemas/VaultProviderConfiguration' }
        - { $ref: '#/components/schemas/AzureProviderConfiguration' }
        - { $ref: '#/components/schemas/AwsProviderConfiguration' }
      discriminator:
        propertyName: providerType
        mapping:
          kms: '#/components/schemas/KmsProviderConfiguration'
          vault: '#/components/schemas/VaultProviderConfiguration'
          azure-key-vault: '#/components/schemas/AzureProviderConfiguration'
          aws-secrets-manager: '#/components/schemas/AwsProviderConfiguration'
    CreatePlatformProviderDefinitionRequest:
      type: object
      additionalProperties: false
      description: Platform storage role and ownership are derived from the platform-admin route.
      required: [displayName, configuration]
      properties:
        displayName: { type: string, minLength: 1, maxLength: 120 }
        configuration: { $ref: '#/components/schemas/PlatformStorageProviderConfiguration' }
    CreatePlatformOfferingProviderDefinitionRequest:
      type: object
      additionalProperties: false
      description: Platform-offering role and ownership are derived from the platform-admin offering route.
      required: [displayName, configuration]
      properties:
        displayName: { type: string, minLength: 1, maxLength: 120 }
        configuration: { $ref: '#/components/schemas/PlatformOfferingProviderConfiguration' }
    CreateTenantProviderDefinitionRequest:
      type: object
      additionalProperties: false
      description: Tenant ownership and tenant-managed role are derived from the authenticated path context.
      required: [displayName, configuration]
      properties:
        displayName: { type: string, minLength: 1, maxLength: 120 }
        configuration: { $ref: '#/components/schemas/TenantManagedProviderConfiguration' }
    CreatePlatformProviderRevisionRequest:
      type: object
      additionalProperties: false
      required: [configuration]
      properties:
        configuration: { $ref: '#/components/schemas/PlatformStorageProviderConfiguration' }
    CreatePlatformOfferingProviderRevisionRequest:
      type: object
      additionalProperties: false
      required: [configuration]
      properties:
        configuration: { $ref: '#/components/schemas/PlatformOfferingProviderConfiguration' }
    CreateTenantProviderRevisionRequest:
      type: object
      additionalProperties: false
      required: [configuration]
      properties:
        configuration: { $ref: '#/components/schemas/TenantManagedProviderConfiguration' }
    VaultTokenCredentialPatch:
      type: object
      additionalProperties: false
      required: [credentialType, updates]
      properties:
        credentialType: { type: string, enum: [vault-token] }
        updates:
          type: array
          minItems: 1
          maxItems: 1
          items:
            type: object
            additionalProperties: false
            required: [field, value]
            properties:
              field: { type: string, enum: [token] }
              value: { type: string, format: password, writeOnly: true, minLength: 1, maxLength: 32768 }
    VaultMachineCredentialPatch:
      type: object
      additionalProperties: false
      required: [credentialType, updates]
      properties:
        credentialType: { type: string, enum: [vault-machine] }
        updates:
          type: array
          minItems: 1
          maxItems: 2
          items:
            type: object
            additionalProperties: false
            required: [field, value]
            properties:
              field: { type: string, enum: [roleId, secretId] }
              value: { type: string, format: password, writeOnly: true, minLength: 1, maxLength: 32768 }
    AzureClientSecretCredentialPatch:
      type: object
      additionalProperties: false
      required: [credentialType, updates]
      properties:
        credentialType: { type: string, enum: [azure-client-secret] }
        updates:
          type: array
          minItems: 1
          maxItems: 3
          items:
            type: object
            additionalProperties: false
            required: [field, value]
            properties:
              field: { type: string, enum: [directoryId, clientId, clientSecret] }
              value: { type: string, format: password, writeOnly: true, minLength: 1, maxLength: 32768 }
    AzureCertificateCredentialPatch:
      type: object
      additionalProperties: false
      required: [credentialType, updates]
      properties:
        credentialType: { type: string, enum: [azure-certificate] }
        updates:
          type: array
          minItems: 1
          maxItems: 4
          items:
            type: object
            additionalProperties: false
            required: [field, value]
            properties:
              field: { type: string, enum: [directoryId, clientId, certificatePem, privateKeyPem] }
              value: { type: string, format: password, writeOnly: true, minLength: 1, maxLength: 65536 }
    AwsAccessKeyCredentialPatch:
      type: object
      additionalProperties: false
      required: [credentialType, updates]
      properties:
        credentialType: { type: string, enum: [aws-access-key] }
        updates:
          type: array
          minItems: 1
          maxItems: 3
          items:
            type: object
            additionalProperties: false
            required: [field, value]
            properties:
              field: { type: string, enum: [accessKeyId, secretAccessKey, sessionToken] }
              value: { type: string, format: password, writeOnly: true, minLength: 1, maxLength: 16384 }
    ProviderCredentialPatch:
      oneOf:
        - { $ref: '#/components/schemas/VaultTokenCredentialPatch' }
        - { $ref: '#/components/schemas/VaultMachineCredentialPatch' }
        - { $ref: '#/components/schemas/AzureClientSecretCredentialPatch' }
        - { $ref: '#/components/schemas/AzureCertificateCredentialPatch' }
        - { $ref: '#/components/schemas/AwsAccessKeyCredentialPatch' }
      discriminator:
        propertyName: credentialType
        mapping:
          vault-token: '#/components/schemas/VaultTokenCredentialPatch'
          vault-machine: '#/components/schemas/VaultMachineCredentialPatch'
          azure-client-secret: '#/components/schemas/AzureClientSecretCredentialPatch'
          azure-certificate: '#/components/schemas/AzureCertificateCredentialPatch'
          aws-access-key: '#/components/schemas/AwsAccessKeyCredentialPatch'
    StageProviderCredentialsRequest:
      oneOf:
        - $ref: '#/components/schemas/StageProviderCredentialPatchRequest'
        - $ref: '#/components/schemas/ClearProviderCredentialFieldsRequest'
    StageProviderCredentialPatchRequest:
      type: object
      additionalProperties: false
      required: [credentials]
      properties:
        credentials: { $ref: '#/components/schemas/ProviderCredentialPatch' }
    ClearProviderCredentialFieldsRequest:
      type: object
      additionalProperties: false
      required: [clearCredentials, confirmClear]
      properties:
        clearCredentials: { $ref: '#/components/schemas/ProviderCredentialClear' }
        confirmClear:
          type: boolean
          description: >-
            Explicit confirmation that the listed credential fields are to be cleared. The
            request is refused unless this is `true`; a `false` value clears nothing.
    ProviderCredentialClear:
      oneOf:
        - $ref: '#/components/schemas/VaultTokenCredentialClear'
        - $ref: '#/components/schemas/VaultMachineCredentialClear'
        - $ref: '#/components/schemas/AzureClientSecretCredentialClear'
        - $ref: '#/components/schemas/AzureCertificateCredentialClear'
        - $ref: '#/components/schemas/AwsAccessKeyCredentialClear'
      discriminator:
        propertyName: credentialType
        mapping:
          vault-token: '#/components/schemas/VaultTokenCredentialClear'
          vault-machine: '#/components/schemas/VaultMachineCredentialClear'
          azure-client-secret: '#/components/schemas/AzureClientSecretCredentialClear'
          azure-certificate: '#/components/schemas/AzureCertificateCredentialClear'
          aws-access-key: '#/components/schemas/AwsAccessKeyCredentialClear'
    VaultTokenCredentialClear:
      type: object
      additionalProperties: false
      required: [credentialType, clearFields]
      properties:
        credentialType: { type: string, enum: [vault-token] }
        clearFields: { type: array, minItems: 1, uniqueItems: true, items: { type: string, enum: [token] } }
    VaultMachineCredentialClear:
      type: object
      additionalProperties: false
      required: [credentialType, clearFields]
      properties:
        credentialType: { type: string, enum: [vault-machine] }
        clearFields: { type: array, minItems: 1, uniqueItems: true, items: { type: string, enum: [roleId, secretId] } }
    AzureClientSecretCredentialClear:
      type: object
      additionalProperties: false
      required: [credentialType, clearFields]
      properties:
        credentialType: { type: string, enum: [azure-client-secret] }
        clearFields: { type: array, minItems: 1, uniqueItems: true, items: { type: string, enum: [directoryId, clientId, clientSecret] } }
    AzureCertificateCredentialClear:
      type: object
      additionalProperties: false
      required: [credentialType, clearFields]
      properties:
        credentialType: { type: string, enum: [azure-certificate] }
        clearFields: { type: array, minItems: 1, uniqueItems: true, items: { type: string, enum: [directoryId, clientId, certificatePem, privateKeyPem] } }
    AwsAccessKeyCredentialClear:
      type: object
      additionalProperties: false
      required: [credentialType, clearFields]
      properties:
        credentialType: { type: string, enum: [aws-access-key] }
        clearFields: { type: array, minItems: 1, uniqueItems: true, items: { type: string, enum: [accessKeyId, secretAccessKey, sessionToken] } }
    CredentialFieldState:
      type: object
      required: [field, state, generation]
      properties:
        field: { type: string }
        state: { $ref: '#/components/schemas/ConfiguredState' }
        generation: { type: integer, format: int64 }
    ProviderCredentialsState:
      type: object
      required: [fields, version]
      properties:
        fields:
          type: array
          items: { $ref: '#/components/schemas/CredentialFieldState' }
        version: { type: integer, format: int64 }
    ProviderSetupField:
      type: object
      required: [name, labelKey, inputKind, required, secret]
      properties:
        name: { type: string }
        labelKey: { type: string, description: Stable next-intl message key; not display copy. }
        inputKind: { type: string, enum: [text, url, select, secret, certificate] }
        required: { type: boolean }
        secret: { type: boolean }
        allowedValues:
          type: array
          items: { type: string }
    ProviderSetupOption:
      type: object
      required: [providerType, displayNameKey, capabilities, isolationModes, authenticationOptions, configurationFields]
      properties:
        providerType: { $ref: '#/components/schemas/ProviderType' }
        displayNameKey: { type: string, description: Stable next-intl message key; not display copy. }
        capabilities:
          type: array
          items: { $ref: '#/components/schemas/ProviderCapability' }
        isolationModes:
          type: array
          items: { $ref: '#/components/schemas/IsolationMode' }
        authenticationOptions:
          type: array
          items:
            type: object
            required: [mode, labelKey, credentialFields]
            properties:
              mode: { type: string, description: Stable server-defined authentication mode code. }
              labelKey: { type: string, description: Stable next-intl message key; not display copy. }
              credentialFields:
                type: array
                items: { $ref: '#/components/schemas/ProviderSetupField' }
        configurationFields:
          type: array
          items: { $ref: '#/components/schemas/ProviderSetupField' }
    ProviderSetupCatalog:
      type: object
      required: [providers]
      properties:
        providers:
          type: array
          items: { $ref: '#/components/schemas/ProviderSetupOption' }
    ConnectivityTestResult:
      type: object
      required: [status, probe, testedAt, capabilities, isolationMode]
      properties:
        status: { type: string, enum: [passed, failed] }
        probe: { type: string, enum: [authenticate, write-read-delete, read-only] }
        testedAt: { type: string, format: date-time }
        code: { $ref: '#/components/schemas/SanitizedStatusCode' }
        capabilities:
          type: array
          items: { $ref: '#/components/schemas/ProviderCapability' }
        isolationMode: { $ref: '#/components/schemas/IsolationMode' }
    PlatformStorageAssignment:
      type: object
      required: [assignmentId, displayName, providerType, readOnly, state, version]
      properties:
        assignmentId: { type: string, readOnly: true }
        displayName: { type: string }
        providerType: { $ref: '#/components/schemas/ProviderType' }
        readOnly: { type: boolean }
        state: { $ref: '#/components/schemas/LifecycleState' }
        version: { type: integer, format: int64 }
    Offering:
      type: object
      required: [offeringId, displayName, offeringRevision, capabilities, isolationMode, enabled, assignmentCount, state, version]
      properties:
        offeringId: { type: string, readOnly: true }
        displayName: { type: string }
        offeringRevision: { type: integer, format: int64 }
        capabilities:
          type: array
          items: { $ref: '#/components/schemas/ProviderCapability' }
        isolationMode: { $ref: '#/components/schemas/IsolationMode' }
        enabled: { type: boolean }
        assignmentCount: { type: integer, format: int64, readOnly: true }
        state: { $ref: '#/components/schemas/LifecycleState' }
        version: { type: integer, format: int64 }
    CreateOfferingRequest:
      type: object
      additionalProperties: false
      required: [displayName]
      properties:
        displayName: { type: string, minLength: 1, maxLength: 120 }
    UpdateOfferingRequest:
      type: object
      additionalProperties: false
      properties:
        displayName: { type: string, minLength: 1, maxLength: 120 }
        enabled: { type: boolean }
    TenantSecretPolicy:
      type: object
      required: [allowTenantManagedProviders, allowPlatformOfferings, requireBackendIsolation, allowedProviderTypes, retentionDays, version]
      properties:
        allowTenantManagedProviders: { type: boolean }
        allowPlatformOfferings: { type: boolean }
        requireBackendIsolation: { type: boolean }
        allowedProviderTypes:
          type: array
          items: { $ref: '#/components/schemas/TenantEligibleProviderType' }
          uniqueItems: true
        retentionDays: { type: integer, minimum: 0, maximum: 3650 }
        version: { type: integer, format: int64, readOnly: true }
    TenantSecretPolicyWrite:
      type: object
      additionalProperties: false
      required: [allowTenantManagedProviders, allowPlatformOfferings, requireBackendIsolation, allowedProviderTypes, retentionDays]
      properties:
        allowTenantManagedProviders: { type: boolean }
        allowPlatformOfferings: { type: boolean }
        requireBackendIsolation: { type: boolean }
        allowedProviderTypes:
          type: array
          items: { $ref: '#/components/schemas/TenantEligibleProviderType' }
          uniqueItems: true
        retentionDays: { type: integer, minimum: 0, maximum: 3650 }
    TenantPolicyOverride:
      allOf:
        - { $ref: '#/components/schemas/TenantSecretPolicy' }
        - type: object
          required: [tenantId]
          properties:
            tenantId: { type: string, readOnly: true }
    TenantOfferingUsageState:
      type: string
      description: >-
        Relationship between this tenant and the offering. `selected` is the offering behind the
        tenant's active assignment, `migration-target` is the destination of the tenant's open
        migration, and `available` is neither. The value is derived on the server from assignment
        and binding keys; it is never inferred from a display name, a provider type or a count.
      enum: [available, selected, migration-target]
    TenantOfferingMigrationBlockedReason:
      type: string
      description: >-
        Bounded sanitized reason why `migrationAllowed` is false. Carries no provider, endpoint,
        partition or locator detail.
      enum: [already-selected, migration-in-progress, offering-disabled, policy-denied]
    TenantSecretOfferingOption:
      type: object
      description: >-
        Tenant-scoped view of a platform offering. This is deliberately not the platform-admin
        `Offering` resource: it exposes no provider definition id, no provider revision, no binding
        id, no backend partition and no physical locator. `preflightEtag` is the opaque validator
        for this projected offering and is only usable for its path-addressed preflight mutation.
      required:
        [offeringId, preflightEtag, displayName, capabilities, isolationMode, usageState, migrationAllowed]
      properties:
        offeringId: { type: string, readOnly: true }
        preflightEtag:
          type: string
          readOnly: true
          description: >-
            Exact If-Match value for preflighting this offering. Treat as opaque; it fences the
            target offering and carries no provider identity or configuration.
        displayName: { type: string }
        capabilities:
          type: array
          items: { $ref: '#/components/schemas/ProviderCapability' }
          uniqueItems: true
        isolationMode: { $ref: '#/components/schemas/IsolationMode' }
        usageState: { $ref: '#/components/schemas/TenantOfferingUsageState' }
        migrationAllowed:
          type: boolean
          description: >-
            Server-derived eligibility to start a migration onto this offering. The currently
            selected offering and the target of an open migration are never eligible.
        migrationBlockedReason:
          allOf:
            - $ref: '#/components/schemas/TenantOfferingMigrationBlockedReason'
          description: Present only when `migrationAllowed` is false.
    TenantSecretOptions:
      type: object
      required: [effectivePolicy, permittedOfferings, tenantManagedProviderSetups]
      properties:
        effectivePolicy: { $ref: '#/components/schemas/TenantSecretPolicy' }
        permittedOfferings:
          type: array
          description: >-
            Offerings the tenant may use, plus the offering it already uses and the target of an
            open migration even when policy or the platform later withdrew them, so a live selection
            never silently disappears from the list.
          items: { $ref: '#/components/schemas/TenantSecretOfferingOption' }
        tenantManagedProviderSetups:
          type: array
          items: { $ref: '#/components/schemas/ProviderSetupOption' }
    TenantSecretAssignment:
      type: object
      required: [assignmentId, source, displayName, providerType, state, version]
      properties:
        assignmentId: { type: string, readOnly: true }
        source: { type: string, enum: [platform-offering, tenant-managed] }
        displayName: { type: string }
        providerType: { $ref: '#/components/schemas/ProviderType' }
        state: { $ref: '#/components/schemas/LifecycleState' }
        version: { type: integer, format: int64 }
    MigrationState:
      type: string
      enum: [preflighting, ready, copying, validating, cutover, retained, rolling-back, completed, failed, purged]
    MigrationProgress:
      type: object
      required: [completedItems, totalItems, phase]
      properties:
        completedItems: { type: integer, format: int64, minimum: 0 }
        totalItems: { type: integer, format: int64, minimum: 0 }
        phase: { type: string }
    SecretMigration:
      type: object
      required: [migrationId, state, progress, rollbackAvailable, purgeAvailable, version, createdAt, updatedAt]
      properties:
        migrationId: { type: string, readOnly: true }
        state: { $ref: '#/components/schemas/MigrationState' }
        progress: { $ref: '#/components/schemas/MigrationProgress' }
        rollbackAvailable: { type: boolean }
        purgeAvailable: { type: boolean }
        version: { type: integer, format: int64 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        failureCode: { $ref: '#/components/schemas/SanitizedStatusCode' }
    StartMigrationRequest:
      type: object
      additionalProperties: false
      description: The target is the candidate identified by the server-side preflight token.
      required: [preflightToken]
      properties:
        preflightToken:
          type: string
          minLength: 20
          description: Sensitive, opaque, short-lived token. Keep only in ephemeral client state.
    PreflightResult:
      type: object
      required: [preflightToken, status, checks, capabilities, isolationMode, expiresAt]
      properties:
        preflightToken:
          type: string
          minLength: 20
          description: Sensitive, opaque, short-lived token. Never log or persist in browser storage.
        status: { type: string, enum: [passed, failed] }
        checks:
          type: array
          items:
            type: object
            required: [code, status]
            properties:
              code: { $ref: '#/components/schemas/SanitizedStatusCode' }
              status: { type: string, enum: [passed, failed] }
        capabilities:
          type: array
          items: { $ref: '#/components/schemas/ProviderCapability' }
        isolationMode: { $ref: '#/components/schemas/IsolationMode' }
        expiresAt: { type: string, format: date-time }
    MigrationActionRequest:
      type: object
      additionalProperties: false
      properties:
        reason: { type: string, maxLength: 500 }
    CreateSecretValueRequest:
      type: object
      additionalProperties: false
      required: [purpose, value]
      properties:
        purpose:
          type: string
          pattern: '^[a-z][a-z0-9-]{0,119}$'
          description: Exact server-authorized semantic category for this actor and tenant. The server rejects categories absent from persisted CREATE grants; identifiers and logical or physical paths are forbidden.
        value: { type: string, writeOnly: true, minLength: 1, maxLength: 65536 }
    SecretValueHandle:
      type: object
      additionalProperties: false
      required: [secretId, purpose, generation, state, version, createdAt, updatedAt]
      properties:
        secretId: { type: string, pattern: '^sec_[A-Za-z0-9_-]{16,128}$', readOnly: true }
        purpose:
          type: string
          pattern: '^[a-z][a-z0-9-]{0,119}$'
          readOnly: true
        generation: { type: integer, format: int64 }
        state: { $ref: '#/components/schemas/LifecycleState' }
        version: { type: integer, format: int64 }
        createdAt: { type: string, format: date-time, readOnly: true }
        updatedAt: { type: string, format: date-time, readOnly: true }
