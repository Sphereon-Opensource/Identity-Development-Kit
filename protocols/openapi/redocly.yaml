# Redocly lint configuration for product OpenAPI specs.
# `npx @redocly/cli lint` must pass. The acceptance gate is `no-unresolved-refs: error`,
# which proves every same-directory `$ref` resolves under the flat single-folder layout.
#
# Baseline is `minimal` (most stylistic rules warn/off) because this repo is
# "consolidate now, normalize later". Only structural gates are errors.
# Component bundles (*-components.yml) are linted transitively via their referrers.
# external/** is intentionally NOT listed and is never linted.

extends:
  - minimal

