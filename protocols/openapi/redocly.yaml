rules:
  # Acceptance gates (must pass), structural integrity of the consolidated repo
  no-unresolved-refs: error
  no-identical-paths: error
  operation-operationId-unique: error

  # Deferred to the normalization pass, surfaced, not blocking
  struct: error
  no-invalid-parameter-examples: error
  no-invalid-media-type-examples: error
  no-example-value-and-externalValue: warn
  operation-4xx-response: off
  operation-2xx-response: off
  no-server-example.com: off
  info-license: off
  info-contact: off
  tag-description: off

  vdx-workflow-execution:
    root: workflow-execution-openapi.yml
