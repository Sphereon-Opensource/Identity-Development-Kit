# Pin the docker-java client API version to 1.44.
# Docker engine 29.x exposes API 1.53 but the docker-java client bundled by
# testcontainers is not compatible past 1.44. Without this pin, containers
# fail to start with version-negotiation errors.
# Ref: https://github.com/testcontainers/testcontainers-java/issues/11235
api.version=1.44
