# BYO OIDC example - minimal runtime configuration.
#
# Registers IDK's in-process software KMS provider. VerifyJwsCommand delegates
# to KeyManagerService.isValidRawSignature(...) which dispatches by signature
# algorithm to the first KMS provider that supports it - without a provider
# registered here, RS256 token verification fails with
# "No KMS found for signature algorithm RSA_SHA256".
#
# The software provider runs entirely in-process (no external HSM or cloud
# KMS), stays IDK-pure, and supports the RSA and EC algorithms Keycloak /
# Okta / Entra ID mint their access tokens with.
kms.providers.software.type=software
kms.providers.software.id=software
