server:
  rest:
    port: 8080
    auth:
      enabled: false
      anonymous:
        allowed: true

kms:
  providers:
    software:
      type: software
      enabled: true
      keystore:
        type: pkcs12
        id: software
        password: "${env:KEYSTORE_PASSWORD}"
        path: /app/keystore/keystore.p12

# Credential status lists — standalone, protocol-neutral (NOT nested under oid4vci). Each list is
# provisioned at startup and hosted at its own public root path (GET /public/statuslists/{id}); the
# `uri` here is the externally reachable address issued credentials embed and verifiers dereference. A
# credential type opts in via `oid4vci.issuer.credentials.[<id>].status-list-id` below.
statuslists:
  # Hosting driver config. `base-path` is the configurable mount for the public token-hosting REST
  # surface (default /public/statuslists), decoupled from the by-index management surface
  # (`management-base-path`, default /api/statuslist/v1). With `external-base-url` set, the `rest`
  # publisher derives a list's `uri` as <external-base-url><base-path>/<id>, so a list may omit `uri`.
  hosting:
    base-path: /public/statuslists
    management-base-path: /api/statuslist/v1
    external-base-url: "${env:EXTERNAL_BASE_URL}"
  ids: revocation
  "[revocation]":
    # Explicit `uri` (takes precedence). "revocation" is the list's correlationId; the hosting
    # `/{id}` endpoint resolves by technical id and falls back to correlationId, so the bare path
    # works (the `/by/<correlationId>` form also works).
    uri: "${env:EXTERNAL_BASE_URL}/public/statuslists/revocation"
    # Hosting driver: `rest` (this deployment serves it, default), `export` (self-host elsewhere),
    # or the github-pages/cdn seams. See StatusListPublisher.
    publisher: rest
    spec: token_status_list
    # Proof envelope: `jwt` (default for token_status_list, `application/statuslist+jwt`) or `cwt`
    # (binary COSE_Sign1, `application/statuslist+cwt`).
    proof-format: jwt
    purposes: revocation
    # The status list MUST be signed with the same issuer key + mechanism as the credentials that
    # reference it, or wallets reject it (trust anchor / signing method mismatch). The demo uses one
    # issuer identity (the CA-signed `PID` key) for its SD-JWT credentials and this list, so the list
    # carries the same DID `kid` (did:jwk mode) or the same `x5c` chain (haip/x509 mode) as the VC.
    signing-key-alias: PID
    signing-key-mode: "${env:OID4VCI_SIGNING_MODE}"
    # Short cache lifetime for the demo: drives both the token `ttl` claim and the hosted
    # `Cache-Control: max-age`, so a wallet/verifier sees a revocation within seconds instead of the
    # default 5 minutes. Production deployments keep this at minutes for the caching benefit.
    ttl-seconds: 5

oid4vci:
  issuer:
    identifier: "${env:EXTERNAL_BASE_URL}/oid4vci"
    authorization-servers: "${env:EXTERNAL_BASE_URL}/auth"
    # The SINGLE did:web document served at /.well-known/did.json carries every key this deployment
    # publishes, each at a descriptive per-alias fragment (e.g. did:web:<host>#PID): the issuer's
    # credential-signing keys under assertionMethod, and the verifier's request-object signing key
    # under authentication. The verifier key is shared into the issuer keystore by
    # lib/generate-keystores.sh so this service can publish its public key. Aliases not present in
    # the KMS are skipped.
    hosting:
      did-web:
        assertion-key-aliases: PID,TestCredential,AgeOver18,Mdl
        authentication-key-aliases: oid4vp-verifier-signing
    # Key alias in the issuer KMS used to sign issuer metadata (OID4VCI §13.2.4).
    # Reuses the TestCredential signing key for the demo; production should use a dedicated key.
    signing-key-alias: TestCredential
    credential-configuration-ids: TestCredential,EuPid,AgeOver18,Mdl
    # OID4VCI 1.0 §11.2.4: declare the JWE algs and enc methods the issuer accepts on
    # `credential_response_encryption`. Without these the metadata block is omitted and the
    # OIDF `VCICheckCredentialResponseEncryptionSupported` condition trips. The encryptor
    # validates the wallet's request against these lists and returns `invalid_encryption_parameters`
    # on a mismatch; `encryption-required` is the per-deployment policy switch.
    #
    # `zip_values_supported` advertises DEFLATE (RFC 7516 §4.1.3, JWE `zip="DEF"`). The OIDF
    # encrypted-variant conformance flow's `performCompressedEncryptionRequest` always asks
    # for `zip=DEF`, so without it advertised the encryptor's strict validator rejects with
    # `invalid_encryption_parameters`. The field is OPTIONAL in both 1.0 and 1.1; advertising
    # it is forward-compatible (1.0 wallets simply ignore the unknown field).
    encryption:
      response:
        alg-values-supported: "${env:OID4VCI_RESPONSE_ENC_ALG_VALUES:ECDH-ES,ECDH-ES+A128KW,ECDH-ES+A256KW}"
        enc-values-supported: "${env:OID4VCI_RESPONSE_ENC_ENC_VALUES:A256GCM,A128GCM}"
        zip-values-supported: "${env:OID4VCI_RESPONSE_ENC_ZIP_VALUES:DEF}"
        encryption-required: "${env:OID4VCI_RESPONSE_ENCRYPTION_REQUIRED:false}"
      # OID4VCI 1.0 §11.2.4 credential_request_encryption: the issuer's public key the wallet
      # encrypts credential requests TO. The `decryption-key-alias` points at a KMS-managed
      # ECDH-ES P-256 keypair (minted by lib/generate-keystores.{sh,ps1}) — the metadata builder
      # extracts the public JWK at request time and publishes the JWKS dynamically so we never
      # store private key material in YAML / git.
      #
      # `enc-values-supported` is REQUIRED by spec when this object is published. The
      # encryption_required flag is INDEPENDENT from the response side so an operator can
      # advertise request decryption without forcing it (or vice versa).
      request:
        decryption-key-alias: "${env:OID4VCI_REQUEST_DECRYPTION_KEY_ALIAS:oid4vci-request-decryption}"
        enc-values-supported: "${env:OID4VCI_REQUEST_ENC_ENC_VALUES:A256GCM,A128GCM}"
        zip-values-supported: "${env:OID4VCI_REQUEST_ENC_ZIP_VALUES:}"
        encryption-required: "${env:OID4VCI_REQUEST_ENCRYPTION_REQUIRED:false}"
    as-bridge:
      internal-url: "${env:OAUTH2_AS_INTERNAL_URL}"
      client-id: issuer-service
      client-secret: "${env:INTERNAL_CLIENT_SECRET}"
    # Credential configuration IDs AND claim names use bracket notation as map keys
    # (e.g. "[TestCredential]", "[family_name]"). The PropertyKeyNormalizer converts
    # underscores into dots when keys are bare (so `family_name` would become the
    # path `family.name` and silently rename the on-the-wire claim); bracket-quoting
    # tells the normalizer to preserve the segment verbatim. mso_mdoc deployments
    # also encode the namespace inline, e.g. "[org.iso.18013.5.1.birth_date]".
    credentials:
      "[TestCredential]":
        format: "dc+sd-jwt"
        vct: "${env:EXTERNAL_BASE_URL}/oid4vci/vct/TestCredential"
        scope: test_credential
        # Embed a Token Status List reference (status.status_list) into each issued credential,
        # allocating an entry in the `revocation` list defined above.
        status-list-id: revocation
        # One issuer identity for the demo's SD-JWT credentials AND their status list (see the
        # `statuslists.[revocation]` note): the CA-signed `PID` key, did:jwk by default and x5c under
        # the HAIP/x509 profiles. Keeping the credential and its status list on the same key+mode is
        # what lets a wallet trust the status list.
        signing-key-alias: PID
        signing-key-mode: "${env:OID4VCI_SIGNING_MODE}"
        signing-algorithms: ES256
        # Emits an `exp` claim on issued credentials. Omit to issue with no
        # expiration (both SD-JWT VC §3.2.2 and RFC 7519 §4.1.4 treat exp as OPTIONAL).
        expiration-in-days: 365
        binding-methods: jwk,did:jwk,did:key
        proof-types:
          jwt:
            signing-algorithms: ES256
        claims:
          "[given_name]":
            mandatory: false
            display:
              "[en-US]":
                label: "Given Name"
                description: "First name of the holder"
              "[de-DE]":
                label: "Vorname"
                description: "Vorname des Inhabers"
              "[es-ES]":
                label: "Nombre"
                description: "Nombre del titular"
              "[nl-NL]":
                label: "Voornaam"
                description: "Voornaam van de houder"
              "[fr-FR]":
                label: "Prénom"
                description: "Prénom du titulaire"
              "[zh-CN]":
                label: "名字"
                description: "持有人名字"
              "[ja-JP]":
                label: "名"
                description: "保持者の名"
          "[family_name]":
            mandatory: false
            display:
              "[en-US]":
                label: "Family Name"
                description: "Last name of the holder"
              "[de-DE]":
                label: "Nachname"
                description: "Nachname des Inhabers"
              "[es-ES]":
                label: "Apellido"
                description: "Apellido del titular"
              "[nl-NL]":
                label: "Achternaam"
                description: "Achternaam van de houder"
              "[fr-FR]":
                label: "Nom de famille"
                description: "Nom du titulaire"
              "[zh-CN]":
                label: "姓氏"
                description: "持有人姓氏"
              "[ja-JP]":
                label: "姓"
                description: "保持者の姓"
          "[email]":
            mandatory: true
            display:
              "[en-US]":
                label: "Email"
                description: "Email address of the holder"
              "[de-DE]":
                label: "E-Mail"
                description: "E-Mail-Adresse des Inhabers"
              "[es-ES]":
                label: "Correo electrónico"
                description: "Dirección de correo electrónico del titular"
              "[nl-NL]":
                label: "E-mail"
                description: "E-mailadres van de houder"
              "[fr-FR]":
                label: "E-mail"
                description: "Adresse e-mail du titulaire"
              "[zh-CN]":
                label: "电子邮箱"
                description: "持有人电子邮箱地址"
              "[ja-JP]":
                label: "メール"
                description: "保持者のメールアドレス"
        display:
          "[en-US]":
            name: "Test Credential"
            description: "A simple test credential containing basic identity claims"
            logo:
              uri: "${env:EXTERNAL_BASE_URL}/assets/sphereon-logo.png"
              alt-text: "Sphereon"
            background-image:
              uri: "${env:EXTERNAL_BASE_URL}/assets/sphereon-background.png"
            background-color: "#1a56db"
            text-color: "#ffffff"
          "[de-DE]":
            name: "Testnachweis"
            description: "Ein einfacher Testnachweis mit grundlegenden Identitätsdaten"
            logo:
              uri: "${env:EXTERNAL_BASE_URL}/assets/sphereon-logo.png"
              alt-text: "Sphereon"
            background-image:
              uri: "${env:EXTERNAL_BASE_URL}/assets/sphereon-background.png"
            background-color: "#1a56db"
            text-color: "#ffffff"
          "[es-ES]":
            name: "Credencial de Prueba"
            description: "Una credencial verificable de prueba con datos de identidad básicos"
            logo:
              uri: "${env:EXTERNAL_BASE_URL}/assets/sphereon-logo.png"
              alt-text: "Sphereon"
            background-image:
              uri: "${env:EXTERNAL_BASE_URL}/assets/sphereon-background.png"
            background-color: "#1a56db"
            text-color: "#ffffff"
          "[nl-NL]":
            name: "Testcredential"
            description: "Een eenvoudige testcredential met basisidentiteitsgegevens"
            logo:
              uri: "${env:EXTERNAL_BASE_URL}/assets/sphereon-logo.png"
              alt-text: "Sphereon"
            background-image:
              uri: "${env:EXTERNAL_BASE_URL}/assets/sphereon-background.png"
            background-color: "#1a56db"
            text-color: "#ffffff"
          "[fr-FR]":
            name: "Justificatif de test"
            description: "Un justificatif vérifiable de test contenant des informations d'identité basiques"
            logo:
              uri: "${env:EXTERNAL_BASE_URL}/assets/sphereon-logo.png"
              alt-text: "Sphereon"
            background-image:
              uri: "${env:EXTERNAL_BASE_URL}/assets/sphereon-background.png"
            background-color: "#1a56db"
            text-color: "#ffffff"
          "[zh-CN]":
            name: "测试凭证"
            description: "包含基本身份声明的简单测试凭证"
            logo:
              uri: "${env:EXTERNAL_BASE_URL}/assets/sphereon-logo.png"
              alt-text: "Sphereon"
