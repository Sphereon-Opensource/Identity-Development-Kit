                label: "Apellido"
                description: "Apellido del titular"
              "[nl-NL]":
                label: "Achternaam"
                description: "Achternaam"
              "[fr-FR]":
                label: "Nom de famille"
                description: "Nom"
              "[zh-CN]":
                label: "姓氏"
                description: "姓"
              "[ja-JP]":
                label: "姓"
