      # ISO 18013-5 mobile Driver's License. doctype = "org.iso.18013.5.1.mDL",
      # data elements live in the "org.iso.18013.5.1" namespace per ISO 18013-5

      "[Mdl]":
        format: "mso_mdoc"
        doctype: "org.iso.18013.5.1.mDL"
        scope: mdl
        signing-key-alias: Mdl
        signing-algorithms: ES256
        expiration-in-days: 365
        binding-methods: cose_key
        proof-types:
          jwt:
            signing-algorithms: ES256
            key-attestations:
              enabled: "${env:OID4VCI_MDL_KEY_ATTESTATIONS_REQUIRED:false}"
              key-storage: "${env:OID4VCI_MDL_KEY_ATTESTATIONS_KEY_STORAGE:iso_18045_moderate}"
              user-authentication: "${env:OID4VCI_MDL_KEY_ATTESTATIONS_USER_AUTH:iso_18045_moderate}"
              key-attester-trust:
                jwks: "${env:OID4VCI_MDL_KEY_ATTESTER_JWKS:}"
        # Bracket notation per the convention noted at the top of `credentials:` —
        # ensures dotted claim keys are treated as a single map key (namespace +
        # element id) rather than a nested path by the YAML/property loader.
        claims:
          "[org.iso.18013.5.1.family_name]":
            mandatory: true
            display:
              "[en-US]":
