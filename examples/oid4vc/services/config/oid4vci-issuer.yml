              uri: "${env:EXTERNAL_BASE_URL}/assets/sphereon-background.png"
            background-color: "#1a56db"
            text-color: "#ffffff"
          "[ja-JP]":
            name: "テストクレデンシャル"
            description: "基本的なID情報を含むシンプルなテストクレデンシャル"
            logo:
              uri: "${env:EXTERNAL_BASE_URL}/assets/sphereon-logo.png"
              alt-text: "Sphereon"
            background-image:
              uri: "${env:EXTERNAL_BASE_URL}/assets/sphereon-background.png"
            background-color: "#1a56db"
            text-color: "#ffffff"
      "[EuPid]":
        format: "dc+sd-jwt"
        vct: "${env:EXTERNAL_BASE_URL}/oid4vci/vct/EuPid"
        scope: eu_pid
        status-list-id: revocation
        signing-key-alias: PID
        # Signing-key mode is profile-driven (docker-compose passes OID4VCI_SIGNING_MODE, defaulting
        # to did:jwk — the issuer-wide mode shared by every SD-JWT credential and the status list).
        # The plain `default` demo uses did:jwk so any wallet can verify the credential self-contained,
        # with no out-of-band CA trust. The conformance x509/HAIP profiles set it to x5c: HAIP §4.3
        # requires the issuer to convey its certificate via the JOSE `x5c` header. The PID signing key
        # in the keystore is CA-signed (IDK E2E CA), so the chain is served straight from the KMS-stored
        # JWK's x5c attribute — but the wallet must then trust that CA out-of-band (the CA is NOT
        # bundled in x5c, per HAIP §5).
        signing-key-mode: "${env:OID4VCI_SIGNING_MODE}"
        signing-algorithms: ES256
        # HAIP §6.1-2.2 RECOMMENDS limiting validity via `exp`, status claim, or both. PID
        # credentials get a 1-year window; tune per deployment policy.
        expiration-in-days: 365
        binding-methods: jwk,did:jwk,did:key
        proof-types:
          jwt:
            signing-algorithms: ES256
            # OID4VCI 1.0 §11.2.3 + §7.2. `enabled: true` publishes the
            # `key_attestations_required` metadata field and forces every proof to carry a
            # verifiable key attestation; `false` (the default) omits the field and accepts
            # proofs without one. When enabled, `key-storage` / `user-authentication` are
            # the minimum-acceptable ISO 18045 attack-potential-resistance levels.
            #
            # `key-attester-trust` is part of the same group — only meaningful when
            # attestations are enabled. Its `jwks` is a JSON array of JWK objects (the OIDF
            # conformance plan publishes its attester JWKS in this exact shape under
            # `vci_key_attestation_jwks`). When unset and the policy is on, only `x5c`-
            # bound attestations validated against the global lib/trust/x509 anchors are
            # accepted.
            key-attestations:
              enabled: "${env:OID4VCI_EUPID_KEY_ATTESTATIONS_REQUIRED:false}"
              key-storage: "${env:OID4VCI_EUPID_KEY_ATTESTATIONS_KEY_STORAGE:iso_18045_moderate}"
              user-authentication: "${env:OID4VCI_EUPID_KEY_ATTESTATIONS_USER_AUTH:iso_18045_moderate}"
              key-attester-trust:
                jwks: "${env:OID4VCI_EUPID_KEY_ATTESTER_JWKS:}"
        claims:
          "[family_name]":
            mandatory: true
            sd: "allowed"
            display:
              "[en-US]":
