openapi: 3.0.4
info:
  title: License Portal API
  version: 1.0.0
  description: |
    Operator API for managing license partners and customers, deployment records,
    imported customer license requests, license issuance, revocation, and protected
    setup bundle downloads.

    Licensee-initiated issuance starts with an imported signed request artifact
    from the target platform. Issuer-initiated issuance can create a complete
    protected setup bundle directly from portal-entered customer, deployment,
    and license details.
servers:
  - url: https://api.example.com/api/license-portal/v1
    description: Production
  - url: http://localhost:8085/api/license-portal/v1
    description: Local development
tags:
  - name: License Portal
security:
  - bearerAuth: []
paths:
  /me:
    get:
      tags: [License Portal]
      operationId: getLicensePortalOperator
      summary: Get the authenticated portal operator
      responses:
        '200':
          description: Current authenticated operator.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LicensePortalOperator'
  /:
    get:
      tags: [License Portal]
      operationId: licensePortalSnapshot
      summary: Get the portal dashboard snapshot
      responses:
        '200':
          description: Current portal snapshot.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LicensePortalSnapshot'
  /partners:
    get:
      tags: [License Portal]
      operationId: listLicensePartners
      summary: List partners
      responses:
        '200':
          description: Partner list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListPartnersResult'
    post:
      tags: [License Portal]
      operationId: createLicensePartner
      summary: Create a partner
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePartnerArgs'
      responses:
        '201':
          description: Created partner.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LicensePartner'
  /partners/{partyId}:
    put:
      tags: [License Portal]
      operationId: updateLicensePartner
      summary: Update a partner
      parameters:
        - $ref: '#/components/parameters/partyId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePartnerArgs'
      responses:
        '200':
          description: Updated partner.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LicensePartner'
  /customers:
    get:
      tags: [License Portal]
      operationId: listLicenseCustomers
      summary: List customers
      responses:
        '200':
          description: Customer list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListCustomersResult'
    post:
      tags: [License Portal]
      operationId: createLicenseCustomer
      summary: Create a customer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCustomerArgs'
      responses:
        '201':
          description: Created customer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LicenseCustomer'
  /customers/{partyId}:
    put:
      tags: [License Portal]
      operationId: updateLicenseCustomer
      summary: Update a customer
      parameters:
        - $ref: '#/components/parameters/partyId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCustomerArgs'
      responses:
        '200':
          description: Updated customer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LicenseCustomer'
  /customers/{partyId}/disable:
    post:
      tags: [License Portal]
      operationId: disableLicenseCustomer
      summary: Disable a customer
      parameters:
        - $ref: '#/components/parameters/partyId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DisableCustomerArgs'
      responses:
        '200':
          description: Disabled customer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LicenseCustomer'
  /deployments:
    get:
      tags: [License Portal]
      operationId: listLicenseDeployments
      summary: List deployments
      responses:
        '200':
          description: Deployment list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListDeploymentsResult'
    post:
      tags: [License Portal]
      operationId: registerLicenseDeployment
      summary: Register a deployment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterDeploymentArgs'
      responses:
        '201':
          description: Registered deployment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LicenseDeployment'
  /deployments/{installationId}:
    put:
      tags: [License Portal]
      operationId: updateLicenseDeployment
      summary: Update a deployment
      parameters:
        - $ref: '#/components/parameters/installationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDeploymentArgs'
      responses:
        '200':
          description: Updated deployment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LicenseDeployment'
  /deployments/{installationId}/disable:
    post:
      tags: [License Portal]
      operationId: disableLicenseDeployment
      summary: Disable a deployment
      parameters:
        - $ref: '#/components/parameters/installationId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DisableDeploymentArgs'
      responses:
        '200':
          description: Disabled deployment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LicenseDeployment'
  /templates:
    get:
      tags: [License Portal]
      operationId: listLicenseTemplates
      summary: List license templates
      responses:
        '200':
          description: Template list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListTemplatesResult'
    post:
      tags: [License Portal]
      operationId: createLicenseTemplate
      summary: Create a license template
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTemplateArgs'
      responses:
        '201':
          description: Created template.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LicenseTemplate'
  /requests:
    post:
      tags: [License Portal]
      operationId: createLicenseRequest
      summary: Create or import a license request
      description: |
        Creates a portal license request. For licensee-initiated issuance,
        include the signed platform request artifact generated by the target
        platform. The artifact is validated by the portal before it is used for
        certificate and license issuance.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateLicenseRequestArgs'
      responses:
        '201':
          description: Created license request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LicenseIssueRequest'
  /requests/preview:
    post:
      tags: [License Portal]
      operationId: previewLicenseRequest
      summary: Preview a license request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PreviewLicenseRequestArgs'
      responses:
        '200':
          description: License preview.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LicensePreviewResult'
  /licenses:
    get:
      tags: [License Portal]
      operationId: listIssuedLicenses
      summary: List issued licenses
      responses:
        '200':
          description: Issued license list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListLicensesResult'
    post:
      tags: [License Portal]
      operationId: issueLicense
      summary: Issue a license
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IssueLicenseArgs'
      responses:
        '201':
          description: Issued license.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssuedLicenseResponse'
  /licenses/bundle:
    post:
      tags: [License Portal]
      operationId: issueLicenseBundle
      summary: Issue a protected setup bundle
      description: |
        Issues a license and returns a protected setup bundle. When `requestId`
        is supplied, recipient key and platform certificate data come from
        the imported license request. When `requestId` is omitted, the portal
        creates the recipient keypair, certificate, and license in one
        operation and places the activation files in the protected bundle.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IssueLicenseArgs'
      responses:
        '201':
          description: Multipart response with JSON metadata and the protected setup bundle.
          content:
            multipart/mixed:
              schema:
                type: string
                format: binary
  /licenses/verify:
    post:
      tags: [License Portal]
      operationId: verifyIssuedLicense
      summary: Verify a license artifact
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyLicenseArgs'
      responses:
        '200':
          description: Verification result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyLicenseResult'
  /licenses/{licenseId}:
    get:
      tags: [License Portal]
      operationId: getIssuedLicense
      summary: Get an issued license
      parameters:
        - $ref: '#/components/parameters/licenseId'
      responses:
        '200':
          description: Issued license.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssuedLicenseResponse'
  /licenses/{licenseId}/download:
    get:
      tags: [License Portal]
      operationId: downloadIssuedLicense
      summary: Download an issued license
      description: |
        Returns a protected setup bundle ZIP for importing the issued license.
      parameters:
        - $ref: '#/components/parameters/licenseId'
      responses:
        '200':
          description: Protected setup license bundle ZIP.
          content:
            application/zip:
              schema:
                type: string
                format: binary
  /licenses/{licenseId}/revoke:
    post:
      tags: [License Portal]
      operationId: revokeIssuedLicense
      summary: Revoke an issued license
      parameters:
        - $ref: '#/components/parameters/licenseId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RevokeLicenseArgs'
      responses:
        '200':
          description: Revoked license.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssuedLicenseResponse'
  /ca:
    get:
      tags: [License Portal]
      operationId: licenseIssuerStatus
      summary: Get license issuer status
      responses:
        '200':
          description: Issuer status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LicenseIssuerStatus'
  /tenants:
    get:
      tags: [License Portal]
      operationId: listLicenseTenants
      summary: List portal tenants
      responses:
        '200':
          description: Tenant list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListTenantsResult'
  /contacts:
    get:
      tags: [License Portal]
      operationId: listLicenseContacts
      summary: List contacts
      responses:
        '200':
          description: Contact list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListContactsResult'
    post:
      tags: [License Portal]
      operationId: createLicenseContact
      summary: Create a contact
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateContactArgs'
      responses:
        '201':
          description: Created contact.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LicenseContact'
  /contacts/{contactId}:
    put:
      tags: [License Portal]
      operationId: updateLicenseContact
      summary: Update a contact
      parameters:
        - $ref: '#/components/parameters/contactId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateContactArgs'
      responses:
        '200':
          description: Updated contact.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LicenseContact'
  /contacts/{contactId}/enable-login:
    post:
      tags: [License Portal]
      operationId: enableLicenseContactLogin
      summary: Enable login for a contact
      parameters:
        - $ref: '#/components/parameters/contactId'
      responses:
        '200':
          description: Updated contact.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LicenseContact'
  /signing-assignments:
    get:
      tags: [License Portal]
      operationId: listLicenseSigningAssignments
      summary: List signing assignments
      responses:
        '200':
          description: Signing assignment list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListSigningAssignmentsResult'
    post:
      tags: [License Portal]
      operationId: assignLicenseSigningCertificate
      summary: Assign a signing certificate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignSigningCertificateArgs'
      responses:
        '200':
          description: Signing assignment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LicenseSigningAssignment'
  /partner-ca:
    post:
      tags: [License Portal]
      operationId: assignLicensePartnerCa
      summary: Assign a partner CA
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignPartnerCaArgs'
      responses:
        '200':
          description: Signing assignment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LicenseSigningAssignment'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    partyId:
      name: partyId
      in: path
      required: true
      schema:
        type: string
    installationId:
      name: installationId
      in: path
      required: true
      schema:
        type: string
    contactId:
      name: contactId
      in: path
      required: true
      schema:
        type: string
    licenseId:
      name: licenseId
      in: path
      required: true
      schema:
        type: string
  schemas:
    JsonObject:
      type: object
      additionalProperties: true
    StringMap:
      type: object
      additionalProperties:
        type: string
    LongMap:
      type: object
      additionalProperties:
        type: integer
        format: int64
    LicenseGateRules:
      type: object
      properties:
        enabled:
          type: array
          items:
            type: string
          uniqueItems: true
          default: []
        disabled:
          type: array
          items:
            type: string
          uniqueItems: true
          default: []
    LicenseGatePolicy:
      type: object
      properties:
        productFeatures:
          $ref: '#/components/schemas/LicenseGateRules'
        commands:
          $ref: '#/components/schemas/LicenseGateRules'
    LicensePortalOperator:
      type: object
      required: [tenantId, principalId, displayName, authenticated]
      properties:
        tenantId:
          type: string
        principalId:
          type: string
        displayName:
          type: string
        email:
          type: string
          format: email
        authenticated:
          type: boolean
    LicensePortalSnapshot:
      type: object
      required: [mode, partners, customers, softwareServices, deployments, profiles, templates, requests, licenses, audit]
      properties:
        mode:
          type: string
        tenants:
          type: array
          items:
            $ref: '#/components/schemas/LicenseTenant'
          default: []
        partners:
          type: array
          items:
            $ref: '#/components/schemas/LicensePartner'
        customers:
          type: array
          items:
            $ref: '#/components/schemas/LicenseCustomer'
        contacts:
          type: array
          items:
            $ref: '#/components/schemas/LicenseContact'
          default: []
        softwareServices:
          type: array
          items:
            $ref: '#/components/schemas/LicenseSoftwareService'
        deployments:
          type: array
          items:
            $ref: '#/components/schemas/LicenseDeployment'
        profiles:
          type: array
          items:
            $ref: '#/components/schemas/LicenseProfile'
        templates:
          type: array
          items:
            $ref: '#/components/schemas/LicenseTemplate'
        requests:
          type: array
          items:
            $ref: '#/components/schemas/LicenseIssueRequest'
        licenses:
          type: array
          items:
            $ref: '#/components/schemas/IssuedLicenseSummary'
        audit:
          type: array
          items:
            $ref: '#/components/schemas/LicensePortalAuditEvent'
        signingAssignments:
          type: array
          items:
            $ref: '#/components/schemas/LicenseSigningAssignment'
          default: []
        tenantId:
          type: string
    LicenseTenantPolicy:
      type: object
      properties:
        permittedProducts:
          type: array
          items:
            type: string
          default: [EDK, VDX]
        permittedDomains:
          type: array
          items:
            type: string
          default: ['*']
        maxValidityDays:
          type: integer
          format: int32
          default: 365
        maxTenants:
          type: integer
          format: int64
        caDelegationAllowed:
          type: boolean
          default: false
        canHostPortal:
          type: boolean
          default: false
    LicenseTenant:
      type: object
      required: [tenantId, kind, operatingMode, loginEnabled, status, policy, createdAt, updatedAt]
      properties:
        tenantId:
          type: string
        parentTenantId:
          type: string
        representedPartyId:
          type: string
        kind:
          type: string
        operatingMode:
          type: string
        loginEnabled:
          type: boolean
        status:
          type: string
        policy:
          $ref: '#/components/schemas/LicenseTenantPolicy'
        createdAt:
          type: string
        updatedAt:
          type: string
    ListTenantsResult:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/LicenseTenant'
    LicensePartner:
      type: object
      required: [partyId, displayName, legalName, partnerType, loginEnabled, status, createdAt, updatedAt]
      properties:
        partyId:
          type: string
        displayName:
          type: string
        legalName:
          type: string
        parentPartnerPartyId:
          type: string
        partnerType:
          type: string
          enum: [managed-by-parent, login-enabled]
        loginEnabled:
          type: boolean
        representedTenantId:
          type: string
        status:
          type: string
        contactEmail:
          type: string
          format: email
        websiteUrl:
          type: string
        profileId:
          type: string
        profileVersion:
          type: string
        createdAt:
          type: string
        updatedAt:
          type: string
        tenantId:
          type: string
    LicenseCustomer:
      type: object
      required: [partyId, displayName, legalName, status, createdAt, updatedAt]
      properties:
        partyId:
          type: string
        displayName:
          type: string
        legalName:
          type: string
        partnerPartyId:
          type: string
        representedTenantId:
          type: string
        status:
          type: string
        contactEmail:
          type: string
          format: email
        websiteUrl:
          type: string
        profileId:
          type: string
        profileVersion:
          type: string
        createdAt:
          type: string
        updatedAt:
          type: string
        tenantId:
          type: string
    CreatePartnerArgs:
      type: object
      required: [displayName]
      properties:
        displayName:
          type: string
        legalName:
          type: string
        parentPartnerPartyId:
          type: string
        partnerType:
          type: string
          enum: [managed-by-parent, login-enabled]
          default: managed-by-parent
        contactEmail:
          type: string
          format: email
        websiteUrl:
          type: string
        profileId:
          type: string
        profileVersion:
          type: string
        attributes:
          $ref: '#/components/schemas/JsonObject'
    CreateCustomerArgs:
      type: object
      required: [displayName]
      properties:
        displayName:
          type: string
        legalName:
          type: string
        partnerPartyId:
          type: string
        contactEmail:
          type: string
          format: email
        websiteUrl:
          type: string
        profileId:
          type: string
        profileVersion:
          type: string
        attributes:
          $ref: '#/components/schemas/JsonObject'
    UpdatePartnerArgs:
      type: object
      required: [displayName]
      properties:
        partyId:
          type: string
        displayName:
          type: string
        legalName:
          type: string
        contactEmail:
          type: string
          format: email
        websiteUrl:
          type: string
    UpdateCustomerArgs:
      type: object
      required: [displayName]
      properties:
        partyId:
          type: string
        displayName:
          type: string
        legalName:
          type: string
        partnerPartyId:
          type: string
        contactEmail:
          type: string
          format: email
        websiteUrl:
          type: string
    ListPartnersResult:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/LicensePartner'
    ListCustomersResult:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/LicenseCustomer'
    LicenseContactSpecialization:
      type: object
      required: [contactType, semanticProfileId, semanticProfileVersion, semanticDerivationType]
      properties:
        contactType:
          type: string
        semanticProfileId:
          type: string
        semanticProfileVersion:
          type: string
        semanticDerivationType:
          type: string
        attributes:
          $ref: '#/components/schemas/JsonObject'
    ContactSpecializationInput:
      type: object
      required: [contactType]
      properties:
        contactType:
          type: string
        semanticProfileId:
          type: string
        semanticProfileVersion:
          type: string
        semanticDerivationType:
          type: string
        attributes:
          $ref: '#/components/schemas/JsonObject'
    LicenseContact:
      type: object
      required: [contactId, tenantId, naturalPersonPartyId, organizationPartyId, displayName, email, specializations, loginEnabled, status, createdAt, updatedAt]
      properties:
        contactId:
          type: string
        tenantId:
          type: string
        naturalPersonPartyId:
          type: string
        organizationPartyId:
          type: string
        displayName:
          type: string
        email:
          type: string
          format: email
        specializations:
          type: array
          items:
            $ref: '#/components/schemas/LicenseContactSpecialization'
        loginEnabled:
          type: boolean
        status:
          type: string
        createdAt:
          type: string
        updatedAt:
          type: string
    CreateContactArgs:
      type: object
      required: [organizationPartyId, displayName, email]
      properties:
        naturalPersonPartyId:
          type: string
        organizationPartyId:
          type: string
        displayName:
          type: string
        email:
          type: string
          format: email
        specializations:
          type: array
          items:
            $ref: '#/components/schemas/ContactSpecializationInput'
          default: []
    UpdateContactArgs:
      type: object
      required: [displayName, email]
      properties:
        contactId:
          type: string
        displayName:
          type: string
        email:
          type: string
          format: email
        specializations:
          type: array
          items:
            $ref: '#/components/schemas/ContactSpecializationInput'
          default: []
        status:
          type: string
          default: active
    ListContactsResult:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/LicenseContact'
    LicenseDeployment:
      type: object
      required: [installationId, customerPartyId, softwarePartyId, displayName, deploymentType, environment, status, createdAt, updatedAt]
      properties:
        installationId:
          type: string
        customerPartyId:
          type: string
        softwarePartyId:
          type: string
        displayName:
          type: string
        softwareDisplayName:
          type: string
        deploymentType:
          type: string
        environment:
          type: string
        region:
          type: string
        status:
          type: string
        recipientKeyId:
          type: string
        recipientPublicKeyPem:
          type: string
        recipientPublicKeyFingerprint:
          type: string
        createdAt:
          type: string
        updatedAt:
          type: string
        tenantId:
          type: string
    LicenseSoftwareService:
      type: object
      required: [partyId, displayName, softwareKind, capabilityCount, createdAt, updatedAt]
      properties:
        partyId:
          type: string
        displayName:
          type: string
        softwareKind:
          type: string
        managementMode:
          type: string
        capabilityCount:
