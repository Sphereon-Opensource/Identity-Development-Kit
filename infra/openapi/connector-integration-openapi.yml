    ConnectorResource:
      description: Resource descriptor attached to a connector instance. This creates the bridge between a durable connector and a logical resource shape.
      allOf:
        - $ref: '#/components/schemas/AttachConnectorResourceRequest'
        - type: object
          required:
            - connectorResourceId
            - connectorInstanceId
          properties:
            connectorResourceId:
              $ref: '#/components/schemas/ConnectorResourceId'
            connectorInstanceId:
              $ref: '#/components/schemas/ConnectorInstanceId'
      example:
        connectorResourceId: b4cf21b1-0292-4803-8d32-9ebf9f5359a2
        connectorInstanceId: 3f6f4f46-24fb-4c35-a7a4-bc6c7f7861f5
        resourceDescriptorId: 41436f49-040c-4f5f-9c7f-657f43762e2b
        role: SOURCE
        externalResourceName: /employees/{employee_id}
        accessProtocol: HTTPS
        endpointId: 27d8bfc5-6c75-4e4e-a78a-63ad7a924cb1

    ConnectorHttpMethod:
      type: string
      enum:
        - GET
        - HEAD
        - POST
        - PUT
        - PATCH
        - DELETE

    ConnectorTrustedExecutionValue:
      type: string
      enum:
        - OIN
        - ORGANISATION_CODE
        - SYSTEM
        - CALLER
        - RFC3339_UTC_TIME
        - CORRELATION_ID
        - IDEMPOTENCY_KEY
        - CONSUMER_APPLICATION
        - SOURCE_APPLICATION

    ConnectorHttpFieldSelector:
      description: "ConnectorFieldSelector restricted for typed HTTP: exactly one non-null selector, nonblank, with 1..128 path segments. JSON-pointer-style paths split on slash; other paths remove an optional $. prefix and split on dots, ignoring empty dot segments. Runtime enforces the shared depth bound."
      allOf:
        - $ref: "#/components/schemas/ConnectorFieldSelector"
      oneOf:
        - required:
            - canonicalFieldPath
          properties:
            canonicalFieldPath: &a1
              type: string
              minLength: 1
              pattern: \S
        - required:
            - connectorField
          properties:
            connectorField: *a1
        - required:
            - protocolClaimPath
          properties:
            protocolClaimPath: *a1
        - required:
            - dcqlCredentialQueryId
          properties:
            dcqlCredentialQueryId: *a1
        - required:
            - dcqlClaimId
          properties:
            dcqlClaimId: *a1
        - required:
            - formFieldPath
          properties:
            formFieldPath: *a1
        - required:
            - proofRef
          properties:
            proofRef: *a1
        - required:
            - statusRef
          properties:
            statusRef: *a1
        - required:
            - tokenRef
          properties:
            tokenRef: *a1
        - required:
            - sourceFieldPath
          properties:
            sourceFieldPath: *a1
        - required:
            - dataProductFieldScope
          properties:
            dataProductFieldScope: *a1
        - required:
            - contractAgreementTargetRef
          properties:
            contractAgreementTargetRef: *a1
        - required:
            - semanticReference
          properties:
            semanticReference:
              allOf:
                - $ref: "#/components/schemas/SemanticReference"
                - type: object
                  required:
                    - referenceId
                  properties:
                    referenceId: *a1

    ConnectorHttpValueSource:
      type: object
      description: Exactly one non-null provenance source. Trusted execution values are resolved by the command, never accepted as caller-supplied credentials.
      properties:
        callerField:
          type: object
          nullable: true
          description: Caller-controlled field selector; mutually exclusive with a non-null trustedExecutionValue.
          allOf:
            - $ref: "#/components/schemas/ConnectorHttpFieldSelector"
        trustedExecutionValue:
          type: string
          nullable: true
          allOf:
            - $ref: "#/components/schemas/ConnectorTrustedExecutionValue"
      oneOf:
        - required:
            - callerField
          properties:
            callerField:
              $ref: "#/components/schemas/ConnectorHttpFieldSelector"
        - required:
            - trustedExecutionValue
          properties:
            trustedExecutionValue:
              $ref: "#/components/schemas/ConnectorTrustedExecutionValue"

    ConnectorHttpPathMapping:
      type: object
      required:
        - name
        - source
      properties:
        name:
          type: string
          pattern: ^[A-Za-z][A-Za-z0-9_-]*$
        source:
          $ref: "#/components/schemas/ConnectorHttpValueSource"

    ConnectorHttpQueryMapping:
      type: object
      required:
        - name
        - source
      properties:
        name:
          type: string
          minLength: 1
          pattern: ^[A-Za-z0-9!#$%&'*+.^_`|~-]+$
        source:
          $ref: "#/components/schemas/ConnectorHttpValueSource"

    ConnectorHttpHeaderMapping:
      type: object
      required:
        - name
        - source
      properties:
        name:
          type: string
          minLength: 1
          pattern: ^[A-Za-z0-9!#$%&'*+.^_`|~-]+$
          not:
            pattern: "^(?:(?:[aA][uU][tT][hH][oO][rR][iI][zZ][aA][tT][iI][oO][nN]|[cC][oO][oO][kK][iI][eE]|[sS][eE][tT]-[cC][oO][oO][kK][iI][eE]|[hH][oO][sS][tT]|[cC][oO][nN][tT][eE][nN][tT]-[lL][eE][nN][gG][tT][hH]|[cC][oO][nN][tT][eE][nN][tT]-[tT][yY][pP][eE]|[aA][cC][cC][eE][pP][tT]|[cC][oO][nN][tT][eE][nN][tT]-[eE][nN][cC][oO][dD][iI][nN][gG]|[aA][cC][cC][eE][pP][tT]-[eE][nN][cC][oO][dD][iI][nN][gG]|[cC][oO][nN][nN][eE][cC][tT][iI][oO][nN]|[tT][rR][aA][nN][sS][fF][eE][rR]-[eE][nN][cC][oO][dD][iI][nN][gG]|[tT][eE]|[tT][rR][aA][iI][lL][eE][rR]|[uU][pP][gG][rR][aA][dD][eE]|[kK][eE][eE][pP]-[aA][lL][iI][vV][eE]|[fF][oO][rR][wW][aA][rR][dD][eE][dD]|[vV][iI][aA])(?![\\s\\S])|[pP][rR][oO][xX][yY]-|[sS][eE][cC]-|[xX]-[fF][oO][rR][wW][aA][rR][dD][eE][dD]-)"
          description: HTTP token; case-insensitively rejects authorization, cookie, set-cookie, host, content-length, content-type, accept, content-encoding, accept-encoding, connection, transfer-encoding, te, trailer, upgrade, keep-alive, forwarded, via, and proxy-/sec-/x-forwarded- prefixes. Security and transport own these headers.
        source:
          $ref: "#/components/schemas/ConnectorHttpValueSource"

    ConnectorHttpJsonFieldMapping:
      type: object
      required:
        - target
        - source
      properties:
        target:
          $ref: "#/components/schemas/ConnectorHttpFieldSelector"
        source:
          $ref: "#/components/schemas/ConnectorHttpValueSource"

    ConnectorHttpJsonRequestMapping:
      type: object
      required:
        - schemaRef
      properties:
        schemaRef:
          type: string
          minLength: 1
          pattern: ^[^\s\x00-\x1F]+$
        fieldMappings:
          type: array
          items:
            $ref: "#/components/schemas/ConnectorHttpJsonFieldMapping"
          default: []
          description: Targets must be unique by selector key.

    ConnectorHttpFieldMapping:
      allOf:
        - $ref: "#/components/schemas/ConnectorFieldMapping"
        - type: object
          properties:
            source:
              $ref: "#/components/schemas/ConnectorHttpFieldSelector"
            target:
              $ref: "#/components/schemas/ConnectorHttpFieldSelector"

    ConnectorHttpSubsetMapping:
      description: Existing subset mapping with HTTP-valid selectors. Each selector list must be unique by selector key; output mapping sources and targets must each be unique.
      allOf:
        - $ref: "#/components/schemas/ConnectorSubsetMapping"
        - type: object
          properties:
            inputFields:
              type: array
              items:
                $ref: "#/components/schemas/ConnectorHttpFieldSelector"
              default: []
            selectedFields:
              type: array
              items:
                $ref: "#/components/schemas/ConnectorHttpFieldSelector"
              default: []
            producedFields:
              type: array
              items:
                $ref: "#/components/schemas/ConnectorHttpFieldSelector"
              default: []
            sourceProvenanceFields:
              type: array
              items:
                $ref: "#/components/schemas/ConnectorHttpFieldSelector"
              default: []
            qualityStatusFields:
              type: array
              items:
                $ref: "#/components/schemas/ConnectorHttpFieldSelector"
              default: []
            outputMappings:
              type: array
              items:
                $ref: "#/components/schemas/ConnectorHttpFieldMapping"
              default: []

    ConnectorHttpJsonResponseMapping:
      type: object
      description: Response JSON must match schemaRef before subset projection. Omitted subsetMapping uses empty selector and mapping lists.
      required:
        - schemaRef
      properties:
        schemaRef:
          type: string
          minLength: 1
          pattern: ^[^\s\x00-\x1F]+$
        subsetMapping:
          $ref: "#/components/schemas/ConnectorHttpSubsetMapping"

    ConnectorHttpPayloadLimits:
      type: object
      description: Positive configured bounds; the runtime additionally caps both against its hard payload limit.
      required:
        - maxRequestBytes
        - maxResponseBytes
      properties:
        maxRequestBytes:
          type: integer
          format: int64
          minimum: 1
        maxResponseBytes:
          type: integer
          format: int64
          minimum: 1

    ConnectorHttpOutcome:
      type: string
      enum:
        - NO_RESULT
        - UNAVAILABLE
        - ERROR

    ConnectorHttpStatusOutcomeMapping:
      type: object
      required:
        - statusCodes
        - outcome
      properties:
        statusCodes:
          type: array
          items:
            type: integer
            minimum: 100
            maximum: 599
            not:
              enum:
                - 401
                - 403
          minItems: 1
          uniqueItems: true
        outcome:
          $ref: "#/components/schemas/ConnectorHttpOutcome"

    ConnectorHttpOutcomeMapping:
      type: object
      description: Mapped status codes must be unique across all mappings and disjoint from successStatusCodes. Statuses 401 and 403 are reserved authentication failures and cannot be remapped.
      properties:
        successStatusCodes:
          type: array
          items:
            type: integer
            minimum: 100
            maximum: 599
            not:
              enum:
                - 401
                - 403
          minItems: 1
          uniqueItems: true
          default:
            - 200
        statusMappings:
          type: array
          items:
            $ref: "#/components/schemas/ConnectorHttpStatusOutcomeMapping"
          default: []

    ConnectorHttpCorrelationDeclaration:
      type: object
      required:
        - headerName
      properties:
        headerName:
          type: string
          minLength: 1
          pattern: ^[A-Za-z0-9!#$%&'*+.^_`|~-]+$
          not:
            pattern: "^(?:(?:[aA][uU][tT][hH][oO][rR][iI][zZ][aA][tT][iI][oO][nN]|[cC][oO][oO][kK][iI][eE]|[sS][eE][tT]-[cC][oO][oO][kK][iI][eE]|[hH][oO][sS][tT]|[cC][oO][nN][tT][eE][nN][tT]-[lL][eE][nN][gG][tT][hH]|[cC][oO][nN][tT][eE][nN][tT]-[tT][yY][pP][eE]|[aA][cC][cC][eE][pP][tT]|[cC][oO][nN][tT][eE][nN][tT]-[eE][nN][cC][oO][dD][iI][nN][gG]|[aA][cC][cC][eE][pP][tT]-[eE][nN][cC][oO][dD][iI][nN][gG]|[cC][oO][nN][nN][eE][cC][tT][iI][oO][nN]|[tT][rR][aA][nN][sS][fF][eE][rR]-[eE][nN][cC][oO][dD][iI][nN][gG]|[tT][eE]|[tT][rR][aA][iI][lL][eE][rR]|[uU][pP][gG][rR][aA][dD][eE]|[kK][eE][eE][pP]-[aA][lL][iI][vV][eE]|[fF][oO][rR][wW][aA][rR][dD][eE][dD]|[vV][iI][aA])(?![\\s\\S])|[pP][rR][oO][xX][yY]-|[sS][eE][cC]-|[xX]-[fF][oO][rR][wW][aA][rR][dD][eE][dD]-)"
          description: HTTP token; case-insensitively rejects authorization, cookie, set-cookie, host, content-length, content-type, accept, content-encoding, accept-encoding, connection, transfer-encoding, te, trailer, upgrade, keep-alive, forwarded, via, and proxy-/sec-/x-forwarded- prefixes. Security and transport own these headers.
        reuseAcrossAttempts:
          type: boolean
          default: true

    ConnectorHttpIdempotencyDeclaration:
      type: object
      required:
        - headerName
      properties:
        headerName:
          type: string
          minLength: 1
          pattern: ^[A-Za-z0-9!#$%&'*+.^_`|~-]+$
          not:
            pattern: "^(?:(?:[aA][uU][tT][hH][oO][rR][iI][zZ][aA][tT][iI][oO][nN]|[cC][oO][oO][kK][iI][eE]|[sS][eE][tT]-[cC][oO][oO][kK][iI][eE]|[hH][oO][sS][tT]|[cC][oO][nN][tT][eE][nN][tT]-[lL][eE][nN][gG][tT][hH]|[cC][oO][nN][tT][eE][nN][tT]-[tT][yY][pP][eE]|[aA][cC][cC][eE][pP][tT]|[cC][oO][nN][tT][eE][nN][tT]-[eE][nN][cC][oO][dD][iI][nN][gG]|[aA][cC][cC][eE][pP][tT]-[eE][nN][cC][oO][dD][iI][nN][gG]|[cC][oO][nN][nN][eE][cC][tT][iI][oO][nN]|[tT][rR][aA][nN][sS][fF][eE][rR]-[eE][nN][cC][oO][dD][iI][nN][gG]|[tT][eE]|[tT][rR][aA][iI][lL][eE][rR]|[uU][pP][gG][rR][aA][dD][eE]|[kK][eE][eE][pP]-[aA][lL][iI][vV][eE]|[fF][oO][rR][wW][aA][rR][dD][eE][dD]|[vV][iI][aA])(?![\\s\\S])|[pP][rR][oO][xX][yY]-|[sS][eE][cC]-|[xX]-[fF][oO][rR][wW][aA][rR][dD][eE][dD]-)"
          description: HTTP token; case-insensitively rejects authorization, cookie, set-cookie, host, content-length, content-type, accept, content-encoding, accept-encoding, connection, transfer-encoding, te, trailer, upgrade, keep-alive, forwarded, via, and proxy-/sec-/x-forwarded- prefixes. Security and transport own these headers.
        reuseAcrossAttempts:
          type: boolean
          default: true

    ConnectorHttpRetryPolicy:
      description: "RetryPolicy restricted for typed HTTP. Only 408/425/429 may be explicit retry statuses; 5xx uses retryOnServerErrors. Success and retry statuses must be disjoint. With maxAttempts > 1: network failures, all three transient statuses, all 5xx, Retry-After and exponential backoff are mandatory; backoffMillis must be positive and <= maxBackoffMillis <= 30000. Non-GET/HEAD retries require a reused correlation header sourced from trusted CORRELATION_ID; POST/PATCH additionally require readOnly and a reused idempotency header sourced from trusted IDEMPOTENCY_KEY. Runtime validates these cross-field rules."
      allOf:
        - $ref: "#/components/schemas/RetryPolicy"
        - type: object
          properties:
            retryableStatusCodes:
              type: array
              items:
                type: integer
                enum:
                  - 408
                  - 425
                  - 429
              uniqueItems: true
              default: []
            maxBackoffMillis:
              type: integer
              format: int64
              minimum: 0
              maximum: 30000
              default: 0

    ConnectorHttpOperationConfig:
      type: object
      description: "Typed HTTP operation; HTTPS RESOURCE endpoint identity/origin comes from the owning connector, not a caller URL. Cannot coexist with legacy HTTP metadata keys (case-insensitive): uri, uriTemplate, pathTemplate, method, httpMethod, pathMappings, queryMappings, headerMappings, requestMappings, responseMappings. Security/OAuth2, trusted values, schemas, payload limits and outcomes remain command-owned. Schema validation enforces header-name exclusions and path-template lexical syntax. Server validation additionally enforces unique template variables and exact path-mapping membership, cross-array uniqueness/disjointness, trusted-header mapping relationships, and retry cross-field conditions including comparisons between backoff values; schema acceptance alone does not establish these conditions."
      required:
        - method
        - relativePathTemplate
        - responseBody
        - payloadLimits
      properties:
        method:
          $ref: "#/components/schemas/ConnectorHttpMethod"
        relativePathTemplate:
          type: string
          minLength: 1
          pattern: "^/(?!/)(?!\\.{1,2}(?:/|$))(?!.*\\/\\.{1,2}(?:/|$))(?:[^{}\\s\\x00-\\x1F?#\\\\@%]|\\{[A-Za-z][A-Za-z0-9_-]*\\})*(?![\\s\\S])"
          description: Governed relative path only; no traversal . or .. segments, encoded syntax, or malformed braces. Every {name} occurs once and exactly matches one declared path mapping; values are encoded by the runtime.
        pathMappings:
          type: array
          items:
            $ref: "#/components/schemas/ConnectorHttpPathMapping"
          default: []
          description: Unique names exactly matching the template variables.
        queryMappings:
          type: array
          items:
            $ref: "#/components/schemas/ConnectorHttpQueryMapping"
          default: []
          description: Unique names.
        headerMappings:
          type: array
          items:
            $ref: "#/components/schemas/ConnectorHttpHeaderMapping"
          default: []
          description: Names are unique ignoring case; credentials and transport headers are forbidden.
        requestBody:
          type: object
          nullable: true
          description: Optional typed JSON request mapping.
          allOf:
            - $ref: "#/components/schemas/ConnectorHttpJsonRequestMapping"
        responseBody:
          $ref: "#/components/schemas/ConnectorHttpJsonResponseMapping"
        payloadLimits:
          $ref: "#/components/schemas/ConnectorHttpPayloadLimits"
        outcomeMapping:
          $ref: "#/components/schemas/ConnectorHttpOutcomeMapping"
        readOnly:
          type: boolean
          default: false
        correlation:
          type: object
          nullable: true
          description: Optional governed correlation declaration.
          allOf:
            - $ref: "#/components/schemas/ConnectorHttpCorrelationDeclaration"
        idempotency:
          type: object
          nullable: true
          description: Optional governed idempotency declaration.
          allOf:
            - $ref: "#/components/schemas/ConnectorHttpIdempotencyDeclaration"
        retryPolicy:
          type: object
          nullable: true
          description: Optional command-owned HTTP retry policy.
          allOf:
            - $ref: "#/components/schemas/ConnectorHttpRetryPolicy"

    OperationBindingCreateRequest:
      type: object
      description: Request to bind a connector resource to a logical operation. The binding connects connector instance, attached resource, logical operation, transfer mode, protocol, operation name, optional transformation, and destination delivery policy.
      required:
        - connectorInstanceId
        - connectorResourceId
        - operationKind
      properties:
        connectorInstanceId:
          $ref: '#/components/schemas/ConnectorInstanceId'
        connectorResourceId:
          $ref: '#/components/schemas/ConnectorResourceId'
        operationKind:
          $ref: '#/components/schemas/OperationKind'
        transferMode:
          $ref: '#/components/schemas/OperationTransferMode'
        direction:
          $ref: '#/components/schemas/BindingDirection'
        accessProtocol:
          $ref: '#/components/schemas/AccessProtocol'
        operationName:
          type: string
          description: Connector-local operation name, for example OpenAPI operationId, SQL statement name, file action, or vault operation.
          example: getEmployeeProfile
        requestDescriptorId:
          $ref: '#/components/schemas/ResourceDescriptorId'
        responseDescriptorId:
          $ref: '#/components/schemas/ResourceDescriptorId'
        transformationId:
          $ref: '#/components/schemas/TransformationId'
        delivery:
          $ref: '#/components/schemas/DestinationDelivery'
        egressPolicy:
          $ref: '#/components/schemas/EgressPolicy'
        httpOperation:
          type: object
          nullable: true
          description: Optional typed HTTP operation; legacy HTTP metadata must not coexist with it. The response inherits this same httpOperation field.
          allOf:
            - $ref: "#/components/schemas/ConnectorHttpOperationConfig"
        metadata:
          $ref: '#/components/schemas/StringMap'
      example:
        connectorInstanceId: 3f6f4f46-24fb-4c35-a7a4-bc6c7f7861f5
        connectorResourceId: b4cf21b1-0292-4803-8d32-9ebf9f5359a2
        operationKind: READ
        transferMode: SINGLE
        direction: INBOUND
        accessProtocol: HTTPS
        operationName: getEmployeeProfile
        responseDescriptorId: 41436f49-040c-4f5f-9c7f-657f43762e2b
        egressPolicy:
          allowedHosts: [hr.example.com]
          allowedProtocols: [HTTPS]
          maxPayloadBytes: 1048576
          requiresTenantBoundary: true
        metadata:
          source_lookup_key: employee_id

    OperationBindingUpdateRequest:
      type: object
      description: Partial update for an operation binding. Use this to adjust operation metadata, transformation, delivery, or policy without changing unrelated fields.
      properties:
        operationKind:
          $ref: '#/components/schemas/OperationKind'
        transferMode:
          $ref: '#/components/schemas/OperationTransferMode'
        direction:
          $ref: '#/components/schemas/BindingDirection'
        accessProtocol:
          $ref: '#/components/schemas/AccessProtocol'
        operationName:
          type: string
          description: Updated connector-local operation name.
          example: getEmployeeProfile
        requestDescriptorId:
          $ref: '#/components/schemas/ResourceDescriptorId'
        responseDescriptorId:
          $ref: '#/components/schemas/ResourceDescriptorId'
        transformationId:
          $ref: '#/components/schemas/TransformationId'
        delivery:
          $ref: '#/components/schemas/DestinationDelivery'
        egressPolicy:
          $ref: '#/components/schemas/EgressPolicy'
        httpOperation:
          type: object
          nullable: true
          description: "Non-null replaces the typed operation. Omitted or explicit null preserves it. To migrate legacy HTTP metadata, supply metadata: {} explicitly; omitted/null metadata preserves existing metadata and conflicting legacy keys are rejected."
          allOf:
            - $ref: "#/components/schemas/ConnectorHttpOperationConfig"
        metadata:
          $ref: '#/components/schemas/StringMap'
      example:
        transformationId: 0e60abcc-41b5-4cc5-bec2-f0047f129341
        egressPolicy:
          allowedHosts: [hr.example.com]
          allowedProtocols: [HTTPS]
          maxPayloadBytes: 1048576

    OperationBinding:
      description: Stored operation binding. A route composes one source binding and one destination binding.
      allOf:
        - $ref: '#/components/schemas/OperationBindingCreateRequest'
        - type: object
          required:
            - bindingId
            - createdAt
            - updatedAt
          properties:
            bindingId:
              $ref: '#/components/schemas/OperationBindingId'
            createdAt:
              type: string
              format: date-time
              description: Creation timestamp.
              example: '2026-06-18T09:20:00Z'
            updatedAt:
              type: string
              format: date-time
              description: Last update timestamp.
              example: '2026-06-18T09:25:00Z'
      example:
        bindingId: 2777417e-82ce-4d3e-b96c-94e00a4d9a93
        connectorInstanceId: 3f6f4f46-24fb-4c35-a7a4-bc6c7f7861f5
        connectorResourceId: b4cf21b1-0292-4803-8d32-9ebf9f5359a2
        operationKind: READ
        transferMode: SINGLE
        direction: INBOUND
        accessProtocol: HTTPS
        operationName: getEmployeeProfile
        responseDescriptorId: 41436f49-040c-4f5f-9c7f-657f43762e2b
        createdAt: '2026-06-18T09:20:00Z'
        updatedAt: '2026-06-18T09:25:00Z'

    SemanticConnectorBindingCreateRequest:
      type: object
      description: Request to bind connector resource data to a semantic model reference. Bindings may apply to a resource, a field, or a connector-specific view of a resource.
      required:
        - resourceDescriptorId
        - bindingKind
      properties:
        connectorInstanceId:
          $ref: '#/components/schemas/ConnectorInstanceId'
        resourceDescriptorId:
          $ref: '#/components/schemas/ResourceDescriptorId'
        fieldDescriptorId:
          $ref: '#/components/schemas/FieldDescriptorId'
        bindingKind:
          type: string
          description: Binding type, for example ATTRIBUTE, ATTRIBUTE_PROFILE, PARTY_ROLE, RELATIONSHIP_TYPE, POLICY_CLASSIFICATION, or VOCABULARY_TERM.
          example: ATTRIBUTE
        semanticReference:
          $ref: '#/components/schemas/SemanticReference'
        validationMode:
          type: string
          description: Whether semantic validation is advisory, enforced, or disabled for this binding.
          enum:
            - NONE
            - WARN
            - ENFORCE
          example: ENFORCE
        metadata:
          $ref: '#/components/schemas/StringMap'
      example:
        connectorInstanceId: 3f6f4f46-24fb-4c35-a7a4-bc6c7f7861f5
        resourceDescriptorId: 41436f49-040c-4f5f-9c7f-657f43762e2b
        fieldDescriptorId: f00b9edc-5498-483f-9b91-a42ef080b909
        bindingKind: ATTRIBUTE
        semanticReference:
          referenceType: semantic-attribute
          referenceId: employee.email
          iri: https://vocab.example.com/employee#email
          version: '1.0'
        validationMode: ENFORCE

    SemanticConnectorBinding:
      description: Stored semantic binding for connector resource data.
      allOf:
        - $ref: '#/components/schemas/SemanticConnectorBindingCreateRequest'
        - type: object
          required:
            - semanticBindingId
            - createdAt
            - updatedAt
          properties:
            semanticBindingId:
              $ref: '#/components/schemas/SemanticBindingId'
            createdAt:
              type: string
              format: date-time
              description: Creation timestamp.
              example: '2026-06-18T09:30:00Z'
            updatedAt:
              type: string
              format: date-time
              description: Last update timestamp.
              example: '2026-06-18T09:30:00Z'
      example:
        semanticBindingId: 20392e94-3b35-4a77-afc2-5e552a0a4023
        connectorInstanceId: 3f6f4f46-24fb-4c35-a7a4-bc6c7f7861f5
        resourceDescriptorId: 41436f49-040c-4f5f-9c7f-657f43762e2b
        fieldDescriptorId: f00b9edc-5498-483f-9b91-a42ef080b909
        bindingKind: ATTRIBUTE
        semanticReference:
          referenceType: semantic-attribute
          referenceId: employee.email
          iri: https://vocab.example.com/employee#email
          version: '1.0'
        validationMode: ENFORCE
        createdAt: '2026-06-18T09:30:00Z'
        updatedAt: '2026-06-18T09:30:00Z'

    SemanticReference:
      type: object
      description: Reference to a data domain, object model, business term, relationship type, policy classification, or vocabulary term.
      required:
        - referenceType
        - referenceId
      properties:
        referenceType:
          type: string
          description: Semantic model reference type.
          example: semantic-attribute
        referenceId:
          type: string
          description: Stable semantic reference id.
          example: employee.email
        iri:
          type: string
          description: Optional IRI for RDF/JSON-LD and vocabulary alignment.
          example: https://vocab.example.com/employee#email
        version:
          type: string
          description: Optional semantic reference version.
          example: '1.0'
      example:
        referenceType: semantic-attribute
        referenceId: employee.email
        iri: https://vocab.example.com/employee#email
        version: '1.0'

    ConnectorInvocationBindingCreateRequest:
      type: object
      description: Request to persist a connector invocation binding.
      required:
        - binding
      properties:
        binding:
          $ref: '#/components/schemas/ConnectorInvocationBinding'
      example:
        binding:
          invocationBindingId: issuer-config-1:credential-request:hr-profile
          ownerSurface: OID4VCI
          ownerReference: issuer-config-1
          stage: OID4VCI_CREDENTIAL_REQUEST
          role: ENRICHMENT_SOURCE
          target:
            routeId: 1e8ff011-2274-4f16-a7dd-bf0b4fd5262f
          exchangeMode: PLATFORM_INITIATED_PULL
          dataDirection: INBOUND
          initiationSide: PLATFORM
          logicalContext:
            tenantId: acme
            organizationUnitId: nl-ops
            brandId: brand-a
          logicalConnectionBindingId: brand-a-hr-profile
          physicalConnectorInstanceId: 8a7f09af-7ac9-4d96-91f9-a2a252f4aa4b

    ConnectorInvocationBinding:
      type: object
      description: Persisted binding from an owning product/protocol lifecycle stage to a connector target, logical context, governance envelope, and execution policy.
      required:
        - invocationBindingId
        - ownerSurface
        - ownerReference
        - stage
        - role
        - target
        - exchangeMode
        - logicalContext
      properties:
        invocationBindingId:
          $ref: '#/components/schemas/ConnectorInvocationBindingId'
        ownerSurface:
          $ref: '#/components/schemas/ConnectorOwnerSurface'
        ownerReference:
          type: string
          description: Owner-specific reference such as issuer configuration id, verifier profile id, form id, portal flow id, or workflow id.
          example: issuer-config-1
        stage:
          $ref: '#/components/schemas/ConnectorInvocationStage'
        role:
          $ref: '#/components/schemas/ConnectorInvocationRole'
        target:
          $ref: '#/components/schemas/ConnectorInvocationTarget'
        exchangeMode:
          $ref: '#/components/schemas/ConnectorExchangeMode'
        dataDirection:
          $ref: '#/components/schemas/ConnectorDataDirection'
        initiationSide:
          $ref: '#/components/schemas/ConnectorInitiationSide'
        subsetMapping:
          $ref: '#/components/schemas/ConnectorSubsetMapping'
        logicalContext:
          $ref: '#/components/schemas/ConnectorLogicalContext'
        logicalConnectionBindingId:
          $ref: '#/components/schemas/LogicalConnectionBindingId'
        physicalConnectorInstanceId:
          $ref: '#/components/schemas/ConnectorInstanceId'
        executionPolicy:
          $ref: '#/components/schemas/ConnectorInvocationExecutionPolicy'
        governance:
          $ref: '#/components/schemas/ConnectorGovernanceEnvelope'
        vaultProfile:
          $ref: '#/components/schemas/ConnectorVaultRetentionProfile'
        partyAnchors:
          $ref: '#/components/schemas/ConnectorPartyAnchorSet'
        materializationPolicy:
          $ref: '#/components/schemas/MaterializationPolicy'
        metadata:
          $ref: '#/components/schemas/StringMap'
      example:
        invocationBindingId: issuer-config-1:credential-request:hr-profile
        ownerSurface: OID4VCI
        ownerReference: issuer-config-1
        stage: OID4VCI_CREDENTIAL_REQUEST
        role: ENRICHMENT_SOURCE
        target:
          routeId: 1e8ff011-2274-4f16-a7dd-bf0b4fd5262f
        exchangeMode: PLATFORM_INITIATED_PULL
        dataDirection: INBOUND
        initiationSide: PLATFORM
        logicalContext:
          tenantId: acme
          organizationUnitId: nl-ops
          brandId: brand-a
        logicalConnectionBindingId: brand-a-hr-profile
        physicalConnectorInstanceId: 8a7f09af-7ac9-4d96-91f9-a2a252f4aa4b

    ConnectorInvocationTarget:
      type: object
      description: Registry target selected by an invocation binding.
      properties:
        routeId:
          $ref: '#/components/schemas/ConnectorRouteId'
        connectorId:
          $ref: '#/components/schemas/ConnectorInstanceId'
        operationBindingId:
          $ref: '#/components/schemas/OperationBindingId'
      example:
        routeId: 1e8ff011-2274-4f16-a7dd-bf0b4fd5262f

    ConnectorLogicalContext:
      type: object
      description: Tenant, OU, brand, legal entity, channel, product, and discriminator context used to resolve a logical connector binding.
      required:
        - tenantId
      properties:
        tenantId:
          $ref: '#/components/schemas/TenantId'
        organizationUnitId:
          type: string
          example: nl-ops
        brandId:
          type: string
          example: brand-a
        legalEntityId:
          type: string
          example: legal-entity-a
        channel:
          type: string
          example: web
        productId:
          type: string
          example: employee-license
        discriminators:
          $ref: '#/components/schemas/StringMap'
      example:
        tenantId: acme
        organizationUnitId: nl-ops
        brandId: brand-a
        discriminators:
          jurisdiction: NL

    ConnectorSubsetMapping:
      type: object
      description: Field selection, lookup, output mapping, provenance, and minimization rules used by an invocation or exposure.
      properties:
        inputFields:
          type: array
          items:
            $ref: '#/components/schemas/ConnectorFieldSelector'
        selectedFields:
          type: array
          items:
            $ref: '#/components/schemas/ConnectorFieldSelector'
        producedFields:
          type: array
          description: Fields an invocation is expected to produce for later connector or protocol stages.
          items:
            $ref: '#/components/schemas/ConnectorFieldSelector'
        outputMappings:
          type: array
          items:
            $ref: '#/components/schemas/ConnectorFieldMapping'
        sourceProvenanceFields:
          type: array
          items:
            $ref: '#/components/schemas/ConnectorFieldSelector'
        qualityStatusFields:
          type: array
          items:
            $ref: '#/components/schemas/ConnectorFieldSelector'
        redactionProfileId:
          type: string
          example: redact-proof-source
        minimizationProfileId:
          type: string
          example: min-proof-source
      example:
        inputFields:
          - protocolClaimPath: credential_subject.id
        selectedFields:
          - canonicalFieldPath: proof.status
        minimizationProfileId: min-proof-source

    ConnectorFieldSelector:
      type: object
      description: Selector for a canonical, protocol, form, proof, status, source, data product, or semantic field.
      properties:
        canonicalFieldPath:
          type: string
          example: proof.status
        connectorField:
          type: string
          example: employee_id
        protocolClaimPath:
          type: string
          example: credential_subject.email
        dcqlCredentialQueryId:
          type: string
          example: employeeCredential
        dcqlClaimId:
          type: string
          example: email
        formFieldPath:
          type: string
          example: applicant.email
        proofRef:
          type: string
          example: proof://presentation/1
        statusRef:
          type: string
          example: status://credential/1
        tokenRef:
          type: string
          example: token://access/1
        sourceFieldPath:
          type: string
          example: worker.email
        dataProductFieldScope:
          type: string
          example: dpp.asset.serial
        contractAgreementTargetRef:
          type: string
          example: contract-target-1
        semanticReference:
          $ref: '#/components/schemas/SemanticReference'
        required:
          type: boolean
          default: true
          example: true

    ConnectorFieldMapping:
      type: object
      description: Mapping from a source selector to a target selector.
      required:
        - source
        - target
      properties:
        source:
          $ref: '#/components/schemas/ConnectorFieldSelector'
        target:
          $ref: '#/components/schemas/ConnectorFieldSelector'
        required:
          type: boolean
          default: true
          example: true

    ConnectorInvocationExecutionPolicy:
      type: object
      description: Timing, retry, idempotency, and correlation policy for an invocation binding.
      properties:
        timing:
          $ref: '#/components/schemas/ConnectorExecutionTiming'
        failureEffect:
          $ref: '#/components/schemas/ConnectorFailureEffect'
        timeoutMillis:
          type: integer
          format: int64
          minimum: 0
          example: 30000
        syncWaitWindowMillis:
          type: integer
          format: int64
          minimum: 0
          example: 5000
        retryPolicy:
          $ref: '#/components/schemas/RetryPolicy'
        idempotencyKey:
          type: string
          example: issuer-config-1:offer-123
        correlationId:
          type: string
          example: protocol-correlation-1
      example:
        timing: INLINE_REQUIRED
        failureEffect: FAIL_PROTOCOL
        timeoutMillis: 30000

    LogicalConnectionBindingCreateRequest:
      type: object
      description: Request to persist a logical connection binding.
      required:
        - binding
      properties:
        binding:
          $ref: '#/components/schemas/LogicalConnectionBinding'
      example:
        binding:
          logicalConnectionBindingId: brand-a-proof-vault
          physicalConnectorInstanceId: 8a7f09af-7ac9-4d96-91f9-a2a252f4aa4b
          logicalContext:
            tenantId: acme
            organizationUnitId: nl-ops
            brandId: brand-a

    LogicalConnectionBinding:
      type: object
      description: Logical usage binding for a physical connector instance, including caller context, discriminator rules, auth overlay, grants, governance defaults, and system catalog projection metadata.
      required:
        - logicalConnectionBindingId
        - physicalConnectorInstanceId
        - logicalContext
      properties:
        logicalConnectionBindingId:
          $ref: '#/components/schemas/LogicalConnectionBindingId'
        physicalConnectorInstanceId:
          $ref: '#/components/schemas/ConnectorInstanceId'
        logicalContext:
          $ref: '#/components/schemas/ConnectorLogicalContext'
        callerParty:
          $ref: '#/components/schemas/PartyRef'
        beneficiaryParty:
          $ref: '#/components/schemas/PartyRef'
        discriminatorRules:
          type: array
          items:
            $ref: '#/components/schemas/ConnectorDiscriminatorRule'
        authOverlay:
          $ref: '#/components/schemas/ConnectorAuthOverlay'
        grants:
          type: array
          items:
            $ref: '#/components/schemas/LogicalConnectionGrant'
        allowedOperations:
          type: array
          items:
            $ref: '#/components/schemas/OperationKind'
        defaultSubsetMapping:
          $ref: '#/components/schemas/ConnectorSubsetMapping'
        defaultGovernance:
          $ref: '#/components/schemas/ConnectorGovernanceEnvelope'
        defaultMaterializationPolicy:
          $ref: '#/components/schemas/MaterializationPolicy'
        systemCatalog:
          $ref: '#/components/schemas/SystemCatalogProjectionMetadata'
      example:
        logicalConnectionBindingId: brand-a-proof-vault
        physicalConnectorInstanceId: 8a7f09af-7ac9-4d96-91f9-a2a252f4aa4b
        logicalContext:
          tenantId: acme
          organizationUnitId: nl-ops
          brandId: brand-a
        authOverlay:
          mode: TENANT_SECRET_ID
          secretId: sec_01JYYYYYYYYYYYYYYYYYYYYYYY
        allowedOperations: [READ, WRITE]

    ConnectorDiscriminatorRule:
      type: object
      description: Rule for deriving and placing a discriminator value when resolving or invoking a logical connector binding.
      required:
        - source
        - sourceKey
        - targetKey
        - placement
      properties:
        source:
          $ref: '#/components/schemas/ConnectorDiscriminatorSource'
        sourceKey:
          type: string
          example: brandId
        targetKey:
          type: string
          example: X-Brand-Id
        placement:
          $ref: '#/components/schemas/ConnectorDiscriminatorPlacement'
        required:
          type: boolean
          default: true
          example: true
        staticValue:
          type: string
          example: brand-a

    ConnectorAuthOverlay:
      type: object
      description: Logical authentication overlay applied on top of the physical connector configuration.
      properties:
        mode:
          $ref: '#/components/schemas/ConnectorAuthOverlayMode'
        secretId:
          type: string
          pattern: '^sec_[A-Za-z0-9_-]{16,128}$'
          description: Opaque server-issued identifier; valid only with TENANT_SECRET_ID.
          example: sec_01JYYYYYYYYYYYYYYYYYYYYYYY
        oauthClientRef:
          type: string
          example: oauth-client://issuer-proof-vault
        mtlsIdentityRef:
          type: string
          example: mtls://identity/issuer-proof-vault
        credentialSelector:
          type: string
          example: tenant-default
      example:
        mode: TENANT_SECRET_ID
        secretId: sec_01JYYYYYYYYYYYYYYYYYYYYYYY

    LogicalConnectionGrant:
      type: object
      description: Grant that allows another tenant or caller context to use a logical connection binding.
      required:
        - grantId
        - grantedToTenantId
      properties:
        grantId:
          type: string
          example: grant-proof-vault-to-supplier
        grantedToTenantId:
          $ref: '#/components/schemas/TenantId'
        grantedBy:
          $ref: '#/components/schemas/PartyRef'
        allowedOperations:
          type: array
          items:
            $ref: '#/components/schemas/OperationKind'
        active:
          type: boolean
          default: true
          example: true

    SystemCatalogProjectionMetadata:
      type: object
      description: Party and deployment metadata projected from a logical connection binding into system catalog or governance views.
      properties:
        operatorParty:
          $ref: '#/components/schemas/PartyRef'
        vendorSupplierParty:
          $ref: '#/components/schemas/PartyRef'
        deploymentRegion:
          type: string
          example: eu-west-1
        managementMode:
          $ref: '#/components/schemas/ConnectorManagementMode'
        executionTier:
          $ref: '#/components/schemas/ConnectorExecutionTier'
        deploymentMode:
          $ref: '#/components/schemas/ConnectorDeploymentMode'
        dataCategoriesTouched:
          type: array
          items:
            type: string
          example: [proof-status]
        downstreamRecipients:
          type: array
          items:
            $ref: '#/components/schemas/PartyRef'
        processorRefs:
          type: array
          items:
            $ref: '#/components/schemas/PartyRef'

    RouteExposureDescriptorCreateRequest:
      type: object
      description: Request to persist a route exposure descriptor.
      required:
        - exposure
      properties:
        exposure:
          $ref: '#/components/schemas/RouteExposureDescriptor'
      example:
        exposure:
          exposureDescriptorId: proof-vault-read-exposure
          exposedCapabilityId: proof-vault-read
          owningTenantId: acme
          logicalConnectionBindingId: brand-a-proof-vault
          exchangeMode: EXTERNALLY_INITIATED_READ
          allowedOperation: READ
          acceptedAuthMethods: [bearer, mtls]

    RouteExposureGrantStatus:
      type: string
      enum: [ACTIVE, SUSPENDED, REVOKED, EXPIRED]
    RouteExposureThrottlePolicy:
      type: object
      required: [maxRequests, windowSeconds]
      properties:
        maxRequests:
          type: integer
          format: int64
          minimum: 1
        windowSeconds:
          type: integer
          format: int64
          minimum: 1
        throttleKey:
          type: string
    RouteExposureGrantCreateRequest:
      type: object
      required: [callerParty]
      additionalProperties: false
      properties:
        callerParty:
          $ref: '#/components/schemas/PartyRef'
        grantedBy:
          $ref: '#/components/schemas/PartyRef'
        allowedAuthMethods:
          type: array
          items: { type: string }
        allowedOperations:
          type: array
          items:
            $ref: '#/components/schemas/OperationKind'
        status:
          $ref: '#/components/schemas/RouteExposureGrantStatus'
          default: ACTIVE
        validFrom:
          type: string
          format: date-time
        validUntil:
          type: string
          format: date-time
        maxUses:
          type: integer
          format: int64
          minimum: 1
        throttlePolicy:
          $ref: '#/components/schemas/RouteExposureThrottlePolicy'
        metadata:
          type: object
          additionalProperties: { type: string }
    RouteExposureGrant:
      type: object
      required: [grantId, exposureDescriptorId, owningTenantId, callerParty, status, useCount]
      properties:
        grantId: { $ref: '#/components/schemas/RouteExposureGrantId' }
        exposureDescriptorId: { $ref: '#/components/schemas/RouteExposureDescriptorId' }
        owningTenantId: { $ref: '#/components/schemas/TenantId' }
        callerParty: { $ref: '#/components/schemas/PartyRef' }
        grantedBy: { $ref: '#/components/schemas/PartyRef' }
        allowedAuthMethods: { type: array, items: { type: string } }
        allowedOperations: { type: array, items: { $ref: '#/components/schemas/OperationKind' } }
        status: { $ref: '#/components/schemas/RouteExposureGrantStatus' }
        validFrom: { type: string, format: date-time }
        validUntil: { type: string, format: date-time }
        maxUses: { type: integer, format: int64 }
        useCount: { type: integer, format: int64, minimum: 0 }
        throttlePolicy: { $ref: '#/components/schemas/RouteExposureThrottlePolicy' }
        metadata: { type: object, additionalProperties: { type: string } }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    RouteExposureGrantPage:
      type: object
      description: Page of route exposure grants.
      required: [data, pagination]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/RouteExposureGrant' }
        pagination:
          $ref: '#/components/schemas/Page'

    RouteExposureDescriptor:
      type: object
      description: Externally callable connector route capability and its caller, schema, subset, payload, rate, and audit constraints.
      required:
        - exposureDescriptorId
        - exposedCapabilityId
        - owningTenantId
        - logicalConnectionBindingId
        - exchangeMode
        - allowedOperation
        - acceptedAuthMethods
      properties:
        exposureDescriptorId:
          $ref: '#/components/schemas/RouteExposureDescriptorId'
        exposedCapabilityId:
          type: string
          example: proof-vault-read
        owningTenantId:
          $ref: '#/components/schemas/TenantId'
        organizationUnitId:
          type: string
          example: nl-ops
        brandId:
          type: string
          example: brand-a
        logicalConnectionBindingId:
          $ref: '#/components/schemas/LogicalConnectionBindingId'
        exchangeMode:
          $ref: '#/components/schemas/ConnectorExchangeMode'
        allowedOperation:
          $ref: '#/components/schemas/OperationKind'
        acceptedAuthMethods:
          type: array
          items:
            type: string
          example: [bearer, mtls]
        callerPartyConstraints:
          type: array
          items:
            $ref: '#/components/schemas/PartyRef'
        callerRelationshipConstraints:
          type: array
          items:
            $ref: '#/components/schemas/RelationshipRef'
        requestSchemaRef:
          type: string
          example: schema://proof-vault/read-request
        responseSchemaRef:
          type: string
          example: schema://proof-vault/read-response
        subsetMapping:
          $ref: '#/components/schemas/ConnectorSubsetMapping'
        cursorStrategy:
          type: string
          example: opaque-page-token
        idempotencyKeyStrategy:
          type: string
          example: header:X-Idempotency-Key
        payloadLimitBytes:
          type: integer
          format: int64
          minimum: 0
          example: 1048576
        rateLimitKey:
          type: string
          example: tenant:caller
        auditCategory:
          $ref: '#/components/schemas/ConnectorAuditCategory'
      example:
        exposureDescriptorId: proof-vault-read-exposure
        exposedCapabilityId: proof-vault-read
        owningTenantId: acme
        organizationUnitId: nl-ops
        brandId: brand-a
        logicalConnectionBindingId: brand-a-proof-vault
        exchangeMode: EXTERNALLY_INITIATED_READ
        allowedOperation: READ
        acceptedAuthMethods: [bearer, mtls]
        payloadLimitBytes: 1048576
        auditCategory: EXTERNAL_EXCHANGE

    RouteExposureExternalReadRequest:
      type: object
      description: Governed request envelope for an externally initiated read through a route exposure descriptor.
      required:
        - authMethod
        - callerParty
        - canonicalFields
      properties:
        authMethod:
          type: string
          description: Auth or trust method accepted by the exposure descriptor.
          example: bearer
        callerParty:
          $ref: '#/components/schemas/PartyRef'
        canonicalFields:
          type: object
          description: Canonical field values eligible for projection through the governed exposure.
          additionalProperties: true
          example:
            proof.status: valid
        governance:
          $ref: '#/components/schemas/ConnectorGovernanceEnvelope'
        cursor:
          $ref: '#/components/schemas/ConnectorCursor'
      example:
        authMethod: bearer
        callerParty:
          partyId: party-consumer
        canonicalFields:
          proof.status: valid
        governance:
          classification: confidential
          legalBasis: dpv:Contract
          purpose: dpv:Audit
          auditCategory: EXTERNAL_EXCHANGE
        cursor:
          value: page-1

    RouteExposureExternalWriteRequest:
      type: object
      description: Governed request envelope for an externally initiated write through a route exposure descriptor.
      required:
        - authMethod
        - callerParty
        - payload
        - fieldMappings
      properties:
        authMethod:
          type: string
          description: Auth or trust method accepted by the exposure descriptor.
          example: bearer
        callerParty:
          $ref: '#/components/schemas/PartyRef'
        payload:
          type: object
          description: External payload values supplied by the caller.
          additionalProperties: true
          example:
            supplierStatus: valid
        fieldMappings:
          type: array
          items:
            $ref: '#/components/schemas/ConnectorFieldMapping'
        governance:
          $ref: '#/components/schemas/ConnectorGovernanceEnvelope'
        idempotencyKey:
          type: string
          example: supplier-status-1
        partyProjectionCandidates:
          type: array
          items:
            $ref: '#/components/schemas/PartyProjectionCandidate'
      example:
        authMethod: bearer
        callerParty:
          partyId: party-supplier
        payload:
          supplierStatus: valid
        fieldMappings:
          - source:
              sourceFieldPath: supplierStatus
            target:
              canonicalFieldPath: evidence.status
        governance:
          classification: confidential
          legalBasis: dpv:Contract
          purpose: dpv:Audit
          auditCategory: EXTERNAL_EXCHANGE
        idempotencyKey: supplier-status-1

    ConnectorExternalReadResponse:
      type: object
      description: Approved governed view returned by an externally initiated read exposure.
      required:
        - state
        - exposureDescriptorId
        - logicalConnectionBindingId
        - policyDecisionId
        - selectedFieldPaths
        - manifest
      properties:
        state:
          type: string
          example: APPROVED_VIEW
        runId:
          $ref: '#/components/schemas/ConnectorRunId'
        exposureDescriptorId:
          $ref: '#/components/schemas/RouteExposureDescriptorId'
        logicalConnectionBindingId:
          $ref: '#/components/schemas/LogicalConnectionBindingId'
        policyDecisionId:
          type: string
          example: policy-external-read
        selectedFieldPaths:
          type: array
          items:
            type: string
          example: [proof.status]
        manifest:
          $ref: '#/components/schemas/ConnectorExportManifest'
        cursor:
          $ref: '#/components/schemas/ConnectorCursor'
        sourceSurface:
          type: string
          example: route-exposure

    ConnectorExternalWriteReceipt:
      type: object
      description: Governed-ingress receipt returned by an externally initiated write exposure.
      required:
        - state
        - exposureDescriptorId
        - logicalConnectionBindingId
        - canonicalFields
        - projectionCandidateIds
        - policyDecisionId
        - idempotencyResult
        - payloadHash
        - laterUseAvailabilityScope
      properties:
        state:
          $ref: '#/components/schemas/ConnectorGovernedIngressStatus'
        runId:
          $ref: '#/components/schemas/ConnectorRunId'
        exposureDescriptorId:
          $ref: '#/components/schemas/RouteExposureDescriptorId'
        logicalConnectionBindingId:
          $ref: '#/components/schemas/LogicalConnectionBindingId'
        canonicalFields:
          type: object
          description: Canonical fields produced after mapping the external payload.
          additionalProperties: true
          example:
            evidence.status: valid
        projectionCandidateIds:
          type: array
          items:
            type: string
          example: [supplier-party-1]
        policyDecisionId:
          type: string
          example: policy-external-write
        idempotencyResult:
          type: string
          example: accepted:supplier-status-1
        payloadHash:
          type: string
          pattern: '^sha256:[0-9a-f]{64}$'
          example: sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
        laterUseAvailabilityScope:
          type: array
          items:
            $ref: '#/components/schemas/ConnectorOwnerSurface'
          example: [FORM, OID4VCI, OID4VP, WORKFLOW]

    ConnectorPolicyDecision:
      type: object
      description: Trusted server-produced policy decision consumed by governed connector processing and returned as lineage. It is never accepted as request authority.
      required:
        - decisionId
        - outcome
      properties:
        decisionId:
          type: string
          example: policy-external-read
        outcome:
          $ref: '#/components/schemas/ConnectorPolicyOutcome'
        reason:
          type: string
          example: Purpose, agreement, and caller constraints permit the external exchange.
        metadata:
          $ref: '#/components/schemas/StringMap'

    ConnectorPolicyEnforcementPoint:
      type: string
      description: Closed Phase 5 policy enforcement vocabulary for governed connector operations.
      enum:
        - GOVERNED_INGRESS
        - EGRESS_EXPORT
        - ROUTE_EXPOSURE_READ
        - ROUTE_EXPOSURE_WRITE
        - CONTROL_OPERATION
      example: EGRESS_EXPORT

    ConnectorPolicyEvaluationContext:
      type: object
      description: Neutral, value-free connector policy context built from trusted operation coordinates. Raw payloads, credentials, presentations, tokens, and secrets are excluded.
      required:
        - enforcementPoint
        - resourceType
        - resourceId
        - fieldPaths
        - fieldPathDigests
      properties:
        enforcementPoint:
          $ref: '#/components/schemas/ConnectorPolicyEnforcementPoint'
        resourceType:
          type: string
          example: connector.route-exposure
        resourceId:
          type: string
          example: proof-vault-read-exposure
        governance:
          $ref: '#/components/schemas/ConnectorGovernanceEnvelope'
        partyAnchors:
          $ref: '#/components/schemas/ConnectorPartyAnchorSet'
        callerParty:
          $ref: '#/components/schemas/PartyRef'
        logicalConnectionBindingId:
          $ref: '#/components/schemas/LogicalConnectionBindingId'
        physicalConnectorInstanceId:
          $ref: '#/components/schemas/ConnectorId'
        exposureDescriptorId:
          $ref: '#/components/schemas/RouteExposureDescriptorId'
        ownerSurface:
          $ref: '#/components/schemas/ConnectorOwnerSurface'
        stage:
          $ref: '#/components/schemas/ConnectorInvocationStage'
        fieldPaths:
          type: array
          description: Canonical field paths resolved from server-stored, authoring-validated connector authority.
          default: []
          items:
            type: string
          example: [proof.status]
        fieldPathDigests:
          type: array
          description: Domain-separated, type-tagged SHA-256 digests of runtime-controlled field coordinates that must not be disclosed to policy as canonical paths.
          default: []
          items:
            type: string
            pattern: '^field-path-sha256:[0-9a-f]{64}$'
        classifications:
          type: array
          items:
            type: string
          example: [confidential]
        integrityHashes:
          $ref: '#/components/schemas/StringMap'
        operationFacts:
          $ref: '#/components/schemas/StringMap'

    ConnectorGovernedIngressRequest:
      type: object
      description: Governed ingress operation input. The trusted policy decision is supplied only by the server-side execution seam.
      required:
        - record
        - fieldMappings
      properties:
        record:
          $ref: '#/components/schemas/ConnectorRecord'
        fieldMappings:
          type: array
          items:
            $ref: '#/components/schemas/ConnectorFieldMapping'
        governance:
          $ref: '#/components/schemas/ConnectorGovernanceEnvelope'
        requireGovernance:
          type: boolean
          default: true

    ConnectorEgressPreparationRequest:
      type: object
      description: Governed egress preparation input. The trusted policy decision is supplied only by the server-side execution seam.
      required:
        - canonicalFields
        - selectedFieldPaths
        - destinationIdentity
        - mappingVersion
      properties:
        canonicalFields:
          type: object
          additionalProperties: true
        selectedFieldPaths:
          type: array
          items:
            type: string
        governance:
          $ref: '#/components/schemas/ConnectorGovernanceEnvelope'
        destinationIdentity:
          type: string
        mappingVersion:
          type: string
        mappingProvenance:
          type: string
        redactedFieldPaths:
          type: array
          items:
            type: string
        minimizedFieldPaths:
          type: array
          items:
            type: string

    ConnectorControlOperationRequest:
      type: object
      description: Control authorization input. A policy result is never accepted from the caller and authorization does not execute a control runtime.
      required:
        - targetExternalEntityRef
        - requestedAction
      properties:
        targetExternalEntityRef:
          type: string
        requestedAction:
          type: string
        actor:
          $ref: '#/components/schemas/PartyRef'
        reason:
          type: string
        dryRun:
          type: boolean
          default: true

    ConnectorPolicyOutcome:
      type: string
      description: Outcome returned by the governing policy layer for a connector exchange.
      enum:
        - PERMIT
        - DENY
        - MINIMIZE
        - REDACT
        - QUARANTINE
        - REQUIRE_SECOND_SOURCE
        - REQUIRE_HUMAN_REVIEW
        - REQUIRE_WALLET_PROOF
        - REQUIRE_STEP_UP
      example: PERMIT

    ConnectorGovernedIngressStatus:
      type: string
      description: Result state for governed external write ingress.
      enum:
        - ACCEPTED
        - MINIMIZED
        - REDACTED
        - QUARANTINED
        - REJECTED
      example: ACCEPTED

    ConnectorCursor:
      type: object
      description: Opaque cursor or watermark returned by connector runtimes and external exposure reads.
      required:
        - value
      properties:
        value:
          type: string
          example: page-1
        metadata:
          $ref: '#/components/schemas/StringMap'

    ConnectorExportedField:
      type: object
      description: A field included in an external-read manifest, with minimization and integrity metadata.
      required:
        - fieldPath
        - integrityHash
      properties:
        fieldPath:
          type: string
          example: proof.status
        value:
          type: object
          additionalProperties: true
          nullable: true
        redacted:
          type: boolean
          default: false
          example: false
        minimized:
          type: boolean
          default: false
          example: false
        integrityHash:
          type: string
          pattern: '^sha256:[0-9a-f]{64}$'
          example: sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb

    ConnectorExportManifest:
      type: object
      description: Governed egress manifest for an external-read response.
      required:
        - manifestId
        - destinationIdentity
        - selectedFields
        - mappingVersion
        - policyDecisionId
        - retentionProfileId
        - manifestHash
      properties:
        manifestId:
          type: string
          example: manifest-external-read
        destinationIdentity:
          type: string
          example: party-consumer
        selectedFields:
          type: array
          items:
            $ref: '#/components/schemas/ConnectorExportedField'
        mappingVersion:
          type: string
          example: external-read:proof-vault-read
        mappingProvenance:
          type: string
          example: route-exposure-subset
        policyDecisionId:
          type: string
          example: policy-external-read
        retentionProfileId:
          type: string
          example: retention-proof
        agreementRef:
          type: object
          additionalProperties: true
        participantIdentity:
          type: object
          additionalProperties: true
        transferProcess:
          type: object
          additionalProperties: true
        obligations:
          type: array
          items:
            type: object
            additionalProperties: true
        manifestHash:
          type: string
          pattern: '^sha256:[0-9a-f]{64}$'
          example: sha256:cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc

    PartyProjectionCandidate:
      type: object
      description: Candidate Party projection emitted by discovery, governed ingress, or external-write execution.
      required:
        - candidateId
        - entityKind
      properties:
        candidateId:
          type: string
          example: supplier-party-1
        entityKind:
          type: string
          example: asset
        party:
          $ref: '#/components/schemas/PartyRef'
        relationships:
          type: array
          items:
            $ref: '#/components/schemas/RelationshipCandidate'
        materializationIntent:
          $ref: '#/components/schemas/ConnectorEntityMaterializationIntent'
        semanticClassifications:
          type: array
          items:
            type: object
            additionalProperties: true
        canonicalFields:
          type: object
          additionalProperties: true

    RelationshipCandidate:
      type: object
      description: Directional Party relationship candidate that remains non-authoritative until the VDX projection command accepts it.
      required:
        - relationshipType
        - fromParty
        - toParty
      properties:
        relationshipType:
          type: string
          minLength: 1
          maxLength: 191
          example: OWNERSHIP
        fromParty:
          $ref: '#/components/schemas/PartyRef'
        toParty:
          $ref: '#/components/schemas/PartyRef'
        confidence:
          type: string
          example: authoritative-source
        sourceRef:
          type: string
          example: discovery:asset-registry:42

    ConnectorSourceStalenessState:
      type: string
      description: Current state of the source observation. Stale and missing candidates never delete or mutate governed Party data.
      enum:
        - ACTIVE
        - STALE
        - MISSING
      example: ACTIVE

    ConnectorPartyProjectionSource:
      type: string
      description: Connector path that produced the Party projection candidate.
      enum:
        - DISCOVERY
        - GOVERNED_INGRESS
        - EXTERNAL_WRITE
      example: DISCOVERY

    ConnectorPartyMaterializationDecision:
      type: string
      description: Explicit operator or reconciliation decision authorizing Party materialization.
      enum:
        - ACCEPT
        - RECONCILE
      example: ACCEPT

    ConnectorPartyProjectionEntry:
      type: object
      description: One explicitly decided Party projection candidate and its current source state.
      required:
        - source
        - decision
        - candidate
        - stalenessState
      properties:
        source:
          $ref: '#/components/schemas/ConnectorPartyProjectionSource'
        decision:
          $ref: '#/components/schemas/ConnectorPartyMaterializationDecision'
        candidate:
          $ref: '#/components/schemas/PartyProjectionCandidate'
        stalenessState:
          $ref: '#/components/schemas/ConnectorSourceStalenessState'

    ConnectorPartyProjectionRequest:
      type: object
      description: Tenant-scoped VDX Party projection command input. Tenant identity is supplied only by the command session.
      required:
        - entries
      properties:
        entries:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ConnectorPartyProjectionEntry'
        relationshipCandidates:
          type: array
          items:
            $ref: '#/components/schemas/RelationshipCandidate'

    ConnectorPartyProjectionCandidateStatus:
      type: string
      enum:
        - CREATED
        - REAPPLIED
        - RECONCILED
        - SKIPPED_STALE
      example: CREATED

    ConnectorPartyProjectionCandidateResult:
      type: object
      description: Resolution outcome for one candidate entry.
      required:
        - candidateId
        - status
      properties:
        candidateId:
          type: string
          example: asset-candidate-42
        partyId:
          type: string
          format: uuid
          example: 346b93a1-8042-46dc-ac1b-8d1261190fe0
        canonicalExternalIdentity:
          type: string
          example: urn:factory:asset:42
        status:
          $ref: '#/components/schemas/ConnectorPartyProjectionCandidateStatus'

    ConnectorPartyProjectionRelationshipStatus:
      type: string
      enum:
        - CREATED
        - REAPPLIED
      example: CREATED

    ConnectorPartyProjectionRelationshipResult:
      type: object
      description: Authoritative ordered Party relationship resolution outcome.
      required:
        - relationshipId
        - relationshipType
        - fromPartyId
        - toPartyId
        - status
      properties:
        relationshipId:
          type: string
          format: uuid
          example: 501bd0e2-218f-4665-8c75-5c48c17228e4
        relationshipType:
          type: string
          example: OWNERSHIP
        fromPartyId:
          type: string
          format: uuid
          example: 346b93a1-8042-46dc-ac1b-8d1261190fe0
        toPartyId:
          type: string
          format: uuid
          example: 1c3d351c-0fac-4d4a-8df0-e08360ed524b
        status:
          $ref: '#/components/schemas/ConnectorPartyProjectionRelationshipStatus'

    ConnectorPartyProjectionResult:
      type: object
      description: Aggregate result of one atomic Party and relationship projection command.
      required:
        - candidateResults
        - relationshipResults
      properties:
        candidateResults:
          type: array
          items:
            $ref: '#/components/schemas/ConnectorPartyProjectionCandidateResult'
        relationshipResults:
          type: array
          items:
            $ref: '#/components/schemas/ConnectorPartyProjectionRelationshipResult'

    ConnectorEntityMaterializationIntent:
      type: string
      description: How a governed external write or discovery record may materialize into durable Party, relationship, semantic, event, or DPP records.
      enum:
        - REFERENCE_ONLY
        - EXISTING_PARTY
        - NEW_PARTY_CANDIDATE
        - RELATIONSHIP_CANDIDATE
        - SEMANTIC_VALUE
        - EVENT
        - DPP_RECORD
      example: NEW_PARTY_CANDIDATE

    ConnectorDataProductDescriptorCreateRequest:
      type: object
      description: Request to persist a connector data product descriptor.
      required:
        - descriptor
      properties:
        descriptor:
          $ref: '#/components/schemas/ConnectorDataProductDescriptor'
      example:
        descriptor:
          dataProductId: dp-proof-status
          providerParty:
            partyId: party-provider
            displayName: Proof provider
          physicalConnectorInstanceId: 8a7f09af-7ac9-4d96-91f9-a2a252f4aa4b
          logicalConnectionBindingId: brand-a-proof-vault
          datasetResourceIds: [41436f49-040c-4f5f-9c7f-657f43762e2b]
          title: Proof status product
          canonicalFieldScopes: [proof.status]
          distributionTransferTypes: [HTTPS_PULL]
          catalogOfferRefs:
            - offerId: offer-proof-status
              policy:
                profileId: dpv-odrl
                policyType: OFFER
                policyUid: policy-proof-status

    ConnectorDataProductDescriptor:
      type: object
      description: Dataspace/data-use-contract-ready descriptor for a product exposed from a connector route or logical binding. It carries provider/consumer Party refs, dataset resource refs, field scopes, governance scope, transfer type, and catalog offer/policy refs without implementing DSP/DCAT wire behavior.
      required:
        - dataProductId
        - providerParty
        - physicalConnectorInstanceId
        - logicalConnectionBindingId
        - datasetResourceIds
        - title
        - distributionTransferTypes
        - catalogOfferRefs
      properties:
        dataProductId:
          $ref: '#/components/schemas/ConnectorDataProductId'
        providerParty:
          $ref: '#/components/schemas/PartyRef'
        consumerParty:
          $ref: '#/components/schemas/PartyRef'
        physicalConnectorInstanceId:
          $ref: '#/components/schemas/ConnectorInstanceId'
        logicalConnectionBindingId:
          $ref: '#/components/schemas/LogicalConnectionBindingId'
        datasetResourceIds:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ResourceDescriptorId'
        title:
          type: string
          minLength: 1
          example: Proof status product
        description:
          type: string
          example: Governed proof status view exposed from the proof-vault route.
        version:
          type: string
          example: '1.0'
        canonicalFieldScopes:
          type: array
          items:
            type: string
          example: [proof.status]
        schemaRefs:
          type: array
          items:
            type: string
          example: [schema://proof-status]
        freshness:
          type: string
          example: PT5M
        quality:
          type: string
          example: verified
        distributionTransferTypes:
          type: array
          minItems: 1
          items:
            type: string
          example: [HTTPS_PULL]
        residency:
          type: string
          example: EU
        classification:
          type: string
          example: confidential
        governanceScope:
          type: string
          example: proof-status
        catalogOfferRefs:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ConnectorCatalogOfferRef'
        partyAnchors:
          $ref: '#/components/schemas/ConnectorPartyAnchorSet'
      example:
        dataProductId: dp-proof-status
        providerParty:
          partyId: party-provider
          displayName: Proof provider
        physicalConnectorInstanceId: 8a7f09af-7ac9-4d96-91f9-a2a252f4aa4b
        logicalConnectionBindingId: brand-a-proof-vault
        datasetResourceIds: [41436f49-040c-4f5f-9c7f-657f43762e2b]
        title: Proof status product
        canonicalFieldScopes: [proof.status]
        distributionTransferTypes: [HTTPS_PULL]
        governanceScope: proof-status
        catalogOfferRefs:
          - offerId: offer-proof-status
            policy:
              profileId: dpv-odrl
              policyType: OFFER
              policyUid: policy-proof-status

    ConnectorCatalogOfferRef:
      type: object
      description: Reference to a catalog offer and the ODRL policy attached to it.
      required:
        - offerId
        - policy
      properties:
        offerId:
          $ref: '#/components/schemas/ConnectorCatalogOfferId'
        policy:
          $ref: '#/components/schemas/ConnectorOdrlPolicyRef'
        projectionHint:
          type: string
          example: public-catalog

    ConnectorCatalogOfferId:
      type: string
      description: Stable catalog offer identifier associated with a connector data product.
      example: offer-proof-status

    ConnectorOdrlPolicyType:
      type: string
      description: ODRL policy reference type.
      enum:
        - SET
        - OFFER
        - AGREEMENT
      example: OFFER

    ConnectorOdrlPolicyRef:
      type: object
      description: ODRL policy reference associated with a data product catalog offer.
      required:
        - profileId
        - policyType
        - policyUid
      properties:
        profileId:
          type: string
          example: dpv-odrl
        policyType:
          $ref: '#/components/schemas/ConnectorOdrlPolicyType'
        policyUid:
          type: string
          example: policy-proof-status
        targetRefs:
          type: array
          items:
            type: string
          example: [proof.status]
        assigner:
          $ref: '#/components/schemas/PartyRef'
        assignee:
          $ref: '#/components/schemas/PartyRef'
        permissionRefs:
          type: array
          items:
            type: string
        prohibitionRefs:
          type: array
          items:
            type: string
        dutyRefs:
          type: array
          items:
            type: string

    TransformationCreateRequest:
      type: object
      description: Request to define a reusable transformation from one resource descriptor to another. Attribute mapper steps can coexist with expression-based transformations.
      required:
        - displayName
        - language
      properties:
        displayName:
          type: string
          description: Human-readable transformation name.
          example: Employee profile to license invitation
        description:
          type: string
          description: Transformation purpose and scope.
          example: Maps HR employee attributes into the invitation payload used by the license issuance flow.
        language:
          $ref: '#/components/schemas/TransformationLanguage'
        sourceDescriptorId:
          $ref: '#/components/schemas/ResourceDescriptorId'
        targetDescriptorId:
          $ref: '#/components/schemas/ResourceDescriptorId'
        steps:
          type: array
          description: Ordered transformation steps for step-based languages.
          items:
            $ref: '#/components/schemas/TransformationStep'
        expression:
          type: string
          description: Transformation expression for expression-based languages.
          example: 'employee.{ "email": email, "subject": givenName & " " & familyName }'
        metadata:
          $ref: '#/components/schemas/StringMap'
      example:
        displayName: Employee profile to license invitation
        description: Maps HR employee attributes into the invitation payload used by the license issuance flow.
        language: ATTRIBUTE_MAPPER
        sourceDescriptorId: 41436f49-040c-4f5f-9c7f-657f43762e2b
        targetDescriptorId: 7a44f0de-e4d9-44ef-9211-372433933a88
        steps:
          - stepType: MAP
            sourcePath: email
            targetPath: recipient.email
          - stepType: MAP
            sourcePath: license_type
            targetPath: credential.licenseType
          - stepType: CONSTANT
            targetPath: invitation.channel
            value: email
        metadata:
          mapper_version: '1'

    TransformationUpdateRequest:
      type: object
      description: Partial update for a transformation definition.
      properties:
        displayName:
          type: string
          description: Updated transformation name.
          example: Employee profile to license invitation
        description:
          type: string
          description: Updated transformation description.
          example: Maps employee profile rows into the current license invitation payload.
        language:
          $ref: '#/components/schemas/TransformationLanguage'
        sourceDescriptorId:
          $ref: '#/components/schemas/ResourceDescriptorId'
        targetDescriptorId:
          $ref: '#/components/schemas/ResourceDescriptorId'
        steps:
          type: array
          items:
            $ref: '#/components/schemas/TransformationStep'
        expression:
          type: string
          description: Updated expression for expression-based transformations.
          example: $.employee
        metadata:
          $ref: '#/components/schemas/StringMap'
      example:
        description: Maps employee profile rows into the current license invitation payload.
        steps:
          - stepType: MAP
            sourcePath: email
            targetPath: recipient.email
          - stepType: DEFAULT
            targetPath: invitation.locale
            value: en-US

    TransformationDefinition:
      description: Stored transformation definition.
      allOf:
        - $ref: '#/components/schemas/TransformationCreateRequest'
        - type: object
          required:
            - transformationId
            - createdAt
            - updatedAt
          properties:
            transformationId:
              $ref: '#/components/schemas/TransformationId'
            createdAt:
              type: string
              format: date-time
              description: Creation timestamp.
              example: '2026-06-18T09:35:00Z'
            updatedAt:
              type: string
              format: date-time
              description: Last update timestamp.
              example: '2026-06-18T09:40:00Z'
      example:
        transformationId: 0e60abcc-41b5-4cc5-bec2-f0047f129341
        displayName: Employee profile to license invitation
        description: Maps HR employee attributes into the invitation payload used by the license issuance flow.
        language: ATTRIBUTE_MAPPER
        sourceDescriptorId: 41436f49-040c-4f5f-9c7f-657f43762e2b
        targetDescriptorId: 7a44f0de-e4d9-44ef-9211-372433933a88
        steps:
          - stepType: MAP
            sourcePath: email
            targetPath: recipient.email
          - stepType: MAP
            sourcePath: license_type
            targetPath: credential.licenseType
        createdAt: '2026-06-18T09:35:00Z'
        updatedAt: '2026-06-18T09:40:00Z'

    TransformationStep:
      type: object
      description: One step in a transformation pipeline. Step semantics are intentionally generic so existing attribute mappers and future expression engines can share the route model.
      required:
        - stepType
      properties:
        stepType:
          type: string
          description: Transformation step operation.
          enum:
            - MAP
            - CONSTANT
            - DEFAULT
            - REQUIRE
            - REDACT
            - HASH
            - LOOKUP
            - CUSTOM
          example: MAP
        sourcePath:
          type: string
          description: Source path or field used by this step.
          example: email
        targetPath:
          type: string
          description: Target path or field written by this step.
          example: recipient.email
        value:
          description: Literal value used by CONSTANT or DEFAULT steps.
          nullable: true
          example: email
        expression:
          type: string
          description: Optional expression used by LOOKUP, CUSTOM, or expression-based steps.
          example: lower($.email)
        metadata:
          $ref: '#/components/schemas/StringMap'
      example:
        stepType: MAP
        sourcePath: email
        targetPath: recipient.email

    ConnectorRouteCreateRequest:
      type: object
      description: Request to compose one or more source operation bindings, one or more destination operation bindings, optional transformation, trigger, and execution policies.
      required:
        - displayName
        - sourceBindingIds
        - destinationBindingIds
      properties:
        version:
          type: string
          nullable: true
          description: Optional route version retained on the stored route and returned by reads.
          example: '2026-09.1'
        displayName:
          type: string
          description: Human-readable route name.
          example: Employee CSV to license invitations
        description:
          type: string
          description: Route purpose and operational boundaries.
          example: Imports employee rows, maps them to invitation payloads, and writes them to the invitation service.
        sourceBindingIds:
          type: array
          minItems: 1
          description: Source operation bindings that feed this route. More than one source supports enrichment and reference-data joins.
          items:
            $ref: '#/components/schemas/OperationBindingId'
        destinationBindingIds:
          type: array
          minItems: 1
          description: Destination operation bindings written by this route. More than one destination supports fan-out.
          items:
            $ref: '#/components/schemas/OperationBindingId'
        transformationId:
          $ref: '#/components/schemas/TransformationId'
        trigger:
          $ref: '#/components/schemas/ConnectorTrigger'
        atomicity:
          $ref: '#/components/schemas/RouteAtomicity'
        purpose:
          type: string
          description: Processing purpose captured at route design time for audit and future governance checks.
          example: credential-issuance
        legalBasis:
          type: string
          description: Legal, contractual, or policy basis for the route's data movement.
          example: contract
        enabled:
          type: boolean
          description: Whether this route is eligible for scheduled, event, webhook, or on-demand execution.
          default: true
          example: true
        egressPolicy:
          $ref: '#/components/schemas/EgressPolicy'
        materializationPolicy:
          description: |
            Route-level materialization policy. When omitted by the caller, the platform applies the
            safe default `mode: NONE`, meaning values are not retained unless a route explicitly opts in.
          $ref: '#/components/schemas/MaterializationPolicy'
        metadata:
          $ref: '#/components/schemas/StringMap'
      example:
        displayName: Employee CSV to license invitations
        description: Imports employee rows, maps them to invitation payloads, and writes them to the invitation service.
        sourceBindingIds:
          - 2777417e-82ce-4d3e-b96c-94e00a4d9a93
        destinationBindingIds:
          - b1313b55-ee8c-41d1-8f4f-f4fe2c15e3be
        transformationId: 0e60abcc-41b5-4cc5-bec2-f0047f129341
        trigger:
          triggerType: ON_DEMAND
        atomicity: PER_RECORD
        purpose: credential-issuance
        legalBasis: contract
        enabled: true
        materializationPolicy:
          mode: NONE

    ConnectorRouteUpdateRequest:
      type: object
      description: Partial update for a connector route. Use this to adjust bindings, transformation, trigger, or policy.
      properties:
        version:
          type: string
          nullable: true
          description: Replacement route version. Omission or null preserves the existing version.
          example: '2026-09.2'
        displayName:
          type: string
          description: Updated route name.
          example: Employee CSV to license invitations
        description:
          type: string
          description: Updated route description.
          example: Imports employee rows from the latest customer CSV upload.
        sourceBindingIds:
          type: array
          minItems: 1
          description: Replacement list of source operation bindings.
          items:
            $ref: '#/components/schemas/OperationBindingId'
        destinationBindingIds:
          type: array
          minItems: 1
          description: Replacement list of destination operation bindings.
          items:
            $ref: '#/components/schemas/OperationBindingId'
        transformationId:
          $ref: '#/components/schemas/TransformationId'
        trigger:
          $ref: '#/components/schemas/ConnectorTrigger'
        atomicity:
          $ref: '#/components/schemas/RouteAtomicity'
        purpose:
          type: string
          description: Updated processing purpose.
          example: credential-issuance
        legalBasis:
          type: string
          description: Updated legal, contractual, or policy basis.
          example: contract
        enabled:
          type: boolean
          description: Whether this route is eligible for execution.
          example: true
        egressPolicy:
          $ref: '#/components/schemas/EgressPolicy'
        materializationPolicy:
          $ref: '#/components/schemas/MaterializationPolicy'
        metadata:
          $ref: '#/components/schemas/StringMap'
      example:
        trigger:
          triggerType: SCHEDULE
          schedule: 0 2 * * *
        atomicity: ALL_OR_NOTHING

    ConnectorRoute:
      description: Stored connector route definition.
      allOf:
        - $ref: '#/components/schemas/ConnectorRouteCreateRequest'
        - type: object
          required:
            - routeId
            - materializationPolicy
            - createdAt
            - updatedAt
          properties:
            routeId:
              $ref: '#/components/schemas/ConnectorRouteId'
            createdAt:
              type: string
              format: date-time
              description: Creation timestamp.
              example: '2026-06-18T10:00:00Z'
            updatedAt:
              type: string
              format: date-time
              description: Last update timestamp.
              example: '2026-06-18T10:05:00Z'
            createdByUserId:
              type: string
              description: Optional user id that created the route.
              example: platform-admin
            updatedByUserId:
              type: string
              description: Optional user id that last updated the route.
              example: platform-admin
            deletedAt:
              type: string
              format: date-time
              description: Soft-delete timestamp. Deleted routes are hidden from normal route lookup and listing but retained for run lineage.
              example: '2026-06-19T10:05:00Z'
      example:
        routeId: 1e8ff011-2274-4f16-a7dd-bf0b4fd5262f
        displayName: Employee CSV to license invitations
        description: Imports employee rows, maps them to invitation payloads, and writes them to the invitation service.
        sourceBindingIds:
          - 2777417e-82ce-4d3e-b96c-94e00a4d9a93
        destinationBindingIds:
          - b1313b55-ee8c-41d1-8f4f-f4fe2c15e3be
        transformationId: 0e60abcc-41b5-4cc5-bec2-f0047f129341
        trigger:
          triggerType: ON_DEMAND
        atomicity: PER_RECORD
        purpose: credential-issuance
        legalBasis: contract
        enabled: true
        materializationPolicy:
          mode: NONE
        createdAt: '2026-06-18T10:00:00Z'
        updatedAt: '2026-06-18T10:05:00Z'

    ConnectorTrigger:
      type: object
      description: Trigger policy for starting a route. Triggers are declarative; actual scheduling, event subscriptions, and pipeline wiring are runtime concerns.
      required:
        - triggerType
      properties:
        triggerType:
          type: string
          description: Trigger mechanism for the route.
          enum:
            - ON_DEMAND
            - SCHEDULE
            - EVENT
            - WEBHOOK
            - PIPELINE
          example: ON_DEMAND
        schedule:
          type: string
          description: Cron expression for scheduled triggers.
          example: 0 2 * * *
        eventType:
          type: string
          description: Event type that starts an event-triggered route.
          example: connector.import.uploaded
        pipelineRef:
          type: string
          description: Reference to a platform pipeline, workflow, or orchestration definition that starts the route.
          example: pipeline://issuance/employee-license
        metadata:
          $ref: '#/components/schemas/StringMap'
      example:
        triggerType: ON_DEMAND
        metadata:
          initiated_by: platform-admin

    DestinationDelivery:
      type: object
      description: Delivery requirements for destination bindings, including acknowledgement and retry behavior.
      properties:
        deliveryMode:
          $ref: '#/components/schemas/DestinationDeliveryMode'
        ackMode:
          $ref: '#/components/schemas/DestinationAckMode'
        idempotencyKeyPath:
          type: string
          description: Path in the outgoing payload used as idempotency key.
          example: recipient.email
        retryPolicy:
          $ref: '#/components/schemas/RetryPolicy'
      example:
        deliveryMode: BATCH
        ackMode: COMMITTED
        idempotencyKeyPath: recipient.email
        retryPolicy:
          maxAttempts: 5
          backoffMillis: 30000
          deadLetterEnabled: true

    RetryPolicy:
      type: object
      description: Retry and dead-letter behavior for connector operations.
      properties:
        maxAttempts:
          type: integer
          description: Maximum number of attempts, including the initial attempt. Zero means no retry after the initial failure.
          minimum: 0
          example: 5
        backoffMillis:
          type: integer
          format: int64
          description: Delay between attempts in milliseconds. Runtime implementations may apply jitter.
          minimum: 0
          example: 30000
        deadLetterEnabled:
          type: boolean
          description: Whether failed items should be written to the route dead-letter store when retries are exhausted.
          default: true
          example: true
        retryOnNetworkFailure:
          type: boolean
          default: false
        retryableStatusCodes:
          type: array
          items:
            type: integer
          default: []
        retryOnServerErrors:
          type: boolean
          default: false
        honorRetryAfter:
          type: boolean
          default: false
        exponentialBackoff:
          type: boolean
          default: false
        maxBackoffMillis:
          type: integer
          format: int64
          default: 0
      example:
        maxAttempts: 5
        backoffMillis: 30000
        deadLetterEnabled: true

    EgressPolicy:
      type: object
      description: |
        Network and payload egress limits for connector operations. This is the connector policy
        hook for SSRF protection, tenant boundary checks, and later semantic/compliance checks.
        Runtime adapters should resolve names before connecting and pass the resolved address to
        the evaluator when DNS pinning is enabled.
      properties:
        allowedHosts:
          type: array
          description: Hostnames or wildcard host patterns the connector is allowed to contact. Use `*.example.com` for one-or-more subdomains.
          items:
            type: string
          example: [hr.example.com]
        blockedHosts:
          type: array
          description: Hostnames or wildcard host patterns that are always denied, even when they also match an allowed host pattern.
          items:
            type: string
          example: [metadata.example.com, localhost]
        allowedCidrs:
          type: array
          description: IPv4 CIDR ranges the connector may contact when the target or resolved address is an IP address.
          items:
            type: string
          example: [203.0.113.0/24]
        allowedProtocols:
          type: array
          description: Access protocols allowed by this connector or operation.
          items:
            $ref: '#/components/schemas/AccessProtocol'
          example: [HTTPS]
        allowedPorts:
          type: array
          description: Network ports allowed by this connector or operation. Empty means protocol defaults are allowed unless another policy blocks the target.
          items:
            type: integer
            minimum: 1
            maximum: 65535
          example: [443]
        blockPrivateNetworks:
          type: boolean
          description: Whether private, loopback, link-local, local, multicast, and cloud metadata targets are denied by default.
          default: true
          example: true
        pinResolvedAddress:
          type: boolean
          description: Whether runtime adapters should connect to the already-validated resolved address to reduce DNS rebinding risk.
          default: true
          example: true
        maxPayloadBytes:
          type: integer
          format: int64
          description: Maximum allowed request or response payload size in bytes.
          minimum: 0
          example: 1048576
        requiresTenantBoundary:
          type: boolean
          description: Whether route execution must enforce tenant boundary checks before egress.
          default: true
          example: true
        metadata:
          $ref: '#/components/schemas/StringMap'
      example:
        allowedHosts: [hr.example.com]
        blockedHosts: [localhost, 169.254.169.254]
        allowedCidrs: [203.0.113.0/24]
        allowedProtocols: [HTTPS]
        allowedPorts: [443]
        blockPrivateNetworks: true
        pinResolvedAddress: true
        maxPayloadBytes: 1048576
        requiresTenantBoundary: true

    MaterializationPolicy:
      type: object
      description: Policy for retaining, caching, indexing, or mirroring data touched by connector routes.
      properties:
        mode:
          $ref: '#/components/schemas/MaterializationMode'
        ttlSeconds:
          type: integer
          format: int64
          description: Time to live for materialized data in seconds.
          minimum: 0
          example: 2592000
        storageResourceDescriptorId:
          $ref: '#/components/schemas/ResourceDescriptorId'
        retention:
          $ref: '#/components/schemas/RetentionSpec'
        metadata:
          $ref: '#/components/schemas/StringMap'
      example:
        mode: PERSIST
        ttlSeconds: 2592000
        retention:
          purpose: credential-issuance
          legalBasis: contract
          retentionPeriod: P30D
          deleteAction: DELETE

    RetentionSpec:
      type: object
      description: Retention metadata used by governance and future compliance checks. It can be applied to fields, resources, materialized data, or dead-letter payloads.
      properties:
        purpose:
          type: string
          description: Processing purpose.
          example: credential-issuance
        legalBasis:
          type: string
          description: Legal or contractual basis for retention.
          example: contract
        retentionPeriod:
          type: string
          description: ISO-8601 duration, for example P30D or P7Y.
          example: P30D
        deleteAction:
          $ref: '#/components/schemas/RetentionDeleteAction'
        metadata:
          $ref: '#/components/schemas/StringMap'
      example:
        purpose: credential-issuance
        legalBasis: contract
        retentionPeriod: P30D
        deleteAction: DELETE

    DiscoverResourcesRequest:
      type: object
      description: Request to ask a connector to discover available resources, fields, and operations. Discovery is advisory and returns suggested descriptors that still need to be persisted explicitly.
      properties:
        includeFields:
          type: boolean
          description: Whether discovery should include field-level descriptors when available.
          default: true
          example: true
        includeOperations:
          type: boolean
          description: Whether discovery should include operation hints such as OpenAPI operation ids or database read/write capabilities.
          default: true
          example: true
        schemaDriftPolicy:
          $ref: '#/components/schemas/SchemaDriftPolicy'
        filters:
          $ref: '#/components/schemas/StringMap'
      example:
        includeFields: true
        includeOperations: true
        schemaDriftPolicy: WARN
        filters:
          path_prefix: /employees

    SchemaDriftPolicy:
      type: string
      description: Action to apply when a live discovered contract hash differs from the persisted resource descriptor contract hash. IGNORE suppresses drift findings, WARN returns findings, and FAIL rejects discovery.
      enum:
        - IGNORE
        - WARN
        - FAIL
      default: WARN
      example: WARN

    SchemaDriftFinding:
      type: object
      description: Governance fact emitted when a discovered resource contract no longer matches the pinned resource descriptor contract hash.
      required:
        - resourceDescriptorId
        - expectedContentHash
        - discoveredContentHash
      properties:
        resourceDescriptorId:
          $ref: '#/components/schemas/ResourceDescriptorId'
        externalResourceName:
          type: string
          description: Connector-local resource name associated with the drift, when available.
          example: /employees/{employee_id}
        expectedContentHash:
          type: string
          description: Persisted/pinned contract hash from the resource descriptor.
          example: sha256:pinned
        discoveredContentHash:
          type: string
          description: Hash reported by live connector discovery.
          example: sha256:runtime
        expectedContractVersion:
          type: string
          description: Version from the persisted contract reference.
          example: '2026-06'
        discoveredContractVersion:
          type: string
          description: Version from the live discovered contract reference.
          example: '2026-07'
        policy:
          $ref: '#/components/schemas/SchemaDriftPolicy'
        detectedAt:
          type: string
          format: date-time
          description: Timestamp when drift was detected.
          example: '2026-06-18T10:10:00Z'
        message:
          type: string
          description: Human-readable drift summary.
          example: Discovered contract hash differs from the pinned resource descriptor contract hash.
        metadata:
          $ref: '#/components/schemas/StringMap'
      example:
        resourceDescriptorId: 9f70b114-35a6-4700-a8a3-7ad0c2d81202
        externalResourceName: /employees/{employee_id}
        expectedContentHash: sha256:pinned
        discoveredContentHash: sha256:runtime
        expectedContractVersion: '2026-06'
        discoveredContractVersion: '2026-07'
        policy: WARN
        detectedAt: '2026-06-18T10:10:00Z'

    DiscoveryResult:
      type: object
      description: Discovery result returned by a connector. Suggested descriptors are not persisted until the caller creates them through the resource descriptor API.
      required:
        - connectorInstanceId
        - resources
      properties:
        connectorInstanceId:
          $ref: '#/components/schemas/ConnectorInstanceId'
        resources:
          type: array
          description: Resources discovered from the connector.
          items:
            $ref: '#/components/schemas/DiscoveredResource'
        schemaDrift:
          type: array
          description: Contract-hash drift findings detected while comparing live discovery with persisted resource descriptors.
          items:
            $ref: '#/components/schemas/SchemaDriftFinding'
        metadata:
          $ref: '#/components/schemas/StringMap'
      example:
        connectorInstanceId: 3f6f4f46-24fb-4c35-a7a4-bc6c7f7861f5
        resources:
          - externalResourceName: /employees/{employee_id}
            resourceKind: OBJECT
            representationKind: JSON
            supportedOperations: [READ, QUERY]
            suggestedDescriptor:
              resourceDescriptorId: 9f70b114-35a6-4700-a8a3-7ad0c2d81202
              displayName: Workday employee profile response
              resourceKind: OBJECT
              representationKind: JSON
              shapeKind: OPENAPI_SCHEMA
              contract:
                contractKind: OPENAPI
                uri: https://hr.example.com/.well-known/openapi.json
              createdAt: '2026-06-18T10:10:00Z'
              updatedAt: '2026-06-18T10:10:00Z'
        schemaDrift: []
        metadata:
          discovered_at: '2026-06-18T10:10:00Z'

    DiscoveredResource:
      type: object
      description: One resource discovered from an external system or connector runtime.
      properties:
        externalResourceName:
          type: string
          description: Connector-local resource name such as path, table, bucket key, claim set, topic, or collection.
          example: /employees/{employee_id}
        resourceKind:
          $ref: '#/components/schemas/ResourceKind'
        representationKind:
          $ref: '#/components/schemas/RepresentationKind'
        suggestedDescriptor:
          $ref: '#/components/schemas/ResourceDescriptor'
        supportedOperations:
          type: array
          description: Logical operations suggested by discovery.
          items:
            $ref: '#/components/schemas/OperationKind'
          example: [READ, QUERY]
        schemaDrift:
          $ref: '#/components/schemas/SchemaDriftFinding'
        metadata:
          $ref: '#/components/schemas/StringMap'
      example:
        externalResourceName: /employees/{employee_id}
        resourceKind: OBJECT
        representationKind: JSON
        supportedOperations: [READ, QUERY]
        suggestedDescriptor:
          resourceDescriptorId: 9f70b114-35a6-4700-a8a3-7ad0c2d81202
          displayName: Workday employee profile response
          resourceKind: OBJECT
          representationKind: JSON
          shapeKind: OPENAPI_SCHEMA
          createdAt: '2026-06-18T10:10:00Z'
          updatedAt: '2026-06-18T10:10:00Z'

    HealthCheckRequest:
      type: object
      description: Request to run a connector health check. The check can be scoped to dependencies or an operation kind.
      properties:
        includeDependencies:
          type: boolean
          description: Whether dependency checks such as endpoint reachability, credential validity, and contract availability should be included.
          default: true
          example: true
        operationKind:
          $ref: '#/components/schemas/OperationKind'
      example:
        includeDependencies: true
        operationKind: READ

    ConnectorHealth:
      type: object
      description: Connector health result for one connector instance.
      required:
        - connectorInstanceId
        - status
        - checkedAt
      properties:
        connectorInstanceId:
          $ref: '#/components/schemas/ConnectorInstanceId'
        status:
          type: string
          description: Overall health status.
          enum:
            - HEALTHY
            - DEGRADED
            - UNHEALTHY
            - UNKNOWN
          example: DEGRADED
        checkedAt:
          type: string
          format: date-time
          description: Timestamp when the health check completed.
          example: '2026-06-18T10:15:00Z'
        details:
          type: array
          description: Dependency-level health details.
          items:
            $ref: '#/components/schemas/HealthDetail'
      example:
        connectorInstanceId: 3f6f4f46-24fb-4c35-a7a4-bc6c7f7861f5
        status: DEGRADED
        checkedAt: '2026-06-18T10:15:00Z'
        details:
          - name: openapi-contract
            status: HEALTHY
            message: Contract document resolved.
          - name: oauth-token
            status: DEGRADED
            message: Token expires within the warning window.

    HealthDetail:
      type: object
      description: Dependency-level or operation-level health detail.
      properties:
        name:
          type: string
          description: Dependency or check name.
          example: oauth-token
        status:
          type: string
          description: Status of the dependency or check.
          example: DEGRADED
        message:
          type: string
          description: Human-readable health message.
          example: Token expires within the warning window.
        metadata:
          $ref: '#/components/schemas/StringMap'
      example:
        name: oauth-token
        status: DEGRADED
        message: Token expires within the warning window.

    StartConnectorRouteRunRequest:
      type: object
      description: Request to start a route run. The input object is connector- and route-specific; the route's source binding decides how it is interpreted.
      properties:
        operationId:
          type: string
          minLength: 1
          description: Stable operation identity. Repeated starts reconcile the same tenant-scoped run and reject changed input without repeating delivery.
        input:
          description: Optional input payload, connector fields, or batch reference passed to the route.
          nullable: true
          example:
            employee_id: E12345
            batch_ref: vault://imports/license-batches/batch-2026-06-18.csv
        dryRun:
          type: boolean
          description: Whether the run should validate and transform without committing destination writes.
          default: false
          example: false
        invocationBindingId:
          $ref: '#/components/schemas/ConnectorInvocationBindingId'
        logicalConnectionBindingId:
          $ref: '#/components/schemas/LogicalConnectionBindingId'
        physicalConnectorInstanceId:
          $ref: '#/components/schemas/ConnectorInstanceId'
        exchangeMode:
          $ref: '#/components/schemas/ConnectorExchangeMode'
        governance:
          $ref: '#/components/schemas/ConnectorGovernanceEnvelope'
        partyAnchors:
          $ref: '#/components/schemas/ConnectorPartyAnchorSet'
        protocolContext:
          $ref: '#/components/schemas/ConnectorProtocolEventContext'
        correlationId:
          type: string
          description: Caller-provided correlation id for logs, run events, and downstream traceability.
          example: import-2026-06-18-001
        metadata:
          $ref: '#/components/schemas/StringMap'
      example:
        input:
          batch_ref: vault://imports/license-batches/batch-2026-06-18.csv
        dryRun: false
        correlationId: import-2026-06-18-001
        metadata:
          initiated_by: admin@example.com

    ConnectorRun:
      type: object
      description: Execution record for a connector route or operation. Counts are item-level where the connector runtime can report item-level progress.
      required:
        - runId
        - status
        - startedAt
      properties:
        runId:
          $ref: '#/components/schemas/ConnectorRunId'
        routeId:
          $ref: '#/components/schemas/ConnectorRouteId'
        bindingId:
          $ref: '#/components/schemas/OperationBindingId'
        connectorInstanceId:
          $ref: '#/components/schemas/ConnectorInstanceId'
        invocationBindingId:
          $ref: '#/components/schemas/ConnectorInvocationBindingId'
        logicalConnectionBindingId:
          $ref: '#/components/schemas/LogicalConnectionBindingId'
        physicalConnectorInstanceId:
          $ref: '#/components/schemas/ConnectorInstanceId'
        exchangeMode:
          $ref: '#/components/schemas/ConnectorExchangeMode'
        dataDirection:
          $ref: '#/components/schemas/ConnectorDataDirection'
        initiationSide:
          $ref: '#/components/schemas/ConnectorInitiationSide'
        governance:
          $ref: '#/components/schemas/ConnectorGovernanceEnvelope'
        partyAnchors:
          $ref: '#/components/schemas/ConnectorPartyAnchorSet'
        protocolContext:
          $ref: '#/components/schemas/ConnectorProtocolEventContext'
        connectorResourceId:
          $ref: '#/components/schemas/ConnectorResourceId'
        operationKind:
          $ref: '#/components/schemas/OperationKind'
        triggerKind:
          type: string
          description: Mechanism that initiated the run.
          enum:
            - INLINE
            - ON_DEMAND
            - SCHEDULED
            - EVENT
            - WEBHOOK
            - PIPELINE
          example: ON_DEMAND
        status:
          $ref: '#/components/schemas/ConnectorRunStatus'
        startedAt:
          type: string
          format: date-time
          description: Timestamp when execution started.
          example: '2026-06-18T10:20:00Z'
        finishedAt:
          type: string
          format: date-time
          description: Timestamp when execution finished, if complete.
          example: '2026-06-18T10:21:12Z'
        itemCount:
          type: integer
          format: int64
          description: Number of input items seen by the run.
          minimum: 0
          example: 250
        successCount:
          type: integer
          format: int64
          description: Number of items processed successfully.
          minimum: 0
          example: 247
        failureCount:
          type: integer
          format: int64
          description: Number of items that failed after retries or validation.
          minimum: 0
          example: 3
        correlationId:
          type: string
          description: Caller-provided or runtime-generated correlation id.
          example: import-2026-06-18-001
        error:
          $ref: '#/components/schemas/ApiError'
        metadata:
          $ref: '#/components/schemas/StringMap'
        updatedAt:
          type: string
          format: date-time
          description: Last update timestamp for this run record.
          example: '2026-06-18T10:21:12Z'
        createdByUserId:
          type: string
          description: Optional user id that initiated or created the run record.
          example: admin@example.com
        updatedByUserId:
          type: string
          description: Optional user id that last updated the run record.
          example: connector-runtime
        deletedAt:
          type: string
          format: date-time
          description: Soft-delete timestamp, if the run record is hidden from normal queries.
          example: '2026-07-18T10:21:12Z'
      example:
        runId: 9a785884-63ea-4b07-9976-264a1fc595f1
        routeId: 1e8ff011-2274-4f16-a7dd-bf0b4fd5262f
        connectorInstanceId: 3f6f4f46-24fb-4c35-a7a4-bc6c7f7861f5
        connectorResourceId: 8d228f50-a86c-4d5f-9eb4-83fdad7d75fa
        operationKind: READ
        triggerKind: ON_DEMAND
        status: PARTIALLY_FAILED
        startedAt: '2026-06-18T10:20:00Z'
        finishedAt: '2026-06-18T10:21:12Z'
        itemCount: 250
        successCount: 247
        failureCount: 3
        correlationId: import-2026-06-18-001
        metadata:
          batch_ref: vault://imports/license-batches/batch-2026-06-18.csv

    ConnectorRunEvent:
      type: object
      description: Timestamped event emitted during route or operation execution.
      required:
        - eventId
        - runId
        - level
        - message
        - occurredAt
      properties:
        eventId:
          type: string
          format: uuid
          description: Stable run event identifier.
          example: 524d8a98-c4a4-4982-b414-e29679b41eaf
        runId:
          $ref: '#/components/schemas/ConnectorRunId'
        routeId:
