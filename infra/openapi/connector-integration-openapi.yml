    ConnectorDeadLetter:
      type: object
      description: Failed item captured after validation, transformation, or destination delivery failure. Payloads are referenced, not necessarily embedded, so retention policy can control storage.
      required:
        - deadLetterId
        - runId
        - reason
        - createdAt
      properties:
        deadLetterId:
          type: string
          format: uuid
          description: Stable dead-letter identifier.
          example: a7d38149-19d4-4d0e-8af7-f7f8891f73bb
        runId:
          $ref: '#/components/schemas/ConnectorRunId'
        routeId:
          $ref: '#/components/schemas/ConnectorRouteId'
        connectorInstanceId:
          $ref: '#/components/schemas/ConnectorInstanceId'
        bindingId:
          $ref: '#/components/schemas/OperationBindingId'
        connectorResourceId:
          $ref: '#/components/schemas/ConnectorResourceId'
        operationKind:
          $ref: '#/components/schemas/OperationKind'
        reason:
          type: string
          description: Failure reason captured by the connector runtime.
          example: Missing required field recipient.email.
        payloadRef:
          type: string
          description: Reference to a retained failed payload, if storage policy allows it.
          example: vault://connector-runs/9a785884-63ea-4b07-9976-264a1fc595f1/deadletters/row-42.json
        createdAt:
          type: string
          format: date-time
          description: Dead-letter creation timestamp.
          example: '2026-06-18T10:21:11Z'
        metadata:
          $ref: '#/components/schemas/StringMap'
        createdByUserId:
          type: string
          description: Optional user id associated with the failed item capture.
          example: connector-runtime
        deletedAt:
          type: string
          format: date-time
          description: Soft-delete timestamp, if the dead letter is hidden after retention handling.
          example: '2026-07-18T10:21:11Z'
      example:
        deadLetterId: a7d38149-19d4-4d0e-8af7-f7f8891f73bb
        runId: 9a785884-63ea-4b07-9976-264a1fc595f1
        routeId: 1e8ff011-2274-4f16-a7dd-bf0b4fd5262f
