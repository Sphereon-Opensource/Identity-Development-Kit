        uri:
          type: string
          example: https://hr.example.test/employees/E1042
        resourceDescriptorId:
          $ref: '#/components/schemas/ResourceDescriptorId'
        contentHash:
          type: string
          example: sha256:4bf4...
        length:
          type: integer
          format: int64
          example: 4096
        metadata:
          type: object
          additionalProperties:
            type: string

    ConnectorRecord:
      type: object
      description: Runtime connector record emitted by a source connector or passed to a destination connector.
      required:
        - recordId
        - payload
      properties:
        recordId:
          type: string
          example: hr:E1042
        payload:
          $ref: '#/components/schemas/ConnectorRecordPayload'
        invocationBindingId:
          $ref: '#/components/schemas/ConnectorInvocationBindingId'
        logicalConnectionBindingId:
          $ref: '#/components/schemas/LogicalConnectionBindingId'
        physicalConnectorInstanceId:
          $ref: '#/components/schemas/ConnectorId'
        exchangeMode:
          $ref: '#/components/schemas/ConnectorExchangeMode'
        governance:
          $ref: '#/components/schemas/ConnectorGovernanceEnvelope'
        semanticCoordinates:
          type: array
          items:
            type: object
            additionalProperties: true
        partyAnchors:
          $ref: '#/components/schemas/ConnectorPartyAnchorSet'
        industrialDiscovery:
          type: object
          additionalProperties: true
        industrialObservation:
          type: object
          additionalProperties: true
        dataspace:
          type: object
          additionalProperties: true
        protocolContext:
          $ref: '#/components/schemas/ConnectorProtocolEventContext'
        integrity:
          $ref: '#/components/schemas/ConnectorIntegrityReference'
        cursor:
          $ref: '#/components/schemas/ConnectorCursor'
        connectorResourceId:
          $ref: '#/components/schemas/ConnectorResourceId'
        resourceDescriptorId:
          $ref: '#/components/schemas/ResourceDescriptorId'
        operationBindingId:
          $ref: '#/components/schemas/OperationBindingId'
        occurredAt:
          type: string
          format: date-time
        metadata:
          type: object
          additionalProperties:
            type: string

    ConnectorWriteStatus:
      type: string
      description: Aggregate or per-record destination write status.
      enum:
        - ACCEPTED
        - COMMITTED
        - DEFERRED
        - PARTIAL
        - FAILED
      example: COMMITTED

    ConnectorRecordWriteOutcome:
      type: object
      description: Per-record delivery outcome reported by a destination runtime.
      required:
        - recordId
        - status
      properties:
        recordId:
          type: string
          example: hr:E1042
        status:
          $ref: '#/components/schemas/ConnectorWriteStatus'
        metadata:
          type: object
          additionalProperties:
            type: string

    ConnectorWriteResult:
      type: object
      description: Destination connector write result, including aggregate and optional per-record outcomes.
      required:
        - status
      properties:
        status:
          $ref: '#/components/schemas/ConnectorWriteStatus'
        recordsAccepted:
          type: integer
          format: int64
          default: 0
          example: 1
        recordsCommitted:
          type: integer
          format: int64
          default: 0
          example: 1
        externalRunRef:
          type: string
          example: hr-export-20260705-001
        lastCursor:
          $ref: '#/components/schemas/ConnectorCursor'
        recordOutcomes:
          type: array
          items:
            $ref: '#/components/schemas/ConnectorRecordWriteOutcome'
        metadata:
          type: object
          additionalProperties:
            type: string

    ConnectorInvocationRequest:
      type: object
      description: Runtime request passed from a protocol, form, portal, or workflow stage. The serialized binding supplies lookup identity and an exact snapshot assertion only. VDX independently resolves the current tenant-scoped registry or server-configuration authority before policy evaluation and route execution.
      required:
        - invocationId
        - binding
      properties:
        invocationId:
          $ref: '#/components/schemas/ConnectorInvocationId'
        binding:
          $ref: '#/components/schemas/ConnectorInvocationBinding'
          description: Non-authoritative lookup identity and exact snapshot assertion. Inline binding facts never select policy or route execution authority.
        fields:
          type: object
          description: Canonical and protocol field values available to the connector invocation.
          additionalProperties: true
        protocolContext:
          $ref: '#/components/schemas/ConnectorProtocolEventContext'
        record:
          $ref: '#/components/schemas/ConnectorRecord'
        vaultWrite:
          $ref: '#/components/schemas/ConnectorVaultWrite'

    ConnectorRunCorrelation:
      type: object
      description: Route-run lineage produced by connector invocation execution.
      properties:
        runId:
          $ref: '#/components/schemas/ConnectorRunId'
        externalRunRef:
          type: string
          example: run-issuer-config-1-proof-vault
        routeId:
          $ref: '#/components/schemas/ConnectorRouteId'

    ConnectorVaultRetentionProfile:
      type: string
      description: Vault retention profile requested by a connector invocation result.
      enum:
        - ISSUANCE_PROOF
        - CANONICAL_SUBJECT_DATA
        - RECEIVED_CUSTOMER_DATA
      example: ISSUANCE_PROOF

    ConnectorVaultWrite:
      type: object
      description: Idempotent vault write requested by a connector invocation after protocol completion.
      required:
        - vaultProfile
        - idempotentUpsertKey
        - governance
      properties:
        vaultProfile:
          $ref: '#/components/schemas/ConnectorVaultRetentionProfile'
        idempotentUpsertKey:
          type: string
          example: proof:offer-123:E-100
        subjectCorrelationHandle:
          type: string
          example: subject:E-100
        revocationReissueConnectorField:
          type: string
          example: reissue:E-100
        selectedFields:
          type: object
          additionalProperties: true
        proofRef:
          type: string
          example: proof-ref
        statusHandle:
          type: string
          example: status-ref
        auditLineage:
          $ref: '#/components/schemas/ConnectorRunCorrelation'
        governance:
          $ref: '#/components/schemas/ConnectorGovernanceEnvelope'

    ConnectorInvocationDispatchStatus:
      type: string
      description: Dispatch outcome of one connector invocation binding within a protocol phase.
      default: SUCCEEDED
      enum:
        - SUCCEEDED
        - FAILED_CONTINUED
        - DEAD_LETTERED
        - QUARANTINED
      example: SUCCEEDED

    ConnectorInvocationTerminalStatus:
      type: string
      description: Final status of one connector invocation stream.
      enum: [SUCCEEDED, FAILED, CANCELLED]
      example: SUCCEEDED

    ConnectorInvocationTerminalOutcome:
      type: object
      description: Exactly-once terminal outcome emitted by a connector invocation stream, including produced fields, written records, route lineage, and vault writes.
      required: [status]
      properties:
        status:
          $ref: '#/components/schemas/ConnectorInvocationTerminalStatus'
        invocationBindingId:
          $ref: '#/components/schemas/ConnectorInvocationBindingId'
        dispatchStatus:
          $ref: '#/components/schemas/ConnectorInvocationDispatchStatus'
        failureReason:
          type: string
          description: Sanitized failure summary for a failed-but-continued invocation. Never echoes payload data.
          example: Connector destination is unavailable.
        producedFields:
          type: object
          additionalProperties: true
        records:
          type: array
          items:
            $ref: '#/components/schemas/ConnectorRecord'
        writeResult:
          $ref: '#/components/schemas/ConnectorWriteResult'
        runCorrelation:
          $ref: '#/components/schemas/ConnectorRunCorrelation'
        vaultWrites:
          type: array
          items:
            $ref: '#/components/schemas/ConnectorVaultWrite'

    ConnectorInvocationMetering:
      type: object
      description: Generic non-secret metering totals accumulated by the invocation.
      properties:
        units:
          type: object
          additionalProperties:
            type: integer
            format: int64
            minimum: 0

    ConnectorInvocationEvent:
      type: object
      description: Ordered event in a connector invocation stream. Exactly one of inlinePayload and encryptedPayloadRef is required. The stream must end with exactly one terminalOutcome.
      required: [invocationId, sequence, schemaRef, mediaType, timestamp]
      properties:
        invocationId:
          $ref: '#/components/schemas/ConnectorInvocationId'
        sequence:
          type: integer
          format: int64
          minimum: 0
        schemaRef:
          type: string
          minLength: 1
        mediaType:
          type: string
          minLength: 1
          example: application/json
        inlinePayload:
          description: Display-safe inline payload governed by schemaRef.
        encryptedPayloadRef:
          type: string
          minLength: 1
          description: Opaque reference to encrypted payload content.
        metering:
          $ref: '#/components/schemas/ConnectorInvocationMetering'
        timestamp:
          type: string
          format: date-time
        terminalOutcome:
          $ref: '#/components/schemas/ConnectorInvocationTerminalOutcome'
      not:
        anyOf:
          - required: [inlinePayload, encryptedPayloadRef]
          - not:
              anyOf:
                - required: [inlinePayload]
                - required: [encryptedPayloadRef]

    ConnectorInvocationCancellationOutcome:
      type: string
      description: Truthful result of attempting cancellation by invocation ID.
      enum: [CANCELLED, ALREADY_TERMINAL, NOT_FOUND]

    ConnectorInvocationCancellationResult:
      type: object
      required: [invocationId, outcome]
      properties:
        invocationId:
          $ref: '#/components/schemas/ConnectorInvocationId'
        outcome:
          $ref: '#/components/schemas/ConnectorInvocationCancellationOutcome'

    Oid4vciConnectorPipelineRequest:
      type: object
      description: EDK-neutral OID4VCI connector pipeline request used to run connector-native enrichment, export, notification, route, or vault-retention bindings at any issuance stage.
      required:
        - protocolContext
        - initialFields
        - bindings
        - stages
      properties:
        protocolContext:
          $ref: '#/components/schemas/ConnectorProtocolEventContext'
        initialFields:
          type: object
          additionalProperties: true
        bindings:
          type: array
          items:
            $ref: '#/components/schemas/ConnectorInvocationBinding'
        stages:
          type: array
          items:
            $ref: '#/components/schemas/ConnectorInvocationStage'

    Oid4vciConnectorPipelineResult:
      type: object
      description: Result of an OID4VCI connector pipeline run, including accumulated fields, invocation lineage, and vault writes.
      required:
        - fields
        - invocationResults
      properties:
        fields:
          type: object
          additionalProperties: true
        invocationResults:
          type: array
          items:
            $ref: '#/components/schemas/ConnectorInvocationTerminalOutcome'
        vaultWrites:
          type: array
          items:
            $ref: '#/components/schemas/ConnectorVaultWrite'

    StringMap:
      type: object
      description: Small string-only metadata map for labels, ownership, routing hints, and implementation-specific annotations. Use first-class fields for contractually significant data.
      additionalProperties:
        type: string
      example:
        owner_team: people-ops
        domain: employee-licensing
