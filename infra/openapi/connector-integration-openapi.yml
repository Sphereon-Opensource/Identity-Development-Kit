openapi: 3.0.4
info:
  title: Connector Integration Profile API
  version: 0.1.0
  x-generated-from: connector-openapi.yml
  x-profile: integration
  x-audience: external-partner
  x-related-contracts:
    - enableu-v1-openapi.yml
  x-operation-binding-fixtures:
    - enableu-v1-operation-bindings.json
  x-contract-version: v1
  x-contract-stability: stable
  x-products: [vdx]
  description: |
    Register and operate connector instances that can act as sources, destinations, or both.
    The API is mounted as a singular product API at `/api/connector/v1`; resources inside the API
    use plural REST paths.

    This generated external integration profile is the curated subset that third-party connector builders, SDK consumers, and low-code importers should consume. It is derived from the v1-stable connector REST contract and is not a second source of truth. Compatible additions may appear, but existing
    response fields, path names, operation ids, and request shapes are governed as public
    integration and SDK-facing contract surface.

    The model deliberately separates transport from data:

      - `AccessProtocol` describes how a connector reaches a system, such as HTTPS, JDBC, S3,
        Kafka, OIDC, or vault access.
      - `ResourceKind` describes the logical resource being accessed, such as tabular data,
        documents, claim sets, event streams, files, secrets, credentials, or presentations.
      - `RepresentationKind` describes the serialization or data representation, such as JSON,
        JSON-LD, CSV, JWT, RDF, Parquet, text, or binary.
      - `ContractKind` describes the schema or contract source, such as OpenAPI, JSON Schema,
        SQL schema, RDF shape, OIDC discovery, or CSV profile.

    A connector instance is represented as a Party and can be assigned Identities. Identifiers are
    always nested under Identity, matching the existing Party -> Identity -> Identifier model. This
    allows external systems, technical accounts, issuers, relying parties, APIs, and LOB systems to
    have durable identities without flattening identifiers directly onto connectors.

    Routes compose source and destination operation bindings with optional transformations. This
    supports current issuance use cases, CSV import/export, vault/blob materialization, HTTP/OpenAPI
    connector runtimes, SQL connector runtimes, OIDC claim sources, forms, workflows, and future governance
    controls without coupling the API to one credential or form pipeline.
  contact:
    name: Product Engineering
    email: support@example.com
    url: https://example.com
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0

servers:
  - url: https://api.example.com/api/connector/v1
    description: Production server.
  - url: http://localhost:8080/api/connector/v1
    description: Local development server.

security:
  - bearer: []

tags:
  - name: Connectors
    description: Register connector instances as durable Party-backed integration endpoints.
  - name: ConnectorResources
    description: Attach described resources to connector instances.
  - name: ResourceDescriptors
    description: Describe data shapes, contracts, fields, and semantic meaning independent of transport.
  - name: OperationBindings
    description: Bind connector operations to resources, protocols, transformations, and delivery policies.
  - name: SemanticBindings
    description: Bind resource fields and connector resources to semantic model references.
  - name: ConnectorInvocationBindings
    description: Bind product and protocol invocation stages to persisted connector routes, operations, logical context, and governance defaults.
  - name: LogicalConnectionBindings
    description: Scope physical connector instances to tenant, organization, brand, channel, and caller-specific logical usage contexts.
  - name: RouteExposures
    description: Describe externally callable route capabilities and their authorization, schema, subset, rate, and audit constraints.
  - name: ConnectorDataProducts
    description: Describe connector-exposed data products, catalog offers, transfer types, and governance scope without implementing DSP/DCAT wire behavior.
  - name: Transformations
    description: Define reusable transformations between resource descriptors.
  - name: Routes
    description: Compose source and destination operation bindings with optional transformation and trigger policy.
  - name: Runs
    description: Observe connector route and operation executions.

paths:
  /connectors:
    get:
      operationId: listConnectorInstances
      summary: List connector instances
      description: |
        Lists connector instances registered for the tenant. Use this endpoint to find durable
        integration endpoints by connector family, data-flow role, or logical operation support.
        A connector instance is not itself a resource shape; resource descriptors and operation
        bindings describe what the connector can read or write.
      tags: [Connectors]
      parameters:
        - $ref: '#/components/parameters/ConnectorType'
        - $ref: '#/components/parameters/Role'
        - $ref: '#/components/parameters/OperationKind'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Paged connector instances.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectorInstancePage'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: createConnectorInstance
      summary: Create a connector instance
      description: |
        Creates the connector instance. The create body carries no identity assignments;
        connector Party identities are managed separately through the connector identity
        endpoints and the Party APIs.
      tags: [Connectors]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConnectorInstanceCreateRequest'
      responses:
        '201':
          description: Connector instance created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectorInstance'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /connectors/{connectorInstanceId}:
    get:
      operationId: getConnectorInstance
      summary: Get a connector instance
      description: |
        Reads one connector instance, including its backing Party id, assigned identities,
        endpoint references, credential references, settings bindings, and default policies.
        Secret values are never returned.
      tags: [Connectors]
      parameters:
        - $ref: '#/components/parameters/ConnectorInstanceId'
      responses:
        '200':
          description: Connector instance.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectorInstance'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: updateConnectorInstance
      summary: Update a connector instance
      description: |
        Updates connector instance metadata, lifecycle state, supported operations, and default
        policies. Use lifecycleStatus=SUSPENDED to stop new route runs without deleting durable
        configuration or Party identity information.
      tags: [Connectors]
      parameters:
        - $ref: '#/components/parameters/ConnectorInstanceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConnectorInstanceUpdateRequest'
      responses:
        '200':
          description: Connector instance updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectorInstance'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: deleteConnectorInstance
      summary: Delete a connector instance
      description: |
        Deletes or tombstones the connector registration according to the runtime implementation.
        This removes the connector registry entry, but implementations should treat Party,
        Identity, Identifier, audit, and historical run data according to their own retention rules.
      tags: [Connectors]
      parameters:
        - $ref: '#/components/parameters/ConnectorInstanceId'
      responses:
        '204':
          description: Connector instance deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /connectors/{connectorInstanceId}/resources:
    get:
      operationId: listConnectorResources
      summary: List resources attached to a connector
      description: |
        Lists resource descriptors attached to a connector instance for source and destination use.
        The attached resource adds connector-local access details such as external resource name,
        endpoint id, and access protocol; the descriptor remains the reusable logical data shape.
      tags: [ConnectorResources]
      parameters:
        - $ref: '#/components/parameters/ConnectorInstanceId'
        - $ref: '#/components/parameters/Role'
        - $ref: '#/components/parameters/ResourceKind'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Paged resources attached to the connector.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectorResourcePage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      operationId: attachConnectorResource
      summary: Attach a resource descriptor to a connector
      description: |
        Attaches a reusable resource descriptor to a connector instance. For example, the same
        employee profile descriptor can be attached to an HTTP/OpenAPI connector over HTTPS, a CSV
        resource accessed over VAULT, and a SQL connector accessed over JDBC without changing the descriptor.
      tags: [ConnectorResources]
      parameters:
        - $ref: '#/components/parameters/ConnectorInstanceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttachConnectorResourceRequest'
      responses:
        '201':
          description: Resource attached to the connector.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectorResource'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /connectors/{connectorInstanceId}/discoveryruns:
    post:
      operationId: createConnectorDiscoveryRun
      summary: Discover connector resources
      description: |
        Runs connector discovery and returns suggested resource descriptors and operation hints.
        Discovery results are advisory; callers must create resource descriptors and operation
        bindings explicitly before routes can use them.
      tags: [ConnectorResources]
      parameters:
        - $ref: '#/components/parameters/ConnectorInstanceId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DiscoverResourcesRequest'
      responses:
        '200':
          description: Discovery result with suggested resource descriptors.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiscoveryResult'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /connectors/{connectorInstanceId}/healthchecks:
    post:
      operationId: createConnectorHealthCheck
      summary: Check connector health
      description: |
        Performs a health check for the connector instance and optionally its dependencies, such as
        endpoint reachability, credentials, contract availability, or operation-specific readiness.
        The health result is observational and does not change connector lifecycle status.
      tags: [Connectors]
      parameters:
        - $ref: '#/components/parameters/ConnectorInstanceId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HealthCheckRequest'
      responses:
        '200':
          description: Connector health result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectorHealth'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /resource/descriptors:
    get:
      operationId: listResourceDescriptors
      summary: List resource descriptors
      description: |
        Lists reusable resource descriptors. Descriptors describe the logical resource, data
        representation, structural contract, fields, semantic bindings, sensitivity, and retention
        hints independently from connector transport.
      tags: [ResourceDescriptors]
      parameters:
        - $ref: '#/components/parameters/ResourceKind'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Paged resource descriptors.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceDescriptorPage'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: createResourceDescriptor
      summary: Create a resource descriptor
      description: |
        Creates a reusable descriptor for data that can flow through connectors. Use this for CSV
        rows, REST payloads, OIDC claim sets, SQL tables, vault objects, forms, workflow payloads,
        credentials, presentations, and future resource types.
      tags: [ResourceDescriptors]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResourceDescriptorCreateRequest'
      responses:
        '201':
          description: Resource descriptor created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceDescriptor'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /resource/descriptors/{resourceDescriptorId}:
    get:
      operationId: getResourceDescriptor
      summary: Get a resource descriptor
      description: |
        Reads one resource descriptor including field metadata, contract reference, representation,
        and semantic/governance hints. The descriptor does not contain connector credentials or
        transport endpoint details.
      tags: [ResourceDescriptors]
      parameters:
        - $ref: '#/components/parameters/ResourceDescriptorId'
      responses:
        '200':
          description: Resource descriptor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceDescriptor'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: updateResourceDescriptor
      summary: Update a resource descriptor
      description: |
        Updates descriptor metadata, resource classification, representation, contract reference,
        or governance metadata. Field-level changes are managed through the fields subresource.
      tags: [ResourceDescriptors]
      parameters:
        - $ref: '#/components/parameters/ResourceDescriptorId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResourceDescriptorUpdateRequest'
      responses:
        '200':
          description: Resource descriptor updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceDescriptor'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /resource/descriptors/{resourceDescriptorId}/fields:
    get:
      operationId: listFieldDescriptors
      summary: List resource descriptor fields
      description: |
        Lists fields declared for a resource descriptor. Fields carry path/column names, value
        type hints, required/multi-valued semantics, business-term references, sensitivity,
        and optional retention metadata.
      tags: [ResourceDescriptors]
      parameters:
        - $ref: '#/components/parameters/ResourceDescriptorId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Paged field descriptors.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FieldDescriptorPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      operationId: createFieldDescriptor
      summary: Add a field descriptor
      description: |
        Adds a field to a descriptor. Use this to document a CSV column, JSON path, SQL column,
        OIDC claim, form field, credential claim, or presentation attribute that can be validated,
        mapped, governed, or transformed.
      tags: [ResourceDescriptors]
      parameters:
        - $ref: '#/components/parameters/ResourceDescriptorId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FieldDescriptorInput'
      responses:
        '201':
          description: Field descriptor created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FieldDescriptor'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /operation/bindings:
    get:
      operationId: listOperationBindings
      summary: List operation bindings
      description: |
        Lists connector operation bindings. Operation bindings connect connector instances,
        attached resources, logical operation kinds, connector-local operation names, protocols,
        transformations, delivery behavior, and egress policies.
      tags: [OperationBindings]
      parameters:
        - $ref: '#/components/parameters/ConnectorType'
        - $ref: '#/components/parameters/OperationKind'
        - $ref: '#/components/parameters/Role'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Paged operation bindings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationBindingPage'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: createOperationBinding
      summary: Create an operation binding
      description: |
        Creates a source or destination operation binding. A source READ binding can later be
        paired with a destination WRITE binding in a route, optionally with a transformation
        between their resource descriptors.
      tags: [OperationBindings]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OperationBindingCreateRequest'
      responses:
        '201':
          description: Operation binding created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationBinding'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /operation/bindings/{bindingId}:
    get:
      operationId: getOperationBinding
      summary: Get an operation binding
      description: |
        Reads one operation binding, including connector-local operation name, protocol, request
        and response descriptors, transformation reference, delivery settings, and egress policy.
      tags: [OperationBindings]
      parameters:
        - $ref: '#/components/parameters/BindingId'
      responses:
        '200':
          description: Operation binding.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationBinding'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: updateOperationBinding
      summary: Update an operation binding
      description: |
        Updates an operation binding without changing unrelated connector or resource descriptor
        state. Use this for contract changes, renamed operation ids, updated delivery policies,
        or new transformation references.
      tags: [OperationBindings]
      parameters:
        - $ref: '#/components/parameters/BindingId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OperationBindingUpdateRequest'
      responses:
        '200':
          description: Operation binding updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationBinding'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: deleteOperationBinding
      summary: Delete an operation binding
      description: |
        Deletes an operation binding. Implementations should reject deletion while active routes
        still depend on the binding, or require those routes to be updated first.
      tags: [OperationBindings]
      parameters:
        - $ref: '#/components/parameters/BindingId'
      responses:
        '204':
          description: Operation binding deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /semantic/bindings:
    get:
      operationId: listSemanticConnectorBindings
      summary: List semantic connector bindings
      description: |
        Lists semantic bindings for connector resources and fields. These bindings let the platform
        understand that an external field represents an employee email, SSN, customer id, supplier
        relationship, policy classification, or other semantic concept.
      tags: [SemanticBindings]
      parameters:
        - $ref: '#/components/parameters/ConnectorType'
        - $ref: '#/components/parameters/ResourceKind'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Paged semantic connector bindings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SemanticConnectorBindingPage'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: createSemanticConnectorBinding
      summary: Create a semantic connector binding
      description: |
        Creates a semantic binding for a connector resource or field. This is the link that allows
        validation, documentation, mapping, and future policy checks to reason over external data
        using the same semantic model as credential designs, forms, parties, and relationships.
      tags: [SemanticBindings]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SemanticConnectorBindingCreateRequest'
      responses:
        '201':
          description: Semantic connector binding created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SemanticConnectorBinding'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /invocation/bindings:
    get:
      operationId: listConnectorInvocationBindings
      summary: List connector invocation bindings
      description: |
        Lists persisted invocation bindings that connect product or protocol lifecycle stages to
        connector routes, operations, logical connection bindings, subset mappings, governance, and
        execution policies. These records are the registry surface used when an issuer, verifier,
        form, portal, or workflow needs a durable connector action at a named stage.
      tags: [ConnectorInvocationBindings]
      parameters:
        - name: ownerSurface
          in: query
          required: false
          description: Filter by the product or protocol surface that owns the invocation.
          schema:
            $ref: '#/components/schemas/ConnectorOwnerSurface'
          example: OID4VCI
        - name: ownerReference
          in: query
          required: false
          description: Filter by owner-specific reference, such as issuer configuration id, verifier profile id, form id, or workflow id.
          schema:
            type: string
          example: issuer-config-1
        - name: stage
          in: query
          required: false
          description: Filter by product or protocol lifecycle stage.
          schema:
            $ref: '#/components/schemas/ConnectorInvocationStage'
          example: OID4VCI_CREDENTIAL_REQUEST
        - name: role
          in: query
          required: false
          description: Filter by the connector's invocation role at the lifecycle stage.
          schema:
            $ref: '#/components/schemas/ConnectorInvocationRole'
          example: VAULT_RETENTION
        - name: logicalConnectionBindingId
          in: query
          required: false
          description: Filter by logical connection binding used by the invocation.
          schema:
            $ref: '#/components/schemas/LogicalConnectionBindingId'
          example: brand-a-proof-vault
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Paged connector invocation bindings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectorInvocationBindingPage'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: createConnectorInvocationBinding
      summary: Create a connector invocation binding
      description: |
        Creates or replaces a durable invocation binding for a product or protocol lifecycle stage.
        The stored binding carries the physical or logical connector target, subset mapping,
        governance metadata, Party anchors, materialization policy, and execution policy that the
        runtime will attach to resulting connector runs.
      tags: [ConnectorInvocationBindings]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConnectorInvocationBindingCreateRequest'
      responses:
        '201':
          description: Connector invocation binding created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectorInvocationBinding'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /invocation/bindings/{invocationBindingId}:
    get:
      operationId: getConnectorInvocationBinding
      summary: Get a connector invocation binding
      description: Reads one persisted invocation binding by id.
      tags: [ConnectorInvocationBindings]
      parameters:
        - $ref: '#/components/parameters/InvocationBindingId'
      responses:
        '200':
          description: Connector invocation binding.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectorInvocationBinding'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /logical/bindings:
    get:
      operationId: listLogicalConnectionBindings
      summary: List logical connection bindings
      description: |
        Lists logical usage bindings for physical connector instances. Logical bindings let one
        connector instance be safely reused across tenants, organization units, brands, legal
        entities, channels, and caller contexts while keeping discriminator, auth overlay,
        governance, and catalog projection metadata explicit.
      tags: [LogicalConnectionBindings]
      parameters:
        - name: physicalConnectorInstanceId
          in: query
          required: false
          description: Filter by the physical connector instance backing the logical binding.
          schema:
            $ref: '#/components/schemas/ConnectorInstanceId'
          example: 8a7f09af-7ac9-4d96-91f9-a2a252f4aa4b
        - name: organizationUnitId
          in: query
          required: false
          description: Filter by organization unit in the logical context.
          schema:
            type: string
          example: nl-ops
        - name: brandId
          in: query
          required: false
          description: Filter by brand in the logical context.
          schema:
            type: string
          example: brand-a
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Paged logical connection bindings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogicalConnectionBindingPage'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: createLogicalConnectionBinding
      summary: Create a logical connection binding
      description: |
        Creates or replaces a logical connection binding for a physical connector instance. Use this
        resource to declare tenant, OU, brand, channel, caller, auth overlay, grant, governance, and
        system-catalog projection metadata without duplicating the physical connector registration.
      tags: [LogicalConnectionBindings]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogicalConnectionBindingCreateRequest'
      responses:
        '201':
          description: Logical connection binding created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogicalConnectionBinding'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /logical/bindings/{logicalConnectionBindingId}:
    get:
      operationId: getLogicalConnectionBinding
      summary: Get a logical connection binding
      description: Reads one logical connection binding by id.
      tags: [LogicalConnectionBindings]
      parameters:
        - $ref: '#/components/parameters/LogicalConnectionBindingId'
      responses:
        '200':
          description: Logical connection binding.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogicalConnectionBinding'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /route/exposures:
    get:
      operationId: listRouteExposureDescriptors
      summary: List route exposure descriptors
      description: |
        Lists externally callable route exposure descriptors. Exposure descriptors are registry
        records for external read/write capabilities, including accepted auth methods, caller Party
        and relationship constraints, schemas, subset mapping, payload/rate limits, and audit category.
      tags: [RouteExposures]
      parameters:
        - name: logicalConnectionBindingId
          in: query
          required: false
          description: Filter by logical connection binding backing the exposed capability.
          schema:
            $ref: '#/components/schemas/LogicalConnectionBindingId'
          example: brand-a-proof-vault
        - name: exchangeMode
          in: query
          required: false
          description: Filter by the route exposure exchange quadrant.
          schema:
            $ref: '#/components/schemas/ConnectorExchangeMode'
          example: EXTERNALLY_INITIATED_READ
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Paged route exposure descriptors.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RouteExposureDescriptorPage'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: createRouteExposureDescriptor
      summary: Create a route exposure descriptor
      description: |
        Creates or replaces a route exposure descriptor for an externally initiated connector
        capability. This registers the externally callable surface but does not by itself implement
        the runtime endpoint for the external caller.
      tags: [RouteExposures]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RouteExposureDescriptorCreateRequest'
      responses:
        '201':
          description: Route exposure descriptor created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RouteExposureDescriptor'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /route/exposures/{exposureDescriptorId}:
    get:
      operationId: getRouteExposureDescriptor
      summary: Get a route exposure descriptor
      description: Reads one route exposure descriptor by id.
      tags: [RouteExposures]
      parameters:
        - $ref: '#/components/parameters/ExposureDescriptorId'
      responses:
        '200':
          description: Route exposure descriptor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RouteExposureDescriptor'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /route/exposures/{exposureDescriptorId}/grants:
    post:
      operationId: createRouteExposureGrant
      summary: Create a route exposure grant
      tags: [RouteExposures]
      parameters:
        - $ref: '#/components/parameters/ExposureDescriptorId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RouteExposureGrantCreateRequest'
      responses:
        '201':
          description: Route exposure grant created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RouteExposureGrant'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
    get:
      operationId: listRouteExposureGrants
      summary: List route exposure grants
      tags: [RouteExposures]
      parameters:
        - $ref: '#/components/parameters/ExposureDescriptorId'
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/RouteExposureGrantStatus'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Paged route exposure grants.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RouteExposureGrantPage'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /route/exposures/{exposureDescriptorId}/grants/{grantId}:
    get:
      operationId: getRouteExposureGrant
      summary: Get a route exposure grant
      tags: [RouteExposures]
      parameters:
        - $ref: '#/components/parameters/ExposureDescriptorId'
        - $ref: '#/components/parameters/RouteExposureGrantId'
      responses:
        '200':
          description: Route exposure grant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RouteExposureGrant'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /route/exposures/{exposureDescriptorId}/read:
    post:
      operationId: executeRouteExposureRead
      summary: Execute an externally initiated route exposure read
      description: |
        Executes an explicitly registered external-read route exposure. The caller supplies the
        authenticated Party context, governed canonical fields already eligible for projection,
        governance metadata and optional cursor state. VDX evaluates policy server-side before
        any grant or throttle consumption. The response is an
        approved governed view with manifest, policy lineage, selected fields, and cursor state.
        This endpoint does not expose internal connector records, Party tables, vault rows, or
        semantic stores directly.
      tags: [RouteExposures]
      parameters:
        - $ref: '#/components/parameters/ExposureDescriptorId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RouteExposureExternalReadRequest'
      responses:
        '200':
          description: Governed external-read view.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectorExternalReadResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /route/exposures/{exposureDescriptorId}/write:
    post:
      operationId: executeRouteExposureWrite
      summary: Execute an externally initiated route exposure write
      description: |
        Executes an explicitly registered external-write route exposure. The caller supplies the
        authenticated Party context, governed payload envelope, field mappings, governance metadata,
        governance metadata, optional idempotency key, and optional Party projection candidates.
        VDX evaluates policy server-side before any grant or throttle consumption. The
        response is an accepted, minimized, redacted, quarantined, or rejected governed-ingress
        receipt with canonical-field mapping, projection-candidate ids, policy lineage, idempotency
        result, payload hash, and later-use availability scope.
      tags: [RouteExposures]
      parameters:
        - $ref: '#/components/parameters/ExposureDescriptorId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RouteExposureExternalWriteRequest'
      responses:
        '200':
          description: Governed external-write receipt.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectorExternalWriteReceipt'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /data/products:
    get:
      operationId: listDataProductDescriptors
      summary: List connector data product descriptors
      description: |
        Lists connector data product descriptors. These registry records connect a logical binding
        and physical connector instance to dataset resource descriptors, selected field scopes,
        transfer types, provider and consumer Party references, governance scope, and catalog offer
        references. This is the Phase 5 dataspace/data-use-contract readiness surface; it does not
        implement DSP/DCAT runtime behavior by itself.
      tags: [ConnectorDataProducts]
      parameters:
        - name: logicalConnectionBindingId
          in: query
          required: false
          description: Filter by logical connection binding backing the data product.
          schema:
            $ref: '#/components/schemas/LogicalConnectionBindingId'
          example: brand-a-proof-vault
        - name: physicalConnectorInstanceId
          in: query
          required: false
          description: Filter by the physical connector instance backing the data product.
          schema:
            $ref: '#/components/schemas/ConnectorInstanceId'
          example: 8a7f09af-7ac9-4d96-91f9-a2a252f4aa4b
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Paged connector data product descriptors.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectorDataProductDescriptorPage'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: createDataProductDescriptor
      summary: Create a connector data product descriptor
      description: |
        Creates or replaces a connector data product descriptor. The descriptor must reference an
        existing logical connection binding, matching physical connector instance, known dataset
        resource descriptors, at least one transfer type, and at least one catalog offer policy ref.
      tags: [ConnectorDataProducts]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConnectorDataProductDescriptorCreateRequest'
      responses:
        '201':
          description: Connector data product descriptor created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectorDataProductDescriptor'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /data/products/{dataProductId}:
    get:
      operationId: getDataProductDescriptor
      summary: Get a connector data product descriptor
      description: Reads one connector data product descriptor by id.
      tags: [ConnectorDataProducts]
      parameters:
        - $ref: '#/components/parameters/DataProductId'
      responses:
        '200':
          description: Connector data product descriptor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectorDataProductDescriptor'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /transformations:
    get:
      operationId: listTransformations
      summary: List transformations
      description: |
        Lists reusable transformations between resource descriptors. Transformations can represent
        existing attribute mappers, expression-based mappings, template mappings, redaction steps,
        lookup steps, or future workflow-specific transformation engines.
      tags: [Transformations]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - name: language
          in: query
          required: false
          description: Filter by transformation language.
          schema:
            $ref: '#/components/schemas/TransformationLanguage'
          example: ATTRIBUTE_MAPPER
        - name: sourceDescriptorId
          in: query
          required: false
          description: Filter by source resource descriptor id.
          schema:
            $ref: '#/components/schemas/ResourceDescriptorId'
          example: 41436f49-040c-4f5f-9c7f-657f43762e2b
        - name: targetDescriptorId
          in: query
          required: false
          description: Filter by target resource descriptor id.
          schema:
            $ref: '#/components/schemas/ResourceDescriptorId'
          example: 7a44f0de-e4d9-44ef-9211-372433933a88
      responses:
        '200':
          description: Paged transformations.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransformationPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: createTransformation
      summary: Create a transformation
      description: |
        Creates a transformation definition. Use this when a route must map a source representation
        to a destination representation, such as CSV employee rows to credential claims, REST HR
        profiles to invitation payloads, or OIDC claims to a semantic profile.
      tags: [Transformations]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransformationCreateRequest'
      responses:
        '201':
          description: Transformation created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransformationDefinition'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /transformations/{transformationId}:
    get:
      operationId: getTransformation
      summary: Get a transformation
      description: |
        Reads one transformation definition, including source and target descriptors, step-based
        mappings, expression text, and metadata used by the runtime mapper.
      tags: [Transformations]
      parameters:
        - $ref: '#/components/parameters/TransformationId'
      responses:
        '200':
          description: Transformation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransformationDefinition'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: updateTransformation
      summary: Update a transformation
      description: |
        Updates transformation metadata, descriptor references, steps, or expression text. Route
        implementations should version or snapshot transformations when repeatable historical
        execution is required.
      tags: [Transformations]
      parameters:
        - $ref: '#/components/parameters/TransformationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransformationUpdateRequest'
      responses:
        '200':
          description: Transformation updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransformationDefinition'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /routes:
    get:
      operationId: listConnectorRoutes
      summary: List connector routes
      description: |
        Lists routes that compose source bindings, destination bindings, optional transformations,
        triggers, delivery policy, materialization policy, and atomicity. Routes are the durable
        registry shape for import/export, issuance enrichment, form capture, and workflow
        data movement.
      tags: [Routes]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Paged connector routes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectorRoutePage'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: createConnectorRoute
      summary: Create a connector route
      description: |
        Creates a route from one or more source operation bindings to one or more destination operation bindings.
        The route can be on-demand, scheduled, event-triggered, webhook-triggered, or started by a
        higher-level platform pipeline.
      tags: [Routes]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConnectorRouteCreateRequest'
      responses:
        '201':
          description: Connector route created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectorRoute'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /routes/{routeId}:
    get:
      operationId: getConnectorRoute
      summary: Get a connector route
      description: |
        Reads one route definition. Use this before starting a run when a UI or orchestrator needs
        to show the effective source, destination, transformation, trigger, materialization, and
        atomicity policy.
      tags: [Routes]
      parameters:
        - $ref: '#/components/parameters/RouteId'
      responses:
        '200':
          description: Connector route.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectorRoute'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: updateConnectorRoute
      summary: Update a connector route
      description: |
        Updates a route definition. Implementations should avoid mutating routes that are currently
        running unless they snapshot the effective route definition into each run.
      tags: [Routes]
      parameters:
        - $ref: '#/components/parameters/RouteId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConnectorRouteUpdateRequest'
      responses:
        '200':
          description: Connector route updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectorRoute'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: deleteConnectorRoute
      summary: Delete a connector route
      description: |
        Deletes a route definition. Historical runs, events, and dead letters should remain subject
        to audit and retention policies even when the route definition is removed.
      tags: [Routes]
      parameters:
        - $ref: '#/components/parameters/RouteId'
      responses:
        '204':
          description: Connector route deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /routes/{routeId}/runs:
    get:
      operationId: listConnectorRouteRuns
      summary: List connector route runs
      description: |
        Lists execution history for one connector route. Use this route-scoped view when a route
        detail screen or orchestrator needs only runs belonging to the selected route. Tenant-wide
        operational dashboards should use `/runs` and its filters.
      tags: [Runs]
      parameters:
        - $ref: '#/components/parameters/RouteId'
        - $ref: '#/components/parameters/ConnectorRunStatus'
        - $ref: '#/components/parameters/ConnectorInstanceIdQuery'
        - $ref: '#/components/parameters/InvocationBindingIdQuery'
        - $ref: '#/components/parameters/LogicalConnectionBindingIdQuery'
        - $ref: '#/components/parameters/PhysicalConnectorInstanceIdQuery'
        - $ref: '#/components/parameters/ConnectorExchangeModeQuery'
        - $ref: '#/components/parameters/ProtocolSurfaceQuery'
        - $ref: '#/components/parameters/CorrelationIdQuery'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Paged connector runs for the route.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectorRunPage'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      operationId: createConnectorRouteRun
      summary: Start a connector route run
      description: |
        Starts a route run and returns the accepted execution record. The optional input can carry
        lookup keys, batch references, dry-run flags, or caller metadata. Long-running execution is
        observed through the runs, events, and dead-letter endpoints.
      tags: [Runs]
      parameters:
        - $ref: '#/components/parameters/RouteId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartConnectorRouteRunRequest'
      responses:
        '202':
          description: Connector route run accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectorRun'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /runs:
    get:
      operationId: listConnectorRuns
      summary: List connector runs
      description: |
        Lists route and operation runs across the tenant. Use this direct tenant-wide run resource
        for operational dashboards, customer support, audit trails, retry decisions, and monitoring
        failed or partially failed imports and exports. Use `/routes/{routeId}/runs` for
        route-scoped history.
      tags: [Runs]
      parameters:
        - $ref: '#/components/parameters/ConnectorRunStatus'
        - $ref: '#/components/parameters/RouteIdQuery'
        - $ref: '#/components/parameters/ConnectorInstanceIdQuery'
        - $ref: '#/components/parameters/InvocationBindingIdQuery'
        - $ref: '#/components/parameters/LogicalConnectionBindingIdQuery'
        - $ref: '#/components/parameters/PhysicalConnectorInstanceIdQuery'
        - $ref: '#/components/parameters/ConnectorExchangeModeQuery'
        - $ref: '#/components/parameters/ProtocolSurfaceQuery'
        - $ref: '#/components/parameters/CorrelationIdQuery'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Paged connector runs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectorRunPage'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /runs/{runId}:
    get:
      operationId: getConnectorRun
      summary: Get a connector run
      description: |
        Reads one connector execution record, including status, timestamps, counts, correlation id,
        and error summary. Detailed logs are exposed as run events.
      tags: [Runs]
      parameters:
        - $ref: '#/components/parameters/RunId'
      responses:
        '200':
          description: Connector run.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectorRun'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /runs/{runId}/events:
    get:
      operationId: listConnectorRunEvents
      summary: List connector run events
      description: |
        Lists timestamped run events emitted by the connector runtime. Events should contain enough
        detail for support and audit without embedding sensitive payloads unless policy permits it.
      tags: [Runs]
      parameters:
        - $ref: '#/components/parameters/RunId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Paged connector run events.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectorRunEventPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /runs/{runId}/deadletters:
    get:
      operationId: listConnectorDeadLetters
      summary: List connector dead letters
      description: |
        Lists failed items captured for a run after validation, transformation, or destination
        delivery failure. Dead letters should reference retained payloads rather than embedding
        them by default so retention and sensitivity policy can control access.
      tags: [Runs]
      parameters:
        - $ref: '#/components/parameters/RunId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Paged connector dead letters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectorDeadLetterPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Bearer JWT token. Tenant context is resolved from this token.
  responses:
    ValidationError:
      description: Validation error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Authentication is required.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: The caller is authenticated but not authorized for this connector operation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: The requested resource was not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  parameters:
    Page:
      name: page
      in: query
      description: Zero-based page index.
      schema:
        type: integer
        minimum: 0
        default: 0
    Size:
      name: size
      in: query
      description: Page size.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    ConnectorInstanceId:
      name: connectorInstanceId
      in: path
      description: Stable identifier of the configured connector instance. This is not the Party id; the connector instance has its own id and points at its backing Party.
      required: true
      schema:
        $ref: '#/components/schemas/ConnectorInstanceId'
      example: 3f6f4f46-24fb-4c35-a7a4-bc6c7f7861f5
    IdentityId:
      name: identityId
      in: path
      description: Stable Identity id assigned to the connector Party. Identifiers remain nested under the Identity.
      required: true
      schema:
        $ref: '#/components/schemas/IdentityId'
      example: 3a5cf979-2d89-4057-a721-c7ab884f0c68
    ResourceDescriptorId:
      name: resourceDescriptorId
      in: path
      description: Stable identifier of the resource descriptor that describes the shape, representation, and semantic meaning of a connector resource.
      required: true
      schema:
        $ref: '#/components/schemas/ResourceDescriptorId'
      example: 41436f49-040c-4f5f-9c7f-657f43762e2b
    BindingId:
      name: bindingId
      in: path
      description: Stable identifier of an operation binding, such as a configured source read or destination write operation.
      required: true
      schema:
        $ref: '#/components/schemas/OperationBindingId'
      example: 2777417e-82ce-4d3e-b96c-94e00a4d9a93
    TransformationId:
      name: transformationId
      in: path
      description: Stable identifier of a reusable transformation between resource descriptors.
      required: true
      schema:
        $ref: '#/components/schemas/TransformationId'
      example: 0e60abcc-41b5-4cc5-bec2-f0047f129341
    RouteId:
      name: routeId
      in: path
      description: Stable identifier of a connector route that composes a source operation, destination operation, optional transformation, and trigger policy.
      required: true
      schema:
        $ref: '#/components/schemas/ConnectorRouteId'
      example: 1e8ff011-2274-4f16-a7dd-bf0b4fd5262f
    RunId:
      name: runId
      in: path
      description: Stable identifier of a connector route or operation execution.
      required: true
      schema:
        $ref: '#/components/schemas/ConnectorRunId'
      example: 9a785884-63ea-4b07-9976-264a1fc595f1
    InvocationBindingId:
      name: invocationBindingId
      in: path
      description: Stable identifier of a connector invocation binding.
      required: true
      schema:
        $ref: '#/components/schemas/ConnectorInvocationBindingId'
      example: issuer-config-1:post-issuance:proof-vault
    LogicalConnectionBindingId:
      name: logicalConnectionBindingId
      in: path
      description: Stable identifier of a logical connection binding.
      required: true
      schema:
        $ref: '#/components/schemas/LogicalConnectionBindingId'
      example: brand-a-proof-vault
    ExposureDescriptorId:
      name: exposureDescriptorId
      in: path
      description: Stable identifier of a route exposure descriptor.
      required: true
      schema:
        $ref: '#/components/schemas/RouteExposureDescriptorId'
    RouteExposureGrantId:
      name: grantId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/RouteExposureGrantId'
      example: proof-vault-read-exposure
    DataProductId:
      name: dataProductId
      in: path
      description: Stable identifier of a connector data product descriptor.
      required: true
      schema:
        $ref: '#/components/schemas/ConnectorDataProductId'
      example: dp-proof-status
    Role:
      name: role
      in: query
      description: Filters connectors or attached resources by data-flow role.
      required: false
      schema:
        $ref: '#/components/schemas/DataFlowRole'
      example: SOURCE
    OperationKind:
      name: operationKind
      in: query
      description: Filters by the logical operation taxonomy, independent of the transport-specific operation name.
      required: false
      schema:
        $ref: '#/components/schemas/OperationKind'
      example: READ
    ResourceKind:
      name: resourceKind
      in: query
      description: Filters by logical resource kind. This does not imply a transport or serialization format.
      required: false
      schema:
        $ref: '#/components/schemas/ResourceKind'
      example: TABULAR
    ConnectorType:
      name: connectorType
      in: query
      description: Filters by extensible connector runtime family, for example http.openapi, sql.postgresql, identity.oidc, storage.vault, storage.blob, interaction.form, or internal.party-semantic-store. CSV remains a representation kind, not a connector type.
      required: false
      schema:
        $ref: '#/components/schemas/ConnectorType'
      example: http.openapi
    ConnectorRunStatus:
      name: status
      in: query
      description: Filters connector executions by lifecycle status.
      required: false
      schema:
        $ref: '#/components/schemas/ConnectorRunStatus'
      example: FAILED
    RouteIdQuery:
      name: routeId
      in: query
      description: Filters connector executions by route id.
      required: false
      schema:
        $ref: '#/components/schemas/ConnectorRouteId'
      example: 1e8ff011-2274-4f16-a7dd-bf0b4fd5262f
    ConnectorInstanceIdQuery:
      name: connectorInstanceId
      in: query
      description: Filters connector executions by the registry connector instance id.
      required: false
      schema:
        $ref: '#/components/schemas/ConnectorInstanceId'
      example: 3f6f4f46-24fb-4c35-a7a4-bc6c7f7861f5
    InvocationBindingIdQuery:
      name: invocationBindingId
      in: query
      description: Filters connector executions by Phase 5 invocation binding lineage.
      required: false
      schema:
        $ref: '#/components/schemas/ConnectorInvocationBindingId'
      example: issuer-config-1:post-issuance:proof-vault
    LogicalConnectionBindingIdQuery:
      name: logicalConnectionBindingId
      in: query
      description: Filters connector executions by logical connection binding lineage.
      required: false
      schema:
        $ref: '#/components/schemas/LogicalConnectionBindingId'
      example: brand-a-proof-vault
    PhysicalConnectorInstanceIdQuery:
      name: physicalConnectorInstanceId
      in: query
      description: Filters connector executions by physical connector instance lineage.
      required: false
      schema:
        $ref: '#/components/schemas/ConnectorInstanceId'
      example: 3f6f4f46-24fb-4c35-a7a4-bc6c7f7861f5
    ConnectorExchangeModeQuery:
      name: exchangeMode
      in: query
      description: Filters connector executions by the Phase 5 data-direction and initiation-side quadrant.
      required: false
      schema:
        $ref: '#/components/schemas/ConnectorExchangeMode'
      example: PLATFORM_INITIATED_PUSH
    ProtocolSurfaceQuery:
      name: protocolSurface
      in: query
      description: Filters connector executions by the product, protocol, form, portal, workflow, or application surface that initiated the run.
      required: false
      schema:
        $ref: '#/components/schemas/ConnectorOwnerSurface'
      example: OID4VCI
    CorrelationIdQuery:
      name: correlationId
      in: query
      description: Filters connector executions by durable route-run correlation id.
      required: false
      schema:
        type: string
      example: route-correlation-1

  schemas:
    ApiError:
      type: object
      description: Stable, machine-readable error body content.
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: Stable, machine-readable error category.
          example: VALIDATION_ERROR
        message:
          type: string
          description: Human-readable error message.
          example: Request validation failed.
        details:
          type: object
          additionalProperties: true
          description: Additional error context or field-level details.
    ErrorResponse:
      type: object
      description: Standard error envelope.
      required:
        - error
      properties:
        error:
          $ref: '#/components/schemas/ApiError'
    ConnectorInstanceId:
      type: string
      format: uuid
      description: Stable platform identifier for a configured connector instance.
      example: 3f6f4f46-24fb-4c35-a7a4-bc6c7f7861f5
    ConnectorPartyId:
      type: string
      format: uuid
      description: Party identifier assigned to the connector instance.
      example: f9c97b4e-e756-4b70-b230-6f1d9f81b426
    PartyId:
      type: string
      format: uuid
      description: Existing Party model identifier.
      example: 7f23f56e-c24d-4cbe-839d-5fc09048a851
    IdentityId:
      type: string
      format: uuid
      description: Existing Identity model identifier.
      example: 3a5cf979-2d89-4057-a721-c7ab884f0c68
    IdentifierId:
      type: string
      format: uuid
      description: Existing Identifier model identifier.
      example: 6b1c4c89-dfe0-4ce2-b8a4-2e1d57343a6c
    ResourceDescriptorId:
      type: string
      format: uuid
      description: Stable identifier for a described external or internal resource shape.
      example: 41436f49-040c-4f5f-9c7f-657f43762e2b
    ConnectorId:
      type: string
      minLength: 1
      description: Stable identifier for a connector instance.
      example: connector-workday-acme
    FieldDescriptorId:
      type: string
      format: uuid
      description: Stable identifier for a field within a resource descriptor.
      example: f00b9edc-5498-483f-9b91-a42ef080b909
    ConnectorResourceId:
      type: string
      format: uuid
      description: Stable identifier for a resource attached to a connector instance.
      example: b4cf21b1-0292-4803-8d32-9ebf9f5359a2
    OperationBindingId:
      type: string
      format: uuid
      description: Stable identifier for a connector operation binding.
      example: 2777417e-82ce-4d3e-b96c-94e00a4d9a93
    SemanticBindingId:
      type: string
      format: uuid
      description: Stable identifier for a semantic binding between resource data and VDX semantics.
      example: 20392e94-3b35-4a77-afc2-5e552a0a4023
    TransformationId:
      type: string
      format: uuid
      description: Stable identifier for a transformation definition.
      example: 0e60abcc-41b5-4cc5-bec2-f0047f129341
    ConnectorRouteId:
      type: string
      format: uuid
      description: Stable identifier for a connector route.
      example: 1e8ff011-2274-4f16-a7dd-bf0b4fd5262f
    ConnectorRunId:
      type: string
      format: uuid
      description: Stable identifier for a connector route or operation run.
      example: 9a785884-63ea-4b07-9976-264a1fc595f1
    ConnectorInvocationBindingId:
      type: string
      description: Stable identifier of the domain invocation binding that caused a connector call.
      example: issuer-config-1:post-issuance:proof-vault
    ConnectorInvocationId:
      type: string
      minLength: 1
      description: Stable identifier of one connector invocation stream and its cancellation operation.
      example: invocation-01JZZZZZZZZZZZZZZZZZZZZZZZ
    LogicalConnectionBindingId:
      type: string
      description: Stable identifier of a tenant, OU, brand, legal-entity, or channel usage binding for a physical connector instance.
      example: brand-a-proof-vault
    RouteExposureDescriptorId:
      type: string
      description: Stable identifier of an externally callable route exposure descriptor.
      example: proof-vault-read-exposure
    RouteExposureGrantId:
      type: string
      description: Stable identifier of a route exposure grant.
      example: grant-proof-vault-reader
    ConnectorDataProductId:
      type: string
      description: Stable identifier of a connector data product descriptor.
      example: dp-proof-status
    ConnectorType:
      type: string
      description: Extensible connector family identifier. This names the connector implementation or adapter family, not the transport, resource kind, or representation.
      example: http.openapi
    TenantId:
      type: string
      description: Tenant identifier used by tenant-scoped connector registration, routing, and execution.
      example: acme

    DataFlowRole:
      type: string
      description: How a connector participates in data movement. Use SOURCE for reads and DESTINATION for writes. Connectors that support both roles declare both values in supportedRoles.
      enum:
        - SOURCE
        - DESTINATION
        - PROCESSOR
      example: SOURCE
    ConnectorLifecycleStatus:
      type: string
      description: Lifecycle state shared by connector instances and runtime registrations.
      enum:
        - ACTIVE
        - STALE
        - RETIRED
      example: ACTIVE
    ConnectorManagementMode:
      type: string
      description: Indicates whether the platform manages connector runtime/configuration or references an externally managed system. Runtime placement is described separately by executionTier.
      enum:
        - MANAGED
        - EXTERNAL
      example: EXTERNAL
    ConnectorExecutionTier:
      type: string
      description: Indicates where execution happens when a connector operation is invoked.
      enum:
        - HOSTED
        - REMOTE
      example: REMOTE
    ConnectorInteractionPattern:
      type: string
      description: Shape of request and response traffic supported by a connector descriptor.
      enum:
        - UNARY
        - SERVER_STREAM
        - CLIENT_STREAM
        - BIDIRECTIONAL_STREAM
        - SUBSCRIPTION
      example: SERVER_STREAM
    ConnectorExchangeMode:
      type: string
      description: Explicit exchange quadrant. Data direction and initiation side remain separate axes in run responses.
      enum:
        - PLATFORM_INITIATED_PULL
        - PLATFORM_INITIATED_PUSH
        - EXTERNALLY_INITIATED_READ
        - EXTERNALLY_INITIATED_WRITE
        - SUBSCRIPTION_CALLBACK
        - BIDIRECTIONAL_SYNC
      example: PLATFORM_INITIATED_PUSH
    ConnectorDataDirection:
      type: string
      description: Direction of data movement relative to the platform operating the connector.
      enum:
        - INBOUND
        - OUTBOUND
        - BIDIRECTIONAL
      example: OUTBOUND
    ConnectorInitiationSide:
      type: string
      description: Side that initiated the exchange.
      enum:
        - PLATFORM
        - EXTERNAL
        - SUBSCRIPTION_CALLBACK
        - BIDIRECTIONAL_SYNC
      example: PLATFORM
    ConnectorOwnerSurface:
      type: string
      description: Product, protocol, form, portal, workflow, or application surface that owns a connector invocation binding.
      enum:
        - OID4VCI
        - OID4VP
        - FORM
        - PORTAL
        - WORKFLOW
        - APPLICATION
      example: OID4VCI
    ConnectorInvocationStage:
      type: string
      description: Product or protocol lifecycle stage at which a connector invocation can run.
      enum:
        - OID4VCI_START
        - OID4VCI_AUTHORIZATION
        - OID4VCI_PRE_AUTHORIZED
        - OID4VCI_TOKEN
        - OID4VCI_CREDENTIAL_REQUEST
        - OID4VCI_DEFERRED
        - OID4VCI_PRE_ISSUE
        - OID4VCI_POST_ISSUANCE
        - OID4VCI_NOTIFICATION_RECEIPT
        - OID4VP_AFTER_VALIDATION
        - OID4VP_PRE_REQUEST_ENRICHMENT
        - FORM_LIFECYCLE
        - FORM_ACTION_START
        - FORM_ACTION_COMPLETE
        - FORM_FIELD_LOOKUP
        - FORM_SUBMIT
        - PORTAL_FLOW
        - WORKFLOW_STEP_EXECUTION
      example: OID4VCI_CREDENTIAL_REQUEST
    ConnectorInvocationRole:
      type: string
      description: Role the connector performs for a lifecycle invocation.
      enum:
        - ENRICHMENT_SOURCE
        - EXPORT_DESTINATION
        - VAULT_RETENTION
        - NOTIFICATION
        - BIDIRECTIONAL_SYNC
        - ROUTE_ORCHESTRATION
      example: VAULT_RETENTION
    ConnectorExecutionTiming:
      type: string
      description: Timing contract for connector invocation execution.
      enum:
        - INLINE_REQUIRED
        - INLINE_OPTIONAL
        - DEFERRED_ASYNC
        - DURABLE_OUTBOX
      example: INLINE_REQUIRED
    ConnectorFailureEffect:
      type: string
      description: How connector invocation failure affects the owning protocol, form, portal, or workflow.
      enum:
        - FAIL_PROTOCOL
        - CONTINUE_WITHOUT_EFFECT
        - DEAD_LETTER
        - QUARANTINE
        - RETRY_ONLY
      example: FAIL_PROTOCOL
    ConnectorDiscriminatorSource:
      type: string
      description: Source of a logical connection discriminator value.
      enum:
        - LOGICAL_CONTEXT
        - AUTHENTICATED_CONTEXT
        - PAYLOAD_FIELD
        - STATIC_VALUE
      example: LOGICAL_CONTEXT
    ConnectorDiscriminatorPlacement:
      type: string
      description: Where a logical connection discriminator is applied to an outbound connector request.
      enum:
        - HEADER
        - QUERY
        - BODY_FIELD
        - CONFIG
        - METADATA
      example: HEADER
    ConnectorAuthOverlayMode:
      type: string
      description: Authentication overlay mode for a logical connection binding.
      enum:
        - USE_PHYSICAL_BASE
        - TENANT_SECRET_ID
        - DELEGATED_OAUTH_CLIENT
        - MTLS_IDENTITY
        - CONNECTOR_CREDENTIAL_SELECTOR
      example: TENANT_SECRET_ID
    ConnectorDeploymentMode:
      type: string
      description: Deployment mode projected into the system catalog for a logical connection binding.
      enum:
        - MANAGED
        - EXTERNAL
        - HYBRID
      example: HYBRID
    ConnectorAuditCategory:
      type: string
      description: Audit category used by governed connector invocations, runs, and externally callable route exposures.
      enum:
        - PROTOCOL_ISSUANCE
        - PROTOCOL_VERIFICATION
        - FORM
        - PORTAL
        - WORKFLOW
        - DATASPACE
        - INDUSTRIAL
        - EXTERNAL_EXCHANGE
        - VAULT
        - SYSTEM_CATALOG
      example: EXTERNAL_EXCHANGE
    OperationKind:
      type: string
      description: Reusable operation taxonomy shared by connectors, inventory, policy, and workflows. The operation kind is logical; connector-local details live in operationName.
      enum:
        - READ
        - WRITE
        - UPDATE
        - DELETE
        - UPSERT
        - QUERY
        - SEARCH
        - IMPORT
        - EXPORT
        - INVOKE
        - DISCOVER
        - VALIDATE
      example: READ
    OperationTransferMode:
      type: string
      description: Transfer semantics for an operation binding. Streaming and batching are execution modes of a logical operation, not operation kinds.
      enum:
        - SINGLE
        - BATCH
        - STREAM
      default: SINGLE
      example: STREAM
    AccessProtocol:
      type: string
      description: "Transport or access protocol. This is intentionally separate from ResourceKind and RepresentationKind: for example, CSV data can be read over HTTPS, S3, SFTP, FILE, or VAULT."
      enum:
        - HTTP
        - HTTPS
        - WS
        - WSS
        - STDIO
        - JDBC
        - ODBC
        - SFTP
        - FILE
        - S3
        - AZURE_BLOB
        - GCS
        - KAFKA
        - AMQP
        - MQTT
        - OIDC
        - DIDCOMM
        - VAULT
        - INTERNAL
        - CUSTOM
      example: HTTPS
    ResourceKind:
      type: string
      description: Logical kind of resource being accessed, independent of transport and serialization. For example, a CSV file with rows is ResourceKind TABULAR and RepresentationKind CSV.
      enum:
        - OBJECT
        - TABULAR
        - DOCUMENT
        - CLAIM_SET
        - GRAPH
        - EVENT_STREAM
        - FILE
        - SECRET
        - CONFIGURATION
        - CREDENTIAL
        - PRESENTATION
        - CUSTOM
      example: TABULAR
    RepresentationKind:
      type: string
      description: Data representation or serialization format, independent of transport. This is the data shape on the wire or at rest, not the connector implementation.
      enum:
        - JSON
        - JSON_LD
        - XML
        - CSV
        - PARQUET
        - AVRO
        - RDF
        - JWT
        - SD_JWT
        - CBOR
        - BINARY
        - TEXT
        - CUSTOM
      example: CSV
    ShapeKind:
      type: string
      description: Type of structural shape information used to describe fields and validation rules for a resource.
      enum:
        - SCHEMA
        - OPENAPI_SCHEMA
        - JSON_SCHEMA
        - RDF_SHAPE
        - SQL_TABLE
        - CSV_HEADER
        - CLAIMS_SCHEMA
        - FREEFORM
      example: CSV_HEADER
    ContractKind:
      type: string
      description: Contract or schema source used to describe an external resource. Use this to point at OpenAPI documents, JSON Schema, SQL metadata, RDF shapes, CSV profiles, OIDC discovery, or custom contracts.
      enum:
        - OPENAPI
        - JSON_SCHEMA
        - SQL_SCHEMA
        - RDF_SCHEMA
        - CSV_PROFILE
        - OIDC_DISCOVERY
        - VAULT_POLICY
        - CUSTOM
      example: OPENAPI
    BindingDirection:
      type: string
      description: Direction of data movement represented by an operation binding.
      enum:
        - INBOUND
        - OUTBOUND
        - BIDIRECTIONAL
      example: INBOUND
    TransformationLanguage:
      type: string
      description: Transformation representation used by a transformation definition.
      enum:
        - ATTRIBUTE_MAPPER
        - JSONATA
        - JQ
        - CEL
        - SQL
        - TEMPLATE
        - CUSTOM
      example: ATTRIBUTE_MAPPER
    MaterializationMode:
      type: string
      description: How, if at all, connector data may be retained or projected into platform storage.
      enum:
        - NONE
        - CACHE
        - PERSIST
        - MIRROR
        - INDEX
      example: PERSIST
    ConnectorRunStatus:
      type: string
      description: Execution status of a route run or connector operation run.
      enum:
        - QUEUED
        - RUNNING
        - SUCCEEDED
        - FAILED
        - PARTIALLY_FAILED
        - CANCELLED
      example: SUCCEEDED
    RouteAtomicity:
      type: string
      description: Failure and rollback semantics expected for a route run.
      enum:
        - BEST_EFFORT
        - PER_RECORD
        - ALL_OR_NOTHING
      example: PER_RECORD
    DestinationDeliveryMode:
      type: string
      description: Delivery timing and batching behavior expected by a destination operation binding.
      enum:
        - SYNC
        - ASYNC
        - BATCH
        - STREAMING
      example: BATCH
    DestinationAckMode:
      type: string
      description: Acknowledgement level a destination must provide before the platform treats delivery as complete.
      enum:
        - NONE
        - ACCEPTED
        - COMMITTED
        - VERIFIED
      example: COMMITTED
    RetentionDeleteAction:
      type: string
      description: Action to apply when retention expires or deletion is required by policy.
      enum:
        - DELETE
        - ANONYMIZE
        - PSEUDONYMIZE
        - TOMBSTONE
        - REVIEW
      example: ANONYMIZE

    ConnectorTypeDescriptorKey:
      type: object
      description: Immutable identity of one connector type descriptor version.
      required: [scope, connectorTypeId, descriptorVersion]
      properties:
        scope:
          type: string
          minLength: 1
          example: tenant:acme
        connectorTypeId:
          $ref: '#/components/schemas/ConnectorType'
        descriptorVersion:
          type: string
          minLength: 1
          example: '2026-08-23'

    ConnectorTypeDescriptor:
      type: object
      description: Immutable, display-safe connector type metadata. A descriptor never contains instance configuration, credentials, or secret material.
      required: [descriptorKey, displayName, executionTier, interactionPatterns]
      properties:
        descriptorKey:
          $ref: '#/components/schemas/ConnectorTypeDescriptorKey'
        displayName:
          type: string
          minLength: 1
        description:
          type: string
        executionTier:
          $ref: '#/components/schemas/ConnectorExecutionTier'
        interactionPatterns:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: '#/components/schemas/ConnectorInteractionPattern'
        supportedRoles:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/DataFlowRole'
        supportedOperations:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/OperationKind'
        supportedAccessProtocols:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/AccessProtocol'
        metadata:
          $ref: '#/components/schemas/StringMap'

    ConnectorRuntimeRegistration:
      type: object
      description: Service-identity-authenticated runtime registration renewed by TTL heartbeat. Construction rejects endpoint user-info, query parameters, fragments, and credential-bearing routing metadata.
      required: [descriptorKey, runtimeId, executionTier, lifecycleStatus, heartbeatAt, leaseExpiresAt]
      properties:
        descriptorKey:
          $ref: '#/components/schemas/ConnectorTypeDescriptorKey'
        runtimeId:
          type: string
          minLength: 1
          example: llm-runtime-eu-1
        executionTier:
          $ref: '#/components/schemas/ConnectorExecutionTier'
        lifecycleStatus:
          $ref: '#/components/schemas/ConnectorLifecycleStatus'
        heartbeatAt:
          type: string
          format: date-time
        leaseExpiresAt:
          type: string
          format: date-time
        endpoints:
          type: array
          items:
            $ref: '#/components/schemas/ConnectorEndpoint'
        routingMetadata:
          type: object
          description: Display-safe routing labels only. Credential, secret, token, authorization, password, and key material is forbidden.
          additionalProperties:
            type: string
            maxLength: 256

    ConnectorInstanceCreateRequest:
      type: object
      description: Request to register a connector instance pinned to one immutable connector type descriptor version.
      required:
        - displayName
        - descriptorKey
        - supportedRoles
      properties:
        displayName:
          type: string
          minLength: 1
          description: Human-readable name shown in administrative UIs and audit trails.
          example: Workday employee profile API
        description:
          type: string
          description: Operational purpose of the connector instance.
          example: Reads employee profile attributes used for employee credential issuance.
        descriptorKey:
          $ref: '#/components/schemas/ConnectorTypeDescriptorKey'
        managementMode:
          $ref: '#/components/schemas/ConnectorManagementMode'
        executionTier:
          $ref: '#/components/schemas/ConnectorExecutionTier'
        supportedRoles:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: '#/components/schemas/DataFlowRole'
        supportedOperations:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/OperationKind'
        endpoints:
          type: array
          description: Runtime endpoints exposed or consumed by this connector instance.
          items:
