    Page:
      type: object
      description: Pagination metadata emitted with each paged response under the `pagination` property.
      required:
        - limit
        - offset
        - page
        - size
        - total
        - totalPages
        - hasMore
      properties:
        limit:
          type: integer
          description: Maximum number of records requested for this page.
          minimum: 0
          example: 20
        offset:
          type: integer
          description: Zero-based offset of the first record in this page.
          minimum: 0
          example: 0
        page:
          type: integer
          description: Zero-based page index derived from offset and limit.
          minimum: 0
          example: 0
        size:
          type: integer
          description: Effective page size.
          minimum: 0
          example: 20
        total:
          type: integer
          format: int64
          description: Total number of matching records.
          minimum: 0
          example: 1
        totalPages:
          type: integer
          description: Total number of available pages.
          minimum: 0
          example: 1
        hasMore:
          type: boolean
          description: Whether another page is available after this page.
          example: false
      example:
        limit: 20
        offset: 0
        page: 0
        size: 20
        total: 1
        totalPages: 1
        hasMore: false

    ConnectorIntegrityReference:
      type: object
      description: Integrity and evidence references carried with governed connector ingress, egress, and run lineage.
      properties:
        originalPayloadHash:
          type: string
          pattern: '^sha256:[0-9a-f]{64}$'
          example: sha256:1111111111111111111111111111111111111111111111111111111111111111
        canonicalPayloadHash:
          type: string
          pattern: '^sha256:[0-9a-f]{64}$'
          example: sha256:2222222222222222222222222222222222222222222222222222222222222222
        transformationHash:
          type: string
          pattern: '^sha256:[0-9a-f]{64}$'
          example: sha256:3333333333333333333333333333333333333333333333333333333333333333
        evidenceRef:
          type: string
          example: vault://evidence/connector-run-1
        vaultRef:
          type: string
          example: vault://proofs/proof-1
        signatureRef:
          type: string
          example: jades://signature-1
        sealRef:
          type: string
          example: seal://qualified-seal-1
        timestampRef:
          type: string
          example: timestamp://tsa-1
        sourceAuthenticityVerdict:
          type: string
          example: VERIFIED
        outputManifestHash:
          type: string
          pattern: '^sha256:[0-9a-f]{64}$'
          example: sha256:4444444444444444444444444444444444444444444444444444444444444444

    ConnectorGovernanceEnvelope:
      type: object
      description: Governance metadata attached to connector records, invocations, and runs before data crosses a protocol, form, vault, dataspace, or external-exchange boundary.
      properties:
        classification:
          type: string
          example: confidential
        sensitivity:
          type: string
          example: high
        specialCategory:
          type: boolean
          default: false
        legalBasis:
          type: string
          example: dpv:Contract
        purpose:
          type: string
          example: dpv:Audit
        b2bUsagePurpose:
          type: string
          description: B2B or dataspace usage purpose, separate from privacy legal basis and processing purpose.
          example: predictive-maintenance
        frameworkAgreementRef:
          type: string
          example: catena-x:framework:1
        contractReference:
          type: string
          example: agreement-2026-001
        minimizationStatus:
          type: string
          enum:
            - NOT_EVALUATED
            - MINIMIZED
            - REDACTED
            - FULL_DATASET
            - EXCESSIVE
          example: MINIMIZED
        retentionProfileId:
          type: string
          example: retention-proof
        retention:
          $ref: '#/components/schemas/RetentionSpec'
        crossBorderRestriction:
          type: string
          enum:
            - NONE
            - SAME_COUNTRY
            - EEA_ONLY
            - APPROVED_COUNTRIES
            - CONTRACT_REQUIRED
            - BLOCKED
          example: EEA_ONLY
        encryptionRequirement:
          type: string
          enum:
            - NONE
            - IN_TRANSIT
            - AT_REST
            - AT_REST_AND_IN_TRANSIT
            - CUSTOMER_MANAGED_KEY
          example: AT_REST_AND_IN_TRANSIT
        dpiaRequired:
          type: boolean
          default: false
        integrity:
          $ref: '#/components/schemas/ConnectorIntegrityReference'
        policyDecisionId:
          type: string
          example: policy-connector-run
        relianceVerdict:
          type: string
          enum:
            - NOT_EVALUATED
            - RELIABLE
            - CONDITIONAL
            - NOT_RELIABLE
          example: RELIABLE
        auditCategory:
          type: string
          enum:
            - PROTOCOL_ISSUANCE
            - PROTOCOL_VERIFICATION
            - FORM
            - PORTAL
            - WORKFLOW
            - DATASPACE
            - INDUSTRIAL
            - EXTERNAL_EXCHANGE
            - VAULT
            - SYSTEM_CATALOG
          example: PROTOCOL_ISSUANCE

