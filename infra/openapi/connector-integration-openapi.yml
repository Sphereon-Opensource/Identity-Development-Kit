    ConnectorIdentity:
      type: object
      description: Identity assigned to the connector Party, including its nested identifiers.
      required:
        - identityId
        - identityRole
        - isDefault
      properties:
        identityId:
          $ref: '#/components/schemas/IdentityId'
        identityRole:
          type: string
          description: Role of this Identity for the connector Party.
          example: external-system
        displayName:
          type: string
          description: Display name for the connector identity.
          example: Workday tenant acme-prod
        isDefault:
          type: boolean
          description: Whether this is the default identity for the connector.
          example: true
        identifiers:
          type: array
          description: Identifiers attached to this Identity.
          items:
            $ref: '#/components/schemas/ConnectorIdentifier'
      example:
        identityId: 3a5cf979-2d89-4057-a721-c7ab884f0c68
        identityRole: external-system
        displayName: Workday tenant acme-prod
        isDefault: true
        identifiers:
          - identifierId: 6b1c4c89-dfe0-4ce2-b8a4-2e1d57343a6c
            identifierType: DNS_NAME
            value: hr.example.com
            isPrimary: true
            isVerified: true

    ConnectorIdentifierInput:
      type: object
      description: Identifier attached to a connector Identity. Use this for DNS names, URLs, DID identifiers, OIDC issuers, client ids, system ids, or other Party identifier types.
      required:
        - identifierType
        - value
      properties:
        identifierType:
          type: string
          description: Existing Party Identifier type, for example DNS_NAME, URL, DID, OIDC_ISSUER, EMAIL, CLIENT_ID, or SYSTEM_ID.
        value:
          type: string
          description: Identifier value.
          example: hr.example.com
        isPrimary:
          type: boolean
          description: Whether this is the preferred identifier for its type on the Identity.
          default: false
          example: true
        isVerified:
          type: boolean
          description: Whether the platform has verified or administratively accepted this identifier.
          default: false
          example: true
        metadata:
          $ref: '#/components/schemas/StringMap'
      example:
        identifierType: DNS_NAME
        value: hr.example.com
        isPrimary: true
        isVerified: true
        metadata:
          verification_method: dns-control

    ConnectorIdentifier:
      description: Stored identifier attached to a connector Identity.
      allOf:
        - $ref: '#/components/schemas/ConnectorIdentifierInput'
        - type: object
          required:
            - identifierId
          properties:
            identifierId:
              $ref: '#/components/schemas/IdentifierId'
      example:
        identifierId: 6b1c4c89-dfe0-4ce2-b8a4-2e1d57343a6c
        identifierType: DNS_NAME
        value: hr.example.com
        isPrimary: true
        isVerified: true

    ConnectorEndpointInput:
      type: object
      description: Endpoint or address used by a connector. The endpoint says how to reach the connector; resource descriptors say what data is exchanged.
      required:
        - endpointRole
        - accessProtocol
      properties:
        endpointId:
          type: string
          format: uuid
          minLength: 1
          description: Optional stable endpoint identifier. The server assigns one when omitted; supply it to target egress and endpoint-specific TrustDomain bindings.
          example: 27d8bfc5-6c75-4e4e-a78a-63ad7a924cb1
        endpointRole:
          type: string
          minLength: 1
          description: Role of this endpoint, for example management, data, discovery, callback, token, or webhook.
        accessProtocol:
          $ref: '#/components/schemas/AccessProtocol'
        uri:
          type: string
          pattern: '^(?!.*[?#])(?![A-Za-z][A-Za-z0-9+.-]*://[^/]*@).*$'
          description: Credential-free endpoint locator. URI user-info, query parameters, and fragments are forbidden; configuration and secrets use opaque handles.
          example: https://hr.example.com/api/v1
        isPrimary:
          type: boolean
          description: Whether this endpoint is the default endpoint for its role.
          default: false
          example: true
        metadata:
          $ref: '#/components/schemas/StringMap'
      example:
        endpointId: 27d8bfc5-6c75-4e4e-a78a-63ad7a924cb1
        endpointRole: data
        accessProtocol: HTTPS
        uri: https://hr.example.com/api/v1
        isPrimary: true
        metadata:
          region: eu-west

    ConnectorEndpoint:
      description: Stored connector endpoint.
      allOf:
        - $ref: '#/components/schemas/ConnectorEndpointInput'
      example:
        endpointId: 27d8bfc5-6c75-4e4e-a78a-63ad7a924cb1
        endpointRole: data
        accessProtocol: HTTPS
        uri: https://hr.example.com/api/v1
        isPrimary: true

    ConnectorServerTrustProfile:
      type: object
      description: Endpoint-specific outbound server trust policy. CA certificate material remains in the tenant TrustDomain store.
      required: [endpointId]
      properties:
        endpointId:
          type: string
          minLength: 1
          description: Stable connector endpoint identifier matched by an endpoint-specific TrustDomain binding.

    ConnectorTlsVersion:
      type: string
      description: Minimum protocol version admitted for a connector client TLS identity. Activation rejects versions below TLS 1.2.
      enum: [TLS_1_0, TLS_1_1, TLS_1_2, TLS_1_3]

    ConnectorClientTlsIdentityProfile:
      type: object
      description: Tenant client-certificate selection metadata. It contains opaque references and public revision metadata only, never private key bytes.
      required: [clientCertificateCredentialId, allowedDestinationHosts, minimumTlsVersion, identityRevision]
      properties:
        clientCertificateCredentialId:
          type: string
          minLength: 1
        allowedDestinationHosts:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
        minimumTlsVersion:
          $ref: '#/components/schemas/ConnectorTlsVersion'
        identityRevision:
          type: string
          minLength: 1

    ConnectorOAuth2TokenEndpointAuthenticationMethod:
      type: string
      enum: [client_secret_basic, client_secret_post, private_key_jwt, tls_client_auth, self_signed_tls_client_auth]

    ConnectorAccessTokenBindingMode:
      type: string
      enum: [Bearer, RFC_8705_CERTIFICATE_BOUND]
      default: Bearer

    ConnectorOAuth2CredentialSelectors:
      type: object
      description: Opaque tenant credential, signing-key, and client-certificate selectors. Resolved values are never serialized.
      properties:
        clientSecretCredentialId:
          type: string
          nullable: true
        signingKeyReference:
          type: string
          nullable: true
        clientCertificateCredentialId:
          type: string
          nullable: true

    ConnectorOAuth2Profile:
      type: object
      description: OAuth 2.0 client and token binding policy for a connector. An issuer or configured token endpoint id is required by activation validation.
      required: [clientId, scopes, tokenEndpointAuthenticationMethod, credentialSelectors, accessTokenBindingMode]
      properties:
        issuer:
          type: string
          format: uri
          nullable: true
        tokenEndpointId:
          type: string
          nullable: true
        clientId:
          type: string
          minLength: 1
        scopes:
          type: array
          uniqueItems: true
          items:
            type: string
        resource:
          type: string
          nullable: true
        audience:
          type: string
          nullable: true
        tokenEndpointAuthenticationMethod:
          $ref: '#/components/schemas/ConnectorOAuth2TokenEndpointAuthenticationMethod'
        credentialSelectors:
          $ref: '#/components/schemas/ConnectorOAuth2CredentialSelectors'
        accessTokenBindingMode:
          $ref: '#/components/schemas/ConnectorAccessTokenBindingMode'

    ConnectorHttpSecurityProfile:
      type: object
      description: Structurally serialized outbound HTTP security policy containing opaque selectors only.
      required: [serverTrustProfiles, clientTlsIdentityProfiles, oauth2Profiles]
      properties:
        serverTrustProfiles:
          type: array
          items:
            $ref: '#/components/schemas/ConnectorServerTrustProfile'
        clientTlsIdentityProfiles:
          type: array
          items:
            $ref: '#/components/schemas/ConnectorClientTlsIdentityProfile'
        oauth2Profiles:
          type: array
          items:
            $ref: '#/components/schemas/ConnectorOAuth2Profile'

    ConnectorCredentialRef:
      type: object
      description: Reference to credential material used by a connector. Only an opaque server-issued secret ID is exposed; provider identity and physical storage location remain server-side.
      required:
        - secretId
      properties:
        secretId:
          type: string
          pattern: '^sec_[A-Za-z0-9_-]{16,128}$'
          description: Opaque server-issued identifier created through the tenant secret-value API.
          example: sec_01JZZZZZZZZZZZZZZZZZZZZZZZ
        credentialId:
          type: string
          format: uuid
          description: Optional platform credential identifier when credentials are first-class resources.
          example: 8cd48897-9fb2-4a1a-a044-bd71a3e86e61
        credentialType:
          type: string
          description: Connector-specific credential type, for example oauth2-client, api-key, username-password, ssh-key, certificate, or service-account.
          example: oauth2-client
        label:
          type: string
          description: Administrative label for the credential reference.
          example: Workday OAuth client
        metadata:
          $ref: '#/components/schemas/StringMap'
      example:
        secretId: sec_01JZZZZZZZZZZZZZZZZZZZZZZZ
        credentialType: oauth2-client
        label: Workday OAuth client
        metadata:
          rotation: managed-by-security

    ConnectorConfigBindingRef:
      type: object
      description: Opaque server-issued handle to connector runtime configuration. Physical settings scopes, key prefixes, and values remain server-side.
      required:
        - configBindingId
      properties:
        configBindingId:
          type: string
          pattern: '^cfg_[A-Za-z0-9_-]{16,128}$'
          description: Opaque server-issued configuration binding identifier.
          example: cfg_01JZZZZZZZZZZZZZZZZZZZZZZZ
        metadata:
          $ref: '#/components/schemas/StringMap'
      example:
        configBindingId: cfg_01JZZZZZZZZZZZZZZZZZZZZZZZ

    ResourceDescriptorCreateRequest:
      type: object
      description: Request to describe a resource shape independently from any connector instance or transport. A descriptor can later be attached to one or more connectors.
      required:
        - displayName
        - resourceKind
        - representationKind
      properties:
        displayName:
          type: string
          description: Human-readable resource descriptor name.
          example: Employee profile CSV row
        description:
          type: string
          description: Description of the logical resource and intended use.
          example: Tabular employee profile data used for employee credential claim mapping.
        resourceKind:
          $ref: '#/components/schemas/ResourceKind'
        representationKind:
          $ref: '#/components/schemas/RepresentationKind'
        shapeKind:
          $ref: '#/components/schemas/ShapeKind'
        contract:
          $ref: '#/components/schemas/ContractRef'
        fields:
          type: array
          description: Field-level shape, validation, semantic, and retention information.
          items:
            $ref: '#/components/schemas/FieldDescriptorInput'
        metadata:
          $ref: '#/components/schemas/StringMap'
      example:
        displayName: Employee profile CSV row
        description: Tabular employee profile data used for employee credential claim mapping.
        resourceKind: TABULAR
        representationKind: CSV
        shapeKind: CSV_HEADER
        contract:
          contractKind: CSV_PROFILE
          uri: vault://imports/license-batches/employee-license-v1.csv.profile.json
          version: '1.0'
        fields:
          - fieldPath: employee_id
            displayName: Employee id
            valueType: string
            required: true
          - fieldPath: email
            displayName: Work email
            valueType: string
            required: true
            semanticAttributeId: 3cb996ce-9d68-4959-b8c4-c97e39258fae
          - fieldPath: license_type
            displayName: License type
            valueType: string
            required: true
        metadata:
          domain: employee-licensing

    ResourceDescriptorUpdateRequest:
      type: object
      description: Partial update for a resource descriptor. Omitted fields remain unchanged.
      properties:
        displayName:
          type: string
          description: Updated resource descriptor name.
          example: Employee profile CSV row
        description:
          type: string
          description: Updated resource descriptor description.
          example: Employee profile rows imported from a customer CSV upload.
        resourceKind:
          $ref: '#/components/schemas/ResourceKind'
        representationKind:
          $ref: '#/components/schemas/RepresentationKind'
        shapeKind:
          $ref: '#/components/schemas/ShapeKind'
        contract:
          $ref: '#/components/schemas/ContractRef'
        metadata:
          $ref: '#/components/schemas/StringMap'
      example:
        description: Employee profile rows imported from a customer CSV upload.
        metadata:
          domain: employee-licensing
          steward: people-ops

    ResourceDescriptor:
      description: Stored resource descriptor with field definitions and audit timestamps.
      allOf:
        - $ref: '#/components/schemas/ResourceDescriptorCreateRequest'
        - type: object
          required:
            - resourceDescriptorId
            - createdAt
            - updatedAt
          properties:
            resourceDescriptorId:
              $ref: '#/components/schemas/ResourceDescriptorId'
            fields:
              type: array
              description: Stored field descriptors for this resource descriptor.
              items:
                $ref: '#/components/schemas/FieldDescriptor'
            createdAt:
              type: string
              format: date-time
              description: Creation timestamp.
              example: '2026-06-18T09:00:00Z'
            updatedAt:
              type: string
              format: date-time
              description: Last update timestamp.
              example: '2026-06-18T09:10:00Z'
      example:
        resourceDescriptorId: 41436f49-040c-4f5f-9c7f-657f43762e2b
        displayName: Employee profile CSV row
        description: Tabular employee profile data used for employee credential claim mapping.
        resourceKind: TABULAR
        representationKind: CSV
        shapeKind: CSV_HEADER
        contract:
          contractKind: CSV_PROFILE
          uri: vault://imports/license-batches/employee-license-v1.csv.profile.json
          version: '1.0'
        fields:
          - fieldDescriptorId: f00b9edc-5498-483f-9b91-a42ef080b909
            fieldPath: email
            displayName: Work email
            valueType: string
            required: true
            multiValued: false
            semanticAttributeId: 3cb996ce-9d68-4959-b8c4-c97e39258fae
            sensitivity: personal-data
        metadata:
          domain: employee-licensing
        createdAt: '2026-06-18T09:00:00Z'
        updatedAt: '2026-06-18T09:10:00Z'

    FieldDescriptorInput:
      type: object
      description: Field definition for a resource descriptor. A field can carry semantic meaning, validation hints, sensitivity, and retention metadata.
      required:
        - fieldPath
        - valueType
      properties:
        fieldPath:
          type: string
          description: Path or column name within the resource representation.
          example: email
        displayName:
          type: string
          description: Human-readable field name.
          example: Work email
        valueType:
          type: string
          description: Logical value type, for example string, number, boolean, date, datetime, object, array, or binary.
          example: string
        required:
          type: boolean
          description: Whether the field is required for validation and mapping.
          default: false
          example: true
        multiValued:
          type: boolean
          description: Whether the field can hold multiple values.
          default: false
          example: false
        semanticAttributeId:
          type: string
          format: uuid
          description: Optional business-term binding used for validation, governance, and policy.
          example: 3cb996ce-9d68-4959-b8c4-c97e39258fae
        sensitivity:
          type: string
          description: Optional sensitivity or classification label used by governance and policy checks.
          example: personal-data
        retention:
          $ref: '#/components/schemas/RetentionSpec'
        metadata:
          $ref: '#/components/schemas/StringMap'
      example:
        fieldPath: email
        displayName: Work email
        valueType: string
        required: true
        multiValued: false
        semanticAttributeId: 3cb996ce-9d68-4959-b8c4-c97e39258fae
        sensitivity: personal-data
        retention:
          purpose: credential-issuance
          legalBasis: contract
          retentionPeriod: P30D
          deleteAction: DELETE

    FieldDescriptor:
      description: Stored field descriptor.
      allOf:
        - $ref: '#/components/schemas/FieldDescriptorInput'
        - type: object
          required:
            - fieldDescriptorId
          properties:
            fieldDescriptorId:
              $ref: '#/components/schemas/FieldDescriptorId'
      example:
        fieldDescriptorId: f00b9edc-5498-483f-9b91-a42ef080b909
        fieldPath: email
        displayName: Work email
        valueType: string
        required: true
        multiValued: false
        semanticAttributeId: 3cb996ce-9d68-4959-b8c4-c97e39258fae
        sensitivity: personal-data

    ContractRef:
      type: object
      description: Reference to the schema, contract, or discovery document that defines or constrains a resource. The contract is descriptive; transport is still represented by AccessProtocol.
      required:
        - contractKind
      properties:
        contractKind:
          $ref: '#/components/schemas/ContractKind'
        uri:
          type: string
          description: URI or locator for the contract document.
          example: https://hr.example.com/.well-known/openapi.json
        version:
          type: string
          description: Contract version understood by the connector.
          example: '2026-06'
        contentHash:
          type: string
          description: Optional hash of the contract content for integrity and drift detection.
          example: sha256:9a0adf3e15f6c8c9b30b41f34f92de2c4f41ceea6c4e9c027c9f8f83f6a741b7
        metadata:
          $ref: '#/components/schemas/StringMap'
      example:
        contractKind: OPENAPI
        uri: https://hr.example.com/.well-known/openapi.json
        version: '2026-06'
        contentHash: sha256:9a0adf3e15f6c8c9b30b41f34f92de2c4f41ceea6c4e9c027c9f8f83f6a741b7

    AttachConnectorResourceRequest:
      type: object
      description: Request to attach a resource descriptor to a connector instance for a specific data-flow role.
      required:
        - resourceDescriptorId
        - role
      properties:
        resourceDescriptorId:
          $ref: '#/components/schemas/ResourceDescriptorId'
        role:
          $ref: '#/components/schemas/DataFlowRole'
        externalResourceName:
          type: string
          description: Connector-local table, endpoint, bucket, object, claim set, form, topic, or collection name.
        accessProtocol:
          $ref: '#/components/schemas/AccessProtocol'
        endpointId:
          type: string
          format: uuid
          description: Optional connector endpoint used to access this resource.
          example: 27d8bfc5-6c75-4e4e-a78a-63ad7a924cb1
        metadata:
          $ref: '#/components/schemas/StringMap'
      example:
        resourceDescriptorId: 41436f49-040c-4f5f-9c7f-657f43762e2b
        role: SOURCE
        externalResourceName: /employees/{employee_id}
        accessProtocol: HTTPS
