        successorPublicationId:
          type: string
          format: uuid
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateDataDomainPublicationInput:
      type: object
      required: [revision, reviewId]
      additionalProperties: false
      properties:
        revision:
          type: integer
          format: int64
        reviewId:
          type: string
          format: uuid
        supersedesPublicationId:
          type: string
          format: uuid
          nullable: true

    DataDomainPublicationNotice:
      type: object
      required: [id, publicationId, dataDomainId, revision, kind, reason, effectiveAt, createdAt, createdBy]
      properties:
        id:
          type: string
          format: uuid
        publicationId:
          type: string
          format: uuid
        dataDomainId:
          type: string
          format: uuid
        revision:
          type: integer
          format: int64
        kind:
          type: string
          enum: [DEPRECATION, WITHDRAWAL, RETIREMENT]
        reason:
          type: string
        effectiveAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        createdBy:
          type: string
          readOnly: true

    CreateDataDomainPublicationNoticeInput:
      type: object
      required: [kind, reason, effectiveAt]
      additionalProperties: false
      properties:
        kind:
          type: string
          enum: [DEPRECATION, WITHDRAWAL, RETIREMENT]
        reason:
          type: string
        effectiveAt:
          type: string
          format: date-time

    DataDomainValidationResult:
      type: object
      required: [valid, issues]
      properties:
        valid:
          type: boolean
        issues:
          type: array
          items:
            $ref: '#/components/schemas/DataDomainValidationIssue'

    DataDomainValidationIssue:
      type: object
      required: [path, message]
      properties:
        path:
          type: string
        message:
          type: string

    DataDomainReviewList:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/DataDomainReview'
        pagination:
          $ref: './common-components.yml#/components/schemas/PageMeta'

    DataDomainPublicationList:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/DataDomainPublication'
        pagination:
          $ref: './common-components.yml#/components/schemas/PageMeta'

    DataDomainPublicationNoticeList:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/DataDomainPublicationNotice'
        pagination:
          $ref: './common-components.yml#/components/schemas/PageMeta'

    GovernanceOdrlResult:
      type: object
      required: [policy, warnings]
      properties:
        policy:
          type: object
          additionalProperties: true
        warnings:
          type: array
          items:
            type: string

    DomainOverlays:
      type: object
      description: |
        The data-domain-root overlay bag: localized name/description per language, the governance overlay,
        and an open extensions map for forward-incoming overlays.
      example:
        meta:
          en:
            name: "Acme Employee Catalog"
            description: "Canonical employee attributes governed by HR"
        governance:
          jurisdictions:
            - region: "EU"
              laws: ["eu-gdpr"]
              frameworks: ["GDPR", "EIDAS2", "NIS2"]
              authority: "EDPB"
              residency:
                allowed: ["EU", "EEA"]
                localizationRequired: false
              defaultTransfer:
                mechanism: "ADEQUACY_DECISION"
          primaryJurisdiction: "EU"
          controller:
            partyId: "9f2c1b3e-7a44-4c1e-8b0a-2d6f5e9c1a77"
            role: "CONTROLLER"
            establishedIn: "NL"
          classificationScheme: ["PUBLIC", "INTERNAL", "CONFIDENTIAL", "RESTRICTED"]
      properties:
        meta:
          type: object
          default: {}
          description: Per-language localized data-domain name/description, keyed by BCP-47 language tag.
          additionalProperties:
            $ref: '#/components/schemas/DomainMetaText'
        governance:
          type: object
          allOf:
            - $ref: '#/components/schemas/DomainGovernance'
          nullable: true
        extensions:
          type: object
          default: {}
          description: Any data-domain-root overlay not represented by a typed field, keyed by overlay name.
          additionalProperties: true

    DomainMetaText:
      type: object
      description: |
        One language's localized data-domain name and/or description. At least one of name/description must
        be present.
      properties:
        name:
          type: string
          nullable: true
        description:
          type: string
          nullable: true

    DomainGovernance:
      type: object
      description: |
        The data-domain-root governance overlay: the cross-jurisdiction governance model carried on the
        data domain (jurisdictions, controller, classification scheme, NIS2/MiCA classifications).
      example:
        jurisdictions:
          - region: "EU"
            laws: ["eu-gdpr"]
            frameworks: ["GDPR", "EIDAS2", "NIS2"]
            authority: "EDPB"
            residency:
              allowed: ["EU", "EEA"]
              localizationRequired: false
            defaultTransfer:
              mechanism: "ADEQUACY_DECISION"
        primaryJurisdiction: "EU"
        controller:
          partyId: "9f2c1b3e-7a44-4c1e-8b0a-2d6f5e9c1a77"
          role: "CONTROLLER"
          establishedIn: "NL"
        classificationScheme: ["PUBLIC", "INTERNAL", "CONFIDENTIAL", "RESTRICTED"]
      properties:
        jurisdictions:
          type: array
          default: []
          items:
            $ref: '#/components/schemas/GovernanceJurisdiction'
        primaryJurisdiction:
          type: string
          nullable: true
        controller:
          type: object
          allOf:
            - $ref: '#/components/schemas/GovernanceController'
          nullable: true
        classificationScheme:
          type: array
          default: []
          items:
            type: string
        nis2:
          type: object
          allOf:
            - $ref: '#/components/schemas/Nis2Classification'
          nullable: true
        mica:
          type: object
          allOf:
            - $ref: '#/components/schemas/MicaClassification'
          nullable: true

    GovernanceJurisdiction:
      type: object
      description: A self-contained per-jurisdiction governance entry on the data-domain-root governance overlay.
      required: [region]
      properties:
        region:
          type: string
          description: ISO 3166 / region-group identifier, e.g. EU, US-CA, CN.
        laws:
          type: array
          default: []
          items:
            type: string
        frameworks:
          type: array
          default: []
          items:
            type: string
        authority:
          type: string
          nullable: true
        residency:
          type: object
          allOf:
            - $ref: '#/components/schemas/JurisdictionResidency'
          nullable: true
        defaultTransfer:
          type: object
          allOf:
            - $ref: '#/components/schemas/JurisdictionTransfer'
          nullable: true

    JurisdictionResidency:
      type: object
      description: A jurisdiction's default residency rule.
      properties:
        allowed:
          type: array
          default: []
          items:
            type: string
        localizationRequired:
          type: boolean
          nullable: true

    JurisdictionTransfer:
      type: object
      description: A jurisdiction's default cross-border transfer mechanism.
      required: [mechanism]
      properties:
        mechanism:
          type: string
          description: The GDPR Chapter V transfer mechanism applied by default in this jurisdiction.

    GovernanceController:
      type: object
      description: The data controller for the data domain's data.
      required: [partyId]
      properties:
        partyId:
          type: string
        role:
          type: string
          nullable: true
        establishedIn:
          type: string
          nullable: true

    Nis2Classification:
      type: object
      description: The data-domain-grain NIS2 entity criticality classification.
      required: [entityClass]
      properties:
        entityClass:
          type: string
          description: The NIS2 entity criticality class.
        sector:
          type: string
          nullable: true
          description: The NIS2 sector the entity operates in.

    MicaClassification:
      type: object
      description: The data-domain-grain MiCA crypto-asset classification (Regulation 2023/1114).
      required: [assetClass]
      properties:
        assetClass:
          type: string
          description: The MiCA crypto-asset class.
        whitepaperRef:
          type: string
          nullable: true
        esmaRef:
          type: string
          nullable: true

    ObjectTypeBinding:
      type: object
      example:
        dataDomainId: "9f2c1b3e-7a44-4c1e-8b0a-2d6f5e9c1a77"
        entity: "Person"
      description: |
        Names a data-domain object type an ObjectRole binds to: the object type name within the data domain
        identified by `dataDomainId`. The data-domain snapshot version is not repeated here; it is fixed by
        the matching DataDomainRef the object model pins for the same dataDomainId.
      required: [dataDomainId, entity]
      properties:
        dataDomainId:
          type: string
          format: uuid
          description: The data domain the object type lives in; must have a matching DataDomainRef on the object model.
        entity:
          type: string
          description: The referenced object type's name within that data domain.

    ObjectRole:
      type: object
      example:
        id: "employee"
        name: "Employee"
        entity:
          dataDomainId: "9f2c1b3e-7a44-4c1e-8b0a-2d6f5e9c1a77"
          entity: "Person"
        specializes: ["Employee"]
        description: "The employee participant in the use case"
      description: |
        An object-model-local role naming one participant of a use case (e.g. `employer`), bound to a single
        data-domain object type. The role's party type derives from the bound object type at resolution time;
        `specializes` names the object type's specialization sub-types applied for this role.
      required: [id, name, entity]
      properties:
        id:
          type: string
          description: The object-model-local role identifier, referenced by overrides and resolved relationship ends. Unique within an object model.
        name:
          type: string
          description: Human-readable role name, e.g. `Employer`.
        entity:
          $ref: '#/components/schemas/ObjectTypeBinding'
        specializes:
          type: array
          description: The specialization object-type names applied to the bound object type for this role; empty applies the object-type root unspecialized.
          default: []
          items:
            type: string
        description:
          type: string
          nullable: true
          description: Optional free-form description of the role's purpose.

    ObjectRelationshipRef:
      type: object
      example:
        dataDomainId: "9f2c1b3e-7a44-4c1e-8b0a-2d6f5e9c1a77"
        relationship: "employs"
      description: |
        Selects a first-class data-domain relationship type into an object model by its name within the data domain
        identified by `dataDomainId`. The relationship type's ends resolve to the object model's bound roles (or are
        pulled in as a target object type) during resolution.
      required: [dataDomainId, relationship]
      properties:
        dataDomainId:
          type: string
          format: uuid
          description: The data domain the selected relationship type belongs to; must have a matching DataDomainRef on the object model.
        relationship:
          type: string
          description: The selected relationship type's unique name within that data domain.

    ObjectOverride:
      type: object
      example:
        roleRef: "employee"
        path: ["givenName"]
        sensitive: true
      description: |
        A narrow-only override an object model applies to a single data-domain business term of one of its roles,
        keyed by (roleRef, path). Each overlay field is nullable; null reads through to the data domain.
        The narrow-only rules are enforced by the data-domain-aware widening check, not structurally.
      required: [roleRef, path]
      properties:
        roleRef:
          type: string
          description: The ObjectRole id whose object type owns the overridden business term.
        path:
          type: array
          items:
            type: string
          description: The fully-qualified business-term path within that role's object type.
        conformance:
          type: string
          allOf:
            - $ref: '#/components/schemas/Conformance'
          nullable: true
          description: Overrides the attribute's mandatory/optional conformance for the use case.
        sdPolicy:
          type: string
          allOf:
            - $ref: '#/components/schemas/SdPolicy'
          nullable: true
          description: Overrides the attribute's selective-disclosure policy.
        cardinality:
          type: object
          allOf:
            - $ref: '#/components/schemas/AttributeCardinality'
          nullable: true
          description: Narrows the attribute's occurrence cardinality (narrow-only).
        entryCodesSubset:
          type: array
          nullable: true
          description: Narrows the attribute's allowed entry codes to this subset; null means no narrowing, never empty when present.
          items:
            type: string
        sensitive:
          type: boolean
          nullable: true
          description: Tightens the attribute's sensitivity (false -> true only).
        retention:
          type: object
          allOf:
            - $ref: '#/components/schemas/RetentionPolicy'
          nullable: true
          description: Overrides the attribute's retention policy.

    ObjectModel:
      type: object
      example:
        id: "c4d5e6f7-8a9b-4c0d-8e1f-2a3b4c5d6e7f"
        tenantId: "acme"
        name: "Employee Onboarding"
        version: 2
        status: PUBLISHED
        domainRefs:
          - dataDomainId: "9f2c1b3e-7a44-4c1e-8b0a-2d6f5e9c1a77"
            revision: 3
        roles:
          - id: "employee"
            name: "Employee"
            entity:
              dataDomainId: "9f2c1b3e-7a44-4c1e-8b0a-2d6f5e9c1a77"
              entity: "Person"
            specializes: ["Employee"]
        relationships: []
        overrides: []
        description: "Use case composing employee attributes for badge issuance"
        createdAt: "2026-01-15T09:30:00Z"
        updatedAt: "2026-01-15T09:30:00Z"
      description: |
        The L2 object-model tier: a use-case curation over one or more published data domains. It binds
        use-case roles to data-domain object types, selects the data-domain relationship types that connect those roles,
        and applies narrow-only per-business-term overrides. Snapshot versioning is a monotonic counter;
        status reuses the data-domain draft/published semantics.
      required:
        - id
        - tenantId
        - name
        - version
        - status
        - domainRefs
        - roles
        - relationships
        - overrides
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
        name:
          type: string
        version:
          type: integer
          format: int64
          minimum: 1
          description: Monotonic snapshot version, starting at 1.
        status:
          $ref: '#/components/schemas/ModelLifecycleStatus'
        domainRefs:
          type: array
          description: The data domains this object model draws from; at most one ref per data domain.
          items:
            $ref: '#/components/schemas/DataDomainRef'
        roles:
          type: array
          description: The use-case roles, each bound to a data-domain object type.
          items:
            $ref: '#/components/schemas/ObjectRole'
        relationships:
          type: array
          description: The data-domain relationship types selected into the object model.
          items:
            $ref: '#/components/schemas/ObjectRelationshipRef'
        overrides:
          type: array
          description: The narrow-only per-business-term overrides, keyed by (roleRef, path).
          items:
            $ref: '#/components/schemas/ObjectOverride'
        description:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ResolvedObjectModel:
      type: object
      example:
        objectModelId: "c4d5e6f7-8a9b-4c0d-8e1f-2a3b4c5d6e7f"
        objectModelVersion: 2
        domainRefs:
          - dataDomainId: "9f2c1b3e-7a44-4c1e-8b0a-2d6f5e9c1a77"
            revision: 3
        roles: []
        relationships: []
        schemaRelationships: []
      description: |
        The effective object-type graph projection of an object model, produced by cross-data-domain resolution: each
        role's bound object type (with applied specializations) is composed, the object model's narrow-only
        overrides are applied on top of data-domain governance, and the selected relationship types are projected
        over the bound roles.
      required: [objectModelId, objectModelVersion, domainRefs, roles]
      properties:
        objectModelId:
          type: string
          format: uuid
        objectModelVersion:
          type: integer
          format: int64
          minimum: 1
        domainRefs:
          type: array
          items:
            $ref: '#/components/schemas/DataDomainRef'
        roles:
          type: array
          items:
            $ref: '#/components/schemas/ResolvedObjectRole'
        relationships:
          type: array
          default: []
          items:
            $ref: '#/components/schemas/ResolvedObjectRelationship'
        schemaRelationships:
          type: array
          default: []
          items:
            $ref: '#/components/schemas/ResolvedObjectSchemaRelationship'

    ResolvedObjectRole:
      type: object
      description: |
        One resolved role: the bound root object type, the specializations applied, the party type the
        object type maps to, and the effective (post-narrowing) business terms contributed by the object type and its
        applied specializations.
      required: [id, entity]
      properties:
        id:
          type: string
        entity:
          type: string
          description: The root object-type name the role bound to.
        specializes:
          type: array
          default: []
          items:
            type: string
        partyType:
          type: string
          nullable: true
          description: The party type derived from the object type; null when the object type declares none.
        attributes:
          type: array
          default: []
          items:
            $ref: '#/components/schemas/ResolvedTerm'

    ResolvedTerm:
      type: object
      description: |
        One resolved business term of a role (or of a relationship target object type): its fully-qualified path
        within the declaring object type, the OCA value type, the object type that declares it, and the effective
        overlay bag after the object model's narrow-only overrides were applied over the data domain.
      required: [path, valueType, sourceEntity, overlays]
      properties:
        entryCodeScheme:
          allOf:
            - { $ref: '#/components/schemas/SkosConceptSchemeReference' }
          nullable: true
        path:
          type: array
          items:
            type: string
          description: The fully-qualified path within the declaring object type.
        valueType:
          type: string
          description: The OCA capture-base value type token (e.g. `Text`, `[Text]`, `Reference`).
        sourceEntity:
          type: string
          description: The object type that declares the business term (the base object type or a specialization).
        overlays:
          $ref: '#/components/schemas/AttributeOverlays'

    ResolvedObjectRelationship:
      type: object
      description: |
        One resolved relationship: the data-domain relationship type name and type, the source role it walks
        from, and either the target role (when the target object type is also a bound role) or the target
        object type pulled in via this relationship (with that object type's business terms).
      required: [name, relationType, sourceRole]
      properties:
        name:
          type: string
        relationType:
          type: string
        sourceRole:
          type: string
        targetRole:
          type: string
          nullable: true
        targetEntity:
          type: string
          nullable: true
        overlays:
          $ref: '#/components/schemas/AttributeOverlays'
        targetAttributes:
          type: array
          default: []
          items:
            $ref: '#/components/schemas/ResolvedTerm'

    ResolvedObjectSchemaRelationship:
      type: object
      description: |
        One business-term-level schema relationship a resolved object model exposes: the object-type-qualified
        projection of a data-domain schema relationship for a business term the object model resolved.
      required:
        - dataDomainId
        - entity
        - schemaBindingId
        - externalPath
        - semanticPath
        - relation
        - direction
      properties:
        dataDomainId:
          type: string
          format: uuid
        entity:
          type: string
          description: The object type owning the canonical business term the relationship anchors at.
        schemaBindingId:
          type: string
        externalPath:
          type: array
          items:
            type: string
          description: The attribute path within the bound external schema.
        semanticPath:
          type: array
          items:
            type: string
          description: The canonical data-domain business-term path the relationship is anchored at.
        relation:
          $ref: '#/components/schemas/SchemaAttributeRelation'
        equivalence:
          type: string
          allOf:
            - $ref: '#/components/schemas/EquivalenceStrength'
          nullable: true
        direction:
          $ref: '#/components/schemas/MappingDirection'
        transform:
          type: object
          allOf:
            - $ref: '#/components/schemas/AttributeTransform'
          nullable: true

    ChannelType:
      type: string
      description: The output channel a product-backed definition renders its bound data product into.
      enum:
        - FORM
        - PDF_DOCUMENT
        - VERIFIABLE_CREDENTIAL
        - API_PAYLOAD
        - OID4VCI

    DataProductRef:
      type: object
      example:
        dataProductId: "1b2c3d4e-5f60-4a71-8b92-0c1d2e3f4a5b"
        dataProductVersion: 1
      description: |
        A reference to exactly one L3 data product, pinned to a specific snapshot version. An L4
        definition binds to its data product through this ref and resolves deterministically as the data product evolves.
        There is intentionally no data-domain or object-model reference on a definition.
      required: [dataProductId, dataProductVersion]
      properties:
        dataProductId:
          type: string
          format: uuid
          description: The referenced data product id.
        dataProductVersion:
          type: integer
          format: int64
          minimum: 1
          description: The pinned data-product snapshot version (monotonic, starting at 1).

    ChannelFieldMapping:
      type: object
      description: |
        The binding half of a channel. It maps one named output of the channel (a form field, a PDF
        field, an API payload key) to the one data-product selection that supplies its value. This is
        the same shape for every channel type, so the binding contract stays uniform; the per-channel
        rendering (widget, placement, claim, etc.) lives in a separate array and is joined to this
        mapping by `fieldName`.

        `set` is a `(roleRef, path)` selection within the bound data product. Keying on `(roleRef, path)` rather
        than a bare path lets the channel tell apart the same business-term path under different object-model
        roles (for example an employee's `givenName` versus an employer's `givenName`). A channel may
        only map to selections that actually exist in its bound data product.
      required: [fieldName, set]
      properties:
        fieldName:
          type: string
          description: The channel output name this mapping binds; the matching render entry uses the same name. Must be non-blank.
        set:
          $ref: '#/components/schemas/ProductSelection'

    FormWidget:
      type: string
      description: The input widget a business-term-capture form renders a field with.
      enum:
        - TEXT
        - TEXTAREA
        - SELECT
        - DATE
        - CHECKBOX
        - RADIO
        - NUMBER
        - FILE

    FormFieldRender:
      type: object
      description: |
        The rendering half of a form field: how the field is presented (widget, grouping, wizard step,
        input mask, validation message, placeholder). It pairs with a `ChannelFieldMapping` by
        `fieldName` to learn which data-product selection the field captures; this entry carries no data-product
        binding of its own. The one exception is `required`: a non-null value is a per-field constraint
        the binding validator checks for widening, so a form may tighten an optional data-product business term to
        required but may not loosen a mandatory one to optional.
      required: [fieldName, widget]
      properties:
        fieldName:
          type: string
          description: The form field name; must be non-blank and match a ChannelFieldMapping.
        widget:
          $ref: '#/components/schemas/FormWidget'
        required:
          type: boolean
          nullable: true
          description: Whether this field is required; null inherits the data product's effective optionality. Checked for widening.
        group:
          type: string
          nullable: true
          description: Optional logical group/section name the field belongs to.
        step:
          type: integer
          nullable: true
          description: Optional 1-based wizard step/page index the field appears on.
        inputMask:
          type: string
          nullable: true
          description: Optional input mask pattern applied to the widget.
        validationMessage:
          type: string
          nullable: true
          description: Optional override message shown when the field fails validation.
        placeholder:
          type: string
          nullable: true
          description: Optional placeholder shown in an empty input.

    PdfPlacement:
      type: object
      description: The placement of one bound business term on a rendered PDF/document page. Rendering-only.
      required: [fieldName, page, x, y]
      properties:
        fieldName:
          type: string
          description: The document field name; must match a ChannelFieldMapping and be non-blank.
        page:
          type: integer
          minimum: 1
          description: The 1-based page the value is drawn on.
        x:
          type: number
          format: double
          description: The x coordinate of the value's anchor.
        y:
          type: number
          format: double
          description: The y coordinate of the value's anchor.
        format:
          type: string
          nullable: true
          description: Optional value format string applied before drawing.

    PdfRepeatedSection:
      type: object
      description: |
        A document section that repeats per element of a multi-valued bound attribute. The
        sourceFieldName names the repeating bound field; placements are drawn once per element.
      required: [sourceFieldName]
      properties:
        sourceFieldName:
          type: string
          description: The bound field whose multiple values drive the repetition.
        placements:
          type: array
          default: []
          items:
            $ref: '#/components/schemas/PdfPlacement'

    DisclosureMode:
      type: string
      description: Whether a credential claim is always disclosed or selectively disclosable by the holder.
      enum:
        - ALWAYS
        - SELECTIVE

    VcClaimMapping:
      type: object
      description: |
        Maps one credential CLAIM in the signed credential subject to the `(roleRef, path)` data-product
        selection that supplies its value, with the claim's disclosure mode. Distinct from
        ChannelFieldMapping because a credential claim carries disclosure semantics a generic field
        mapping does not. The `set` selection lets a claim be sourced from the right object-model role when
        the bound data product spans several roles.
      required: [set]
      properties:
        set:
          $ref: '#/components/schemas/ProductSelection'
        claimPath:
          type: array
          nullable: true
          items:
            type: string
          description: |
            OPTIONAL wire claim path within the credential subject, as a flat array of CLEAN segments
            (no segment carries a dot). When omitted it defaults to the semantic `set` path's segments,
            so a mapping only states `claimPath` when the wire shape differs (a rename, a re-nesting,
            or an mdoc element reduction). The mdoc namespace is NEVER a path segment; it is the
            `namespace` field (or the channel-level namespace), combined with this element by the
            format converter.
        namespace:
          type: string
          nullable: true
          description: |
            OPTIONAL per-claim mdoc namespace override; takes precedence over the channel-level
            namespace for this claim (multi-namespace mdocs). An opaque mdoc identifier that MAY
            contain dots (it is an identifier, not a path).
        disclosure:
          allOf:
            - $ref: '#/components/schemas/DisclosureMode'
          default: ALWAYS

    VerifiableCredentialChannelRef:
      type: object
      description: |
        A version-pinned reference to a verifiable-credential definition. An OID4VCI issuance
        definition references one or more of these instead of binding an data product directly.
      required: [channelId, channelVersion]
      properties:
        channelId:
          type: string
          format: uuid
          description: The referenced verifiable-credential definition id.
        channelVersion:
          type: integer
          format: int64
          minimum: 1
          description: The pinned VC-definition snapshot version (monotonic, starting at 1).

    Oid4vciGrantType:
      type: string
      description: An OID4VCI grant type an offer may advertise.
      enum:
        - AUTHORIZATION_CODE
        - PRE_AUTHORIZED_CODE

    Oid4vciOfferConfig:
      type: object
      description: |
        The per-credential offer-shaping configuration: which grant(s) the offer advertises and how an
        offer URI behaves. Each composed credential configures this independently.
      properties:
        grants:
          type: array
          items:
            $ref: '#/components/schemas/Oid4vciGrantType'
          default: []
          description: The grant types this credential's offer advertises; empty means the issuer default applies.
        txCodeRequired:
          type: boolean
          default: false
          description: Whether a transaction code is required to redeem a pre-authorized offer.
        validitySeconds:
          type: integer
          format: int64
          nullable: true
          description: Optional validity window for an issued offer, in seconds.

    Oid4vciSigning:
      type: object
      description: |
        The per-credential signing configuration, mapping to the OID4VCI issuer-metadata
        `credential_signing_alg_values_supported` and `cryptographic_binding_methods_supported`.
      required: [algorithm, keyBinding]
      properties:
        algorithm:
          type: string
          description: The signature algorithm, e.g. `ES256`, `EdDSA`.
        keyBinding:
          type: string
          description: The cryptographic binding method, e.g. a DID method (`did:jwk`) or `x5c`.

    Oid4vciCredentialConfiguration:
      type: object
      description: |
        One credential configuration an OID4VCI issuance channel advertises: a self-contained binding
        of an issuer credential-configuration id to one composed VC channel, with its own signing and
        offer setup. Every id an offer can reference is declared here.
      required: [credentialConfigurationId, channelRef, signing]
      properties:
        credentialConfigurationId:
          type: string
          description: The issuer-metadata credential configuration id; non-blank, unique within the channel.
        channelRef:
          $ref: '#/components/schemas/VerifiableCredentialChannelRef'
        signing:
          $ref: '#/components/schemas/Oid4vciSigning'
        offer:
          allOf:
            - $ref: '#/components/schemas/Oid4vciOfferConfig'
          default: {}

    ApiPayloadRole:
      type: string
      description: Which side of an external API exchange a payload definition shapes.
      enum:
        - REQUEST
        - RESPONSE

    ApiNamingConvention:
      type: string
      description: The external naming convention an API payload renders its keys with. Rendering-only.
      enum:
        - CAMEL_CASE
        - SNAKE_CASE
        - KEBAB_CASE
        - PASCAL_CASE

    ApiPathMapping:
      type: object
      description: |
        Maps one bound field to the external (possibly nested, dotted/slash) path it occupies in the
        API payload. Rendering-only: expresses where a value sits in the external shape, not a data-product
        constraint.
      required: [fieldName, externalPath]
      properties:
        fieldName:
          type: string
          description: The bound field name; must match a ChannelFieldMapping and be non-blank.
        externalPath:
          type: string
          description: The path within the external payload (e.g. `data.subject.givenName`).

    ChannelEnvelope:
      type: object
      example:
        channel: FORM
        payload:
          id: "a1b2c3d4-e5f6-4071-8293-a4b5c6d7e8f9"
          tenantId: "acme"
          name: "Employee badge capture form"
          version: 1
          channel: FORM
          setRef:
            dataProductId: "1b2c3d4e-5f60-4a71-8b92-0c1d2e3f4a5b"
            dataProductVersion: 1
          fieldMappings:
            - fieldName: "givenName"
              set:
                roleRef: "employee"
                path: ["givenName"]
          fields:
            - fieldName: "givenName"
              widget: TEXT
              required: true
              step: 1
          stepLabels: ["Personal details"]
      description: |
        The REST read shape for an L4 channel: a `channel` type discriminator plus the
        concrete channel as a JSON object that itself carries an inline `channel` discriminator. A
        consumer reads `channel` to learn the concrete type, then decodes `payload` into the matching
        concrete channel (FormChannel, PdfDocumentChannel, VerifiableCredentialChannel,
        Oid4vciIssuanceChannel, or ApiPayloadChannel).
      required: [channel, payload]
      properties:
        channel:
          $ref: '#/components/schemas/ChannelType'
        payload:
          type: object
          additionalProperties: true
          description: |
            The concrete channel-specific definition, pre-serialized as a JSON object. Its shape is the
            channel definition selected by `channel` plus an inline `channel` discriminator. The four
            product-backed channels (FORM, PDF_DOCUMENT, VERIFIABLE_CREDENTIAL, API_PAYLOAD) carry
            `id`, `tenantId`, `name`, `version`, `setRef`, `fieldMappings` and their channel-specific
            rendering fields (e.g. `fields`/`stepLabels` for FORM, `templateRef`/`placements` for
            PDF_DOCUMENT, `credentialFormat`/`claimMappings`/`brandingRef` for VERIFIABLE_CREDENTIAL,
            `payloadName`/`role`/`namingConvention`/`externalPathMappings` for API_PAYLOAD). The OID4VCI
            issuance channel has no `setRef`/`fieldMappings`; it carries a `credentialConfigurations`
            array (each entry: `credentialConfigurationId`, `channelRef`, `signing`, `offer`).

    BrandingLocale:
      type: object
      example:
        language: "en"
        name: "Acme Employee Badge"
        description: "Official employee identification credential"
        logoUri: "https://assets.acme.example/logo.png"
        backgroundColor: "#1A237E"
        textColor: "#FFFFFF"
        backgroundImageUri: null
      description: |
        Per-language presentation overlay for a credential-branding record. Grounded in OCA
        branding-overlay conventions: display name, logo, colors, and optional background image
        for the wallet credential card in one language.
      required: [language, name]
      properties:
        language:
          type: string
          description: BCP-47 language tag (e.g. `en`, `nl`, `de-DE`); must be non-blank.
        name:
          type: string
          description: The credential display name in this language; must be non-blank.
        description:
          type: string
          nullable: true
          description: |
            Optional per-locale credential description. The OID4VCI credential `display` description and
            the wallet card subtitle derive from this; the design no longer re-states it.
        logoUri:
          type: string
          nullable: true
          description: Optional URI to the credential issuer logo.
        backgroundColor:
          type: string
          nullable: true
          description: Optional CSS color string for the card background (e.g. `#1A237E`).
        textColor:
          type: string
          nullable: true
          description: Optional CSS color string for card text.
        backgroundImageUri:
          type: string
          nullable: true
          description: Optional URI to a background image for the card.

    CredentialBranding:
      type: object
      example:
        id: "d4e5f607-1829-4a3b-9c4d-5e6f70819a2b"
        tenantId: "acme"
        name: "Acme Employee Badge branding"
        version: 1
        status: DRAFT
        locales:
          - language: "en"
            name: "Acme Employee Badge"
            description: "Official employee identification credential"
            logoUri: "https://assets.acme.example/logo.png"
            backgroundColor: "#1A237E"
            textColor: "#FFFFFF"
        layout: null
        description: "Branding for the employee badge credential"
        createdAt: "2026-01-15T09:30:00Z"
        updatedAt: "2026-01-15T09:30:00Z"
      description: |
        The L4 credential-branding overlay: a named, tenant-owned presentation overlay authored
        once per credential type. Holds per-language display metadata (locales), an optional layout
        hint, lifecycle status, and a monotonic snapshot version. Referenced by VC definitions via
        BrandingRef in Round 2.
      required: [id, tenantId, name, version, status, locales, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
        name:
          type: string
          description: Internal human-readable name for this branding record.
        version:
          type: integer
          format: int64
          minimum: 1
          description: Monotonic snapshot version, starting at 1.
        status:
          $ref: '#/components/schemas/ModelLifecycleStatus'
        locales:
          type: array
          description: Per-language presentation overlays; language tags are unique within the list.
          default: []
          items:
            $ref: '#/components/schemas/BrandingLocale'
        layout:
          type: string
          nullable: true
          description: Optional opaque layout hint (e.g. a template id or layout name).
        description:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    BrandingRef:
      type: object
      example:
        brandingId: "d4e5f607-1829-4a3b-9c4d-5e6f70819a2b"
        version: 1
      description: |
        A version-pinned reference to a CredentialBranding record. VC definitions use this to
        point at the exact branding snapshot they were authored against.
      required: [brandingId, version]
      properties:
        brandingId:
          type: string
          format: uuid
          description: The referenced branding record id.
        version:
          type: integer
          format: int64
          minimum: 1
          description: The pinned CredentialBranding.version snapshot (monotonic, starting at 1).
