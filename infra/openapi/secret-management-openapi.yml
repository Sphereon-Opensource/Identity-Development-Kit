openapi: 3.0.4
info:
  title: Secret Management API
  version: 1.0.0
  x-products: [edk, vdx]
  description: |
    Greenfield platform and tenant secret-storage control plane. Provider revisions are immutable,
    assignments change only through fenced migrations, and every read model is opaque: credentials,
    physical locators, backend identifiers, partitions, and provider error text are never returned.
servers:
  - url: https://api.example.com/api
  - url: http://localhost:8080/api
security:
  - bearer: []
tags:
  - { name: PlatformSecretStorage }
  - { name: PlatformSecretProviders }
  - { name: PlatformSecretOfferings }
  - { name: TenantSecretPolicy }
  - { name: TenantSecretStorage }
  - { name: TenantSecretProviders }
  - { name: SecretMigrations }
  - { name: TenantSecretValues }
paths:
  /platform/admin/v1/application/secrets/storage:
    get:
      tags: [PlatformSecretStorage]
      operationId: getPlatformSecretStorage
      responses:
        '200':
          description: Active platform secret-storage assignment.
          headers: { ETag: { $ref: './secret-management-components.yml#/components/headers/ETag' } }
          content:
            application/json:
              schema: { $ref: './secret-management-components.yml#/components/schemas/PlatformStorageAssignment' }
  /platform/admin/v1/application/secrets/storage/providers:
    get:
      tags: [PlatformSecretProviders]
      operationId: listPlatformSecretProviderDefinitions
      responses:
        '200':
          description: Provider definitions.
          headers: { ETag: { $ref: './secret-management-components.yml#/components/headers/ETag' } }
          content:
            application/json:
              schema:
                type: array
                items: { $ref: './secret-management-components.yml#/components/schemas/ProviderDefinition' }
    post:
      tags: [PlatformSecretProviders]
      operationId: createPlatformSecretProviderDefinition
      description: If-Match fences the platform provider collection version returned by this collection GET.
      parameters:
        - { $ref: './secret-management-components.yml#/components/parameters/IfMatch' }
        - { $ref: './secret-management-components.yml#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: './secret-management-components.yml#/components/schemas/CreatePlatformProviderDefinitionRequest' }
      responses:
        '201':
          description: Candidate provider definition.
          headers: { ETag: { $ref: './secret-management-components.yml#/components/headers/ETag' } }
          content:
            application/json:
              schema: { $ref: './secret-management-components.yml#/components/schemas/ProviderDefinition' }
        '409': { $ref: './secret-management-components.yml#/components/responses/Conflict' }
        '412': { $ref: './secret-management-components.yml#/components/responses/PreconditionFailed' }
        '428': { $ref: './secret-management-components.yml#/components/responses/PreconditionRequired' }
  /platform/admin/v1/application/secrets/storage/providers/options:
    get:
      tags: [PlatformSecretProviders]
      operationId: getPlatformSecretProviderSetupOptions
      responses:
        '200':
          description: Server-reported platform provider capabilities, auth modes, and typed setup fields.
          headers: { ETag: { $ref: './secret-management-components.yml#/components/headers/ETag' } }
          content:
            application/json:
              schema: { $ref: './secret-management-components.yml#/components/schemas/ProviderSetupCatalog' }
  /platform/admin/v1/application/secrets/storage/providers/{definitionId}:
    parameters: [{ $ref: './secret-management-components.yml#/components/parameters/DefinitionId' }]
    get:
      tags: [PlatformSecretProviders]
      operationId: getPlatformSecretProviderDefinition
      responses:
        '200':
          description: Provider definition.
          headers: { ETag: { $ref: './secret-management-components.yml#/components/headers/ETag' } }
          content:
            application/json:
              schema: { $ref: './secret-management-components.yml#/components/schemas/ProviderDefinition' }
    delete:
      tags: [PlatformSecretProviders]
      operationId: retirePlatformSecretProviderDefinition
      description: If-Match fences the path-addressed provider definition ETag.
      parameters: [{ $ref: './secret-management-components.yml#/components/parameters/IfMatch' }]
      responses:
        '204': { description: Provider retired. }
        '409': { $ref: './secret-management-components.yml#/components/responses/Conflict' }
        '412': { $ref: './secret-management-components.yml#/components/responses/PreconditionFailed' }
        '428': { $ref: './secret-management-components.yml#/components/responses/PreconditionRequired' }
  /platform/admin/v1/application/secrets/storage/providers/{definitionId}/revisions:
    parameters: [{ $ref: './secret-management-components.yml#/components/parameters/DefinitionId' }]
    post:
      tags: [PlatformSecretProviders]
      operationId: createPlatformSecretProviderRevision
      description: If-Match fences the parent provider definition ETag.
      parameters:
        - { $ref: './secret-management-components.yml#/components/parameters/IfMatch' }
        - { $ref: './secret-management-components.yml#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: './secret-management-components.yml#/components/schemas/CreatePlatformProviderRevisionRequest' }
      responses:
        '201':
          description: Immutable candidate revision.
          headers: { ETag: { $ref: './secret-management-components.yml#/components/headers/ETag' } }
          content:
            application/json:
              schema: { $ref: './secret-management-components.yml#/components/schemas/ProviderRevisionSummary' }
        '409': { $ref: './secret-management-components.yml#/components/responses/Conflict' }
        '412': { $ref: './secret-management-components.yml#/components/responses/PreconditionFailed' }
        '428': { $ref: './secret-management-components.yml#/components/responses/PreconditionRequired' }
  /platform/admin/v1/application/secrets/storage/providers/{definitionId}/revisions/{revision}:
    parameters:
      - { $ref: './secret-management-components.yml#/components/parameters/DefinitionId' }
      - { $ref: './secret-management-components.yml#/components/parameters/Revision' }
    get:
      tags: [PlatformSecretProviders]
      operationId: getPlatformSecretProviderRevision
      responses:
        '200':
          description: Immutable provider revision and its current lifecycle version.
          headers: { ETag: { $ref: './secret-management-components.yml#/components/headers/ETag' } }
          content:
            application/json:
              schema: { $ref: './secret-management-components.yml#/components/schemas/ProviderRevisionSummary' }
  /platform/admin/v1/application/secrets/storage/providers/{definitionId}/revisions/{revision}/credentials:
    parameters:
      - { $ref: './secret-management-components.yml#/components/parameters/DefinitionId' }
      - { $ref: './secret-management-components.yml#/components/parameters/Revision' }
    post:
      tags: [PlatformSecretProviders]
      operationId: stagePlatformSecretProviderCredentials
      description: If-Match fences and bumps the path-addressed candidate revision aggregate ETag.
      parameters:
        - { $ref: './secret-management-components.yml#/components/parameters/IfMatch' }
        - { $ref: './secret-management-components.yml#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: './secret-management-components.yml#/components/schemas/StageProviderCredentialsRequest' }
      responses:
        '200':
          description: Redacted credential state.
          headers: { ETag: { $ref: './secret-management-components.yml#/components/headers/ETag' } }
          content:
            application/json:
              schema: { $ref: './secret-management-components.yml#/components/schemas/ProviderCredentialsState' }
        '409': { $ref: './secret-management-components.yml#/components/responses/Conflict' }
        '412': { $ref: './secret-management-components.yml#/components/responses/PreconditionFailed' }
        '428': { $ref: './secret-management-components.yml#/components/responses/PreconditionRequired' }
  /platform/admin/v1/application/secrets/storage/providers/{definitionId}/revisions/{revision}/test:
    parameters:
      - { $ref: './secret-management-components.yml#/components/parameters/DefinitionId' }
      - { $ref: './secret-management-components.yml#/components/parameters/Revision' }
    post:
      tags: [PlatformSecretProviders]
      operationId: testPlatformSecretProviderRevision
      description: If-Match fences and bumps the candidate revision aggregate ETag.
      parameters:
        - { $ref: './secret-management-components.yml#/components/parameters/IfMatch' }
        - { $ref: './secret-management-components.yml#/components/parameters/IdempotencyKey' }
      responses:
        '200':
          description: Sanitized connectivity and write/read/delete probe.
          headers: { ETag: { $ref: './secret-management-components.yml#/components/headers/ETag' } }
          content:
            application/json:
              schema: { $ref: './secret-management-components.yml#/components/schemas/ConnectivityTestResult' }
        '409': { $ref: './secret-management-components.yml#/components/responses/Conflict' }
        '412': { $ref: './secret-management-components.yml#/components/responses/PreconditionFailed' }
        '428': { $ref: './secret-management-components.yml#/components/responses/PreconditionRequired' }
  /platform/admin/v1/application/secrets/storage/providers/{definitionId}/revisions/{revision}/preflight:
    parameters:
      - { $ref: './secret-management-components.yml#/components/parameters/DefinitionId' }
      - { $ref: './secret-management-components.yml#/components/parameters/Revision' }
    post:
      tags: [PlatformSecretProviders]
      operationId: preflightPlatformSecretProviderRevision
      description: If-Match fences and bumps the candidate revision aggregate ETag.
      parameters:
        - { $ref: './secret-management-components.yml#/components/parameters/IfMatch' }
        - { $ref: './secret-management-components.yml#/components/parameters/IdempotencyKey' }
      responses:
        '200':
          description: Short-lived opaque migration preflight result for the path-addressed candidate.
          headers: { ETag: { $ref: './secret-management-components.yml#/components/headers/ETag' } }
          content:
            application/json:
              schema: { $ref: './secret-management-components.yml#/components/schemas/PreflightResult' }
        '409': { $ref: './secret-management-components.yml#/components/responses/Conflict' }
        '412': { $ref: './secret-management-components.yml#/components/responses/PreconditionFailed' }
        '428': { $ref: './secret-management-components.yml#/components/responses/PreconditionRequired' }
  /platform/admin/v1/application/secrets/storage/providers/{definitionId}/revisions/{revision}/ready:
    parameters:
      - { $ref: './secret-management-components.yml#/components/parameters/DefinitionId' }
      - { $ref: './secret-management-components.yml#/components/parameters/Revision' }
    post:
      tags: [PlatformSecretProviders]
      operationId: markPlatformSecretProviderRevisionReady
      description: If-Match fences and bumps the candidate revision aggregate ETag.
      parameters:
        - { $ref: './secret-management-components.yml#/components/parameters/IfMatch' }
        - { $ref: './secret-management-components.yml#/components/parameters/IdempotencyKey' }
      responses:
        '200':
          description: Candidate transitioned to immutable READY after successful test and preflight.
          headers: { ETag: { $ref: './secret-management-components.yml#/components/headers/ETag' } }
          content:
            application/json:
              schema: { $ref: './secret-management-components.yml#/components/schemas/ProviderRevisionSummary' }
        '409': { $ref: './secret-management-components.yml#/components/responses/Conflict' }
        '412': { $ref: './secret-management-components.yml#/components/responses/PreconditionFailed' }
        '428': { $ref: './secret-management-components.yml#/components/responses/PreconditionRequired' }
  /platform/admin/v1/application/secrets/storage/providers/{definitionId}/credentials/rotate:
    parameters:
      - { $ref: './secret-management-components.yml#/components/parameters/DefinitionId' }
    post:
      tags: [PlatformSecretProviders]
      operationId: rotatePlatformSecretProviderCredentials
      description: If-Match fences the path-addressed provider definition ETag.
      parameters:
        - { $ref: './secret-management-components.yml#/components/parameters/IfMatch' }
        - { $ref: './secret-management-components.yml#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: './secret-management-components.yml#/components/schemas/StageProviderCredentialsRequest' }
      responses:
        '202':
          description: Fenced credential rotation started.
          headers: { ETag: { $ref: './secret-management-components.yml#/components/headers/ETag' } }
          content:
            application/json:
              schema: { $ref: './secret-management-components.yml#/components/schemas/ProviderCredentialsState' }
        '409': { $ref: './secret-management-components.yml#/components/responses/Conflict' }
        '412': { $ref: './secret-management-components.yml#/components/responses/PreconditionFailed' }
        '428': { $ref: './secret-management-components.yml#/components/responses/PreconditionRequired' }
  /platform/admin/v1/application/secrets/offerings:
    get:
      tags: [PlatformSecretOfferings]
      operationId: listPlatformSecretOfferings
      responses:
        '200':
          description: Published offerings.
          headers: { ETag: { $ref: './secret-management-components.yml#/components/headers/ETag' } }
          content:
            application/json:
              schema:
                type: array
                items: { $ref: './secret-management-components.yml#/components/schemas/Offering' }
  /platform/admin/v1/application/secrets/offerings/providers:
    get:
      tags: [PlatformSecretOfferings]
      operationId: listPlatformSecretOfferingProviderDefinitions
      responses:
        '200':
          description: Platform-offering provider definitions.
          headers: { ETag: { $ref: './secret-management-components.yml#/components/headers/ETag' } }
          content:
            application/json:
              schema:
                type: array
                items: { $ref: './secret-management-components.yml#/components/schemas/ProviderDefinition' }
    post:
      tags: [PlatformSecretOfferings]
      operationId: createPlatformSecretOfferingProviderDefinition
      description: If-Match fences the offering-provider collection version returned by this collection GET.
      parameters:
        - { $ref: './secret-management-components.yml#/components/parameters/IfMatch' }
        - { $ref: './secret-management-components.yml#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: './secret-management-components.yml#/components/schemas/CreatePlatformOfferingProviderDefinitionRequest' }
      responses:
        '201':
          description: Candidate provider with route-derived platform-offering role.
          headers: { ETag: { $ref: './secret-management-components.yml#/components/headers/ETag' } }
          content:
            application/json:
              schema: { $ref: './secret-management-components.yml#/components/schemas/ProviderDefinition' }
        '409': { $ref: './secret-management-components.yml#/components/responses/Conflict' }
        '412': { $ref: './secret-management-components.yml#/components/responses/PreconditionFailed' }
        '428': { $ref: './secret-management-components.yml#/components/responses/PreconditionRequired' }
  /platform/admin/v1/application/secrets/offerings/providers/options:
    get:
      tags: [PlatformSecretOfferings]
      operationId: getPlatformSecretOfferingProviderSetupOptions
      description: Role-correct setup catalog filtered server-side to provider types, authentication modes, configuration fields, capabilities, and isolation modes eligible for backend-isolated platform offerings.
      responses:
        '200':
          description: Server-reported platform-offering provider setup options; storage-only and deployment-source providers are excluded.
          headers: { ETag: { $ref: './secret-management-components.yml#/components/headers/ETag' } }
          content:
            application/json:
              schema: { $ref: './secret-management-components.yml#/components/schemas/ProviderSetupCatalog' }
  /platform/admin/v1/application/secrets/offerings/providers/{definitionId}:
    parameters: [{ $ref: './secret-management-components.yml#/components/parameters/DefinitionId' }]
    get:
      tags: [PlatformSecretOfferings]
      operationId: getPlatformSecretOfferingProviderDefinition
      responses:
        '200':
          description: Path-addressed platform-offering provider definition.
          headers: { ETag: { $ref: './secret-management-components.yml#/components/headers/ETag' } }
          content:
            application/json:
              schema: { $ref: './secret-management-components.yml#/components/schemas/ProviderDefinition' }
    delete:
      tags: [PlatformSecretOfferings]
      operationId: retirePlatformSecretOfferingProviderDefinition
      description: If-Match fences the path-addressed provider definition; assigned, published, migration-retained, or otherwise referenced definitions cannot retire.
      parameters: [{ $ref: './secret-management-components.yml#/components/parameters/IfMatch' }]
      responses:
        '204': { description: Offering provider retired. }
        '409': { $ref: './secret-management-components.yml#/components/responses/Conflict' }
        '412': { $ref: './secret-management-components.yml#/components/responses/PreconditionFailed' }
        '428': { $ref: './secret-management-components.yml#/components/responses/PreconditionRequired' }
  /platform/admin/v1/application/secrets/offerings/providers/{definitionId}/revisions:
    parameters: [{ $ref: './secret-management-components.yml#/components/parameters/DefinitionId' }]
    post:
      tags: [PlatformSecretOfferings]
      operationId: createPlatformSecretOfferingProviderRevision
      description: If-Match fences the parent platform-offering provider definition ETag.
      parameters:
        - { $ref: './secret-management-components.yml#/components/parameters/IfMatch' }
        - { $ref: './secret-management-components.yml#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: './secret-management-components.yml#/components/schemas/CreatePlatformOfferingProviderRevisionRequest' }
      responses:
        '201':
          description: Immutable platform-offering candidate revision.
          headers: { ETag: { $ref: './secret-management-components.yml#/components/headers/ETag' } }
          content:
            application/json:
              schema: { $ref: './secret-management-components.yml#/components/schemas/ProviderRevisionSummary' }
        '409': { $ref: './secret-management-components.yml#/components/responses/Conflict' }
        '412': { $ref: './secret-management-components.yml#/components/responses/PreconditionFailed' }
        '428': { $ref: './secret-management-components.yml#/components/responses/PreconditionRequired' }
  /platform/admin/v1/application/secrets/offerings/providers/{definitionId}/revisions/{revision}:
    parameters:
      - { $ref: './secret-management-components.yml#/components/parameters/DefinitionId' }
      - { $ref: './secret-management-components.yml#/components/parameters/Revision' }
    get:
      tags: [PlatformSecretOfferings]
      operationId: getPlatformSecretOfferingProviderRevision
      responses:
        '200':
          description: Immutable platform-offering provider revision and lifecycle version.
          headers: { ETag: { $ref: './secret-management-components.yml#/components/headers/ETag' } }
          content:
            application/json:
              schema: { $ref: './secret-management-components.yml#/components/schemas/ProviderRevisionSummary' }
  /platform/admin/v1/application/secrets/offerings/providers/{definitionId}/revisions/{revision}/credentials:
    parameters:
      - { $ref: './secret-management-components.yml#/components/parameters/DefinitionId' }
      - { $ref: './secret-management-components.yml#/components/parameters/Revision' }
    post:
      tags: [PlatformSecretOfferings]
      operationId: stagePlatformSecretOfferingProviderCredentials
      description: If-Match fences and bumps the path-addressed offering candidate revision aggregate ETag; explicit confirmed clear requests use the same fenced transition.
      parameters:
        - { $ref: './secret-management-components.yml#/components/parameters/IfMatch' }
        - { $ref: './secret-management-components.yml#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: './secret-management-components.yml#/components/schemas/StageProviderCredentialsRequest' }
      responses:
        '200':
          description: Redacted credential state.
          headers: { ETag: { $ref: './secret-management-components.yml#/components/headers/ETag' } }
          content:
            application/json:
              schema: { $ref: './secret-management-components.yml#/components/schemas/ProviderCredentialsState' }
        '409': { $ref: './secret-management-components.yml#/components/responses/Conflict' }
        '412': { $ref: './secret-management-components.yml#/components/responses/PreconditionFailed' }
        '428': { $ref: './secret-management-components.yml#/components/responses/PreconditionRequired' }
  /platform/admin/v1/application/secrets/offerings/providers/{definitionId}/revisions/{revision}/test:
    parameters:
      - { $ref: './secret-management-components.yml#/components/parameters/DefinitionId' }
      - { $ref: './secret-management-components.yml#/components/parameters/Revision' }
    post:
      tags: [PlatformSecretOfferings]
      operationId: testPlatformSecretOfferingProviderRevision
      description: If-Match fences and bumps the candidate revision aggregate ETag.
      parameters:
        - { $ref: './secret-management-components.yml#/components/parameters/IfMatch' }
        - { $ref: './secret-management-components.yml#/components/parameters/IdempotencyKey' }
      responses:
        '200':
          description: Sanitized platform-provisioner authentication and backend-isolation probe.
          headers: { ETag: { $ref: './secret-management-components.yml#/components/headers/ETag' } }
          content:
            application/json:
              schema: { $ref: './secret-management-components.yml#/components/schemas/ConnectivityTestResult' }
        '409': { $ref: './secret-management-components.yml#/components/responses/Conflict' }
        '412': { $ref: './secret-management-components.yml#/components/responses/PreconditionFailed' }
        '428': { $ref: './secret-management-components.yml#/components/responses/PreconditionRequired' }
  /platform/admin/v1/application/secrets/offerings/providers/{definitionId}/revisions/{revision}/preflight:
    parameters:
      - { $ref: './secret-management-components.yml#/components/parameters/DefinitionId' }
      - { $ref: './secret-management-components.yml#/components/parameters/Revision' }
    post:
      tags: [PlatformSecretOfferings]
      operationId: preflightPlatformSecretOfferingProviderRevision
      description: If-Match fences and bumps the candidate revision aggregate ETag.
      parameters:
        - { $ref: './secret-management-components.yml#/components/parameters/IfMatch' }
        - { $ref: './secret-management-components.yml#/components/parameters/IdempotencyKey' }
      responses:
        '200':
          description: Short-lived opaque preflight result proving offering provisioner readiness and backend-enforced isolation.
          headers: { ETag: { $ref: './secret-management-components.yml#/components/headers/ETag' } }
          content:
            application/json:
              schema: { $ref: './secret-management-components.yml#/components/schemas/PreflightResult' }
        '409': { $ref: './secret-management-components.yml#/components/responses/Conflict' }
        '412': { $ref: './secret-management-components.yml#/components/responses/PreconditionFailed' }
        '428': { $ref: './secret-management-components.yml#/components/responses/PreconditionRequired' }
  /platform/admin/v1/application/secrets/offerings/providers/{definitionId}/revisions/{revision}/ready:
    parameters:
      - { $ref: './secret-management-components.yml#/components/parameters/DefinitionId' }
      - { $ref: './secret-management-components.yml#/components/parameters/Revision' }
    post:
      tags: [PlatformSecretOfferings]
      operationId: markPlatformSecretOfferingProviderRevisionReady
      description: If-Match fences and bumps the candidate revision aggregate ETag; READY requires the persisted, unexpired preflight for this exact revision.
      parameters:
        - { $ref: './secret-management-components.yml#/components/parameters/IfMatch' }
        - { $ref: './secret-management-components.yml#/components/parameters/IdempotencyKey' }
      responses:
        '200':
          description: Candidate transitioned to immutable READY.
          headers: { ETag: { $ref: './secret-management-components.yml#/components/headers/ETag' } }
          content:
            application/json:
              schema: { $ref: './secret-management-components.yml#/components/schemas/ProviderRevisionSummary' }
        '409': { $ref: './secret-management-components.yml#/components/responses/Conflict' }
        '412': { $ref: './secret-management-components.yml#/components/responses/PreconditionFailed' }
        '428': { $ref: './secret-management-components.yml#/components/responses/PreconditionRequired' }
  /platform/admin/v1/application/secrets/offerings/providers/{definitionId}/credentials/rotate:
    parameters: [{ $ref: './secret-management-components.yml#/components/parameters/DefinitionId' }]
    post:
      tags: [PlatformSecretOfferings]
      operationId: rotatePlatformSecretOfferingProviderCredentials
      description: If-Match fences the path-addressed provider definition ETag and rotates only the published revision resolved by the server.
      parameters:
        - { $ref: './secret-management-components.yml#/components/parameters/IfMatch' }
        - { $ref: './secret-management-components.yml#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: './secret-management-components.yml#/components/schemas/StageProviderCredentialsRequest' }
      responses:
        '202':
          description: Fenced offering-provisioner credential rotation started.
          headers: { ETag: { $ref: './secret-management-components.yml#/components/headers/ETag' } }
          content:
            application/json:
              schema: { $ref: './secret-management-components.yml#/components/schemas/ProviderCredentialsState' }
        '409': { $ref: './secret-management-components.yml#/components/responses/Conflict' }
        '412': { $ref: './secret-management-components.yml#/components/responses/PreconditionFailed' }
        '428': { $ref: './secret-management-components.yml#/components/responses/PreconditionRequired' }
  /platform/admin/v1/application/secrets/offerings/providers/{definitionId}/revisions/{revision}/publish:
    parameters:
      - { $ref: './secret-management-components.yml#/components/parameters/DefinitionId' }
      - { $ref: './secret-management-components.yml#/components/parameters/Revision' }
    post:
      tags: [PlatformSecretOfferings]
      operationId: publishPlatformSecretOffering
      description: If-Match fences the path-addressed READY provider revision ETag.
      parameters:
        - { $ref: './secret-management-components.yml#/components/parameters/IfMatch' }
        - { $ref: './secret-management-components.yml#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
