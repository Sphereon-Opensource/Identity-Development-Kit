openapi: 3.0.4
info:
  title: Wallet Unit API Components
  version: 0.1.0
  description: Entity schemas, enums, and parameters for the Wallet Unit REST API.
paths: {}
components:
  parameters:
    WalletUnitId:
      name: walletUnitId
      in: path
      required: true
      description: Stable wallet unit identifier.
      schema:
        type: string
    AttestationKind:
      name: kind
      in: path
      required: true
      description: Wallet attestation kind.
      schema:
        $ref: '#/components/schemas/WalletUnitAttestationKind'
    AttestationRef:
      name: attestationRef
      in: path
      required: true
      description: Stored wallet attestation reference.
      schema:
        type: string

  schemas:
    StringMap:
      type: object
      description: String-valued evidence or metadata map. Keys are stable evidence names; values are already serialized for audit and transport.
      additionalProperties:
        type: string
      example:
        proofTranscriptDigest: sha256:2f20b6f6e7f1d36f8f6d35d27a5f093b6f2e4b2e
        providerId: production-activation-provider
        productionCapable: 'true'

    JsonObject:
      type: object
      description: Arbitrary JSON object preserved as supplied.
      additionalProperties: true
      example:
        keys:
          - kty: EC
            crv: P-256
            kid: wallet-provider-signing-key-1

    WalletUnitLifecycleState:
      type: string
      description: Persisted lifecycle state for a Wallet Unit. VALID means the production evidence gate has accepted the unit; REVOKED and UNINSTALLED are terminal for signing.
      enum: [INSTALLED, OPERATIONAL, VALID, REVOKED, UNINSTALLED]

    WalletAccountStatus:
      type: string
      description: Operational status of the wallet account that owns one or more Wallet Units.
      enum: [ACTIVE, SUSPENDED, LOCKED, REVOKED, UNINSTALLED]

    WalletUnitLifecycleEventType:
      type: string
      description: Audit event type recorded when a Wallet Unit lifecycle transition is persisted.
      enum: [INSTALLED, MARKED_OPERATIONAL, VALIDATED, REVOKED, UNINSTALLED]

    WalletLifecycleEvent:
      type: object
      description: Immutable lifecycle audit entry with caller-supplied evidence and the service timestamp.
      required: [type, occurredAt, evidence]
      example:
        type: VALIDATED
        occurredAt: '2026-07-02T08:10:00Z'
        reason: production evidence accepted
        evidence:
          validationEvidenceSummaryId: valid-summary-wu-7f9d
      properties:
        type:
          $ref: '#/components/schemas/WalletUnitLifecycleEventType'
        occurredAt:
          type: string
          format: date-time
        reason:
          type: string
          nullable: true
        evidence:
          $ref: '#/components/schemas/StringMap'

    WalletCounterState:
      type: object
      description: Monotonic counters used for activation retry handling and accepted or denied activation decisions.
      required: [activationSequence, failedActivationAttempts, acceptedActivationDecisions, rejectedActivationDecisions]
      example:
        activationSequence: 3
        failedActivationAttempts: 0
        acceptedActivationDecisions: 2
        rejectedActivationDecisions: 0
      properties:
        activationSequence:
          type: integer
          format: int64
          default: 0
        failedActivationAttempts:
          type: integer
          default: 0
        acceptedActivationDecisions:
          type: integer
          format: int64
          default: 0
        rejectedActivationDecisions:
          type: integer
          format: int64
          default: 0

    WalletTransactionRecord:
      type: object
      description: Audit record for a wallet-key operation that was evaluated against an activation decision and policy evidence.
      required: [transactionId, operationType, operationHash, recordedAt, status, evidence]
      example:
        transactionId: tx-sign-20260702-1
        operationType: wallet.wscd.sign-digest
        operationHash: sha256:7f1a6aa671f1a2d1c3c2e994c09e3f87c4ac44d6
        decisionId: act-20260702-0001
        recordedAt: '2026-07-02T08:16:00Z'
        status: SIGNED
        evidence:
          policyGrantId: grant-20260702-1
      properties:
        transactionId:
          type: string
        operationType:
          type: string
        operationHash:
          type: string
        decisionId:
          type: string
          nullable: true
        recordedAt:
          type: string
          format: date-time
        status:
          type: string
        evidence:
          $ref: '#/components/schemas/StringMap'

    WalletAccountRecord:
      type: object
      description: Wallet account state shared by Wallet Units, including key references, policies, counters, and lifecycle audit history.
      required: [walletAccountId, remoteKeyRefs, policyRefs, counters, status, lifecycleHistory, transactionRecords, createdAt, updatedAt]
      example:
        walletAccountId: wa-42
        remoteKeyRefs: [wallet-signing-key-1]
        policyRefs: [wallet-unit-production-valid]
        counters:
          activationSequence: 3
          failedActivationAttempts: 0
          acceptedActivationDecisions: 2
          rejectedActivationDecisions: 0
        status: ACTIVE
        lifecycleHistory: []
        transactionRecords: []
        createdAt: '2026-07-02T08:00:00Z'
        updatedAt: '2026-07-02T08:10:00Z'
      properties:
        walletAccountId:
          type: string
        remoteKeyRefs:
          type: array
          items:
            type: string
        policyRefs:
          type: array
          items:
            type: string
        counters:
          $ref: '#/components/schemas/WalletCounterState'
        status:
          $ref: '#/components/schemas/WalletAccountStatus'
        lifecycleHistory:
          type: array
          items:
            $ref: '#/components/schemas/WalletLifecycleEvent'
        transactionRecords:
          type: array
          items:
            $ref: '#/components/schemas/WalletTransactionRecord'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    WalletUnitRecord:
      type: object
      description: Persisted Wallet Unit state. The record links lifecycle state, allowed remote key refs, policy refs, activation key refs, and immutable audit history.
      required: [walletUnitId, walletAccountId, status, remoteKeyRefs, policyRefs, counters, accountStatus, lifecycleHistory, transactionRecords, createdAt, updatedAt]
      example:
        walletUnitId: wu-7f9d
        walletAccountId: wa-42
        status: VALID
        activationKeyRef: wallet-unit-activation-key
        remoteKeyRefs: [wallet-signing-key-1]
        policyRefs: [wallet-unit-production-valid]
        counters:
          activationSequence: 3
          failedActivationAttempts: 0
          acceptedActivationDecisions: 2
          rejectedActivationDecisions: 0
        accountStatus: ACTIVE
        lifecycleHistory: []
        transactionRecords: []
        createdAt: '2026-07-02T08:00:00Z'
        updatedAt: '2026-07-02T08:10:00Z'
        revokedAt: null
        uninstalledAt: null
      properties:
        walletUnitId:
          type: string
        walletAccountId:
          type: string
        status:
          $ref: '#/components/schemas/WalletUnitLifecycleState'
        activationKeyRef:
          type: string
          nullable: true
        remoteKeyRefs:
          type: array
          items:
            type: string
        policyRefs:
          type: array
          items:
            type: string
        counters:
          $ref: '#/components/schemas/WalletCounterState'
        accountStatus:
          $ref: '#/components/schemas/WalletAccountStatus'
        lifecycleHistory:
          type: array
          items:
            $ref: '#/components/schemas/WalletLifecycleEvent'
        transactionRecords:
          type: array
          items:
            $ref: '#/components/schemas/WalletTransactionRecord'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        revokedAt:
          type: string
          format: date-time
          nullable: true
        uninstalledAt:
          type: string
          format: date-time
          nullable: true

    WalletUnitLifecycleResult:
      type: object
      description: Current Wallet Unit and account state after a lifecycle command.
      required: [unit, account]
      example:
        unit:
          walletUnitId: wu-7f9d
          walletAccountId: wa-42
          status: VALID
          activationKeyRef: wallet-unit-activation-key
          remoteKeyRefs: [wallet-signing-key-1]
          policyRefs: [wallet-unit-production-valid]
          counters:
            activationSequence: 3
            failedActivationAttempts: 0
            acceptedActivationDecisions: 2
            rejectedActivationDecisions: 0
          accountStatus: ACTIVE
          lifecycleHistory:
            - type: INSTALLED
              occurredAt: '2026-07-02T08:00:00Z'
              reason: initial enrollment
              evidence:
                installationChannel: tenant-admin
          transactionRecords: []
          createdAt: '2026-07-02T08:00:00Z'
          updatedAt: '2026-07-02T08:10:00Z'
          revokedAt: null
          uninstalledAt: null
        account:
          walletAccountId: wa-42
          remoteKeyRefs: [wallet-signing-key-1]
          policyRefs: [wallet-unit-production-valid]
          counters:
            activationSequence: 3
            failedActivationAttempts: 0
            acceptedActivationDecisions: 2
            rejectedActivationDecisions: 0
          status: ACTIVE
          lifecycleHistory: []
          transactionRecords: []
          createdAt: '2026-07-02T08:00:00Z'
          updatedAt: '2026-07-02T08:10:00Z'
      properties:
        unit:
          $ref: '#/components/schemas/WalletUnitRecord'
        account:
          $ref: '#/components/schemas/WalletAccountRecord'

    ListWalletUnitsResult:
      type: object
      description: Page-free result for Wallet Unit lookup commands. Filtering is supplied by query parameters on the list endpoint.
      required: [units]
      example:
        units:
          - walletUnitId: wu-7f9d
            walletAccountId: wa-42
            status: OPERATIONAL
            remoteKeyRefs: [wallet-signing-key-1]
            policyRefs: [wallet-unit-production-valid]
            counters:
              activationSequence: 1
              failedActivationAttempts: 0
              acceptedActivationDecisions: 1
              rejectedActivationDecisions: 0
            accountStatus: ACTIVE
            lifecycleHistory: []
            transactionRecords: []
            createdAt: '2026-07-02T08:00:00Z'
            updatedAt: '2026-07-02T08:05:00Z'
      properties:
        units:
          type: array
          items:
            $ref: '#/components/schemas/WalletUnitRecord'

    InstallWalletUnitHttpRequest:
      type: object
      description: Installs a Wallet Unit and optionally binds it to wallet account and unit parties in one request. Every unit carries exactly one Wallet Instance, so the instance identifier is required at install time.
      required: [walletUnitId, walletAccountId, walletInstanceId]
      example:
        walletUnitId: wu-7f9d
        walletAccountId: wa-42
        walletInstanceId: wi-7f9d
        activationKeyRef: wallet-unit-activation-key
        remoteKeyRefs: [wallet-signing-key-1]
        policyRefs: [wallet-unit-production-valid]
        evidence:
          installationChannel: tenant-admin
          deviceBinding: strong
        walletAccountPartyId: 9ad1a503-b3cb-4c72-86a7-2f226e146f04
        walletUnitPartyId: 88f2f6e5-9fd0-4124-9c8f-305a381ceec3
        ownerPartyId: f2e85bc5-5f76-4c12-bfb1-8ec5cc37fc39
        operatorPartyIds: [6a9c80c7-738f-46cc-9145-098a57f05638]
        partyBindingEvidence:
          relationshipSource: tenant-operator
      properties:
        walletUnitId:
          type: string
        walletAccountId:
          type: string
        walletInstanceId:
          type: string
          description: Identifier of the single Wallet Instance this unit contains.
        activationKeyRef:
          type: string
          nullable: true
        remoteKeyRefs:
          type: array
          items:
            type: string
        policyRefs:
          type: array
          items:
            type: string
        evidence:
          $ref: '#/components/schemas/StringMap'
        walletAccountPartyId:
          type: string
          format: uuid
          nullable: true
        holderPartyId:
          type: string
          format: uuid
          nullable: true
        walletUnitPartyId:
          type: string
          format: uuid
          nullable: true
        ownerPartyId:
          type: string
          format: uuid
          nullable: true
          description: Party that owns the wallet unit. Ownership and operation bindings require walletUnitPartyId.
        operatorPartyIds:
          type: array
          uniqueItems: true
          description: Parties currently authorized to operate the wallet unit.
          items: { type: string, format: uuid }
        partyBindingEvidence:
          $ref: '#/components/schemas/StringMap'

    WalletUnitTransitionHttpRequest:
      type: object
      description: Optional reason and evidence used when moving a Wallet Unit to OPERATIONAL, VALID, REVOKED, or UNINSTALLED.
      example:
        reason: production evidence complete
        evidence:
          validationEvidenceSummaryId: valid-summary-wu-7f9d
          activationProofSessionId: aps-20260702-1
      properties:
        reason:
          type: string
          nullable: true
        evidence:
          $ref: '#/components/schemas/StringMap'

    WalletUnitPartyBindingHttpRequest:
      type: object
      description: Updates the party identifiers linked to a Wallet Unit. `holderPartyId` is accepted as an alias for wallet account party input on this endpoint.
      example:
        walletAccountId: wa-42
        walletAccountPartyId: 9ad1a503-b3cb-4c72-86a7-2f226e146f04
        walletUnitPartyId: 88f2f6e5-9fd0-4124-9c8f-305a381ceec3
        ownerPartyId: f2e85bc5-5f76-4c12-bfb1-8ec5cc37fc39
        operatorPartyIds: [6a9c80c7-738f-46cc-9145-098a57f05638]
        evidence:
          source: party-registry
      properties:
        walletAccountId:
          type: string
          nullable: true
        walletAccountPartyId:
          type: string
          format: uuid
          nullable: true
        holderPartyId:
          type: string
          format: uuid
          nullable: true
        walletUnitPartyId:
          type: string
          format: uuid
          nullable: true
        ownerPartyId:
          type: string
          format: uuid
          nullable: true
          description: Party that owns the wallet unit. Ownership and operation bindings require walletUnitPartyId.
        operatorPartyIds:
          type: array
          uniqueItems: true
          description: Parties currently authorized to operate the wallet unit.
          items: { type: string, format: uuid }
        evidence:
          $ref: '#/components/schemas/StringMap'

    WalletUnitPartyRelationshipHint:
      type: object
      description: Optional relationship hint emitted with a party binding so callers can link wallet-account and wallet-unit parties in their party graph.
      required: [leftPartyId, rightPartyId, relationshipType]
      example:
        leftPartyId: 9ad1a503-b3cb-4c72-86a7-2f226e146f04
        rightPartyId: 88f2f6e5-9fd0-4124-9c8f-305a381ceec3
        relationshipType: WALLET_ACCOUNT_OWNS_WALLET_UNIT
      properties:
        leftPartyId:
          type: string
          format: uuid
        rightPartyId:
          type: string
          format: uuid
        relationshipType:
          type: string

    WalletUnitPartyBindingRecord:
      type: object
      description: Persisted association between Wallet Unit/account identifiers and VDX party identifiers, including relationship hints and provenance.
      required: [walletUnitId, walletAccountId, operatorPartyIds, relationshipHints, evidence, createdAt, updatedAt]
      example:
        walletUnitId: wu-7f9d
        walletAccountId: wa-42
        walletAccountPartyId: 9ad1a503-b3cb-4c72-86a7-2f226e146f04
        walletUnitPartyId: 88f2f6e5-9fd0-4124-9c8f-305a381ceec3
        ownerPartyId: f2e85bc5-5f76-4c12-bfb1-8ec5cc37fc39
        operatorPartyIds: [6a9c80c7-738f-46cc-9145-098a57f05638]
        relationshipHints:
          - leftPartyId: 88f2f6e5-9fd0-4124-9c8f-305a381ceec3
            rightPartyId: f2e85bc5-5f76-4c12-bfb1-8ec5cc37fc39
            relationshipType: OWNED_BY
          - leftPartyId: 88f2f6e5-9fd0-4124-9c8f-305a381ceec3
            rightPartyId: 6a9c80c7-738f-46cc-9145-098a57f05638
            relationshipType: OPERATED_BY
        evidence:
          source: party-registry
        createdAt: '2026-07-02T08:00:00Z'
        updatedAt: '2026-07-02T08:00:00Z'
      properties:
        walletUnitId:
          type: string
        walletAccountId:
          type: string
        walletAccountPartyId:
          type: string
          format: uuid
          nullable: true
        walletUnitPartyId:
          type: string
          format: uuid
          nullable: true
        ownerPartyId:
          type: string
          format: uuid
          nullable: true
          description: Party that owns the wallet unit.
        operatorPartyIds:
          type: array
          uniqueItems: true
          description: Parties authorized to operate the wallet unit.
          items: { type: string, format: uuid }
        relationshipHints:
          type: array
          items:
            $ref: '#/components/schemas/WalletUnitPartyRelationshipHint'
        evidence:
          $ref: '#/components/schemas/StringMap'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ListWalletUnitPartyBindingsResult:
      type: object
      description: Result for party-binding lookup commands.
      required: [bindings]
      example:
        bindings:
          - walletUnitId: wu-7f9d
            walletAccountId: wa-42
            walletAccountPartyId: 9ad1a503-b3cb-4c72-86a7-2f226e146f04
            walletUnitPartyId: 88f2f6e5-9fd0-4124-9c8f-305a381ceec3
            operatorPartyIds: []
            relationshipHints: []
            evidence:
              source: party-registry
            createdAt: '2026-07-02T08:00:00Z'
            updatedAt: '2026-07-02T08:00:00Z'
      properties:
        bindings:
          type: array
          items:
            $ref: '#/components/schemas/WalletUnitPartyBindingRecord'

    PasskeyOwnerScopeType:
      type: string
      description: Owner scope for a passkey credential or challenge. Passkey credentials are attached to an Identity.
      enum: [IDENTITY]

    PasskeyOwnerScope:
      type: object
      description: Tenant-scoped owner of a passkey ceremony or credential.
      required: [type, ownerId]
      properties:
        type:
          $ref: '#/components/schemas/PasskeyOwnerScopeType'
        ownerId:
          type: string
        tenantId:
          type: string
          nullable: true

    PasskeyCeremonyPurpose:
      type: string
      description: Purpose bound into a passkey challenge.
      enum: [IDENTITY_LOGIN, OIDC_STEP_UP, WALLET_ACTIVATION]

    PasskeyBackupStatePolicy:
      type: string
      description: Policy for WebAuthn backup eligibility and backup state metadata.
      enum: [ALLOW_ANY, REQUIRE_BACKUP_ELIGIBLE, REQUIRE_BACKED_UP, FORBID_BACKED_UP]

    PasskeyCredentialStatus:
      type: string
      description: Lifecycle status for a stored public passkey credential.
      enum: [ACTIVE, SUSPENDED, REVOKED]

    WebAuthnRpPolicy:
      type: object
      description: Typed relying-party policy enforced by WebAuthn registration and assertion verification.
      required: [rpId, allowedOrigins]
      properties:
        rpId:
          type: string
        allowedOrigins:
          type: array
          uniqueItems: true
          items:
            type: string
            format: uri
        attestationPolicy:
          type: string
          enum: [none, indirect, direct, enterprise]
          default: none
        userVerification:
          type: string
          enum: [required, preferred, discouraged]
          default: required
        allowedTransports:
          type: array
          uniqueItems: true
          items:
            type: string
        backupStatePolicy:
          $ref: '#/components/schemas/PasskeyBackupStatePolicy'
        challengeTtlSeconds:
          type: integer
          format: int64
          default: 300
        level3PrfEnabled:
          type: boolean
          default: false

    BeginPasskeyRegistrationRequest:
      type: object
      description: Starts registration of one WebAuthn passkey as an authentication method attached to an Identity and Identifier.
      required: [ownerScope, rpPolicy, purpose, expectedOrigin, identityId, identityIdentifierId, credentialIdentifierLookup]
      properties:
        ownerScope:
          $ref: '#/components/schemas/PasskeyOwnerScope'
        rpPolicy:
          $ref: '#/components/schemas/WebAuthnRpPolicy'
        purpose:
          $ref: '#/components/schemas/PasskeyCeremonyPurpose'
        expectedOrigin:
          type: string
          format: uri
        identityId:
          type: string
        identityIdentifierId:
          type: string
        credentialIdentifierLookup:
          type: string
          description: Protected lookup value for the passkey credential Identifier; raw credential secrets are not stored here.
        userHandle:
          type: string
          nullable: true
        displayName:
          type: string
          nullable: true

    BeginPasskeyAssertionRequest:
      type: object
      description: Starts a WebAuthn assertion challenge for login, step-up, or wallet activation.
      required: [rpPolicy, purpose, expectedOrigin]
      properties:
        ownerScope:
          $ref: '#/components/schemas/PasskeyOwnerScope'
          nullable: true
        rpPolicy:
          $ref: '#/components/schemas/WebAuthnRpPolicy'
        purpose:
          $ref: '#/components/schemas/PasskeyCeremonyPurpose'
        expectedOrigin:
          type: string
          format: uri
        credentialId:
          type: string
          nullable: true
        credentialIdentifierLookup:
          type: string
          nullable: true
        walletUnitId:
          type: string
          nullable: true
        walletAccountId:
          type: string
          nullable: true
        methodId:
          type: string
          nullable: true
        operationType:
          type: string
          nullable: true
        operationHash:
          type: string
          nullable: true
        nonce:
          type: string
          nullable: true
        audience:
          type: string
          nullable: true

    PasskeyCeremonyOptions:
      type: object
      description: WebAuthn options for browser or wallet edge credential APIs.
      required: [challengeId, challenge, rpId, rpName, allowedOrigins, userVerification, attestationPolicy, allowedTransports, level3PrfEnabled, expiresAt, credentialIds]
      properties:
        challengeId:
          type: string
        challenge:
          type: string
        rpId:
          type: string
        rpName:
          type: string
        allowedOrigins:
          type: array
          uniqueItems: true
          items:
            type: string
            format: uri
        userVerification:
          type: string
        attestationPolicy:
          type: string
        allowedTransports:
          type: array
          uniqueItems: true
          items:
            type: string
        level3PrfEnabled:
          type: boolean
        expiresAt:
          type: string
          format: date-time
        credentialIds:
          type: array
          uniqueItems: true
          items:
            type: string

    FinishPasskeyRegistrationRequest:
      type: object
      description: Finishes WebAuthn registration with public credential material from the browser or wallet edge.
      required: [challengeId, ownerScope, rpPolicy, credentialId, identityId, identityIdentifierId, credentialIdentifierLookup, attestationObject, clientDataJson, origin, rpId]
      properties:
        challengeId:
          type: string
        ownerScope:
          $ref: '#/components/schemas/PasskeyOwnerScope'
        rpPolicy:
          $ref: '#/components/schemas/WebAuthnRpPolicy'
        credentialId:
          type: string
        identityId:
          type: string
        identityIdentifierId:
          type: string
        credentialIdentifierLookup:
          type: string
        attestationObject:
          type: string
        clientDataJson:
          type: string
        origin:
          type: string
          format: uri
        rpId:
          type: string
        transports:
          type: array
          uniqueItems: true
          items:
            type: string

    FinishPasskeyAssertionRequest:
      type: object
      description: Finishes WebAuthn assertion with browser or wallet edge authenticator output. ownerScope may be omitted for a discoverable assertion; the server resolves and verifies the credential owner.
      required: [challengeId, rpPolicy, credentialId, authenticatorData, clientDataJson, signature, origin, rpId]
      properties:
        challengeId:
          type: string
        ownerScope:
          $ref: '#/components/schemas/PasskeyOwnerScope'
          nullable: true
        rpPolicy:
          $ref: '#/components/schemas/WebAuthnRpPolicy'
        credentialId:
          type: string
        authenticatorData:
          type: string
        clientDataJson:
          type: string
        signature:
          type: string
        origin:
          type: string
          format: uri
        rpId:
          type: string
        transport:
          type: string
          nullable: true
        expectedPurpose:
          $ref: '#/components/schemas/PasskeyCeremonyPurpose'
          nullable: true

    PasskeyCredentialRecord:
      type: object
      description: Stored public passkey credential and Identity/Identifier binding metadata. Private keys, PINs, raw PRF output, and assertion secrets are not stored.
      required: [credentialId, identityId, identityIdentifierId, credentialIdentifierLookup, cosePublicKey, registrationClientDataJson, attestationObject, rpId, allowedOrigins, ownerScope, transports, prfCapable, status, enrolledAt]
      properties:
        credentialId:
          type: string
        identityId:
          type: string
        identityIdentifierId:
          type: string
        credentialIdentifierLookup:
          type: string
        cosePublicKey:
          type: string
        registrationClientDataJson:
          type: string
        attestationObject:
          type: string
        rpId:
          type: string
        allowedOrigins:
          type: array
          uniqueItems: true
          items:
            type: string
            format: uri
        ownerScope:
          $ref: '#/components/schemas/PasskeyOwnerScope'
        userHandle:
          type: string
          nullable: true
        transports:
          type: array
          uniqueItems: true
          items:
            type: string
        signCount:
          type: integer
          format: int64
          nullable: true
        attestationFormat:
          type: string
          nullable: true
        attestationTrustPathRef:
          type: string
          nullable: true
        backupEligible:
          type: boolean
          nullable: true
        backupState:
          type: boolean
          nullable: true
        prfCapable:
          type: boolean
        status:
          $ref: '#/components/schemas/PasskeyCredentialStatus'
        enrolledAt:
          type: string
          format: date-time
        lastUsedAt:
          type: string
          format: date-time
          nullable: true
        revokedAt:
          type: string
          format: date-time
          nullable: true

    PasskeyAssertionEvidence:
      type: object
      description: Verified assertion metadata bound to the passkey challenge and optional wallet operation.
      required: [credentialId, challengeId, rpId, origin, userVerified, prfCapable, evidence]
      properties:
        credentialId:
          type: string
        challengeId:
          type: string
        rpId:
          type: string
        origin:
          type: string
          format: uri
        userVerified:
          type: boolean
        walletUnitId:
          type: string
          nullable: true
        walletAccountId:
          type: string
          nullable: true
        methodId:
          type: string
          nullable: true
        operationType:
          type: string
          nullable: true
        operationHash:
          type: string
          nullable: true
        nonce:
          type: string
          nullable: true
        audience:
          type: string
          nullable: true
        signCount:
          type: integer
          format: int64
          nullable: true
        backupEligible:
          type: boolean
          nullable: true
        backupState:
          type: boolean
          nullable: true
        prfCapable:
          type: boolean
        attestationFormat:
          type: string
          nullable: true
        evidence:
          $ref: '#/components/schemas/StringMap'

    BeginPasskeyActivationRequest:
      type: object
      description: Starts an operation-bound passkey assertion for Wallet Unit activation with remote WSCD signing remaining behind the signing endpoints.
      required: [walletUnitId, walletAccountId, activationKeyRef, operationKeyRef, operationType, operationBinding, operationHash, nonce, audience, ownerScope, rpPolicy, expectedOrigin]
      properties:
        walletUnitId:
          type: string
        walletAccountId:
          type: string
        activationKeyRef:
          type: string
        operationKeyRef:
          type: string
          minLength: 1
        operationType:
          type: string
        operationBinding:
          type: string
          minLength: 1
        operationHash:
          type: string
        nonce:
          type: string
        audience:
          type: string
        ownerScope:
          $ref: '#/components/schemas/PasskeyOwnerScope'
        rpPolicy:
          $ref: '#/components/schemas/WebAuthnRpPolicy'
        expectedOrigin:
          type: string
          format: uri
        credentialId:
          type: string
          nullable: true

    FinishPasskeyActivationDecisionRequest:
      type: object
      description: Finishes a passkey wallet activation assertion and issues an operation-bound activation decision.
      required: [walletUnitId, walletAccountId, activationKeyRef, operationKeyRef, operationType, operationBinding, operationHash, nonce, audience, assertion]
      properties:
        walletUnitId:
          type: string
        walletAccountId:
          type: string
        activationKeyRef:
          type: string
        operationKeyRef:
          type: string
          minLength: 1
        operationType:
          type: string
          minLength: 1
        operationBinding:
          type: string
          minLength: 1
        operationHash:
          type: string
          minLength: 1
        nonce:
          type: string
          minLength: 1
        audience:
          type: string
          minLength: 1
        assertion:
          $ref: '#/components/schemas/FinishPasskeyAssertionRequest'

    BlindPinActivationProfile:
      type: string
      description: Activation proof profile. Test profiles remain explicit and are not sufficient for production Wallet Unit VALID evidence.
      enum: [DETERMINISTIC_EVALUATION, PIN_DERIVED_SIGNATURE]

    WalletActivationDecisionStatus:
      type: string
      description: Outcome of evaluating one activation proof against an operation-bound challenge.
      enum: [ACCEPTED, DENIED]

    WalletAssuranceLevel:
      type: string
      description: Assurance evidence assigned to an activation decision after proof verification. Key custody and WSCD/HSM backing are recorded separately on the secure-component profile.
      enum: [EVALUATION_ONLY, PIN, PASSKEY, PROOF_TRANSCRIPT]

    RetryCounterState:
      type: object
      description: Activation retry state returned with an activation decision.
      required: [failedAttempts, remainingAttempts, maxAttempts, locked]
      example:
        failedAttempts: 0
        remainingAttempts: 5
        maxAttempts: 5
        lockedUntil: null
        locked: false
      properties:
        failedAttempts:
          type: integer
        remainingAttempts:
          type: integer
        maxAttempts:
          type: integer
        lockedUntil:
          type: string
          format: date-time
          nullable: true
        locked:
          type: boolean

    WalletActivationPolicyEvidence:
      type: object
      description: Evidence emitted by the configured activation proof provider and stored with an activation decision.
      required: [profileId, providerId, entries]
      example:
        profileId: production-proof-transcript
        providerId: production-activation-provider
        policyRef: wallet-unit-production-valid
        entries:
          proofTranscriptDigest: sha256:2f20b6f6e7f1d36f8f6d35d27a5f093b6f2e4b2e
          productionCapable: 'true'
      properties:
        profileId:
          type: string
        providerId:
          type: string
        policyRef:
          type: string
          nullable: true
        entries:
          $ref: '#/components/schemas/StringMap'

    ActivationDecisionRecord:
      type: object
      description: Persisted authorization decision for one activation operation. Accepted decisions are single-use inputs to gated wallet-key signing.
      required: [decisionId, status, walletUnitId, walletAccountId, profileId, activationKeyRef, operationKeyRef, operationType, operationBinding, operationHash, nonce, sequence, audience, expiresAt, assuranceLevel, retryState, policyEvidence, issuedAt]
      example:
        decisionId: act-20260702-0001
        status: ACCEPTED
        walletUnitId: wu-7f9d
        walletAccountId: wa-42
        profileId: production-proof-transcript
        activationKeyRef: wallet-unit-activation-key
        operationKeyRef: wallet-signing-key-1
        operationType: wallet.wscd.sign-digest
        operationBinding: wallet-operation-binding-1
        operationHash: sha256:7f1a6aa671f1a2d1c3c2e994c09e3f87c4ac44d6
        nonce: '6fc33771f7e14d63'
        sequence: 12
        audience: https://issuer.acme.example
        expiresAt: '2026-07-02T08:20:00Z'
        assuranceLevel: PROOF_TRANSCRIPT
        retryState:
          failedAttempts: 0
          remainingAttempts: 5
          maxAttempts: 5
          lockedUntil: null
          locked: false
        policyEvidence:
          profileId: production-proof-transcript
          providerId: production-activation-provider
          policyRef: wallet-unit-production-valid
          entries:
            proofTranscriptDigest: sha256:2f20b6f6e7f1d36f8f6d35d27a5f093b6f2e4b2e
            productionCapable: 'true'
        issuedAt: '2026-07-02T08:15:00Z'
        denialReason: null
        consumedAt: null
      properties:
        decisionId:
          type: string
        status:
          $ref: '#/components/schemas/WalletActivationDecisionStatus'
        walletUnitId:
          type: string
        walletAccountId:
          type: string
        profileId:
          type: string
        activationKeyRef:
          type: string
        operationKeyRef:
          type: string
          minLength: 1
        operationType:
          type: string
        operationBinding:
          type: string
          minLength: 1
        operationHash:
          type: string
        nonce:
          type: string
        sequence:
          type: integer
          format: int64
        audience:
          type: string
        expiresAt:
          type: string
          format: date-time
        assuranceLevel:
          $ref: '#/components/schemas/WalletAssuranceLevel'
        retryState:
          $ref: '#/components/schemas/RetryCounterState'
        policyEvidence:
          $ref: '#/components/schemas/WalletActivationPolicyEvidence'
        issuedAt:
          type: string
          format: date-time
        denialReason:
          type: string
          nullable: true
        consumedAt:
          type: string
          format: date-time
          nullable: true

    BlindPinEnrollmentRequest:
      type: object
      description: Enrolls an activation verifier for a Wallet Unit. `activationSecretVerifier` is a blinded or derived verifier, not a raw PIN.
      required: [walletUnitId, walletAccountId, profile, activationKeyRef, activationSecretVerifier]
      example:
        walletUnitId: wu-7f9d
        walletAccountId: wa-42
        profile: PIN_DERIVED_SIGNATURE
        activationKeyRef: wallet-unit-activation-key
        activationSecretVerifier: bpv1:argon2id:mem=65536,t=3:salt:verifier
        policyRef: wallet-unit-production-valid
      properties:
        walletUnitId:
          type: string
        walletAccountId:
          type: string
        profile:
          $ref: '#/components/schemas/BlindPinActivationProfile'
        activationKeyRef:
          type: string
        activationSecretVerifier:
          type: string
          description: Blinded or derived activation secret verifier. Production clients must not send raw PIN material.
        policyRef:
          type: string
          nullable: true

    BlindPinUnlockRequest:
      type: object
      description: Requests an activation decision for one wallet operation. `activationSecretProof` is a blinded or derived proof bound to the operation details.
      required: [walletUnitId, walletAccountId, profile, activationKeyRef, operationKeyRef, activationSecretProof, operationType, operationBinding, operationHash, nonce, audience, expiresAt]
      example:
        walletUnitId: wu-7f9d
        walletAccountId: wa-42
        profile: PIN_DERIVED_SIGNATURE
        activationKeyRef: wallet-unit-activation-key
        operationKeyRef: wallet-signing-key-1
        activationSecretProof: bpp1:schnorr:challenge-response-proof
        operationType: wallet.wscd.sign-digest
        operationBinding: wallet-operation-binding-1
        operationHash: sha256:7f1a6aa671f1a2d1c3c2e994c09e3f87c4ac44d6
        nonce: '6fc33771f7e14d63'
        audience: https://issuer.acme.example
        expiresAt: '2026-07-02T08:20:00Z'
        policyEvidence:
          proofTranscriptDigest: sha256:2f20b6f6e7f1d36f8f6d35d27a5f093b6f2e4b2e
      properties:
        walletUnitId:
          type: string
        walletAccountId:
          type: string
        profile:
          $ref: '#/components/schemas/BlindPinActivationProfile'
        activationKeyRef:
          type: string
        operationKeyRef:
          type: string
          minLength: 1
        activationSecretProof:
          type: string
          description: Blinded or derived activation proof. Production clients must not send raw PIN material.
        operationType:
          type: string
        operationBinding:
          type: string
          minLength: 1
        operationHash:
          type: string
        nonce:
          type: string
        audience:
          type: string
        expiresAt:
          type: string
          format: date-time
        policyEvidence:
          $ref: '#/components/schemas/StringMap'

    BlindPinReEnrollmentRequest:
      type: object
      description: Rotates the activation verifier after proving control of the current verifier. Both proof values are blinded or derived values.
      required: [walletUnitId, walletAccountId, profile, activationKeyRef, currentActivationSecretProof, replacementActivationSecretVerifier]
      example:
        walletUnitId: wu-7f9d
        walletAccountId: wa-42
        profile: PIN_DERIVED_SIGNATURE
        activationKeyRef: wallet-unit-activation-key
        currentActivationSecretProof: bpp1:schnorr:current-proof
        replacementActivationSecretVerifier: bpv1:argon2id:mem=65536,t=3:new-salt:new-verifier
        policyRef: wallet-unit-production-valid
      properties:
        walletUnitId:
          type: string
        walletAccountId:
          type: string
        profile:
          $ref: '#/components/schemas/BlindPinActivationProfile'
        activationKeyRef:
          type: string
        currentActivationSecretProof:
          type: string
          description: Blinded or derived activation proof. Production clients must not send raw PIN material.
        replacementActivationSecretVerifier:
          type: string
          description: Blinded or derived replacement verifier. Production clients must not send raw PIN material.
        policyRef:
          type: string
          nullable: true

    BlindPinRevocationRequest:
      type: object
      description: Revokes an activation profile/key binding for a Wallet Unit. This is activation revocation, not a phase-7 factory reset workflow.
      required: [walletUnitId, walletAccountId, profile, activationKeyRef]
      example:
        walletUnitId: wu-7f9d
        walletAccountId: wa-42
        profile: PIN_DERIVED_SIGNATURE
        activationKeyRef: wallet-unit-activation-key
        reason: operator requested activation credential revocation
      properties:
        walletUnitId:
          type: string
        walletAccountId:
          type: string
        profile:
          $ref: '#/components/schemas/BlindPinActivationProfile'
        activationKeyRef:
          type: string
        reason:
          type: string
          nullable: true

    WalletUnitAttestationKind:
      type: string
      description: Wallet attestation family. WUA is modeled as the umbrella concept; WIA and KA are the concrete TS03 artifacts.
      enum: [WUA, WIA, KA]

    WalletUnitAttestationProfile:
      type: string
      description: Attestation profile used for issuance or validation. LOCAL_EVALUATION_REFERENCE is explicit evaluation-only material; TS03_JWT is production-capable when backed by trusted signer evidence.
      enum: [LOCAL_EVALUATION_REFERENCE, TS03_JWT]

    WalletUnitAttestationStatus:
      type: string
      description: Stored attestation lifecycle status.
      enum: [ACTIVE, REVOKED, CONSUMED]

    WalletUnitAttestationFormat:
      type: string
      description: Wire or stored-reference format for WIA, KA, and supported wallet credential proof material.
      enum: [STORED_REF, JWT, SD_JWT_VC, SD_JWT_VC_PRESENTATION, KEY_ATTESTATION_JWT, MDOC_DEVICE_RESPONSE, MDOC_DOCUMENT, MDOC_ISSUER_SIGNED]

    WalletUnitAttestationEncoding:
      type: string
      description: Encoding used for the attestation material value.
      enum: [COMPACT, BASE64URL]

    WalletUnitAttestationMaterial:
      type: object
      description: Attestation material supplied inline. Stored references should use the dedicated `attestationRef` fields on validation requests.
      required: [format, value]
      example:
        format: JWT
        value: eyJhbGciOiJFUzI1NiIsImtpZCI6IndwLXNpZ25lci1rZXktMSJ9...
        encoding: COMPACT
      properties:
        format:
          $ref: '#/components/schemas/WalletUnitAttestationFormat'
        value:
          type: string
        encoding:
          $ref: '#/components/schemas/WalletUnitAttestationEncoding'

    WalletProviderAttestationSignerRef:
      type: object
      description: Configured Wallet Provider signing identity used for TS03 WIA/KA issuance. Production profiles resolve to remote WSCD or external provider signing; LOCAL_EVALUATION evidence is local/evaluation only.
      required: [signerId, issuer]
      example:
        signerId: wp-signer-prod-1
        issuer: https://wallet-provider.acme.example
        keyId: wp-signer-key-1
        signingAlgorithm: ES256
        signerProfile: REMOTE_WSCD
        certificateChain:
          - MIIC...wallet-provider-cert...
        trustEvidenceRef: lote:wallet-provider:acme-prod
      properties:
        signerId:
          type: string
        issuer:
          type: string
        keyId:
          type: string
          nullable: true
        signingAlgorithm:
          type: string
          default: ES256
        signerProfile:
          type: string
          enum: [LOCAL_EVALUATION, LOCAL_WSCD, REMOTE_WSCD, EXTERNAL_PROVIDER]
          default: REMOTE_WSCD
        certificateChain:
          type: array
          items:
            type: string
        trustEvidenceRef:
          type: string
          nullable: true

    WalletSolutionCertificationEvidence:
      type: object
      description: Certification evidence for a Wallet Solution or secure component.
      required: [certificationId, scheme, assuranceLevel, issuer]
      example:
        certificationId: eudi-ws-2026-00042
        scheme: EUDI_WALLET_SOLUTION_CERTIFICATION
        assuranceLevel: high
        issuer: EU Wallet Certification Body
        evidenceRef: https://cert.example.eu/eudi-ws-2026-00042
        validFrom: '2026-01-01'
        validUntil: '2027-01-01'
      properties:
        certificationId:
          type: string
        scheme:
          type: string
        assuranceLevel:
          type: string
        issuer:
          type: string
        evidenceRef:
          type: string
          nullable: true
        validFrom:
          type: string
          nullable: true
        validUntil:
          type: string
          nullable: true

    WalletSolutionRef:
      type: object
      description: Wallet Solution identity and optional certification evidence used in WIA claims and trust resolution.
      required: [name, version]
      example:
        name: Acme EUDI Wallet
        version: 4.2.1
        informationLink: https://wallet.acme.example/info
        vendor: Acme Wallets BV
        certification:
          certificationId: eudi-ws-2026-00042
          scheme: EUDI_WALLET_SOLUTION_CERTIFICATION
          assuranceLevel: high
          issuer: EU Wallet Certification Body
      properties:
        name:
          type: string
        version:
          type: string
        informationLink:
          type: string
          nullable: true
        vendor:
          type: string
          nullable: true
        certification:
          $ref: '#/components/schemas/WalletSolutionCertificationEvidence'

    WalletInstanceRef:
      type: object
      description: Wallet instance identity and integrity evidence included in WIA issuance.
      required: [id, evidence]
      example:
        id: wi-android-7f9d
        holderBindingRef: holder-binding-20260702
        integrityEvidenceRef: device-integrity-20260702
        evidence:
          appIntegrity: hardware-backed
          deviceBinding: mTLS-device-binding
      properties:
        id:
          type: string
        holderBindingRef:
          type: string
          nullable: true
        integrityEvidenceRef:
          type: string
          nullable: true
        evidence:
          $ref: '#/components/schemas/StringMap'

    WalletKeystoreSecurityLevel:
      type: string
      description: Security level asserted for the keystore, WSCD, QSCD, remote HSM, or local evaluation provider.
      enum: [ISO_18045_HIGH, ISO_18045_MODERATE, ISO_18045_ENHANCED_BASIC, ISO_18045_BASIC, NONE]

    WalletSecureComponentType:
      type: string
      description: Type of secure application, secure device, keystore, or provider used for wallet and eIDAS operations.
      enum: [LOCAL_SECURE_AREA, REMOTE_WSCA, REMOTE_WSCD, REMOTE_HSM, REMOTE_QSCD, LOCAL_EVALUATION_PROVIDER, EXTERNAL_CERTIFIED_PROVIDER]

    SecureComponentUsage:
      type: string
      description: Allowed use for a secure component. Generic eIDAS signature/seal usage is intentionally separate from Wallet Unit attestation usage.
      enum: [WALLET_ATTESTATION, WALLET_CREDENTIAL_PROOF, EIDAS_SIGNATURE, EIDAS_SEAL]

    WalletSecureComponentWalletBinding:
      type: object
      description: Optional binding between a secure component and a Wallet Unit/account/instance. Generic WSCA/WSCD use can omit these Wallet Unit fields.
      example:
        walletUnitId: wu-7f9d
        walletAccountId: wa-42
        walletInstanceId: wi-android-7f9d
        evidence:
          bindingMethod: mTLS-device-binding
      properties:
        walletUnitId:
          type: string
          nullable: true
        walletAccountId:
          type: string
          nullable: true
        walletInstanceId:
          type: string
          nullable: true
        evidence:
          $ref: '#/components/schemas/StringMap'

    WalletPrivateKeyProtectionEvidence:
      type: object
      description: Evidence that the private key is non-exportable and protected by user authentication or an equivalent secure control.
      required: [nonExportable, protectedByUserAuthentication]
      example:
        nonExportable: true
        protectedByUserAuthentication: true
        isolationBoundary: remote-hsm-tenant-partition
        evidence:
          keyPolicy: non-exportable-user-present
      properties:
        nonExportable:
          type: boolean
        protectedByUserAuthentication:
          type: boolean
        isolationBoundary:
          type: string
          nullable: true
        evidence:
          $ref: '#/components/schemas/StringMap'

    WalletUserAuthenticationEvidence:
      type: object
      description: Evidence describing the user-authentication policy protecting wallet key use.
      required: [assuranceLevel, methods, evidence]
      example:
        assuranceLevel: high
        methods: [PIN, DEVICE_BIOMETRIC]
        policyRef: wallet-user-auth-high
        evidence:
          activationDecisionId: act-20260702-0001
      properties:
        assuranceLevel:
          type: string
        methods:
          type: array
          items:
            type: string
        policyRef:
          type: string
          nullable: true
        evidence:
          $ref: '#/components/schemas/StringMap'

    WalletSecureComponentEvidence:
      type: object
      description: Certification, key-protection, user-authentication, and provenance evidence for a WSCA, WSCD, QSCD, HSM, or keystore.
      required: [certificationEvidence, provenance]
      example:
        certificationEvidence:
          - certificationId: qscd-2026-991
            scheme: eIDAS-QSCD
            assuranceLevel: high
            issuer: National Supervisory Body
        privateKeyProtection:
          nonExportable: true
          protectedByUserAuthentication: true
          isolationBoundary: remote-hsm-tenant-partition
          evidence:
            keyPolicy: non-exportable-user-present
        userAuthentication:
          assuranceLevel: high
          methods: [PIN]
          evidence:
            activationDecisionId: act-20260702-0001
        provenance:
          adapter: etsi-lote
      properties:
        certificationEvidence:
          type: array
          items:
            $ref: '#/components/schemas/WalletSolutionCertificationEvidence'
        privateKeyProtection:
          $ref: '#/components/schemas/WalletPrivateKeyProtectionEvidence'
        userAuthentication:
          $ref: '#/components/schemas/WalletUserAuthenticationEvidence'
        provenance:
          $ref: '#/components/schemas/StringMap'

    WalletSecureCryptographicApplicationRef:
      type: object
      description: WSCA or equivalent secure application evidence. The same model can describe Wallet Unit and non-Wallet Unit eIDAS signature/seal usage.
      required: [id, componentType]
      example:
        id: wsca-prod-app-1
        version: 2.0.0
        componentType: REMOTE_WSCA
        usages: [WALLET_ATTESTATION, EIDAS_SIGNATURE, EIDAS_SEAL]
        walletBinding:
          walletUnitId: wu-7f9d
          walletAccountId: wa-42
          evidence:
            bindingMethod: mTLS-device-binding
        evidence:
          certificationEvidence: []
          provenance:
            source: certified-provider-registry
      properties:
        id:
          type: string
        version:
          type: string
          nullable: true
        componentType:
          $ref: '#/components/schemas/WalletSecureComponentType'
        usages:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/SecureComponentUsage'
        walletBinding:
          $ref: '#/components/schemas/WalletSecureComponentWalletBinding'
        evidence:
          $ref: '#/components/schemas/WalletSecureComponentEvidence'

    WalletSecureCryptographicDeviceRef:
      type: object
      description: WSCD, QSCD, remote HSM, or other secure device evidence used for KA and for generic eIDAS signatures/seals.
      required: [id, componentType, securityLevel]
      example:
        id: wscd-prod-device-1
        providerId: external-certified-wscd
        componentType: REMOTE_WSCD
        securityLevel: ISO_18045_HIGH
        usages: [WALLET_CREDENTIAL_PROOF, EIDAS_SIGNATURE]
        certification:
          certificationId: qscd-2026-991
          scheme: eIDAS-QSCD
          assuranceLevel: high
          issuer: National Supervisory Body
        evidence:
          certificationEvidence:
            - certificationId: qscd-2026-991
              scheme: eIDAS-QSCD
              assuranceLevel: high
              issuer: National Supervisory Body
          provenance:
            source: etsi-lote
      properties:
        id:
          type: string
        providerId:
          type: string
          nullable: true
        componentType:
          $ref: '#/components/schemas/WalletSecureComponentType'
        securityLevel:
          $ref: '#/components/schemas/WalletKeystoreSecurityLevel'
        usages:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/SecureComponentUsage'
        walletBinding:
          $ref: '#/components/schemas/WalletSecureComponentWalletBinding'
        certification:
          $ref: '#/components/schemas/WalletSolutionCertificationEvidence'
        evidence:
          $ref: '#/components/schemas/WalletSecureComponentEvidence'

    WalletKeystoreRef:
      type: object
      description: Keystore or key container reference. It can be bound to a Wallet Unit or used independently by generic eIDAS signing/sealing flows.
      required: [id, namespace, securityLevel, componentType]
      example:
        id: keystore-prod-1
        namespace: tenant-root
        securityLevel: ISO_18045_MODERATE
        componentType: REMOTE_HSM
        usages: [WALLET_CREDENTIAL_PROOF]
        evidence:
          kmsProvider: tenant-kms
          nonExportable: 'true'
      properties:
        id:
          type: string
        namespace:
          type: string
        providerId:
          type: string
          nullable: true
        securityLevel:
          $ref: '#/components/schemas/WalletKeystoreSecurityLevel'
        componentType:
          $ref: '#/components/schemas/WalletSecureComponentType'
        usages:
