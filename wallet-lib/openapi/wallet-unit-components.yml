    WalletUnitWscdAlgorithmProfile:
      type: string
      description: Server-owned key profile. The profile fixes the KMS algorithm, use, and permitted operations without exposing provider selection.
      enum: [holder-proof-es256]

    ProvisionWalletUnitWscdKeyRequest:
      type: object
      additionalProperties: false
      description: |
        Provisioning request for a wallet-unit-owned managed key. The
        high-entropy idempotency key is reduced to a one-way digest before
        persistence; it is never logged or returned.
      required: [idempotencyKey, algorithmProfileId]
      properties:
        idempotencyKey:
          type: string
          minLength: 32
          maxLength: 256
          writeOnly: true
        algorithmProfileId:
          $ref: '#/components/schemas/WalletUnitWscdAlgorithmProfile'

    WalletUnitWscdPublicJwk:
      type: object
      additionalProperties: false
      description: Normalized public P-256 JWK. Private parameters are not part of this schema.
      required: [kty, crv, x, y, kid, alg, use, key_ops]
      properties:
        kty:
          type: string
          enum: [EC]
        crv:
          type: string
          enum: [P-256]
        x:
          type: string
          minLength: 1
        y:
          type: string
          minLength: 1
        kid:
          type: string
          minLength: 1
        alg:
          type: string
          enum: [ES256]
        use:
          type: string
          enum: [sig]
        key_ops:
          type: array
          minItems: 2
          maxItems: 2
          uniqueItems: true
          items:
            type: string
            enum: [sign, verify]

    WalletUnitWscdKeyState:
      type: string
      description: Public wallet-unit key lifecycle state. Retirement is not advertised until the typed KMS supports a permit-bound managed-retirement command.
      enum: [ACTIVE]

    WalletUnitWscdKeyAction:
      type: string
      enum: [SIGN, VERIFY]

    WalletUnitWscdKeyDetail:
      type: object
      additionalProperties: false
      description: Safe wallet-unit key projection containing no KMS provider, resource handle, locator, alias, configuration, or private material.
      required: [keyRef, kid, algorithmProfileId, algorithm, keyType, state, availableActions, publicJwk]
      properties:
        keyRef:
          type: string
          pattern: '^wscd_[A-Za-z0-9_-]{20,128}$'
        kid:
          type: string
          minLength: 1
        algorithmProfileId:
          $ref: '#/components/schemas/WalletUnitWscdAlgorithmProfile'
        algorithm:
          type: string
          enum: [ES256]
        keyType:
          type: string
          enum: [EC]
        state:
          $ref: '#/components/schemas/WalletUnitWscdKeyState'
        availableActions:
          type: array
          minItems: 2
          maxItems: 2
          uniqueItems: true
          items:
            $ref: '#/components/schemas/WalletUnitWscdKeyAction'
        publicJwk:
          $ref: '#/components/schemas/WalletUnitWscdPublicJwk'

    ListWalletUnitWscdKeysResult:
      type: object
      additionalProperties: false
      required: [keys]
      properties:
        keys:
          type: array
          items:
            $ref: '#/components/schemas/WalletUnitWscdKeyDetail'

    WalletWscdKeyRef:
      type: object
      description: Opaque wallet secure cryptographic device key reference resolved by the WSCD implementation.
      required: [keyRef]
      example:
        keyRef: wallet-signing-key-1
        signatureAlgorithm: ES256
      properties:
        keyRef:
          type: string
          minLength: 1
        signatureAlgorithm:
          type: string
          nullable: true

