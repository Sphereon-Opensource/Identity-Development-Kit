openapi: 3.0.4
info:
  title: Wallet Credential API
  version: 0.1.0
  x-products: [idk, edk, vdx]
  description: |
    Wallet Credential is the holder-facing REST surface over the stored
    credential records of one wallet unit. It exposes the queryable metadata
    sidecar, a sanitized display projection for one credential, policy-gated
    deletion, and an unattended status refresh.

    Raw credential bodies are never exposed by this API. List responses carry
    only the metadata sidecar, and the detail response is a display projection
    with a sanitized claim tree; the credential body itself stays inside the
    wallet store and is only used by presentation and issuance flows.

    A typical usage flow is:

    1. List the credentials of a wallet unit, optionally narrowed with the
       metadata filter fields.
    2. Open one credential to render its display projection, issuer party,
       sanitized claim tree, and external resources.
    3. Refresh the revocation and validity status of a credential without user
       interaction when a status mechanism is configured.
    4. Delete a credential after obtaining a single-use, operation-bound
       activation decision for the deletion.
servers:
  - url: https://api.example.com/api/wallet/credentials/v1
    description: Production server.
  - url: http://localhost:8080/api/wallet/credentials/v1
    description: Local development server.
security:
  - bearer: []
tags:
  - name: WalletCredentials
    description: List, inspect, and delete stored wallet credentials through metadata and sanitized display projections. Raw credential bodies are never returned.
  - name: WalletCredentialStatus
    description: Unattended refresh of revocation and validity status snapshots for stored credentials.
paths:
  /wallets/{walletUnitId}/credentials:
    parameters:
      - $ref: './wallet-credential-components.yml#/components/parameters/WalletUnitId'
    get:
      tags: [WalletCredentials]
      summary: List wallet credentials
      operationId: listWalletCredentials
      x-command-id: wallet.credentials.list
      description: |
        Lists the credential metadata sidecars of one wallet unit. The query
        parameters mirror the credential metadata filter exactly: type
        references, formats, issuer reference, subject reference, credential
        configuration id, lifecycle states, and deleted-record inclusion.

        The two set-valued enum filters, formats and lifecycleStates, are sent
        as a single comma-separated value each rather than as repeated query
        parameters, because the server reads one value per parameter name.

        There are no paging parameters; the full filtered set is returned in
        one response. Paging arrives later as a compatible extension of this
        operation. Raw credential bodies are never part of the result.
      parameters:
        - name: credentialTypeRefs
          in: query
          required: false
          description: JSON-encoded array of credential type references. A credential matches when it carries at least one of the referenced types, compared by format, kind, and value.
          content:
            application/json:
              schema:
                type: array
                uniqueItems: true
                items:
                  $ref: './wallet-credential-components.yml#/components/schemas/CredentialTypeRef'
        - name: formats
          in: query
          required: false
          description: |
            Credential format wire values to match. An empty or absent set matches
            every format.

            Sent as ONE query parameter whose value is the comma-separated list
            (`?formats=dc+sd-jwt,mso_mdoc`), never as a repeated parameter. The
            server reads a single value per parameter name and splits it on commas,
            so a repeated `?formats=a&formats=b` silently loses all but one value.
          style: form
          explode: false
          schema:
            type: array
            uniqueItems: true
            items:
              $ref: './wallet-credential-components.yml#/components/schemas/CredentialFormat'
        - name: issuerRef
          in: query
          required: false
          description: JSON-encoded identifier reference that the credential issuer must equal.
          content:
            application/json:
              schema:
                $ref: './wallet-credential-components.yml#/components/schemas/IdentifierRef'
        - name: subjectRef
          in: query
          required: false
          description: JSON-encoded identifier reference that must appear among the credential subject references.
          content:
            application/json:
              schema:
                $ref: './wallet-credential-components.yml#/components/schemas/IdentifierRef'
        - name: credentialConfigurationId
          in: query
          required: false
          description: Credential configuration id from issuance provenance that the credential must equal.
          schema:
            type: string
        - name: lifecycleStates
          in: query
          required: false
          description: |
            Lifecycle states to match. An empty or absent set matches every
            lifecycle state.

            Sent as ONE query parameter whose value is the comma-separated list
            (`?lifecycleStates=ACTIVE,SUSPENDED`), never as a repeated parameter.
            The server reads a single value per parameter name and splits it on
            commas, so a repeated `?lifecycleStates=a&lifecycleStates=b` silently
            loses all but one value.
          style: form
          explode: false
          schema:
            type: array
            uniqueItems: true
            items:
              $ref: './wallet-credential-components.yml#/components/schemas/CredentialLifecycleState'
        - name: includeDeleted
          in: query
          required: false
          description: When true, tombstoned records are included in the result. Defaults to false.
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Full filtered credential metadata set.
          content:
            application/json:
              schema:
                $ref: './wallet-credential-components.yml#/components/schemas/ListWalletCredentialsResult'
        '400':
          $ref: './common-components.yml#/components/responses/ValidationError'
        '401':
          $ref: './common-components.yml#/components/responses/Unauthorized'
        '403':
          $ref: './common-components.yml#/components/responses/Forbidden'
        '404':
          $ref: './common-components.yml#/components/responses/NotFound'
        '500':
          $ref: './common-components.yml#/components/responses/Error'

  /wallets/{walletUnitId}/credentials/{credentialRecordId}:
    parameters:
      - $ref: './wallet-credential-components.yml#/components/parameters/WalletUnitId'
      - $ref: './wallet-credential-components.yml#/components/parameters/CredentialRecordId'
    get:
      tags: [WalletCredentials]
      summary: Get a wallet credential
      operationId: getWalletCredential
      x-command-id: wallet.credentials.get
      description: |
        Returns the display projection for one stored credential: the metadata
        sidecar, the issuer party derived inside the authoritative profile
        boundary, tags, the canonical sanitized claim tree with localized
        labels, and referenced external resources.

        The raw credential body is never exposed by this API. The claim tree
        is a sanitized projection; hidden values are absent rather than
        masked, and external resources are returned as link references that
        clients decide whether to open.
      responses:
        '200':
          description: Credential display projection.
          content:
            application/json:
              schema:
                $ref: './wallet-credential-components.yml#/components/schemas/WalletCredentialDetailContent'
        '401':
          $ref: './common-components.yml#/components/responses/Unauthorized'
        '403':
          $ref: './common-components.yml#/components/responses/Forbidden'
        '404':
          $ref: './common-components.yml#/components/responses/NotFound'
        '500':
          $ref: './common-components.yml#/components/responses/Error'
    delete:
      tags: [WalletCredentials]
      summary: Delete a wallet credential
      operationId: deleteWalletCredential
      x-command-id: wallet.credentials.delete
      description: |
        Deletes one stored credential after verifying the supplied activation
        grant. The referenced activation decision is single-use and
        operation-bound to operationType wallet.credentials.delete with the
        exact operation hash, nonce, and audience in the request body. The
        server consumes the decision before performing the deletion, so a
        second attempt with the same decision fails even if the first attempt
        did not complete. A missing, expired, already consumed, or wrong-hash
        decision is rejected with 403 and nothing is deleted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './wallet-credential-components.yml#/components/schemas/WalletCredentialDeleteActivationGrant'
      responses:
        '200':
          description: Credential deleted.
          content:
            application/json:
              schema:
                $ref: './wallet-credential-components.yml#/components/schemas/DeleteWalletCredentialResult'
        '400':
          $ref: './common-components.yml#/components/responses/ValidationError'
        '401':
          $ref: './common-components.yml#/components/responses/Unauthorized'
        '403':
          $ref: './common-components.yml#/components/responses/Forbidden'
        '404':
          $ref: './common-components.yml#/components/responses/NotFound'
        '500':
          $ref: './common-components.yml#/components/responses/Error'

  /wallets/{walletUnitId}/credentials/{credentialRecordId}/status-refresh:
    parameters:
      - $ref: './wallet-credential-components.yml#/components/parameters/WalletUnitId'
      - $ref: './wallet-credential-components.yml#/components/parameters/CredentialRecordId'
    post:
      tags: [WalletCredentialStatus]
      summary: Refresh wallet credential status
      operationId: refreshWalletCredentialStatus
      x-command-id: wallet.credentials.refresh-status
      description: |
        Re-resolves the revocation and validity status of one stored
        credential against its configured status mechanism and persists the
        outcome. The response carries the updated credential metadata sidecar
        plus the latest status snapshot when one is available.

        This operation is unattended-safe: it requires no activation grant,
        discloses nothing beyond the metadata sidecar, and can run from
        background jobs and sync loops.
      responses:
        '200':
          description: Updated credential metadata and status snapshot.
          content:
            application/json:
              schema:
                $ref: './wallet-credential-components.yml#/components/schemas/RefreshWalletCredentialStatusResult'
        '401':
          $ref: './common-components.yml#/components/responses/Unauthorized'
        '403':
          $ref: './common-components.yml#/components/responses/Forbidden'
        '404':
          $ref: './common-components.yml#/components/responses/NotFound'
        '500':
          $ref: './common-components.yml#/components/responses/Error'

components:
  securitySchemes:
    bearer:
      $ref: './common-components.yml#/components/securitySchemes/bearer'
