  /tenants/{tenantId}/business-wallets/{slug}/authorization-servers:
    get:
      tags: [BusinessWalletAuthorizationServerBindings]
      summary: List business wallet authorization-server bindings
      description: >
        Lists the authorization servers this wallet logs its users in through. Each row is a join
        between one wallet and one AS instance; the same AS can be bound by other wallets in the
        same tenant. The row marked `default` is the AS the wallet uses when it does not show an
        IdP picker.
      operationId: listBusinessWalletAuthorizationServerBindings
      x-products: [vdx]
      x-license-protection:
        entitlementKey: vdx.wallet.binding.list
        deploymentShapePredicates: [packaging=container, environment=production]
        protectionMode: licensed
      parameters:
        - $ref: './platform-config-components.yml#/components/parameters/TenantId'
        - $ref: './platform-config-components.yml#/components/parameters/BusinessWalletSlug'
        - $ref: './platform-config-components.yml#/components/parameters/PageQuery'
        - $ref: './platform-config-components.yml#/components/parameters/SizeQuery'
      responses:
        '200':
          description: Authorization-server bindings of this business wallet.
          content:
            application/json:
              schema:
                $ref: './platform-config-components.yml#/components/schemas/BusinessWalletAuthorizationServerBindingList'
        '401':
          $ref: './common-components.yml#/components/responses/Unauthorized'
        '403':
          $ref: './common-components.yml#/components/responses/Forbidden'
        '404':
          $ref: './common-components.yml#/components/responses/NotFound'
    post:
      tags: [BusinessWalletAuthorizationServerBindings]
      summary: Add a business wallet authorization-server binding
      description: >
        Binds an authorization-server instance to this wallet and registers the OAuth2 client the
        wallet uses on it. The client is a **public PKCE client** on that AS: it is auto-registered
        by this operation from the wallet's derived redirect URI
        (`<wallet public URL><session redirect path>`), it holds no secret, and it appears in the AS
        client registry afterwards. Adding the same AS twice to one wallet is rejected with `409`;
        binding an AS that other wallets already use is normal. The first authorization-server
        binding of a wallet becomes the default automatically, because a wallet with no default AS
        cannot bootstrap a session.
      operationId: addBusinessWalletAuthorizationServerBinding
      x-products: [vdx]
      x-license-protection:
        entitlementKey: vdx.wallet.binding.add
        deploymentShapePredicates: [packaging=container, environment=production]
        protectionMode: licensed
      parameters:
        - $ref: './platform-config-components.yml#/components/parameters/TenantId'
        - $ref: './platform-config-components.yml#/components/parameters/BusinessWalletSlug'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './platform-config-components.yml#/components/schemas/AddBusinessWalletAuthorizationServerBindingRequest'
            example:
              instanceId: 996d5f68-8836-4af1-b6da-1330b42a2805
              default: true
              clientId: wallet-partners
              scope: openid profile email
              issuerDisplayName: Acme Corporate Login
      responses:
        '201':
          description: Created authorization-server binding, including the registered public client id.
          content:
            application/json:
              schema:
                $ref: './platform-config-components.yml#/components/schemas/BusinessWalletAuthorizationServerBinding'
        '400':
          $ref: './common-components.yml#/components/responses/ValidationError'
        '404':
          description: The wallet or the requested authorization-server instance does not exist in this tenant.
          content:
            application/json:
              schema:
                $ref: './common-components.yml#/components/schemas/ApiError'
        '409':
          description: >
            `details.reason` is `DUPLICATE_BINDING` when this wallet already binds the requested
            authorization server, and `CONCURRENT_DEFAULT_ELECTION` when `default` was requested and
            another change made a different authorization server this wallet's default while this
            one was in flight — a lost race, not a bad request: reload and repeat it. A `clientId`
            **named in the request** that is already registered on that AS is also refused, so that
            adding a wallet can never take over somebody else's client; the derived id
            (`wallet-<slug>`) is not, because a registration under it can only be the remains of an
            earlier attempt by this same wallet and is rewritten.
          content:
            application/json:
              schema:
                $ref: './common-components.yml#/components/schemas/ApiError'
  /tenants/{tenantId}/business-wallets/{slug}/authorization-servers/{bindingId}:
    get:
      tags: [BusinessWalletAuthorizationServerBindings]
      summary: Get a business wallet authorization-server binding
      operationId: getBusinessWalletAuthorizationServerBinding
      x-products: [vdx]
      x-license-protection:
        entitlementKey: vdx.wallet.binding.get
        deploymentShapePredicates: [packaging=container, environment=production]
        protectionMode: licensed
      parameters:
        - $ref: './platform-config-components.yml#/components/parameters/TenantId'
        - $ref: './platform-config-components.yml#/components/parameters/BusinessWalletSlug'
        - $ref: './platform-config-components.yml#/components/parameters/BusinessWalletBindingId'
      responses:
        '200':
          description: Authorization-server binding.
          content:
            application/json:
              schema:
                $ref: './platform-config-components.yml#/components/schemas/BusinessWalletAuthorizationServerBinding'
        '404':
          $ref: './common-components.yml#/components/responses/NotFound'
    patch:
      tags: [BusinessWalletAuthorizationServerBindings]
      summary: Update a business wallet authorization-server binding
      description: >
        Updates the mutable configuration this join row carries. `instanceId` and `clientId` are
        immutable: the client id names a live public client registration on the bound AS. Setting
        `default` clears the flag on the wallet's other authorization-server bindings; clearing
        `default` on the only binding that has it is rejected with `409`, because a wallet with no
        default authorization server cannot bootstrap a session.
      operationId: updateBusinessWalletAuthorizationServerBinding
      x-products: [vdx]
      x-license-protection:
        entitlementKey: vdx.wallet.binding.update
        deploymentShapePredicates: [packaging=container, environment=production]
        protectionMode: licensed
      parameters:
        - $ref: './platform-config-components.yml#/components/parameters/TenantId'
        - $ref: './platform-config-components.yml#/components/parameters/BusinessWalletSlug'
        - $ref: './platform-config-components.yml#/components/parameters/BusinessWalletBindingId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './platform-config-components.yml#/components/schemas/UpdateBusinessWalletAuthorizationServerBindingRequest'
            example:
              scope: openid profile email offline_access
              issuerDisplayName: Acme Corporate Login
      responses:
        '200':
          description: Updated authorization-server binding.
          content:
            application/json:
              schema:
                $ref: './platform-config-components.yml#/components/schemas/BusinessWalletAuthorizationServerBinding'
        '400':
          $ref: './common-components.yml#/components/responses/ValidationError'
        '404':
          $ref: './common-components.yml#/components/responses/NotFound'
        '409':
          description: >
            `details.reason` is `LAST_DEFAULT_AUTHORIZATION_SERVER_BINDING` when the request would
            leave the wallet without a default authorization server, and
            `CONCURRENT_DEFAULT_ELECTION` when `default` was set and another change made a different
            authorization server this wallet's default while this one was in flight. The second is a
            lost race, not a bad request: reload and repeat it.
          content:
            application/json:
              schema:
                $ref: './common-components.yml#/components/schemas/ApiError'
    delete:
      tags: [BusinessWalletAuthorizationServerBindings]
      summary: Remove a business wallet authorization-server binding
      description: >
        Removes the join row and de-registers the wallet's public PKCE client from the bound AS. The
        authorization-server instance itself is untouched and stays available to the other wallets
        that bind it.


        Removing the **last** authorization-server binding of a wallet is rejected with `409`: a
        wallet with no authorization server cannot bootstrap, so the wallet must be deleted instead
        of being left unreachable. Removing the binding that is currently the wallet's **default**
        is rejected too, even when others remain: no survivor is promoted, because that would move
        every user's sign-in to an authorization server nobody chose. Make another binding the
        default first. The blocking condition is reported in `details`.
      operationId: removeBusinessWalletAuthorizationServerBinding
      x-products: [vdx]
      x-license-protection:
        entitlementKey: vdx.wallet.binding.remove
        deploymentShapePredicates: [packaging=container, environment=production]
        protectionMode: licensed
      parameters:
        - $ref: './platform-config-components.yml#/components/parameters/TenantId'
        - $ref: './platform-config-components.yml#/components/parameters/BusinessWalletSlug'
        - $ref: './platform-config-components.yml#/components/parameters/BusinessWalletBindingId'
      responses:
        '204':
          description: Removed.
        '404':
          $ref: './common-components.yml#/components/responses/NotFound'
        '409':
          description: >
            `details.reason` is `LAST_AUTHORIZATION_SERVER_BINDING` when this is the wallet's only
            authorization-server binding, and `LAST_DEFAULT_AUTHORIZATION_SERVER_BINDING` when it is
            the wallet's default and siblings remain. `details.walletSlug` names the wallet.
          content:
            application/json:
              schema:
                $ref: './common-components.yml#/components/schemas/ApiError'
              example:
                code: CONFLICT
                category: CONFLICT
                message: A business wallet must keep at least one authorization-server binding.
                details:
                  reason: LAST_AUTHORIZATION_SERVER_BINDING
                  walletSlug: partners
