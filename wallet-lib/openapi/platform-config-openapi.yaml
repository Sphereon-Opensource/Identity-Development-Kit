  /tenants/{tenantId}/oid4vci/issuer/instances/{instanceId}/credential-defaults:
    get:
      tags: [Oid4vciIssuerCredentialDefaults]
      summary: Get OID4VCI issuer instance credential defaults
      description: >
        Returns the effective issuer-level credential defaults for the instance with per-field source
        markers. Each field resolves as `issuer` (a default set at this issuer scope) over `default`
        (the platform default). These defaults form the `issuer` layer beneath per-configuration
        settings: for a credential configuration the effective value resolves `configuration` over
        `issuer` over `design` over `default`. Inheritance is live and resolved at read and issuance
        time, never snapshotted.
      operationId: getOid4vciIssuerInstanceCredentialDefaults
      x-products: [vdx]
      parameters:
        - $ref: './platform-config-components.yml#/components/parameters/TenantId'
        - $ref: './platform-config-components.yml#/components/parameters/InstanceId'
      responses:
        '200':
          description: Effective issuer credential defaults.
          content:
            application/json:
              schema:
                $ref: './platform-config-components.yml#/components/schemas/Oid4vciIssuerCredentialDefaultsView'
    put:
      tags: [Oid4vciIssuerCredentialDefaults]
      summary: Replace OID4VCI issuer instance credential defaults
      description: >
        Replaces the issuer credential defaults. Provided non-null fields become issuer-level
        defaults; omitted fields and explicit nulls clear the issuer default and return the field to
        the platform default.
      operationId: replaceOid4vciIssuerInstanceCredentialDefaults
      x-products: [vdx]
      parameters:
        - $ref: './platform-config-components.yml#/components/parameters/TenantId'
        - $ref: './platform-config-components.yml#/components/parameters/InstanceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './platform-config-components.yml#/components/schemas/Oid4vciIssuerCredentialDefaults'
      responses:
        '200':
          description: Effective issuer credential defaults after replacement.
          content:
            application/json:
              schema:
                $ref: './platform-config-components.yml#/components/schemas/Oid4vciIssuerCredentialDefaultsView'
        '400':
          $ref: './common-components.yml#/components/responses/ValidationError'
    patch:
      tags: [Oid4vciIssuerCredentialDefaults]
      summary: Update OID4VCI issuer instance credential defaults
      description: >
        Applies RFC 7386 merge-patch semantics to the issuer credential defaults. Absent fields stay
        unchanged. Explicit null clears the issuer default for that field and returns it to the
        platform default.
      operationId: updateOid4vciIssuerInstanceCredentialDefaults
      x-products: [vdx]
      parameters:
        - $ref: './platform-config-components.yml#/components/parameters/TenantId'
        - $ref: './platform-config-components.yml#/components/parameters/InstanceId'
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: './platform-config-components.yml#/components/schemas/Oid4vciIssuerCredentialDefaults'
          application/json:
            schema:
              $ref: './platform-config-components.yml#/components/schemas/Oid4vciIssuerCredentialDefaults'
      responses:
        '200':
          description: Effective issuer credential defaults after patch.
          content:
            application/json:
              schema:
                $ref: './platform-config-components.yml#/components/schemas/Oid4vciIssuerCredentialDefaultsView'
        '400':
          $ref: './common-components.yml#/components/responses/ValidationError'
  /tenants/{tenantId}/oid4vci/issuer/instances/{instanceId}/credential-config-settings:
    get:
      tags: [Oid4vciIssuerCredentialConfigurationSettings]
      summary: List OID4VCI issuer instance per-configuration non-display settings
      description: >
        Returns the editable NON-DISPLAY settings for every `credential_configuration_id` the issuer
        instance advertises. The per-locale credential/claim display is owned by the credential-design
        API and is not part of this resource.
      operationId: listOid4vciIssuerInstanceCredentialConfigurationSettings
      x-products: [vdx]
      parameters:
        - $ref: './platform-config-components.yml#/components/parameters/TenantId'
        - $ref: './platform-config-components.yml#/components/parameters/InstanceId'
      responses:
        '200':
          description: All per-configuration non-display settings for the issuer instance.
          content:
            application/json:
              schema:
                $ref: './platform-config-components.yml#/components/schemas/CredentialConfigurationSettingsList'
  /tenants/{tenantId}/oid4vci/issuer/instances/{instanceId}/credential-config-settings/{credentialConfigurationId}:
    parameters:
      - $ref: './platform-config-components.yml#/components/parameters/TenantId'
      - $ref: './platform-config-components.yml#/components/parameters/InstanceId'
      - name: credentialConfigurationId
        in: path
        required: true
        description: The `credential_configuration_id` whose non-display settings are addressed. This is the `<id>` segment in `oid4vci.issuer.credentials.[<id>].*` config keys.
        schema:
          type: string
        example: EuPid
    get:
      tags: [Oid4vciIssuerCredentialConfigurationSettings]
      summary: Get a single OID4VCI issuer instance credential-configuration's non-display settings
      operationId: getOid4vciIssuerInstanceCredentialConfigurationSetting
      x-products: [vdx]
      responses:
        '200':
          description: The credential configuration's non-display settings.
          content:
            application/json:
              schema:
                $ref: './platform-config-components.yml#/components/schemas/CredentialConfigurationSettings'
        '404':
          $ref: './common-components.yml#/components/responses/NotFound'
    put:
      tags: [Oid4vciIssuerCredentialConfigurationSettings]
      summary: Create or replace a single OID4VCI issuer instance credential-configuration's non-display settings
      description: >
        Upserts the non-display settings for one `credential_configuration_id` and registers it in
        the issuer instance's credential-configuration index. Scalar and list fields are replaced
        wholesale; omitted/null fields are cleared. Design-authored display and claim metadata for the
        same configuration are left untouched.
      operationId: replaceOid4vciIssuerInstanceCredentialConfigurationSetting
      x-products: [vdx]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './platform-config-components.yml#/components/schemas/CredentialConfigurationSettings'
      responses:
        '200':
          description: The credential configuration's non-display settings after replacement.
          content:
            application/json:
              schema:
                $ref: './platform-config-components.yml#/components/schemas/CredentialConfigurationSettings'
        '400':
          $ref: './common-components.yml#/components/responses/ValidationError'
    patch:
      tags: [Oid4vciIssuerCredentialConfigurationSettings]
      summary: Update a single OID4VCI issuer instance credential-configuration's non-display settings
      description: >
        Applies RFC 7386 merge-patch semantics to one `credential_configuration_id`. Absent fields
        stay unchanged. Explicit null clears the field. Design-authored display and claim metadata for
        the same configuration are left untouched.
      operationId: updateOid4vciIssuerInstanceCredentialConfigurationSetting
      x-products: [vdx]
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: './platform-config-components.yml#/components/schemas/CredentialConfigurationSettingsPatch'
          application/json:
            schema:
              $ref: './platform-config-components.yml#/components/schemas/CredentialConfigurationSettingsPatch'
      responses:
        '200':
          description: The credential configuration's non-display settings after patch.
          content:
            application/json:
              schema:
                $ref: './platform-config-components.yml#/components/schemas/CredentialConfigurationSettings'
        '400':
          $ref: './common-components.yml#/components/responses/ValidationError'
        '404':
          $ref: './common-components.yml#/components/responses/NotFound'
    delete:
      tags: [Oid4vciIssuerCredentialConfigurationSettings]
      summary: Delete a single OID4VCI issuer instance credential-configuration's non-display settings
      description: >
        Removes the `credential_configuration_id` from the issuer instance's credential-configuration
        index and clears its non-display settings. Design-authored display and claim metadata are not
        deleted.
      operationId: deleteOid4vciIssuerInstanceCredentialConfigurationSetting
      x-products: [vdx]
      responses:
        '204':
          description: The credential configuration's non-display settings were removed.
  /tenants/{tenantId}/oid4vci/issuer/instances/{instanceId}/effective-credential-config-settings:
