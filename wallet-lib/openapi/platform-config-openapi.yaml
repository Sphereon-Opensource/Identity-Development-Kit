          $ref: './common-components.yml#/components/responses/ValidationError'
    patch:
      tags: [AsTokenSettings]
      summary: Update AS token settings
      description: >
        Applies RFC 7386 merge-patch semantics to token settings. Absent
        fields stay unchanged. Explicit null clears the tenant override for that field.
      operationId: updateAsTokenSettings
      x-products: [edk, vdx]
      parameters:
