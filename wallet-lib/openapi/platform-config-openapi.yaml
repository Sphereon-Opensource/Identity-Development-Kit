  /tenants/{tenantId}/oid4vci/issuer/instances/{instanceId}/credential-config-imports:
    post:
      tags: [Oid4vciIssuerCredentialConfigurationImport]
      summary: Import OID4VCI issuer instance credential configurations from a remote issuer
      description: >
        Fetches issuer metadata from the requested source and materializes the selected
        `credential_configuration_id` values as per-configuration settings for the instance,
        optionally creating or updating accompanying credential designs. When `dryRun` is true the
        planned actions are returned without writing any changes.
      operationId: importOid4vciIssuerInstanceCredentialConfigurations
      x-products: [vdx]
      parameters:
        - $ref: './platform-config-components.yml#/components/parameters/TenantId'
        - $ref: './platform-config-components.yml#/components/parameters/InstanceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './platform-config-components.yml#/components/schemas/CredentialConfigurationImportRequest'
            example:
              sourceUrl: https://issuer.example
              includeDesigns: true
              conflictPolicy: merge
              dryRun: false
      responses:
        '200':
          description: Import result listing the per-configuration action taken.
          content:
            application/json:
              schema:
                $ref: './platform-config-components.yml#/components/schemas/CredentialConfigurationImportResult'
        '400':
          $ref: './common-components.yml#/components/responses/ValidationError'
