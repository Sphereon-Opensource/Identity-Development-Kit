openapi: 3.0.4
info:
  title: Platform Config API
  version: 0.2.0
  x-products: [edk, vdx]
  x-product-descriptions:
    edk: |
      API for configuring tenant-owned EDK services.

      EDK tenant setup creates a system/default hosted authorization-server resource.
      Hosted and external resources share the unified stable-UUID lifecycle and
      configuration paths. The platform tenant and its built-in AS are excluded.
      The OID4VCI issuer
      and OID4VP verifier remain singleton services per tenant unless the
      deployment enables multi-instance capabilities, so their singleton
      configuration paths are tenant-scoped without an instance id.

      The API covers OAuth2/OIDC authorization-server resources, discovery,
      federation, hosted settings, public clients, identities, signing and features.
      Confidential upstream clients use typed secret or KMS references with no
      secret readback. It also exposes opaque-handle typed KMS resource
      administration and sectioned OID4VCI issuer and OID4VP verifier
      configuration for runtime settings that are not owned by credential-design,
      status-list, or DCQL APIs.
    vdx: |
      API for configuring VDX tenant service instances.

      VDX can register multiple hosted and external authorization servers, OID4VCI
      issuers, and OID4VP verifiers per tenant. Authorization servers use stable
      resource UUIDs; runtime config projections are not lifecycle authority.

      The API covers OAuth2/OIDC authorization-server settings for tokens,
      grants, feature policy, and public or confidential client registrations.
      Confidential credentials use write-once values or opaque typed references
      without secret readback. It also exposes opaque-handle typed KMS resource
      administration and sectioned OID4VCI issuer and OID4VP verifier
      configuration for runtime settings that are not owned by credential-design,
      status-list, or DCQL APIs.

      VDX additionally hosts business wallets: tenant-deployable browser
      applications served at `<tenant-host>/wallets/<slug>` with configuration
      rooted at `wallets.<slug>.*`. A business wallet binds to many issuer,
      verifier, and authorization-server instances, and each of those instances
      serves many wallets in the same tenant, so those bindings are exposed as
      n-to-m sub-resources with their own configuration.
  description: |
    API for configuring tenant-owned service instances.

    Platform-config is separate from platform-admin. Platform-admin manages the
    tenant lifecycle, domains, signup, operator bootstrap, and platform
    infrastructure. Platform-config manages the service instances a tenant runs
    and the operational resources behind those instances.

    EDK and VDX share one authorization-server resource, lifecycle, discovery,
    federation, and hosted-configuration surface. EDK tenant setup creates a
    system/default hosted resource. Both products may register external resources;
    the platform tenant and its built-in AS remain isolated and are rejected. EDK
    OID4VCI issuer and OID4VP verifier configuration remains tenant-scoped
    without an instance id unless the deployment enables multi-instance
    capabilities. VDX can host multiple service instances per tenant, so its
    configuration paths are scoped by `{instanceId}`. The instance-scoped VDX
    paths are backed by the service-instance commands and use VDX software party
    ids as instance ids for issuer and verifier instances.

    The API covers OAuth2/OIDC authorization-server resources and hosted settings,
    federation bindings, public clients, identities, signing, and feature policy.
    Confidential upstream client credentials are write-only or opaque typed secret/KMS
    references and are never returned. It also exposes opaque-handle typed KMS
    resource administration and sectioned OID4VCI issuer and OID4VP verifier
    runtime configuration for settings that are not owned by credential-design,
    status-list, or DCQL APIs.

    The storage layer is intentionally hidden. Consumers work with typed
    configuration resources and effective values; they do not manage raw
    configuration keys or storage-specific records.

    Settings resources return effective values with `{ value, source }` markers.
    `source: tenant` means the tenant has an override. `source: default` means
    the value is inherited from runtime defaults. PUT replaces one settings
    resource and clears omitted fields back to defaults. PATCH follows JSON
    Merge Patch semantics: absent fields stay unchanged and explicit `null`
    clears a field.

    Hosted AS clients are managed as first-class public or confidential OAuth2 client registrations.
    Federation bindings own their confidential upstream client authentication and
    accept only write-once secret material or existing typed secret/KMS references.
  contact:
    name: Product Engineering
    email: support@example.com
    url: https://example.com
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
servers:
  - url: https://api.example.com/api/platform/config/v1
    description: Production server.
  - url: http://localhost:8080/api/platform/config/v1
    description: Local development server.
security:
  - bearer: []
tags:
  - name: DeveloperConsoleConfig
    description: Tenant-wide Developer Console exposure policy and tool overrides.
  - name: StatusListSigningKeys
    description: Platform-authority bindings between status lists and exact tenant KMS keys.
  - name: AuthorizationServers
    description: >
      Tenant-scoped authorization servers in their three shapes. A hosted server holds the tenant's
      own accounts. A hosted server may instead proxy for upstream ones, so wallets address it while
      its users authenticate elsewhere. An external provider is registered as it is. The platform
      tenant is rejected.
  - name: AuthorizationServerMigrations
    description: Read-safe migration ledger remediation for the acting customer tenant. The platform tenant is rejected.
  - name: FederationBindings
    description: One-way delegations from a hosted authorization server to the external OIDC providers that
      authenticate its users. The hosted server stays the one wallets and clients address; the
      federation binding does not advertise the upstream provider to wallets or add it to credential
      issuer metadata. A separate issuer binding can advertise that same external provider.
  - name: Oid4vciAuthorizationServerSelection
    description: Issuer bindings, defaults, selection overrides, and protocol-profile upgrades by stable AS resource UUID.
  - name: AsTokenSettings
    description: Token lifetime and token-format settings for hosted authorization-server resources. External resources are rejected.
  - name: AsGrantSettings
    description: Grant type, response type, and scope settings for hosted authorization-server resources.
  - name: AsFeaturesSettings
    description: Typed OAuth2/OIDC feature policy for hosted authorization-server resources.
  - name: AsDeviceFlowSettings
    description: RFC 8628 device authorization grant settings for authorization-server instances.
  - name: AsTokenExchangeSettings
    description: RFC 8693 token exchange settings for authorization-server instances.
  - name: AsInteractiveAuthorizationSettings
    description: OID4VCI interactive authorization endpoint (IAE) settings for authorization-server instances.
  - name: AsWebAuthnSettings
    description: Local WebAuthn login relying-party policy for authorization-server instances.
  - name: AsSignedMetadataSettings
    description: Signed authorization-server metadata document settings for authorization-server instances.
  - name: AsClients
    description: Hosted-AS public and confidential client registrations. Confidential credential responses contain only opaque typed references.
  - name: AsIdentities
    description: Authenticating identities, their login identifiers and credentials, and optional party bindings for authorization-server instances.
  - name: Oid4vciIssuerMetadataSettings
    description: OID4VCI issuer metadata and display settings.
  - name: Oid4vciIssuerSecuritySettings
    description: OID4VCI issuer credential response and request encryption settings.
  - name: Oid4vciIssuerIssuanceSettings
    description: OID4VCI issuer issuance tuning settings.
  - name: Oid4vciIssuerTrustDomainApiSettings
    description: Authenticated Trust Domain API connection used by the issuer to resolve trust material.
  - name: Oid4vciIssuerCredentialDefaults
    description: OID4VCI issuer-level credential issuance defaults, overridable per credential configuration.
  - name: Oid4vciIssuerCredentialConfigurationSettings
    description: OID4VCI issuer per-credential-configuration non-display settings and their effective resolved values.
  - name: Oid4vciIssuerCredentialConfigurationImport
    description: Import OID4VCI credential configurations from a remote issuer.
  - name: Oid4vpVerifierClientSettings
    description: OID4VP verifier client identity and redirect settings.
  - name: Oid4vpVerifierRequestObjectSigningSettings
    description: OID4VP verifier request-object signing settings.
  - name: Oid4vpVerifierSessionSettings
    description: OID4VP verifier authorization-session lifetime settings.
  - name: Oid4vpVerifierReconciliationSettings
    description: OID4VP verifier identity reconciliation settings.
  - name: Oid4vciIssuerInstances
  - name: Oid4vciIssuerTestingConsoleSettings
    description: OID4VCI issuer instance testing-console settings.
  - name: Oid4vciIssuerCatalogConsoleSettings
    description: OID4VCI issuer instance catalog-console settings.
  - name: Oid4vpVerifierInstances
  - name: Oid4vpVerifierTestingConsoleSettings
    description: OID4VP verifier instance testing-console settings.
  - name: Oid4vpVerifierCatalogConsoleSettings
    description: OID4VP verifier instance catalog-console settings.
  - name: KmsResources
    description: >
      Manage tenant-scoped typed KMS resources through opaque resource handles.
      Provider identities, key aliases and ids, resolvers, locators, permits, and
      credential material are never exposed.
  - name: EmailAccounts
    description: >
      Manage tenant SMTP mail accounts. Accounts are EXTERNAL software parties with an EMAIL_SERVER
      capability and configuration rooted at `vdx.service.email.accounts.<accountId>.*`. Accounts
      created for the platform tenant act as named defaults that tenant runtimes can inherit unless
      the tenant creates an account with its own sender and SMTP settings.
  - name: EmailCatalog
    description: >
      Manage registered email types and independently versioned Mustache templates. Product defaults,
      platform overrides, and tenant/application overrides resolve without copying inherited content.
  - name: BusinessWallets
    description: >
      Business wallet instance lifecycle. A business wallet is a tenant-deployable browser
      application served at `<tenant-host>/wallets/<slug>`, modeled as a software party with a
      WALLET capability, a BUSINESS_WALLET tenant public endpoint, and configuration rooted at
      `wallets.<slug>.*`.
  - name: BusinessWalletBrandingSettings
    description: Theme, logo, support link, and locale settings for a business wallet.
  - name: BusinessWalletFeaturesSettings
    description: >
      Feature policy for a business wallet. Writes are unrestricted; reads are clamped by the
      license features the tenant holds for the wallet's edition.
  - name: BusinessWalletIssuanceDefaultsSettings
    description: Values a business wallet pre-fills when a user starts an OID4VCI issuance flow.
  - name: BusinessWalletVerificationDefaultsSettings
    description: Values a business wallet pre-fills when a user starts an OID4VP presentation flow.
  - name: BusinessWalletSessionSettings
    description: Browser session lifetime and login/logout redirect settings for a business wallet.
  - name: BusinessWalletIssuerBindings
    description: >
      n-to-m bindings between a business wallet and the OID4VCI issuer instances it offers. One
      wallet binds many issuers and one issuer serves many wallets in the same tenant.
  - name: BusinessWalletVerifierBindings
    description: >
      n-to-m bindings between a business wallet and the OID4VP verifier instances it offers. One
      wallet binds many verifiers and one verifier serves many wallets in the same tenant.
  - name: BusinessWalletAuthorizationServerBindings
    description: >
      n-to-m bindings between a business wallet and the authorization servers its users log in
      through. Each binding owns a public PKCE client registration on the bound AS.
  - name: BusinessWalletMemberships
    description: >
      Tenant and wallet scoped operator membership. Membership roles apply only to the named
      business wallet and never alter authorization-server administrator roles or identity
      credentials.
paths:
  /tenants/{tenantId}/developer-console:
    parameters:
      - $ref: './platform-config-components.yml#/components/parameters/TenantId'
    get:
      tags: [DeveloperConsoleConfig]
      operationId: getDeveloperConsoleConfig
      summary: Get tenant-wide Developer Console configuration
      description: Returns effective tenant defaults and tenant overrides for the Developer Console.
      x-products: [edk, vdx]
      responses:
        '200':
          description: Effective Developer Console configuration.
          content:
            application/json:
              schema:
                $ref: './platform-config-components.yml#/components/schemas/DeveloperConsoleConfig'
        '400':
          $ref: './common-components.yml#/components/responses/ValidationError'
        '404':
          $ref: './common-components.yml#/components/responses/NotFound'
        '503':
          $ref: './common-components.yml#/components/responses/Error'
    put:
      tags: [DeveloperConsoleConfig]
      operationId: replaceDeveloperConsoleConfig
      summary: Replace tenant-wide Developer Console configuration
      description: Replaces the tenant policy when the supplied revision is current; the response has the next revision.
      x-products: [edk, vdx]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './platform-config-components.yml#/components/schemas/DeveloperConsoleConfig'
      responses:
        '200':
          description: Replaced Developer Console configuration.
          content:
            application/json:
              schema:
                $ref: './platform-config-components.yml#/components/schemas/DeveloperConsoleConfig'
        '400':
          $ref: './common-components.yml#/components/responses/ValidationError'
        '404':
          $ref: './common-components.yml#/components/responses/NotFound'
        '412':
          description: The supplied revision is stale.
          content:
            application/json:
              schema:
                $ref: './common-components.yml#/components/schemas/ApiError'
        '503':
          $ref: './common-components.yml#/components/responses/Error'

  /tenants/{tenantId}/status-lists/{statusListId}/signing-key:
    parameters:
      - $ref: './platform-config-components.yml#/components/parameters/TenantId'
      - $ref: './platform-config-components.yml#/components/parameters/StatusListId'
    get:
      tags: [StatusListSigningKeys]
      summary: Get a status-list signing key binding
      operationId: getStatusListSigningKeyBinding
      x-products: [edk, vdx]
      responses:
        '200':
          description: The exact typed KMS resource and key authorized for this status list.
          content:
            application/json:
              schema:
                $ref: './platform-config-components.yml#/components/schemas/StatusListSigningKeyBinding'
        '404':
          $ref: './common-components.yml#/components/responses/NotFound'
    put:
      tags: [StatusListSigningKeys]
      summary: Replace a status-list signing key binding
      operationId: replaceStatusListSigningKeyBinding
      x-products: [edk, vdx]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './platform-config-components.yml#/components/schemas/StatusListSigningKeyBindingRequest'
      responses:
        '200':
          description: The stored platform-authority binding.
          content:
            application/json:
              schema:
                $ref: './platform-config-components.yml#/components/schemas/StatusListSigningKeyBinding'
        '400':
          $ref: './common-components.yml#/components/responses/ValidationError'
        '403':
          $ref: './common-components.yml#/components/responses/Forbidden'
  /tenants/{tenantId}/authorization-server-migrations:
    get:
      tags: [AuthorizationServerMigrations]
      summary: List authorization-server migration entries
      description: >
        Lists only the acting customer tenant's sanitized migration ledger entries. The platform
        tenant is rejected. Source configuration values, credentials, secret locators, exception
        messages, and stack traces are never returned.
      operationId: listAuthorizationServerMigrations
      x-products: [edk, vdx]
      x-platform-tenant: rejected
      parameters:
        - $ref: './platform-config-components.yml#/components/parameters/TenantId'
        - $ref: './platform-config-components.yml#/components/parameters/AuthorizationServerMigrationStatusQuery'
        - $ref: './platform-config-components.yml#/components/parameters/AuthorizationServerMigrationSourceTypeQuery'
        - $ref: './platform-config-components.yml#/components/parameters/PageQuery'
        - $ref: './platform-config-components.yml#/components/parameters/SizeQuery'
      responses:
        '200':
          description: Tenant-scoped migration ledger entries.
          content:
            application/json:
              schema:
                $ref: './platform-config-components.yml#/components/schemas/AuthorizationServerMigrationEntryList'
        '401':
          $ref: './common-components.yml#/components/responses/Unauthorized'
        '403':
          $ref: './common-components.yml#/components/responses/Forbidden'
  /tenants/{tenantId}/authorization-server-migrations/{authorizationServerMigrationId}:
    get:
      tags: [AuthorizationServerMigrations]
      summary: Get an authorization-server migration entry
      operationId: getAuthorizationServerMigration
      x-products: [edk, vdx]
      x-platform-tenant: rejected
      parameters:
        - $ref: './platform-config-components.yml#/components/parameters/TenantId'
        - $ref: './platform-config-components.yml#/components/parameters/AuthorizationServerMigrationId'
      responses:
        '200':
          description: Sanitized migration entry owned by the acting tenant.
          content:
            application/json:
              schema:
                $ref: './platform-config-components.yml#/components/schemas/AuthorizationServerMigrationEntry'
        '400':
          $ref: './common-components.yml#/components/responses/ValidationError'
        '404':
          $ref: './common-components.yml#/components/responses/NotFound'
  /tenants/{tenantId}/authorization-server-migrations/{authorizationServerMigrationId}/resume:
    post:
      tags: [AuthorizationServerMigrations]
      summary: Resume a failed authorization-server migration
      description: >
        Invokes the coded migration for a FAILED source using revision and source-digest
        compare-and-set. It never edits a runtime projection or creates a compatibility record.
        A stale revision, changed digest, APPLIED entry, wrong tenant, or platform tenant fails
        with conflict or forbidden and does not mutate the ledger.
      operationId: resumeAuthorizationServerMigration
      x-products: [edk, vdx]
      x-platform-tenant: rejected
      parameters:
        - $ref: './platform-config-components.yml#/components/parameters/TenantId'
        - $ref: './platform-config-components.yml#/components/parameters/AuthorizationServerMigrationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './platform-config-components.yml#/components/schemas/ResumeAuthorizationServerMigrationRequest'
      responses:
        '200':
          description: Applied ledger entry with incremented attempt count and revision and its target authorization-server UUID.
          content:
            application/json:
              schema:
                $ref: './platform-config-components.yml#/components/schemas/AuthorizationServerMigrationEntry'
        '400':
          $ref: './common-components.yml#/components/responses/ValidationError'
        '403':
          $ref: './common-components.yml#/components/responses/Forbidden'
        '404':
          $ref: './common-components.yml#/components/responses/NotFound'
        '409':
          description: Revision or digest changed, entry is already applied, or the entry belongs to another tenant. The ledger is unchanged.
          content:
            application/json:
              schema:
                $ref: './common-components.yml#/components/schemas/ErrorResponse'
  /tenants/{tenantId}/authorization-server-migrations/{authorizationServerMigrationId}/accept-source-change:
    post:
      tags: [AuthorizationServerMigrations]
      summary: Accept and retry a reviewed migration source change
      description: >
        Distinct audited operation for an administrator-reviewed source change. It re-reads the
        source, requires the recorded and current digests plus ledger revision to match the request,
        records the digest transition and operator reason, and retries the FAILED source. It is not
        a resume mode. Conflicts and cancellation do not mutate the ledger.
      operationId: acceptAuthorizationServerMigrationSourceChange
      x-products: [edk, vdx]
      x-platform-tenant: rejected
      parameters:
        - $ref: './platform-config-components.yml#/components/parameters/TenantId'
        - $ref: './platform-config-components.yml#/components/parameters/AuthorizationServerMigrationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './platform-config-components.yml#/components/schemas/AcceptAuthorizationServerMigrationSourceChangeRequest'
      responses:
        '200':
          description: Applied ledger entry after the audited source-digest transition and retry.
          content:
            application/json:
              schema:
                $ref: './platform-config-components.yml#/components/schemas/AuthorizationServerMigrationEntry'
        '400':
          $ref: './common-components.yml#/components/responses/ValidationError'
        '403':
          $ref: './common-components.yml#/components/responses/Forbidden'
        '404':
          $ref: './common-components.yml#/components/responses/NotFound'
        '409':
          description: Revision, recorded digest, or current source digest differs; entry is applied; or tenant ownership does not match. The ledger is unchanged.
          content:
            application/json:
              schema:
                $ref: './common-components.yml#/components/schemas/ErrorResponse'
  /tenants/{tenantId}/authorization-servers:
    post:
      tags: [AuthorizationServers]
      summary: Create a hosted or external authorization-server resource
      description: >
        Creates a durable authorization-server resource. The platform tenant is not a valid target.
        EXTERNAL registration performs secured OAuth2 and OIDC discovery from the issuer and accepts
        no manual endpoint overrides. External resources do not consume a license quota; hosted
        creation consumes the existing hosted-AS entitlement and quota.
      operationId: createAuthorizationServer
      x-products: [edk, vdx]
      parameters:
        - $ref: './platform-config-components.yml#/components/parameters/TenantId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './platform-config-components.yml#/components/schemas/CreateAuthorizationServerRequest'
      responses:
        '201':
          description: Created authorization-server resource.
          content:
            application/json:
              schema:
                $ref: './platform-config-components.yml#/components/schemas/AuthorizationServerResource'
        '400':
          $ref: './common-components.yml#/components/responses/ValidationError'
        '401':
          $ref: './common-components.yml#/components/responses/Unauthorized'
        '403':
          $ref: './common-components.yml#/components/responses/Forbidden'
    get:
      tags: [AuthorizationServers]
      summary: List authorization-server resources
      description: Lists durable hosted and external resources for the tenant. Runtime configuration projections are not lifecycle authority.
      operationId: listAuthorizationServers
      x-products: [edk, vdx]
      parameters:
        - $ref: './platform-config-components.yml#/components/parameters/TenantId'
        - $ref: './platform-config-components.yml#/components/parameters/PageQuery'
        - $ref: './platform-config-components.yml#/components/parameters/SizeQuery'
      responses:
        '200':
          description: Authorization-server resources.
          content:
            application/json:
              schema:
                $ref: './platform-config-components.yml#/components/schemas/AuthorizationServerResourceList'
        '401':
          $ref: './common-components.yml#/components/responses/Unauthorized'
        '403':
          $ref: './common-components.yml#/components/responses/Forbidden'
  /tenants/{tenantId}/authorization-servers/{authorizationServerId}:
    get:
      tags: [AuthorizationServers]
      summary: Get an authorization-server resource
      operationId: getAuthorizationServer
      x-products: [edk, vdx]
      parameters:
        - $ref: './platform-config-components.yml#/components/parameters/TenantId'
        - $ref: './platform-config-components.yml#/components/parameters/AuthorizationServerId'
      responses:
        '200':
          description: Authorization-server resource.
          content:
            application/json:
              schema:
                $ref: './platform-config-components.yml#/components/schemas/AuthorizationServerResource'
        '403':
          $ref: './common-components.yml#/components/responses/Forbidden'
        '404':
          $ref: './common-components.yml#/components/responses/NotFound'
    put:
      tags: [AuthorizationServers]
      summary: Update an authorization-server resource
      operationId: updateAuthorizationServer
      x-products: [edk, vdx]
      parameters:
        - $ref: './platform-config-components.yml#/components/parameters/TenantId'
        - $ref: './platform-config-components.yml#/components/parameters/AuthorizationServerId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './platform-config-components.yml#/components/schemas/UpdateAuthorizationServerRequest'
      responses:
        '200':
          description: Updated authorization-server resource.
          content:
            application/json:
              schema:
                $ref: './platform-config-components.yml#/components/schemas/AuthorizationServerResource'
        '400':
          $ref: './common-components.yml#/components/responses/ValidationError'
        '404':
          $ref: './common-components.yml#/components/responses/NotFound'
        '409':
          $ref: './common-components.yml#/components/responses/Conflict'
    delete:
      tags: [AuthorizationServers]
      summary: Delete an authorization-server resource
      description: >
        Deletes a decommissioned non-system resource and its generated runtime projection.


        Business wallets log their users in through an authorization server, so this delete is
        guarded by the wallet binding join. If any business wallet has this AS as its **default**
        authorization server the request is rejected with `409` unconditionally: `detachBindings`
        does not override it, because removing a wallet's default AS breaks login for that wallet.
        Repoint those wallets at another authorization server first. If wallets merely bind this AS
        without defaulting to it, the delete is still rejected with `409` unless
        `detachBindings=true`, which removes those binding rows and de-registers the wallets' public
        clients as part of the delete. Call `listBusinessWallets` with
        `boundAuthorizationServerId=<resource UUID>` (add `boundDefaultOnly=true` for the unrecoverable set)
        to enumerate the affected wallets before deleting.
      operationId: deleteAuthorizationServer
      x-products: [edk, vdx]
      parameters:
        - $ref: './platform-config-components.yml#/components/parameters/TenantId'
        - $ref: './platform-config-components.yml#/components/parameters/AuthorizationServerId'
        - $ref: './platform-config-components.yml#/components/parameters/DetachBindingsQuery'
      responses:
        '200':
          description: Delete result.
          content:
            application/json:
              schema:
                $ref: './platform-config-components.yml#/components/schemas/DeleteAuthorizationServerResult'
              example:
                deleted: true
        '409':
          description: >
            Business wallets still reference this authorization server. `error.details.reason` is
            `DEFAULT_AUTHORIZATION_SERVER_IN_USE` when at least one wallet defaults to it, in which
            case `detachBindings` does not help, and `BOUND_TO_BUSINESS_WALLETS` otherwise.
            `details.blockingWallets` is a comma-separated list of the blocking wallet slugs.


            A cascade (`detachBindings=true`) detaches every binding row in one step and only then
            de-registers the wallets' public clients, so no wallet is ever left binding this server
            with its client already removed. If a de-registration fails the delete is reported as
            failed with the rows already detached; reissuing it completes, and any client left
            behind goes away with the server's own registry.
          content:
            application/json:
              schema:
                $ref: './common-components.yml#/components/schemas/ErrorResponse'
              example:
                error:
                  code: CONFLICT
                  category: CONFLICT
                  message: The authorization server is the default for one or more business wallets.
                  details:
                    reason: DEFAULT_AUTHORIZATION_SERVER_IN_USE
                    blockingWallets: partners,suppliers
  /tenants/{tenantId}/authorization-servers/{authorizationServerId}/activate:
    post:
      tags: [AuthorizationServers]
