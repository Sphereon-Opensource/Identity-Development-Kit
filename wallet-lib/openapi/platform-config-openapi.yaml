            application/json:
              schema:
                $ref: './platform-config-components.yml#/components/schemas/BusinessWalletMembership'
        '404':
          $ref: './common-components.yml#/components/responses/NotFound'
    patch:
      tags: [BusinessWalletMemberships]
      summary: Update a business wallet membership
      description: >
        Replaces roles and/or activation time. An explicit null `activatedAt` makes the grant
        ineffective without revoking it. Revocation is the separate DELETE operation.
      operationId: updateBusinessWalletMembership
      x-products: [vdx]
      x-license-protection:
        entitlementKey: vdx.business-wallet.membership.update
        deploymentShapePredicates: [packaging=container, environment=production]
        protectionMode: licensed
      parameters:
        - $ref: './platform-config-components.yml#/components/parameters/TenantId'
        - $ref: './platform-config-components.yml#/components/parameters/BusinessWalletSlug'
        - $ref: './platform-config-components.yml#/components/parameters/BusinessWalletMemberIdentityId'
      requestBody:
