      summary: Create an email account
      description: >
        Creates an EXTERNAL software party with an EMAIL_SERVER capability and writes the mail account
        config under `vdx.service.email.accounts.<accountId>.*`. The optional write-only SMTP password
        creates the account's typed resource binding; raw secret identifiers, provider references,
        paths, and environment-variable names are rejected.
