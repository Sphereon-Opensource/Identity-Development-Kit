        in: path
        required: true
        description: The `credential_configuration_id` whose non-display settings are addressed. This is the `<id>` segment in `oid4vci.issuer.credentials.[<id>].*` config keys.
        schema:
          type: string
        example: EuPid
    get:
      tags: [Oid4vciIssuerCredentialConfigurationSettings]
      summary: Get a single OID4VCI issuer credential-configuration's non-display settings
      operationId: getOid4vciIssuerCredentialConfigurationSetting
      x-products: [edk]
      responses:
        '200':
          description: The credential configuration's non-display settings.
          content:
            application/json:
              schema:
                $ref: './platform-config-components.yml#/components/schemas/CredentialConfigurationSettings'
        '404':
          $ref: './common-components.yml#/components/responses/NotFound'
    put:
      tags: [Oid4vciIssuerCredentialConfigurationSettings]
      summary: Create or replace a single OID4VCI issuer credential-configuration's non-display settings
      description: >
        Upserts the non-display settings for one `credential_configuration_id` and registers it in
        the issuer's credential-configuration index. Scalar and list fields are replaced wholesale;
        omitted/null fields are cleared. Design-authored display and claim metadata for the same
        configuration are left untouched.
      operationId: replaceOid4vciIssuerCredentialConfigurationSetting
      x-products: [edk]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './platform-config-components.yml#/components/schemas/CredentialConfigurationSettings'
      responses:
        '200':
          description: The credential configuration's non-display settings after replacement.
          content:
            application/json:
              schema:
                $ref: './platform-config-components.yml#/components/schemas/CredentialConfigurationSettings'
        '400':
          $ref: './common-components.yml#/components/responses/ValidationError'
    patch:
      tags: [Oid4vciIssuerCredentialConfigurationSettings]
      summary: Update a single OID4VCI issuer credential-configuration's non-display settings
      description: >
        Applies RFC 7386 merge-patch semantics to one `credential_configuration_id`. Absent fields
        stay unchanged. Explicit null clears the field. Design-authored display and claim metadata for
        the same configuration are left untouched.
      operationId: updateOid4vciIssuerCredentialConfigurationSetting
      x-products: [edk]
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: './platform-config-components.yml#/components/schemas/CredentialConfigurationSettingsPatch'
          application/json:
            schema:
              $ref: './platform-config-components.yml#/components/schemas/CredentialConfigurationSettingsPatch'
      responses:
        '200':
          description: The credential configuration's non-display settings after patch.
          content:
            application/json:
              schema:
                $ref: './platform-config-components.yml#/components/schemas/CredentialConfigurationSettings'
        '400':
          $ref: './common-components.yml#/components/responses/ValidationError'
        '404':
          $ref: './common-components.yml#/components/responses/NotFound'
    delete:
      tags: [Oid4vciIssuerCredentialConfigurationSettings]
      summary: Delete a single OID4VCI issuer credential-configuration's non-display settings
      description: >
        Removes the `credential_configuration_id` from the issuer's credential-configuration index
        and clears its non-display settings. Design-authored display and claim metadata are not
        deleted.
      operationId: deleteOid4vciIssuerCredentialConfigurationSetting
      x-products: [edk]
      responses:
        '204':
          description: The credential configuration's non-display settings were removed.
