        reverse lookup over the binding join: they return the wallets that reference the given
        instance. The console calls this before offering to delete an issuer, verifier, or
        authorization-server instance, so it can show which wallets would break and decide whether
        to offer the cascading `detachBindings` delete. Adding `boundDefaultOnly=true` narrows the
