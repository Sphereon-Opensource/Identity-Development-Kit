  /tenants/{tenantId}/oid4vci/issuer/credential-defaults:
    get:
      tags: [Oid4vciIssuerCredentialDefaults]
      summary: Get OID4VCI issuer credential defaults
      description: >
        Returns the effective issuer-level credential defaults with per-field source markers. Each
        field resolves as `issuer` (a default set at this issuer scope) over `default` (the platform
        default). These defaults form the `issuer` layer beneath per-configuration settings: for a
        credential configuration the effective value resolves `configuration` over `issuer` over
        `design` over `default`. Inheritance is live and resolved at read and issuance time, never
        snapshotted.
      operationId: getOid4vciIssuerCredentialDefaults
      x-products: [edk]
      parameters:
        - $ref: './platform-config-components.yml#/components/parameters/TenantId'
      responses:
        '200':
          description: Effective issuer credential defaults.
          content:
            application/json:
              schema:
                $ref: './platform-config-components.yml#/components/schemas/Oid4vciIssuerCredentialDefaultsView'
    put:
      tags: [Oid4vciIssuerCredentialDefaults]
      summary: Replace OID4VCI issuer credential defaults
      description: >
        Replaces the issuer credential defaults. Provided non-null fields become issuer-level
        defaults; omitted fields and explicit nulls clear the issuer default and return the field to
        the platform default.
      operationId: replaceOid4vciIssuerCredentialDefaults
      x-products: [edk]
      parameters:
        - $ref: './platform-config-components.yml#/components/parameters/TenantId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './platform-config-components.yml#/components/schemas/Oid4vciIssuerCredentialDefaults'
      responses:
        '200':
          description: Effective issuer credential defaults after replacement.
          content:
            application/json:
              schema:
                $ref: './platform-config-components.yml#/components/schemas/Oid4vciIssuerCredentialDefaultsView'
        '400':
          $ref: './common-components.yml#/components/responses/ValidationError'
    patch:
      tags: [Oid4vciIssuerCredentialDefaults]
      summary: Update OID4VCI issuer credential defaults
      description: >
        Applies RFC 7386 merge-patch semantics to the issuer credential defaults. Absent fields stay
        unchanged. Explicit null clears the issuer default for that field and returns it to the
        platform default.
      operationId: updateOid4vciIssuerCredentialDefaults
      x-products: [edk]
      parameters:
        - $ref: './platform-config-components.yml#/components/parameters/TenantId'
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: './platform-config-components.yml#/components/schemas/Oid4vciIssuerCredentialDefaults'
            example:
              validityPeriod: P180D
              status:
                statusListId: pid-revocation-list
                purpose: revocation
          application/json:
            schema:
              $ref: './platform-config-components.yml#/components/schemas/Oid4vciIssuerCredentialDefaults'
      responses:
        '200':
          description: Effective issuer credential defaults after patch.
          content:
            application/json:
              schema:
                $ref: './platform-config-components.yml#/components/schemas/Oid4vciIssuerCredentialDefaultsView'
        '400':
          $ref: './common-components.yml#/components/responses/ValidationError'
  /tenants/{tenantId}/oid4vci/issuer/credential-config-settings:
    get:
      tags: [Oid4vciIssuerCredentialConfigurationSettings]
      summary: List OID4VCI issuer per-configuration non-display settings
      description: >
        Returns the editable NON-DISPLAY settings for every `credential_configuration_id` the issuer
        advertises. The per-locale credential/claim display is owned by the credential-design API and
        is not part of this resource. These settings are overlaid onto the credential designs by the
        issuer-metadata read path.
