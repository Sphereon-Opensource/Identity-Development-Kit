    ImportExternalDesignInput:
      type: object
      description: |
        Body for importing a design from an external source. The server fetches `sourceUrl`
        through an SSRF-protected fetcher, snapshots the response, runs the mapper for
        `sourceType`, and persists both the canonical design and the source snapshot.
      required: [entityType, bindings, sourceUrl, sourceType]
      properties:
        entityType:
          $ref: '#/components/schemas/DesignEntityType'
        bindings:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/DesignBinding'
        alias:
          type: string
          nullable: true
        sourceUrl:
          type: string
          format: uri
          description: URL to fetch the external design material from.
          example: https://issuer.example.com/.well-known/openid-credential-issuer
        sourceType:
          $ref: '#/components/schemas/DesignSourceType'
      example:
        entityType: CREDENTIAL
        bindings:
          - credentialConfigurationId: IdentityCredential
        alias: identity-credential
        sourceUrl: https://issuer.example.com/.well-known/openid-credential-issuer
        sourceType: OID4VCI_CREDENTIAL_CONFIGURATION

    ResolveCredentialDesignInput:
      type: object
      description: |
        Body for resolving a credential design. Supply one of `designId`, a full `binding`, or a
        `bindingKey` + `bindingValue` pair to select the design; the rest tunes the result.
      properties:
        designId:
          type: string
          format: uuid
          nullable: true
        designVersion:
          type: integer
          nullable: true
          description: Exact design version to resolve. Null means latest active/effective version.
        activeAt:
          type: string
          format: date-time
          nullable: true
          description: Resolve the design version effective at this instant. Defaults to request time when omitted.
        binding:
          type: object
          allOf:
            - $ref: '#/components/schemas/DesignBinding'
          nullable: true
        bindingKey:
          type: string
          allOf:
            - $ref: '#/components/schemas/DesignBindingKey'
          nullable: true
        bindingValue:
          type: string
          nullable: true
        preferredLocales:
          type: array
          description: Locales to prefer when ordering displays and labels, most preferred first.
          items:
            type: string
        renderTarget:
          type: string
          allOf:
            - $ref: '#/components/schemas/RenderVariantKind'
          nullable: true
          description: Render variant kind to prioritize in the resolved result.
        externalMetadata:
          type: object
          allOf:
            - $ref: '#/components/schemas/ExternalDesignMetadata'
          nullable: true
          description: Inline external material to fold into resolution without a prior import.
      example:
        bindingKey: VCT
        bindingValue: https://issuer.example.com/identity
        preferredLocales: [en, nl]
        renderTarget: SIMPLE_CARD

    ResolveEntityDesignInput:
      type: object
      description: Body for resolving an issuer or verifier design. Like [ResolveCredentialDesignInput] without a render target.
      properties:
        designId:
          type: string
          format: uuid
          nullable: true
        designVersion:
          type: integer
          nullable: true
          description: Exact design version to resolve. Null means latest active/effective version.
        activeAt:
          type: string
          format: date-time
          nullable: true
          description: Resolve the design version effective at this instant. Defaults to request time when omitted.
        binding:
          type: object
          allOf:
            - $ref: '#/components/schemas/DesignBinding'
          nullable: true
        bindingKey:
          type: string
          allOf:
            - $ref: '#/components/schemas/DesignBindingKey'
          nullable: true
        bindingValue:
          type: string
          nullable: true
        preferredLocales:
          type: array
          items:
            type: string
        externalMetadata:
          type: object
          allOf:
            - $ref: '#/components/schemas/ExternalDesignMetadata'
          nullable: true
