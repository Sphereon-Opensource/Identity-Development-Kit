        contentHash: sha256-8f3a1c2b9d4e5f60718293a4b5c6d7e8f90a1b2c3d4e5f60718293a4b5c6d7e8
        createdAt: '2026-06-08T10:15:00Z'
        updatedAt: '2026-06-08T10:15:00Z'

    IssuanceDeferral:
      description: |
        Deferred-issuance policy for credentials built from this design. When `enabled`, the
        wallet's credential request can receive a deferred response instead of the credential
        itself, so the wallet polls the deferred-credential endpoint until an operator completes
        any outstanding data and marks the session ready.
      type: object
      required: [enabled]
      properties:
        enabled:
          type: boolean
        pollIntervalSeconds:
          type: integer
          minimum: 1
          nullable: true
          description: Suggested wallet poll interval, in seconds, returned with the deferred response.
        maxDeferralSeconds:
          type: integer
          minimum: 1
          nullable: true
          description: Maximum time the session stays deferred before it expires.
        approvalRequired:
          type: boolean
          nullable: true
          description: When true, the session also requires an explicit approval decision before it can be marked ready.

