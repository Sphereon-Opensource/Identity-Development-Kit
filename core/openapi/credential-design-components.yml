# ============================================================================
# Reusable schemas, enums, and parameters for the Credential Design API.
#
# The credential-design-openapi.yml root re-exports the entity schemas it needs
# as thin stubs and references these definitions. Shared pagination, error, and
# header components live in ./common-components.yml.
#
# Every schema here is grounded in the Kotlin DTOs of the EDK credential-design
# REST surface (package com.sphereon.data.store.credential.design). Field
# nullability and defaults match the data classes exactly.
# ============================================================================
openapi: 3.0.4
info:
  title: Credential Design API - Components
  version: 0.1.0
  description: Reusable component schemas for the Credential Design API.
paths: {}

components:
  parameters:
    DesignId:
      name: designId
      in: path
      required: true
      description: Server-assigned identifier of a credential, issuer, or verifier design.
      schema:
        type: string
        format: uuid
    VariantId:
      name: variantId
      in: path
      required: true
      description: Server-assigned identifier of a render variant.
      schema:
        type: string
        format: uuid
    SnapshotId:
      name: snapshotId
      in: path
      required: true
      description: Server-assigned identifier of a source snapshot.
      schema:
        type: string
        format: uuid
    BindingKey:
      name: bindingKey
      in: path
      required: true
      description: The binding dimension to match on.
      schema:
        $ref: '#/components/schemas/DesignBindingKey'
    BindingValue:
      name: bindingValue
      in: path
      required: true
      description: The value the chosen binding key must equal.
      schema:
        type: string
    Locale:
      name: locale
      in: path
      required: true
      description: BCP-47 language tag the asset belongs to, for example `en`, `nl`, or `en-GB`.
      schema:
        type: string
        example: en
    AssetType:
      name: assetType
      in: path
      required: true
      description: Which slot of a design's branding the asset fills.
      schema:
        $ref: '#/components/schemas/DesignAssetType'

  schemas:

    # ---- Enums --------------------------------------------------------------

    DesignEntityType:
      type: string
      description: The kind of design an entry describes.
      enum: [CREDENTIAL, ISSUER, VERIFIER]

    DesignHostingMode:
      type: string
      description: |
        Where a design's authoritative content lives.
          - `LOCAL`: authored and owned in this tenant; the local record is authoritative.
          - `CACHED_EXTERNAL`: imported from an external source and cached; the source is authoritative and refreshable.
          - `INFERRED`: derived on the fly from another artifact (a schema, a credential template) with no standalone source.
      enum: [LOCAL, CACHED_EXTERNAL, INFERRED]

    VctHostingMode:
      type: string
      description: |
        Hosting intent for an SD-JWT VC type identifier in a design binding.
          - `HOSTED`: the issuer derives and serves the VCT metadata document at `/public/schema/vct/{vctId}`.
          - `EXTERNAL`: the `vct` is an externally hosted URI and must not be served by this issuer.
          - `REGISTERED`: the `vct` is a standards or registry identifier, such as an EUDI PID or age attestation URN, that this issuer does not host.
          - `NONE`: the `vct` is a regular string or otherwise non-hosted identifier.
      enum: [HOSTED, EXTERNAL, REGISTERED, NONE]

    DesignSourceType:
      type: string
      description: |
        Origin of one layer that contributed to a design. A resolved design lists the layers
        that were applied in priority order; an imported design records the source it was pulled
        from. Values cover local authoring, schema and context inference, credential templates,
        party records, the OID4VCI / SD-JWT VC / OIDC / OpenID Federation metadata families,
        eIDAS registries, the W3C VC render method, and OCA bundles.
      enum:
        - LOCAL_OVERRIDE
        - LOCAL_SHARED
        - SCHEMA_INFERENCE
        - JSON_LD_CONTEXT
        - CREDENTIAL_TEMPLATE
        - PARTY_STORE
        - SD_JWT_VCT_METADATA
        - SD_JWT_ISSUER_METADATA
        - OID4VCI_CREDENTIAL_CONFIGURATION
        - OID4VCI_ISSUER_METADATA
        - OIDC_DISCOVERY
        - OPENID_FEDERATION
        - OAUTH_CLIENT_REGISTRATION
        - EIDAS_REGISTRY
        - EIDAS_CREDENTIAL_CATALOGUE
        - W3C_VC_RENDER_METHOD
        - OCA_BUNDLE
        - MANUAL_IMPORT

    DesignBindingKey:
      type: string
      description: |
        A single addressable dimension of a [DesignBinding], used by the find-by-binding-key
        lookup and by the resolution input. Each value names one field of the binding object.
      enum:
        - VCT
        - VCT_HOSTING_MODE
        - CREDENTIAL_CONFIGURATION_ID
        - SCHEMA_ID
        - DOC_TYPE
        - TYPE
        - CONTEXT
        - ISSUER_ID
        - ISSUER_DID
        - ISSUER_URI
        - VERIFIER_CLIENT_ID
        - OCA_SAID
        - CREDENTIAL_TYPE_FORMAT
        - CREDENTIAL_DESIGN_ID
        - CREDENTIAL_DESIGN_VERSION

    RenderVariantKind:
      type: string
      description: |
        The rendering technique a render variant supplies.
          - `SIMPLE_CARD`: colors plus a logo and background image, rendered by the wallet's built-in card.
          - `SVG_TEMPLATE`: an SVG template with substitution placeholders.
          - `W3C_RENDER_METHOD`: a W3C VC Data Model `renderMethod` reference.
          - `PDF_TEMPLATE`: a PDF template for document-style output.
          - `EXTERNAL_REFERENCE`: a pointer to a rendering hosted elsewhere.
      enum: [SIMPLE_CARD, SVG_TEMPLATE, W3C_RENDER_METHOD, PDF_TEMPLATE, EXTERNAL_REFERENCE]

    ClaimValueKind:
      type: string
      description: The logical value type of a claim, used to drive form widgets and display.
      enum:
        - STRING
        - BOOLEAN
        - NUMBER
        - INTEGER
        - ARRAY
        - OBJECT
        - DATE
        - DATE_TIME
        - URI
        - IMAGE
        - BINARY
        - MARKDOWN
        - REFERENCE
        - UNKNOWN

    ClaimWidgetHint:
      type: string
      description: A suggested input or display widget for a claim. Advisory; clients may override.
      enum:
        - TEXT
        - MULTILINE_TEXT
        - CHECKBOX
        - BADGE
        - LIST
        - TABLE
        - GROUP
        - DATE
        - DATE_TIME
        - URI
        - IMAGE
        - MARKDOWN
        - HIDDEN
        - PICKLIST
        - FILE

    SdPolicy:
      type: string
      description: |
        Selective-disclosure policy for a claim.
          - `ALWAYS`: the claim must be made selectively disclosable.
          - `ALLOWED`: selective disclosure is permitted but not required.
          - `NEVER`: the claim must always be present (not selectively disclosable).
      enum: [ALWAYS, ALLOWED, NEVER]

    DesignAssetType:
      type: string
      description: The branding slot a binary asset fills for a credential design.
      enum: [LOGO, BACKGROUND_IMAGE, SVG_TEMPLATE, PDF_TEMPLATE]

    SvgOrientation:
      type: string
      enum: [PORTRAIT, LANDSCAPE]

    SvgColorScheme:
      type: string
      enum: [LIGHT, DARK]

    SvgContrast:
      type: string
      enum: [NORMAL, HIGH]

    # ---- Value objects ------------------------------------------------------

    CredentialTypeFormat:
      type: string
      description: |
        Credential family that determines where claims live in the issued object.
          - `SD_JWT_VC`: SD-JWT VC using `vct`.
          - `MSO_MDOC`: ISO mdoc using `docType` and namespace-aware claims.
          - `W3C_VC`: W3C VC using `type` / `@context`, typically with claims under `credentialSubject`.
      enum: [SD_JWT_VC, MSO_MDOC, W3C_VC]

    CredentialTypeDescriptor:
      type: object
      description: |
        The design-owned credential type. This is the source of truth for the credential
        family and type value; binding-side type fields are compatibility hints and must
        match this descriptor when present.
      required: [format]
      properties:
        format:
          $ref: '#/components/schemas/CredentialTypeFormat'
        vct:
          type: string
          nullable: true
          description: Required when `format` is `SD_JWT_VC`.
        docType:
          type: string
          nullable: true
          description: Required when `format` is `MSO_MDOC`.
        type:
          type: string
          nullable: true
          description: Required W3C VC `type` value when `format` is `W3C_VC`.
        '@context':
          type: string
          nullable: true
          description: Optional W3C VC JSON-LD `@context` URI.
      example:
        format: SD_JWT_VC
        vct: https://issuer.example.com/identity

    DesignBinding:
      type: object
      description: |
        The set of credential-protocol identifiers a design is matched on. Every field is
        optional; a binding sets the dimensions that are meaningful for the credential it
        describes. The credential design itself owns the canonical `credentialType`; type fields
        on a binding are compatibility/search hints and must match the design type. Issuer and
        verifier bindings may pin a design version or leave it null to follow the latest active
        version.
      properties:
        vct:
          type: string
          nullable: true
          description: |
            SD-JWT VC type identifier. With `vctHostingMode: HOSTED`, callers may provide a
            plain string and let the issuer derive the hosted URI. With `EXTERNAL`, this must be
            the externally hosted VCT URI.
          example: identity
        vctHostingMode:
          $ref: '#/components/schemas/VctHostingMode'
        credentialConfigurationId:
          type: string
          nullable: true
          description: OID4VCI credential configuration id.
          example: IdentityCredential
        schemaId:
          type: string
          nullable: true
          description: JSON Schema `$id` the credential validates against.
        docType:
          type: string
          nullable: true
          description: ISO mdoc doctype.
          example: org.iso.18013.5.1.mDL
        type:
          type: string
          nullable: true
          description: W3C VC type value.
        '@context':
          type: string
          nullable: true
          description: W3C VC JSON-LD `@context` URL.
        issuerId:
          type: string
          nullable: true
          description: Logical issuer identifier.
        issuerDid:
          type: string
          nullable: true
          description: Issuer DID.
          example: did:web:issuer.example.com
        issuerUri:
          type: string
          nullable: true
          description: Issuer base URL.
        verifierClientId:
          type: string
          nullable: true
          description: OID4VP verifier `client_id`.
        ocaSaid:
          type: string
          nullable: true
          description: Self-addressing identifier (SAID) of a bound OCA bundle.
        credentialType:
          $ref: '#/components/schemas/NullableCredentialTypeDescriptor'
          description: Optional binding-side type hint. If present it must match the credential design's `credentialType`.
        credentialDesignId:
          type: string
          format: uuid
          nullable: true
          description: Credential design bound to an issuer/verifier instance.
        credentialDesignVersion:
          type: integer
          nullable: true
          description: Pinned credential design version. Null means latest active version.
        activeFrom:
          type: string
          format: date-time
          nullable: true
          description: Optional start time for this binding.
        activeUntil:
          type: string
          format: date-time
          nullable: true
          description: Optional exclusive end time for this binding.

    ClaimPathSegment:
      type: object
      description: |
        One step of a claim path. The `type` discriminator selects the segment kind:
          - `property`: descend into the named object property.
          - `index`: select a fixed array element by zero-based index.
          - `any`: select every element of an array (wildcard).
      required: [type]
      discriminator:
        propertyName: type
        mapping:
          property: '#/components/schemas/ClaimPathSegmentProperty'
          index: '#/components/schemas/ClaimPathSegmentIndex'
          any: '#/components/schemas/ClaimPathSegmentAny'
      oneOf:
        - $ref: '#/components/schemas/ClaimPathSegmentProperty'
        - $ref: '#/components/schemas/ClaimPathSegmentIndex'
        - $ref: '#/components/schemas/ClaimPathSegmentAny'

    ClaimPathSegmentProperty:
      type: object
      required: [type, name]
      properties:
        type:
          type: string
          enum: [property]
        name:
          type: string
          description: The object property to descend into.
          example: given_name

    ClaimPathSegmentIndex:
      type: object
      required: [type, index]
      properties:
        type:
          type: string
          enum: [index]
        index:
          type: integer
          description: Zero-based array index.
          example: 0

    ClaimPathSegmentAny:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [any]

    DesignClaimPath:
      type: array
      description: |
        An ordered path to a claim, expressed as a list of [ClaimPathSegment]. For example the
        path to `address.street` inside the first element of a `residences` array is
        `[{property residences},{index 0},{property address},{property street}]`.
      items:
        $ref: '#/components/schemas/ClaimPathSegment'
      example:
        - { type: property, name: given_name }

    ClaimLabel:
      type: object
      description: A localized label for a claim.
      required: [locale, label]
      properties:
        locale:
          type: string
          description: BCP-47 language tag.
          example: en
        label:
          type: string
          description: The display label for the claim in this locale.
          example: First name
        description:
          type: string
          nullable: true
          description: Optional longer help text for the claim in this locale.
        entryValues:
          type: object
          nullable: true
          additionalProperties:
            type: string
          description: Optional code-to-label map for enumerated claims, keyed by the stored code.

    ClaimPresentation:
      type: object
      description: |
        How a single claim of a credential design is labelled, ordered, and disclosed. The claim
        is addressed by `path`; everything else is presentation and policy metadata.
      required: [path, labels]
      properties:
        path:
          $ref: '#/components/schemas/DesignClaimPath'
        labels:
          type: array
          description: Localized labels for the claim, one per supported locale.
          items:
            $ref: '#/components/schemas/ClaimLabel'
        mandatory:
          type: boolean
          default: false
          description: Whether the claim must be present in an issued credential.
        sdPolicy:
          allOf:
            - $ref: '#/components/schemas/SdPolicy'
          default: ALLOWED
          description: Selective-disclosure policy for the claim.
        order:
          type: integer
          default: 0
          description: Display order within the credential; lower sorts first.
        group:
          type: string
          nullable: true
          description: Optional group key used to cluster related claims in the UI.
        svgId:
          type: string
          nullable: true
          description: Optional placeholder id this claim maps to inside an SVG render template.
        valueKind:
          type: string
          allOf:
            - $ref: '#/components/schemas/ClaimValueKind'
          nullable: true
          description: Logical value type, used to pick a default widget.
        widgetHint:
          type: string
          allOf:
            - $ref: '#/components/schemas/ClaimWidgetHint'
          nullable: true
          description: Suggested input or display widget.
        markdownAllowed:
          type: boolean
          default: false
          description: Whether the claim value may contain Markdown that the renderer should interpret.
        entryCodes:
          type: array
          nullable: true
          description: Allowed codes for an enumerated claim, without labels (labels live on [ClaimLabel.entryValues]).
          items:
            type: string
        unit:
          type: string
          nullable: true
          description: Unit of measure for a numeric claim, for example `kg` or `EUR`.
        defaultValue:
          type: string
          nullable: true
          description: |
            Optional per-claim default/preset value applied when authoring or pre-filling the claim,
            as a single non-localized string (for example `true`/`false` for a boolean, an enum code
            for a picklist, or a literal for a string claim).
        exampleValue:
          type: string
          nullable: true
          description: >-
            Illustrative sample value for this claim, used ONLY to pre-fill
            authoring/testing forms so testers do not hand-type every field.
            Distinct from defaultValue: exampleValue is never applied to a
            production-issued credential; defaultValue is a real preset that IS
            issued when the claim is unset.

    LocalizedCredentialDisplay:
      type: object
      description: How a credential design presents itself in one locale.
      required: [locale, name]
      properties:
        locale:
          type: string
          description: BCP-47 language tag.
          example: en
        name:
          type: string
          description: Credential display name in this locale.
          example: Identity Credential
        description:
          type: string
          nullable: true
          description: Optional longer description shown to the holder.
        issuerNameOverride:
          type: string
          nullable: true
          description: Optional issuer name to show for this credential, overriding the issuer design's name.
        preferredRenderVariantIds:
          type: array
          description: Render variant ids preferred for this locale, in order of preference.
          items:
            type: string
            format: uuid

    EntityLocaleDesign:
      type: object
      description: How an issuer or verifier presents itself in one locale.
      required: [locale]
      properties:
        locale:
          type: string
          description: BCP-47 language tag.
          example: en
        displayName:
          type: string
          nullable: true
          description: Issuer or verifier display name in this locale.
          example: Example Authority
        description:
          type: string
          nullable: true
          description: Optional longer description.
        logo:
          type: object
          allOf:
            - $ref: '#/components/schemas/AssetReference'
          nullable: true
          description: Optional issuer/verifier branding logo for this locale.

    # Shared asset shapes live in ./asset-components.yml and are re-referenced here
    # so existing `#/components/schemas/...` refs keep resolving.
    BlobInfo:
      $ref: './asset-components.yml#/components/schemas/BlobInfo'

    AssetReference:
      $ref: './asset-components.yml#/components/schemas/AssetReference'

    AssetInfo:
      $ref: './asset-components.yml#/components/schemas/AssetInfo'

    SvgTemplate:
      type: object
      description: A reference to an SVG render template, with optional presentation hints.
      required: [uri]
      properties:
        uri:
          type: string
          description: Resolvable URI of the SVG template.
        integrity:
          type: string
          nullable: true
          description: Optional subresource-integrity digest.
        orientation:
          type: string
          allOf:
            - $ref: '#/components/schemas/SvgOrientation'
          nullable: true
        colorScheme:
          type: string
          allOf:
            - $ref: '#/components/schemas/SvgColorScheme'
          nullable: true
        contrast:
          type: string
          allOf:
            - $ref: '#/components/schemas/SvgContrast'
          nullable: true
        localBlob:
          type: object
          allOf:
            - $ref: '#/components/schemas/BlobInfo'
          nullable: true

    W3cRenderMethodReference:
      type: object
      description: A W3C VC Data Model `renderMethod` entry referencing an external rendering.
      required: [type, uri]
      properties:
        type:
          type: string
          description: The renderMethod `type` value.
          example: SvgRenderingTemplate2023
        renderSuite:
          type: string
          nullable: true
          description: Optional render suite identifier.
        uri:
          type: string
          description: URI of the rendering resource.
        mediaType:
          type: string
          nullable: true
          example: image/svg+xml
        name:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        digestMultibase:
          type: string
          nullable: true
          description: Multibase-encoded digest of the rendering resource.
        renderProperties:
          type: array
          nullable: true
          description: Optional list of properties the rendering consumes.
          items:
            type: string

    NullableCredentialTypeDescriptor:
      type: object
      nullable: true
      description: Nullable credential type descriptor as serialized on optional binding hints.
      required: [format]
      properties:
        format:
          $ref: '#/components/schemas/CredentialTypeFormat'
        vct:
          type: string
          nullable: true
        docType:
          type: string
          nullable: true
        type:
          type: string
          nullable: true
        '@context':
          type: string
          nullable: true

    NullableAssetReference:
      type: object
      nullable: true
      description: Nullable asset reference as serialized by the runtime for unset render variant fields.
      required: [uri]
      properties:
        uri:
          type: string
          description: Resolvable URI of the asset. For locally stored assets this is the asset download URL.
        integrity:
          type: string
          nullable: true
        altText:
          type: string
          nullable: true
        contentType:
          type: string
          nullable: true
        localBlob:
          type: object
          nullable: true

    NullableSvgTemplate:
      type: object
      nullable: true
      description: Nullable SVG render template reference as serialized by the runtime.
      required: [uri]
      properties:
        uri:
          type: string
        integrity:
          type: string
          nullable: true
        orientation:
          type: string
          nullable: true
        colorScheme:
          type: string
          nullable: true
        contrast:
          type: string
          nullable: true
        localBlob:
          type: object
          nullable: true

    NullableW3cRenderMethodReference:
      type: object
      nullable: true
      description: Nullable W3C render method reference as serialized by the runtime.
      required: [type, uri]
      properties:
        type:
          type: string
        renderSuite:
          type: string
          nullable: true
        uri:
          type: string
        mediaType:
          type: string
          nullable: true
        name:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        digestMultibase:
          type: string
          nullable: true
        renderProperties:
          type: array
          nullable: true
          items:
            type: string

    ExternalDesignMetadata:
      type: object
      description: |
        An inline carrier for external design material passed straight into resolution without a
        prior import. Every field is optional; set only the families relevant to the credential.
        The JSON-object fields each hold the raw document for that source family. This is the
        inline alternative to importing from a URL.
      properties:
        sdJwtVctMetadata:
          type: object
          nullable: true
          description: SD-JWT VC type metadata document.
        oid4vciCredentialConfiguration:
          type: object
          nullable: true
          description: A single OID4VCI `credential_configurations_supported` entry.
        oid4vciIssuerMetadata:
          type: object
          nullable: true
          description: OID4VCI issuer metadata document.
        sdJwtIssuerMetadata:
          type: object
          nullable: true
          description: SD-JWT issuer metadata document.
        jsonSchema:
          type: object
          nullable: true
          description: JSON Schema for the credential.
        jsonLdContext:
          type: object
          nullable: true
          description: JSON-LD `@context` document.
        oidcDiscovery:
          type: object
          nullable: true
          description: OIDC discovery document.
        openIdFederationEntity:
          type: object
          nullable: true
          description: OpenID Federation entity statement.
        oauthClientRegistration:
          type: object
          nullable: true
          description: OAuth dynamic client registration document.
        eidasRegistryData:
          type: object
          nullable: true
          description: eIDAS trusted-list / registry record.
        eidasCatalogData:
          type: object
          nullable: true
          description: eIDAS credential catalog record.
        w3cRenderMethod:
          type: object
          nullable: true
          description: W3C VC renderMethod document.
        ocaBundle:
          type: object
          nullable: true
          description: A full OCA bundle (capture base plus overlays).
        ocaCaptureBase:
          type: object
          nullable: true
          description: An OCA capture base on its own.
        ocaOverlays:
          type: array
          description: OCA overlays applied on top of the capture base.
          items:
            type: object
        ocaFile:
          type: string
          nullable: true
          description: Reference to an OCA file (path or URI) to load the bundle from.
        overlayFiles:
          type: array
          description: References to additional overlay files.
          items:
            type: string

    AppliedDesignLayer:
      type: object
      description: One source layer that contributed to a resolved design, with its priority.
      required: [sourceType, priority]
      properties:
        sourceType:
          $ref: '#/components/schemas/DesignSourceType'
        sourceUrl:
          type: string
          nullable: true
          description: The URL the layer was fetched from, when it came from an external source.
        priority:
          type: integer
          description: Layer priority; higher wins when two layers set the same field.
        authoritative:
          type: boolean
          default: false
          description: Whether this layer is the authoritative source for the fields it sets (locks them).

    SemanticAttributeSetRef:
      type: object
      description: |
        A reference into the OCA capture model: the bound OCA bundle or vocabulary subset from
        which a credential draws its claims. Resolving the ref to
        derive selective-disclosure flags, data types, and display is the EDK engine's job; the
        design only carries the reference.
      required: [bundleId]
      properties:
        bundleId:
          type: string
          description: OCA bundle or vocabulary identifier.
          example: eu.europa.ec.eudi.pid.1
        version:
          type: string
          nullable: true
          description: Pinned bundle version; null resolves the current version.

    NullableSemanticAttributeSetRef:
      type: object
      nullable: true
      description: Nullable OCA capture-bundle reference as serialized on credential design records.
      required: [bundleId]
      properties:
        bundleId:
          type: string
        version:
          type: string
          nullable: true

    FieldRenderHint:
      type: object
      description: A derived per-field rendering hint, computed from imported source layers.
      required: [path, valueKind]
      properties:
        path:
          $ref: '#/components/schemas/DesignClaimPath'
        valueKind:
          $ref: '#/components/schemas/ClaimValueKind'
        widgetHint:
          type: string
          allOf:
            - $ref: '#/components/schemas/ClaimWidgetHint'
          nullable: true
        formatHint:
          type: string
          nullable: true
