          $ref: '#/components/schemas/DesignHostingMode'
        credentialType:
          $ref: '#/components/schemas/CredentialTypeDescriptor'
        bindings:
          type: array
          items:
            $ref: '#/components/schemas/DesignBinding'
        credentialTemplateId:
          type: string
          format: uuid
          nullable: true
          description: Optional credential template this design inferred from.
        issuerDesignId:
          type: string
          format: uuid
          nullable: true
          description: Optional issuer design this credential is issued under.
        displays:
          type: array
          items:
            $ref: '#/components/schemas/LocalizedCredentialDisplay'
        claims:
          type: array
          items:
            $ref: '#/components/schemas/ClaimPresentation'
        renderVariantIds:
          type: array
          items:
            type: string
            format: uuid
        derivedRenderHintsId:
          type: string
          format: uuid
          nullable: true
        sourceSnapshotIds:
          type: array
          items:
            type: string
            format: uuid
        contentHash:
          type: string
          nullable: true
          description: Hash of the canonical design content, used for change detection and ETags.
        semanticAttributeSetRef:
          $ref: '#/components/schemas/NullableSemanticAttributeSetRef'
        attributeProfileId:
          type: string
          format: uuid
          nullable: true
          description: Optional object model the design's claims were bound from.
        attributeProfileVersion:
          type: integer
          format: int64
          nullable: true
