components:
  parameters:
    CatalogStatusFilter:
      name: status
      in: query
      description: Restrict catalogs to this lifecycle status.
      schema:
        $ref: '#/components/schemas/AttestationCatalogStatus'
    CatalogVerificationEnabledFilter:
      name: verificationEnabled
      in: query
      description: Restrict catalogs by whether they participate in type verification.
      schema:
        type: boolean
    SchemaIdFilter:
      name: id
      in: query
      description: Restrict SchemaMeta entries to this server-assigned schema id.
      schema:
        type: string
    SupportedFormatsFilter:
      name: supportedFormats
      in: query
      description: Comma-separated format identifiers (`dc+sd-jwt`, `mso_mdoc`, ...).
      schema:
        type: string
    AttestationLoSFilter:
      name: attestationLoS
      in: query
      description: Restrict SchemaMeta entries to this attestation level of security.
      schema:
        type: string
    BindingTypeFilter:
      name: bindingType
      in: query
      description: Restrict SchemaMeta entries to this holder-binding type.
      schema:
        type: string
    TrustedAuthoritiesFrameworkTypeFilter:
      name: trustedAuthoritiesFrameworkType
      in: query
      description: Restrict SchemaMeta entries whose trustedAuthorities include this frameworkType.
      schema:
        type: string
    TrustedAuthoritiesValueFilter:
      name: trustedAuthoritiesValue
      in: query
      description: Restrict SchemaMeta entries whose trustedAuthorities include this value.
      schema:
        type: string
    SchemaUriFilter:
      name: schemaUri
      in: query
      description: Restrict SchemaMeta entries that list this schema URI.
      schema:
        type: string
    RulebookUriFilter:
      name: rulebookUri
      in: query
      description: Restrict SchemaMeta entries to this rulebook URI.
      schema:
        type: string
    LinkedDesignIdFilter:
      name: linkedDesignId
      in: query
      description: Management-only filter. Matches schemas linked from a hosted credential design.
      schema:
        type: string
    LinkedVctIdFilter:
      name: linkedVctId
      in: query
      description: Management-only filter. Matches schemas linked from a hosted VCT identifier.
      schema:
        type: string

  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: object
              additionalProperties: true

    AttestationCatalogStatus:
      type: string
      enum: [DRAFT, PUBLISHED, DISABLED]

    CatalogVerificationMode:
      type: string
      description: |
        Operator-configurable type gate used by OID4VP trust-domain enforcement.
        DISCOVERY never fails closed on type. TYPE_MUST_EXIST requires the presented
        vct/doctype/schema URI to exist in an enabled catalog. TYPE_AND_TRUSTED_AUTHORITIES
        also selects which configured trust-domain anchors (ETSI TL / OpenID Federation / X.509 AKI)
        are passed to the existing validators. Catalog membership never grants issuer trust.
      enum: [DISCOVERY, TYPE_MUST_EXIST, TYPE_AND_TRUSTED_AUTHORITIES]

    AttestationCatalog:
      type: object
      required: [id, slug, displayName, status, verificationEnabled, version]
      properties:
        id:
          type: string
        slug:
          type: string
        displayName:
          type: string
        description:
          type: string
          nullable: true
        status:
          $ref: '#/components/schemas/AttestationCatalogStatus'
        verificationEnabled:
          type: boolean
        version:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
          nullable: true
        updatedAt:
          type: string
          format: date-time
          nullable: true

    AttestationCatalogList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AttestationCatalog'

    CreateCatalogRequest:
      type: object
      required: [slug, displayName]
      properties:
        slug:
          type: string
        displayName:
          type: string
        description:
          type: string
          nullable: true
        verificationEnabled:
          type: boolean
          default: false

    UpdateCatalogRequest:
      type: object
      required: [displayName, verificationEnabled]
      properties:
        displayName:
          type: string
        description:
          type: string
          nullable: true
        verificationEnabled:
          type: boolean
        slug:
          type: string
          nullable: true

    SchemaUriRef:
      type: object
      required: [formatIdentifier, uri]
      properties:
        formatIdentifier:
          type: string
        uri:
          type: string

    TrustAuthority:
      type: object
      required: [frameworkType, value]
      properties:
        frameworkType:
          type: string
          enum: [aki, etsi_tl, openid_federation]
        value:
          type: string
        isLOTE:
          type: boolean
          nullable: true

    SchemaMeta:
      type: object
      required: [version, rulebookURI, attestationLoS, bindingType, supportedFormats, schemaURIs]
      properties:
        id:
          type: string
          nullable: true
        version:
          type: string
        rulebookURI:
          type: string
        trustedAuthorities:
          type: array
          items:
            $ref: '#/components/schemas/TrustAuthority'
        attestationLoS:
          type: string
        bindingType:
          type: string
        supportedFormats:
          type: array
          items:
            type: string
        schemaURIs:
          type: array
          items:
            $ref: '#/components/schemas/SchemaUriRef'

    PaginatedSchemaList:
      type: object
      description: Paginated SchemaMeta list using the shared PageMeta envelope.
      required: [data, pagination]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/SchemaMeta'
        pagination:
          $ref: './common-components.yml#/components/schemas/PageMeta'

    AttestationSchemaDocument:
      type: object
      required: [kind, mediaType, bytes]
      properties:
        kind:
          type: string
          enum: [FORMAT, RULEBOOK]
        formatIdentifier:
          type: string
          nullable: true
        mediaType:
          type: string
        bytes:
          type: string
          format: byte
        integrity:
          type: string
          nullable: true

    CatalogListingWindow:
      type: object
      description: Inclusive start and exclusive end for when a type is served. A null end stays open. An empty window (end equal to start) is not served.
      required: [start]
      properties:
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
          nullable: true

    CreateSchemaRequest:
      type: object
      required: [schema]
      properties:
        schema:
          $ref: '#/components/schemas/SchemaMeta'
        documents:
          type: array
          items:
            $ref: '#/components/schemas/AttestationSchemaDocument'
        listing:
          $ref: '#/components/schemas/CatalogListingWindow'

    UpdateSchemaRequest:
      type: object
      required: [schema]
      properties:
        schema:
          $ref: '#/components/schemas/SchemaMeta'
        documents:
          type: array
          items:
            $ref: '#/components/schemas/AttestationSchemaDocument'
        listing:
          $ref: '#/components/schemas/CatalogListingWindow'

    LinkSchemaRequest:
      type: object
      required: [version, attestationLoS, bindingType, supportedFormats]
      properties:
        designId:
          type: string
          nullable: true
        vctId:
          type: string
          nullable: true
        vct:
          type: string
          nullable: true
        doctype:
          type: string
          nullable: true
        version:
          type: string
        rulebookURI:
          type: string
          nullable: true
        attestationLoS:
          type: string
        bindingType:
          type: string
        supportedFormats:
          type: array
          items:
            type: string
        schemaURIs:
          type: array
          items:
            $ref: '#/components/schemas/SchemaUriRef'
        trustedAuthorities:
          type: array
          items:
            $ref: '#/components/schemas/TrustAuthority'
        documents:
          type: array
          items:
            $ref: '#/components/schemas/AttestationSchemaDocument'
        listing:
          $ref: '#/components/schemas/CatalogListingWindow'

    ImportRemoteRequest:
      type: object
      required: [baseUrl]
      properties:
        baseUrl:
          type: string
          format: uri

    ImportRulebooksRequest:
      type: object
      required: [files]
      properties:
        files:
          type: object
          additionalProperties:
            type: string
        defaultAttestationLoS:
          type: string
          nullable: true
        defaultBindingType:
          type: string
          nullable: true
        sourceUrl:
          type: string
          nullable: true

    CatalogImportReport:
      type: object
      additionalProperties: true
      description: Import summary returned by remote-catalog and rulebook-catalog imports.

    CatalogDocument:
      type: object
      required: [mediaType, bytes]
      properties:
        mediaType:
          type: string
        bytes:
          type: string
          format: byte
        integrity:
          type: string
          nullable: true
