openapi: 3.0.4
info:
  title: Digidentity Documentation
  description: "This page contains documentation for Digidentity's REST APIs.\n\n#### Environments and access\n\nEndpoints provided in this documentation are based on Digidentity's pre-production environment. Access to this environment can be arranged via our Sales department. For contact details, please visit [https://www.digidentity.eu/get-in-touch](https://www.digidentity.eu/get-in-touch)\n\nEndpoints in the production environment follow the same URL scheme as provided on this page, but under the `digidentity.eu` domain.\n\n#### IP-whitelisting\n\nShould your application require incoming traffic to be whitelisted, this can be achieved for both pre-production and production environments using the following IP addresses:\n\n- 34.251.16.238\n    \n- 52.31.177.93\n    \n- 52.51.147.59\n    \n\n**Please note**: IP addresses listed above are subject to change without express notice.\n\n#### Further resources\n\n- [Digidentity's well-known configuration](https://auth.digidentity.eu/.well-known/openid-configuration)\n    \n- [OAuth2 specification](https://datatracker.ietf.org/doc/html/rfc6749)\n    \n- [OpenID Connect specification](https://openid.net/specs/openid-connect-core-1_0.html)\n    \n- [Cloud Signature Consortium specification](https://cloudsignatureconsortium.org/resources/download-api-specifications/)"
  contact: { }
  version: '1.0'
servers:
  - url: https://auth.{hostname}/oauth2
    variables:
      hostname:
        default: digidentity-preproduction.eu
  - url: https://gate.{hostname}
    variables:
      hostname:
        default: digidentity-preproduction.eu
  - url: https://esign.{hostname}
    variables:
      hostname:
        default: digidentity-preproduction.eu
  - url: https://api.{hostname}
    variables:
      hostname:
        default: digidentity-preproduction.eu
paths:
  /authorize:
    get:
      tags:
        - Web login
      summary: Request authorisation
      description: >-
        After adjusting the required query params, this URL can be embedded in the client application as a hyperlink to redirect users to the Digidentity web page.
      operationId: Requestauthorisation
      parameters:
        - name: response_type
          in: query
          description: MUST be set to "code"
          required: true
          schema:
            type: string
            example: code
        - name: scope
          in: query
          description: MUST contain at least one of the 'product scopes' provided by Digidentity during onboarding. Multiple scopes MAY be specified
          required: true
          schema:
            type: string
            example: 1e78xm7pls3c9p1e
        - name: client_id
          in: query
          description: MUST contain the client_id provided by Digidentity during onboarding
          required: true
          schema:
            type: string
            example: example_client
        - name: redirect_uri
          in: query
          description: MUST contain the callback endpoint of the client application
          required: true
          schema:
            type: string
            example: https://client.example.com/cb
      responses:
        '200':
          description: Successful redirection.
  /token:
    post:
      tags:
        - Web login
        - Passwordless login
        - Refresh token
      summary: Retrieve access token
      description: >-
        This endpoint is used to exchange an authorization code or a refresh token for an access token.
      operationId: RetrieveAccessToken
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                grant_type:
                  type: string
                  description: MUST be 'authorization_code' or 'refresh_token'.
                redirect_uri:
                  type: string
                  description: MUST match the redirect_uri specified in the authorisation request (if grant_type is 'authorization_code').
                code:
                  type: string
                  description: MUST contain the code from the callback (if grant_type is 'authorization_code').
                refresh_token:
                  type: string
                  description: MUST contain the refresh_token (if grant_type is 'refresh_token').
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/WebLoginAccessToken'
                  - $ref: '#/components/schemas/WebLoginAccessTokenOIDC'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidGrantError'
  /authorize.json:
    get:
      tags:
        - Passwordless login
      summary: Retrieve QR code URI
      description: >-
        When a user requires access to the client application, this request can be sent via the client backend to retrieve a QR code URI.
      operationId: RetrieveQRcodeURI
      parameters:
        - name: client_id
          in: query
          description: MUST contain the client_id provided by Digidentity during onboarding
          required: true
          schema:
            type: string
        - name: scope
          in: query
          description: MUST contain at least one of the 'product scopes' provided by Digidentity during onboarding.
          required: true
          schema:
            type: string
        - name: response_type
          in: query
          description: MUST be set to "code"
          required: true
          schema:
            type: string
            example: code
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordlessQRCodeResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidClientOrScopeError'
  /token.json:
    post:
      tags:
        - Client credentials
      summary: Retrieve application token
      description: >-
        When accessing an API where user authorisation is not required, this request can be sent to directly retrieve an application token.
      operationId: RetrieveApplicationToken
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              required:
                - grant_type
              type: object
              properties:
                grant_type:
                  type: string
                  description: MUST be set to "client_credentials"
                  example: client_credentials
                scope:
                  type: string
                  description: MAY contain one or more of the 'product scopes' provided by Digidentity.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientCredentialsToken'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidClientError'
  /user_info.json:
    get:
      tags:
        - OIDC user info
      summary: Retrieve user info
      description: >-
        Once an access token has been retrieved for a user logging into the client application, this request can be used to retrieve their basic personal information.
      operationId: RetrieveUserInfo
      parameters:
        - name: Authorization
          in: header
          description: MUST contain an access token retrieved via the [authorization_code] grant.
          required: true
          schema:
            type: string
            example: Bearer {{access_token}}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/UserInfoFullResponse'
                  - $ref: '#/components/schemas/UserInfoCompanyResponse'
                  - $ref: '#/components/schemas/UserInfoMinimalResponse'
        '400':
          description: Bad Request (e.g., missing openid scope)
  /api/v1/reports.json:
    get:
      tags:
        - Identity verification report
      summary: Retrieve report
      description: >-
        Once an application token and a user's pseudonym have been retrieved, this request can be used to generate a detailed identity verification report for the user.
      operationId: RetrieveReport
      parameters:
        - name: pseudonym
          in: query
          description: MUST contain the user's account pseudonym (UUID retrieved from the 'sub' value when decoding the user's access token).
          required: true
          schema:
            type: string
        - name: Authorization
          in: header
          description: MUST contain an application token retrieved via the [client_credentials] grant.
          required: true
          schema:
            type: string
            example: Bearer {{application_token}}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  oneOf:
                    - $ref: '#/components/schemas/VerificationReport'
                    - $ref: '#/components/schemas/VerificationReportPending'
                    - $ref: '#/components/schemas/VerificationReportRejected'
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MissingPseudonymError'
  /api/esign/tokens:
    post:
      tags:
        - CSC API
        - eSeal autosigner
      summary: Retrieve CSC token
      description: >-
        Exchanges an existing access token for one compliant with the CSC specification.
      operationId: RetrieveCSCToken
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              required:
                - access_token
              type: object
              properties:
                access_token:
                  type: string
                  description: MUST contain an access token retrieved via the authorization_code grant.
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CSCTokenResponse'
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidUpstreamTokenError'
  /csc/v1/credentials/list:
    post:
      tags:
        - CSC API
      summary: Retrieve credential IDs
      description: >-
        This request is used to retrieve the IDs associated with each of the user's certificates.
      operationId: RetrieveCredentialIDs
      parameters:
        - name: Authorization
          in: header
          description: MUST contain a CSC token.
          required: true
          schema:
            type: string
            example: Bearer {{csc_token}}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialListResponse'
  /csc/v1/credentials/info:
    post:
      tags:
        - CSC API
      summary: Retrieve identity information
      description: >-
        Once `credentialIDs` have been retrieved, this request is used to retrieve certificate details.
      operationId: RetrieveIdentityInformation
      parameters:
        - name: Authorization
          in: header
          description: MUST contain a CSC token.
          required: true
          schema:
            type: string
            example: Bearer {{csc_token}}
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CredentialInfoRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/CredentialInfoResponse'
                  - $ref: '#/components/schemas/CredentialInfoChainResponse'
                  - $ref: '#/components/schemas/CredentialInfoNoCertsResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidCredentialIDError'
  /csc/v1/credentials/authorize:
    post:
      tags:
        - CSC API
      summary: Request sign authorisation
      description: >-
        This request is sent to prompt the user for authorisation of the signature.
      operationId: RequestSignAuthorisation
      parameters:
        - name: Authorization
          in: header
          description: MUST contain a CSC token.
          required: true
          schema:
            type: string
            example: Bearer {{csc_token}}
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignAuthorizeRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignAuthorizeResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MissingCredentialIDError'
  /csc/v1/signatures/signHash:
    post:
      tags:
        - CSC API
      summary: Sign hash
      description: >-
        Once the `SAD` (signature activation data) has been retrieved, this request is used to retrieve the remote digital signature.
      operationId: CscSignHash
      parameters:
        - name: Authorization
          in: header
          description: MUST contain a CSC token.
          required: true
          schema:
            type: string
            example: Bearer {{csc_token}}
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CSCSignHashRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CSCSignHashResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidSADError'
  /csc/v1/signatures/timestamp:
    post:
      tags:
        - CSC API
        - eSeal autosigner
      summary: Timestamp hash
      description: >-
        Generates a timestamp token for the input `hash` value.
      operationId: TimestampHash
      parameters:
        - name: Authorization
          in: header
          description: MUST contain a CSC token.
          required: true
          schema:
            type: string
            example: Bearer {{csc_token}}
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TimestampRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimestampResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidBase64HashError'
  /v1/auto_signers/{autosigner_id}/sign:
    post:
      tags:
        - eSeal autosigner
      summary: Sign hash
      description: >-
        Once an application token has been retrieved, this request can be used to sign a single hash.
      operationId: ESealSignHash
      parameters:
        - name: Authorization
          in: header
          description: MUST contain an application token retrieved via the [client_credentials] grant.
          required: true
          schema:
            type: string
            example: Bearer {{application_token}}
        - name: Api-Key
          in: header
          description: MUST contain the API key provided by Digidentity during onboarding.
          required: true
          schema:
            type: string
        - name: autosigner_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/ESealSignHashRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ESealSignHashResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ESealInvalidAuthError'
  /api/v1/anonymous_onboarding:
    post:
      tags:
        - One-time verification
      summary: Retrieve QR code
      description: >-
        Once an application access token has been retrieved, this request can be sent to retrieve a QR code URL to display to the user.
      operationId: OtvRetrieveQRCode
      parameters:
        - name: Authorization
          in: header
          description: MUST contain an application token retrieved via the [client_credentials] grant.
          required: true
          schema:
            type: string
            example: Bearer {{application_token}}
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtvQRCodeResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtvUnauthorizedError'
  /sermi/io:
    post:
      tags:
        - IO and RSS
      summary: 'IO: Create'
      description: >-
        Once an application access token has been retrieved, this request can be sent to create an Independent Operator.
      operationId: SermiIoCreate
      parameters:
        - name: Authorization
          in: header
          description: MUST contain an application token.
          required: true
          schema:
            type: string
        - name: Api-Key
          in: header
          description: MUST contain the API key provided by Digidentity.
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SermiIoCreateRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SermiIoResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SermiForbiddenError'
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SermiInvalidIoUidError'
  /sermi/io/delete:
    post:
      tags:
        - IO and RSS
      summary: 'IO: Delete'
      description: >-
        This request can be sent to delete an existing Independent Operator.
      operationId: SermiIoDelete
      parameters:
        - name: Authorization
          in: header
          description: MUST contain an application token.
          required: true
          schema:
            type: string
        - name: Api-Key
          in: header
          description: MUST contain the API key provided by Digidentity.
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SermiIoDeleteRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SermiIoDeleteResponse'
        '422':
          description: Unprocessable Content
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/SermiIoNotFoundError'
                  - $ref: '#/components/schemas/SermiCabMismatchError'
  /sermi/rss:
    post:
      tags:
        - IO and RSS
      summary: 'RSS: Create'
      description: >-
        Once an application access token has been retrieved, this request can be sent to create a Remote Service Supplier.
      operationId: SermiRssCreate
      parameters:
        - name: Authorization
          in: header
          description: MUST contain an application token.
          required: true
          schema:
            type: string
        - name: Api-Key
          in: header
          description: MUST contain the API key provided by Digidentity.
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SermiRssCreateRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SermiRssResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SermiForbiddenError'
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SermiInvalidRssUidError'
  /sermi/rss/delete:
    post:
      tags:
        - IO and RSS
      summary: 'RSS: Delete'
      description: >-
        This request can be sent to delete an existing Remote Service Supplier.
      operationId: SermiRssDelete
      parameters:
        - name: Authorization
          in: header
          description: MUST contain an application token.
          required: true
          schema:
            type: string
        - name: Api-Key
          in: header
          description: MUST contain the API key provided by Digidentity.
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SermiRssDeleteRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SermiRssDeleteResponse'
        '422':
          description: Unprocessable Content
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/SermiRssNotFoundError'
                  - $ref: '#/components/schemas/SermiCabMismatchError'
  /sermi/io_pa:
    post:
      tags:
        - IO and RSS
      summary: 'IO Public Authority: Create'
      description: >-
        Once an application access token has been retrieved, this request can be sent to create an IO Public Authority.
      operationId: SermiIoPaCreate
      parameters:
        - name: Api-Key
          in: header
          required: true
          schema:
            type: string
        - name: Authorization
          in: header
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SermiIoPaCreateRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SermiIoPaResponse'
        '422':
          description: Unprocessable Content
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SermiIoPaVatError'
  /sermi/ioe:
    post:
      tags:
        - IOE
      summary: 'IOE: Create'
      description: >-
        Once an application access token has been retrieved, this request can be sent to create an employee under an existing Independent Operator.
      operationId: SermiIoeCreate
      parameters:
        - name: Authorization
          in: header
          required: true
          schema:
            type: string
        - name: Api-Key
          in: header
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SermiIoeCreateRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SermiIoeCreateResponse'
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SermiIoNotFoundForIoeError'
  /sermi/ioe/authorization:
    post:
      tags:
        - IOE
      summary: 'IOE: Authorize/Revoke'
      description: >-
        This request can be sent to authorise or revoke an existing Independent Operator Employee.
      operationId: SermiIoeAuthorizeRevoke
      parameters:
        - name: Authorization
          in: header
          required: true
          schema:
            type: string
        - name: Api-Key
          in: header
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SermiIoeAuthRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/SermiIoeAuthResponse'
                  - $ref: '#/components/schemas/SermiIoeRevokeResponse'
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SermiIoeNotFoundError'
  /sermi/ioe/reset_certificate:
    post:
      tags:
        - IOE
      summary: 'IOE: Reset certificate'
      description: >-
        This request can be sent to reset the certificate of an existing Independent Operator Employee.
      operationId: SermiIoeResetCertificate
      parameters:
        - name: Authorization
          in: header
          required: true
          schema:
            type: string
        - name: Api-Key
          in: header
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SermiIoeResetCertRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SermiIoeResetCertResponse'
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SermiEmployeeCompanyMismatchError'
  /sermi/ioe/renew:
    post:
      tags:
        - IOE
      summary: 'IOE: Renew certificate'
      description: >-
        This request can be sent to renew the certificate of an existing Independent Operator Employee.
      operationId: SermiIoeRenewCertificate
      parameters:
        - name: Authorization
          in: header
          required: true
          schema:
            type: string
        - name: Api-Key
          in: header
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SermiIoeRenewCertRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SermiIoeRenewCertResponse'
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SermiNotReadyForRenewalError'
  /sermi/ioe/logins:
    get:
      tags:
        - IOE
      summary: 'IOE: Logins'
      description: >-
        This request can be used to retrieve IOE login activity.
      operationId: SermiIoeLogins
      parameters:
        - name: Authorization
          in: header
          required: true
          schema:
            type: string
        - name: Api-Key
          in: header
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/SermiIoeLoginsResponse'
                  - $ref: '#/components/schemas/SermiIoLoginsResponse'
  /sermi/rsse:
    post:
      tags:
        - RSSE
      summary: 'RSSE: Create'
      description: >-
        This request can be sent to create an employee under an existing Remote Service Supplier.
      operationId: SermiRsseCreate
      parameters:
        - name: Authorization
          in: header
          required: true
          schema:
            type: string
        - name: Api-Key
          in: header
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SermiRsseCreateRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SermiRsseCreateResponse'
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SermiRssNotFoundError'
  /sermi/rsse/authorization:
    post:
      tags:
        - RSSE
      summary: 'RSSE: Authorize/Revoke'
      description: >-
        This request can be sent to authorise or revoke an existing Remote Service Supplier Employee.
      operationId: SermiRsseAuthorizeRevoke
      parameters:
        - name: Authorization
          in: header
          required: true
          schema:
            type: string
        - name: Api-Key
          in: header
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SermiRsseAuthRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/SermiRsseAuthResponse'
                  - $ref: '#/components/schemas/SermiRsseRevokeResponse'
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SermiRsseNotFoundError'
  /sermi/rsse/reset_certificate:
    post:
      tags:
        - RSSE
      summary: 'RSSE: Reset certificate'
      description: >-
        This request can be sent to reset the certificate of an existing Remote Service Supplier Employee.
      operationId: SermiRsseResetCertificate
      parameters:
        - name: Authorization
          in: header
          required: true
          schema:
            type: string
        - name: Api-Key
          in: header
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SermiRsseResetCertRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SermiRsseResetCertResponse'
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SermiCabMismatchError'
  /sermi/rsse/renew:
    post:
      tags:
        - RSSE
      summary: 'RSSE: Renew certificate'
      description: >-
        This request can be sent to renew the certificate of an existing Remote Service Supplier Employee.
      operationId: SermiRsseRenewCertificate
      parameters:
        - name: Authorization
          in: header
          required: true
          schema:
            type: string
        - name: Api-Key
          in: header
          required: true
          schema:
            type: string
      requestBody:
        content:
