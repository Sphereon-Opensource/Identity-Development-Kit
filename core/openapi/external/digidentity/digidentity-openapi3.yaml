  /sermi/rsse/logins:
    get:
      tags:
        - RSSE
      summary: 'RSSE: Logins'
      description: >-
        This request can be used to retrieve RSSE login activity.
      operationId: SermiRsseLogins
      parameters:
        - name: Authorization
          in: header
          required: true
          schema:
            type: string
        - name: Api-Key
          in: header
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/SermiRsseLoginsResponse'
                  - $ref: '#/components/schemas/SermiRssLoginsResponse'
  /api/v2/scim/Users:
    post:
      tags:
        - Users
      summary: Create user
      description: >-
        This request creates a user under the associated company and sends an email invitation for the user to create a Digidentity account.
      operationId: ScimCreateUser
      parameters:
        - name: Authorization
          in: header
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScimCreateUserRequest'
      responses:
        '201':
          description: Created
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/ScimUserResponse'
        '409':
          description: Conflict
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/ScimUserExistsError'
        '422':
          description: Unprocessable Content
    get:
      tags:
        - Users
      summary: Get users
      description: This request retrieves a paginated list of all users registered to the configured company.
      operationId: ScimGetUsers
      parameters:
        - name: Authorization
          in: header
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/ScimUserListResponse'
        '422':
          description: Unprocessable Content
  /api/v2/scim/Users/{pseudonym}:
    get:
      tags:
        - Users
      summary: Get user by ID
      description: This request retrieves the details of a specific user ID.
      operationId: ScimGetUserByID
      parameters:
        - name: Authorization
          in: header
          required: true
          schema:
            type: string
        - name: pseudonym
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/ScimUserResource'
        '404':
          description: Not Found
    patch:
      tags:
        - Users
        - User roles
      summary: Disable/Re-enable user or Modify Roles
      description: >-
        This request is used to disable a user, immediately revoking their authorisations and scheduling their account for deletion. It can also be used to add, replace, or remove user roles.
      operationId: ScimPatchUser
      parameters:
        - name: Authorization
          in: header
          required: true
          schema:
            type: string
        - name: pseudonym
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/ScimPatchRequest'
                - $ref: '#/components/schemas/ScimUserRolesPatchRequest'
                - $ref: '#/components/schemas/ScimRemoveUserRoleRequest'
      responses:
        '204':
          description: No Content
        '422':
          description: Unprocessable Content
  /api/v2/scim/Schemas:
    get:
      tags:
        - Discovery
      summary: Schemas
      description: This request is used to retrieve information on the SCIM resource schemas supported by Digidentity.
      operationId: ScimGetSchemas
      parameters:
        - name: Authorization
          in: header
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/ScimSchemasResponse'
  /api/v2/scim/ServiceProviderConfig:
    get:
      tags:
        - Discovery
      summary: Service provider config
      description: This request is used to describe the SCIM specification features supported by Digidentity.
      operationId: ScimGetServiceProviderConfig
      parameters:
        - name: Authorization
          in: header
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/ScimServiceProviderConfigResponse'
components:
  schemas:
    WebLoginAccessToken:
      title: WebLoginAccessToken
      type: object
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        token_type:
          type: string
        expires_in:
          type: integer
        scope:
          type: string
    WebLoginAccessTokenOIDC:
      title: WebLoginAccessTokenOIDC
      type: object
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        token_type:
          type: string
        expires_in:
          type: integer
        scope:
          type: string
        id_token:
          type: string
    InvalidGrantError:
      title: InvalidGrantError
      type: object
      properties:
        error:
          type: string
          example: invalid_grant
        error_description:
          type: string
    PasswordlessQRCodeResponse:
      title: PasswordlessQRCodeResponse
      type: object
      properties:
        data:
          type: object
          properties:
            id:
              type: string
            type:
              type: string
            attributes:
              type: object
              properties:
                type:
                  type: string
                qr_code_uri:
                  type: string
    InvalidClientOrScopeError:
      title: InvalidClientOrScopeError
      type: object
      properties:
        error:
          type: string
