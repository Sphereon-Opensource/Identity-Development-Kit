      properties:
        expectedVersion: { type: integer, format: int64, minimum: 0 }
        reason: { type: [string, 'null'] }
    CreateInboxEvidenceExportRequest:
      type: object
      additionalProperties: false
      description: Client-supplied export intent; identity and actor facts are server-derived.
      required: [query, purpose]
      properties:
        query: { $ref: '#/components/schemas/InboxQueryDefinition' }
        purpose: { type: string, minLength: 1 }
    InboxEvidenceExportStatus:
      type: string
      enum: [PENDING, RUNNING, COMPLETED, FAILED]
    InboxEvidenceExportManifest:
      type: [object, 'null']
      additionalProperties: false
      description: Completeness and integrity metadata for a snapshot-bound evidence archive.
      required: [snapshot, counts, complete, generatedAt, archive, digest]
      properties:
        snapshot: { type: string, minLength: 1 }
        counts:
          type: object
          minProperties: 1
          propertyNames: { minLength: 1 }
          additionalProperties: { type: integer, format: int64, minimum: 0 }
        complete: { type: boolean }
        generatedAt: { type: string, format: date-time }
        archive: { $ref: '#/components/schemas/ArtifactRef' }
        digest: { type: string, minLength: 1 }
      x-vdx-digest-constraint: digest == archive.digest
      x-vdx-archive-entry-schema: InboxEvidenceCorrelation
    InboxEvidenceExportJob:
      type: object
      additionalProperties: false
      description: >-
        Server-derived asynchronous evidence job. Correlations are contained in
        the controlled archive and are never an unbounded synchronous response.
      required: [id, tenantId, query, purpose, requestedBy, requestedAt, status, manifest, failureReason]
      properties:
        id: { type: string, minLength: 1 }
        tenantId: { type: string, minLength: 1 }
        query: { $ref: '#/components/schemas/InboxQueryDefinition' }
        purpose: { type: string, minLength: 1 }
        requestedBy: { type: string, minLength: 1 }
        requestedAt: { type: string, format: date-time }
        status: { $ref: '#/components/schemas/InboxEvidenceExportStatus' }
        manifest: { $ref: '#/components/schemas/InboxEvidenceExportManifest' }
        failureReason: { type: [string, 'null'], minLength: 1 }
      allOf:
        - if:
            properties:
              status: { enum: [PENDING, RUNNING] }
          then:
            properties:
              manifest: { type: 'null' }
              failureReason: { type: 'null' }
        - if:
            properties:
              status: { const: COMPLETED }
          then:
            properties:
              manifest:
                allOf:
                  - $ref: '#/components/schemas/InboxEvidenceExportManifest'
                  - type: object
              failureReason: { type: 'null' }
        - if:
            properties:
              status: { const: FAILED }
          then:
            properties:
              manifest: { type: 'null' }
              failureReason: { type: string, minLength: 1 }
