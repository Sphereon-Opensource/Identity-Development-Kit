openapi: 3.0.4
info:
  title: VDX Cross-product Inbox API
  version: 0.1.0
  description: >-
    Canonical cross-product Inbox contract. Inbox owns act, routing,
    assignment, placement, and history; source products own authoritative
    objects and domain actions. Publication of this contract does not assert
    that a runtime REST adapter is mounted.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: /api/inbox/v1
security:
  - bearerAuth: []
x-vdx-frozen-contract:
  tables:
    - inbox
    - inbox_folder
    - inbox_folder_binding
    - inbox_item
    - inbox_item_placement
    - inbox_user_state
    - inbox_work_assignment
    - inbox_assignment_history
    - inbox_action_receipt
    - inbox_saved_view
    - inbox_rule
    - inbox_work_queue
    - inbox_throughput_fact
    - inbox_legal_hold
    - inbox_legal_hold_history
    - inbox_item_tag
    - inbox_bulk_operation
    - projection checkpoints
    - dead letters
    - append-only delivery-evidence references
  ingestionIdentity: [tenant, source, sourceObjectId, sourceVersion, eventId]
  policyActions:
    - inbox.read
    - inbox.claim
    - inbox.act
    - inbox.manage
    - inbox.configure-binding
    - inbox.view-audit
    - inbox.take-over
    - inbox.extend-lease
    - inbox.escalate
    - inbox.bulk-reassign
    - inbox.bulk-tag
    - inbox.legal-hold
    - inbox.export
  connectorOperations:
    - E2E_CUSTOM_OID4VP_RECEIVE_PRESENTATION
    - E2E_CUSTOM_OID4VP_SEND_PRESENTATION
  queryFieldKeys: [nature, kind, folder, holder, checkout, age, due, source, tag, lifecycle, unread]
  actionOutcomes: [COMMITTED, FAILED, INDETERMINATE]
  performance:
    itemsPerTenant: 1000000
    concurrentReaders: 100
    firstPageSize: 50
    firstPageAndSummaryP95Milliseconds: 750
    acceptedReceiptMilliseconds: 1000
    committedLiveUpdateMilliseconds: 2000
tags:
  - name: Configuration
    description: Inbox, physical folder, binding, saved-view, and routing-rule configuration.
  - name: Summary
    description: Authorization-filtered counts and facets.
  - name: Items
    description: Item queries, details, history, user state, and safe artifact retrieval.
  - name: Actions
    description: Source-owned domain action intents and durable receipts.
  - name: Work
    description: Inbox-owned claim, release, reassignment, and cover transitions.
  - name: Live
    description: Authorization-filtered resumable live updates.
paths:
  /inboxes:
    get:
      tags: [Configuration]
      summary: List authorized inboxes
      operationId: listInboxes
      x-vdx-command-id: inbox.inboxes.list
      responses:
        '200':
          description: Authorized inboxes
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Inbox' }
    post:
      tags: [Configuration]
      summary: Create an inbox
      operationId: createInbox
      x-vdx-command-id: inbox.inboxes.create
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateInboxRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Inbox' }
  /inboxes/{inboxId}:
    parameters:
      - $ref: '#/components/parameters/InboxId'
    get:
      tags: [Configuration]
      summary: Get an inbox
      operationId: getInbox
      x-vdx-command-id: inbox.inboxes.get
      responses:
        '200':
          description: Inbox
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Inbox' }
    patch:
      tags: [Configuration]
      summary: Update an inbox
      operationId: updateInbox
      x-vdx-command-id: inbox.inboxes.update
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateInboxRequest' }
      responses:
        '200':
          description: Updated Inbox
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Inbox' }
  /inboxes/{inboxId}/folders:
    parameters:
      - $ref: '#/components/parameters/InboxId'
    get:
      tags: [Configuration]
      summary: List physical folders
      operationId: listInboxFolders
      x-vdx-command-id: inbox.folders.list
      responses:
        '200':
          description: Physical folder hierarchy
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/InboxFolder' }
    post:
      tags: [Configuration]
      summary: Create a physical folder
      operationId: createInboxFolder
      x-vdx-command-id: inbox.folders.create
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateInboxFolderRequest' }
      responses:
        '201':
          description: Created physical folder
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InboxFolder' }
  /inboxes/{inboxId}/folders/{folderId}:
    parameters:
      - $ref: '#/components/parameters/InboxId'
      - $ref: '#/components/parameters/FolderId'
    get:
      tags: [Configuration]
      summary: Get a physical folder
      operationId: getInboxFolder
      x-vdx-command-id: inbox.folders.get
      responses:
        '200':
          description: Physical folder
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InboxFolder' }
    patch:
      tags: [Configuration]
      summary: Update a physical folder
      operationId: updateInboxFolder
      x-vdx-command-id: inbox.folders.update
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateInboxFolderRequest' }
      responses:
        '200':
          description: Updated physical folder
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InboxFolder' }
  /inboxes/{inboxId}/queues:
    parameters:
      - $ref: '#/components/parameters/InboxId'
    get:
      tags: [Configuration]
      summary: List work queues for an inbox
      operationId: listInboxWorkQueues
      x-vdx-command-id: inbox.queues.list
      responses:
        '200':
          description: Authorized work queues, including root queues without folders
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/InboxWorkQueue' }
    post:
      tags: [Configuration]
      summary: Create a versioned work queue
      operationId: createInboxWorkQueue
      x-vdx-command-id: inbox.queues.create
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateInboxWorkQueueRequest' }
      responses:
        '201':
          description: Created queue
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InboxWorkQueue' }
  /inboxes/{inboxId}/queues/{queueId}:
    parameters:
      - $ref: '#/components/parameters/InboxId'
      - $ref: '#/components/parameters/QueueId'
    get:
      tags: [Configuration]
      summary: Get a work queue
      operationId: getInboxWorkQueue
      x-vdx-command-id: inbox.queues.get
      responses:
        '200':
          description: Work queue
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InboxWorkQueue' }
    patch:
      tags: [Configuration]
      summary: Update a work queue with optimistic concurrency
      operationId: updateInboxWorkQueue
      x-vdx-command-id: inbox.queues.update
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateInboxWorkQueueRequest' }
      responses:
        '200':
          description: Updated queue
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InboxWorkQueue' }
  /inboxes/{inboxId}/folders/{folderId}/bindings:
    parameters:
      - $ref: '#/components/parameters/InboxId'
      - $ref: '#/components/parameters/FolderId'
    get:
      tags: [Configuration]
      summary: List folder bindings
      operationId: listFolderBindings
      x-vdx-command-id: inbox.bindings.list
      responses:
        '200':
          description: Version-reference-only folder bindings
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/FolderBinding' }
    post:
      tags: [Configuration]
      summary: Create a folder binding with a server-generated ID
      operationId: createFolderBinding
      x-vdx-command-id: inbox.bindings.create
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateFolderBindingRequest' }
      responses:
        '201':
          description: Created binding with its server-generated ID
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FolderBinding' }
  /inboxes/{inboxId}/folders/{folderId}/bindings/{bindingId}:
    parameters:
      - $ref: '#/components/parameters/InboxId'
      - $ref: '#/components/parameters/FolderId'
      - $ref: '#/components/parameters/BindingId'
    patch:
      tags: [Configuration]
      summary: Update a folder binding
      operationId: updateFolderBinding
      x-vdx-command-id: inbox.bindings.update
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateFolderBindingRequest' }
      responses:
        '200':
          description: Updated binding
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FolderBinding' }
  /inboxes/{inboxId}/saved-views:
    parameters:
      - $ref: '#/components/parameters/InboxId'
    get:
      tags: [Configuration]
      summary: List saved inbox views
      operationId: listSavedInboxViews
      x-vdx-command-id: inbox.saved-views.list
      responses:
        '200':
          description: Authorized saved views
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/SavedInboxView' }
    post:
      tags: [Configuration]
      summary: Create a saved inbox view
      operationId: createSavedInboxView
      x-vdx-command-id: inbox.saved-views.create
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateSavedInboxViewRequest' }
      responses:
        '201':
          description: Created saved view
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SavedInboxView' }
  /inboxes/{inboxId}/saved-views/{savedViewId}:
    parameters:
      - $ref: '#/components/parameters/InboxId'
      - $ref: '#/components/parameters/SavedViewId'
    get:
      tags: [Configuration]
      summary: Get a saved inbox view
      operationId: getSavedInboxView
      x-vdx-command-id: inbox.saved-views.get
      responses:
        '200':
          description: Saved view
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SavedInboxView' }
    patch:
      tags: [Configuration]
      summary: Update a saved inbox view
      operationId: updateSavedInboxView
      x-vdx-command-id: inbox.saved-views.update
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateSavedInboxViewRequest' }
      responses:
        '200':
          description: Updated saved view
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SavedInboxView' }
    delete:
      tags: [Configuration]
      summary: Delete a saved inbox view
      operationId: deleteSavedInboxView
      x-vdx-command-id: inbox.saved-views.delete
      parameters:
        - $ref: '#/components/parameters/ExpectedVersionHeader'
      responses:
        '204': { description: Deleted }
  /inboxes/{inboxId}/rules:
    parameters:
      - $ref: '#/components/parameters/InboxId'
    get:
      tags: [Configuration]
      summary: List inbox routing rules
      operationId: listInboxRules
      x-vdx-command-id: inbox.rules.list
      responses:
        '200':
          description: Authorized routing rules
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/InboxRule' }
    post:
      tags: [Configuration]
      summary: Create an inbox routing rule
      operationId: createInboxRule
      x-vdx-command-id: inbox.rules.create
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateInboxRuleRequest' }
      responses:
        '201':
          description: Created routing rule
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InboxRule' }
  /inboxes/{inboxId}/rules/{ruleId}:
    parameters:
      - $ref: '#/components/parameters/InboxId'
      - $ref: '#/components/parameters/RuleId'
    get:
      tags: [Configuration]
      summary: Get an inbox routing rule
      operationId: getInboxRule
      x-vdx-command-id: inbox.rules.get
      responses:
        '200':
          description: Routing rule
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InboxRule' }
    patch:
      tags: [Configuration]
      summary: Update an inbox routing rule
      operationId: updateInboxRule
      x-vdx-command-id: inbox.rules.update
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateInboxRuleRequest' }
      responses:
        '200':
          description: Updated routing rule
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InboxRule' }
    delete:
      tags: [Configuration]
      summary: Delete an inbox routing rule
      operationId: deleteInboxRule
      x-vdx-command-id: inbox.rules.delete
      parameters:
        - $ref: '#/components/parameters/ExpectedVersionHeader'
      responses:
        '204': { description: Deleted }
  /summary:
    get:
      tags: [Summary]
      summary: Get an authorization-filtered unified inbox summary
      description: >-
        Counts every inbox the current actor may access when no inboxId values
        are supplied. Repeated inboxId values only narrow that authorized set.
      operationId: getInboxSummary
      x-vdx-command-id: inbox.summary.get
      parameters:
        - $ref: '#/components/parameters/InboxIdsQuery'
        - $ref: '#/components/parameters/Snapshot'
      responses:
        '200':
          description: Authorization-filtered counts and facets
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InboxSummary' }
        '403': { $ref: '#/components/responses/PolicyDenied' }
  /items:
    get:
      tags: [Items]
      summary: Query authorized inbox items
      description: >-
        Executes the versioned structured query across every inbox the current
        actor may access when no inboxId values are supplied. Repeated inboxId
        values only narrow that authorized set. Shared links carry this same
        `query` parameter as percent-encoded canonical JSON; clients must not
        translate it into a different filter language.
      operationId: queryInboxItems
      x-vdx-command-id: inbox.items.query
      parameters:
        - $ref: '#/components/parameters/InboxIdsQuery'
        - name: query
          in: query
          description: >-
            The single executable item filter and shared-link carrier,
            serialized as percent-encoded canonical InboxQueryDefinition JSON.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InboxQueryDefinition' }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Snapshot'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Stable authorization-filtered page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InboxItemPage' }
        '403': { $ref: '#/components/responses/PolicyDenied' }
  /items/{itemId}:
    parameters:
      - $ref: '#/components/parameters/ItemId'
    get:
      tags: [Items]
      summary: Get an inbox item
      operationId: getInboxItem
      x-vdx-command-id: inbox.items.get
      responses:
        '200':
          description: Item detail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InboxItem' }
        '403': { $ref: '#/components/responses/PolicyDenied' }
  /items/{itemId}/history:
    parameters:
      - $ref: '#/components/parameters/ItemId'
    get:
      tags: [Items]
      summary: Get item history
      operationId: getInboxItemHistory
      x-vdx-command-id: inbox.items.history
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Snapshot'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Authorization-filtered stable history page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InboxHistoryPage' }
  /items/{itemId}/legal-holds:
    parameters:
      - $ref: '#/components/parameters/ItemId'
    get:
      tags: [Items]
      summary: List auditable legal holds for an item
      operationId: listInboxItemLegalHolds
      x-vdx-command-id: inbox.legal-holds.list
      responses:
        '200':
          description: Authorized legal holds
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/InboxLegalHold' }
    post:
      tags: [Items]
      summary: Apply a legal hold that wins over a pending retention sweep
      operationId: applyInboxItemLegalHold
      x-vdx-command-id: inbox.legal-holds.apply
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApplyInboxLegalHoldRequest' }
      responses:
        '201':
          description: Applied legal hold
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InboxLegalHold' }
  /items/{itemId}/legal-holds/{legalHoldId}/release:
    parameters:
      - $ref: '#/components/parameters/ItemId'
      - $ref: '#/components/parameters/LegalHoldId'
    post:
      tags: [Items]
      summary: Release a legal hold with optimistic concurrency
      operationId: releaseInboxItemLegalHold
      x-vdx-command-id: inbox.legal-holds.release
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReleaseInboxLegalHoldRequest' }
      responses:
        '200':
          description: Released legal hold
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InboxLegalHold' }
  /items/{itemId}/artifacts/{artifactId}:
    parameters:
      - $ref: '#/components/parameters/ItemId'
      - $ref: '#/components/parameters/ArtifactId'
    get:
      tags: [Items]
      summary: Retrieve an authorized safe artifact
      description: >-
        Re-evaluates tenant and inbox.read policy and serves only SAFE content
        from the managed artifact store. It never proxies a client-supplied URL.
      operationId: retrieveInboxArtifact
      x-vdx-command-id: inbox.artifacts.retrieve
      responses:
        '200':
          description: Authorized artifact bytes
          headers:
            Digest:
              schema: { type: string }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '403': { $ref: '#/components/responses/PolicyDenied' }
        '423': { $ref: '#/components/responses/ContentQuarantined' }
        '503': { $ref: '#/components/responses/SourceUnavailable' }
  /items/{itemId}/user-state:
    parameters:
      - $ref: '#/components/parameters/ItemId'
    get:
      tags: [Items]
      summary: Get the current user's item state
      operationId: getInboxItemUserState
      x-vdx-command-id: inbox.user-state.get
      responses:
        '200':
          description: Current actor's item state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InboxItemState' }
    put:
      tags: [Items]
      summary: Update the current user's item state
      operationId: updateInboxItemUserState
      x-vdx-command-id: inbox.user-state.update
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InboxItemStatePatch' }
      responses:
        '200':
          description: Updated user state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InboxItemState' }
  /items/{itemId}/actions/{actionKey}:
    parameters:
      - $ref: '#/components/parameters/ItemId'
      - $ref: '#/components/parameters/ActionKey'
    post:
      tags: [Actions]
      summary: Submit an item action intent
      operationId: performInboxAction
      x-vdx-command-id: inbox.actions.perform
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InboxActionRequest' }
      responses:
        '202':
          description: Durable action receipt; may already be committed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InboxActionReceipt' }
        '403': { $ref: '#/components/responses/PolicyDenied' }
        '409': { $ref: '#/components/responses/ActionConflict' }
        '422': { $ref: '#/components/responses/FormInvalid' }
        '423': { $ref: '#/components/responses/ContentQuarantined' }
        '503': { $ref: '#/components/responses/SourceUnavailable' }
  /items/{itemId}/action-receipts/{receiptId}:
    parameters:
      - $ref: '#/components/parameters/ItemId'
      - $ref: '#/components/parameters/ReceiptId'
    get:
      tags: [Actions]
      summary: Read the latest durable revision of an action receipt
      operationId: getInboxActionReceipt
      x-vdx-command-id: inbox.receipts.get
      responses:
        '200':
          description: Latest authorized receipt revision
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InboxActionReceipt' }
        '403': { $ref: '#/components/responses/PolicyDenied' }
  /work-items:
    get:
      tags: [Work]
      summary: Query authorized WORK items across the unified Inbox
      description: >-
        Returns WORK items from every inbox the current actor may access when no
        inboxId values are supplied. Repeated inboxId values only narrow that
        authorized set. This is a façade over the canonical Inbox item query.
      x-vdx-fixed-filter: { nature: WORK }
      operationId: queryWorkItems
      x-vdx-command-id: inbox.work-items.query
      parameters:
        - $ref: '#/components/parameters/InboxIdsQuery'
        - name: query
          in: query
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InboxQueryDefinition' }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Snapshot'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Stable authorization-filtered WORK page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InboxItemPage' }
        '403': { $ref: '#/components/responses/PolicyDenied' }
        '503': { $ref: '#/components/responses/SourceUnavailable' }
  /work-items/{itemId}/approve:
    post:
      tags: [Work]
      summary: Submit the fixed approve action through the shared receipt engine
      operationId: approveWorkItem
      x-vdx-command-id: inbox.work-items.approve
      parameters:
        - $ref: '#/components/parameters/ItemId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InboxActionRequest' }
      responses:
        '202': { $ref: '#/components/responses/InboxActionReceiptAccepted' }
        '403': { $ref: '#/components/responses/PolicyDenied' }
        '409': { $ref: '#/components/responses/ActionConflict' }
        '422': { $ref: '#/components/responses/FormInvalid' }
        '423': { $ref: '#/components/responses/ContentQuarantined' }
        '503': { $ref: '#/components/responses/SourceUnavailable' }
  /work-items/{itemId}/reject:
    post:
      tags: [Work]
      summary: Submit the fixed reject action through the shared receipt engine
      operationId: rejectWorkItem
      x-vdx-command-id: inbox.work-items.reject
      parameters:
        - $ref: '#/components/parameters/ItemId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InboxActionRequest' }
      responses:
        '202': { $ref: '#/components/responses/InboxActionReceiptAccepted' }
        '403': { $ref: '#/components/responses/PolicyDenied' }
        '409': { $ref: '#/components/responses/ActionConflict' }
        '422': { $ref: '#/components/responses/FormInvalid' }
        '423': { $ref: '#/components/responses/ContentQuarantined' }
        '503': { $ref: '#/components/responses/SourceUnavailable' }
  /work-items/{itemId}/complete:
    post:
      tags: [Work]
      summary: Submit the fixed complete action through the shared receipt engine
      operationId: completeWorkItem
      x-vdx-command-id: inbox.work-items.complete
      parameters:
        - $ref: '#/components/parameters/ItemId'
