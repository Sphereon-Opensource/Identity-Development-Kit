        name: { type: string, minLength: 1, maxLength: 200 }
        query: { $ref: '#/components/schemas/InboxQueryDefinition' }
        targetFolderId: { type: string }
        enabled: { type: boolean, default: true }
    UpdateInboxRuleRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion]
      minProperties: 2
      properties:
        expectedVersion: { type: integer, format: int64, minimum: 0 }
        name: { type: string, minLength: 1, maxLength: 200 }
        query: { $ref: '#/components/schemas/InboxQueryDefinition' }
        targetFolderId: { type: string }
        enabled: { type: boolean }
    ArtifactRef:
      type: object
      required: [id, mediaType, size, digest, disposition]
      properties:
        id: { type: string }
        mediaType: { type: string }
        size: { type: integer, format: int64, minimum: 0 }
        digest: { type: string }
        disposition: { type: string, enum: [SAFE, QUARANTINED, REJECTED] }
        fileName: { type: [string, 'null'] }
    DeliveryEvidenceRef:
      type: object
      required: [id, digest, status, recordedAt, attemptNumber]
      properties:
        id: { type: string }
        digest: { type: string }
        status: { type: string }
        recordedAt: { type: string, format: date-time }
        attemptNumber: { type: integer, minimum: 1 }
        connectorReceiptId: { type: [string, 'null'] }
    RendererDescriptor:
      type: object
      required: [rendererKey, rendererVersion, layout]
      properties:
        rendererKey: { type: string }
        rendererVersion: { type: string }
        layout: { $ref: '#/components/schemas/RendererLayout' }
        presentationContractVersion: { type: [string, 'null'] }
    InboxAvailableAction:
      type: object
      additionalProperties: false
      required: [key, label, available]
      properties:
        key: { type: string }
        label: { type: string }
        available: { type: boolean }
        unavailableReason: { type: [string, 'null'], minLength: 1 }
        destructive: { type: boolean, default: false }
        formContract:
          type: [object, 'null']
          additionalProperties: true
          x-field-extra-annotation: '@Contextual'
        primary: { type: [boolean, 'null'] }
        keyboardHint: { type: [string, 'null'], minLength: 1 }
      if:
        properties:
          available: { const: true }
      then:
        properties:
          unavailableReason: { type: 'null' }
      else:
        required: [unavailableReason]
        properties:
          unavailableReason: { type: string, minLength: 1 }
    InboxTagScope:
      type: string
      enum: [PERSONAL, TENANT, RULE]
    InboxTagRef:
      type: object
      additionalProperties: false
      description: Tags never affect authorization; personal tags are per-user and tenant/rule tags never copy ACLs.
      required: [id, label, scope, colorKey, vocabularyVersion, appliedByRuleId]
      properties:
        id: { type: string, minLength: 1 }
        label: { type: string, minLength: 1 }
        scope: { $ref: '#/components/schemas/InboxTagScope' }
        colorKey: { type: [string, 'null'], minLength: 1 }
        vocabularyVersion: { type: [integer, 'null'], format: int64, minimum: 0 }
        appliedByRuleId: { type: [string, 'null'], minLength: 1 }
      if:
        properties:
          scope: { const: RULE }
      then:
        properties:
          appliedByRuleId: { type: string, minLength: 1 }
      else:
        properties:
          appliedByRuleId: { type: 'null' }
    InboxActionRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion]
      properties:
        expectedVersion: { type: integer, format: int64, minimum: 0 }
        sourcePayload: { $ref: '#/components/schemas/InboxTypedActionPayload' }
        formSessionSubmissionRef: { $ref: '#/components/schemas/FormSessionSubmissionRef' }
      if:
        required: [sourcePayload]
        properties:
          sourcePayload: { $ref: '#/components/schemas/InboxTypedActionPayload' }
      then:
        not:
          required: [formSessionSubmissionRef]
          properties:
            formSessionSubmissionRef: { $ref: '#/components/schemas/FormSessionSubmissionRef' }
      else:
        required: [formSessionSubmissionRef]
        properties:
          formSessionSubmissionRef: { $ref: '#/components/schemas/FormSessionSubmissionRef' }
    InboxTypedActionPayload:
      type: object
      additionalProperties: false
      description: >-
        Extensible typed and versioned payload dispatched to the authoritative
        source adapter. The payload contains no caller-provided tenant or actor.
      required: [typeKey, schemaVersion, payload]
      properties:
        typeKey: { type: string, minLength: 1, maxLength: 200 }
        schemaVersion: { type: string, minLength: 1, maxLength: 100 }
        payload:
          type: object
          additionalProperties: true
          x-field-extra-annotation: '@Contextual'
    FormSessionSubmissionRef:
      type: object
      additionalProperties: false
      description: Opaque reference to a server-validated FormSession submission.
      required: [submissionRef]
      properties:
        submissionRef: { type: string, minLength: 16, maxLength: 500 }
    WorkVersionRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion]
      properties:
        expectedVersion: { type: integer, format: int64, minimum: 0 }
        reason: { type: [string, 'null'] }
    WorkReassignRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion]
      properties:
        expectedVersion: { type: integer, format: int64, minimum: 0 }
        reason: { type: [string, 'null'] }
        assigneeUserId: { type: string }
        assigneeGroupId: { type: string }
      if:
        required: [assigneeUserId]
        properties:
          assigneeUserId: { type: string }
      then:
        not:
          required: [assigneeGroupId]
          properties:
            assigneeGroupId: { type: string }
      else:
        required: [assigneeGroupId]
        properties:
          assigneeGroupId: { type: string }
    WorkCoverRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion, coverUserId, startsAt, expiresAt]
      properties:
        expectedVersion: { type: integer, format: int64, minimum: 0 }
        reason: { type: [string, 'null'] }
        coverUserId: { type: string }
        startsAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
    InboxBulkItemVersion:
      type: object
      additionalProperties: false
      required: [itemId, expectedVersion]
      properties:
        itemId: { type: string, minLength: 1 }
        expectedVersion: { type: integer, format: int64, minimum: 0 }
    InboxBulkReassignRequest:
      type: object
      additionalProperties: false
      required: [items]
      maxProperties: 4
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 200
          uniqueItems: true
          items: { $ref: '#/components/schemas/InboxBulkItemVersion' }
        assigneeUserId: { type: string, minLength: 1 }
        assigneeGroupId: { type: string, minLength: 1 }
        reason: { type: [string, 'null'] }
      if:
        required: [assigneeUserId]
        properties:
          assigneeUserId: { type: string, minLength: 1 }
      then:
        not:
          required: [assigneeGroupId]
          properties:
            assigneeGroupId: { type: string, minLength: 1 }
      else:
        required: [assigneeGroupId]
        properties:
          assigneeGroupId: { type: string, minLength: 1 }
    InboxBulkTagRequest:
      type: object
      additionalProperties: false
      required: [items, tags]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 200
          uniqueItems: true
          items: { $ref: '#/components/schemas/InboxBulkItemVersion' }
        tags:
          type: array
          minItems: 1
          maxItems: 50
          uniqueItems: true
          x-vdx-unique-by: id
          description: >-
            Resolved PERSONAL or TENANT tag facts. The authenticated actor and any persisted PERSONAL
            owner are server-derived; tenant, owner, actor, and time are never accepted from the client.
            RULE tags are read-only routing projections and are rejected for manual bulk application.
          items: { $ref: '#/components/schemas/InboxBulkApplicableTagRef' }
        reason: { type: [string, 'null'] }
    InboxBulkApplicableTagRef:
      type: object
      additionalProperties: false
      description: A resolved manually applicable tag; RULE routing projections are excluded.
      required: [id, label, scope, colorKey, vocabularyVersion, appliedByRuleId]
      properties:
        id: { type: string, minLength: 1 }
        label: { type: string, minLength: 1 }
        scope: { type: string, enum: [PERSONAL, TENANT] }
        colorKey: { type: [string, 'null'], minLength: 1 }
        vocabularyVersion: { type: [integer, 'null'], format: int64, minimum: 0 }
        appliedByRuleId: { type: [string, 'null'] }
      not:
        required: [appliedByRuleId]
        properties:
          appliedByRuleId: { type: string }
      if:
        properties:
          scope: { const: TENANT }
      then:
        properties:
          vocabularyVersion: { type: integer, format: int64, minimum: 0 }
      else:
        properties:
          vocabularyVersion: { type: 'null' }
    InboxBulkItemResult:
      type: object
      additionalProperties: false
      required: [itemId, itemVersion, historyEvent]
      properties:
        itemId: { type: string, minLength: 1 }
        itemVersion: { type: integer, format: int64, minimum: 0 }
        historyEvent: { $ref: '#/components/schemas/InboxHistoryEvent' }
    InboxBulkOperationResult:
      type: object
      additionalProperties: false
      description: One correlated bulk operation with one bulk ID and per-item history.
      required: [bulkId, results, committedAt]
      properties:
        bulkId: { type: string, minLength: 1 }
        results:
          type: array
          minItems: 1
          maxItems: 200
          items: { $ref: '#/components/schemas/InboxBulkItemResult' }
        committedAt: { type: string, format: date-time }
    InboxItemStatePatch:
      type: object
      additionalProperties: false
      required: [expectedVersion]
      minProperties: 2
      properties:
        expectedVersion: { type: integer, format: int64, minimum: 0 }
        read: { type: boolean }
        pinned: { type: boolean }
        watching: { type: boolean }
        dismissed: { type: boolean }
        snoozedUntil: { type: [string, 'null'], format: date-time }
    InboxApiErrorCode:
      type: string
      enum:
        - ITEM_STALE
        - ACTION_NOT_AVAILABLE
        - CLAIM_CONFLICT
        - ASSIGNMENT_EXPIRED
        - POLICY_DENIED
        - SOURCE_UNAVAILABLE
        - FORM_INVALID
        - CONNECTOR_DELIVERY_PENDING
        - CONTENT_QUARANTINED
    InboxApiError:
      type: object
      additionalProperties: false
      required: [code, title, status, traceId]
      properties:
        code: { $ref: '#/components/schemas/InboxApiErrorCode' }
        title: { type: string }
        status: { type: integer, minimum: 400, maximum: 599 }
        traceId: { type: string }
        detail: { type: [string, 'null'] }
        fieldErrors:
          type: object
          additionalProperties:
            type: array
            items: { type: string }
        reason: { type: [string, 'null'], minLength: 1 }
      if:
        properties:
          code: { const: POLICY_DENIED }
      then:
        required: [reason]
        properties:
          reason: { type: string, minLength: 1 }
    InboxPolicyDeniedError:
      allOf:
        - $ref: '#/components/schemas/InboxApiError'
        - type: object
          properties:
            code: { type: string, enum: [POLICY_DENIED] }
            status: { type: integer, enum: [403] }
    InboxActionConflictError:
      allOf:
        - $ref: '#/components/schemas/InboxApiError'
        - type: object
          properties:
            code:
              type: string
              enum: [ITEM_STALE, ACTION_NOT_AVAILABLE, CLAIM_CONFLICT, ASSIGNMENT_EXPIRED, CONNECTOR_DELIVERY_PENDING]
            status: { type: integer, enum: [409] }
    InboxFormInvalidError:
      allOf:
        - $ref: '#/components/schemas/InboxApiError'
        - type: object
          properties:
            code: { type: string, enum: [FORM_INVALID] }
            status: { type: integer, enum: [422] }
    InboxContentQuarantinedError:
      allOf:
        - $ref: '#/components/schemas/InboxApiError'
        - type: object
          properties:
            code: { type: string, enum: [CONTENT_QUARANTINED] }
            status: { type: integer, enum: [423] }
    InboxSourceUnavailableError:
      allOf:
        - $ref: '#/components/schemas/InboxApiError'
        - type: object
          properties:
            code: { type: string, enum: [SOURCE_UNAVAILABLE] }
            status: { type: integer, enum: [503] }
    InboxSummary:
      type: object
      additionalProperties: false
      required: [snapshot, totalAuthorized, counts, diagnostics]
      properties:
        snapshot: { type: string }
        totalAuthorized: { type: integer, format: int64, minimum: 0 }
        counts: { $ref: '#/components/schemas/InboxNatureCounts' }
        facets:
          type: object
          additionalProperties: true
          x-field-extra-annotation: '@Contextual'
        diagnostics: { $ref: '#/components/schemas/InboxQueryDiagnostics' }
      x-vdx-count-constraint: totalAuthorized == counts.work + counts.message + counts.signal
    InboxNatureCounts:
      type: object
      additionalProperties: false
      description: Separate authorization-filtered counts for every Inbox item nature.
      required: [work, message, signal]
      properties:
        work: { type: integer, format: int64, minimum: 0 }
        message: { type: integer, format: int64, minimum: 0 }
        signal: { type: integer, format: int64, minimum: 0 }
    InboxItemPage:
      type: object
      required: [items, snapshot, diagnostics]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/InboxItem' }
        snapshot: { type: string }
        nextCursor: { type: [string, 'null'] }
        diagnostics: { $ref: '#/components/schemas/InboxQueryDiagnostics' }
    InboxCycleTimeMetrics:
      type: object
      additionalProperties: false
      description: Policy-filtered completion cycle-time distribution in seconds.
      required: [sampleCount, averageSeconds, p50Seconds, p95Seconds]
      properties:
        sampleCount: { type: integer, format: int64, minimum: 0 }
        averageSeconds: { type: [number, 'null'], minimum: 0 }
        p50Seconds: { type: [number, 'null'], minimum: 0 }
        p95Seconds: { type: [number, 'null'], minimum: 0 }
      if:
        properties:
          sampleCount: { const: 0 }
      then:
        properties:
          averageSeconds: { type: 'null' }
          p50Seconds: { type: 'null' }
          p95Seconds: { type: 'null' }
      else:
        properties:
          averageSeconds: { type: number, minimum: 0 }
          p50Seconds: { type: number, minimum: 0 }
          p95Seconds: { type: number, minimum: 0 }
        x-vdx-percentile-constraint: p95Seconds >= p50Seconds
    InboxFirstPassYieldMetrics:
      type: object
      additionalProperties: false
      description: Policy-filtered completed work and first-pass completion rate.
      required: [completedCount, firstPassCount, rate]
      properties:
        completedCount: { type: integer, format: int64, minimum: 0 }
        firstPassCount: { type: integer, format: int64, minimum: 0 }
        rate: { type: [number, 'null'], minimum: 0, maximum: 1 }
      x-vdx-count-constraint: firstPassCount <= completedCount
      if:
        properties:
          completedCount: { const: 0 }
      then:
        properties:
          firstPassCount: { const: 0 }
          rate: { type: 'null' }
      else:
        properties:
          rate: { type: number, minimum: 0, maximum: 1 }
    InboxSupervisorMetrics:
      type: object
      additionalProperties: false
      description: >-
        Every count, aggregate, cycle-time sample, and first-pass-yield sample is
        computed after policy. These management metrics are not evidence exports.
      required: [snapshot, diagnostics, openCount, arrivalsPerDay, completionsPerDay, cycleTime, firstPassYield]
      properties:
        snapshot: { type: string, minLength: 1 }
        diagnostics: { $ref: '#/components/schemas/InboxQueryDiagnostics' }
        openCount: { type: integer, format: int64, minimum: 0 }
        arrivalsPerDay: { type: number, minimum: 0 }
        completionsPerDay: { type: number, minimum: 0 }
        cycleTime: { $ref: '#/components/schemas/InboxCycleTimeMetrics' }
        firstPassYield: { $ref: '#/components/schemas/InboxFirstPassYieldMetrics' }
    InboxHistoryPage:
      type: object
      required: [events, snapshot]
      properties:
        events:
          type: array
          items: { $ref: '#/components/schemas/InboxHistoryEvent' }
        snapshot: { type: string }
        nextCursor: { type: [string, 'null'] }
    InboxLiveEvent:
      type: object
      additionalProperties: false
      required: [eventId, projectionRevision, resumeCursor, eventType, occurredAt]
      properties:
        eventId:
          type: string
          minLength: 1
          description: Durable event identifier used as the server-stream event ID.
        projectionRevision:
          type: integer
          format: int64
          minimum: 0
          description: Durable tenant projection revision after applying this event.
        resumeCursor: { type: string }
        eventType: { type: string }
        itemId: { type: [string, 'null'] }
        itemVersion: { type: [integer, 'null'], format: int64 }
        occurredAt: { type: string, format: date-time }
