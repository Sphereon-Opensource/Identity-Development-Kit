          description: One bulk ID with per-item committed assignment history
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InboxBulkOperationResult' }
        '403': { $ref: '#/components/responses/PolicyDenied' }
        '409': { $ref: '#/components/responses/ActionConflict' }
        '503': { $ref: '#/components/responses/SourceUnavailable' }
  /items/bulk/tags:
    post:
      tags: [Items]
      summary: Apply tags to a bounded item set as one correlated operation
      description: Source-domain approve, reject, and complete are forbidden as bulk list operations.
      operationId: bulkTagInboxItems
      x-vdx-command-id: inbox.items.bulk-tag
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InboxBulkTagRequest' }
      responses:
        '200':
          description: One bulk ID with per-item history
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InboxBulkOperationResult' }
        '403': { $ref: '#/components/responses/PolicyDenied' }
        '409': { $ref: '#/components/responses/ActionConflict' }
  /work-items/supervisor/query:
    post:
      tags: [Work]
      summary: Query authorization-filtered supervisor metrics
      operationId: queryInboxSupervisorMetrics
      x-vdx-command-id: inbox.supervisor.query
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InboxQueryDefinition' }
      responses:
        '200':
          description: Every count and aggregate is computed after policy
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InboxSupervisorMetrics' }
  /evidence-exports:
    post:
      tags: [Items]
      summary: Request a policy-filtered evidentiary export job
      description: >-
        The server derives export ID, tenant, requester, and request time from
        authenticated context. This asynchronous evidence archive is separate
        from management metrics and never returns unbounded correlations inline.
      operationId: createInboxEvidenceExport
      x-vdx-command-id: inbox.evidence-exports.create
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateInboxEvidenceExportRequest' }
      responses:
        '202':
          description: Export job accepted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InboxEvidenceExportJob' }
  /evidence-exports/{exportId}:
    parameters:
      - $ref: '#/components/parameters/ExportId'
    get:
      tags: [Items]
      summary: Get an evidentiary export job
      operationId: getInboxEvidenceExportJob
      x-vdx-command-id: inbox.evidence-exports.get
      responses:
        '200':
          description: Tenant-bound export job and completed manifest when available
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InboxEvidenceExportJob' }
  /evidence-exports/{exportId}/artifact:
    parameters:
      - $ref: '#/components/parameters/ExportId'
    get:
      tags: [Items]
      summary: Download a completed evidentiary export archive
      description: >-
        Reauthorizes inbox.export for the current tenant and requester, requires
        COMPLETED status, audits access, and serves the manifest-bound archive
        through a short-lived controlled download. It is not a management report.
      operationId: downloadInboxEvidenceExportArtifact
      x-vdx-command-id: inbox.evidence-exports.download
      responses:
        '200':
          description: Authorized evidence archive bytes
          headers:
            Digest:
              schema: { type: string }
            Content-Disposition:
              schema: { type: string }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
  /throughput-facts:
    get:
      tags: [Summary]
      summary: List authorized append-only arrival and completion facts
      operationId: listInboxThroughputFacts
      x-vdx-command-id: inbox.throughput-facts.list
      parameters:
        - $ref: '#/components/parameters/InboxIdsQuery'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Snapshot'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Policy-filtered event facts, not current projections or aggregates
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InboxThroughputFactPage' }
  /live:
    get:
      tags: [Live]
      summary: Stream resumable authorized inbox updates
      description: >-
        Streams every inbox the current actor may access when no inboxId values
        are supplied. Repeated inboxId values only narrow that authorized set.
      operationId: streamInboxUpdates
      x-vdx-command-id: inbox.live.stream
      parameters:
        - $ref: '#/components/parameters/InboxIdsQuery'
        - name: resumeCursor
          in: query
          description: Opaque actor-, tenant-, policy-, and stream-bound resume cursor.
          schema: { type: string }
      responses:
        '200':
          description: Resumable server-sent update stream
          content:
            text/event-stream:
              schema: { $ref: '#/components/schemas/InboxLiveEvent' }
        '403': { $ref: '#/components/responses/PolicyDenied' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Tenant-bound OAuth 2.0 access token; every operation re-evaluates authorization.
  parameters:
    InboxId:
      name: inboxId
      in: path
      required: true
      schema: { type: string }
    InboxIdsQuery:
      name: inboxId
      in: query
      required: false
      description: >-
        Optional repeated inbox filter. When omitted, the operation spans every
        inbox the current actor is authorized to access.
      style: form
      explode: true
      schema:
        type: array
        minItems: 1
        uniqueItems: true
        items: { type: string, minLength: 1 }
    FolderId:
      name: folderId
      in: path
      required: true
      schema: { type: string }
    QueueId:
      name: queueId
      in: path
      required: true
      schema: { type: string }
    BindingId:
      name: bindingId
      in: path
      required: true
      schema: { type: string }
    SavedViewId:
      name: savedViewId
      in: path
      required: true
      schema: { type: string }
    RuleId:
      name: ruleId
      in: path
      required: true
      schema: { type: string }
    ArtifactId:
      name: artifactId
      in: path
      required: true
      schema: { type: string }
    LegalHoldId:
      name: legalHoldId
      in: path
      required: true
      schema: { type: string }
    ExportId:
      name: exportId
      in: path
      required: true
      schema: { type: string, minLength: 1 }
    ItemId:
      name: itemId
      in: path
      required: true
      schema: { type: string }
    ActionKey:
      name: actionKey
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 128 }
    ReceiptId:
      name: receiptId
      in: path
      required: true
      schema: { type: string, minLength: 1 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 16, maxLength: 200 }
    ExpectedVersionHeader:
      name: If-Match-Version
      in: header
      required: true
      description: Current resource version required for delete concurrency control.
      schema: { type: integer, format: int64, minimum: 0 }
    Cursor:
      name: cursor
      in: query
      description: Opaque cursor bound to actor, authorization epoch, query, and snapshot.
      schema: { type: string }
    Snapshot:
      name: snapshot
      in: query
      description: Stable snapshot identifier returned by the first page.
      schema: { type: string }
    PageSize:
      name: pageSize
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
  responses:
    WorkAssignmentResult:
      description: Synchronous committed Inbox-owned assignment result
      content:
        application/json:
          schema: { $ref: '#/components/schemas/WorkAssignmentResult' }
    InboxActionReceiptAccepted:
      description: Durable action receipt; may already be committed
      content:
        application/json:
          schema: { $ref: '#/components/schemas/InboxActionReceipt' }
    PolicyDenied:
      description: Current tenant policy, membership, assignment, or separation-of-duty rules deny the operation.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/InboxPolicyDeniedError' }
    ActionConflict:
      description: The item, assignment, action availability, or connector-delivery state conflicts with the request.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/InboxActionConflictError' }
    FormInvalid:
      description: The typed payload or referenced FormSession submission is invalid.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/InboxFormInvalidError' }
    ContentQuarantined:
      description: The requested content is quarantined and cannot be used for this operation.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/InboxContentQuarantinedError' }
    SourceUnavailable:
      description: The authoritative source cannot currently revalidate or execute the operation.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/InboxSourceUnavailableError' }
  schemas:
    Inbox:
      type: object
      additionalProperties: false
      description: The server enforces owner.tenantId == tenantId on every write and read.
      required: [id, tenantId, owner, name, version]
      properties:
        id: { type: string }
        tenantId: { type: string }
        owner: { $ref: '#/components/schemas/InboxOwnerRef' }
        name: { type: string }
        description: { type: string }
        version: { type: integer, format: int64, minimum: 0 }
    InboxOwnerKind:
      type: string
      enum: [PERSON, GROUP, PRODUCT, TENANT_FUNCTION]
    InboxOwnerRef:
      type: object
      additionalProperties: false
      description: tenantId must equal the containing Inbox.tenantId; the server rejects mismatches.
      required: [kind, ownerId, tenantId]
      properties:
        kind: { $ref: '#/components/schemas/InboxOwnerKind' }
        ownerId: { type: string, minLength: 1 }
        tenantId: { type: string, minLength: 1 }
    CreateInboxRequest:
      type: object
      additionalProperties: false
      description: The server rejects an owner whose tenantId differs from the authenticated tenant.
      required: [owner, name]
      properties:
        owner: { $ref: '#/components/schemas/InboxOwnerRef' }
        name: { type: string, minLength: 1, maxLength: 200 }
        description: { type: [string, 'null'], maxLength: 2000 }
    UpdateInboxRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion]
      minProperties: 2
      properties:
        expectedVersion: { type: integer, format: int64, minimum: 0 }
        name: { type: string, minLength: 1, maxLength: 200 }
        description: { type: [string, 'null'], maxLength: 2000 }
    InboxFolder:
      type: object
      additionalProperties: false
      required: [id, inboxId, name, version]
      properties:
        id: { type: string }
        inboxId: { type: string }
        parentFolderId: { type: [string, 'null'] }
        name: { type: string }
        ordinal: { type: integer }
        version: { type: integer, format: int64, minimum: 0 }
    CreateInboxFolderRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        parentFolderId: { type: [string, 'null'] }
        name: { type: string, minLength: 1, maxLength: 200 }
        ordinal: { type: integer, minimum: 0 }
    UpdateInboxFolderRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion]
      minProperties: 2
      properties:
        expectedVersion: { type: integer, format: int64, minimum: 0 }
        parentFolderId: { type: [string, 'null'] }
        name: { type: string, minLength: 1, maxLength: 200 }
        ordinal: { type: integer, minimum: 0 }
    FolderBinding:
      type: object
      additionalProperties: false
      description: Contains version references only; endpoints and secrets are not allowed.
      required: [id, folderId, routeId, operationBindingId, dcqlQueryVersions, version]
      properties:
        id: { type: string }
        folderId: { type: string }
        routeId: { type: string }
        operationBindingId: { type: string }
        dcqlQueryVersions:
          type: array
          default: []
          uniqueItems: true
          items: { $ref: '#/components/schemas/DcqlQueryVersionRef' }
        version: { type: integer, format: int64, minimum: 0 }
    DcqlQueryVersionRef:
      type: object
      additionalProperties: false
      required: [queryId, version]
      properties:
        queryId: { type: string, minLength: 1 }
        version: { type: integer, format: int64, minimum: 0 }
    CreateFolderBindingRequest:
      type: object
      additionalProperties: false
      description: >-
        Accepts governed identifiers and DCQL version references only. Endpoint, secret, authentication,
        certificate, and provider configuration fields are rejected.
      required: [routeId, operationBindingId]
      properties:
        routeId: { type: string, minLength: 1 }
        operationBindingId: { type: string, minLength: 1 }
        dcqlQueryVersions:
          type: array
          default: []
          uniqueItems: true
          items: { $ref: '#/components/schemas/DcqlQueryVersionRef' }
    UpdateFolderBindingRequest:
      type: object
      additionalProperties: false
      description: >-
        Updates governed identifiers and DCQL version references only. Endpoint,
        secret, authentication, certificate, and provider configuration fields are rejected.
      required: [expectedVersion]
      minProperties: 2
      properties:
        expectedVersion: { type: integer, format: int64, minimum: 0 }
        routeId: { type: string, minLength: 1 }
        operationBindingId: { type: string, minLength: 1 }
        dcqlQueryVersions:
          type: array
          default: []
          uniqueItems: true
          items: { $ref: '#/components/schemas/DcqlQueryVersionRef' }
    InboxItemNature:
      type: string
      enum: [WORK, MESSAGE, SIGNAL]
    InboxItemLifecycle:
      type: string
      enum: [ACTIVE, HISTORICAL, TOMBSTONED]
    InboxItemTypeKey:
      type: string
      minLength: 1
      description: Extensible registry key; clients must not generate a closed enum.
      x-initial-registered-values:
        - WORKFLOW_TASK
        - FORM_TASK
        - CREDENTIAL_REVIEW
        - CREDENTIAL_RENEWAL
        - EINVOICE
        - EMAIL
        - DOCUMENT_REVIEW
        - MATCH_REVIEW
        - QUALITY_EXCEPTION
        - GENERIC_TASK
    RendererLayout:
      type: string
      enum: [DETAIL, FULL_WORKSPACE, SPLIT_WORKSPACE]
    InboxItem:
      type: object
      additionalProperties: false
      required:
        - id
        - tenantId
        - nature
        - itemTypeKey
        - lifecycle
        - sourceRef
        - retention
        - version
        - createdAt
        - updatedAt
      properties:
        id: { type: string }
        tenantId: { type: string }
        nature: { $ref: '#/components/schemas/InboxItemNature' }
        itemTypeKey: { $ref: '#/components/schemas/InboxItemTypeKey' }
        lifecycle: { $ref: '#/components/schemas/InboxItemLifecycle' }
        title: { type: string, minLength: 1 }
        summary: { type: [string, 'null'] }
        sourceRef: { $ref: '#/components/schemas/InboxSourceRef' }
        placements:
          type: array
          minItems: 1
          uniqueItems: true
          description: >-
            Authorization-filtered placements visible to the current actor;
            placements in inaccessible inboxes or folders are never disclosed.
          items: { $ref: '#/components/schemas/InboxPlacement' }
        workFacet: { $ref: '#/components/schemas/WorkFacet' }
        messageFacet: { $ref: '#/components/schemas/MessageFacet' }
        signalFacet: { $ref: '#/components/schemas/SignalFacet' }
        renderer: { $ref: '#/components/schemas/RendererDescriptor' }
        artifacts:
          type: array
          items: { $ref: '#/components/schemas/ArtifactRef' }
        availableActions:
          type: array
          items: { $ref: '#/components/schemas/InboxAvailableAction' }
        retention: { $ref: '#/components/schemas/InboxRetention' }
        tags:
          type: array
          uniqueItems: true
          items: { $ref: '#/components/schemas/InboxTagRef' }
        authorizationDecision:
          description: Recipient-safe authorization decision projection when this item is decision-backed.
          $ref: '#/components/schemas/AuthorizationDecisionProjection'
        version: { type: integer, format: int64, minimum: 0 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
      allOf:
        - if:
            properties:
              lifecycle: { const: TOMBSTONED }
            required: [lifecycle]
          then:
            description: Safe tombstones retain identity and ordering only; content fields are forbidden.
            properties:
              title: false
              summary: false
              placements: false
              workFacet: false
              messageFacet: false
              signalFacet: false
              renderer: false
              artifacts: false
              availableActions: false
              tags: false
              authorizationDecision: false
          else:
            required: [title, placements, renderer]
            properties:
              title: { type: string, minLength: 1 }
              placements:
                type: array
                minItems: 1
                uniqueItems: true
                items: { $ref: '#/components/schemas/InboxPlacement' }
              renderer: { $ref: '#/components/schemas/RendererDescriptor' }
            oneOf:
              - title: WORK content has exactly WorkFacet.
                required: [workFacet]
                properties:
                  nature: { const: WORK }
                  workFacet: { $ref: '#/components/schemas/WorkFacet' }
                  messageFacet: false
                  signalFacet: false
              - title: MESSAGE content has exactly MessageFacet.
                required: [messageFacet]
                properties:
                  nature: { const: MESSAGE }
                  workFacet: false
                  messageFacet: { $ref: '#/components/schemas/MessageFacet' }
                  signalFacet: false
              - title: SIGNAL content has exactly SignalFacet.
                required: [signalFacet]
                properties:
                  nature: { const: SIGNAL }
                  workFacet: false
                  messageFacet: false
                  signalFacet: { $ref: '#/components/schemas/SignalFacet' }
    InboxPlacement:
      type: object
      additionalProperties: false
      required: [id, itemId, inboxId, folderId, placedAt]
      properties:
        id: { type: string }
        itemId: { type: string }
        inboxId: { type: string, minLength: 1 }
        folderId:
          type: [string, 'null']
          minLength: 1
          description: Null for an inbox-root or product-owned placement with no physical folder.
        placedAt: { type: string, format: date-time }
        routingRuleId: { type: [string, 'null'] }
    InboxSourceRef:
      type: object
      additionalProperties: false
      required: [sourceSystem, objectType, objectId, sourceVersion, tenantId]
      properties:
        sourceSystem: { type: string, minLength: 1 }
        objectType: { type: string, minLength: 1 }
        objectId: { type: string, minLength: 1 }
        sourceVersion: { type: integer, format: int64, minimum: 0 }
        tenantId: { type: string, minLength: 1 }
        workflowCorrelationId: { type: [string, 'null'] }
        interactionCorrelationId: { type: [string, 'null'] }
    WorkFacet:
      type: object
      additionalProperties: false
      required: [assignmentState, queueId, sla, checkoutLease]
      properties:
        assignmentState:
          type: string
          enum: [UNASSIGNED, OFFERED, ASSIGNED, CLAIMED, COMPLETED]
        assigneeUserId: { type: [string, 'null'] }
        assigneeGroupId: { type: [string, 'null'] }
        dueAt: { type: [string, 'null'], format: date-time }
        claimable: { type: boolean }
        dualControlRequired: { type: boolean }
        coverExpiresAt: { type: [string, 'null'], format: date-time }
        sourceWorkflowState: { type: [string, 'null'] }
        queueId: { type: string, minLength: 1 }
        sla: { $ref: '#/components/schemas/WorkSlaTarget' }
        checkoutLease: { $ref: '#/components/schemas/WorkCheckoutLease' }
        assigneeDisplayName:
          type: [string, 'null']
          minLength: 1
          description: >-
            Readable name of the assignee party, resolved by the server. Absent when the party
            cannot be named; a client shows the name or nothing, never the id.
        assigneeGroupDisplayName:
          type: [string, 'null']
          minLength: 1
          description: Readable name of the assignee group party, on the same terms as assigneeDisplayName.
      dependentRequired:
        assigneeDisplayName: [assigneeUserId]
        assigneeGroupDisplayName: [assigneeGroupId]
    WorkAssignmentResult:
      type: object
      additionalProperties: false
      description: >-
        Synchronous result of an atomic Inbox-owned claim, release, reassign,
        set-cover, clear-cover, explicit lease extension, or take-over operation.
        It is not a source action receipt. Lease extension is never inferred from client activity.
      required:
        - itemId
        - operation
        - assignmentState
        - itemVersion
        - assignmentVersion
        - checkoutLease
        - historyEvent
        - committedAt
      properties:
        itemId: { type: string }
        operation: { type: string, enum: [CLAIM, RELEASE, REASSIGN, SET_COVER, CLEAR_COVER, EXTEND_LEASE, TAKE_OVER] }
        assignmentState:
          type: string
          enum: [UNASSIGNED, OFFERED, ASSIGNED, CLAIMED, COMPLETED]
        assigneeUserId: { type: [string, 'null'] }
        assigneeGroupId: { type: [string, 'null'] }
        coverUserId: { type: [string, 'null'] }
        coverStartsAt: { type: [string, 'null'], format: date-time }
        coverExpiresAt: { type: [string, 'null'], format: date-time }
        checkoutLease: { $ref: '#/components/schemas/WorkCheckoutLease' }
        itemVersion: { type: integer, format: int64, minimum: 0 }
        assignmentVersion: { type: integer, format: int64, minimum: 0 }
        historyEvent: { $ref: '#/components/schemas/InboxHistoryEvent' }
        committedAt: { type: string, format: date-time }
      allOf:
        - if:
            required: [operation]
            properties:
              operation: { const: TAKE_OVER }
          then:
            required: [assigneeUserId]
            properties:
              assigneeUserId: { type: string, minLength: 1 }
            description: >-
              A take-over has distinct previous and new lease holders,
              assigneeUserId equals the new holderUserId, and
              historyEvent.relatedActorIds is exactly [previousHolderUserId,
              holderUserId] in that order.
            x-vdx-take-over-provenance:
              distinct: [checkoutLease.previousHolderUserId, checkoutLease.holderUserId]
              equal: [assigneeUserId, checkoutLease.holderUserId]
              orderedHistoryActors: [checkoutLease.previousHolderUserId, checkoutLease.holderUserId]
    WorkingCalendarVersionRef:
      type: object
      additionalProperties: false
      required: [calendarId, version, timeZoneId]
      properties:
        calendarId: { type: string, minLength: 1 }
        version: { type: integer, format: int64, minimum: 0 }
        timeZoneId: { type: string, minLength: 1 }
    SlaPolicyVersionRef:
      type: object
      additionalProperties: false
      required: [policyId, version]
      properties:
        policyId: { type: string, minLength: 1 }
        version: { type: integer, format: int64, minimum: 0 }
    InboxWorkQueue:
      type: object
      additionalProperties: false
      description: A queue may target a physical folder or the root of a zero-folder product-owned inbox.
      required: [id, tenantId, inboxId, folderId, name, workingCalendar, version]
      properties:
        id: { type: string, minLength: 1 }
        tenantId: { type: string, minLength: 1 }
        inboxId: { type: string, minLength: 1 }
        folderId: { type: [string, 'null'], minLength: 1 }
        name: { type: string, minLength: 1 }
        workingCalendar: { $ref: '#/components/schemas/WorkingCalendarVersionRef' }
        version: { type: integer, format: int64, minimum: 0 }
    CreateInboxWorkQueueRequest:
      type: object
      additionalProperties: false
      required: [folderId, name, workingCalendar]
      properties:
        folderId: { type: [string, 'null'], minLength: 1 }
        name: { type: string, minLength: 1 }
        workingCalendar: { $ref: '#/components/schemas/WorkingCalendarVersionRef' }
    UpdateInboxWorkQueueRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion]
      minProperties: 2
      properties:
        expectedVersion: { type: integer, format: int64, minimum: 0 }
        folderId: { type: [string, 'null'], minLength: 1 }
        name: { type: string, minLength: 1 }
        workingCalendar: { $ref: '#/components/schemas/WorkingCalendarVersionRef' }
    WorkSlaState:
      type: string
      enum: [ON_TRACK, PAST_TARGET, BREACHED]
    WorkEscalationTargetKind:
      type: string
      enum: [USER, GROUP, QUEUE, INBOX_OWNER]
    WorkEscalationTargetRef:
      type: object
      additionalProperties: false
      required: [kind, targetId]
      properties:
        kind: { $ref: '#/components/schemas/WorkEscalationTargetKind' }
        targetId: { type: string, minLength: 1 }
    WorkEscalationStep:
      type: object
      additionalProperties: false
      required: [level, triggerAt, target]
      properties:
        level: { type: integer, minimum: 1 }
        triggerAt: { type: string, format: date-time }
        target: { $ref: '#/components/schemas/WorkEscalationTargetRef' }
    WorkSlaTarget:
      type: object
      additionalProperties: false
      description: Resolved target; breachAt is not before targetAt and escalation levels/times are ordered.
      required: [targetAt, breachAt, state, policy, workingCalendar, escalationSteps, currentEscalationLevel]
      properties:
        targetAt: { type: string, format: date-time }
        breachAt: { type: string, format: date-time }
        state: { $ref: '#/components/schemas/WorkSlaState' }
        policy: { $ref: '#/components/schemas/SlaPolicyVersionRef' }
        workingCalendar: { $ref: '#/components/schemas/WorkingCalendarVersionRef' }
        escalationSteps:
          type: array
          items: { $ref: '#/components/schemas/WorkEscalationStep' }
        currentEscalationLevel: { type: integer, minimum: 0 }
    WorkCheckoutStatus:
      type: string
      enum: [FREE, HELD, EXPIRED]
    WorkCheckoutLease:
      type: object
      additionalProperties: false
      description: Expiry is distinct from free; extension is explicit and take-over is distinct from reassign.
      required: [leaseId, status, holderUserId, previousHolderUserId, startedAt, expiresAt, leaseDurationSeconds, workingCalendar]
      properties:
        leaseId: { type: [string, 'null'], minLength: 1 }
        status: { $ref: '#/components/schemas/WorkCheckoutStatus' }
        holderUserId: { type: [string, 'null'], minLength: 1 }
        previousHolderUserId: { type: [string, 'null'], minLength: 1 }
        startedAt: { type: [string, 'null'], format: date-time }
        expiresAt: { type: [string, 'null'], format: date-time }
        leaseDurationSeconds: { type: integer, format: int64, minimum: 0 }
        workingCalendar: { $ref: '#/components/schemas/WorkingCalendarVersionRef' }
        holderDisplayName:
          type: [string, 'null']
          minLength: 1
          description: Readable name of the lease holder party, resolved by the server; absent when it cannot be named.
        previousHolderDisplayName:
          type: [string, 'null']
          minLength: 1
          description: Readable name of the previous lease holder party, on the same terms as holderDisplayName.
      dependentRequired:
        holderDisplayName: [holderUserId]
        previousHolderDisplayName: [previousHolderUserId]
      if:
        properties:
          status: { const: FREE }
      then:
        properties:
          holderUserId: { type: 'null' }
          startedAt: { type: 'null' }
          expiresAt: { type: 'null' }
      else:
        if:
          properties:
            status: { const: HELD }
        then:
          properties:
            leaseId: { type: string, minLength: 1 }
            holderUserId: { type: string, minLength: 1 }
            startedAt: { type: string, format: date-time }
            expiresAt: { type: string, format: date-time }
        else:
          properties:
            status: { const: EXPIRED }
            leaseId: { type: string, minLength: 1 }
            holderUserId: { type: 'null' }
            previousHolderUserId: { type: string, minLength: 1 }
            expiresAt: { type: string, format: date-time }
    WorkEscalationRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion, level]
      properties:
        expectedVersion: { type: integer, format: int64, minimum: 0 }
        level: { type: integer, minimum: 1 }
        reason: { type: [string, 'null'] }
    WorkEscalationResult:
      type: object
      additionalProperties: false
      description: Synchronous Inbox-owned result; never an InboxActionReceipt.
      required: [itemId, queueId, level, target, slaState, itemVersion, historyEvent, committedAt]
      properties:
        itemId: { type: string, minLength: 1 }
        queueId: { type: string, minLength: 1 }
        level: { type: integer, minimum: 1 }
        target: { $ref: '#/components/schemas/WorkEscalationTargetRef' }
