      summary: Commit an Inbox-owned SLA escalation synchronously
      operationId: escalateWorkItem
      x-vdx-command-id: inbox.work-items.escalate
      parameters:
        - $ref: '#/components/parameters/ItemId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkEscalationRequest' }
      responses:
        '200':
