    InboxLegalHoldStatus:
      type: string
      enum: [ACTIVE, RELEASED]
    InboxLegalHold:
      type: object
      additionalProperties: false
      description: Hold state changes only through audited optimistic writes and wins over a pending sweep.
      required: [id, tenantId, itemId, status, reason, appliedBy, appliedAt, releasedBy, releasedAt, version]
      properties:
        id: { type: string, minLength: 1 }
        tenantId: { type: string, minLength: 1 }
        itemId: { type: string, minLength: 1 }
        status: { $ref: '#/components/schemas/InboxLegalHoldStatus' }
        reason: { type: string, minLength: 1 }
        appliedBy: { type: string, minLength: 1 }
        appliedAt: { type: string, format: date-time }
        releasedBy: { type: [string, 'null'], minLength: 1 }
        releasedAt: { type: [string, 'null'], format: date-time }
        version: { type: integer, format: int64, minimum: 0 }
      if:
        required: [status]
        properties:
          status: { const: ACTIVE }
      then:
        properties:
          releasedBy: { type: 'null' }
          releasedAt: { type: 'null' }
      else:
        properties:
          releasedBy: { type: string, minLength: 1 }
          releasedAt: { type: string, format: date-time }
        x-vdx-temporal-constraint: releasedAt >= appliedAt
    ApplyInboxLegalHoldRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion, reason]
      properties:
        expectedVersion: { type: integer, format: int64, minimum: 0 }
