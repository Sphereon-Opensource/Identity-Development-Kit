    InboxActionReceipt:
      type: object
      required: [state]
      properties:
        state: { $ref: '#/components/schemas/InboxActionReceiptState' }
      oneOf:
        - $ref: '#/components/schemas/PendingInboxActionReceipt'
        - $ref: '#/components/schemas/FinalInboxActionReceipt'
      discriminator:
        propertyName: state
        mapping:
          PENDING: '#/components/schemas/PendingInboxActionReceipt'
          FINAL: '#/components/schemas/FinalInboxActionReceipt'
    InboxActionReceiptState:
      type: string
      enum: [PENDING, FINAL]
    PendingInboxActionReceipt:
      type: object
      additionalProperties: false
      description: >-
        Append-only first receipt revision: the source-dispatched intent is
        durably accepted and downstream completion is pending.
      required: [id, attemptId, revision, itemId, actionKey, idempotencyKey, state, acceptedAt]
      properties:
        id: { type: string }
        attemptId: { type: string }
        revision: { type: integer, format: int64, minimum: 1 }
        itemId: { type: string }
        actionKey: { type: string }
        idempotencyKey: { type: string }
        acceptedAt: { type: string, format: date-time }
        state: { type: string, enum: [PENDING] }
    FinalInboxActionReceipt:
      type: object
      additionalProperties: false
      description: >-
        Append-only final revision for the attempted source dispatch. It directly
        carries exactly one outcome. A later source fact may append another FINAL
        revision that supersedes this receipt; existing history is never rewritten.
      required: [id, attemptId, revision, supersedesReceiptId, itemId, actionKey, idempotencyKey, state, outcome, acceptedAt, completedAt]
      properties:
        id: { type: string }
        attemptId: { type: string }
        revision: { type: integer, format: int64, minimum: 2 }
        supersedesReceiptId: { type: string }
        itemId: { type: string }
        actionKey: { type: string }
        idempotencyKey: { type: string }
        outcome:
          type: string
          enum: [COMMITTED, FAILED, INDETERMINATE]
        acceptedAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time }
        sourceReceiptId: { type: [string, 'null'] }
        correctionReason: { type: [string, 'null'] }
        error:
          $ref: '#/components/schemas/InboxApiError'
        state: { type: string, enum: [FINAL] }
