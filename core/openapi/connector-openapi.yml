        - name: physicalConnectorInstanceId
          in: query
          required: false
          description: Filter by the physical connector instance backing the data product.
          schema:
            $ref: './connector-components.yml#/components/schemas/ConnectorInstanceId'
          example: 8a7f09af-7ac9-4d96-91f9-a2a252f4aa4b
        - $ref: './common-components.yml#/components/parameters/Page'
        - $ref: './common-components.yml#/components/parameters/Size'
      responses:
        '200':
          description: Paged connector data product descriptors.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectorDataProductDescriptorPage'
        '400':
          $ref: './common-components.yml#/components/responses/ValidationError'
        '401':
          $ref: './common-components.yml#/components/responses/Unauthorized'
    post:
      operationId: createDataProductDescriptor
      summary: Create a connector data product descriptor
      description: |
        Creates or replaces a connector data product descriptor. The descriptor must reference an
        existing logical connection binding, matching physical connector instance, known dataset
        resource descriptors, at least one transfer type, and at least one catalog offer policy ref.
