        '401':
          $ref: './common-components.yml#/components/responses/Unauthorized'
        '404':
          $ref: './common-components.yml#/components/responses/NotFound'
    post:
      operationId: createConnectorRouteRun
      summary: Start a connector route run
      description: |
        Starts a route run and returns the accepted execution record. The optional input can carry
        lookup keys, batch references, dry-run flags, or caller metadata. Long-running execution is
        observed through the runs, events, and dead-letter endpoints.
      tags: [Runs]
      parameters:
        - $ref: './connector-components.yml#/components/parameters/RouteId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartConnectorRouteRunRequest'
      responses:
        '202':
          description: Connector route run accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectorRun'
        '400':
          $ref: './common-components.yml#/components/responses/ValidationError'
        '401':
          $ref: './common-components.yml#/components/responses/Unauthorized'
        '404':
          $ref: './common-components.yml#/components/responses/NotFound'

  /runs:
    get:
      operationId: listConnectorRuns
      summary: List connector runs
      description: |
        Lists route and operation runs across the tenant. Use this direct tenant-wide run resource
        for operational dashboards, customer support, audit trails, retry decisions, and monitoring
        failed or partially failed imports and exports. Use `/routes/{routeId}/runs` for
        route-scoped history.
      tags: [Runs]
      parameters:
        - $ref: './connector-components.yml#/components/parameters/ConnectorRunStatus'
        - $ref: './connector-components.yml#/components/parameters/RouteIdQuery'
        - $ref: './connector-components.yml#/components/parameters/ConnectorInstanceIdQuery'
        - $ref: './connector-components.yml#/components/parameters/InvocationBindingIdQuery'
        - $ref: './connector-components.yml#/components/parameters/LogicalConnectionBindingIdQuery'
        - $ref: './connector-components.yml#/components/parameters/PhysicalConnectorInstanceIdQuery'
        - $ref: './connector-components.yml#/components/parameters/ConnectorExchangeModeQuery'
        - $ref: './connector-components.yml#/components/parameters/ProtocolSurfaceQuery'
        - $ref: './connector-components.yml#/components/parameters/CorrelationIdQuery'
        - $ref: './common-components.yml#/components/parameters/Page'
        - $ref: './common-components.yml#/components/parameters/Size'
      responses:
        '200':
          description: Paged connector runs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectorRunPage'
        '400':
          $ref: './common-components.yml#/components/responses/ValidationError'
        '401':
          $ref: './common-components.yml#/components/responses/Unauthorized'

  /runs/{runId}:
    get:
      operationId: getConnectorRun
      summary: Get a connector run
      description: |
        Reads one connector execution record, including status, timestamps, counts, correlation id,
        and error summary. Detailed logs are exposed as run events.
      tags: [Runs]
      parameters:
        - $ref: './connector-components.yml#/components/parameters/RunId'
      responses:
        '200':
          description: Connector run.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectorRun'
        '401':
          $ref: './common-components.yml#/components/responses/Unauthorized'
        '404':
          $ref: './common-components.yml#/components/responses/NotFound'

  /runs/{runId}/events:
    get:
      operationId: listConnectorRunEvents
      summary: List connector run events
      description: |
        Lists timestamped run events emitted by the connector runtime. Events should contain enough
        detail for support and audit without embedding sensitive payloads unless policy permits it.
      tags: [Runs]
      parameters:
        - $ref: './connector-components.yml#/components/parameters/RunId'
        - $ref: './common-components.yml#/components/parameters/Page'
        - $ref: './common-components.yml#/components/parameters/Size'
      responses:
        '200':
          description: Paged connector run events.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectorRunEventPage'
        '401':
          $ref: './common-components.yml#/components/responses/Unauthorized'
        '404':
          $ref: './common-components.yml#/components/responses/NotFound'

  /runs/{runId}/deadletters:
    get:
      operationId: listConnectorDeadLetters
      summary: List connector dead letters
      description: |
        Lists failed items captured for a run after validation, transformation, or destination
        delivery failure. Dead letters should reference retained payloads rather than embedding
        them by default so retention and sensitivity policy can control access.
      tags: [Runs]
      parameters:
        - $ref: './connector-components.yml#/components/parameters/RunId'
        - $ref: './common-components.yml#/components/parameters/Page'
        - $ref: './common-components.yml#/components/parameters/Size'
      responses:
        '200':
          description: Paged connector dead letters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectorDeadLetterPage'
        '401':
          $ref: './common-components.yml#/components/responses/Unauthorized'
        '404':
          $ref: './common-components.yml#/components/responses/NotFound'

