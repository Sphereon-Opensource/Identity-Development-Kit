      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConnectorDataProductDescriptorCreateRequest'
      responses:
        '201':
          description: Connector data product descriptor created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectorDataProductDescriptor'
        '400':
          $ref: './common-components.yml#/components/responses/ValidationError'
        '401':
          $ref: './common-components.yml#/components/responses/Unauthorized'

  /data/products/{dataProductId}:
    get:
      operationId: getDataProductDescriptor
