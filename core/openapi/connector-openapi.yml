        - name: sourceDescriptorId
          in: query
          required: false
          description: Filter by source resource descriptor id.
          schema:
            $ref: './connector-components.yml#/components/schemas/ResourceDescriptorId'
          example: 41436f49-040c-4f5f-9c7f-657f43762e2b
        - name: targetDescriptorId
          in: query
          required: false
          description: Filter by target resource descriptor id.
