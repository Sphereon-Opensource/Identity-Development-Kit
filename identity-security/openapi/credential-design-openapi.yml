      responses:
        '200':
          description: The matching verifier designs.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/VerifierDesignRecord'
        '401':
          $ref: './common-components.yml#/components/responses/Unauthorized'
        '500':
          $ref: './common-components.yml#/components/responses/Error'

  /designs/verifiers/import:
    post:
      tags: [VerifierDesigns]
      summary: Import a verifier design
      operationId: importVerifierDesign
      description: Fetches an external verifier design from `sourceUrl`, snapshots and maps it, and persists the canonical verifier design.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportExternalDesignInput'
      responses:
        '201':
          description: The imported verifier design.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifierDesignRecord'
        '400':
          $ref: './common-components.yml#/components/responses/ValidationError'
        '401':
          $ref: './common-components.yml#/components/responses/Unauthorized'
        '500':
          $ref: './common-components.yml#/components/responses/Error'

  /designs/verifiers/resolve:
    post:
      tags: [VerifierDesigns]
      summary: Resolve a verifier design
      operationId: resolveVerifierDesign
      description: Resolves a verifier design selected by id or binding, returning the merged design with its render variants, applied layers, and locked fields.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResolveEntityDesignInput'
      responses:
        '200':
          description: The resolved verifier design.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResolvedVerifierDesign'
        '400':
          $ref: './common-components.yml#/components/responses/ValidationError'
        '401':
          $ref: './common-components.yml#/components/responses/Unauthorized'
        '404':
          $ref: './common-components.yml#/components/responses/NotFound'
        '500':
          $ref: './common-components.yml#/components/responses/Error'

  /designs/verifiers/{designId}:
    parameters:
      - $ref: './credential-design-components.yml#/components/parameters/DesignId'
    get:
      tags: [VerifierDesigns]
      summary: Get a verifier design
      operationId: getVerifierDesign
      description: Returns one verifier design by id.
      responses:
        '200':
          description: The verifier design.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifierDesignRecord'
        '401':
          $ref: './common-components.yml#/components/responses/Unauthorized'
        '404':
          $ref: './common-components.yml#/components/responses/NotFound'
        '500':
          $ref: './common-components.yml#/components/responses/Error'
    put:
      tags: [VerifierDesigns]
      summary: Update a verifier design
      operationId: updateVerifierDesign
      description: Updates a verifier design. Omitted fields are left unchanged.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateVerifierDesignInput'
      responses:
        '200':
          description: The updated verifier design.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifierDesignRecord'
        '400':
          $ref: './common-components.yml#/components/responses/ValidationError'
        '401':
          $ref: './common-components.yml#/components/responses/Unauthorized'
        '404':
          $ref: './common-components.yml#/components/responses/NotFound'
        '500':
          $ref: './common-components.yml#/components/responses/Error'
    delete:
      tags: [VerifierDesigns]
      summary: Delete a verifier design
      operationId: deleteVerifierDesign
      description: Deletes a verifier design and returns no response body when successful.
      responses:
        '204':
          description: The verifier design was deleted.
        '401':
          $ref: './common-components.yml#/components/responses/Unauthorized'
        '404':
          $ref: './common-components.yml#/components/responses/NotFound'
        '500':
          $ref: './common-components.yml#/components/responses/Error'

  /designs/verifiers/{designId}/refresh:
    parameters:
      - $ref: './credential-design-components.yml#/components/parameters/DesignId'
    post:
      tags: [VerifierDesigns]
      summary: Refresh an imported verifier design
      operationId: refreshVerifierDesign
      description: Re-fetches an imported verifier design from its source and re-applies the mapper.
      responses:
        '200':
          description: The refreshed verifier design.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifierDesignRecord'
        '400':
          $ref: './common-components.yml#/components/responses/ValidationError'
        '401':
          $ref: './common-components.yml#/components/responses/Unauthorized'
        '404':
          $ref: './common-components.yml#/components/responses/NotFound'
        '500':
          $ref: './common-components.yml#/components/responses/Error'

  # ---- Render variants ------------------------------------------------------

  /designs/render/variants:
    post:
      tags: [RenderVariants]
      summary: Create a render variant
      operationId: createRenderVariant
      description: Creates a reusable render variant in the caller's tenant.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRenderVariantInput'
      responses:
        '201':
          description: The created render variant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RenderVariantRecord'
        '400':
          $ref: './common-components.yml#/components/responses/ValidationError'
        '401':
          $ref: './common-components.yml#/components/responses/Unauthorized'
        '500':
          $ref: './common-components.yml#/components/responses/Error'
    get:
      tags: [RenderVariants]
      summary: List render variants
      operationId: listRenderVariants
      description: Returns the render variants in the caller's tenant, optionally narrowed by alias substring.
      parameters:
        - $ref: '#/components/parameters/FilterAliasContains'
      responses:
        '200':
          description: The matching render variants.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RenderVariantRecord'
        '401':
          $ref: './common-components.yml#/components/responses/Unauthorized'
        '500':
          $ref: './common-components.yml#/components/responses/Error'

  /designs/render/variants/{variantId}:
    parameters:
      - $ref: './credential-design-components.yml#/components/parameters/VariantId'
    get:
      tags: [RenderVariants]
      summary: Get a render variant
      operationId: getRenderVariant
      description: Returns one render variant by id.
      responses:
        '200':
          description: The render variant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RenderVariantRecord'
        '401':
          $ref: './common-components.yml#/components/responses/Unauthorized'
        '404':
          $ref: './common-components.yml#/components/responses/NotFound'
        '500':
          $ref: './common-components.yml#/components/responses/Error'
    put:
      tags: [RenderVariants]
      summary: Update a render variant
      operationId: updateRenderVariant
      description: Replaces a render variant's content. The body is the same shape used to create one.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRenderVariantInput'
      responses:
        '200':
          description: The updated render variant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RenderVariantRecord'
        '400':
          $ref: './common-components.yml#/components/responses/ValidationError'
        '401':
          $ref: './common-components.yml#/components/responses/Unauthorized'
        '404':
          $ref: './common-components.yml#/components/responses/NotFound'
        '500':
          $ref: './common-components.yml#/components/responses/Error'
    delete:
      tags: [RenderVariants]
      summary: Delete a render variant
      operationId: deleteRenderVariant
      description: Deletes a render variant and returns no response body when successful.
      responses:
        '204':
          description: The render variant was deleted.
        '401':
          $ref: './common-components.yml#/components/responses/Unauthorized'
        '404':
          $ref: './common-components.yml#/components/responses/NotFound'
        '500':
          $ref: './common-components.yml#/components/responses/Error'

  # ---- Source snapshots -----------------------------------------------------

  /designs/snapshots/{snapshotId}:
    parameters:
      - $ref: './credential-design-components.yml#/components/parameters/SnapshotId'
    get:
      tags: [DesignSnapshots]
      summary: Get a source snapshot
      operationId: getSourceSnapshot
      description: Returns the metadata and stored payload reference for the snapshot captured when a design was imported.
      responses:
        '200':
          description: The source snapshot.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceSnapshotRecord'
        '401':
          $ref: './common-components.yml#/components/responses/Unauthorized'
        '404':
          $ref: './common-components.yml#/components/responses/NotFound'
        '500':
          $ref: './common-components.yml#/components/responses/Error'

  /designs/snapshots/{snapshotId}/refresh:
    parameters:
      - $ref: './credential-design-components.yml#/components/parameters/SnapshotId'
    post:
      tags: [DesignSnapshots]
      summary: Refresh a source snapshot
      operationId: refreshSourceSnapshot
      description: Re-fetches the snapshot's source, using its stored ETag for a conditional request, and returns the updated snapshot.
      responses:
        '200':
          description: The refreshed source snapshot.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceSnapshotRecord'
        '400':
          $ref: './common-components.yml#/components/responses/ValidationError'
        '401':
          $ref: './common-components.yml#/components/responses/Unauthorized'
        '404':
          $ref: './common-components.yml#/components/responses/NotFound'
        '500':
          $ref: './common-components.yml#/components/responses/Error'

  # ---- Design assets --------------------------------------------------------

  /public/assets/design/{asset}:
    servers:
      - url: /
        description: Host root. Public asset hosting is an unversioned mount, not under `/api/credential-design/v1`.
    get:
      tags: [DesignAssets]
      summary: Download a public design asset
      operationId: getPublicDesignAssetByHash
      security: []
      description: |
        Serves content-addressed design assets referenced from OID4VCI display metadata and
        SD-JWT VC type metadata, such as logo and background images. The `{asset}` value is the
        hash leaf produced by the design asset upload flow and may include a file extension.
      parameters:
        - name: asset
          in: path
          required: true
          description: Content-addressed asset leaf, for example `{sha256}.png`.
          schema:
            type: string
      responses:
        '200':
          description: Public asset bytes.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
            image/svg+xml:
              schema:
                type: string
                format: binary
            application/pdf:
              schema:
                type: string
                format: binary
        '404':
          $ref: './common-components.yml#/components/responses/NotFound'

  /designs/assets:
    get:
      tags: [DesignAssets]
      summary: List tenant design assets
      operationId: listDesignAssets
      description: >-
        Lists the caller-tenant's content-addressed, design-agnostic design asset blobs. Optional
        `assetType` and `contentType` query filters narrow the result. Note that a content-addressed
        asset stores no asset-type segment, so `assetType` is applied loosely by content-type family
        (`PDF_TEMPLATE` -> `application/pdf`, `SVG_TEMPLATE` -> `image/svg+xml`, `LOGO` /
        `BACKGROUND_IMAGE` -> any `image/*`); `contentType` matches by content-type prefix.
      parameters:
        - name: assetType
          in: query
          required: false
          description: Restrict to assets whose content-type matches this asset slot's family.
          schema:
            $ref: './credential-design-components.yml#/components/schemas/DesignAssetType'
        - name: contentType
          in: query
          required: false
          description: Restrict to assets whose content-type starts with this value (for example `image/`).
          schema:
            type: string
      responses:
        '200':
          description: The tenant's design assets.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AssetInfo'
        '401':
          $ref: './common-components.yml#/components/responses/Unauthorized'
        '500':
          $ref: './common-components.yml#/components/responses/Error'

  /designs/assets/{assetType}:
    parameters:
      - $ref: './credential-design-components.yml#/components/parameters/AssetType'
    post:
      tags: [DesignAssets]
      summary: Upload a tenant design asset
      operationId: uploadTenantAsset
      description: >-
        Uploads a design-agnostic, tenant-scoped branding asset as raw bytes. The asset is
        content-addressed (SHA-256) and deduped within the tenant; the stored content type is taken
        from the request `Content-Type` header. The `assetType` path segment is informational and
        does not affect the storage key. Returns a reference to the stored asset.
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
          image/png:
            schema:
              type: string
              format: binary
          image/svg+xml:
            schema:
              type: string
              format: binary
          application/pdf:
            schema:
              type: string
              format: binary
      responses:
        '201':
          description: A reference to the stored asset.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetReference'
        '400':
          $ref: './common-components.yml#/components/responses/ValidationError'
        '401':
          $ref: './common-components.yml#/components/responses/Unauthorized'
        '404':
          $ref: './common-components.yml#/components/responses/NotFound'
        '500':
          $ref: './common-components.yml#/components/responses/Error'

  /designs/credentials/{designId}/assets/{locale}/{assetType}:
    parameters:
      - $ref: './credential-design-components.yml#/components/parameters/DesignId'
      - $ref: './credential-design-components.yml#/components/parameters/Locale'
      - $ref: './credential-design-components.yml#/components/parameters/AssetType'
    post:
      tags: [DesignAssets]
      summary: Upload a design asset
      operationId: uploadDesignAsset
      description: >-
        Uploads a branding asset for a credential design as raw bytes. The asset slot is set by
        `assetType` and the locale by `locale`; the stored content type is taken from the request
        `Content-Type` header. Returns a reference to the stored asset.
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
          image/png:
            schema:
              type: string
              format: binary
          image/svg+xml:
            schema:
              type: string
              format: binary
          application/pdf:
            schema:
              type: string
              format: binary
      responses:
        '201':
          description: A reference to the stored asset.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetReference'
        '400':
          $ref: './common-components.yml#/components/responses/ValidationError'
        '401':
          $ref: './common-components.yml#/components/responses/Unauthorized'
        '404':
          $ref: './common-components.yml#/components/responses/NotFound'
        '500':
          $ref: './common-components.yml#/components/responses/Error'
    get:
      tags: [DesignAssets]
      summary: Download a design asset
      operationId: getDesignAsset
      description: >-
        Returns the raw bytes of a stored branding asset. The response `Content-Type` is whatever
        the asset was stored as (for example `image/png`, `image/svg+xml`, or `application/pdf`).
      responses:
        '200':
          description: The asset bytes.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
            image/svg+xml:
              schema:
                type: string
                format: binary
            application/pdf:
              schema:
                type: string
                format: binary
        '401':
          $ref: './common-components.yml#/components/responses/Unauthorized'
        '404':
          $ref: './common-components.yml#/components/responses/NotFound'
        '500':
          $ref: './common-components.yml#/components/responses/Error'

components:
  # Shared pagination/error/header components and the bearer scheme live in
  # ./common-components.yml. Entity, input, and value-object schemas live in
  # ./credential-design-components.yml and are re-exported below so operations
  # can reference them with spec-internal `#/components/schemas/...` refs.

  securitySchemes:
    bearer:
      $ref: './common-components.yml#/components/securitySchemes/bearer'

  parameters:
    FilterEntityType:
      name: entityType
      in: query
      description: Restrict to designs of this entity type.
      schema:
        $ref: './credential-design-components.yml#/components/schemas/DesignEntityType'
    FilterHostingMode:
      name: hostingMode
      in: query
      description: Restrict to designs with this hosting mode.
      schema:
        $ref: './credential-design-components.yml#/components/schemas/DesignHostingMode'
    FilterBindingKey:
      name: bindingKey
      in: query
      description: Restrict to designs whose binding sets this dimension (pair with `bindingValue`).
      schema:
        $ref: './credential-design-components.yml#/components/schemas/DesignBindingKey'
    FilterBindingValue:
      name: bindingValue
      in: query
      description: The value the `bindingKey` dimension must equal.
      schema:
        type: string
    FilterAliasContains:
      name: aliasContains
      in: query
      description: Restrict to designs whose alias contains this substring.
      schema:
        type: string
    FilterSourceType:
      name: sourceType
      in: query
      description: Restrict to designs that have a layer from this source type.
      schema:
        $ref: './credential-design-components.yml#/components/schemas/DesignSourceType'

  examples:
    CreateIdentityCredentialDesignRequest:
      summary: Create an SD-JWT VC identity credential design
      value:
        credentialType:
          format: SD_JWT_VC
          vct: https://issuer.example.com/identity
        bindings:
          - vct: https://issuer.example.com/identity
            credentialConfigurationId: IdentityCredential
        alias: identity-credential
        hostingMode: LOCAL
        displays:
          - locale: en
            name: Identity Credential
            description: Government-issued digital identity
          - locale: nl
            name: Identiteitsbewijs
        claims:
          - path:
              - { type: property, name: given_name }
            labels:
              - { locale: en, label: First name }
              - { locale: nl, label: Voornaam }
            mandatory: true
            order: 1
            valueKind: STRING
            widgetHint: TEXT
    CreateVcdm11EmployeeCredentialDesignRequest:
      summary: Create a W3C VCDM 1.1 credential design
      description: >-
        W3C VCDM 1.1 uses W3C_VC with the VCDM 1.1 context. Pair its OID4VCI
        configuration with jwt_vc_json and a bitstring_status_list status list.
      value:
        credentialType:
          format: W3C_VC
          type: EmployeeCredential
          '@context': https://www.w3.org/2018/credentials/v1
        bindings:
          - type: EmployeeCredential
            '@context': https://www.w3.org/2018/credentials/v1
            credentialConfigurationId: EmployeeCredentialV11
        alias: employee-vcdm-11
        hostingMode: LOCAL
        displays:
          - locale: en
            name: Employee Credential (VCDM 1.1)
            description: Employee credential using the VCDM 1.1 context
        claims:
          - path:
              - { type: property, name: employeeId }
            labels:
              - { locale: en, label: Employee identifier }
            mandatory: true
            order: 1
            valueKind: STRING
    CreateVcdm20EmployeeCredentialDesignRequest:
      summary: Create a W3C VCDM 2.0 credential design
      description: >-
        W3C VCDM 2.0 uses W3C_VC with the VCDM 2.0 context. Pair its OID4VCI
        configuration with jwt_vc_json-ld and a bitstring_status_list status list.
      value:
        credentialType:
          format: W3C_VC
          type: EmployeeCredential
          '@context': https://www.w3.org/ns/credentials/v2
        bindings:
          - type: EmployeeCredential
            '@context': https://www.w3.org/ns/credentials/v2
            credentialConfigurationId: EmployeeCredentialV20
        alias: employee-vcdm-20
        hostingMode: LOCAL
        displays:
          - locale: en
            name: Employee Credential (VCDM 2.0)
            description: Employee credential using the VCDM 2.0 context
        claims:
          - path:
              - { type: property, name: employeeId }
            labels:
              - { locale: en, label: Employee identifier }
            mandatory: true
            order: 1
            valueKind: STRING
    IdentityCredentialDesignRecord:
      summary: Stored SD-JWT VC identity credential design
      value:
        id: 9a4f6b2e-3c1d-4e8a-9f7b-2c1d4e8a9f7b
        tenantId: 6b1f0c2a-7d3e-4a9b-8c5d-1e2f3a4b5c6d
        alias: identity-credential
        hostingMode: LOCAL
        credentialType:
          format: SD_JWT_VC
          vct: https://issuer.example.com/identity
        bindings:
          - vct: https://issuer.example.com/identity
            credentialConfigurationId: IdentityCredential
        displays:
          - locale: en
            name: Identity Credential
            description: Government-issued digital identity
          - locale: nl
            name: Identiteitsbewijs
        claims:
          - path:
              - { type: property, name: given_name }
            labels:
              - { locale: en, label: First name }
              - { locale: nl, label: Voornaam }
            mandatory: true
            order: 1
            valueKind: STRING
            widgetHint: TEXT
        renderVariantIds:
          - 4f5e6d7c-8b9a-0f1e-2d3c-4b5a6978abcd
        contentHash: sha256-8f3a1c2b9d4e5f60718293a4b5c6d7e8f90a1b2c3d4e5f60718293a4b5c6d7e8
        createdAt: '2026-06-08T10:15:00Z'
        updatedAt: '2026-06-08T10:15:00Z'

  schemas:
    # ---- Re-exported entity / value schemas ---------------------------------
    DesignBinding:
      $ref: './credential-design-components.yml#/components/schemas/DesignBinding'
    CredentialTypeFormat:
      $ref: './credential-design-components.yml#/components/schemas/CredentialTypeFormat'
    CredentialTypeDescriptor:
      $ref: './credential-design-components.yml#/components/schemas/CredentialTypeDescriptor'
    VctHostingMode:
      $ref: './credential-design-components.yml#/components/schemas/VctHostingMode'
    DesignAssetType:
      $ref: './credential-design-components.yml#/components/schemas/DesignAssetType'
    CredentialDesignRecord:
      $ref: './credential-design-components.yml#/components/schemas/CredentialDesignRecord'
    IssuerDesignRecord:
      $ref: './credential-design-components.yml#/components/schemas/IssuerDesignRecord'
    VerifierDesignRecord:
      $ref: './credential-design-components.yml#/components/schemas/VerifierDesignRecord'
    RenderVariantRecord:
      $ref: './credential-design-components.yml#/components/schemas/RenderVariantRecord'
    SourceSnapshotRecord:
      $ref: './credential-design-components.yml#/components/schemas/SourceSnapshotRecord'
    ResolvedCredentialDesign:
      $ref: './credential-design-components.yml#/components/schemas/ResolvedCredentialDesign'
    ResolvedIssuerDesign:
      $ref: './credential-design-components.yml#/components/schemas/ResolvedIssuerDesign'
    ResolvedVerifierDesign:
      $ref: './credential-design-components.yml#/components/schemas/ResolvedVerifierDesign'
    AssetReference:
      $ref: './credential-design-components.yml#/components/schemas/AssetReference'
    AssetInfo:
      $ref: './credential-design-components.yml#/components/schemas/AssetInfo'
    DesignVersion:
      $ref: './credential-design-components.yml#/components/schemas/DesignVersion'


    # ---- Re-exported request bodies -----------------------------------------
    CreateCredentialDesignInput:
      $ref: './credential-design-components.yml#/components/schemas/CreateCredentialDesignInput'
    UpdateCredentialDesignInput:
