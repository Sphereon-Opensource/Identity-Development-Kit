openapi: 3.0.4
info:
  title: Credential Design API
  version: 0.1.0
  x-products: [edk, vdx]
  description: |
    Author and resolve the design of a credential: its bindings, localized displays, claim
    presentation, branding, and the issuer and verifier that stand behind it. A design is the
    tenant-owned definition a wallet and an issuance or verification flow render from. This API
    is the registry for those definitions and the resolver that merges a design with everything
    that contributes to it.

    The API covers four resource families under one base path:

      - Credential designs: the display name, description, claim labels, ordering, selective
        disclosure policy, and render variants for a credential, matched to the credential by its
        bindings (`vct`, `credentialConfigurationId`, `docType`, and so on).
      - Issuer and verifier designs: how the issuing or verifying party presents itself, matched
        by issuer or verifier identity bindings. A credential design links the issuer design it is
        issued under.
      - Render variants: a reusable rendering technique (a simple card, an SVG template, a W3C
        renderMethod, a PDF template, or an external reference) that one or more designs point at.
      - Source snapshots: the raw payload captured when a design is imported from an external
        source, retained so the design can be refreshed and audited.

    ## Local designs and imported designs

    A design's `hostingMode` records where its authoritative content lives. A `LOCAL` design is
    authored here and owned by the tenant. A `CACHED_EXTERNAL` design is imported from a URL: the
    import endpoint fetches the source through an SSRF-protected fetcher, stores a source snapshot,
    runs the mapper for the declared `sourceType` (an OID4VCI credential configuration, SD-JWT VC
    type metadata, an OCA bundle, a W3C renderMethod, and the other families in [DesignSourceType]),
    and persists the canonical design. Refreshing re-fetches the source, using the snapshot's ETag
    for a conditional request.

    ## Resolution

    Reading a design returns exactly what was stored. Resolving a design returns the merged result:
    the design combined with its issuer and verifier designs, the matching render variants, derived
    render hints, and the ordered list of source layers that were applied. Resolution reports which
    fields an authoritative layer locked, and returns an ETag for caching. Select the design to
    resolve by `designId`, by a full binding object, or by a single `bindingKey` plus
    `bindingValue`; you can also pass external material inline through `externalMetadata` to fold a
    bundle into the result without importing it first.

    The list and find endpoints return a plain JSON array rather than a paginated page, because a
    tenant's design catalog is small and bounded.
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0

servers:
  - url: https://api.example.com/api/credential-design/v1
    description: Production server.
  - url: http://localhost:8080/api/credential-design/v1
    description: Local development server.

security:
  - bearer: []

tags:
  - name: CredentialDesigns
    description: >-
      Author, list, find, import, refresh, and resolve credential designs: the display, claim
      presentation, and branding a credential renders from.
  - name: IssuerDesigns
    description: >-
      Author, list, find, import, refresh, and resolve issuer designs: how an issuing party
      presents itself. A credential design links the issuer design it is issued under.
  - name: VerifierDesigns
    description: >-
      Author, list, find, import, refresh, and resolve verifier designs: how a verifying party
      presents itself.
  - name: RenderVariants
    description: >-
      Reusable rendering techniques (simple card, SVG template, W3C renderMethod, PDF template,
      external reference) that designs reference for their visual output.
  - name: DesignSnapshots
    description: >-
      The raw payloads captured when designs are imported from external sources, retained for
      refresh and audit.
  - name: DesignAssets
    description: >-
      Binary branding assets (logo, background image, SVG template, PDF template) attached to a
      credential design, stored and served as raw bytes.

paths:

  # ---- Credential designs ---------------------------------------------------

  /designs/credentials:
    post:
      tags: [CredentialDesigns]
      summary: Create a credential design
      operationId: createCredentialDesign
      description: Creates a credential design in the caller's tenant. Fails with `409` if a binding already maps to a design.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCredentialDesignInput'
            examples:
              createIdentityCredentialDesign:
                $ref: '#/components/examples/CreateIdentityCredentialDesignRequest'
              createVcdm11EmployeeCredentialDesign:
                $ref: '#/components/examples/CreateVcdm11EmployeeCredentialDesignRequest'
              createVcdm20EmployeeCredentialDesign:
                $ref: '#/components/examples/CreateVcdm20EmployeeCredentialDesignRequest'
      responses:
        '201':
          description: The created credential design.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialDesignRecord'
              examples:
                identityCredentialDesign:
                  $ref: '#/components/examples/IdentityCredentialDesignRecord'
        '400':
          $ref: './common-components.yml#/components/responses/ValidationError'
        '401':
          $ref: './common-components.yml#/components/responses/Unauthorized'
        '409':
          $ref: './common-components.yml#/components/responses/Conflict'
        '500':
          $ref: './common-components.yml#/components/responses/Error'
    get:
      tags: [CredentialDesigns]
      summary: List credential designs
      operationId: listCredentialDesigns
      description: Returns every credential design in the caller's tenant that matches the optional filters, as a plain array.
      parameters:
        - $ref: '#/components/parameters/FilterEntityType'
        - $ref: '#/components/parameters/FilterHostingMode'
        - $ref: '#/components/parameters/FilterBindingKey'
        - $ref: '#/components/parameters/FilterBindingValue'
        - $ref: '#/components/parameters/FilterAliasContains'
        - $ref: '#/components/parameters/FilterSourceType'
      responses:
        '200':
          description: The matching credential designs.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CredentialDesignRecord'
        '401':
          $ref: './common-components.yml#/components/responses/Unauthorized'
        '500':
          $ref: './common-components.yml#/components/responses/Error'

  /designs/credentials/find/binding:
    post:
      tags: [CredentialDesigns]
      summary: Find credential designs by binding
      operationId: findCredentialDesignsByBinding
      description: Returns the credential designs whose bindings match the supplied binding object across every set dimension.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DesignBinding'
      responses:
        '200':
          description: The matching credential designs.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CredentialDesignRecord'
        '400':
          $ref: './common-components.yml#/components/responses/ValidationError'
        '401':
          $ref: './common-components.yml#/components/responses/Unauthorized'
        '500':
          $ref: './common-components.yml#/components/responses/Error'

  /designs/credentials/bindings/{bindingKey}/{bindingValue}:
    parameters:
      - $ref: './credential-design-components.yml#/components/parameters/BindingKey'
      - $ref: './credential-design-components.yml#/components/parameters/BindingValue'
    get:
      tags: [CredentialDesigns]
      summary: Find credential designs by binding key
      operationId: findCredentialDesignsByBindingKey
      description: Returns the credential designs whose binding has the given value for a single binding dimension.
      responses:
        '200':
          description: The matching credential designs.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CredentialDesignRecord'
        '401':
          $ref: './common-components.yml#/components/responses/Unauthorized'
        '500':
          $ref: './common-components.yml#/components/responses/Error'

  /designs/credentials/import:
    post:
      tags: [CredentialDesigns]
      summary: Import a credential design
      operationId: importCredentialDesign
      description: >-
        Fetches an external credential design from `sourceUrl`, snapshots the response, maps it for
        the declared `sourceType`, and persists the canonical design with `hostingMode` set to
        `CACHED_EXTERNAL`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportExternalDesignInput'
      responses:
        '201':
          description: The imported credential design.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialDesignRecord'
        '400':
          $ref: './common-components.yml#/components/responses/ValidationError'
        '401':
          $ref: './common-components.yml#/components/responses/Unauthorized'
        '500':
          $ref: './common-components.yml#/components/responses/Error'

  /designs/credentials/resolve:
    post:
      tags: [CredentialDesigns]
      summary: Resolve a credential design
      operationId: resolveCredentialDesign
      description: >-
        Resolves a credential design selected by `designId`, a full `binding`, or a
        `bindingKey` + `bindingValue` pair, returning the merged design with its issuer and verifier
        designs, render variants, derived hints, applied layers, locked fields, and an ETag.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResolveCredentialDesignInput'
      responses:
        '200':
          description: The resolved credential design.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResolvedCredentialDesign'
        '400':
          $ref: './common-components.yml#/components/responses/ValidationError'
        '401':
          $ref: './common-components.yml#/components/responses/Unauthorized'
        '404':
          $ref: './common-components.yml#/components/responses/NotFound'
        '500':
          $ref: './common-components.yml#/components/responses/Error'

  /designs/credentials/{designId}:
    parameters:
      - $ref: './credential-design-components.yml#/components/parameters/DesignId'
    get:
      tags: [CredentialDesigns]
      summary: Get a credential design
      operationId: getCredentialDesign
      description: Returns one credential design by id.
      responses:
        '200':
          description: The credential design.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialDesignRecord'
        '401':
          $ref: './common-components.yml#/components/responses/Unauthorized'
        '404':
          $ref: './common-components.yml#/components/responses/NotFound'
        '500':
          $ref: './common-components.yml#/components/responses/Error'
    put:
      tags: [CredentialDesigns]
      summary: Update a credential design
      operationId: updateCredentialDesign
      description: Updates a credential design. Omitted fields are left unchanged.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCredentialDesignInput'
      responses:
        '200':
          description: The updated credential design.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialDesignRecord'
        '400':
          $ref: './common-components.yml#/components/responses/ValidationError'
        '401':
          $ref: './common-components.yml#/components/responses/Unauthorized'
        '404':
          $ref: './common-components.yml#/components/responses/NotFound'
        '500':
          $ref: './common-components.yml#/components/responses/Error'
    delete:
      tags: [CredentialDesigns]
      summary: Delete a credential design
      operationId: deleteCredentialDesign
      description: Deletes a credential design and returns no response body when successful.
      responses:
        '204':
          description: The credential design was deleted.
        '401':
          $ref: './common-components.yml#/components/responses/Unauthorized'
        '404':
          $ref: './common-components.yml#/components/responses/NotFound'
        '500':
          $ref: './common-components.yml#/components/responses/Error'

  /designs/credentials/{designId}/refresh:
    parameters:
      - $ref: './credential-design-components.yml#/components/parameters/DesignId'
    post:
      tags: [CredentialDesigns]
      summary: Refresh an imported credential design
      operationId: refreshCredentialDesign
      description: Re-fetches an imported credential design from its source and re-applies the mapper, returning the updated design.
      responses:
        '200':
          description: The refreshed credential design.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialDesignRecord'
        '400':
          $ref: './common-components.yml#/components/responses/ValidationError'
        '401':
          $ref: './common-components.yml#/components/responses/Unauthorized'
        '404':
          $ref: './common-components.yml#/components/responses/NotFound'
        '500':
          $ref: './common-components.yml#/components/responses/Error'

  /designs/credentials/{designId}/versions:
    parameters:
      - $ref: './credential-design-components.yml#/components/parameters/DesignId'
    get:
      tags: [CredentialDesigns]
      summary: List credential design versions
      operationId: listCredentialDesignVersions
      description: Lists immutable snapshots for a credential design.
      responses:
        '200':
          description: Design versions.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DesignVersion'
        '401':
          $ref: './common-components.yml#/components/responses/Unauthorized'
        '404':
          $ref: './common-components.yml#/components/responses/NotFound'
        '500':
          $ref: './common-components.yml#/components/responses/Error'

  /designs/credentials/{designId}/versions/{version}:
    parameters:
      - $ref: './credential-design-components.yml#/components/parameters/DesignId'
      - name: version
        in: path
        required: true
        schema:
          type: integer
    get:
      tags: [CredentialDesigns]
      summary: Get credential design version content
      operationId: getCredentialDesignVersion
      description: Returns the immutable credential design content stored for the requested version.
      responses:
        '200':
          description: Versioned design content.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialDesignRecord'
        '401':
          $ref: './common-components.yml#/components/responses/Unauthorized'
        '404':
          $ref: './common-components.yml#/components/responses/NotFound'
        '500':
          $ref: './common-components.yml#/components/responses/Error'

  /designs/credentials/{designId}/versions/{version}/restore:
    parameters:
      - $ref: './credential-design-components.yml#/components/parameters/DesignId'
      - name: version
        in: path
        required: true
        schema:
          type: integer
    post:
      tags: [CredentialDesigns]
      summary: Restore credential design version
      operationId: restoreCredentialDesignVersion
      description: Restores the selected immutable version by copying its content into the credential design and appending a new current version.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RestoreDesignVersionInput'
      responses:
        '200':
          description: Restored credential design.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialDesignRecord'
        '400':
          $ref: './common-components.yml#/components/responses/ValidationError'
        '401':
          $ref: './common-components.yml#/components/responses/Unauthorized'
        '404':
          $ref: './common-components.yml#/components/responses/NotFound'
        '500':
          $ref: './common-components.yml#/components/responses/Error'

  # ---- Issuer designs -------------------------------------------------------

  /designs/issuers:
    post:
      tags: [IssuerDesigns]
      summary: Create an issuer design
      operationId: createIssuerDesign
      description: Creates an issuer design in the caller's tenant.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateIssuerDesignInput'
      responses:
        '201':
          description: The created issuer design.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssuerDesignRecord'
        '400':
          $ref: './common-components.yml#/components/responses/ValidationError'
        '401':
          $ref: './common-components.yml#/components/responses/Unauthorized'
        '409':
          $ref: './common-components.yml#/components/responses/Conflict'
        '500':
          $ref: './common-components.yml#/components/responses/Error'
    get:
      tags: [IssuerDesigns]
      summary: List issuer designs
      operationId: listIssuerDesigns
      description: Returns the issuer designs in the caller's tenant matching the optional filters.
      parameters:
        - $ref: '#/components/parameters/FilterHostingMode'
        - $ref: '#/components/parameters/FilterBindingKey'
        - $ref: '#/components/parameters/FilterBindingValue'
        - $ref: '#/components/parameters/FilterAliasContains'
        - $ref: '#/components/parameters/FilterSourceType'
      responses:
        '200':
          description: The matching issuer designs.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/IssuerDesignRecord'
        '401':
          $ref: './common-components.yml#/components/responses/Unauthorized'
        '500':
          $ref: './common-components.yml#/components/responses/Error'

  /designs/issuers/find/binding:
    post:
      tags: [IssuerDesigns]
      summary: Find issuer designs by binding
      operationId: findIssuerDesignsByBinding
      description: Returns the issuer designs whose bindings match the supplied binding object.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DesignBinding'
      responses:
        '200':
          description: The matching issuer designs.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/IssuerDesignRecord'
        '400':
          $ref: './common-components.yml#/components/responses/ValidationError'
        '401':
          $ref: './common-components.yml#/components/responses/Unauthorized'
        '500':
          $ref: './common-components.yml#/components/responses/Error'

  /designs/issuers/bindings/{bindingKey}/{bindingValue}:
    parameters:
      - $ref: './credential-design-components.yml#/components/parameters/BindingKey'
      - $ref: './credential-design-components.yml#/components/parameters/BindingValue'
    get:
      tags: [IssuerDesigns]
      summary: Find issuer designs by binding key
      operationId: findIssuerDesignsByBindingKey
      description: Returns the issuer designs whose binding has the given value for a single binding dimension.
      responses:
        '200':
          description: The matching issuer designs.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/IssuerDesignRecord'
        '401':
          $ref: './common-components.yml#/components/responses/Unauthorized'
        '500':
          $ref: './common-components.yml#/components/responses/Error'

  /designs/issuers/import:
    post:
      tags: [IssuerDesigns]
      summary: Import an issuer design
      operationId: importIssuerDesign
      description: Fetches an external issuer design from `sourceUrl`, snapshots and maps it, and persists the canonical issuer design.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportExternalDesignInput'
      responses:
        '201':
          description: The imported issuer design.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssuerDesignRecord'
        '400':
          $ref: './common-components.yml#/components/responses/ValidationError'
        '401':
          $ref: './common-components.yml#/components/responses/Unauthorized'
        '500':
          $ref: './common-components.yml#/components/responses/Error'

  /designs/issuers/resolve:
    post:
      tags: [IssuerDesigns]
      summary: Resolve an issuer design
      operationId: resolveIssuerDesign
      description: Resolves an issuer design selected by id or binding, returning the merged design with its render variants, applied layers, and locked fields.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResolveEntityDesignInput'
      responses:
        '200':
          description: The resolved issuer design.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResolvedIssuerDesign'
        '400':
          $ref: './common-components.yml#/components/responses/ValidationError'
        '401':
          $ref: './common-components.yml#/components/responses/Unauthorized'
        '404':
          $ref: './common-components.yml#/components/responses/NotFound'
        '500':
          $ref: './common-components.yml#/components/responses/Error'

  /designs/issuers/{designId}:
    parameters:
      - $ref: './credential-design-components.yml#/components/parameters/DesignId'
    get:
      tags: [IssuerDesigns]
      summary: Get an issuer design
      operationId: getIssuerDesign
      description: Returns one issuer design by id.
      responses:
        '200':
          description: The issuer design.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssuerDesignRecord'
        '401':
          $ref: './common-components.yml#/components/responses/Unauthorized'
        '404':
          $ref: './common-components.yml#/components/responses/NotFound'
        '500':
          $ref: './common-components.yml#/components/responses/Error'
    put:
      tags: [IssuerDesigns]
      summary: Update an issuer design
      operationId: updateIssuerDesign
      description: Updates an issuer design. Omitted fields are left unchanged.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateIssuerDesignInput'
      responses:
        '200':
          description: The updated issuer design.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssuerDesignRecord'
        '400':
          $ref: './common-components.yml#/components/responses/ValidationError'
        '401':
          $ref: './common-components.yml#/components/responses/Unauthorized'
        '404':
          $ref: './common-components.yml#/components/responses/NotFound'
        '500':
          $ref: './common-components.yml#/components/responses/Error'
    delete:
      tags: [IssuerDesigns]
      summary: Delete an issuer design
      operationId: deleteIssuerDesign
      description: Deletes an issuer design and returns no response body when successful.
      responses:
        '204':
          description: The issuer design was deleted.
        '401':
          $ref: './common-components.yml#/components/responses/Unauthorized'
        '404':
          $ref: './common-components.yml#/components/responses/NotFound'
        '500':
          $ref: './common-components.yml#/components/responses/Error'

  /designs/issuers/{designId}/refresh:
    parameters:
      - $ref: './credential-design-components.yml#/components/parameters/DesignId'
    post:
      tags: [IssuerDesigns]
      summary: Refresh an imported issuer design
      operationId: refreshIssuerDesign
      description: Re-fetches an imported issuer design from its source and re-applies the mapper.
      responses:
        '200':
          description: The refreshed issuer design.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssuerDesignRecord'
        '400':
          $ref: './common-components.yml#/components/responses/ValidationError'
        '401':
          $ref: './common-components.yml#/components/responses/Unauthorized'
        '404':
          $ref: './common-components.yml#/components/responses/NotFound'
        '500':
          $ref: './common-components.yml#/components/responses/Error'

  # ---- Verifier designs -----------------------------------------------------

  /designs/verifiers:
    post:
      tags: [VerifierDesigns]
      summary: Create a verifier design
      operationId: createVerifierDesign
      description: Creates a verifier design in the caller's tenant.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateVerifierDesignInput'
      responses:
        '201':
          description: The created verifier design.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifierDesignRecord'
        '400':
          $ref: './common-components.yml#/components/responses/ValidationError'
        '401':
          $ref: './common-components.yml#/components/responses/Unauthorized'
        '409':
          $ref: './common-components.yml#/components/responses/Conflict'
        '500':
          $ref: './common-components.yml#/components/responses/Error'
    get:
      tags: [VerifierDesigns]
      summary: List verifier designs
      operationId: listVerifierDesigns
      description: Returns the verifier designs in the caller's tenant matching the optional filters.
      parameters:
        - $ref: '#/components/parameters/FilterHostingMode'
        - $ref: '#/components/parameters/FilterBindingKey'
        - $ref: '#/components/parameters/FilterBindingValue'
        - $ref: '#/components/parameters/FilterAliasContains'
        - $ref: '#/components/parameters/FilterSourceType'
      responses:
        '200':
          description: The matching verifier designs.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/VerifierDesignRecord'
        '401':
          $ref: './common-components.yml#/components/responses/Unauthorized'
        '500':
          $ref: './common-components.yml#/components/responses/Error'

  /designs/verifiers/find/binding:
    post:
      tags: [VerifierDesigns]
      summary: Find verifier designs by binding
      operationId: findVerifierDesignsByBinding
      description: Returns the verifier designs whose bindings match the supplied binding object.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DesignBinding'
      responses:
        '200':
          description: The matching verifier designs.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/VerifierDesignRecord'
        '400':
          $ref: './common-components.yml#/components/responses/ValidationError'
        '401':
          $ref: './common-components.yml#/components/responses/Unauthorized'
        '500':
          $ref: './common-components.yml#/components/responses/Error'

  /designs/verifiers/bindings/{bindingKey}/{bindingValue}:
    parameters:
      - $ref: './credential-design-components.yml#/components/parameters/BindingKey'
      - $ref: './credential-design-components.yml#/components/parameters/BindingValue'
    get:
