            summary: Get a list of registrations.
            operationId: 93f215a0e4b136638edb5493f7b5e2d9
            parameters:
                - "$ref": "#/components/parameters/Page"
                - name: from
                  in: query
                  description: Fetch registrations with a scan time from the specified date
                      and time.
                  required: false
                  schema:
                      type: string
                      format: date-time
                      example: '2024-09-23T00:00:00'
                - name: until
                  in: query
                  description: Fetch registrations with a scan time until the specified date
                      and time.
                  required: false
                  schema:
                      type: string
                      format: date-time
                - name: filter
                  in: query
                  description: Filter by serialnumber, external reference, reader or person.
                  required: false
                  schema:
                      type: string
                - name: includes
                  in: query
                  description: Include additional collections of resources.
                  required: false
                  schema:
                      type: string
                      example: readers,identifications,persons
            responses:
