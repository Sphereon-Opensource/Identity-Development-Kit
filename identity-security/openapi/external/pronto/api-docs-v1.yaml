    "/zone/{Id}/open-or-close-dom-locks":
        post:
            tags:
                - Zone
            summary: Open or close all DOM locks in a zone.
            description: Ensure that each lock is configured to allow opening.
            operationId: 89abf634f13ea080d2637d774db6ea29
            parameters:
                - name: Id
                  in: path
                  description: The identifier in the client's system.
                  required: true
                  schema:
                      type: string
                      default: zone_1_dom_locks
                      maxLength: 100
            requestBody:
                description: Send only the fields that you want to change.
                required: true
                content:
                    application/json:
                        schema:
                            properties:
                                OpenOrClose:
                                    type: string
                                    default: Close
                                    enum:
                                        - Open
                                        - Close
                            type: object
            responses:
                '200':
                    description: Command to open or close locks received.
                '401':
                    description: Unauthorized.
                '403':
                    description: Forbidden.
                '404':
                    description: Not found.
                '422':
                    description: Unprocessable entity.
            security:
                - bearerAuth: []
    "/booking-experts/auth/token":
        get:
            tags:
                - Authentication
            summary: Request to fetch an Oauth2 token for Booking Experts.
            operationId: d540c131a775cd9a69b375ac50526e75
            parameters:
                - name: code
                  in: query
                  description: An authorization code, generated by Booking Experts.
                  required: true
                  schema:
                      type: string
                      example: P66tmn20oiwyJRoHsN1iyNOzy37vKpRg8pEapG7s_ps
            responses:
                '200':
                    description: Request received to fetch an Oauth2 token for Booking Experts.
                '422':
                    description: Unprocessable entity.
    "/roles/{name}/permission":
        delete:
            tags:
                - Role
            summary: Revoke permission from a given role in the Pronto 3 web application.
            operationId: f24ef516998f449f72de2ecf16354e42
            parameters:
                - name: name
                  in: path
                  description: The name of the role to revoke permission from.
                  required: true
                  schema:
                      type: string
                      example: Customer application manager
            requestBody:
                description: Exactly one permission name must be provided in the payload.
                required: true
                content:
                    application/json:
                        schema:
                            required:
                                - permission_name
                            properties:
                                permission_name:
                                    "$ref": "#/components/schemas/Permission/properties/name"
                            type: object
            responses:
                '200':
                    description: Deleted.
                '401':
                    description: Unauthorized.
                '403':
                    description: Forbidden.
                '404':
                    description: Not found.
            security:
                - bearerAuth: []
components:
    schemas:
        ExternalReference:
            description: The identifier in the client's system.
            type: string
            maxLength: 100
            example: '1'
        PaginatedResponse:
            title: PaginatedResponse
            properties:
                data:
                    description: The data field contains an array of resources, such as Persons,
                        Identifications, WebUsers, and more.
                    type: array
                    items: {}
                links:
                    properties:
                        first:
                            type: string
                            default: https://pronto.test/api/v1/<endpoint>?page=1
                        last:
                            type: string
                            default:
                        prev:
                            type: string
                            default:
                        next:
                            type: string
                            default: https://pronto.test/api/v1/<endpoint>?page=2
                    type: object
                meta:
                    properties:
                        current_page:
                            type: integer
                            default: '1'
                        from:
                            type: integer
                            default: '1'
                        path:
                            type: string
                            default: https://pronto.test/api/v1/<endpoint>
                        per_page:
                            type: integer
                            default: '1000'
                        to:
                            type: integer
                            default: '1000'
                    type: object
                includes:
                    description: The includes field contains an object of collections of resources
                        such as Readers, Identifications or Persons.
                    type: object
            type: object
        IdentificationRelation:
            title: IdentificationRelation
            required:
                - Id
            properties:
                Id:
                    description: The identifier in the client's system.
                    type: string
                    maxLength: 100
                    example: 8e37dea9
                FromTime:
                    type: string
                    format: date-time
                    default: "<current time>"
                    example: '2021-01-23T00:00:00'
                UntilTime:
                    type: string
                    format: date-time
                    default:
            type: object
        Identification:
            title: Identification
            required:
                - Id
                - SerialNumber
            properties:
                Id:
                    description: The identifier in the client's system.
                    type: string
                    maxLength: 100
                    example: 8e37dea9
                SerialNumber:
                    type: string
                    maxLength: 32
                    example: ABCDEF12345678
                Blocked:
                    type: boolean
                    default: false
                Type:
                    type: string
                    default: Mifare
                    enum:
                        - Mifare
                        - Barcode
                        - Pincode
                        - Mobile
                        - Smartphone
                EntryDate:
                    type: string
                    format: date
                    default: "<current date>"
                    example: '2021-01-23'
            type: object
        PermissionRelation:
            title: PermissionRelation
            description: Payload for giving a permission to a role. Handles different permission
                types (e.g. persons group, access zone, role, application-level).
            type: object
            oneOf:
                - title: Application-Level Permission
                  required:
                      - permission_name
                  properties:
                      permission_name:
                          "$ref": "#/components/schemas/Permission/properties/name"
                  type: object
                - title: Permission for an AccessZone
                  required:
                      - access_zone_id
                  properties:
                      access_zone_id:
                          description: The identifier in the client's system.
                          type: string
                          maxLength: 100
                          example: zone123
                  type: object
                - title: Permission for a PersonsGroup
                  required:
                      - persons_group_id
                  properties:
                      persons_group_id:
                          "$ref": "#/components/schemas/PersonsGroup/properties/Id"
                  type: object
                - title: Permission for a Role
                  required:
                      - role_name
                  properties:
                      role_name:
                          "$ref": "#/components/schemas/Role/properties/name"
                  type: object
        Permission:
            title: Permission
            description: A permission of the Pronto 3 web application.
            required:
                - name
            properties:
                name:
                    description: The identifier in the client's system.
                    type: string
                    maxLength: 191
                    example: api.create_person
                description:
                    description: A human-readable label describing the permission, used for
                        display purposes.
                    type: string
                    maxLength: 191
                    example: Create a person
            type: object
        Person:
            title: Person
            required:
                - Id
            properties:
                Id:
                    description: The identifier in the client's system.
                    type: string
                    default:
                    maxLength: 100
                    example: personnel123
                FirstName:
                    type: string
                    default:
                    maxLength: 40
                    example: John
                LastName:
                    type: string
                    default: "<empty value>"
                    maxLength: 40
                    example: Doe
                Infix:
                    type: string
                    default:
                    maxLength: 16
                Initials:
                    type: string
                    default:
                    maxLength: 16
                    example: JD
                PreferedFullname:
                    description: If empty or not provided, this field is automatically composed
                        as LastName, Infix FirstName (Id). If provided on creation, it will not
                        be composed automatically anymore.
                    type: string
                    default:
                    maxLength: 220
                    example: Doe, John (personnel123)
                AntiPassBack:
                    type: boolean
                    default: true
                Email:
                    type: string
                    format: email
                    default:
                    maxLength: 50
                    example: John.Doe@simac-access.com
                Phone:
                    type: string
                    default:
                    maxLength: 50
                    example: "+31 40 258 2110"
                Company:
                    type: string
                    default:
                    maxLength: 50
                    example: Simac Access Solutions
                FromTime:
                    type: string
                    format: date-time
                    default: "<current time>"
                    example: '2021-01-23T00:00:00'
                UntilTime:
                    type: string
                    format: date-time
                    default:
                PersonsGroups:
                    type: array
                    items:
                        "$ref": "#/components/schemas/PersonsGroupRelation"
                Identifications:
                    type: array
                    items:
                        "$ref": "#/components/schemas/IdentificationRelation"
            type: object
        PersonsGroupRelation:
            title: PersonsGroupRelation
            required:
                - Id
            properties:
                Id:
                    description: The identifier in the client's system.
                    type: string
                    maxLength: 100
                    example: Security
                FromTime:
                    type: string
                    format: date-time
                    default: "<current time>"
                    example: '2021-01-23T00:00:00'
                UntilTime:
                    type: string
                    format: date-time
                    default:
            type: object
        PersonsGroup:
            title: PersonsGroup
            required:
                - Id
            properties:
                Id:
                    description: The identifier in the client's system.
                    type: string
                    maxLength: 100
                    example: group123
                ParentId:
                    type: string
                    default:
                    maxLength: 100
                Name:
                    type: string
                    default:
                    maxLength: 200
                    example: Security Building A
                Description:
                    type: string
                    default:
                    maxLength: 250
                ReadOnly:
                    type: boolean
                    default: true
                HideInAccessMatrix:
                    type: boolean
                    default: false
                FromTime:
                    type: string
                    format: date-time
                    default: "<current time>"
                    example: '2021-01-23T00:00:00'
                UntilTime:
                    type: string
                    format: date-time
                    default:
            type: object
        Reader:
            title: Reader
            required:
                - Id
                - Address
            properties:
                Id:
                    description: The identifier in Pronto.
                    type: integer
                    example: 1
                Address:
                    type: string
                    maxLength: 100
                    example: 76-1C-0A-FC-EF-35-RS485-1
                Description:
                    type: string
                    maxLength: 64
                    example: Simac Access Solutions front door
                ExternalReference:
                    description: The identifier in the client's system.
                    type: string
                    default:
                    maxLength: 100
                    example: reader_123
                UntilTime:
                    type: string
                    format: date-time
                    default:
            type: object
        Registration:
            title: Registration
            required:
                - SerialNumber
                - ReaderId
                - ScanType
                - RegistrationTime
            properties:
                SerialNumber:
                    type: string
                    maxLength: 32
                    example: ABCDEF12345678
                ReaderId:
                    type: integer
                    example: 1
                ScanType:
                    type: string
                    default: Unknown
                    enum:
                        - In
                        - Command
                        - Desk
                        - Information
                        - Unknown
                        - Blocked
                        - Antipassback
                        - Pending
                        - Invalid
                        - Authorisation
                        - Credit
                        - WriteAck
                        - WriteFail
                        - AccessRestricted
                        - HoldPositionStart
                        - HoldPositionEnd
                        - OfficeModeStart
                        - OfficeModeEnd
                RegistrationTime:
                    type: string
                    format: date-time
                    example: '2024-09-23T00:00:00'
                LastUpdate:
                    type: string
                    format: date-time
                    default: "<current time>"
                    example: '2024-09-23T00:00:00'
            type: object
        RoleMeta:
            title: RoleMeta
            description: Additional data of the Role schema which will only be returned
                when getting roles and `includes` is not empty.
            properties:
                permissionNames:
                    description: A list of related permission names which will only be included
                        if the `includes` parameter contains 'permissions'. The values can be
                        used to lookup permissions in the top-level `includes` list.
                    type: array
                    items:
                        "$ref": "#/components/schemas/Permission/properties/name"
            type: object
        Role:
            title: Role
            description: A role of the Pronto 3 web application.
            required:
                - name
            properties:
                name:
                    description: The identifier in the client's system.
                    type: string
                    maxLength: 191
                    example: Customer application manager
                description:
                    description: Can be used to briefly explain the role's responsibilities
                        and purpose.
                    type: string
                    default: ''
                    maxLength: 191
                    example: Responsible for the overall management and operation of the application.
            type: object
        User:
            title: User
            description: A user of the Pronto 3 web application.
            required:
                - username
                - name
                - password
            properties:
                name:
                    type: string
                    maxLength: 191
                    example: John Doe
                email:
                    type: string
                    format: email
                    default:
                    maxLength: 191
                    example: John.Doe@simac-access.com
                username:
                    type: string
                    maxLength: 191
                    example: JohnDoe
                password:
                    type: string
                    maxLength: 191
                    example: 5aesxHqKw&c1#2hHFCZD
                enabled:
                    type: boolean
                    default: true
            type: object
        WebProfile:
            title: WebProfile
            description: A profile of the Pronto 2 web application. Each profile can have
                unique permissions. Users always have 1 profile.
            required:
                - Id
            properties:
                Id:
                    description: The identifier in the client's system.
                    type: string
                    default:
                    maxLength: 40
                    example: applicatiebeheerder
            type: object
        WebUser:
            title: WebUser
            description: A user of the Pronto 2 web application.
            required:
                - Id
                - WebProfileId
            properties:
                Id:
                    description: The identifier in the client's system.
                    type: string
                    default:
                    maxLength: 50
                    example: JohnDoe
                WebProfileId:
                    type: string
                    maxLength: 40
                    example: applicatiebeheerder
                Email:
                    type: string
                    format: email
                    default:
                    maxLength: 255
                    example: John.Doe@simac-access.com
                LastVisitDate:
                    description: This field is for information only. It can not be updated via
                        the API.
                    type: string
                    format: date-time
                    default: '1970-01-01T00:00:00'
                Blocked:
                    type: boolean
                    default: false
                FromTime:
                    type: string
                    format: date-time
                    default: "<current time>"
                    example: '2021-01-23T00:00:00'
                UntilTime:
                    type: string
                    format: date-time
                    default:
            type: object
    parameters:
        Page:
            name: page
            in: query
            description: The number that specifies which page of results to fetch.
            required: false
            schema:
                type: integer
                default: 1
    securitySchemes:
        bearerAuth:
            type: http
            name: bearerAuth
            in: header
            scheme: bearer
