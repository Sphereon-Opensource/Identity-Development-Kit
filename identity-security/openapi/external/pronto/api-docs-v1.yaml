            summary: Create an API token.
            operationId: 8a3495051a5e94fdf28afce208277d35
            requestBody:
                description: Send the credentials of the user for whom the API token should
                    be created.
                required: true
                content:
                    application/json:
                        schema:
                            properties:
                                username:
                                    type: string
                                    example: example
                                password:
                                    type: string
                                    example: s3cr3t_passw0rd
                            type: object
            responses:
                '200':
                    description: Created.
                    content:
                        application/json:
                            schema:
                                properties:
                                    token:
                                        type: string
                                        example: 1|u8GdQ1yk13BFs3LCARp6cbAbQJn7ZaogDQKvt85t
                                type: object
                '403':
                    description: Forbidden.
                '422':
                    description: Unprocessable entity.
