    "/roles/{name}/permissions/{type}":
        post:
            tags:
                - Role
            summary: Give a permission to a role.
            operationId: b4bff99ed596ff60b07c1293e5a2e052
            parameters:
                - name: name
                  in: path
                  description: The identifier in the client's system.
                  required: true
                  schema:
                      type: string
                      default: Customer application manager
                - name: type
                  in: path
                  description: The type of permission.
                  required: true
                  schema:
                      type: string
                      default: application-level
                      enum:
                          - application-level
                          - access-zone
                          - persons-group
                          - role
            requestBody:
                description: Exactly one permission type must be provided in the payload.
                    Only a single key-value pair is allowed, corresponding to the specific permission
                    type being granted.
                required: true
                content:
                    application/json:
                        schema:
                            "$ref": "#/components/schemas/PermissionRelation"
                        examples:
                            application-level:
                                summary: Application-Level Permission
                                value:
                                    permission_name: api.create_person
                            access-zone:
                                summary: Permission for an AccessZone
                                value:
                                    access_zone_id: zone123
                            persons-group:
                                summary: Permission for a PersonsGroup
                                value:
                                    persons_group_id: group123
                            role:
                                summary: Permission for a Role
                                value:
                                    role_name: Customer application manager
            responses:
                '200':
                    description: Created.
                '401':
                    description: Unauthorized.
                '403':
                    description: Forbidden.
                '404':
                    description: Not found.
                '409':
                    description: Conflict.
                '422':
                    description: Unprocessable entity.
            security:
                - bearerAuth: []
