    Nis2Classification:
      $ref: './semantic-model-authoring-components.yml#/components/schemas/Nis2Classification'
    MicaClassification:
      $ref: './semantic-model-authoring-components.yml#/components/schemas/MicaClassification'
    BusinessTermEntityType:
      $ref: './semantic-model-authoring-components.yml#/components/schemas/BusinessTermEntityType'
    AttributeValueType:
      $ref: './semantic-model-authoring-components.yml#/components/schemas/AttributeValueType'
    AttributeWidgetHint:
      $ref: './semantic-model-authoring-components.yml#/components/schemas/AttributeWidgetHint'
    AttributeCardinality:
      $ref: './semantic-model-authoring-components.yml#/components/schemas/AttributeCardinality'
    SdPolicy:
      $ref: './semantic-model-authoring-components.yml#/components/schemas/SdPolicy'
    DataClassification:
      $ref: './semantic-model-authoring-components.yml#/components/schemas/DataClassification'
    SpecialCategoryType:
      $ref: './semantic-model-authoring-components.yml#/components/schemas/SpecialCategoryType'
