    # Channel (L4) tier
    # ------------------------------------------------------------------------------------------

    ChannelType:
      $ref: './semantic-model-authoring-components.yml#/components/schemas/ChannelType'
    DataProductRef:
      $ref: './semantic-model-authoring-components.yml#/components/schemas/DataProductRef'
