    Oid4vciOfferConfig:
      $ref: './semantic-model-authoring-components.yml#/components/schemas/Oid4vciOfferConfig'
    Oid4vciSigning:
      $ref: './semantic-model-authoring-components.yml#/components/schemas/Oid4vciSigning'
    Oid4vciCredentialConfiguration:
      $ref: './semantic-model-authoring-components.yml#/components/schemas/Oid4vciCredentialConfiguration'
    ApiPayloadRole:
      $ref: './semantic-model-authoring-components.yml#/components/schemas/ApiPayloadRole'
    ApiNamingConvention:
      $ref: './semantic-model-authoring-components.yml#/components/schemas/ApiNamingConvention'
    ApiPathMapping:
      $ref: './semantic-model-authoring-components.yml#/components/schemas/ApiPathMapping'
    ChannelEnvelope:
      $ref: './semantic-model-authoring-components.yml#/components/schemas/ChannelEnvelope'
    ChannelEnvelopePageResponse:
      type: object
      description: Paged list of channel envelopes, matching the envelope emitted by `ResponseBuilder.paginated()`.
      required: [data, pagination]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ChannelEnvelope'
        pagination:
          $ref: './common-components.yml#/components/schemas/PageMeta'

    FormChannelPageResponse:
      type: object
      description: Paged list of form channels, matching the envelope emitted by `ResponseBuilder.paginated()`.
      required: [data, pagination]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/FormChannel'
        pagination:
          $ref: './common-components.yml#/components/schemas/PageMeta'

    DeleteChannelResult:
      type: object
      description: Outcome of a delete request.
      required: [deleted]
      properties:
        deleted:
          type: boolean
          description: True when a definition existed for the id and was removed; false when none existed.

    FormChannelInput:
      type: object
      description: |
        Body for creating or replacing a form channel. A form channel has two parts that work together,
        joined by field name:

          - `fieldMappings` is the binding. Each entry names a form field and gives the data-product
            selection (roleRef plus path) whose value that field captures.
          - `fields` is the rendering. Each entry configures how a named field is presented (widget,
            group, wizard step, input mask, validation message, placeholder).

        A `fields` entry's `fieldName` must match a `fieldMappings` entry, so the form knows both what
        a field captures and how to render it. `fieldMappings` holds no presentation and `fields` holds
        no data-product binding, with one exception: a field's `required` flag can tighten an optional data-product
        attribute (the binding validator rejects any attempt to loosen a mandatory one). The definition
        id (on update) arrives via the URL and is never in the body.
      required: [name, setRef]
      example:
        name: "Employee badge capture form"
        setRef:
          dataProductId: "1b2c3d4e-5f60-4a71-8b92-0c1d2e3f4a5b"
          dataProductVersion: 1
        fieldMappings:
          - fieldName: "givenName"
            set:
              roleRef: "employee"
              path: ["givenName"]
          - fieldName: "familyName"
            set:
              roleRef: "employee"
              path: ["familyName"]
        fields:
          - fieldName: "givenName"
            widget: TEXT
            required: true
            step: 1
          - fieldName: "familyName"
            widget: TEXT
            required: true
            step: 1
        stepLabels: ["Personal details"]
      properties:
        name:
          type: string
        setRef:
          $ref: '#/components/schemas/DataProductRef'
        fieldMappings:
          type: array
          description: |
            The binding. One entry per form field, mapping the field name to the data-product
            selection (roleRef plus path) it captures. Only selections present in the bound data product are
            allowed. Holds no presentation.
          default: []
          items:
            $ref: '#/components/schemas/ChannelFieldMapping'
        fields:
          type: array
          description: |
            The rendering. One entry per form field, configuring how the field named by its `fieldName`
            (which must match a `fieldMappings` entry) is presented. Holds no data-product binding apart from the
            `required` widening flag.
          default: []
          items:
            $ref: '#/components/schemas/FormFieldRender'
        stepLabels:
          type: array
          description: Optional ordered labels for the wizard steps referenced by a field's `step`.
          default: []
          items:
            type: string

    FormChannel:
      type: object
      description: A persisted FORM channel and its rendering and data-product binding contract.
      required: [id, tenantId, name, version, setRef, fieldMappings, fields, stepLabels, status]
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
        name:
          type: string
        version:
          type: integer
          format: int64
          minimum: 1
          description: Monotonic snapshot version, starting at 1.
        setRef:
          $ref: '#/components/schemas/DataProductRef'
        fieldMappings:
          type: array
          description: The data-product selection bound to each form field name.
          default: []
          items:
            $ref: '#/components/schemas/ChannelFieldMapping'
        fields:
          type: array
          description: The rendering configuration for each form field.
          default: []
          items:
            $ref: '#/components/schemas/FormFieldRender'
        stepLabels:
          type: array
          description: Optional ordered labels for the wizard steps referenced by a field's `step`.
          default: []
          items:
            type: string
        status:
          $ref: '#/components/schemas/ModelLifecycleStatus'

    PublishFormChannelInput:
      type: object
      description: Desired publication state for a FORM channel.
      required: [published]
      properties:
        published:
          type: boolean

    PdfDocumentChannelInput:
      type: object
      description: |
        Body for creating or replacing a PDF/document definition. The definition id (on update) arrives
        via the URL.
      required: [name, setRef, templateRef]
      example:
        name: "Employee badge PDF"
        setRef:
          dataProductId: "1b2c3d4e-5f60-4a71-8b92-0c1d2e3f4a5b"
          dataProductVersion: 1
        templateRef: "employee-badge-template"
        fieldMappings:
          - fieldName: "givenName"
            set:
              roleRef: "employee"
              path: ["givenName"]
        placements: []
        repeatedSections: []
      properties:
        name:
          type: string
        setRef:
          $ref: '#/components/schemas/DataProductRef'
        fieldMappings:
          type: array
          default: []
          items:
            $ref: '#/components/schemas/ChannelFieldMapping'
        templateRef:
          type: string
          description: A reference (id/name/URI) to the document template to fill.
        placements:
          type: array
          default: []
          items:
            $ref: '#/components/schemas/PdfPlacement'
        repeatedSections:
          type: array
          default: []
          items:
            $ref: '#/components/schemas/PdfRepeatedSection'
        locale:
          type: string
          nullable: true
          description: Optional BCP-47 locale tag for localized rendering.

    VerifiableCredentialChannelInput:
      type: object
      description: |
        Body for creating or replacing a verifiable-credential definition. The definition id (on update)
        arrives via the URL.
      required: [name, setRef, credentialFormat]
      example:
        name: "Employee badge credential"
        setRef:
          dataProductId: "1b2c3d4e-5f60-4a71-8b92-0c1d2e3f4a5b"
          dataProductVersion: 1
        credentialFormat: "dc+sd-jwt"
        vct: "employee-badge"
        vctHostingMode: HOSTED
        claimMappings: []
      properties:
        name:
          type: string
        setRef:
          $ref: '#/components/schemas/DataProductRef'
        fieldMappings:
          type: array
          description: |
            Channel-neutral field mappings; typically empty for a VC definition, which carries subject
            mapping via the richer `claimMappings`.
          default: []
          items:
            $ref: '#/components/schemas/ChannelFieldMapping'
        credentialFormat:
          $ref: './wallet-credential-components.yml#/components/schemas/CredentialFormat'
        vct:
          type: string
          nullable: true
          description: The IETF SD-JWT VC type identifier, when the format is `dc+sd-jwt`.
        vctHostingMode:
          type: string
          nullable: true
          description: |
            Optional hosting intent passed through to the credential design binding when a design
            is created from this channel. `HOSTED` lets the issuer derive and serve the VCT URI;
            `EXTERNAL` means the `vct` is hosted elsewhere; `NONE` leaves it as a plain value.
          enum: [HOSTED, EXTERNAL, NONE]
        doctype:
          type: string
          nullable: true
          description: The mdoc doctype, when the format is `mso_mdoc`.
        namespace:
          type: string
          nullable: true
          description: |
            The channel-level mdoc namespace applied to every claim element when the format is
            `mso_mdoc`, unless a `VcClaimMapping.namespace` overrides it. Distinct from `doctype`; an
            opaque identifier that MAY carry dots. The converter combines it with each claim's element.
        jsonLdContexts:
          type: array
          description: The JSON-LD `@context` URIs, when the format is a JSON-LD VC.
          default: []
          items:
            type: string
        claimMappings:
          type: array
          description: The credential-subject claim-to-data-product-selection mappings with disclosure modes.
          default: []
          items:
            $ref: '#/components/schemas/VcClaimMapping'
        brandingRef:
          type: object
          allOf:
            - $ref: '#/components/schemas/BrandingRef'
          nullable: true
          description: |
            Optional version-pinned reference to a credential-branding overlay. Wallet display derives
            from the bound data product's i18n overlays and this branding; the definition holds no card metadata.

    Oid4vciIssuanceChannelInput:
      type: object
      description: |
        Body for creating or replacing an OID4VCI issuance channel. An issuance channel composes one or
        more verifiable-credential channels via per-credential configurations rather than binding an
        data product directly, so it carries no setRef. The channel id (on update) arrives via the URL.
      required: [name, credentialConfigurations]
      example:
        name: "Employee badge issuance"
        credentialConfigurations:
          - credentialConfigurationId: "employee-badge"
            channelRef:
              channelId: "e7f80192-a3b4-4c5d-8e6f-7081a2b3c4d5"
              channelVersion: 1
            signing:
              algorithm: "ES256"
              keyBinding: "did:jwk"
            offer:
              grants: [PRE_AUTHORIZED_CODE]
              txCodeRequired: true
      properties:
        name:
          type: string
          description: The channel (bundle) name.
        credentialConfigurations:
          type: array
          minItems: 1
          description: |
            The per-credential configurations this issuance advertises; each self-contained
            (configuration id, VC channel ref, signing, offer) with a unique credentialConfigurationId.
            Must declare at least one.
          items:
            $ref: '#/components/schemas/Oid4vciCredentialConfiguration'

    ApiPayloadChannelInput:
      type: object
      description: |
        Body for creating or replacing an API-payload definition. The definition id (on update) arrives
        via the URL.
      required: [name, setRef, payloadName]
      example:
        name: "Employee payload"
        setRef:
          dataProductId: "1b2c3d4e-5f60-4a71-8b92-0c1d2e3f4a5b"
          dataProductVersion: 1
        payloadName: "employee"
        role: REQUEST
        namingConvention: CAMEL_CASE
        fieldMappings:
          - fieldName: "givenName"
            set:
              roleRef: "employee"
              path: ["givenName"]
        externalPathMappings: []
      properties:
        name:
          type: string
        setRef:
          $ref: '#/components/schemas/DataProductRef'
        fieldMappings:
          type: array
          default: []
          items:
            $ref: '#/components/schemas/ChannelFieldMapping'
        payloadName:
          type: string
          description: The payload's name; must be non-blank.
        role:
          allOf:
            - $ref: '#/components/schemas/ApiPayloadRole'
          default: REQUEST
        namingConvention:
          allOf:
            - $ref: '#/components/schemas/ApiNamingConvention'
          default: CAMEL_CASE
        externalPathMappings:
          type: array
          description: The bound-field to external-path placements.
          default: []
          items:
            $ref: '#/components/schemas/ApiPathMapping'

    # ------------------------------------------------------------------------------------------
    # Credential branding (L4 presentation overlay) schemas
    # ------------------------------------------------------------------------------------------

    BrandingLocale:
      $ref: './semantic-model-authoring-components.yml#/components/schemas/BrandingLocale'
    CredentialBranding:
