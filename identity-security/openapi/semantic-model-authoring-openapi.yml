openapi: 3.0.4
info:
  title: Semantic Model Authoring API
  version: 0.2.0
  # Whole API requires the `semantic-modeling.v1` license feature (enterprise). The build
  # derives a Scalar "Enterprise" badge on every operation from this default. Individual read-only
  # operations may opt out with `x-license-required: false`.
  x-license-required: semantic-modeling.v1
  description: |
    Author the layered model used to define business terms once and reuse them across credential
    issuance and verification. The model has four tiers. Each tier builds on the one above it and
    can only narrow it; no tier can loosen a constraint set by a higher one.

      - **Data domain (L1)**: the authoritative business-term definitions. A data domain holds object types
        (such as Person or Organization). Each object type is a tree of business terms, where every term
        carries a data type, validation rules, and governance overlays (data classification,
        processing purpose, retention, residency). A data domain also records relationship types between its
        object types, can map its terms onto external or internal schemas, and can generate a JSON
        Schema. A business term can also record authoritative grounding, a pinned legal-source snapshot,
        retrieval time, and the governed kind of its entry-code scheme.
      - **Object model (L2)**: a use case built on one or more published data domains. An object model
        binds named roles to data-domain object types, selects the relationships it needs, and tightens
        per-business-term constraints. It resolves into an effective object graph and a JSON Schema.
      - **Data product (L3)**: one published object model narrowed to the exact business terms a single
        issuance or verification scenario needs.
      - **Channel (L4)**: one data product rendered into a concrete output, such as a
        capture form, a PDF or other document, a verifiable credential, an OID4VCI issuance, or an
        API payload.
      - **Credential branding (L4)**: reusable presentation overlays (display name, logo, and colors
        per language) that a verifiable-credential channel applies for wallet display.

    The model is tenant-owned. Published data domains and object models can be reused by downstream
    credential, form, document, and API-payload definitions without copying their constraints.
servers:
  - url: http://localhost:8080/api/model/v1
    description: Local development.
security:
  - bearer: []
tags:
  - name: DataDomain
    description: Author, version, publish, and bind schemas for L1 data domains.
  - name: ObjectModel
    description: Author, curate, version, publish, resolve, and generate schemas for L2 object models.
  - name: DataProduct
    description: Author, narrow, version, publish, and resolve L3 data products.
  - name: Channel
    description: Channel-neutral L4 operations (list, fetch, and delete a channel of any type).
  - name: FormChannel
    description: Author L4 form channels that render one data product as a capture form.
  - name: PdfChannel
    description: Author L4 PDF/document channels that render one data product into a document template.
  - name: CredentialChannel
    description: Author L4 verifiable-credential channels that render one data product as a verifiable credential.
  - name: Oid4vciChannel
    description: Author L4 OID4VCI issuance channels that compose verifiable-credential channels for issuance.
  - name: ApiChannel
    description: Author L4 API-payload channels that render one data product as an API request or response payload.
  - name: CredentialBranding
    description: Author, version, and publish L4 credential-branding presentation overlays (logo, colors, per-language display name).
paths:
  /data-domains:
    post:
      tags: [DataDomain]
      summary: Create the stable data-domain identity and initial draft revision
      operationId: createDataDomain
      x-command-id: model.data-domain.create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDataDomainInput'
      responses:
        '201':
          description: Created identity with its initial draft revision.
          headers:
            Location:
              schema:
                type: string
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataDomainCreation'
        '400':
          description: Validation failure
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
    get:
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/SortDirection'
      tags: [DataDomain]
      summary: List data-domain identities and revision pointers
      operationId: listDataDomains
      x-command-id: model.data-domain.list
      responses:
        '200':
          description: Page of identities.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataDomainPageResponse'
        '401':
          description: Unauthorized

  /data-domains/{dataDomainId}:
    parameters:
      - $ref: '#/components/parameters/DataDomainId'
    get:
      tags: [DataDomain]
      summary: Get a data-domain identity and revision pointers
      operationId: getDataDomain
      x-command-id: model.data-domain.get
      responses:
        '200':
          description: Data-domain identity and pointers only.
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataDomain'
        '401':
          description: Unauthorized
        '404':
          description: Not found

  /data-domains/{dataDomainId}/revisions:
    parameters:
      - $ref: '#/components/parameters/DataDomainId'
    post:
      tags: [DataDomain]
      summary: Create a draft revision
      operationId: createDataDomainRevision
      x-command-id: model.data-domain.create-revision
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDataDomainRevisionInput'
      responses:
        '201':
          description: Draft revision created.
          headers:
            Location:
              schema:
                type: string
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataDomainRevision'
        '409':
          description: Conflict
        '412':
          description: Precondition failed
        '422':
          description: Semantic validation failure
    get:
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/SortDirection'
      tags: [DataDomain]
      summary: List revisions
      operationId: listDataDomainRevisions
      x-command-id: model.data-domain.list-revisions
      responses:
        '200':
          description: Revisions for the identity.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataDomainRevisionPageResponse'
        '404':
          description: Not found

  /data-domains/{dataDomainId}/revisions/{revision}:
    parameters:
      - $ref: '#/components/parameters/DataDomainId'
      - $ref: '#/components/parameters/DataDomainRevision'
    get:
      tags: [DataDomain]
      summary: Get an exact pinned revision
      operationId: getDataDomainRevision
      x-command-id: model.data-domain.get-revision
      responses:
        '200':
          description: Exact revision.
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataDomainRevision'
        '404':
          description: Not found
    put:
      tags: [DataDomain]
      summary: Replace draft revision content
      operationId: replaceDataDomainDraftRevision
      x-command-id: model.data-domain.replace-draft-revision
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDataDomainRevisionInput'
      responses:
        '200':
          description: Updated draft revision.
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataDomainRevision'
        '404':
          description: Not found
        '409':
          description: Conflict
        '412':
          description: Precondition failed
    delete:
      tags: [DataDomain]
      summary: Delete a draft revision
      operationId: deleteDataDomainDraftRevision
      x-command-id: model.data-domain.delete-draft-revision
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '204':
          description: Draft revision deleted.
        '404':
          description: Not found
        '409':
          description: Conflict
        '412':
          description: Precondition failed

  /data-domains/{dataDomainId}/revisions/{revision}/usages:
    parameters:
      - $ref: '#/components/parameters/DataDomainId'
      - $ref: '#/components/parameters/DataDomainRevision'
      - $ref: './common-components.yml#/components/parameters/Limit'
      - $ref: './common-components.yml#/components/parameters/Offset'
      - $ref: './common-components.yml#/components/parameters/Sort'
      - $ref: './common-components.yml#/components/parameters/SortDirection'
    get:
      tags: [DataDomain]
      summary: List usages for an exact data-domain revision
      operationId: listDataDomainRevisionUsages
      x-command-id: model.data-domain.list-revision-usages
      responses:
        '200':
          description: Persisted semantic-attribute usage rows for this exact revision.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SemanticAttributeUsagePageResponse'
        '404':
          description: Not found

  /data-domains/{dataDomainId}/revisions/{revision}/composed:
    parameters:
      - $ref: '#/components/parameters/DataDomainId'
      - $ref: '#/components/parameters/DataDomainRevision'
    get:
      tags: [DataDomain]
      summary: Get the exact published revision content
      operationId: getDataDomainRevisionComposed
      x-command-id: model.data-domain.get-revision-composed
      responses:
        '200':
          description: Exact published revision content.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataDomainComposedRevision'
        '404':
          description: Not found or not published

  /data-domains/{dataDomainId}/revisions/{revision}/validation:
    parameters:
      - $ref: '#/components/parameters/DataDomainId'
      - $ref: '#/components/parameters/DataDomainRevision'
    get:
      tags: [DataDomain]
      summary: Validate the exact revision content
      operationId: getDataDomainRevisionValidation
      x-command-id: model.data-domain.get-revision-validation
      responses:
        '200':
          description: Validation result for the exact revision.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataDomainValidationResult'
        '404':
          description: Not found

  /data-domains/{dataDomainId}/revisions/{revision}/policy:
    parameters:
      - $ref: '#/components/parameters/DataDomainId'
      - $ref: '#/components/parameters/DataDomainRevision'
    get:
      tags: [DataDomain]
      summary: Project exact revision governance as an ODRL Offer
      operationId: getDataDomainGovernancePolicy
      x-command-id: semantic-governance.policy.data-domain
      responses:
        '200':
          description: Governance policy projection.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GovernanceOdrlResult'
        '404':
          description: Not found

  /data-domains/{dataDomainId}/revisions/{revision}/reviews:
    parameters:
      - $ref: '#/components/parameters/DataDomainId'
      - $ref: '#/components/parameters/DataDomainRevision'
    post:
      tags: [DataDomain]
      summary: Create a review for an exact draft revision
      operationId: createDataDomainReview
      x-command-id: model.data-domain.create-review
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '201':
          description: Review created and revision sealed.
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataDomainReview'
        '409':
          description: Conflict
        '412':
          description: Precondition failed
    get:
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/SortDirection'
      tags: [DataDomain]
      summary: List reviews for an exact revision
      operationId: listDataDomainReviews
      x-command-id: model.data-domain.list-reviews
      responses:
        '200':
          description: Reviews.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataDomainReviewList'

  /data-domains/{dataDomainId}/revisions/{revision}/reviews/{reviewId}:
    parameters:
      - $ref: '#/components/parameters/DataDomainId'
      - $ref: '#/components/parameters/DataDomainRevision'
      - $ref: '#/components/parameters/ReviewId'
    get:
      tags: [DataDomain]
      summary: Get a review
      operationId: getDataDomainReview
      x-command-id: model.data-domain.get-review
      responses:
        '200':
          description: Review with immutable decisions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataDomainReview'
        '404':
          $ref: './common-components.yml#/components/responses/NotFound'

  /data-domains/{dataDomainId}/revisions/{revision}/reviews/{reviewId}/decisions:
    parameters:
      - $ref: '#/components/parameters/DataDomainId'
      - $ref: '#/components/parameters/DataDomainRevision'
      - $ref: '#/components/parameters/ReviewId'
    post:
      tags: [DataDomain]
      summary: Record an immutable review decision
      operationId: createDataDomainReviewDecision
      x-command-id: model.data-domain.decide-review
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDataDomainReviewDecisionInput'
      responses:
        '201':
          description: Immutable review decision.
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataDomainReviewDecision'
        '409':
          description: Conflict
        '422':
          description: Rejected semantic decision. A REJECT verdict requires a non-blank reasonRef or comment.
    get:
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/SortDirection'
      tags: [DataDomain]
      summary: List immutable decisions for a review
      operationId: listDataDomainReviewDecisions
      x-command-id: model.data-domain.list-review-decisions
      responses:
        '200':
          description: Immutable review decisions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataDomainReviewDecisionList'

  /data-domains/{dataDomainId}/revisions/{revision}/reviews/{reviewId}/decisions/{decisionId}:
    parameters:
      - $ref: '#/components/parameters/DataDomainId'
      - $ref: '#/components/parameters/DataDomainRevision'
      - $ref: '#/components/parameters/ReviewId'
      - $ref: '#/components/parameters/DecisionId'
    get:
      tags: [DataDomain]
      summary: Get an immutable review decision
      operationId: getDataDomainReviewDecision
      x-command-id: model.data-domain.get-review-decision
      responses:
        '200':
          description: Immutable review decision.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataDomainReviewDecision'
        '404':
          $ref: './common-components.yml#/components/responses/NotFound'

  /data-domains/{dataDomainId}/publications:
    parameters:
      - $ref: '#/components/parameters/DataDomainId'
    post:
      tags: [DataDomain]
      summary: Create a publication for an approved revision
      operationId: createDataDomainPublication
      x-command-id: model.data-domain.publish
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDataDomainPublicationInput'
      responses:
        '201':
          description: Publication created.
          headers:
            Location:
              schema:
                type: string
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataDomainPublication'
        '409':
          description: Conflict
        '422':
          description: Semantic publication validation failure
        '412':
          description: Precondition failed
    get:
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/SortDirection'
      tags: [DataDomain]
      summary: List publications
      operationId: listDataDomainPublications
      x-command-id: model.data-domain.list-publications
      responses:
        '200':
          description: Publications.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataDomainPublicationList'

  /data-domains/{dataDomainId}/publications/{publicationId}:
    parameters:
      - $ref: '#/components/parameters/DataDomainId'
      - $ref: '#/components/parameters/PublicationId'
    get:
      tags: [DataDomain]
      summary: Get a publication
      operationId: getDataDomainPublication
      x-command-id: model.data-domain.get-publication
      responses:
        '200':
          description: Publication.
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataDomainPublication'

  /data-domains/{dataDomainId}/publications/{publicationId}/notices:
    parameters:
      - $ref: '#/components/parameters/DataDomainId'
      - $ref: '#/components/parameters/PublicationId'
    post:
      tags: [DataDomain]
      summary: Create a publication notice
      operationId: createDataDomainPublicationNotice
      x-command-id: model.data-domain.record-publication-notice
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDataDomainPublicationNoticeInput'
      responses:
        '201':
          description: Publication notice created.
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataDomainPublicationNotice'
        '409':
          description: Conflict
        '412':
          description: Precondition failed
    get:
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/SortDirection'
      tags: [DataDomain]
      summary: List publication notices
      operationId: listDataDomainPublicationNotices
      x-command-id: model.data-domain.list-publication-notices
      responses:
        '200':
          description: Notices.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataDomainPublicationNoticeList'

  /data-domains/{dataDomainId}/publications/{publicationId}/notices/{noticeId}:
    parameters:
      - $ref: '#/components/parameters/DataDomainId'
      - $ref: '#/components/parameters/PublicationId'
      - $ref: '#/components/parameters/NoticeId'
    get:
      tags: [DataDomain]
      summary: Get a publication notice
      operationId: getDataDomainPublicationNotice
      x-command-id: model.data-domain.get-publication-notice
      responses:
        '200':
          description: Publication notice.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataDomainPublicationNotice'
        '404':
          $ref: './common-components.yml#/components/responses/NotFound'

  /data-products:
    post:
      tags: [DataProduct]
      summary: Create a draft data product narrowing one published object model
      operationId: createDataProduct
      x-command-id: model.data-product.create-endpoint
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDataProductInput'
      responses:
        '201':
          description: Data product created (draft, version 1).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataProduct'
        '400':
          $ref: './common-components.yml#/components/responses/ValidationError'
        '401':
          $ref: './common-components.yml#/components/responses/Unauthorized'
        '403':
          $ref: './common-components.yml#/components/responses/Forbidden'
        '404':
          $ref: './common-components.yml#/components/responses/NotFound'
        '500':
          $ref: './common-components.yml#/components/responses/Error'
    get:
      tags: [DataProduct]
      summary: List data products for the calling tenant
      operationId: listDataProducts
      x-command-id: model.data-product.list-endpoint
      description: |
        Returns a page of data products matching the optional filter. Pagination accepts both
        `limit`/`offset` and OpenAPI-style `page`/`size`; the parser normalises and clamps `limit`
        to `[1, 100]` (default `20`). Sort is constrained to an allow-list (`name`, `createdAt`,
        `updatedAt`, `version`); the default is `createdAt DESC`.
      parameters:
        - name: nameContains
          in: query
          description: Case-insensitive substring match against the data product name.
          schema:
            type: string
        - name: status
          in: query
          description: Restrict to data products in this lifecycle status.
          schema:
            $ref: '#/components/schemas/ModelLifecycleStatus'
        - name: objectModelId
          in: query
          description: Restrict to data products that narrow this object model.
          schema:
            type: string
            format: uuid
        - $ref: './common-components.yml#/components/parameters/Limit'
        - $ref: './common-components.yml#/components/parameters/Offset'
        - $ref: './common-components.yml#/components/parameters/Page'
        - $ref: './common-components.yml#/components/parameters/Size'
        - $ref: './common-components.yml#/components/parameters/Sort'
        - $ref: './common-components.yml#/components/parameters/SortDirection'
      responses:
        '200':
          description: Page of data products.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataProductPageResponse'
        '400':
          $ref: './common-components.yml#/components/responses/ValidationError'
        '401':
          $ref: './common-components.yml#/components/responses/Unauthorized'
        '500':
          $ref: './common-components.yml#/components/responses/Error'

  /data-products/{dataProductId}:
    parameters:
      - $ref: '#/components/parameters/DataProductId'
    get:
      parameters:
        - name: version
          in: query
          required: false
          description: Exact retained version; omission reads the current head. Missing versions never fall back to newer content.
          schema:
            type: integer
            format: int64
            minimum: 1
      tags: [DataProduct]
      summary: Get an data product by id
      operationId: getDataProduct
      x-command-id: model.data-product.get-endpoint
      responses:
        '200':
          description: Data product.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataProduct'
        '401':
          $ref: './common-components.yml#/components/responses/Unauthorized'
        '404':
          $ref: './common-components.yml#/components/responses/NotFound'
        '500':
          $ref: './common-components.yml#/components/responses/Error'
    patch:
      tags: [DataProduct]
      summary: Update a draft data product's name, description, selection or overrides
      operationId: updateDataProduct
      x-command-id: model.data-product.update-endpoint
      description: |
        Partial update of a DRAFT data product. Each field is optional; a null (or absent) field leaves the
        corresponding value unchanged. The object model reference, lifecycle status and version are not
        editable here. Updating a PUBLISHED data product is a conflict.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDataProductInput'
      responses:
        '200':
          description: Updated data product.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataProduct'
        '400':
          $ref: './common-components.yml#/components/responses/ValidationError'
        '401':
          $ref: './common-components.yml#/components/responses/Unauthorized'
        '403':
          $ref: './common-components.yml#/components/responses/Forbidden'
        '404':
          $ref: './common-components.yml#/components/responses/NotFound'
        '409':
          $ref: './common-components.yml#/components/responses/Conflict'
        '500':
          $ref: './common-components.yml#/components/responses/Error'
    delete:
      tags: [DataProduct]
      summary: Delete an data product by id
      operationId: deleteDataProduct
      x-command-id: model.data-product.delete-endpoint
      responses:
        '200':
          description: Deletion outcome (whether a data product existed for the id).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteDataProductResult'
        '401':
          $ref: './common-components.yml#/components/responses/Unauthorized'
        '403':
          $ref: './common-components.yml#/components/responses/Forbidden'
        '500':
          $ref: './common-components.yml#/components/responses/Error'

  /data-products/{dataProductId}/selection:
    parameters:
      - $ref: '#/components/parameters/DataProductId'
    put:
      tags: [DataProduct]
      summary: Replace a draft data product's selection entries wholesale
      operationId: setDataProductSelection
      x-command-id: model.data-product.set-selection-endpoint
      description: |
        Replaces the data product's `selected` entries wholesale. Overrides are untouched; an override whose
        `(roleRef, path)` is no longer selected is rejected by validation. The data product must be in DRAFT.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetDataProductSelectionInput'
      responses:
        '200':
