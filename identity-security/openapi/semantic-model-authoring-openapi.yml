    parameters:
      - $ref: '#/components/parameters/ObjectModelId'
    post:
      tags: [ObjectModel]
      summary: Generate (and optionally register) an object model's use-case JSON Schema
      operationId: generateObjectModelSchema
      x-command-id: model.object.generate-schema-endpoint
      description: |
        Resolves the object model and projects its resolved nested attributes into a CONFORMANCE-BEARING
        JSON Schema: an attribute whose effective mandatory flag is set contributes to the enclosing
        object's `required` array, data-domain object boundaries nest, entry-code narrowing maps to `enum`,
        and a repeating attribute maps to an `array`. Only `JSON_SCHEMA` is supported now; any other
        `targetType` (including `JSON_LD_CONTEXT`) is reserved for a later phase and rejected with a
        400. When `register` is true the schema is also registered with the schema registry under the
        `object-models` namespace and the resulting registry id is returned; registration is the
        only license-gated path (pure generation is a read).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateObjectModelSchemaInput'
