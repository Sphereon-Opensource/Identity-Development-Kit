      description: Paged list of credential-branding records.
      required: [data, pagination]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/CredentialBranding'
        pagination:
          $ref: './common-components.yml#/components/schemas/PageMeta'

    CreateCredentialBrandingInput:
      type: object
      description: Body for creating a credential-branding record. The record is created as DRAFT at version 1.
      required: [name]
      example:
        name: "Acme Employee Badge branding"
        locales:
          - language: "en"
            name: "Acme Employee Badge"
            description: "Official employee identification credential"
            logoUri: "https://assets.acme.example/logo.png"
            backgroundColor: "#1A237E"
            textColor: "#FFFFFF"
      properties:
        name:
          type: string
          description: Internal human-readable name; must be non-blank.
        locales:
          type: array
          description: Per-language presentation overlays; language tags must be unique.
          default: []
          items:
            $ref: '#/components/schemas/BrandingLocale'
        layout:
          type: string
          nullable: true
          description: Optional layout hint.
        description:
          type: string
          nullable: true

    UpdateCredentialBrandingInput:
      type: object
      description: |
        Body for updating a DRAFT credential-branding record. All fields are optional; a null
        leaves the corresponding value unchanged. The record must be in DRAFT.
      properties:
        name:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        locales:
          type: array
          nullable: true
          description: Replaces the locales list wholesale; language tags must be unique.
          items:
            $ref: '#/components/schemas/BrandingLocale'
        layout:
          type: string
          nullable: true

    SetCredentialBrandingStatusInput:
      type: object
      description: Body for toggling the credential-branding lifecycle status.
      required: [status]
      properties:
        status:
          $ref: '#/components/schemas/ModelLifecycleStatus'

    DeleteCredentialBrandingResult:
      type: object
      description: Outcome of a delete request.
      required: [deleted]
      properties:
        deleted:
          type: boolean
          description: True when a branding record existed for the id and was removed; false when none existed.

  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Bearer JWT token. Tenant context is resolved from this token.
