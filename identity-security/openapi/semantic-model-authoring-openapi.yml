components:
  # Shared parameters (TenantId), pagination params (Limit/Offset/Page/Size/Sort/SortDirection),
  # error responses (NotFound/ValidationError/Unauthorized/Forbidden/Conflict/Error), and the
  # ApiError/PageMeta schemas live in the canonical shared ./common-components.yml (owned by IDK
  # lib-core-api-public, copied in at build time). Only data-product components are defined here.
  parameters:
    DataProductId:
      $ref: './semantic-model-authoring-components.yml#/components/parameters/DataProductId'
    DataDomainId:
      $ref: './semantic-model-authoring-components.yml#/components/parameters/DataDomainId'
    BindingId:
      $ref: './semantic-model-authoring-components.yml#/components/parameters/BindingId'
    TermPathParam:
      $ref: './semantic-model-authoring-components.yml#/components/parameters/TermPathParam'
    ObjectTypeName:
      $ref: './semantic-model-authoring-components.yml#/components/parameters/ObjectTypeName'
    RelationshipTypeName:
      $ref: './semantic-model-authoring-components.yml#/components/parameters/RelationshipTypeName'
    ObjectModelId:
      $ref: './semantic-model-authoring-components.yml#/components/parameters/ObjectModelId'
    ChannelId:
      $ref: './semantic-model-authoring-components.yml#/components/parameters/ChannelId'
    Limit:
      $ref: './common-components.yml#/components/parameters/Limit'
    Offset:
      $ref: './common-components.yml#/components/parameters/Offset'
    Sort:
      $ref: './common-components.yml#/components/parameters/Sort'
    SortDirection:
      $ref: './common-components.yml#/components/parameters/SortDirection'
    DataDomainRevision:
      name: revision
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    ReviewId:
      name: reviewId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DecisionId:
      name: decisionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PublicationId:
      name: publicationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    NoticeId:
      name: noticeId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
      description: Opaque compare-and-set token returned only in the ETag header. Required for every compare-and-set mutation.
  schemas:
    ModelLifecycleStatus:
      $ref: './semantic-model-authoring-components.yml#/components/schemas/ModelLifecycleStatus'
    ProductConformance:
      $ref: './semantic-model-authoring-components.yml#/components/schemas/ProductConformance'
    ProductCardinality:
      $ref: './semantic-model-authoring-components.yml#/components/schemas/ProductCardinality'
    ObjectModelRef:
      $ref: './semantic-model-authoring-components.yml#/components/schemas/ObjectModelRef'
    ProductSelection:
      $ref: './semantic-model-authoring-components.yml#/components/schemas/ProductSelection'
    ProductOverride:
      $ref: './semantic-model-authoring-components.yml#/components/schemas/ProductOverride'
    DataProduct:
      $ref: './semantic-model-authoring-components.yml#/components/schemas/DataProduct'
    DataProductPageResponse:
      type: object
      description: Paged list of data products, matching the envelope emitted by `ResponseBuilder.paginated()`.
      required: [data, pagination]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/DataProduct'
        pagination:
          $ref: './common-components.yml#/components/schemas/PageMeta'

    CreateDataProductInput:
      type: object
      description: Body for creating a draft data product. The new data product's id is server-assigned.
      required: [name, objectModelRef]
      example:
        name: "Employee Badge - minimal"
        objectModelRef:
          objectModelId: "c4d5e6f7-8a9b-4c0d-8e1f-2a3b4c5d6e7f"
          objectModelVersion: 2
        selected:
          - roleRef: "employee"
            path: ["givenName"]
          - roleRef: "employee"
            path: ["familyName"]
        overrides: []
        description: "Given and family name of the employee only"
      properties:
        name:
          type: string
        objectModelRef:
          $ref: '#/components/schemas/ObjectModelRef'
        selected:
          type: array
          description: The (roleRef, path) traversal entries to select.
          default: []
          items:
            $ref: '#/components/schemas/ProductSelection'
        overrides:
          type: array
          description: Per-member governance tightening, keyed by (roleRef, path).
          default: []
          items:
            $ref: '#/components/schemas/ProductOverride'
        description:
          type: string
          nullable: true

    UpdateDataProductInput:
      type: object
      description: |
        Partial update of a draft data product. Every field is optional; a null (or absent) field leaves the
        corresponding value unchanged. The data product id arrives via the URL and is never in the body.
      properties:
        name:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        selected:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/ProductSelection'
        overrides:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/ProductOverride'

    SetDataProductSelectionInput:
      type: object
      description: Body for replacing the data product's selection entries wholesale.
      required: [selected]
      properties:
        selected:
          type: array
          description: The new (roleRef, path) selection entries.
          default: []
          items:
            $ref: '#/components/schemas/ProductSelection'

    SetDataProductStatusInput:
      type: object
      description: Body for toggling the data product's status.
      required: [status]
      properties:
        status:
          $ref: '#/components/schemas/ModelLifecycleStatus'

    DeleteDataProductResult:
      type: object
      description: Outcome of a delete request.
      required: [deleted]
      properties:
        deleted:
          type: boolean
          description: True when a data product existed for the id and was removed; false when none existed.

    ResolvedDataProduct:
      $ref: './semantic-model-authoring-components.yml#/components/schemas/ResolvedDataProduct'
    ResolvedProductTerm:
      $ref: './semantic-model-authoring-components.yml#/components/schemas/ResolvedProductTerm'
    ResolvedProductSchemaRelationship:
      $ref: './semantic-model-authoring-components.yml#/components/schemas/ResolvedProductSchemaRelationship'
    # ------------------------------------------------------------------------------------------
    # Data domain (L1) tier
    # ------------------------------------------------------------------------------------------

    PartyRef:
      $ref: './semantic-model-authoring-components.yml#/components/schemas/PartyRef'
    DomainOverlays:
      $ref: './semantic-model-authoring-components.yml#/components/schemas/DomainOverlays'
    DomainMetaText:
      $ref: './semantic-model-authoring-components.yml#/components/schemas/DomainMetaText'
    DomainGovernance:
      $ref: './semantic-model-authoring-components.yml#/components/schemas/DomainGovernance'
    GovernanceJurisdiction:
      $ref: './semantic-model-authoring-components.yml#/components/schemas/GovernanceJurisdiction'
    JurisdictionResidency:
      $ref: './semantic-model-authoring-components.yml#/components/schemas/JurisdictionResidency'
    JurisdictionTransfer:
      $ref: './semantic-model-authoring-components.yml#/components/schemas/JurisdictionTransfer'
    GovernanceController:
