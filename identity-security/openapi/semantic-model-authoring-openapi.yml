      $ref: './semantic-model-authoring-components.yml#/components/schemas/ObjectOverride'
    ObjectModel:
      $ref: './semantic-model-authoring-components.yml#/components/schemas/ObjectModel'
    ObjectModelPageResponse:
      type: object
      description: Paged list of object models, matching the envelope emitted by `ResponseBuilder.paginated()`.
      required: [data, pagination]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ObjectModel'
        pagination:
          $ref: './common-components.yml#/components/schemas/PageMeta'

    CreateObjectModelInput:
      type: object
      description: Body for creating a draft object model. The new object model's id is server-assigned.
      required: [name]
      example:
        name: "Employee Onboarding"
        description: "Use case composing employee attributes drawn from the Acme Employee Data Domain"
        domainRefs:
          - dataDomainId: "9f2c1b3e-7a44-4c1e-8b0a-2d6f5e9c1a77"
            revision: 3
      properties:
        name:
          type: string
        description:
          type: string
          nullable: true
        domainRefs:
          type: array
          description: The data domains this object model draws from; at most one ref per data domain.
          default: []
          items:
            $ref: '#/components/schemas/DataDomainRef'
        roles:
          type: array
          default: []
          items:
            $ref: '#/components/schemas/ObjectRole'
        relationships:
          type: array
          default: []
          items:
            $ref: '#/components/schemas/ObjectRelationshipRef'
        overrides:
          type: array
          default: []
          items:
            $ref: '#/components/schemas/ObjectOverride'

    UpdateObjectModelInput:
      type: object
      description: |
        Partial update of an object model's name and description. Every field is optional; a null (or
        absent) field leaves the corresponding value unchanged. The object model id arrives via the URL.
      properties:
        name:
          type: string
          nullable: true
        description:
          type: string
          nullable: true

    DeleteObjectModelResult:
      type: object
      description: Outcome of a delete request.
      required: [deleted]
      properties:
        deleted:
          type: boolean
          description: True when an object model existed for the id and was removed; false when none existed.

    SetObjectModelDomainRefsInput:
      type: object
      description: Body for replacing the object model's whole domain-ref set. The object model id arrives via the URL.
      required: [domainRefs]
      properties:
        domainRefs:
          type: array
          items:
            $ref: '#/components/schemas/DataDomainRef'

    SetObjectModelRolesInput:
      type: object
      description: Body for replacing the object model's declared role set. The object model id arrives via the URL.
      required: [roles]
      properties:
        roles:
          type: array
          items:
            $ref: '#/components/schemas/ObjectRole'

    SetObjectModelRelationshipsInput:
      type: object
      description: Body for replacing the object model's selected relationship set. The object model id arrives via the URL.
      required: [relationships]
      properties:
        relationships:
          type: array
          items:
            $ref: '#/components/schemas/ObjectRelationshipRef'

    SetObjectModelOverridesInput:
      type: object
      description: Body for replacing the object model's narrow-only override set. The object model id arrives via the URL.
      required: [overrides]
      properties:
        overrides:
          type: array
          items:
            $ref: '#/components/schemas/ObjectOverride'

    SetObjectModelStatusInput:
      type: object
      description: Body for toggling the object model's status.
      required: [status]
      properties:
        status:
          $ref: '#/components/schemas/ModelLifecycleStatus'

    GenerateObjectModelSchemaInput:
      type: object
      description: |
        Body for generating (and optionally registering) an object model's use-case JSON Schema. The object model
        id arrives via the URL.
      properties:
        targetType:
          allOf:
            - $ref: '#/components/schemas/SchemaType'
          default: JSON_SCHEMA
          description: |
            The schema shape to generate. Only `JSON_SCHEMA` is supported now; any other value
            (including `JSON_LD_CONTEXT`) is reserved for a later phase and rejected with a 400.
        register:
          type: boolean
          default: false
          description: When true, also register the generated schema with the registry (license-gated).

    ResolvedObjectModel:
      $ref: './semantic-model-authoring-components.yml#/components/schemas/ResolvedObjectModel'
    ResolvedObjectRole:
      $ref: './semantic-model-authoring-components.yml#/components/schemas/ResolvedObjectRole'
    ResolvedTerm:
      $ref: './semantic-model-authoring-components.yml#/components/schemas/ResolvedTerm'
    ResolvedObjectRelationship:
      $ref: './semantic-model-authoring-components.yml#/components/schemas/ResolvedObjectRelationship'
    ResolvedObjectSchemaRelationship:
      $ref: './semantic-model-authoring-components.yml#/components/schemas/ResolvedObjectSchemaRelationship'
    GeneratedObjectModelSchemaResult:
      type: object
      description: The result of generating an object-model JSON Schema.
      required: [objectModelId, objectModelVersion, targetType, schema]
      properties:
        objectModelId:
          type: string
          format: uuid
        objectModelVersion:
          type: integer
          format: int64
          description: The resolved object-model snapshot version the schema was generated from.
        targetType:
          $ref: '#/components/schemas/SchemaType'
        schema:
          type: string
          description: The generated JSON Schema document, serialized to a string.
        schemaId:
          type: string
          format: uuid
          nullable: true
          description: The registry id of the registered schema when `register` was true; null otherwise.

