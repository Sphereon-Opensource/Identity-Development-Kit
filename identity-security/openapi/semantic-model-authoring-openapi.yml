      summary: Resolve an object model into its effective object-graph projection
      operationId: resolveObjectModel
      x-command-id: model.object.resolve-endpoint
      description: |
        Resolves the object model across its referenced data-domain snapshots: each role composes its bound
        object type (root plus applied specializations) with the object model's narrow-only overrides applied,
