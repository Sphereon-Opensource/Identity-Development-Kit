      properties:
        ruleId: { type: string }
        outcome: { type: string, enum: [PERMIT, DENY, REVIEW_REQUIRED, INDETERMINATE] }
        reasons: { type: array, items: { $ref: './enterprise-contract-components.yml#/components/schemas/DecisionReason' } }
    JsonElement: {}
