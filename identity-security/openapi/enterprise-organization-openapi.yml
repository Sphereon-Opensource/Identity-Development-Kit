        action: { $ref: './enterprise-contract-components.yml#/components/schemas/GovernedTypeId' }
        resourceRef: { $ref: '#/components/schemas/BusinessObjectRef' }
        context: { $ref: '#/components/schemas/JsonObject' }
    DecisionInputRef:
      type: object
      required: [objectRef, contentHash]
      additionalProperties: false
      properties:
        semantic: { $ref: './enterprise-contract-components.yml#/components/schemas/SemanticCoordinate' }
        objectRef: { $ref: '#/components/schemas/BusinessObjectRef' }
        contentHash: { $ref: '#/components/schemas/ContentHash' }
        version: { type: string }
    ApprovalRecord:
      type: object
      required: [actor, authorityRef, action, reviewedVersion, recordedAt]
