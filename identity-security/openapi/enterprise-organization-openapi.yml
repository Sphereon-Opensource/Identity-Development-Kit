        streamVersion: { type: integer, format: int64, minimum: 1 }
        commandDigest: { $ref: '#/components/schemas/ContentHash' }
        replayedFromIdempotency: { type: boolean, default: false }
    OrganizationStreamMetadata:
      type: object
      required: [modelId, streamVersion, activeProjectionRevision, projectionHash]
      properties:
        modelId: { type: string }
        streamVersion: { type: integer, format: int64, minimum: 0 }
        activeProjectionRevision: { $ref: '#/components/schemas/ProjectionRevision' }
        projectionHash: { $ref: '#/components/schemas/ContentHash' }
        lastRecordedAt: { type: string, format: date-time }
    ProjectorRef:
      type: object
      required: [id, revision]
      properties:
        id: { type: string, minLength: 1 }
        revision: { $ref: '#/components/schemas/ProjectorRevision' }
    ProjectorRevision:
      type: object
      required: [value]
      properties:
        value: { type: integer, format: int64, minimum: 1 }
    ProjectionRevision:
      type: object
      required: [value]
      properties:
        value: { type: integer, format: int64, minimum: 1 }
    StartReplayRequest:
      type: object
      required: [projectors]
      properties:
        projectors:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/ProjectorRef' }
    ActivateReplayRequest:
      type: object
      required: [expectedProjectionHash]
      properties:
        expectedProjectionHash: { $ref: '#/components/schemas/ContentHash' }
    OrganizationReplayStatus:
      type: object
      required: [modelId, projectionRevision, state, projectors, eventCount]
      properties:
        modelId: { type: string }
        projectionRevision: { $ref: '#/components/schemas/ProjectionRevision' }
        state: { type: string, enum: [BUILDING, FAILED, VERIFIED, ACTIVE, SUPERSEDED] }
        projectors: { type: array, items: { $ref: '#/components/schemas/ProjectorRef' } }
        eventCount: { type: integer, format: int64, minimum: 0 }
        projectionHash: { $ref: '#/components/schemas/ContentHash' }
        safeFailure: { type: string }

    ReserveCaseLifecycleRequest:
      allOf:
        - $ref: './enterprise-lifecycle-openapi.yml#/components/schemas/StartLifecycleExecutionRequest'
        - type: object
          properties:
            replacesExecutionRef:
              allOf:
                - $ref: './enterprise-lifecycle-openapi.yml#/components/schemas/LifecycleExecutionRef'
              description: Optional canonical predecessor linkage. Does not assert failure or authorize engine recovery; the lifecycle retry command verifies engine state and the pinned recovery entry.

    ReserveCaseFormWorkflowRequest:
      type: object
      required: [modelId, caseRef, definitionRef, formSessionId, bindingDigest]
      properties:
        modelId: { type: string }
        caseRef: { $ref: './enterprise-contract-components.yml#/components/schemas/CaseRef' }
        definitionRef: { $ref: './enterprise-lifecycle-openapi.yml#/components/schemas/WorkflowDefinitionRef' }
        formSessionId: { type: string, format: uuid }
        bindingDigest: { $ref: '#/components/schemas/ContentHash' }
        timerRef: { $ref: '#/components/schemas/ArtifactRef' }

    ReadCaseReviewSourceArgs:
      type: object
      required: [executionRef]
      properties:
        executionRef: { $ref: './enterprise-lifecycle-openapi.yml#/components/schemas/LifecycleExecutionRef' }
    CaseReviewSourceSnapshot:
      type: object
      required: [caseRef, templateRef, semanticRef, reviewedRevision, inputRevision, actionContext, decisionHashes, document]
      properties:
        caseRef: { $ref: './enterprise-contract-components.yml#/components/schemas/CaseRef' }
        templateRef: { $ref: '#/components/schemas/ArtifactRef' }
        semanticRef: { $ref: '#/components/schemas/SemanticResourceRef' }
        reviewedRevision: { type: integer, format: int64 }
        inputRevision: { type: integer, format: int64 }
        actionContext: { type: object, additionalProperties: true }
        decisionHashes:
          type: object
          additionalProperties: { $ref: '#/components/schemas/ContentHash' }
        document: { type: object, additionalProperties: true }
