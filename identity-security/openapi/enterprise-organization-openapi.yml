openapi: 3.0.4
info:
  title: Enterprise Organization API
  version: 0.3.0
  description: Generic typed event-stream operations for governed organization models and staged projections.
servers:
  - url: https://api.example.com/api/organization/v1
  - url: http://localhost:8080/api/organization/v1
security:
  - bearer: []
tags:
  - name: EnterpriseOrganization
  - name: EnterpriseOrganizationGraph
paths:
  /case-review-sources:read:
    post:
      tags: [EnterpriseOrganization]
      operationId: readCaseReviewSource
      x-command-id: organization.case.review-source
      summary: Read current governed review inputs for a canonical case execution
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReadCaseReviewSourceArgs' }
      responses:
        '200':
          description: Current canonical case, action and decision lineage
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CaseReviewSourceSnapshot' }
        '400': { $ref: './common-components.yml#/components/responses/ValidationError' }
        '401': { $ref: './common-components.yml#/components/responses/Unauthorized' }
        '403': { $ref: './common-components.yml#/components/responses/Forbidden' }
        '409': { $ref: './common-components.yml#/components/responses/Conflict' }
  /lifecycle-executions:reserve-form:
    post:
      tags: [EnterpriseOrganization]
      operationId: reserveCaseFormWorkflow
      x-command-id: organization.case-lifecycle.reserve-form
      summary: Authorize and reserve a server-derived form execution identity
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/IfMatch' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReserveCaseFormWorkflowRequest' }
      responses:
        '200':
          description: Canonical immutable execution reservation
          content:
            application/json:
              schema: { $ref: './enterprise-lifecycle-openapi.yml#/components/schemas/LifecycleLaunchReservation' }
        '400': { $ref: './common-components.yml#/components/responses/ValidationError' }
        '401': { $ref: './common-components.yml#/components/responses/Unauthorized' }
        '403': { $ref: './common-components.yml#/components/responses/Forbidden' }
        '409': { $ref: './common-components.yml#/components/responses/Conflict' }
  /lifecycle-executions:reserve:
    post:
      tags: [EnterpriseOrganization]
      operationId: reserveCaseLifecycleExecution
      x-command-id: organization.case-lifecycle.reserve
      summary: Authorize and reserve a server-derived lifecycle execution identity
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/IfMatch' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReserveCaseLifecycleRequest' }
      responses:
        '200':
          description: Canonical immutable execution reservation
          content:
            application/json:
              schema: { $ref: './enterprise-lifecycle-openapi.yml#/components/schemas/LifecycleLaunchReservation' }
        '400': { $ref: './common-components.yml#/components/responses/ValidationError' }
        '401': { $ref: './common-components.yml#/components/responses/Unauthorized' }
        '403': { $ref: './common-components.yml#/components/responses/Forbidden' }
        '409': { $ref: './common-components.yml#/components/responses/Conflict' }
  /lifecycle-executions:authorize:
    post:
      tags: [EnterpriseOrganization]
      operationId: authorizeCaseLifecycleExecution
      x-command-id: organization.case-lifecycle.authorize
      summary: Authorize an operation on an existing canonical case execution
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [executionRef, operation]
              properties:
                executionRef: { $ref: './enterprise-lifecycle-openapi.yml#/components/schemas/LifecycleExecutionRef' }
                operation: { type: string, minLength: 1 }
      responses:
        '200':
          description: Authorized canonical execution and immutable launch event identity
          content:
            application/json:
              schema: { $ref: './enterprise-lifecycle-openapi.yml#/components/schemas/LifecycleLaunchReservation' }
        '400': { $ref: './common-components.yml#/components/responses/ValidationError' }
        '401': { $ref: './common-components.yml#/components/responses/Unauthorized' }
        '403': { $ref: './common-components.yml#/components/responses/Forbidden' }
