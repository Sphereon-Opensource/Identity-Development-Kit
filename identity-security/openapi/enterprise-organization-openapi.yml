    OrganizationGraphView:
      type: object
      required: [tenantId, modelId, viewPoint, records, adjacency, streamVersion, projectionHash]
      additionalProperties: false
      properties:
        tenantId: { type: string, minLength: 1 }
        modelId: { type: string, minLength: 1 }
        viewPoint: { $ref: '#/components/schemas/OrganizationViewPoint' }
        records: { type: array, items: { $ref: '#/components/schemas/OrganizationGraphRecord' } }
        adjacency:
          type: object
          additionalProperties:
            type: array
            items: { $ref: '#/components/schemas/GraphEdge' }
        streamVersion: { type: integer, format: int64, minimum: 0 }
        projectionHash: { $ref: '#/components/schemas/ContentHash' }
    OrganizationProjectionStatus:
      type: object
      required: [modelId, streamVersion, activeProjectionRevision, activeProjectionHash, projectedStreamVersion, lag]
      properties:
        modelId: { type: string, minLength: 1 }
        streamVersion: { type: integer, format: int64, minimum: 0 }
        activeProjectionRevision: { $ref: '#/components/schemas/ProjectionRevision' }
        activeProjectionHash: { $ref: '#/components/schemas/ContentHash' }
        projectedStreamVersion: { type: integer, format: int64, minimum: 0 }
        lag: { type: integer, format: int64, minimum: 0 }
    SourceRouteRef:
      type: object
      required: [route, connectorId, adapterMetadata]
      additionalProperties: false
      properties:
        route: { $ref: '#/components/schemas/ArtifactRef' }
        connectorId: { type: string, minLength: 1 }
        adapterMetadata: { $ref: '#/components/schemas/JsonObject' }
    RequestSourceAssertionRequest:
      type: object
      required: [routeRef, subjectRef, parameters]
      additionalProperties: false
      properties:
        routeRef: { $ref: '#/components/schemas/ArtifactRef' }
        subjectRef: { $ref: '#/components/schemas/BusinessObjectRef' }
        protectedRequestRef: { $ref: './enterprise-contract-components.yml#/components/schemas/ProtectedPayloadRef' }
        parameters: { $ref: '#/components/schemas/JsonObject' }
    SourceAssertionExecutionReceipt:
      type: object
      required: [modelId, routeRef, connectorRunId, technicalStatus, correlation]
      additionalProperties: false
      properties:
        modelId: { type: string, minLength: 1 }
        routeRef: { $ref: '#/components/schemas/SourceRouteRef' }
        connectorRunId: { type: string, minLength: 1 }
        technicalStatus: { $ref: './enterprise-contract-components.yml#/components/schemas/GovernedTypeId' }
        correlation: { $ref: './enterprise-contract-components.yml#/components/schemas/CorrelationContext' }
        # The three CR-1 fields and the two caseRef fields below are emitted as explicit nulls by the
        # REST response path when unset, so they are declared nullable. OAS 3.0 ignores siblings of
        # $ref, hence the allOf wrapper this repo uses for every nullable reference.
        assertionRef:
          allOf:
            - $ref: '#/components/schemas/BusinessObjectRef'
          nullable: true
        contentHash:
          allOf:
            - $ref: '#/components/schemas/ContentHash'
          nullable: true
        state:
          allOf:
            - $ref: './enterprise-contract-components.yml#/components/schemas/SourceAssertionStatus'
          nullable: true
        streamVersion: { type: integer, format: int64, nullable: true }
    SourceFieldProvenance:
      type: object
      required: [sourcePath]
      additionalProperties: false
      properties:
        sourcePath: { type: string }
        transformationRef: { $ref: '#/components/schemas/ArtifactRef' }
    NormalizedFact:
      type: object
      required: [semantic, valueHash, provenance]
      additionalProperties: false
      properties:
        semantic: { $ref: './enterprise-contract-components.yml#/components/schemas/SemanticCoordinate' }
        value: { $ref: '#/components/schemas/JsonElement' }
        protectedValueRef: { $ref: './enterprise-contract-components.yml#/components/schemas/ProtectedPayloadRef' }
        valueHash: { $ref: '#/components/schemas/ContentHash' }
        provenance: { $ref: '#/components/schemas/SourceFieldProvenance' }
    SourceAssertionEvidence:
      type: object
      required: [assertionRef, connectorRunId, routeRef, sourcePurpose, subjectRef, semantics, freshnessPolicyRef, contentHash, normalizedFacts]
      additionalProperties: false
      properties:
        assertionRef: { $ref: '#/components/schemas/BusinessObjectRef' }
        connectorRunId: { type: string, minLength: 1 }
        routeRef: { $ref: '#/components/schemas/ArtifactRef' }
        sourcePurpose: { $ref: './enterprise-contract-components.yml#/components/schemas/GovernedTypeId' }
        subjectRef: { $ref: '#/components/schemas/BusinessObjectRef' }
        semantics:
          type: array
          minItems: 1
          items: { $ref: './enterprise-contract-components.yml#/components/schemas/SemanticCoordinate' }
        sourceEffectiveAt: { type: string, format: date-time }
        freshUntil: { type: string, format: date-time }
        freshnessPolicyRef: { $ref: '#/components/schemas/ArtifactRef' }
        protectedRawResponseRef: { $ref: './enterprise-contract-components.yml#/components/schemas/ProtectedPayloadRef' }
        contentHash: { $ref: '#/components/schemas/ContentHash' }
        normalizedFacts: { type: array, items: { $ref: '#/components/schemas/NormalizedFact' } }
    SourceAssertionRecord:
      type: object
      required: [assertionRef, tenantId, modelId, sourcePurpose, operation, subjectRef, semantics, routeRef, observedAt, freshnessPolicyRef, technicalStatus, contentHash, normalizedFacts, correlation, recordedAt]
      additionalProperties: false
      properties:
        assertionRef: { $ref: '#/components/schemas/BusinessObjectRef' }
        tenantId: { type: string }
        modelId: { type: string }
        sourcePurpose: { $ref: './enterprise-contract-components.yml#/components/schemas/GovernedTypeId' }
        operation: { $ref: './enterprise-contract-components.yml#/components/schemas/GovernedTypeId' }
        subjectRef: { $ref: '#/components/schemas/BusinessObjectRef' }
        semantics: { type: array, items: { $ref: './enterprise-contract-components.yml#/components/schemas/SemanticCoordinate' } }
        routeRef: { $ref: '#/components/schemas/SourceRouteRef' }
        observedAt: { type: string, format: date-time }
        sourceEffectiveAt: { type: string, format: date-time }
        freshUntil: { type: string, format: date-time }
        freshnessPolicyRef: { $ref: '#/components/schemas/ArtifactRef' }
        technicalStatus: { $ref: './enterprise-contract-components.yml#/components/schemas/GovernedTypeId' }
        protectedRawResponseRef: { $ref: './enterprise-contract-components.yml#/components/schemas/ProtectedPayloadRef' }
        contentHash: { $ref: '#/components/schemas/ContentHash' }
        normalizedFacts: { type: array, items: { $ref: '#/components/schemas/NormalizedFact' } }
        correlation: { $ref: './enterprise-contract-components.yml#/components/schemas/CorrelationContext' }
        supersedesAssertionRef: { $ref: '#/components/schemas/BusinessObjectRef' }
        recordedAt: { type: string, format: date-time }
        state:
          allOf:
            - $ref: './enterprise-contract-components.yml#/components/schemas/SourceAssertionStatus'
          nullable: true
    SourceAssertionFreshness:
      type: object
      description: >-
        The freshness of one source assertion a decision pinned: the assertion reference, the composer's
        reading of the source and the two freshness instants. It deliberately carries no normalized facts,
        no protected raw response reference, no content hash and no route reference.
      required: [assertionRef]
      additionalProperties: false
      properties:
        assertionRef:
          allOf:
            - $ref: '#/components/schemas/BusinessObjectRef'
          description: The source assertion the decision pinned, as the case's own history names it.
        state:
          allOf:
            - $ref: './enterprise-contract-components.yml#/components/schemas/SourceAssertionStatus'
          nullable: true
          description: >-
            The register's own verdict on the assertion. Absent when the recording route reported none;
            it is never inferred.
        sourceEffectiveAt:
          type: string
          format: date-time
          description: >-
            When the register's answer became effective in the register. This is not when the register
            was consulted, which the case view does not carry.
        freshUntil:
          type: string
          format: date-time
          description: When the register's answer stops being usable. Absent when the register set no expiry.
    EvaluatePolicyRequest:
      type: object
      required: [decisionRef, policyBindingRef, normalizedRequest, inputRefs, humanActions]
      additionalProperties: false
      properties:
        decisionRef: { $ref: '#/components/schemas/BusinessObjectRef' }
        policyBindingRef: { $ref: '#/components/schemas/PolicyBindingRef' }
        normalizedRequest: { $ref: '#/components/schemas/NormalizedPolicyRequest' }
        inputRefs: { type: array, items: { $ref: '#/components/schemas/DecisionInputRef' } }
        humanActions: { type: array, items: { $ref: '#/components/schemas/ApprovalRecord' } }
        protectedDiagnosticsRef: { $ref: './enterprise-contract-components.yml#/components/schemas/ProtectedPayloadRef' }
        supersedesDecisionRef: { $ref: '#/components/schemas/BusinessObjectRef' }
        caseRef:
          allOf:
            - $ref: './enterprise-contract-components.yml#/components/schemas/CaseRef'
          nullable: true
    PolicyDecisionEvidence:
      type: object
      required: [decisionRef, tenantId, modelId, policyBindingRef, engineProfile, backendPolicyRef, semanticRelease, normalizedRequest, normalizedRequestHash, inputRefs, machineResults, outcome, reasonIds, recordedAt, effectiveAt, decisionHash, correlation]
      additionalProperties: false
      properties:
        decisionRef: { $ref: '#/components/schemas/BusinessObjectRef' }
        tenantId: { type: string }
        modelId: { type: string }
        policyBindingRef: { $ref: '#/components/schemas/PolicyBindingRef' }
        engineProfile: { $ref: './enterprise-contract-components.yml#/components/schemas/GovernedTypeId' }
        backendPolicyRef: { $ref: '#/components/schemas/ArtifactRef' }
        semanticRelease: { $ref: '#/components/schemas/JointSemanticReleaseRef' }
        normalizedRequest: { $ref: '#/components/schemas/NormalizedPolicyRequest' }
        normalizedRequestHash: { $ref: '#/components/schemas/ContentHash' }
        inputRefs: { type: array, items: { $ref: '#/components/schemas/DecisionInputRef' } }
        machineResults: { type: array, items: { $ref: '#/components/schemas/RuleEvaluationResult' } }
        outcome: { $ref: './enterprise-contract-components.yml#/components/schemas/GovernedTypeId' }
        reasonIds: { type: array, items: { $ref: './enterprise-contract-components.yml#/components/schemas/GovernedTypeId' } }
        explanation: { type: string }
        remediationRef: { $ref: '#/components/schemas/BusinessObjectRef' }
        protectedDiagnosticsRef: { $ref: './enterprise-contract-components.yml#/components/schemas/ProtectedPayloadRef' }
        recordedAt: { type: string, format: date-time }
        effectiveAt: { type: string, format: date-time }
        decisionHash: { $ref: '#/components/schemas/ContentHash' }
        supersedesDecisionRef: { $ref: '#/components/schemas/BusinessObjectRef' }
        correlation: { $ref: './enterprise-contract-components.yml#/components/schemas/CorrelationContext' }
        extension: { $ref: '#/components/schemas/JsonObject' }
        caseRef:
          allOf:
            - $ref: './enterprise-contract-components.yml#/components/schemas/CaseRef'
          nullable: true
        streamVersion: { type: integer, format: int64, nullable: true }
    NormalizedPolicyRequest:
