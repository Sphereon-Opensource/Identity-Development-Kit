    BusinessObjectRef: { $ref: './enterprise-contract-components.yml#/components/schemas/BusinessObjectRef' }
    ContentHash: { $ref: './enterprise-contract-components.yml#/components/schemas/ContentHash' }
    SemanticResourceRef:
      type: object
      required: [id, revision]
      properties:
        id: { type: string, minLength: 1 }
