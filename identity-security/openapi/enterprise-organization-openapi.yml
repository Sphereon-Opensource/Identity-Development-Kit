    RecordLifecycle:
      type: string
      enum: [DRAFT, ACTIVE, SUSPENDED, ENDED, REVOKED]
    OrganizationGraphPage:
      type: object
      required: [items, pagination]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/OrganizationGraphRecord' }
        pagination: { $ref: './common-components.yml#/components/schemas/PageMeta' }
    OrganizationViewPoint:
      type: object
      required: [mode]
      additionalProperties: false
      properties:
        mode: { type: string, enum: [CURRENT, EFFECTIVE_AT, AS_OF_RECORDED_AT] }
        instant: { type: string, format: date-time }
    GraphEdge:
      type: object
      required: [relationshipRef, sourceRef, targetRef, relationshipType, inverse]
      additionalProperties: false
      properties:
        relationshipRef: { $ref: '#/components/schemas/BusinessObjectRef' }
        sourceRef: { $ref: '#/components/schemas/BusinessObjectRef' }
        targetRef: { $ref: '#/components/schemas/BusinessObjectRef' }
        relationshipType: { $ref: './enterprise-contract-components.yml#/components/schemas/GovernedTypeId' }
