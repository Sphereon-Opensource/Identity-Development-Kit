        Narrow projection from the case stream only, sized to enter Temporal history in full: stage,
        status, opened-at, stream version, the requested gate's latest started instance, whether it is
        satisfied by override, and the named control receipt when it belongs to this case. The control
        receipt is named by all three controlReceipt parameters together or by none of them.
      parameters:
        - { $ref: '#/components/parameters/ModelId' }
        - { $ref: '#/components/parameters/CaseId' }
        - { $ref: '#/components/parameters/CaseTypeNamespace' }
        - { $ref: '#/components/parameters/CaseType' }
        - name: gateId
          in: query
          required: true
          description: Id of the elapsed gate whose latest started instance the read projects.
          schema: { type: string, minLength: 1 }
        - name: gateVersion
          in: query
          required: true
          description: SemVer package version of that gate.
          schema: { type: string, minLength: 1 }
        - name: controlReceiptTypeNamespace
          in: query
          required: false
          description: Namespace of the governed type of a control receipt to resolve against this case.
          schema: { type: string, minLength: 1 }
        - name: controlReceiptType
          in: query
          required: false
          description: Value of the governed type of a control receipt to resolve against this case.
          schema: { type: string, minLength: 1 }
        - name: controlReceiptId
          in: query
          required: false
          description: Id of a control receipt to resolve against this case.
          schema: { type: string, minLength: 1 }
      responses:
        '200':
          description: Successful readCaseCoordination result.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CaseCoordination' }
        '400': { $ref: './common-components.yml#/components/responses/ValidationError' }
        '401': { $ref: './common-components.yml#/components/responses/Unauthorized' }
        '403': { $ref: './common-components.yml#/components/responses/Forbidden' }
        '404': { $ref: './common-components.yml#/components/responses/NotFound' }

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    CaseId:
      name: caseId
      in: path
      required: true
      schema: { type: string, minLength: 1 }
    SubmissionId:
      name: submissionId
      in: path
      required: true
      schema: { type: string, minLength: 1 }
    CaseTypeNamespace:
      name: caseTypeNamespace
      in: query
      required: true
      description: Namespace of the governed case type used to resolve the exact case stream.
      schema: { type: string, minLength: 1 }
    CaseType:
      name: caseType
      in: query
      required: true
      description: Value of the governed case type used to resolve the exact case stream.
      schema: { type: string, minLength: 1 }
    ModelId:
      name: modelId
      in: path
      required: true
      schema: { type: string, minLength: 1 }
    ProjectionRevision:
      name: projectionRevision
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
    RecordId:
      name: recordId
      in: path
      required: true
      schema: { type: string, minLength: 1 }
    RecordType:
      name: recordType
      in: path
      required: true
      description: Full governed type identifier, using the final colon as namespace separator.
      schema: { type: string, minLength: 3 }
    RecordTypeQuery:
      name: recordType
      in: query
      required: false
      schema: { type: string, minLength: 3 }
    EffectiveAt:
      name: effectiveAt
      in: query
      required: false
      description: Business-time view instant. Mutually exclusive with recordedAt.
      schema: { type: string, format: date-time }
    RecordedAt:
      name: recordedAt
      in: query
      required: false
      description: System recorded-time view instant. Mutually exclusive with effectiveAt.
      schema: { type: string, format: date-time }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 1 }
    IfMatchSubmission:
      name: If-Match-Submission
      in: header
      required: false
      description: Canonical evidence submission revision, zero for a new submission. Allows unrelated evidence writes since If-Match; other intervening events still conflict.
      schema: { type: string, pattern: '^"[0-9]+"$' }
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Expected stream version.
      schema: { type: string, pattern: '^"[0-9]+"$' }
  responses:
    MutationResultResponse:
      description: Typed mutation result
      content:
        application/json:
          schema: { $ref: '#/components/schemas/OrganizationMutationResult' }
    ReplayStatusResponse:
      description: Replay status
      content:
        application/json:
          schema: { $ref: '#/components/schemas/OrganizationReplayStatus' }
    GraphMutationResultResponse:
      description: Typed organization graph mutation result
      content:
        application/json:
          schema: { $ref: '#/components/schemas/OrganizationGraphMutationResult' }
    PolicyUnavailable:
      description: The policy engine could not decide the request; nothing was recorded and the same request may be retried.
      content:
        application/json:
          schema: { $ref: './common-components.yml#/components/schemas/ApiError' }
  schemas:
    CaseCommandResult:
      type: object
      required: [caseRef, streamVersion, commandDigest, replayedFromIdempotency]
      properties:
        caseRef: { $ref: './enterprise-contract-components.yml#/components/schemas/CaseRef' }
        streamVersion: { type: integer, format: int64, minimum: 0 }
        commandDigest: { $ref: './enterprise-contract-components.yml#/components/schemas/ContentHash' }
        replayedFromIdempotency: { type: boolean, default: false }
        elapsedGateStart:
          allOf: [{ $ref: './enterprise-contract-components.yml#/components/schemas/ElapsedGateStart' }]
          description: Persisted authored gate identity and server deadline, stable across retries.
    CaseControlOutcome:
      type: string
      enum: [OVERRIDE_GRANTED, OVERRIDE_DENIED, CASE_CANCELLED]
    CaseControlNotification:
      type: string
      enum: [DELIVERED, PENDING, NOT_APPLICABLE]
    CaseControlReceipt:
      type: object
      required: [controlReceiptRef, outcome, reasonRef, decidedAt]
      properties:
        controlReceiptRef: { $ref: './enterprise-contract-components.yml#/components/schemas/BusinessObjectRef' }
        outcome: { $ref: '#/components/schemas/CaseControlOutcome' }
        gateRef:
          allOf: [{ $ref: './enterprise-contract-components.yml#/components/schemas/ArtifactRef' }]
          description: Present for an override outcome only.
        gateStartedAt:
          type: string
          format: date-time
          nullable: true
          description: Pins the exact started gate instance the override applied to. Present for an override outcome only.
        reasonRef: { $ref: './enterprise-contract-components.yml#/components/schemas/ArtifactRef' }
        decidedAt: { type: string, format: date-time }
    CaseControlResult:
      type: object
      required: [caseRef, streamVersion, commandDigest, receipt, notification, replayedFromIdempotency]
      properties:
        caseRef: { $ref: './enterprise-contract-components.yml#/components/schemas/CaseRef' }
        streamVersion: { type: integer, format: int64, minimum: 0 }
        commandDigest: { $ref: './enterprise-contract-components.yml#/components/schemas/ContentHash' }
        receipt: { $ref: '#/components/schemas/CaseControlReceipt' }
        notification:
          allOf: [{ $ref: '#/components/schemas/CaseControlNotification' }]
          description: >-
            What delivery the command itself attempted. An idempotent replay always answers
            NOT_APPLICABLE because it never re-attempts delivery; re-drive it with notifyCaseControl.
        replayedFromIdempotency: { type: boolean, default: false }
    CaseCoordination:
      type: object
      required: [caseRef, templateRef, currentStage, status, openedAt, streamVersion, gateSatisfiedByOverride]
      properties:
        caseRef: { $ref: './enterprise-contract-components.yml#/components/schemas/CaseRef' }
        templateRef: { $ref: './enterprise-contract-components.yml#/components/schemas/ArtifactRef' }
        workflowRef:
          allOf: [{ $ref: './enterprise-contract-components.yml#/components/schemas/WorkflowDefinitionRef' }]
          nullable: true
          description: The case's pinned workflow definition; omitted when the case pins none.
        currentStage: { type: string }
        status: { $ref: './enterprise-contract-components.yml#/components/schemas/CaseStatus' }
        openedAt: { type: string, format: date-time }
        streamVersion: { type: integer, format: int64, minimum: 0 }
        elapsedGateStart:
          allOf: [{ $ref: './enterprise-contract-components.yml#/components/schemas/ElapsedGateStart' }]
          nullable: true
          description: The requested gate's latest started instance on the case stream; omitted when none.
        gateSatisfiedByOverride: { type: boolean }
        control: { $ref: '#/components/schemas/CaseControlReceipt' }
    OverrideCaseGateArgs:
      type: object
      required: [metadata, caseRef, gateRef, reasonRef]
      properties:
        metadata: { $ref: './enterprise-contract-components.yml#/components/schemas/CommandRequestMetadata' }
        caseRef: { $ref: './enterprise-contract-components.yml#/components/schemas/CaseRef' }
        gateRef: { $ref: './enterprise-contract-components.yml#/components/schemas/ArtifactRef' }
        reasonRef: { $ref: './enterprise-contract-components.yml#/components/schemas/ArtifactRef' }
    CancelCaseArgs:
      type: object
      required: [metadata, caseRef, reasonRef]
      properties:
        metadata: { $ref: './enterprise-contract-components.yml#/components/schemas/CommandRequestMetadata' }
        caseRef: { $ref: './enterprise-contract-components.yml#/components/schemas/CaseRef' }
        reasonRef: { $ref: './enterprise-contract-components.yml#/components/schemas/ArtifactRef' }
    NotifyCaseControlArgs:
      type: object
      required: [metadata, caseRef, controlReceiptRef]
      properties:
        metadata: { $ref: './enterprise-contract-components.yml#/components/schemas/CommandRequestMetadata' }
        caseRef: { $ref: './enterprise-contract-components.yml#/components/schemas/CaseRef' }
        controlReceiptRef: { $ref: './enterprise-contract-components.yml#/components/schemas/BusinessObjectRef' }
    CaseView:
      type: object
      required: [businessCase, evidence, receipts, lifecycleReceipts, sourceAssertions, projectionHash, streamVersion]
      properties:
        businessCase: { $ref: './enterprise-contract-components.yml#/components/schemas/BusinessCase' }
        latestDecision: { $ref: './enterprise-contract-components.yml#/components/schemas/DecisionRecord' }
        evidence: { type: array, items: { $ref: './enterprise-contract-components.yml#/components/schemas/EvidenceSubmission' } }
        receipts: { type: array, items: { $ref: './enterprise-contract-components.yml#/components/schemas/IntegrationReceiptRef' } }
        lifecycleReceipts: { type: array, items: { $ref: '#/components/schemas/LifecycleReceipt' } }
        sourceAssertions:
          type: array
          items: { $ref: '#/components/schemas/SourceAssertionFreshness' }
          description: >-
            The freshness of every source assertion latestDecision pinned, in the order that decision's
            manifest names them, de-duplicated. Empty when the case has no decision yet. A manifest entry
            that resolves to no source assertion - the case reference a journey pins alongside its
            assertion - is left out rather than reported.
        projectionHash: { $ref: './enterprise-contract-components.yml#/components/schemas/ContentHash' }
        streamVersion: { type: integer, format: int64, minimum: 0 }
    TransitionEvaluation:
      type: object
      required: [caseRef, transitionRef, outcome, reasons, preconditions, evaluatedAt, currentStreamVersion]
      properties:
        caseRef: { $ref: './enterprise-contract-components.yml#/components/schemas/CaseRef' }
        transitionRef: { $ref: '#/components/schemas/ArtifactRef' }
        outcome: { $ref: './enterprise-contract-components.yml#/components/schemas/DecisionOutcome' }
        reasons: { type: array, items: { $ref: './enterprise-contract-components.yml#/components/schemas/DecisionReason' } }
        preconditions: { type: array, items: { $ref: './enterprise-contract-components.yml#/components/schemas/GateResult' } }
        evaluatedAt: { type: string, format: date-time }
        currentStreamVersion: { type: integer, format: int64, minimum: 0 }
        actionSubmissionRevision: { type: integer, format: int64, minimum: 0, readOnly: true }
        policyDecisions:
          type: array
          readOnly: true
          items: { $ref: '#/components/schemas/DecisionInputRef' }
    ActivateLifecyclePlanRequest:
      type: object
      required: [id, version]
      properties:
        id: { type: string, minLength: 1 }
        version: { $ref: '#/components/schemas/PackageVersion' }
        agreementRef: { $ref: '#/components/schemas/BusinessObjectRef' }
    CaseActionSubmission:
      type: object
      required: [actionRef, submittedAt]
      properties:
        actionRef: { $ref: '#/components/schemas/ArtifactRef' }
        inputRef: { $ref: './enterprise-contract-components.yml#/components/schemas/ProtectedPayloadRef' }
        evidenceRefs: { type: array, items: { $ref: './enterprise-contract-components.yml#/components/schemas/BusinessObjectRef' } }
        receiptRefs: { type: array, items: { $ref: './enterprise-contract-components.yml#/components/schemas/IntegrationReceiptRef' } }
        submittedAt: { type: string, format: date-time }
    EvidenceValidationResult:
      type: object
      required: [validator, valid, reasons]
      properties:
        validator: { $ref: '#/components/schemas/ArtifactRef' }
        valid: { type: boolean, readOnly: true, description: Derived from canonical policy execution. }
        decisionRef:
          allOf: [{ $ref: './enterprise-contract-components.yml#/components/schemas/BusinessObjectRef' }]
          readOnly: true
          nullable: true
        decisionHash:
          allOf: [{ $ref: './enterprise-contract-components.yml#/components/schemas/ContentHash' }]
          readOnly: true
          nullable: true
        outcome:
          allOf: [{ $ref: './enterprise-contract-components.yml#/components/schemas/DecisionOutcome' }]
          readOnly: true
          nullable: true
        reasons: { type: array, items: { $ref: './enterprise-contract-components.yml#/components/schemas/DecisionReason' } }
        # Nullable only because this record is also the request body of evidence validate (CR-6): the
        # authored workflow that sends it may not read a clock. The server stamps it before the
        # validation is stored, so a validation read back always carries it. Same follow-up as
        # CaseStageTransition.effectiveAt in enterprise-contract-components.yml.
        recordedAt: { type: string, format: date-time, nullable: true }
    DisposeEvidenceRequest:
      type: object
      required: [state]
      properties:
        state: { type: string, enum: [PENDING, AUTOMATED_ACCEPTED, REVIEW_REQUIRED, APPROVED, REJECTED, MORE_INFORMATION_REQUIRED] }
        disposition: { type: string }
        reasons: { type: array, items: { $ref: './enterprise-contract-components.yml#/components/schemas/DecisionReason' } }
        reviewer: { $ref: '#/components/schemas/ApprovalRecord' }
    CaseConfirmation:
      type: object
      required: [confirmationRef, reviewedCaseRevision, reviewedDecisionRefs, actor, authorityRef, confirmedAt]
      properties:
        confirmationRef: { $ref: '#/components/schemas/ArtifactRef' }
        reviewedCaseRevision: { type: integer, format: int64, minimum: 0 }
        reviewedDecisionRefs: { type: array, items: { $ref: './enterprise-contract-components.yml#/components/schemas/BusinessObjectRef' } }
        actor: { $ref: './enterprise-contract-components.yml#/components/schemas/ActorRef' }
        authorityRef: { $ref: './enterprise-contract-components.yml#/components/schemas/BusinessObjectRef' }
        confirmedAt: { type: string, format: date-time }
        transitionRef:
          $ref: '#/components/schemas/ArtifactRef'
          description: Selects the reviewed transition when an action has multiple approval paths; the server persists the resolved pin.
    LifecycleReceipt:
      type: object
      required: [receiptRef, kind, recordedAt]
      properties:
        receiptRef: { $ref: '#/components/schemas/ArtifactRef' }
        kind: { $ref: './enterprise-contract-components.yml#/components/schemas/GovernedTypeId' }
        executionRef: { $ref: './enterprise-contract-components.yml#/components/schemas/BusinessObjectRef' }
        timerRef: { $ref: '#/components/schemas/ArtifactRef' }
        contentHash: { $ref: './enterprise-contract-components.yml#/components/schemas/ContentHash' }
        recordedAt: { type: string, format: date-time }
    CaseTimelineEntry:
      type: object
      required: [streamVersion, eventType, caseRef, recordedAt, effectiveAt, correlation]
      properties:
        streamVersion: { type: integer, format: int64, minimum: 0 }
        eventType: { type: string, minLength: 1 }
        caseRef: { $ref: './enterprise-contract-components.yml#/components/schemas/CaseRef' }
        recordedAt: { type: string, format: date-time }
        effectiveAt: { type: string, format: date-time }
        correlation: { $ref: './enterprise-contract-components.yml#/components/schemas/CorrelationContext' }
    CaseTimelinePage:
      type: object
      required: [items, pagination]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/CaseTimelineEntry' } }
        pagination: { $ref: './common-components.yml#/components/schemas/PageMeta' }
    CaseLineage:
      type: object
      required: [caseRef, semanticRefs, evidenceRefs, decisionRefs, receiptRefs, lifecycleReceipts, projectionHash]
      properties:
        caseRef: { $ref: './enterprise-contract-components.yml#/components/schemas/CaseRef' }
        templateRef: { $ref: '#/components/schemas/ArtifactRef' }
        semanticRefs: { type: array, items: { $ref: './enterprise-contract-components.yml#/components/schemas/SemanticResourceRef' } }
        evidenceRefs: { type: array, items: { $ref: './enterprise-contract-components.yml#/components/schemas/BusinessObjectRef' } }
        decisionRefs: { type: array, items: { $ref: './enterprise-contract-components.yml#/components/schemas/BusinessObjectRef' } }
        receiptRefs: { type: array, items: { $ref: './enterprise-contract-components.yml#/components/schemas/IntegrationReceiptRef' } }
        lifecycleReceipts: { type: array, items: { $ref: '#/components/schemas/LifecycleReceipt' } }
        projectionHash: { $ref: './enterprise-contract-components.yml#/components/schemas/ContentHash' }
    PartySemanticBindingInput:
      type: object
      required: [bindingId, semanticProfileRef, semanticRelease, effectiveInterval]
      additionalProperties: false
      properties:
        bindingId: { type: string, minLength: 1 }
        semanticProfileRef: { $ref: '#/components/schemas/SemanticResourceRef' }
        semanticRelease: { $ref: '#/components/schemas/JointSemanticReleaseRef' }
        effectiveInterval: { $ref: '#/components/schemas/EffectiveInterval' }
        supersedesBindingId: { type: string }
    PartyMutationInput:
      type: object
      required: [recordRef, rootKind, attributes, lifecycle, effectiveInterval, revision]
      additionalProperties: false
      properties:
        recordRef: { $ref: '#/components/schemas/BusinessObjectRef' }
        rootKind: { type: string, enum: [NATURAL_PERSON, ORGANIZATION, ORGANIZATION_UNIT, GROUP, AGENT, SERVICE, SOFTWARE, ASSET] }
        semanticBinding: { $ref: '#/components/schemas/PartySemanticBindingInput' }
        attributes: { $ref: '#/components/schemas/JsonObject' }
        lifecycle: { $ref: '#/components/schemas/RecordLifecycle' }
        effectiveInterval: { $ref: '#/components/schemas/EffectiveInterval' }
        revision: { type: integer, format: int64, minimum: 1 }
        supersedesRevision: { type: integer, format: int64, minimum: 1 }
    IdentifierMutationInput:
      type: object
      required: [recordRef, partyRef, scheme, normalizedValueHash, lifecycle, effectiveInterval]
      additionalProperties: false
      properties:
        recordRef: { $ref: '#/components/schemas/BusinessObjectRef' }
        partyRef: { $ref: '#/components/schemas/BusinessObjectRef' }
        scheme: { $ref: '#/components/schemas/IdentifierScheme' }
        normalizedValueHash: { $ref: '#/components/schemas/ContentHash' }
        protectedValueRef: { $ref: './enterprise-contract-components.yml#/components/schemas/ProtectedPayloadRef' }
        displayValue: { type: string }
        lifecycle: { $ref: '#/components/schemas/RecordLifecycle' }
        effectiveInterval: { $ref: '#/components/schemas/EffectiveInterval' }
        supersedesBindingRef: { $ref: '#/components/schemas/BusinessObjectRef' }
    RelationshipMutationInput:
      type: object
      required: [recordRef, definition, sourcePartyRef, targetPartyRef, lifecycle, effectiveInterval, revision]
      additionalProperties: false
      properties:
        recordRef: { $ref: '#/components/schemas/BusinessObjectRef' }
        definition: { $ref: '#/components/schemas/RelationshipDefinition' }
        sourcePartyRef: { $ref: '#/components/schemas/BusinessObjectRef' }
        targetPartyRef: { $ref: '#/components/schemas/BusinessObjectRef' }
        contextRef: { $ref: '#/components/schemas/BusinessObjectRef' }
        lifecycle: { $ref: '#/components/schemas/RecordLifecycle' }
        effectiveInterval: { $ref: '#/components/schemas/EffectiveInterval' }
        revision: { type: integer, format: int64, minimum: 1 }
        supersedesRevision: { type: integer, format: int64, minimum: 1 }
    AgreementMutationInput:
      type: object
      required: [recordRef, partyRoles, protectedTermsRef, contentHash, lifecycle, effectiveInterval]
      additionalProperties: false
      properties:
        recordRef: { $ref: '#/components/schemas/BusinessObjectRef' }
        partyRoles: { type: array, minItems: 2, items: { $ref: '#/components/schemas/AgreementPartyRole' } }
        protectedTermsRef: { $ref: './enterprise-contract-components.yml#/components/schemas/ProtectedPayloadRef' }
        contentHash: { $ref: '#/components/schemas/ContentHash' }
        lifecycle: { $ref: '#/components/schemas/RecordLifecycle' }
        effectiveInterval: { $ref: '#/components/schemas/EffectiveInterval' }
        amendmentOfRef: { $ref: '#/components/schemas/BusinessObjectRef' }
    AssignmentMutationInput:
      type: object
      required: [recordRef, assigningPartyRef, assignedPartyRef, role, lifecycle, effectiveInterval]
      additionalProperties: false
      properties:
        recordRef: { $ref: '#/components/schemas/BusinessObjectRef' }
        assigningPartyRef: { $ref: '#/components/schemas/BusinessObjectRef' }
        assignedPartyRef: { $ref: '#/components/schemas/BusinessObjectRef' }
        role: { $ref: './enterprise-contract-components.yml#/components/schemas/GovernedTypeId' }
        agreementRef: { $ref: '#/components/schemas/BusinessObjectRef' }
        contextRef: { $ref: '#/components/schemas/BusinessObjectRef' }
        lifecycle: { $ref: '#/components/schemas/RecordLifecycle' }
        effectiveInterval: { $ref: '#/components/schemas/EffectiveInterval' }
        revokesAssignmentRef: { $ref: '#/components/schemas/BusinessObjectRef' }
    ResourceExtensionInput:
      type: object
      required: [resourceRef, resourceType, allocatable, schedulable, capacity, effectiveInterval, revision]
      additionalProperties: false
      properties:
        resourceRef: { $ref: '#/components/schemas/BusinessObjectRef' }
        resourceType: { $ref: './enterprise-contract-components.yml#/components/schemas/GovernedTypeId' }
        allocatable: { type: boolean }
        schedulable: { type: boolean }
        capacity: { $ref: '#/components/schemas/JsonObject' }
        effectiveInterval: { $ref: '#/components/schemas/EffectiveInterval' }
        revision: { type: integer, format: int64, minimum: 1 }
    AssetMutationInput:
      type: object
      required: [recordRef, lifecycle, effectiveInterval]
      additionalProperties: false
      properties:
        recordRef: { $ref: '#/components/schemas/BusinessObjectRef' }
        ownerPartyRef: { $ref: '#/components/schemas/BusinessObjectRef' }
        semanticBinding: { $ref: '#/components/schemas/PartySemanticBindingInput' }
        resourceExtension: { $ref: '#/components/schemas/ResourceExtensionInput' }
        lifecycle: { $ref: '#/components/schemas/RecordLifecycle' }
        effectiveInterval: { $ref: '#/components/schemas/EffectiveInterval' }
    CapabilityMutationInput:
      type: object
      required: [recordRef, subjectRef, action, sourceRef, lifecycle, effectiveInterval]
      additionalProperties: false
      properties:
        recordRef: { $ref: '#/components/schemas/BusinessObjectRef' }
        subjectRef: { $ref: '#/components/schemas/BusinessObjectRef' }
        action: { $ref: './enterprise-contract-components.yml#/components/schemas/GovernedTypeId' }
        resourceRef: { $ref: '#/components/schemas/BusinessObjectRef' }
        contextRef: { $ref: '#/components/schemas/BusinessObjectRef' }
        sourceRef: { $ref: '#/components/schemas/BusinessObjectRef' }
        lifecycle: { $ref: '#/components/schemas/RecordLifecycle' }
        effectiveInterval: { $ref: '#/components/schemas/EffectiveInterval' }
        revokesGrantRef: { $ref: '#/components/schemas/BusinessObjectRef' }
        capabilityRef: { $ref: './enterprise-contract-components.yml#/components/schemas/ArtifactRef' }
    OrganizationGraphMutationResult:
      type: object
      required: [recordRef, streamVersion, commandDigest, replayedFromIdempotency]
      properties:
        recordRef: { $ref: '#/components/schemas/BusinessObjectRef' }
        streamVersion: { type: integer, format: int64, minimum: 1 }
        commandDigest: { $ref: '#/components/schemas/ContentHash' }
        replayedFromIdempotency: { type: boolean, default: false }
    OrganizationGraphRecord:
      type: object
      required: [type, value]
      properties:
        type:
          type: string
          enum: [party, identifier, relationship, agreement, assignment, asset, capability]
        value:
          oneOf:
            - { $ref: '#/components/schemas/PartyRecord' }
            - { $ref: '#/components/schemas/PartyIdentifierBinding' }
            - { $ref: '#/components/schemas/PartyRelationshipRecord' }
            - { $ref: '#/components/schemas/AgreementRecord' }
            - { $ref: '#/components/schemas/WorkAssignment' }
            - { $ref: '#/components/schemas/AssetRecord' }
            - { $ref: '#/components/schemas/CapabilityGrant' }
      discriminator: { propertyName: type }
    PartySemanticBinding:
      type: object
      required: [bindingId, partyRef, semanticProfileRef, semanticRelease, effectiveInterval, recordedAt]
      additionalProperties: false
      properties:
        bindingId: { type: string, minLength: 1 }
        partyRef: { $ref: '#/components/schemas/BusinessObjectRef' }
        semanticProfileRef: { $ref: '#/components/schemas/SemanticResourceRef' }
        semanticRelease: { $ref: '#/components/schemas/JointSemanticReleaseRef' }
        effectiveInterval: { $ref: '#/components/schemas/EffectiveInterval' }
        supersedesBindingId: { type: string }
        recordedAt: { type: string, format: date-time }
    PartyRecord:
      type: object
