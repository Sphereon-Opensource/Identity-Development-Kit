      x-command-id: organization.case.read
      summary: Read Case
      description: >-
        Returns the focused case view for a principal the case names as a party, or for a principal the tenant's
        authorization policy permits. A principal that is neither gets 403, and that refusal is
        identical whether or not the case exists in the tenant, so it cannot be used to discover
        which cases a tenant holds. 404 therefore means the opposite of a refusal: the principal
        would have been allowed to read this case, and it is not there.
      parameters:
        - { $ref: '#/components/parameters/ModelId' }
        - { $ref: '#/components/parameters/CaseId' }
        - { $ref: '#/components/parameters/CaseTypeNamespace' }
        - { $ref: '#/components/parameters/CaseType' }
