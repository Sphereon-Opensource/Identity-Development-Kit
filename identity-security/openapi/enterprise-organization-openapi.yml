        modelRef: { $ref: '#/components/schemas/SemanticResourceRef' }
        rdfGraphHash: { $ref: '#/components/schemas/ContentHash' }
        ocaBundleSaid: { type: string, minLength: 1 }
        mappingManifestHash: { $ref: '#/components/schemas/ContentHash' }
        shapesGraphHash: { $ref: '#/components/schemas/ContentHash' }
