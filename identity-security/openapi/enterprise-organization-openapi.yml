      x-command-id: organization.model.initialize
      summary: Initialize a model event stream from a pinned semantic model
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/IfMatch' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InitializeModelRequest' }
      responses:
        '200': { $ref: '#/components/responses/MutationResultResponse' }
        '400': { $ref: './common-components.yml#/components/responses/ValidationError' }
        '401': { $ref: './common-components.yml#/components/responses/Unauthorized' }
        '403': { $ref: './common-components.yml#/components/responses/Forbidden' }
        '409': { $ref: './common-components.yml#/components/responses/Conflict' }
