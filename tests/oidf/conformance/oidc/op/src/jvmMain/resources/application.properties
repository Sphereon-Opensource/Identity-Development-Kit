# OIDF conformance OP harness configuration.
#
# Seeded users (alice, bob) and the conformance test clients (oidf-op-basic with
# client_secret_basic, oidf-op-public with PKCE) are wired entirely from this file.
# Password hashes for the seeded users are computed at startup by OidfOpBootstrap and
# published onto DefaultPrincipalMapPropertySource so the
# ConfigBackedUserAuthenticationProvider finds them at lookup time. Client secrets for
# confidential clients ship inline because OAuth2ClientsConfigBinder reads them directly.
#
# All values here are conformance fixtures, not production secrets.

# ---------------------------------------------------------------------------
# KMS provider: software (in-process), backing keystore at APP scope so the
# bootstrap session's seeded RS256 signing key remains visible from the
# per-request sessions the Ktor plugin spins up on every HTTP call.
# ---------------------------------------------------------------------------
kms.providers.software.type=software
kms.providers.software.id=software
kms.providers.software.enabled=true
kms.providers.software.keystore.type=memory
kms.providers.software.keystore.scope-binding=APP
kms.providers.software.keystore.key-visibility=private
kms.providers.software.keystore.id=oidf-op-keystore

# ---------------------------------------------------------------------------
# OAuth2 AS instance: single "default" server, OIDC enabled, RS256 signing.
#
# `issuer` is intentionally left unset so the AS resolves outbound URLs from the
# `Host` + `X-Forwarded-Proto` headers per request. Operators running behind a
# reverse proxy / ngrok pin the issuer via SPHEREON_OAUTH2_SERVERS_DEFAULT_ISSUER
# (see docs/oidf/2026-04-conformance-deployment.md).
# ---------------------------------------------------------------------------
oauth2.servers.default-server=default
oauth2.servers.default.mode=HOSTED
oauth2.servers.default.oidc=SUPPORTED
oauth2.servers.default.logout=SUPPORTED
oauth2.servers.default.pkce=SUPPORTED
oauth2.servers.default.token-format=JWT
oauth2.servers.default.signing-key-alias=oauth2-server-signing
oauth2.servers.default.id-token-signing-alg-values-supported=RS256
oauth2.servers.default.signing-algorithms-supported=RS256
oauth2.servers.default.subject-types-supported=public
oauth2.servers.default.scopes-supported=openid,profile,email,offline_access
oauth2.servers.default.grant-types-enabled=authorization_code,refresh_token,urn:ietf:params:oauth:grant-type:token-exchange
oauth2.servers.default.response-types-supported=code
oauth2.servers.default.pkce-methods-supported=S256
oauth2.servers.default.token-endpoint-auth-methods-supported=client_secret_basic,client_secret_post,none

# JARM (https://openid.net/specs/oauth-v2-jarm.html). Enabled so OIDF JARM conformance can probe
# discovery for the JARM signing alg list and the `*.jwt` response_modes_supported entries.
oauth2.servers.default.jarm=SUPPORTED
oauth2.servers.default.authorization-signing-alg-values-supported=RS256

# RFC 8693 Token Exchange. Enabled so OIDF Token Exchange conformance can drive
# `grant_type=urn:ietf:params:oauth:grant-type:token-exchange` against /token.
oauth2.servers.default.token-exchange=SUPPORTED

# ---------------------------------------------------------------------------
# Login UI: branded renderer (DI-bound) + cookie-backed session.
# ---------------------------------------------------------------------------
oauth2.session.idle-ttl-seconds=300
oauth2.session.absolute-ttl-seconds=3600

# ---------------------------------------------------------------------------
# User authentication: config-backed provider (Group H).
# Pepper is base64 of "oidf-op-conformance-pepper-2026".
# Password hashes for accounts.alice / accounts.bob are inserted at startup by
# OidfOpBootstrap (PBKDF2-HMAC-SHA256, 210,000 iterations) so this file does not
# carry brittle precomputed literals.
# ---------------------------------------------------------------------------
oauth2.user-provider.mode=local-config
oauth2.users.password.salt=b2lkZi1vcC1jb25mb3JtYW5jZS1wZXBwZXItMjAyNg==
oauth2.users.password.iterations=210000

oauth2.users.accounts.alice.sub=urn:sphereon:oidf:op:alice
oauth2.users.accounts.alice.email=alice@oidf.example
oauth2.users.accounts.alice.email-verified=true
oauth2.users.accounts.alice.claims.given_name=Alice
oauth2.users.accounts.alice.claims.family_name=Sphereon
oauth2.users.accounts.alice.claims.name=Alice Sphereon

oauth2.users.accounts.bob.sub=urn:sphereon:oidf:op:bob
oauth2.users.accounts.bob.email=bob@oidf.example
oauth2.users.accounts.bob.email-verified=true
oauth2.users.accounts.bob.claims.given_name=Bob
oauth2.users.accounts.bob.claims.family_name=Sphereon
oauth2.users.accounts.bob.claims.name=Bob Sphereon

# ---------------------------------------------------------------------------
# Conformance clients.
# Redirect URIs match the OIDF basic-OP suite default callback shape:
#   https://www.certification.openid.net/test/a/<client-id>/callback
# Operators running the suite under a different test_id can override
# OAUTH2_CLIENTS_OIDF_OP_BASIC_REDIRECT_URIS_0 / OAUTH2_CLIENTS_OIDF_OP_PUBLIC_REDIRECT_URIS_0
# at the environment.
# ---------------------------------------------------------------------------
oauth2.clients.oidf-op-basic.client-id=oidf-op-basic
oauth2.clients.oidf-op-basic.client-secret=oidf-op-basic-secret-2026
oauth2.clients.oidf-op-basic.client-name=OIDF Conformance Basic OP Client
oauth2.clients.oidf-op-basic.client-type=CONFIDENTIAL
oauth2.clients.oidf-op-basic.grant-types=authorization_code,refresh_token,urn:ietf:params:oauth:grant-type:token-exchange
oauth2.clients.oidf-op-basic.response-types=code
oauth2.clients.oidf-op-basic.token-endpoint-auth-method=client_secret_basic
oauth2.clients.oidf-op-basic.allowed-scopes=openid,profile,email,offline_access
oauth2.clients.oidf-op-basic.redirect-uris.0=https://www.certification.openid.net/test/a/oidf-op-basic/callback
oauth2.clients.oidf-op-basic.redirect-uris.1=http://localhost:8080/test-callback
oauth2.clients.oidf-op-basic.require-pkce=true
oauth2.clients.oidf-op-basic.post-logout-redirect-uris.0=https://www.certification.openid.net/test/a/oidf-op-basic/post_logout_redirect
oauth2.clients.oidf-op-basic.post-logout-redirect-uris.1=http://localhost:8080/post-logout
oauth2.clients.oidf-op-basic.frontchannel-logout-uri=https://www.certification.openid.net/test/a/oidf-op-basic/frontchannel_logout
oauth2.clients.oidf-op-basic.frontchannel-logout-session-required=true
oauth2.clients.oidf-op-basic.backchannel-logout-uri=https://www.certification.openid.net/test/a/oidf-op-basic/backchannel_logout
oauth2.clients.oidf-op-basic.backchannel-logout-session-required=true
# Per-client JARM signing alg per OIDF JARM spec. Used by OidfOpJarmTest.
oauth2.clients.oidf-op-basic.authorization-signed-response-alg=RS256

oauth2.clients.oidf-op-public.client-id=oidf-op-public
oauth2.clients.oidf-op-public.client-name=OIDF Conformance Public OP Client
oauth2.clients.oidf-op-public.client-type=PUBLIC
oauth2.clients.oidf-op-public.grant-types=authorization_code,refresh_token
oauth2.clients.oidf-op-public.response-types=code
oauth2.clients.oidf-op-public.token-endpoint-auth-method=none
oauth2.clients.oidf-op-public.allowed-scopes=openid,profile,email,offline_access
oauth2.clients.oidf-op-public.redirect-uris.0=https://www.certification.openid.net/test/a/oidf-op-public/callback
oauth2.clients.oidf-op-public.redirect-uris.1=http://localhost:8080/test-callback
oauth2.clients.oidf-op-public.require-pkce=true
